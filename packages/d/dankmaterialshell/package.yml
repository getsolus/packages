# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dankmaterialshell
version    : 1.6.0
release    : 6
source     :
    - https://github.com/AvengeMedia/DankMaterialShell/releases/download/v1.6.0/dms-source.tar.gz : 6caf334071985e483a9baff90f02739e9b8f4f5ac20f61f37fafa17bf81c0f26
homepage   : https://danklinux.com/
license    : MIT
component  : desktop
summary    : Desktop shell for Wayland compositors built with Quickshell and Go
description: |
    DankMaterialShell is a complete desktop shell for niri, Hyprland, MangoWC, Sway, labwc, Scroll, Miracle WM, and other Wayland compositors. It replaces waybar, swaylock, swayidle, mako, fuzzel, polkit, and everything else you'd normally stitch together to make a desktop.
networking : true
builddeps  :
    - golang
rundeps    :
    - cava
    - dgop
    - dsearch
    - matugen
    - qt6-multimedia
    - quickshell
    - wl-clipboard
setup      : |
    pushd core
    go mod vendor

    %make sync-shell
build      : |
    pushd core

    go build -o bin/dms \
        -tags distro_binary \
        -tags withshell \
        -ldflags "-X main.Version=v${version}" \
        ./cmd/dms
    popd

    # Completions
    mkdir completions
    dms="${workdir}/core/bin/dms"

    "${dms}" completion bash > completions/dms
    "${dms}" completion fish > completions/dms.fish
    "${dms}" completion zsh > completions/_dms
install    : |
    %install_bin core/bin/dms
    %install_license LICENSE

    # Completions
    %install_file -t ${installdir}/usr/share/bash-completion/completions completions/dms
    %install_file -t ${installdir}/usr/share/fish/vendor_completions.d completions/dms.fish
    %install_file -t ${installdir}/usr/share/zsh/site-functions completions/_dms

    # Systemd service
    %install_file -t ${installdir}/usr/lib/systemd/user assets/systemd/dms.service

    # Desktop files
    %install_file -t ${installdir}/usr/share/applications assets/com.danklinux.dms.desktop
    %install_file -t ${installdir}/usr/share/applications assets/com.danklinux.dms.notepad.desktop
    %install_file -t ${installdir}/usr/share/applications assets/dms-open.desktop

    # Icon
    %install_file -t ${installdir}/usr/share/icons/hicolor/scalable/apps assets/danklogo.svg
