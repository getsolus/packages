# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : difftastic
version    : 0.70.0
release    : 3
source     :
    - https://github.com/Wilfred/difftastic/archive/refs/tags/0.70.0.tar.gz : 4f89fdce7f58eb0521c14c14a7f76144dab5aa01400b332dd8710b550d32dc4c
homepage   : https://difftastic.wilfred.me.uk/
license    : MIT
component  : system.utils
summary    : A structural diff that understands syntax.
description: |
    Difftastic is a CLI diff tool that compares files based on their syntax, not line-by-line. Difftastic produces accurate diffs that are easier for humans to read.
networking : true
builddeps  :
    - rust
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install difft
    %install_license LICENSE
    %install_file difft.1 ${installdir}/usr/share/man/man1/difft.1
check      : |
    %cargo_test
