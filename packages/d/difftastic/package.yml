# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : difftastic
version    : 0.72.0
release    : 4
source     :
    - https://github.com/Wilfred/difftastic/archive/refs/tags/0.72.0.tar.gz : ed8e2d59d44d62289b17c9d241e469bd72565fadf13c260676fc7a23bc28a844
homepage   : https://difftastic.wilfred.me.uk/
license    : MIT
component  : system.utils
summary    : A structural diff that understands syntax.
description: |
    Difftastic is a CLI diff tool that compares files based on their syntax, not line-by-line. Difftastic produces accurate diffs that are easier for humans to read.
networking : true
builddeps  :
    - rust
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install difft
    %install_license LICENSE
    %install_file difft.1 ${installdir}/usr/share/man/man1/difft.1
check      : |
    %cargo_test
