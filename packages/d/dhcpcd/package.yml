# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dhcpcd
version    : 10.5.2
release    : 16
source     :
    - https://github.com/NetworkConfiguration/dhcpcd/releases/download/v10.5.2/dhcpcd-10.5.2.tar.xz : 3e476657fdb6eeb38b277da3a48d0ac0113ecce5858ebdcddff2b629faed52b4
homepage   : https://roy.marples.name/projects/dhcpcd
license    : BSD-2-Clause
component  : network.base
summary    : dhcpcd - a DHCP client
description: |
    dhcpcd, a DHCP and DHCPv6 client. It's also an IPv4LL (aka ZeroConf) client. In layman's terms, dhcpcd runs on your machine and silently configures your computer to work on the attached networks without trouble and mostly without configuration.
builddeps  :
    - pkgconfig(openssl)
    - pkgconfig(systemd)
setup      : |
    %patch -p1 -i ${pkgfiles}/stateless.patch

    printf "# Do not attempt to obtain an IPv4LL address if we failed to get one via DHCP. See RFC 3927.\nnoipv4ll\n" >> src/${package}.conf

    %configure \
        --dbdir=/var/lib/${package} \
        --privsepuser=${package} \
        --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license LICENSE

    %install_file -t ${installdir}/%libdir%/systemd/system ${pkgfiles}/${package}.service
    %install_file ${pkgfiles}/${package}_.service ${installdir}/%libdir%/systemd/system/${package}@.service

    %install_file ${pkgfiles}/${package}.sysusers ${installdir}/%libdir%/sysusers.d/${package}.conf
    %install_file ${pkgfiles}/${package}.tmpfiles ${installdir}/%libdir%/tmpfiles.d/${package}.conf

    rm -frv ${installdir}/var

    # Move /etc path to stateless location. Do NOT change sysconfdir in configure or both will point to stateless path
    %install_dir ${installdir}/usr/share/defaults/
    mv ${installdir}/etc ${installdir}/usr/share/defaults/dhcpcd
check      : |
    %make test
