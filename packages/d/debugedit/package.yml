# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : debugedit
version    : '5.3'
release    : 2
source     :
    - https://sourceware.org/ftp/debugedit/5.3/debugedit-5.3.tar.xz : 3b8c6396fe235e0270c9b9c0d244cfd0e86c284fc27e820acc58360e7cfa08c2
homepage   : https://sourceware.org/debugedit
license    : LGPL-2.1-or-later
component  : programming.tools
summary    : Tool to mangle source locations in .debug files
description: |
    Tool to mangle source locations in .debug files
builddeps  :
    - pkgconfig(libdw)
    - pkgconfig(libxxhash)
    - elfutils-devel
    - gdb
    - help2man
setup      : |
    %patch -p1 -i $pkgfiles/remove-dwz.patch
    %reconfigure
build      : |
    %make
install    : |
    %install_license COPYING
    %make_install
check      : |
    #Test fails because of missing dwz
    #%make check
