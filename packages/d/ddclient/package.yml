# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ddclient
version    : 4.0.0
release    : 9
source     :
    - https://github.com/ddclient/ddclient/archive/v4.0.0.tar.gz : 4b37c99ac0011102d7db62f1ece7ff899b06df3d4b172e312703931a3c593c93
homepage   : https://ddclient.net/
license    : GPL-2.0-or-later
component  : network.util
summary    : ddclient is a Perl client used to update dynamic DNS entries for accounts on many dynamic DNS services
description: |
    ddclient is a Perl client used to update dynamic DNS entries for accounts on many dynamic DNS services.
rundeps    :
    - perl-data-validate-ip
    - perl-io-socket-ssl
    - perl-netaddr-ip
setup      : |
    ./autogen %CONFOPTS%
    %configure
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
    %install_file sample-etc_systemd.service $installdir/usr/lib64/systemd/system/ddclient.service
    %tmpfiles 'd /var/cache/ddclient 0755 - - -' 
    rm -r $installdir/var
