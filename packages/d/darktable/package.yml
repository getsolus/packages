# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : darktable
version    : 5.6.1
release    : 99
source     :
    - https://github.com/darktable-org/darktable/releases/download/release-5.6.1/darktable-5.6.1.tar.xz : e8b84ac98b0b689a244e4036c4b56394c1d58ce2d9abc05e0a060ef9f756dc36
homepage   : https://darktable.org/
license    : GPL-3.0-or-later
component  : multimedia.graphics
summary    : darktable is an open source photography workflow application and RAW developer
description: |
    darktable is an open source photography workflow application and RAW developer. A virtual lighttable and darkroom for photographers. It manages your digital negatives in a database, lets you view them through a zoomable lighttable and enables you to develop raw images and enhance them.
builddeps  :
    - pkgconfig(GraphicsMagick)
    - pkgconfig(OpenEXR)
    - pkgconfig(colord-gtk)
    - pkgconfig(cups)
    - pkgconfig(exiv2)
    - pkgconfig(glu)
    - pkgconfig(gnome-keyring-1)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(lcms2)
    - pkgconfig(lensfun)
    - pkgconfig(libavif)
    - pkgconfig(libgphoto2)
    - pkgconfig(libheif)
    - pkgconfig(libjxl)
    - pkgconfig(libopenjp2)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libsecret-1)
    - pkgconfig(libssh)
    - pkgconfig(libtiff-4)
    - pkgconfig(libturbojpeg)
    - pkgconfig(libwebp)
    - pkgconfig(lua-5.4)
    - pkgconfig(osmgpsmap-1.0)
    - pkgconfig(portmidi)
    - pkgconfig(pugixml)
    - pkgconfig(sdl2)
    - gmic-devel
    - potrace-devel
rundeps    :
    - gtk-engines
setup      : |
    %cmake_ninja -DBINARY_PACKAGE_BUILD=1
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE
