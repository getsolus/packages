# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : delta
version    : 0.22.0
release    : 7
source     :
    - https://github.com/dandavison/delta/archive/refs/tags/0.22.0.tar.gz : 71fb0ba85058a8f206f11ea227d2f940f6051c9c81dcb238935e10b0dc82c09c
homepage   : https://dandavison.github.io/delta/
license    : MIT
component  : programming.tools
summary    : A syntax-highlighting pager for git, diff, and grep output
description: |
    A syntax-highlighting pager for git, diff, and grep output
networking : true
builddeps  :
    - pkgconfig(libgit2)
    - pkgconfig(oniguruma)
    - rust
checkdeps  :
    - git
environment: |
    # Devendor (has trouble with LTO anyway)
    export RUSTONIG_DYNAMIC_LIBONIG=1

    # Avoid fallback to vendoring if our version isn't accepted
    export LIBGIT2_NO_VENDOR=1
setup      : |
    %cargo_fetch
build      : |
    export RUSTONIG_DYNAMIC_LIBONIG=1
    %cargo_build --all-features

    for shell in bash fish zsh; do
        target/release/delta --generate-completion="${shell}" > "${shell}-completion"
    done
install    : |
    %cargo_install
    %install_license LICENSE

    # Completions
    %install_file bash-completion ${installdir}/usr/share/bash-completion/completions/delta
    %install_file fish-completion ${installdir}/usr/share/fish/vendor_completions.d/delta.fish
    %install_file zsh-completion ${installdir}/usr/share/zsh/site-functions/_delta

    # Themes
    %install_file -t ${installdir}/usr/share/${package} themes.gitconfig
check      : |
    %cargo_test --all-features
