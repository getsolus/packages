# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : discount
version    : 3.0.2.0
release    : 7
source     :
    - https://www.pell.portland.or.us/~orc/Code/discount/discount-3.0.2.0.tar.bz2 : 
        4747d9e745c2bb6fc0f2cf24ebf27d8f5cc61d08c01fafa54db419b604f1b674
license    : BSD-3-Clause
component  : programming
homepage   : https://www.pell.portland.or.us/~orc/Code/discount/
summary    : DISCOUNT is a implementation of John Gruber's Markdown markup language.
description: |
    DISCOUNT is a implementation of John Gruber's Markdown markup language.
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    ./configure.sh --prefix=/usr --libdir=%libdir% --shared
build      : |
    # fix ldconfig call
    sed -e 's|/sbin/ldconfig|/sbin/ldconfig -n|' -i librarian.sh

    %make
install    : |
    %make_install
    %install_license COPYRIGHT
check      : |
    %make test
