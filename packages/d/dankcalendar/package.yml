# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dankcalendar
version    : 1.6.1
release    : 9
source     :
    - https://github.com/AvengeMedia/dankcalendar/releases/download/v1.6.1/dankcalendar-1.6.1.tar.gz : 4fb321efe73091305116aff0044ebf72f63a3d9204907c9e05ce2974f7f6989a
homepage   : https://danklinux.com
license    : MIT
component  : desktop
summary    : Calendar from the Dank Linux Suite
description: |
    DankCalendar is a standalone calendar app that brings your Local, Google, Microsoft, CalDAV, and iCloud calendars together in one place. It runs as a lightweight daemon with a tray icon, keeps your accounts in sync, and reminds you about events — all with the look and feel of DankMaterialShell.
networking : true
builddeps  :
    - golang
rundeps    :
    - quickshell
setup      : |
    pushd core
    go mod vendor

    %make sync-shell
build      : |
    pushd core

    go build \
        -o bin/dcal \
        -tags distro_binary \
        -tags withshell \
        -ldflags="-s -w -X main.Version=${version}" \
        ./cmd/dcal/*.go

    mkdir ../completions
    bin/dcal completion bash > ../completions/dcal
    bin/dcal completion zsh > ../completions/_dcal
    bin/dcal completion fish > ../completions/dcal.fish
install    : |
    %make_install install-systemd \
        PREFIX=%PREFIX% \
        SYSTEMD_USER_DIR=${installdir}/usr/lib/systemd/user
    %install_license LICENSE

    # Fix the systemd service
    sed -i "s|${installdir}||g" ${installdir}/usr/lib/systemd/user/dcal.service

    # Install completions
    %install_file -t ${installdir}/usr/share/bash-completion/completions completions/dcal
    %install_file -t ${installdir}/usr/share/fish/vendor_completions.d completions/dcal.fish
    %install_file -t ${installdir}/usr/share/zsh/site-functions completions/_dcal
