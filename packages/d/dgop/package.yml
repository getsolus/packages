# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dgop
version    : 1.6.2
release    : 4
source     :
    - https://github.com/AvengeMedia/dgop/releases/download/v1.6.2/dgop-1.6.2.tar.gz : 45571e79799dc4d583e04cc2ff1051c2ccba501daeed378dec29b3ddda4e42a2
homepage   : https://github.com/AvengeMedia/dgop
license    : MIT
component  : desktop
summary    : API & CLI for System & Process Monitoring
description: |
    System monitoring tool with CLI and REST API built in Go. Fast, single binary, JSON output, OpenAPI spec.
networking : true
builddeps  :
    - golang
setup      : |
    go mod vendor
build      : |
    go build \
        -ldflags="-s -w -X main.Version=${version}" \
        -o bin/dgop cmd/dgop/*.go
install    : |
    %install_bin bin/dgop
    %install_license LICENSE
