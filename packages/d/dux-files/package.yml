# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dux-files
version    : 2.0.0
release    : 1
source     :
    - https://github.com/duxlabs-dev/dux-files/releases/download/v2.0.0/dfiles-2.0.0.tar.gz : 5883246328482b37928c16a795d9f4a97f2fd71ed2f8772210284dede6a49739
homepage   : https://duxlabs.dev
license    : MIT
component  : desktop
summary    : File manager from Dux Labs
description: |
    Dux Files is a standalone file manager for Wayland. A small Go daemon does the file work and a Quickshell UI sits on top of it. It looks and feels like the rest of the dux desktop and picks up Dux Shell's colors when DMS is running, but it works fine on its own.
networking : true
builddeps  :
    - golang
rundeps    :
    - bubblewrap
    - ffmpegthumbnailer
    - gvfs
    - poppler-utils
    - quickshell
    - udisks
environment: |
    export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
setup      : |
    pushd core
    go mod vendor

    %make sync-shell
build      : |
    pushd core

    go build \
        -o bin/dfiles \
        -tags distro_binary \
        -tags withshell \
        -ldflags="-s -w -X main.Version=${version}" \
        ./cmd/dfiles/*.go

    mkdir ../completions
    bin/dfiles completion bash > ../completions/dfiles
    bin/dfiles completion zsh > ../completions/_dfiles
    bin/dfiles completion fish > ../completions/dfiles.fish
install    : |
    %install_bin core/bin/dfiles
    %install_license LICENSE

    %install_file -t ${installdir}/usr/share/applications assets/dev.duxlabs.files.desktop
    %install_file -t ${installdir}/usr/share/metainfo assets/dev.duxlabs.files.metainfo.xml
    %install_file -t ${installdir}/usr/share/icons/hicolor/scalable/apps assets/dev.duxlabs.files.svg

    # Install completions
    %install_file -t ${installdir}/usr/share/bash-completion/completions completions/dfiles
    %install_file -t ${installdir}/usr/share/fish/vendor_completions.d completions/dfiles.fish
    %install_file -t ${installdir}/usr/share/zsh/site-functions completions/_dfiles

    # Install polkit policy
    %install_file -t ${installdir}/usr/share/polkit-1/actions assets/dev.duxlabs.files.policy

    # Install systemd unit
    %install_file -t ${installdir}/%libdir%/systemd/user assets/systemd/dfiles.service

    # Install portal file
    %install_file -t ${installdir}/usr/share/xdg-desktop-portal/portals assets/portal/dfiles.portal

    # Install DBus services
    %install_file -t ${installdir}/usr/share/dbus-1/services assets/dbus/dev.duxlabs.files.FileManager1.service
    %install_file -t ${installdir}/usr/share/dbus-1/services assets/dbus/org.freedesktop.impl.portal.desktop.dfiles.service
