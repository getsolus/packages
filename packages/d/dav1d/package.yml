# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dav1d
version    : 1.5.5
release    : 33
source     :
    - https://code.videolan.org/videolan/dav1d/-/archive/1.5.5/dav1d-1.5.5.tar.bz2 : afc5378daba30eafd11d7b4f0ec863270d7b175f38393a2e1e0ff76f3a45c8b9
    - https://code.videolan.org/videolan/dav1d-test-data/-/archive/1.5.5/dav1d-test-data-1.5.5.tar.gz#dav1d-test-data.tar.gz : 4c669b60f8f5e4ea4a7808787a1ee3a2de9cc01a6a4c1101d7d2a698a66c06ff
homepage   : https://code.videolan.org/videolan/dav1d
license    : BSD-2-Clause
component  : multimedia.codecs
summary    : AV1 decoder targeted to be small and fast
description: |
    dav1d is a new AV1 cross-platform Decoder, open-source, and focused on speed and correctness.
avx2       : true
builddeps  :
    - pkgconfig(libxxhash)
setup      : |
    mkdir tests/dav1d-test-data
    tar -xf $sources/dav1d-test-data.tar.gz --strip-components=1  -C tests/dav1d-test-data
    %meson_configure \
                     --buildtype=release \
                     -Dtestdata_tests=true
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
check      : |
    %ninja_check
