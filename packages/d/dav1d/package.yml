# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dav1d
version    : 1.5.4
release    : 32
source     :
    - https://code.videolan.org/videolan/dav1d/-/archive/1.5.4/dav1d-1.5.4.tar.bz2 : 2abfb0c89212e6e4733a54e0ae509ec00a5b845a6360946f918806e14aedb011
    - https://code.videolan.org/videolan/dav1d-test-data/-/archive/1.5.4/dav1d-test-data-1.5.4.tar.gz#dav1d-test-data.tar.gz : b19926f25347a32633ffb40f6189eb750b50f1b8b02b2eb63954845a744de343
homepage   : https://code.videolan.org/videolan/dav1d
license    : BSD-2-Clause
component  : multimedia.codecs
summary    : AV1 decoder targeted to be small and fast
description: |
    dav1d is a new AV1 cross-platform Decoder, open-source, and focused on speed and correctness.
avx2       : true
builddeps  :
    - pkgconfig(libxxhash)
setup      : |
    mkdir tests/dav1d-test-data
    tar -xf $sources/dav1d-test-data.tar.gz --strip-components=1  -C tests/dav1d-test-data
    %meson_configure \
                     --buildtype=release \
                     -Dtestdata_tests=true
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
check      : |
    %ninja_check
