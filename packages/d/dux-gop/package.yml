# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dux-gop
version    : 2.1.0
release    : 6
source     :
    - https://github.com/duxlabs-dev/dux-gop/releases/download/v2.1.0/dgop-2.1.0.tar.gz : 
        d6b5531fb11b8a805d0aed2cd6155823df5d0243b674c7e8fd359477d2951f70
homepage   : https://duxlabs.dev/
license    : MIT
component  : desktop
summary    : API & CLI for System & Process Monitoring
description: |
    System monitoring tool with CLI and REST API built in Go. Fast, single binary, JSON output, OpenAPI spec.
networking : true
builddeps  :
    - golang
environment: |
    export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
setup      : |
    go mod vendor
build      : |
    go build \
        -ldflags="-s -w -X main.Version=${version}" \
        -o bin/dgop \
        cmd/dgop/*.go
install    : |
    %install_bin bin/dgop
    %install_license LICENSE
replaces   :
    - dgop
    - dbginfo : dgop-dbginfo
