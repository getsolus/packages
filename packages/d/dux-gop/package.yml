# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dux-gop
version    : 2.0.0
release    : 5
source     :
    - https://github.com/duxlabs-dev/dux-gop/releases/download/v2.0.0/dgop-2.0.0.tar.gz : 
        532cb956a336245c62aadc81cde52c8bfeed8fd479aea850ae4ddbef73397b40
homepage   : https://duxlabs.dev/
license    : MIT
component  : desktop
summary    : API & CLI for System & Process Monitoring
description: |
    System monitoring tool with CLI and REST API built in Go. Fast, single binary, JSON output, OpenAPI spec.
networking : true
builddeps  :
    - golang
environment: |
    export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
setup      : |
    go mod vendor
build      : |
    go build \
        -ldflags="-s -w -X main.Version=${version}" \
        -o bin/dgop \
        cmd/dgop/*.go
install    : |
    %install_bin bin/dgop
    %install_license LICENSE
replaces   :
    - dgop
    - dbginfo : dgop-dbginfo
