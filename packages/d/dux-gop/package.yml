# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dux-gop
version    : 2.1.1
release    : 7
source     :
    - https://github.com/duxlabs-dev/dux-gop/releases/download/v2.1.1/dgop-2.1.1.tar.gz : 
        449be858b25e293a724d168a2bae5eef6aec81fbbf3a0773363ad4cb578936ea
homepage   : https://duxlabs.dev/
license    : MIT
component  : desktop
summary    : API & CLI for System & Process Monitoring
description: |
    System monitoring tool with CLI and REST API built in Go. Fast, single binary, JSON output, OpenAPI spec.
networking : true
builddeps  :
    - golang
environment: |
    export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
setup      : |
    go mod vendor
build      : |
    go build \
        -ldflags="-s -w -X main.Version=${version}" \
        -o bin/dgop \
        cmd/dgop/*.go
install    : |
    %install_bin bin/dgop
    %install_license LICENSE
replaces   :
    - dgop
    - dbginfo : dgop-dbginfo
