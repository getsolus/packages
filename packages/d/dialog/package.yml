# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dialog
version    : '1.3_20260721'
release    : 7
source     :
    - https://invisible-island.net/archives/dialog/dialog-1.3-20260721.tgz : 62bdf59057d4f760a1cc2217827f07887b4a3eebf694c25eacd4803d2171cdc6
homepage   : https://invisible-island.net/dialog/dialog.html
license    : LGPL-2.1-or-later
component  : programming.library
summary    : Script-driven curses widgets
description: |
    Dialog is a script interface for command-line GUI creation.
builddeps  :
    - pkgconfig(ncursesw)
patterns   :
    - devel : /usr/bin/dialog-config
setup      : |
    %configure_no_runstatedir \
               --enable-nls \
               --with-ncursesw \
               --disable-static \
               --with-libtool \
               --enable-shared
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
