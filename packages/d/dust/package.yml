# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dust
version    : 1.2.7
release    : 6
source     :
    - https://github.com/bootandy/dust/archive/refs/tags/v1.2.7.tar.gz : 923a2eed637d2ea5f4ad5f820b6f87cc6e0081cfa4bc5ed1fe09278dd74db963
homepage   : https://github.com/bootandy/dust
license    : Apache-2.0
component  : system.utils
summary    : A more intuitive version of du in rust
description: |
    A more intuitive version of du in rust
networking : true
builddeps  :
    - rust
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install
    %install_license LICENSE
    %install_file man-page/dust.1 ${installdir}/usr/share/man/man1/dust.1
    %install_file completions/dust.bash ${installdir}/usr/share/bash-completion/completions/dust
    %install_file completions/_dust ${installdir}/usr/share/zsh/site-functions/_dust
    %install_file completions/dust.fish ${installdir}/usr/share/fish/vendor_completions.d/dust.fish
