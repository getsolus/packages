# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dux-search
version    : 2.0.0
release    : 4
source     :
    - https://github.com/duxlabs-dev/dux-search/releases/download/v2.0.0/dsearch-2.0.0.tar.gz : 4a1740ef16412619ba4457868db947058a3bacb8c39480bbcceed741b67921cb
homepage   : https://duxlabs.dev/
license    : MIT
component  : desktop
summary    : Indexed filesystem search in Go
description: |
    A configurable filesystem search service powered by bleve for Unix-based operating systems.
networking : true
builddeps  :
    - golang
environment: |
    export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
setup      : |
    # Fix systemd service
    sed -i 's|/usr/local|/usr|' assets/dsearch.service

    go mod vendor
build      : |
    go build \
        -o bin/dsearch \
        -ldflags="-s -w -X main.Version=${version}" \
        cmd/dsearch/*.go
install    : |
    %install_bin bin/dsearch
    %install_license LICENSE

    %install_file assets/dsearch.service -t ${installdir}/%libdir%/systemd/user/
replaces   :
    - dsearch
    - dbginfo : dsearch-dbginfo
