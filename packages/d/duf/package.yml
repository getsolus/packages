# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : duf
version    : 0.9.1
release    : 5
source     :
    - git|https://github.com/muesli/duf.git : v0.9.1
license    : MIT
homepage   : https://github.com/muesli/duf
component  : system.utils
summary    : duf Disk Usage/Free Utility is a better df alternative.
description: |
    duf is an alternative to df with colourful output, category separation and can optionally output as JSON.
networking : true
builddeps  :
    - git
    - golang
build      : |
    go build \
            -trimpath \
            -buildmode=pie \
            -mod=readonly \
            -modcacherw \
            -ldflags "-linkmode external -X main.Version=$version -extldflags \"$LDFLAGS\"" \
install    : |
    %install_bin duf
    %install_file duf.1 ${installdir}/usr/share/man/man1/duf.1
    %install_license LICENSE
