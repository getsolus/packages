# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : devedeng
version    : 4.22.1
release    : 19
source     :
    - https://gitlab.com/rastersoft/devedeng/-/archive/4.22.1/devedeng-4.22.1.tar.bz2 : 228b7eab9c6934e36e5e9e7b407cd6809e8f4ce398cba571cb86704aade3b617
homepage   : https://www.rastersoft.com/programas/devede.html
license    : GPL-3.0-or-later
component  : multimedia.video
summary    : A program to create VideoDVDs and CDs
description: |
    Devede NG is a rewrite of the Devede DVD disc authoring program. This new code has been written from scratch, and uses Python3 and Gtk3. It is also cleaner, which will allow to add new features in the future.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-setuptools-gettext
rundeps    :
    - cdrtools
    - dvdauthor
    - libgtk-3
    - python-gobject
    - python-setuptools
    - python-urllib3
    - vcdimager
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_file src/devedeng/data/com.rastersoft.devedeng.appdata.xml -t $installdir/usr/share/metainfo
