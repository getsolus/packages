# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dux-calendar
version    : 2.1.0
release    : 11
source     :
    - https://github.com/duxlabs-dev/dux-calendar/releases/download/v2.1.0/dankcalendar-2.1.0.tar.gz : 19ae16de92a5b2def7f1ad9bc35d01bb3ad5b3ab933b840eee9b50b3f797573e
homepage   : https://duxlabs.dev
license    : MIT
component  : desktop
summary    : Calendar from the Dux Labs
description: |
    Dux Calendar is a standalone calendar app that brings your Local, Google, Microsoft, CalDAV, and iCloud calendars together in one place. It runs as a lightweight daemon with a tray icon, keeps your accounts in sync, and reminds you about events — all with the look and feel of Dux Shell.
networking : true
builddeps  :
    - golang
rundeps    :
    - quickshell
environment: |
    export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
setup      : |
    pushd core
    go mod vendor

    %make sync-shell
build      : |
    pushd core

    go build \
        -o bin/dcal \
        -tags distro_binary \
        -tags withshell \
        -ldflags="-s -w -X main.Version=${version}" \
        ./cmd/dcal/*.go

    mkdir ../completions
    bin/dcal completion bash > ../completions/dcal
    bin/dcal completion zsh > ../completions/_dcal
    bin/dcal completion fish > ../completions/dcal.fish
install    : |
    %make_install install-systemd \
        PREFIX=%PREFIX% \
        SYSTEMD_USER_DIR=${installdir}/usr/lib/systemd/user
    %install_license LICENSE

    # Fix the systemd service
    sed -i "s|${installdir}||g" ${installdir}/usr/lib/systemd/user/dcal.service

    # Install completions
    %install_file -t ${installdir}/usr/share/bash-completion/completions completions/dcal
    %install_file -t ${installdir}/usr/share/fish/vendor_completions.d completions/dcal.fish
    %install_file -t ${installdir}/usr/share/zsh/site-functions completions/_dcal
replaces   :
    - dankcalendar
    - dbginfo : dankcalendar-dbginfo
