# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : doctl
version    : 1.175.0
release    : 44
source     :
    - https://github.com/digitalocean/doctl/archive/refs/tags/v1.175.0.tar.gz : aa45675090255320d1b74541e1958bf677fb8525fce0706560a0e1ac53b3e092
homepage   : https://github.com/digitalocean/doctl/
license    : Apache-2.0
component  : network.clients
summary    : The official command line interface for the DigitalOcean API.
description: |
    The official command line interface for the DigitalOcean API.
builddeps  :
    - golang
networking : true
build      : |
    go build \
        -trimpath \
        -buildmode=pie \
        -mod=readonly \
        -ldflags "-linkmode external -extldflags \"${LDFLAGS}\"
        -X github.com/digitalocean/doctl.Major=$(echo $version | cut -d. -f1)
        -X github.com/digitalocean/doctl.Minor=$(echo $version | cut -d. -f2)
        -X github.com/digitalocean/doctl.Patch=$(echo $version | cut -d. -f3)
        -X github.com/digitalocean/doctl.Label=release
        " \
        ./cmd/...
    mkdir completions
    ./doctl completion bash > completions/doctl
    ./doctl completion fish > completions/doctl.fish
    ./doctl completion zsh > completions/_doctl
install    : |
    %install_bin doctl
    %install_file completions/doctl ${installdir}/usr/share/bash-completion/completions/doctl
    %install_file completions/doctl.fish ${installdir}/usr/share/fish/vendor_completions.d/doctl.fish
    %install_file completions/_doctl ${installdir}/usr/share/zsh/site-functions/_doctl
    %install_license LICENSE.txt
