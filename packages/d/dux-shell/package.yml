# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dux-shell
version    : 2.0.0
release    : 12
source     :
    - https://github.com/duxlabs-dev/dux-shell/releases/download/v2.0.0/dms-source.tar.gz : 5e498216d3ad0b0d487848957ca6aec53862d1ba21582dbd4ef15483c88fd041
homepage   : https://duxlabs.dev
license    : MIT
component  : desktop
summary    : Desktop shell for Wayland compositors built with Quickshell and Go
description: |
    Dux Shell is a complete desktop shell for niri, Hyprland, MangoWC, Sway, labwc, Scroll, Miracle WM, and other Wayland compositors. It replaces waybar, swaylock, swayidle, mako, fuzzel, polkit, and everything else you'd normally stitch together to make a desktop.
networking : true
builddeps  :
    - golang
rundeps    :
    - cava
    - dux-gop
    - dux-search
    - matugen
    - qt6-multimedia
    - quickshell
    - wl-clipboard
environment: |
    export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
setup      : |
    pushd core
    go mod vendor

    %make sync-shell
build      : |
    pushd core

    go build -o bin/dms \
        -tags distro_binary \
        -tags withshell \
        -ldflags "-X main.Version=v${version}" \
        ./cmd/dms
    popd

    # Completions
    mkdir completions
    dms="${workdir}/core/bin/dms"

    "${dms}" completion bash > completions/dms
    "${dms}" completion fish > completions/dms.fish
    "${dms}" completion zsh > completions/_dms
install    : |
    %install_bin core/bin/dms
    %install_license LICENSE

    # Completions
    %install_file -t ${installdir}/usr/share/bash-completion/completions completions/dms
    %install_file -t ${installdir}/usr/share/fish/vendor_completions.d completions/dms.fish
    %install_file -t ${installdir}/usr/share/zsh/site-functions completions/_dms

    # Systemd service
    %install_file -t ${installdir}/usr/lib/systemd/user assets/systemd/dms.service

    # Desktop files
    %install_file -t ${installdir}/usr/share/applications assets/dev.duxlabs.shell.desktop
    %install_file -t ${installdir}/usr/share/applications assets/dev.duxlabs.shell.notepad.desktop
    %install_file -t ${installdir}/usr/share/applications assets/dms-open.desktop

    # Icon
    %install_file -t ${installdir}/usr/share/icons/hicolor/scalable/apps assets/dev.duxlabs.shell.svg
replaces   :
    - dankmaterialshell
    - dbginfo : dankmaterialshell-dbginfo
