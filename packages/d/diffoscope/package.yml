# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : diffoscope
version    : '329'
release    : 23
source     :
    - https://diffoscope.org/archive/diffoscope-329.tar.bz2 : 50f7be324a3daf8aa84933db0eeac5eb86998263cb8b357c88ad949427f27f19
homepage   : https://diffoscope.org/
license    : GPL-3.0-or-later
component  : programming.python
summary    : In-depth comparison of files, archives, and directories
description: |
    diffoscope tries to get to the bottom of what makes files or directories different. It will recursively unpack archives of many kinds and transform various binary formats into more human-readable form to compare them. It can compare two tarballs, ISO images, or PDF just as easily.
builddeps  :
    - help2man
    - python-build
    - python-docutils
    - python-installer
    - python-libarchive-c
    - python-setuptools
    - python-wheel
rundeps    :
    - 7zip
    - binutils
    - bzip2
    - cpio
    - diffutils
    - dtc
    - gettext
    - gzip
    - libxmlb
    - llvm
    - lz4
    - python-argcomplete
    - python-defusedxml
    - python-libarchive-c
    - python-magic
    - tar
    - unzip
    - xz
    - zstd
build      : |
    %pyproject_build
    make -C doc
install    : |
    %pyproject_install
    %install_license COPYING
    %install_file debian/zsh-completion/_diffoscope -t ${installdir}/usr/share/zsh/site-functions/
    %install_file doc/diffoscope.1 -t ${installdir}/usr/share/man/man1
