# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : droidcam
version    : 2.1.4
release    : 8
source     :
    - https://github.com/dev47apps/droidcam-linux-client/archive/refs/tags/v2.1.4.tar.gz : 785c2d760b410b90b78a4f9604656e462a5c2eb9c1a351c61237dd57c36c0a4a
homepage   : https://www.dev47apps.com/
license    : GPL-2.0-or-later
component  : multimedia.video
summary    : GNU/Linux client for DroidCam
description: |
    DroidCam turns your phone/tablet into a webcam for your PC. Use it with chat programs like Zoom, MS Teams, and Skype.

    Installation Guide: https://help.getsol.us/docs/user/software/camera/droidcam
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(ayatana-appindicator3-0.1)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libavutil)
    - pkgconfig(libplist-2.0)
    - pkgconfig(libswscale)
    - pkgconfig(libturbojpeg)
    - pkgconfig(libusbmuxd-2.0)
    - pkgconfig(speex)
rundeps    :
    - android-tools
    - usbmuxd
setup      : |
    # Fix icon to respect system preferences
    %patch -p1 -i ${pkgfiles}/fix-icon.patch
build      : |
    env USBMUXD=libusbmuxd-2.0 APPINDICATOR=ayatana-appindicator3-0.1 %make
install    : |
    %install_bin droidcam droidcam-cli
    %install_file icon2.png ${installdir}/usr/share/icons/hicolor/96x96/apps/droidcam.png
    %install_file ${pkgfiles}/droidcam.desktop ${installdir}/usr/share/applications/droidcam.desktop
    %install_file ${pkgfiles}/com.dev47apps.droidcam.DroidCam.metainfo.xml -t ${installdir}/usr/share/metainfo
    # Place configuration files needed so droidcam works OOTB
    %install_file ${pkgfiles}/module.conf ${installdir}/usr/lib/modules-load.d/droidcam.conf
    %install_file ${pkgfiles}/modprobe.conf ${installdir}/usr/lib/modprobe.d/droidcam.conf
    %install_license LICENSE
