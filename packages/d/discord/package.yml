# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : discord
version    : 1.0.171
release    : 192
source     :
    - https://dl.discordapp.net/apps/linux/1.0.171/discord-1.0.171.tar.gz : efc517cf1551d93bdcb6f5c03fec52c2f05eb82805bd0ab2beed671bce56fdc8
license    : Distributable
component  : network.im
homepage   : https://discord.com/
summary    : All-in-one voice and text chat for gamers
description: |
    All-in-one voice and text chat for gamers that's free, secure, and works on both your desktop and phone.
replaces   :
    - discord-canary
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(gbm)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(xshmfence)
rundeps    :
    - libayatana-appindicator
    - opus
install    : |
    _discord_root=/usr/share/discord
    _discord_install=${installdir}/${_discord_root}

    %install_exe discord -t ${_discord_install}
    %install_exe updater_bootstrap -t ${_discord_install}

    %install_dir ${installdir}/usr/bin
    ln -srv ${_discord_install}/discord ${installdir}/usr/bin/discord

    # Desktop file, icon, metainfo
    %install_file ${pkgfiles}/discord.desktop ${installdir}/usr/share/applications/com.discordapp.Discord.desktop
    %install_file discord.png -t ${installdir}/usr/share/icons/hicolor/256x256/apps
    %install_file ${pkgfiles}/discord.appdata.xml ${installdir}/usr/share/metainfo/com.discordapp.Discord.metainfo.xml
