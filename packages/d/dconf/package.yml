# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : dconf
version    : '51.0'
release    : 25
source     :
    - https://download.gnome.org/sources/dconf/51/dconf-51.0.tar.xz : e65c1b7867f836faad9f9ee04acf5c5a6cae2bbc784833fe093207e0cb590248
homepage   : https://gitlab.gnome.org/GNOME/dconf
license    : LGPL-2.1-or-later
component  : desktop.gnome.core
summary    : GNOME Configuration Database
description: |
    The dconf package contains a configuration database system used by many GNOME applications.
emul32     : true
builddeps  :
    - pkgconfig32(dbus-1)
    - pkgconfig32(gio-unix-2.0)
    - docbook-xml
    - vala
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
