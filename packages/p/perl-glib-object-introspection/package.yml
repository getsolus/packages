# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-glib-object-introspection
version    : '0.052'
release    : 11
source     :
    - https://cpan.metacpan.org/authors/id/X/XA/XAOC/Glib-Object-Introspection-0.052.tar.gz : 555b4f1308939bb3141ea4570ad12e04e27c23329c302c9dc8725409e1049111
homepage   : https://metacpan.org/pod/Glib::Object::Introspection
license    : LGPL-2.1-or-later
component  : programming.perl
summary    : Glib::Object::Introspection - Dynamically create Perl language bindings
description: |
    Glib::Object::Introspection uses the gobject-introspection and libffi projects to dynamically create Perl bindings for a wide variety of libraries.  Examples include gtk+, webkit, libsoup and many more.
builddeps  :
    - pkgconfig(cairo)
    - perl-cairo-gobject
    - perl-extutils-depends
    - perl-extutils-pkgconfig
    - perl-glib
    - perl-test-simple
rundeps    :
    - perl-cairo-gobject
    - perl-glib
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license LICENSE
check      : |
    %perl_build test
patterns   : /*
