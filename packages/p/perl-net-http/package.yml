# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-net-http
version    : '6.24'
release    : 14
source     :
    - https://cpan.metacpan.org/authors/id/O/OA/OALDERS/Net-HTTP-6.24.tar.gz : 290ed9a97b05c7935b048e6d2a356035871fca98ad72c01c5961726adf85c83c
homepage   : https://metacpan.org/pod/Net::HTTP
license    : Artistic-1.0-Perl
component  : programming.perl
summary    : Net::HTTP - Low-level HTTP connection (client)
description: |
    The Net::HTTP class is a low-level HTTP client. An instance of the Net::HTTP class represents a connection to an HTTP server. The HTTP protocol is described in RFC 2616. The Net::HTTP class supports HTTP/1.0 and HTTP/1.1.
builddeps  :
    - perl-io-socket-ssl
    - perl-uri
rundeps    :
    - perl-io-socket-ssl
    - perl-uri
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license LICENSE
check      : |
    %perl_build test
patterns   : /*
