# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pip
version    : '26.3'
release    : 23
source     :
    - https://github.com/pypa/pip/archive/refs/tags/26.3.tar.gz : fb51108c23d88269d37da5813d97b5b27395c824b751ba1141a5cf408bcdd658
homepage   : https://pip.pypa.io/en/stable/
license    : MIT
component  :
    - wheel : programming.tools
    - programming.tools
summary    :
    - wheel : Python wheels for pip
    - The PyPA recommended tool for installing Python packages
description: |
    pip is the package installer for Python. You can use it to install packages from the Python Package Index and other indexes.
networking : true # For manpage generation
builddeps  :
    - python-build
    - python-docutils
    - python-flit-core
    - python-installer
    - python-myst-parser
    - python-sphinx
    - python-sphinx-copybutton
    - python-sphinx-inline-tabs
    - python-sphinx-issues
    - python-wheel
rundeps    :
    - python-attrs
    - python-cryptography
    - python-filelock
    - python-wheel
# checkdeps  :
#     - python-pytest
setup      : |
    # Towncrier is broken and not needed for man pages
    sed '/towncrier/d' -i docs/html/conf.py
build      : |
    %pyproject_build

    # Build man pages
    export PYTHONPATH="$PWD/src"
    pushd docs
    python pip_sphinxext.py
    sphinx-build -b man -d build/doctrees/man man build/man -c html
install    : |
    %pyproject_install

    # Generate shell completions
    PYTHONPATH=%python3_sitepackages% ${installdir}/usr/bin/pip completion --bash | %install_file /dev/stdin ${installdir}/usr/share/bash-completion/completions/pip
    PYTHONPATH=%python3_sitepackages% ${installdir}/usr/bin/pip completion --zsh | tail -n+3 | %install_file /dev/stdin ${installdir}/usr/share/zsh/site-functions/_pip
    PYTHONPATH=%python3_sitepackages% ${installdir}/usr/bin/pip completion --fish | %install_file /dev/stdin ${installdir}/usr/share/fish/vendor_completions.d/pip.fish

    # Install man pages
    %install_file -t ${installdir}/usr/share/man/man1 docs/build/man/*.1

    # Install wheel for virtualenv
    %install_file dist/*.whl -t ${installdir}/usr/share/python-wheels
# check      : |
#     %pytest -v
patterns   :
    - wheel :
        - /usr/share/python-wheels
