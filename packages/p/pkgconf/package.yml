# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pkgconf
version    : 3.0.11
release    : 5
source     :
    - https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.11.tar.xz : d0cd841bc8e55b9da888106c00dc256d05b7d1d8e5a46f4be4eb4c5125bd2dc4
homepage   : https://gitea.treehouse.systems/ariadne/pkgconf
license    : ISC
component  : system.devel
summary    : Package compiler and linker metadata toolkit
description: |
    Package compiler and linker metadata toolkit
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install

    # license
    %install_dir ${installdir}/usr/share/licenses/${package}
    mv ${installdir}/usr/share/doc/${package}/COPYING ${installdir}/usr/share/licenses/${package}/

    # pkg-config compatibility
    ln -sv pkgconf ${installdir}/usr/bin/pkg-config
    ln -sv pkgconf.1 ${installdir}/usr/share/man/man1/pkg-config.1

    # Triplet support
    for i in ${pkgfiles}/*.personality; do
        file=$(basename ${i})
        triplet=${file%.personality}

        %install_file ${pkgfiles}/${file} -t ${installdir}/usr/share/pkgconfig/personality.d
        ln -sv pkgconf ${installdir}/usr/bin/${triplet}-pkg-config
    done
check      : |
    %ninja_check
patterns   :
    - main :
        - /usr/share/aclocal
replaces   :
    - pkg-config
    - dbginfo : pkg-config-dbginfo
