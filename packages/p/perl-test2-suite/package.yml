# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-test2-suite
version    : '0.000163'
release    : 14
source     :
    - https://cpan.metacpan.org/authors/id/E/EX/EXODIST/Test2-Suite-0.000163.tar.gz : e336c2d92d43c4f0068aa0d67019d56723ab82471e1bd9028300bb6a1602c0a9
homepage   : https://metacpan.org/dist/Test2-Suite
license    : Artistic-1.0-Perl
component  : programming.perl
summary    : Test2::Suite - Distribution with a rich set of tools built upon the Test2 framework
description: |
    Rich set of tools, plugins, bundles, etc built upon the Test2 testing library. If you are interested in writing tests, this is the distribution for you.
builddeps  :
    - perl-importer
    - perl-module-pluggable
    - perl-scalar-list-utils
    - perl-scope-guard
    - perl-sub-info
    - perl-sub-name
    - perl-term-readkey
    - perl-term-size-any
    - perl-term-table
    - perl-test-simple
    - perl-time-hires
    - perl-unicode-linebreak
rundeps    :
    - perl-importer
    - perl-module-pluggable
    - perl-scalar-list-utils
    - perl-scope-guard
    - perl-sub-info
    - perl-sub-name
    - perl-term-readkey
    - perl-term-size-any
    - perl-term-table
    - perl-test-simple
    - perl-time-hires
    - perl-unicode-linebreak
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license LICENSE
check      : |
    %perl_build test
patterns   : /*
