# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pandoc-crossref
version    : 0.3.25
release    : 15
source     :
    - https://github.com/lierdakil/pandoc-crossref/archive/refs/tags/v0.3.25.tar.gz : cb42b8319a59f258fea191e4660b62bdd9a90a9099322ae0f17203bc5986498a
homepage   : https://lierdakil.github.io/pandoc-crossref/
license    : GPL-2.0-only
component  : office
summary    : pandoc-crossref is a pandoc filter for numbering figures, equations, tables and cross-references to them.
description: |
    pandoc-crossref is a pandoc filter for numbering figures, equations, tables and cross-references to them.
builddeps  :
    - ghc
    - haskell-cabal-install
rundeps    :
    - pandoc
networking : true
setup      : |
    rm $workdir/cabal.project.freeze
    %cabal_configure --enable-tests --constraint="pandoc == 3.10.2"
build      : |
    %haskell_build
install    : |
    %haskell_install exe:pandoc-crossref
    %install_license LICENSE
    rm -rf $installdir/{%libdir%,usr/share/pandoc-crossref,usr/share/doc}
check      : |
    %haskell_check
