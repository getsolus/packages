# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-bit-vector
version    : 7.4
release    : 8
source     :
    - https://cpan.metacpan.org/authors/id/S/ST/STBEY/Bit-Vector-7.4.tar.gz : 3c6daa671fecfbc35f92a9385b563d65f50dfc6bdc8b4805f9ef46c0d035a926
homepage   : https://metacpan.org/pod/Bit::Vector
license    : Artistic-1.0-Perl
component  : programming.perl
summary    : Bit::Vector - Efficient bit vector, set of integers and "big int" math library
description: |
    Efficient bit vector, set of integers and "big int" math library
builddeps  :
    - perl-carp-clan
rundeps    :
    - perl-carp-clan
setup      : |
    %perl_setup
    # Bit-Vector is not C23-friendly https://github.com/gentoo/gentoo/blob/master/dev-perl/Bit-Vector/Bit-Vector-7.400.0-r4.ebuild
    sed -i 's/^OPTIMIZE = \(.*\)/OPTIMIZE = \1 -std=gnu17/' Makefile
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license GNU*
check      : |
    %perl_build test
patterns   : /*
