# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : phodav
version    : '3.2'
release    : 4
source     :
    - https://download.gnome.org/sources/phodav/3.2/phodav-3.2.tar.xz : 93c993066ab3aebd5b539bab9d731eac43abbb750109c895f151ca3c74a5fc82
homepage   : https://gitlab.gnome.org/GNOME/phodav/
license    : GPL-2.0-or-later
component  : network.util
summary    : Minimal WebDAV server implementation
description: |
    phodav is a minimal WebDAV server implementation using GNOME libsoup (RFC 4918.)
builddeps  :
    - pkgconfig(avahi-core)
    - pkgconfig(libsoup-3.0)
    - asciidoc
    - xmlto
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
