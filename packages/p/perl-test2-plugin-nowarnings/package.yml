# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-test2-plugin-nowarnings
version    : '0.10'
release    : 7
source     :
    - https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/Test2-Plugin-NoWarnings-0.10.tar.gz : c97cb1122cc6e3e4a079059da71e12f65760bfb0671d19d25a7ec7c5f1f240fb
homepage   : https://metacpan.org/pod/Test2::Plugin::NoWarnings
license    : Artistic-2.0
component  : programming.perl
summary    : Test2::Plugin::NoWarnings - Fail if tests warn
description: |
    Loading this plugin causes your tests to fail if there any warnings while they run. Each warning generates a new failing test and the warning content is outputted via `diag`.
builddeps  :
    - perl-importer
    - perl-ipc-run3
    - perl-module-pluggable
    - perl-sub-info
    - perl-term-table
    - perl-test-simple
rundeps    :
    - perl-test-simple
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license LICENSE
check      : |
    %perl_build test
patterns   : /*
