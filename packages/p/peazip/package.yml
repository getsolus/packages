# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : peazip
version    : 11.3.0
release    : 7
source     :
    - https://github.com/peazip/PeaZip/releases/download/11.3.0/peazip-11.3.0.src.zip : 17e85e62a3b526a03347186465ff4a79f8117311e9efe0c432e968bd98e612cb
homepage   : https://peazip.github.io
license    : LGPL-3.0-or-later
component  : system.utils
summary    : Free Zip / Unzip software and Rar file extractor. Cross-platform file and archive manager.
description: |
    PeaZip is an Open Source, cross-platform archive manager and file manager utility, written with Lazarus / FreePascal IDE. This package is built natively utilizing the Qt6 widgetset.
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6Gui)
    - pkgconfig(Qt6Widgets)
    - pkgconfig(x11)
    - 7zip
    - brotli
    - fpc
    - lazarus
    - zstd
rundeps    :
    - 7zip
    - brotli
    - qt6-svg
    - qt6-wayland
    - zstd
setup      : |
    %patch -p1 -i $pkgfiles/fix-desktop-file.patch
build      : |
    lazbuild --lazarusdir=/usr/lib64/lazarus --add-package dev/metadarkstyle/metadarkstyle.lpk
    lazbuild --lazarusdir=/usr/lib64/lazarus --widgetset=qt6 dev/project_peach.lpi
    lazbuild --lazarusdir=/usr/lib64/lazarus --widgetset=qt6 dev/project_pea.lpi
install    : |
    %install_dir $installdir/usr/lib/peazip
    cp -a res $installdir/usr/lib/peazip/

    %install_exe dev/peazip $installdir/usr/lib/peazip/
    %install_exe dev/pea $installdir/usr/lib/peazip/

    # Get main license then third party licenses
    %install_license res/share/copying/copying.txt
    cp -r res/share/copying/third-parties $installdir/usr/share/licenses/peazip/
        

    # Clean up unnecessary Windows, macOSm and portable specific integration files
    rm -rf "$installdir/usr/lib/peazip/res/conf"
    rm -rf "$installdir/usr/lib/peazip/res/share/batch/Windows"
    rm -rf "$installdir/usr/lib/peazip/res/share/batch/macOS service menus"
    rm -rf "$installdir/usr/lib/peazip/res/share/batch/bat"
    rm -rf "$installdir/usr/lib/peazip/res/share/copying"
    rm -rf "$installdir/usr/lib/peazip/res/share/lang-wincontext"
    rm -f "$installdir/usr/lib/peazip/res/share/readme/readme_Windows.txt"    
    rm -f "$installdir/usr/lib/peazip/res/share/readme/readme_macOS.txt"
    rm -f "$installdir/usr/lib/peazip/res/portable"

    # Clear out any dummy/placeholder files in the source's bin folder
    rm -rf "$installdir"/usr/lib/peazip/res/bin/*

    # Wrapper for system 7z
    %install_exe $pkgfiles/7z $installdir/usr/lib/peazip/res/bin/7z/7z

    # Wrapper for system Brotli
    %install_exe $pkgfiles/brotli $installdir/usr/lib/peazip/res/bin/brotli/brotli

    # Wrapper for system Zstd
    %install_exe $pkgfiles/zstd $installdir/usr/lib/peazip/res/bin/zstd/zstd

    install -dm00755 $installdir/usr/bin
    ln -s /usr/lib/peazip/peazip $installdir/usr/bin/peazip

    %install_file res/share/batch/freedesktop_integration/peazip.desktop -t $installdir/usr/share/applications/
    %install_file res/share/icons/peazip.png -t $installdir/usr/share/icons/hicolor/256x256/apps/

    # Install appstream metadata
    %install_file $pkgfiles/io.github.peazip.peazip.metainfo.xml -t $installdir/usr/share/metainfo

