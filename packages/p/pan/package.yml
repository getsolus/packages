# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pan
version    : '0.165'
release    : 13
source     :
    - https://gitlab.gnome.org/GNOME/pan/-/archive/v0.165/pan-v0.165.tar.gz : c9eeeff363908bb4c7f2d305e651b618d729a5ea3b9e5756525ce9dd0da118e4
homepage   : https://gitlab.gnome.org/GNOME/pan
license    : GPL-2.0-or-later
component  : office
summary    : A powerful and user-friendly Usenet newsreader for GTK+
description: |
    A powerful and user-friendly Usenet newsreader for GTK+
builddeps  :
    - pkgconfig(dbus-1)
    - pkgconfig(enchant-2)
    - pkgconfig(gmime-3.0)
    - pkgconfig(gnome-keyring-1)
    - pkgconfig(gnutls)
    - pkgconfig(gspell-1)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libnotify)
    - pkgconfig(zlib)
    - itstool
setup      : |
    %cmake_ninja \
        -DENABLE_GTR=ON \
        -DENABLE_LIBNOTIFY=ON \
        -DWITH_DBUS=ON \
        -DWITH_GMIME_CRYPTO=ON \
        -DWITH_GNUTLS=ON \
        -DWITH_GTKSPELL=ON \
        -DWITH_GTK3=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
