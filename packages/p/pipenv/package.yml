# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pipenv
version    : 2026.8.0
release    : 19
source     :
    - https://github.com/pypa/pipenv/archive/refs/tags/v2026.8.0.tar.gz : c38f8238d875ab354472f825e8367eb8ea42cb6beec03ab220ce8bed81635283
homepage   : https://pipenv.pypa.io/
license    : MIT
component  : programming.python
summary    : Python Development Workflow for Humans
description: |
    Pipenv is a tool that aims to bring the best of all packaging worlds (bundler, composer, npm, cargo, yarn, etc.) to the Python world.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest
rundeps    :
    - python-certifi
    - virtualenv
    - virtualenv-clone
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest tests/unit \
        --ignore=tests/unit/test_release_tasks.py \
        --ignore=tests/unit/test_vendor.py \
        -o addopts=""
