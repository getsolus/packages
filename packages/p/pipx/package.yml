# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pipx
version    : 1.18.4
release    : 12
source     :
    - https://files.pythonhosted.org/packages/source/p/pipx/pipx-1.18.4.tar.gz : 7b871c2f00dd3cdbdeade21e76f58ef8c3315a68903ca7c976e20424fae78133
homepage   : https://pypa.github.io/pipx/
license    : MIT
component  : programming.python
summary    : Install and Run Python Applications in Isolated Environments
description: |
    pipx is a tool to help you install and run end-user applications written in Python. It uses pip, but is focused on installing and managing Python packages that can be run from the command line directly as applications.
builddeps  :
    - python-argcomplete
    - python-build
    - python-docutils
    - python-hatch-vcs
    - python-hatchling
    - python-installer
rundeps    :
    - python-argcomplete
    - python-filelock
    - python-packaging
    - python-platformdirs
    - python-userpath
checkdeps  :
    - python-argcomplete
    - python-filelock
    - python-packaging
    - python-platformdirs
    - python-userpath
build      : |
    %pyproject_build
install    : |
    %pyproject_install

    mkdir -p ${workdir}/completions
    register-python-argcomplete --shell bash pipx > ${workdir}/completions/pipx.bash
    %install_file ${workdir}/completions/pipx.bash ${installdir}/usr/share/bash-completion/completions/pipx
    register-python-argcomplete --shell fish pipx > ${workdir}/completions/pipx.fish
    %install_file ${workdir}/completions/pipx.fish ${installdir}/usr/share/fish/vendor_completions.d/pipx.fish
    register-python-argcomplete --shell zsh pipx > ${workdir}/completions/pipx.zsh
    %install_file ${workdir}/completions/pipx.zsh ${installdir}/usr/share/zsh/site-functions/_pipx
check      : |
    # It’s just not practical to run the tests. For most of them, we need either
    # (by default) a bundle of sample wheels from PyPI–which is arch-specific, as
    # some of them have compiled extensions—or network access.
    #
    # Instead, we “smoke-test” the installation by running the command-line tool
    # and confirming it can print it's help output without crashing.

    # Make sure the source copy of the package is not in the Python path.
    mkdir empty
    pushd empty
    PYTHONPATH=%python3_sitepackages% ${installdir}/usr/bin/pipx --help >/dev/null
