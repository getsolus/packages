# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-gtk2
version    : '1.24993'
release    : 11
source     :
    - https://cpan.metacpan.org/authors/id/X/XA/XAOC/Gtk2-1.24993.tar.gz : 49c443743b2eefe11a768002724f7f6a4c48efc94ff3cd3a559fb7e7b693c967
homepage   : https://metacpan.org/pod/Gtk2
license    : LGPL-2.1-or-later
component  : programming.perl
summary    : Perl bindings for Gtk+ 2.x
description: |
    Perl bindings for Gtk+ 2.x
builddeps  :
    - pkgconfig(cairo)
    - pkgconfig(gtk+-2.0)
    - perl-cairo
    - perl-extutils-depends
    - perl-extutils-pkgconfig
    - perl-glib
    - perl-pango
rundeps    :
    - perl-cairo
    - perl-glib
    - perl-pango
setup      : |
    %patch -p1 -i ${pkgfiles}/fix-build-with-perl-5.44.patch
    %perl_setup
    # gtk2 is not C23-friendly https://github.com/gentoo/gentoo/blob/master/dev-perl/Gtk2/Gtk2-1.249.930-r1.ebuild
    sed -i 's/^OPTIMIZE = \(.*\)/OPTIMIZE = \1 -std=gnu17/' Makefile
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license LICENSE
#check      : |
#    %perl_build test
patterns   : /*
