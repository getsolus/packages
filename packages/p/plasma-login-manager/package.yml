# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : plasma-login-manager
version    : 6.8.3
release    : 2
source     :
    - https://download.kde.org/stable/plasma/6.8.3/plasma-login-manager-6.8.3.tar.xz : 5969f5a6bbf23a911db5dc1a44cc0ba6f341ce3af8edfe3374d75610b39a8d9d
homepage   : https://kde.org/plasma-desktop/
license    :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC0-1.0
    - CC-BY-3.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
component  : desktop.kde
summary    : Plasma Login Manager
description: |
    Plasma Login Manager
builddeps  :
    - pkgconfig(KF6Screen)
    - pkgconfig(Qt6Linguist)
    - pkgconfig(Qt6Qml)
    - pkgconfig(Qt6ShaderTools)
    - pkgconfig(pam)
    - pkgconfig(systemd)
    - pkgconfig(xau)
    - extra-cmake-modules
    - kf6-kauth-devel
    - kf6-kcmutils-devel
    - kf6-kdbusaddons-devel
    - kf6-ki18n-devel
    - kf6-kio-devel
    - kf6-kirigami-devel
    - kf6-kpackage-devel
    - kf6-kwindowsystem-devel
    - layer-shell-qt-devel
    - libplasma-devel
    - plasma-workspace-devel
    - qt6-base-private-devel
rundeps    :
    - kf6-kimageformats
    - kwin
    - plasma-workspace
    - qt6-wayland
clang      : true
optimize   : thin-lto
setup      : |
    %patch -p1 -i $pkgfiles/0001-downstream-Update-defaults-conf-dir.patch

    %cmake_kf6 \
        -DINSTALL_PAM_CONFIGURATION:BOOL=OFF \
        -DLOGIN_DEFS_PATH=/usr/share/defaults/etc/login.defs
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE.CC-BY-3.0 LICENSES/*

    # Breaks plasma-login    
    #install -Dm00644 $pkgfiles/plasmalogin.group $installdir/%libdir%/userdb/plasmalogin.group
    #ln -s plasmalogin.group $installdir/%libdir%/userdb/24.group
    #install -Dm00644 $pkgfiles/plasmalogin.user $installdir/%libdir%/userdb/plasmalogin.user
    #ln -s plasmalogin.user $installdir/%libdir%/userdb/24.user

    # Install our PAM configs
    %install_file ${pkgfiles}/pam.d/* -t ${installdir}/usr/share/defaults/etc/pam.d/

    # Default vendor configs
    %install_file ${pkgfiles}/plasmalogin.conf ${installdir}/usr/share/plasmalogin/plasmalogin.conf.d/10_solus_default.conf

    # Enable service
    %install_file ${pkgfiles}/plasmalogin.preset ${installdir}/%libdir%/systemd/system-preset/50-plasmalogin.preset
conflicts  :
    - greetd
    - lightdm
    - sddm
