# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pdfarranger
version    : 1.14.0
release    : 27
source     :
    - https://github.com/pdfarranger/pdfarranger/archive/refs/tags/1.14.0.tar.gz : 9f6f7f00664adcd470069cbe2b05e41bd1e9bbe4506856a8029c56353eacee7d
homepage   : https://github.com/jeromerobert/pdfarranger
license    : GPL-3.0-or-later
component  : office
summary    : A simple application for merging, rearranging, splitting and modifing PDF files
description: |
    pdfarranger is a small python-gtk application, which helps the user to merge or split pdf documents and rotate, crop and rearrange their pages using an interactive and intuitive graphical interface. It is a frontend for pikepdf.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
rundeps    :
    - img2pdf
    - poppler
    - python-dateutil
    - python-gobject
build      : |
    %python3_setup
install    : |
    %python3_install
    %install_license COPYING
