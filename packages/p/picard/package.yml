# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : picard
version    : 3.0.3
release    : 38
source     :
    - https://github.com/metabrainz/picard/archive/refs/tags/release-3.0.3.tar.gz : 1799fe145beb17fe6b36e98ebc99c9e93a31b1bb3728cbb75fde156510cd8839
homepage   : https://picard.musicbrainz.org/
license    : GPL-2.0-or-later
component  : multimedia.audio
summary    : Cross-platform music tagger written in Python
description: |
    Cross-platform music tagger written in Python.
    Picard supports the majority of audio file formats, is capable of using audio fingerprints (AcoustIDs), performing CD lookups and disc ID submissions, and it has excellent Unicode support.
    Additionally, there are several plugins available that extend Picard's features.
builddeps  :
    - pkgconfig(python3)
    - mutagen
    - python-build
    - python-dateutil
    - python-fasteners
    - python-installer
    - python-qt6
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest
    - python-qt6
rundeps    :
    - chromaprint
    - mutagen
    - python-dateutil
    - python-discid
    - python-fasteners
    - python-markdown
    - python-pyjwt
    - python-qt6
    - python-tomlkit
    - pyyaml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_license COPYING.txt
check      : |
    %pytest -k "not test_identity_comparison_unreadable_file" # fails when run as root
