# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-json-xs
version    : '4.05'
release    : 11
source     :
    - https://cpan.metacpan.org/authors/id/M/ML/MLEHMANN/JSON-XS-4.05.tar.gz : 87f08065667a175e8c484d89c51366c08c686609017a68d186fbcbe833f1f958
homepage   : https://metacpan.org/pod/JSON::XS
license    : Artistic-1.0-Perl
component  : programming.perl
summary    : json_xs - JSON::XS commandline utility
description: |
    json_xs converts between some input and output formats (one of them is JSON). The default input format is json and the default output format is json-pretty.
builddeps  :
    - perl-canary-stability
    - perl-common-sense
    - perl-types-serialiser
rundeps    :
    - perl-types-serialiser
setup      : |
    export PERL_CANARY_STABILITY_NOPROMPT=1
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license COPYING
check      : |
    %perl_build test
patterns   :
    - /usr/share/man/man3
