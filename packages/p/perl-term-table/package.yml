# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-term-table
version    : '0.028'
release    : 8
source     :
    - https://cpan.metacpan.org/authors/id/E/EX/EXODIST/Term-Table-0.028.tar.gz : f2ba62a52f32d18aea8a8ca73299bef0e52409332cfe514a9c475316f6d5351c
homepage   : https://metacpan.org/pod/Term::Table
license    : Artistic-1.0-Perl
component  : programming.perl
summary    : Term::Table - Format a header and rows into a table
description: |
    This is used by some failing tests to provide diagnostics about what has gone wrong. This module is able to generic format rows of data into tables.
builddeps  :
    - perl-importer
    - perl-test-simple
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license LICENSE
check      : |
    %perl_build test
patterns   : /*
