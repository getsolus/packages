# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-pod-simple
version    : '3.48'
release    : 7
source     :
    - https://cpan.metacpan.org/authors/id/K/KH/KHW/Pod-Simple-3.48.tar.gz : 3297cf3c078de9d8297942423ec6ab59e85e30dfb38b782242699e386727c63a
homepage   : https://metacpan.org/pod/Pod::Simple
license    : Artistic-1.0-Perl
component  : programming.perl
summary    : Pod::Simple - framework for parsing Pod
description: |
    Pod::Simple is a Perl library for parsing text in the Pod ("plain old documentation") markup language that is typically used for writing documentation for Perl and for Perl modules.
checkdeps  :
    - perl-test-deep
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
check      : |
    %perl_build test
patterns   : /*
