# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-http-daemon
version    : '6.17'
release    : 9
source     :
    - https://cpan.metacpan.org/authors/id/O/OA/OALDERS/HTTP-Daemon-6.17.tar.gz : 16281580c40e23108d028434698b5d7d53637bf904c9df822481e253cbec920c
homepage   : https://metacpan.org/pod/HTTP::Daemon
license    : Artistic-1.0-Perl
component  : programming.perl
summary    : HTTP::Daemon - a simple http server class
description: |
    Instances of the HTTP::Daemon class are HTTP/1.1 servers that listen on a socket for incoming requests. The HTTP::Daemon is a subclass of IO::Socket::INET, so you can perform socket operations directly on it too.
builddeps  :
    - perl-extutils-config
    - perl-extutils-helpers
    - perl-extutils-installpaths
    - perl-module-build-tiny
rundeps    :
    - perl-http-date
    - perl-http-message
    - perl-lwp-mediatypes
setup      : |
    %perl_setup --installdirs=vendor
build      : |
    %perl_build
install    : |
    $workdir/Build install --destdir=${installdir}
    %install_license LICENCE
patterns   : /*
