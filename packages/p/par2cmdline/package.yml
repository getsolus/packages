# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : par2cmdline
version    : 1.4.0
release    : 5
source     :
    - https://github.com/Parchive/par2cmdline/releases/download/v1.4.0/par2cmdline-1.4.0.tar.bz2 : 269aff9d49c6a0c0d1c394300d35c36229764588f56faad5850eaf36c7a298dc
homepage   : https://github.com/Parchive/par2cmdline
license    : GPL-2.0-or-later
component  : programming.tools
summary    : PAR file verification and repair tool
description: |
    par2cmdline is a program for creating and using PAR2 files to detect damage in data files and repair them if necessary. It can be used with any kind of file.
setup      : |
    %configure_no_runstatedir
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
check      : |
    %make check
