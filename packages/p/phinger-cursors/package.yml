# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : phinger-cursors
version    : '2.2'
release    : 3
source     :
    - https://github.com/phisch/phinger-cursors/releases/download/v2.2/phinger-cursors-variants.tar.bz2 : 46d4cfc30a38c19cada3339027b5a78f7b0bf74f3220eba7001c4fdd9d5a6e56
homepage   : https://github.com/phisch/phinger-cursors
license    : CC-BY-SA-4.0
component  : desktop.theme
summary    :
    - Most likely the most over engineered cursor theme out there.
description: |
    - Say hello to your new cursor theme. Phinger Cursors is most likely the most over engineered cursor theme out there.
install    : |
    %install_license ${pkgfiles}/LICENSE
    for dir in $(ls $workdir)
        do
            %install_file ${dir}/cursors/* -t ${installdir}/usr/share/icons/${dir}/cursors/
            %install_file ${dir}/index.theme -t ${installdir}/usr/share/icons/${dir}
        done

