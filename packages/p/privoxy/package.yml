# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : privoxy
version    : 4.2.0
release    : 8
source     :
    - https://sourceforge.net/projects/ijbswa/files/Sources/4.2.0%20%28stable%29/privoxy-4.2.0-stable-src.tar.gz : 6f91267f81f626c416994db89ab62f4d09246eebf4754b81186e13a18ee9028f
homepage   : https://www.privoxy.org/
license    : GPL-2.0-or-later
component  : network.clients
summary    : Non-caching web proxy with advanced filtering capabilities
description: |
    Privoxy is a non-caching web proxy with advanced filtering capabilities for enhancing privacy, modifying web page data and HTTP headers, controlling access, and removing ads and other obnoxious Internet junk. Privoxy has a flexible configuration and can be customized to suit individual needs and tastes. It has application for both stand-alone systems and multi-user networks.
builddeps  :
    - pkgconfig(libbrotlidec)
    - pkgconfig(libpcre2-8)
    - pkgconfig(libzstd)
    - pkgconfig(openssl)
    - pkgconfig(zlib)
setup      : |
    %reconfigure --disable-static \
                 --sysconfdir=/usr/share/defaults/privoxy \
                 --with-openssl
build      : |
    %make
install    : |
    sed -i 's|^confdir \.|confdir /usr/share/defaults/privoxy|; s|^logdir \.|logdir /var/log/privoxy|' config

    %install_exe privoxy $installdir/usr/sbin/privoxy
    %install_file man/privoxy.8 $installdir/usr/share/man/man8/privoxy.8
    
    for conf in config *.action *.filter trust; do
        %install_file $conf $installdir/usr/share/defaults/privoxy/$conf
    done
    for tmpl in templates/*; do
        %install_file $tmpl $installdir/usr/share/defaults/privoxy/$tmpl
    done

    # Install service, sysusers, and tmpfiles assets
    %install_file $pkgfiles/privoxy.service $installdir/%libdir%/systemd/system/privoxy.service
    %install_file $pkgfiles/privoxy.sysusers $installdir/%libdir%/sysusers.d/privoxy.conf
    %install_file $pkgfiles/privoxy.tmpfiles $installdir/%libdir%/tmpfiles.d/privoxy.conf
    
    %install_license LICENSE

