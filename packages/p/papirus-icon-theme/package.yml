# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : papirus-icon-theme
version    : '20260801'
release    : 92
source     :
    - https://github.com/PapirusDevelopmentTeam/papirus-icon-theme/archive/refs/tags/20260801.tar.gz : 646f622e9e7e9e65eef9d0ab58999d4920ddb33d98e6a75232627cfe3bd508f9
license    : GPL-3.0-or-later
homepage   : https://git.io/papirus-icon-theme
component  : desktop.theme
summary    : A free and open source SVG icon theme for Linux systems
description: |
    A free and open source SVG icon theme for Linux systems
rundeps    :
    - hicolor-icon-theme
replaces   :
    - papirus-adapta-icon-theme
setup      : |
    %patch -p1 -i $pkgfiles/0001-Revert-redesign-System-Software-Install.patch
install    : |
    %make_install

    %install_file $pkgfiles/Papirus-Adapta@index.theme $installdir/usr/share/icons/Papirus-Adapta/index.theme
    %install_file $pkgfiles/Papirus-Adapta-Nokto@index.theme $installdir/usr/share/icons/Papirus-Adapta-Nokto/index.theme
    %install_license LICENSE
    rm -f $installdir/usr/share/icons/Papirus/**/apps/{dcc_nav*,dde*,*deepin*,io.elementary*,uos*,com.github.cassidyjames*}
