# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-try-tiny
version    : '0.32'
release    : 10
source     :
    - https://cpan.metacpan.org/authors/id/E/ET/ETHER/Try-Tiny-0.32.tar.gz : ef2d6cab0bad18e3ab1c4e6125cc5f695c7e459899f512451c8fa3ef83fa7fc0
homepage   : https://metacpan.org/pod/Try::Tiny
license    : MIT
component  : programming.perl
summary    : Try::Tiny - Minimal try/catch with proper preservation of $@
description: |
    This module provides bare bones try/catch/finally statements that are designed to minimize common mistakes with eval blocks, and NOTHING else.
builddeps  :
    - perl-capture-tiny
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license LICENCE
check      : |
    %perl_build test
patterns   : /*
