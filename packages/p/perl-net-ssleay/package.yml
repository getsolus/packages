# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-net-ssleay
version    : '1.96'
release    : 19
source     :
    - https://cpan.metacpan.org/authors/id/C/CH/CHRISN/Net-SSLeay-1.96.tar.gz : ab213691685fb2a576c669cbc8d9266f8165a31563ad15b7c4030b94adfc0753
homepage   : https://metacpan.org/pod/Net::SSLeay
license    : Artistic-Perl-2.0
component  : programming.perl
summary    : Net::SSLeay - Perl extension for using OpenSSL
description: |
    This module provides Perl bindings for libssl (an SSL/TLS API) and libcrypto (a cryptography API).
builddeps  :
    - perl-test-exception
    - perl-test-nowarnings
    - perl-test-pod
    - perl-test-simple
    - perl-test-warn
setup      : |
    %perl_setup < /dev/null
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license LICENSE
check      : |
    %perl_build test
patterns   : /*
