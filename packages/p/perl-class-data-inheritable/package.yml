# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-class-data-inheritable
version    : '0.10'
release    : 12
source     :
    - https://cpan.metacpan.org/modules/by-module/Class/Class-Data-Inheritable-0.10.tar.gz : aa1ae68a611357b7bfd9a2f64907cc196ddd6d047cae64ef9d0ad099d98ae54a
homepage   : https://metacpan.org/dist/Class-Data-Inheritable
license    : Artistic-1.0-Perl
summary    : Perl Class Data Inheritable Module
description: |
    Class::Data::Inheritable is for creating accessor/mutators to class data. That is, if you want to store something about your class as a whole (instead of about a single object). This data is then inherited by your subclasses and can be overriden.
component  : programming.perl
extract    : false
setup      : |
    # manually extract to work around https://github.com/getsolus/solbuild/issues/126
    tar --strip-components=1 -xf $sources/Class-Data-Inheritable-%version%.tar.gz
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
patterns   :
    - /usr/share/man/*
