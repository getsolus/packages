# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-variable-magic
version    : '0.64'
release    : 9
source     :
    - https://cpan.metacpan.org/authors/id/V/VP/VPIT/Variable-Magic-0.64.tar.gz : 9f7853249c9ea3b4df92fb6b790c03a60680fc029f44c8bf9894dccf019516bd
homepage   : https://metacpan.org/pod/Variable::Magic
license    : Artistic-2.0
component  : programming.python
summary    : Variable::Magic - Associate user-defined magic to variables from Perl
description: |
    Magic is Perl's way of enhancing variables. This mechanism lets the user add extra data to any variable and hook syntactical operations (such as access, assignment or destruction) that can be applied to it. With this module, you can add your own magic to any variable without having to write a single line of XS.
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
patterns   : /*
