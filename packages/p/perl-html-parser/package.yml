# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-html-parser
version    : '3.85'
release    : 11
source     :
    - https://cpan.metacpan.org/authors/id/O/OA/OALDERS/HTML-Parser-3.85.tar.gz : fd42ba6abe07241cf0ad57be246c3980065f683e4465e59b46af9efebc8e0c71
homepage   : https://metacpan.org/pod/HTML::Parser
license    : Artistic-1.0-Perl
component  : programming.perl
summary    : HTML::Parser - HTML parser class
description: |
    Objects of the HTML::Parser class will recognize markup and separate it from plain text (alias data content) in HTML documents. As different kinds of markup and text are recognized, the corresponding event handlers are invoked.
builddeps  :
    - perl
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license LICENSE
patterns   : /*
