# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-libintl
version    : '1.37'
release    : 11
source     :
    - https://cpan.metacpan.org/authors/id/G/GU/GUIDO/libintl-perl-1.37.tar.gz : a49b08d56813789e5f03289a3f949459eafe9e40a1a9fc066c42c90009a322cf
homepage   : https://metacpan.org/pod/Locale::Util
license    : GPL-3.0-or-later
component  : programming.perl
summary    : Internationalization (gettext API) for Perl
description: |
    The package libintl-perl is an internationalization library for Perl that aims to be compatible with the Uniforum message translations system as implemented for example in GNU gettext.
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license COPYING
check      : |
    %perl_build test
patterns   : /*
