# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-xml-libxslt
version    : '2.003000'
release    : 10
source     :
    - https://cpan.metacpan.org/authors/id/S/SH/SHLOMIF/XML-LibXSLT-2.003000.tar.gz : 7caa5aee72f53be59d8b84eecb6864a07c612a12ea6b27d5c706960edcd54587
homepage   : https://metacpan.org/pod/XML::LibXSLT
license    : Artistic-1.0-Perl
component  : programming.perl
summary    : XML::LibXSLT - Interface to the GNOME libxslt library
description: |
    This module is an interface to the GNOME project's libxslt. This is an extremely good XSLT engine, highly compliant and also very fast. I have tests showing this to be more than twice as fast as Sablotron.
builddeps  :
    - pkgconfig(libgcrypt)
    - pkgconfig(libxslt)
    - perl-test-pod
    - perl-xml-libxml
rundeps    :
    - perl-xml-libxml
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license LICENSE
check      : |
    %perl_build test
patterns   : /*
