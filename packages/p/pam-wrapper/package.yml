# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pam-wrapper
version    : 1.1.8
release    : 12
source     :
    - https://gitlab.com/cwrap/pam_wrapper/-/archive/pam_wrapper-1.1.8/pam_wrapper-pam_wrapper-1.1.8.tar.gz : fed0b8ea9d440fe7f0a5333c6fa0284ac24ac4b3bab1af6e31d6f632c83edeec
license    : GPL-3.0-or-later
component  : security
homepage   : https://cwrap.org/pam_wrapper.html
summary    : A tool to test PAM applications and PAM modules
description: |
    A tool to test PAM applications and PAM modules
builddeps  :
    - pkgconfig(cmocka)
    - pkgconfig(python3)
setup      : |
    %cmake_ninja -DUNIT_TESTING=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
check      : |
    %ninja_check
