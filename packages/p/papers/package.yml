# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : papers
version    : '51.1'
release    : 25
source     :
    - https://download.gnome.org/sources/papers/51/papers-51.1.tar.xz : ac0db229883b3d2aacbbda1700dc12aa69716664df201120926096f066e4796b
homepage   : https://apps.gnome.org/Papers/
license    : GPL-2.0-or-later
component  : office.viewers
summary    :
    - Document viewer for the GNOME desktop
    - previewer :
        - GNOME Document Previewer
    - thumbnailer :
        - GNOME Document Thumbnailer
    - nautilus :
        - Nautilus extension for GNOME Papers
description: |
    A document viewer for the GNOME desktop. You can view, search or annotate documents in many different formats. Papers supports documents in: PDF, PS, EPS, XPS, DjVu, TIFF, and Comic Books archives (CBR, CBT, CBZ, CB7).
networking : true
builddeps  :
    - pkgconfig(ddjvuapi)
    - pkgconfig(exempi-2.0)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libgxps)
    - pkgconfig(libnautilus-extension-4)
    - pkgconfig(libsecret-1)
    - pkgconfig(libspectre)
    - pkgconfig(poppler-glib)
    - appstream
    - blueprint-compiler
    - desktop-file-utils
    - itstool
    - rust-devel
rundeps:
    - nautilus :
        - papers-libs
    - papers-libs
    - previewer :
        - papers-libs
    - thumbnailer :
        - papers-libs
setup      : |
    %meson_configure -Ddocumentation=false
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
check      : |
    # Failed on appdata validation but it doesn't affect function, disable test for now
    %ninja_check
patterns   :
    - libs :
        - /usr/lib64/girepository-1.0/PapersDocument-4.0.typelib
        - /usr/lib64/girepository-1.0/PapersView-4.0.typelib
        - /usr/lib64/libppsdocument-4.0.so.6.*
        - /usr/lib64/libppsview-4.0.so.5.*
        - /usr/lib64/papers/
        - /usr/share/metainfo/org.gnome.Papers.ComicsDocument.metainfo.xml
        - /usr/share/metainfo/org.gnome.Papers.DjvuDocument.metainfo.xml
        - /usr/share/metainfo/org.gnome.Papers.PdfDocument.metainfo.xml
        - /usr/share/metainfo/org.gnome.Papers.TiffDocument.metainfo.xml
    - previewer :
        - /usr/bin/papers-previewer
        - /usr/share/man/man1/papers-previewer.1*
        - /usr/share/applications/org.gnome.Papers-previewer.desktop
    - nautilus :
        - /usr/lib64/nautilus/extensions-4/
    - thumbnailer :
        - /usr/bin/papers-thumbnailer
        - /usr/share/thumbnailers/
        - /usr/share/man1/papers-thumbnailer.1*
