# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pangomm-2.48
version    : 2.58.0
release    : 6
source     :
    - https://download.gnome.org/sources/pangomm/2.58/pangomm-2.58.0.tar.xz : 217514c1a65035c2fce6e69e33b0d92bafa2594cc474e995a4473441b10f3a33
homepage   : https://gtkmm.org
license    : LGPL-2.0-or-later
component  : desktop.library
summary    : C++ bindings to pango
description: |
    C++ bindings to pango
optimize   : speed
builddeps  :
    - pkgconfig(cairomm-1.16)
    - pkgconfig(glibmm-2.68)
    - pkgconfig(mm-common-util)
    - pkgconfig(pangocairo)
    - pkgconfig(sigc++-3.0)
    - doxygen
    - graphviz
patterns   :
    devel : /usr/lib64/pangomm-2.48
setup      : |
    %meson_configure -Dmaintainer-mode=true
build      : |
    %ninja_build
install    : |
    %ninja_install
