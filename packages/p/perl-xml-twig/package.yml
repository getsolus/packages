# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-xml-twig
version    : '3.54'
release    : 10
source     :
    - http://search.cpan.org/CPAN/authors/id/M/MI/MIROD/XML-Twig-3.54.tar.gz : 0b744a9737a070f95c32154afd526bf5ebe76a59feb8bc1f5dbc6cdaa5e0e529
homepage   : https://metacpan.org/pod/XML::Twig
license    : Artistic-1.0-Perl
component  : programming.perl
summary    : Perl XML module
description: |
    This module provides a way to process XML documents. It is build on top of XML::Parser.
builddeps  :
    - perl
    - perl-xmlparser
rundeps    :
    - perl-xmlparser
setup      : |
    perl Makefile.PL -y PREFIX=/usr INSTALLDIRS=vendor DESTDIR=${installdir}
build      : |
    %perl_build
install    : |
    %perl_install
patterns   : /*
