# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-locale-codes
version    : '3.90'
release    : 6
source     :
    - https://cpan.metacpan.org/authors/id/S/SB/SBECK/Locale-Codes-3.90.tar.gz : 984cd90bdc99e85316fc9553353e44363cd317dcde9e4d24f4dac45bc6feb46d
homepage   : https://metacpan.org/pod/Locale::Codes
license    : Artistic-1.0-Perl
component  : programming.perl
summary    : Locale::Language - module for dealing with language code sets
