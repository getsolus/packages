# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-xml-libxml
version    : '2.0213'
release    : 12
source     :
    - https://cpan.metacpan.org/authors/id/T/TO/TODDR/XML-LibXML-2.0213.tar.gz : 2af21c5d61ac34ea26a5fabf15ba5a5841e648f7189db3e33b6f28b5489802ab
homepage   : https://metacpan.org/pod/XML::LibXML
license    : GPL-2.0-or-later
component  : programming.perl
summary    : This module is an interface to libxml2
description: |
    This module is an interface to libxml2, providing XML and HTML parsers with DOM, SAX and XMLReader interfaces, a large subset of DOM Layer 3 interface and a XML::XPath-like interface to XPath API of libxml2
builddeps  :
    - pkgconfig(liblzma)
    - perl-alien-libxml2
    - perl-capture-tiny
    - perl-path-tiny
rundeps    :
    - perl-alien-libxml2
    - perl-file-slurp-tiny
    - perl-xml-saxbase
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license LICENSE
patterns   : /*
