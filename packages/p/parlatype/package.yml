# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : parlatype
version    : '4.3'
release    : 8
source     :
    - https://github.com/gkarsay/parlatype/releases/download/v4.3/parlatype-4.3.tar.gz : b942ec53d93cf823ebbbe9153c7b5855f404d4ac4680881dc921f490ec59dda7
homepage   : https://www.parlatype.xyz
license    :
    - CC-BY-SA-3.0
    - CC-BY-SA-4.0
    - GPL-3.0-or-later
component  : multimedia.audio
summary    : Parlatype (GNOME audio player for transcription)
description: |
    Parlatype is a minimal audio player for manual speech transcription, written for the GNOME desktop environment. It plays audio sources to transcribe them in your favourite text application.
builddeps  :
    - pkgconfig(gstreamer-audio-1.0)
    - pkgconfig(gtk-doc)
    - pkgconfig(gtk4)
    - pkgconfig(libadwaita-1)
    - itstool
rundeps    :
    - gstreamer-plugins-good
    - gstreamer-plugins-ugly
setup      : |
    %meson_configure -Dgir=true -Dgtk-doc=true
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING COPYING_CCBYSA
