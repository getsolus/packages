# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : poco
version    : 1.15.3
release    : 10
source     :
    - https://github.com/pocoproject/poco/archive/refs/tags/poco-1.15.3-release.tar.gz : 4f112fea59e0c65f0fffe30a4957f8d66cf41528c21dd9903e6d7550022c794e
license    : BSL-1.0
homepage   : https://pocoproject.org
component  :
    - programming.library
    - tools : programming.tools
summary    : C++ libraries for building network- and internet-based applications
description: |
    The POCO C++ Libraries are powerful cross-platform C++ libraries for building network- and internet-based applications that run on desktop, server, mobile, IoT, and embedded systems.
builddeps  :
    - pkgconfig(expat)
    - pkgconfig(libpcre2-posix)
    - pkgconfig(libutf8proc)
    - pkgconfig(sqlite3)
    - pkgconfig(zlib)
patterns   :
    - tools : /usr/bin/*
setup      : |
    %cmake_ninja \
      -D POCO_UNBUNDLED=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
