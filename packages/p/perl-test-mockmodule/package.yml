# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-test-mockmodule
version    : 0.185.3
release    : 10
source     :
    - https://cpan.metacpan.org/authors/id/G/GF/GFRANKS/Test-MockModule-v0.185.3.tar.gz : 92e6de1caf40c38d5557ad2192e1a34f7a518a9101bc6af953b23bcfcffc52d3
homepage   : https://metacpan.org/release/Test-MockModule
license    : Artistic-1.0-Perl
component  : programming.perl
summary    : Test::MockModule - mock subroutines in a module
description: |
    Test::MockModule lets you temporarily redefine subroutines in other packages for the purposes of unit testing.
builddeps  :
    - perl-module-build
    - perl-sub-identify
    - perl-super
    - perl-test-pod
    - perl-test-pod-coverage
    - perl-test-warnings
rundeps    :
    - perl-super
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license LICENSE
check      : |
    %perl_build test
patterns   : /*
