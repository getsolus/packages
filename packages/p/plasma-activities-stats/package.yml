# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : plasma-activities-stats
version    : 6.8.1
release    : 53
source     :
    - https://download.kde.org/stable/plasma/6.8.1/plasma-activities-stats-6.8.1.tar.xz : 561c0d28f4ed3d534cf94fad0c62159d556bf3a4ed2396284be06f13dc802907
homepage   : https://invent.kde.org/plasma/plasma-activities-stats
license    :
    - CC0-1.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
component  : desktop.library
