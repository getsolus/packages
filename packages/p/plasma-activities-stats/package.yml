# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : plasma-activities-stats
version    : 6.8.2
release    : 54
source     :
    - https://download.kde.org/stable/plasma/6.8.2/plasma-activities-stats-6.8.2.tar.xz : 6c641f2faa08c777239513a5a6c05900b5f6e237350c9e57af42825ce26098ce
homepage   : https://invent.kde.org/plasma/plasma-activities-stats
license    :
    - CC0-1.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
component  : desktop.library
