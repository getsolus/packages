# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pelican
version    : 4.12.0
release    : 12
source     :
    - https://github.com/getpelican/pelican/archive/4.12.0.tar.gz : 0c87c230ec6cc07a1ed181c312242517f1eface73d6b5f6b6001d6ed991b0148
homepage   : https://getpelican.com/
license    : AGPL-3.0-only
component  : programming
summary    : Static site generator that supports Markdown and reST syntax. Powered by Python
description: |
    Pelican is a static site generator written in Python.
    It uses Markdown and reStrcturedText for writing content, inclues a simple command line tool to (re)generate site files.
builddeps  :
    - python-build
    - python-installer
    - python-pdm-backend
    - python-setuptools
    - python-sphinx
    - python-wheel
rundeps    :
    - python-blinker
    - python-dateutil
    - python-docutils
    - python-feedgenerator
    - python-jinja
    - python-markdown
    - python-pytz
    - python-rich
    - python-six
    - python-unidecode
    - python-watchfiles
build      : |
    %pyproject_build
install    : |
    %pyproject_install
