# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pulseaudio-qt
version    : 1.9.0
release    : 11
source     :
    - https://download.kde.org/stable/pulseaudio-qt/pulseaudio-qt-1.9.0.tar.xz : c2aace3ac1a9c8c9b9c57ba0ffc99a3d310737cc004db0491802e03536e27c69
license    :
    - CC0-1.0
    - LGPL-2.1-only
    - LGPL-3.0-only
component  : desktop.kde
homepage   : https://invent.kde.org/libraries/pulseaudio-qt
summary    : Qt framework C++ bindings library for the PulseAudio sound system
description: |
    Qt framework C++ bindings library for the PulseAudio sound system
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6Designer)
    - pkgconfig(libpulse)
    - extra-cmake-modules
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
