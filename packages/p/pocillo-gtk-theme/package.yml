# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pocillo-gtk-theme
version    : 0.13.0
release    : 8
source     :
    - https://github.com/UbuntuBudgie/pocillo-gtk-theme/archive/refs/tags/v0.13.0.tar.gz : b13235c33d381ed7eb979fc8416551eec01a2cb3ceb9486ba3da65568f23d9c2
homepage   : https://github.com/UbuntuBudgie/pocillo-gtk-theme
license    : GPL-2.0-or-later
component  :
    - desktop.theme
    - slim : desktop.theme
summary    : Material Design GTK Theme
description: |
    GTK based theme for the Budgie Desktop that has Material Design elements and styled using the Arc colour palette.
networking : true
builddeps  :
    - pkgconfig(gtk4)
    - nodejs
    - sassc
rundeps    :
    - gtk-engines
    - gtk2-engine-murrine
    - slim :
        - pocillo-gtk-theme
patterns   :
    - slim : /usr/share/themes/*slim*
setup      : |
    %meson_configure \
        -Dtheme_name=Pocillo
build      : |
    %meson_build
install    : |
    %meson_install

    rm -rf $installdir/usr/share/themes/*/INSTALL_GDM_THEME.md
