# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-module-build-tiny
version    : '0.053'
release    : 10
source     :
    - https://cpan.metacpan.org/authors/id/L/LE/LEONT/Module-Build-Tiny-0.053.tar.gz : 3726d622da6f655e88fdf89e4fd597709c44970b47de65082003e8d86b5e193a
homepage   : https://metacpan.org/pod/Module::Build::Tiny
license    : Artistic-1.0-Perl
component  : programming.perl
summary    : A tiny replacement for Module::Build
description: |
    Module::Build::Tiny - A tiny replacement for Module::Build
builddeps  :
    - perl-extutils-config
    - perl-extutils-helpers
    - perl-extutils-installpaths
setup      : |
    %perl_setup --installdirs=vendor
build      : |
    %perl_build
install    : |
    $workdir/Build install --destdir=${installdir}
check      : |
    $workdir/Build test
patterns   : /*