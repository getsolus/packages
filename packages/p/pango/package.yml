# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
# Updating this package? Remember to update pangomm-2.48 alongside it.
name       : pango
version    : 1.58.0
release    : 65
source     :
    - https://download.gnome.org/sources/pango/1.58/pango-1.58.0.tar.xz : bc5bad6213ad4886a47d1e80292fd850b64159b50db67917a43d9ea80ee2298a
homepage   : https://www.gtk.org/docs/architecture/pango
license    : LGPL-2.0-or-later
component  : desktop.library
summary    : pango (Library for laying out and rendering text)
description: |
    Pango is a library used for laying out and rendering text with an emphasis on internationalization.
emul32     : true
optimize   :
    - speed
    - lto
builddeps  :
    - pkgconfig32(cairo)
    - pkgconfig32(expat)
    - pkgconfig32(fontconfig)
    - pkgconfig32(freetype2)
    - pkgconfig32(fribidi)
    - pkgconfig32(gobject-2.0)
    - pkgconfig32(harfbuzz)
    - pkgconfig32(json-glib-1.0)
    - pkgconfig32(libthai)
    - pkgconfig32(x11)
    - pkgconfig32(xft)
    - pkgconfig32(xrender)
    - pkgconfig32(xshmfence)
    - pkgconfig(gtk-doc)
setup      : |
    if [[ ! -z "${EMUL32BUILD}" ]]; then
        build_gobject="disabled"
    else
        build_gobject="enabled"
    fi
    %meson_configure \
        -Ddocumentation=false \
        -Dintrospection=${build_gobject}
build      : |
    %ninja_build
profile    : |
    %ninja_check || :
install    : |
    %ninja_install
    %install_license COPYING
check      : |
    %ninja_check || :
