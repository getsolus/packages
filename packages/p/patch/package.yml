# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : patch
version    : 2.8.1
release    : 12
source     :
    - https://ftp.gnu.org/gnu/patch/patch-2.8.1.tar.xz : 3240c7959c5347c8ed347e3c4201c0337bf4240d5cf09d68889e58eeaba30e17
homepage   : https://savannah.gnu.org/projects/patch
license    : GPL-3.0-or-later
component  : system.devel
summary    : patch (patches source files)
description: |
    patch takes other "patch" files created between an original and changed version and applies them to original files, producing a changed version.
builddeps  :
    - pkgconfig(libattr)
checkdeps  :
    - ed
setup      : |
    %configure
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
check      : |
    %make check
