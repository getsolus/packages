# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : plank-reloaded
version    : 0.11.178
release    : 3
source     :
    - https://github.com/zquestz/plank-reloaded/archive/refs/tags/0.11.178.tar.gz : 4350d85c36db6030958b948f4d21f1664b8ec7db589695513e2d4dcc6326d6e6
homepage   : https://github.com/zquestz/plank-reloaded
license    :
    - GPL-3.0-or-later
    - LGPL-2.1-or-later
component  : desktop
summary    : A lightweight, customizable Linux dock optimized for Cinnamon, Xfce, MATE, and other X11 desktops with modern docklets and GTK theme support.
description: |
    Fork of the original plank project
    A lightweight, customizable Linux dock optimized for Cinnamon, Xfce, MATE, and other X11 desktops with modern docklets and GTK theme support.
replaces   : plank
builddeps  :
    - pkgconfig(dbusmenu-glib-0.4)
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(gee-0.8)
    - pkgconfig(glib-2.0)
    - pkgconfig(gtk4)
    - pkgconfig(libbamf3)
    - pkgconfig(libcanberra)
    - pkgconfig(libgnome-menu-3.0)
    - pkgconfig(libwnck-3.0)
    - pkgconfig(x11)
    - desktop-file-utils
    - vala
setup      : |
    %meson_configure \
        -Denable-dbusmenu=yes \
        -Dproduction-release=true \
        -Denable-apport=false \
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING*
