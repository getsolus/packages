# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : proton-vpn-daemon
version    : 0.14.2
release    : 5
source     :
    - https://github.com/ProtonVPN/proton-vpn-daemon/archive/refs/tags/v0.14.2.tar.gz : b072fdb85f0d72112c6986f433b21ebc93e0a19dbdedd5eb3eb83783956478f9
homepage   : https://github.com/ProtonVPN/proton-vpn-daemon
license    : GPL-3.0-or-later
