# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : proton-vpn-daemon
version    : 0.14.1
release    : 4
source     :
    - https://github.com/ProtonVPN/proton-vpn-daemon/archive/refs/tags/v0.14.1.tar.gz : 981f3d65e580691be38c08deded0cc67ea07f4db1f97379a949604f18bce91e7
homepage   : https://github.com/ProtonVPN/proton-vpn-daemon
license    : GPL-3.0-or-later
