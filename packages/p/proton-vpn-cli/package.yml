# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : proton-vpn-cli
version    : 1.1.1
release    : 7
source     :
    - https://github.com/ProtonVPN/proton-vpn-cli/archive/refs/tags/v1.1.1.tar.gz : b914b50bfbdd447a9c5eb09eed2de00475c729e672410f754070de730d117396
homepage   : https://github.com/ProtonVPN/proton-vpn-cli
license    : GPL-3.0-or-later
component  : network.clients
summary    : Official ProtonVPN CLI Linux app
description: |
    Official ProtonVPN CLI Linux app
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - proton-vpn-daemon
    - python-click
    - python-dbus-fast
    - python-proton-core
    - python-proton-keyring-linux
    - python-proton-vpn-core-api
    - python-tabulate
build      : |
    %pyproject_build
install    : |-
    %pyproject_install
    %install_license COPYING.md LICENSE
