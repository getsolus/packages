# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : proton-vpn-cli
version    : 1.1.0
release    : 6
source     :
    - https://github.com/ProtonVPN/proton-vpn-cli/archive/refs/tags/v1.1.0.tar.gz : 6911b3a9fe7872db5d0d7e835787007cc9dfa1d09a9ff92f906c1004c6339901
homepage   : https://github.com/ProtonVPN/proton-vpn-cli
license    : GPL-3.0-or-later
component  : network.clients
summary    : Official ProtonVPN CLI Linux app
description: |
    Official ProtonVPN CLI Linux app
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - proton-vpn-daemon
    - python-click
    - python-dbus-fast
    - python-proton-core
    - python-proton-keyring-linux
    - python-proton-vpn-core-api
    - python-tabulate
build      : |
    %pyproject_build
install    : |-
    %pyproject_install
    %install_license COPYING.md LICENSE
