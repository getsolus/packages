# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : proton-vpn-cli
version    : 1.0.2
release    : 4
source     :
    - https://github.com/ProtonVPN/proton-vpn-cli/archive/refs/tags/v1.0.2.tar.gz : 102c893feb2999b8435880720d161f0f515c59c5b267ddbbc420a5d543378556
homepage   : https://github.com/ProtonVPN/proton-vpn-cli
license    : GPL-3.0-or-later
component  : network.clients
summary    : Official ProtonVPN CLI Linux app
description: |
    Official ProtonVPN CLI Linux app
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - proton-vpn-daemon
    - python-dbus-fast
    - python-proton-core
    - python-proton-keyring-linux
    - python-proton-vpn-core-api
    - python-proton-vpn-local-agent
    - python-tabulate
build      : |
    %python3_setup
install    : |-
    %python3_install
    %install_license COPYING.md LICENSE
