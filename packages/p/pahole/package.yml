# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pahole
version    : '1.32'
release    : 7
source     :
    - https://fedorapeople.org/~acme/dwarves/dwarves-1.32.tar.xz : 319cbf319e9fc92065a5407ce47eb868d73566f3d4840a56832734e4579df947
homepage   : https://git.kernel.org/pub/scm/devel/pahole/pahole.git
license    : GPL-2.0-only
component  : system.utils
summary    : Pahole and other DWARF utils
description: |
    Pahole and other DWARF utils
builddeps  :
    - pkgconfig(libbpf)
    - pkgconfig(libdw)
    - pkgconfig(libelf)
clang      : true
optimize   : thin-lto
setup      : |
    %patch -p1 -i $pkgfiles/python.diff
    %cmake_ninja \
        -D__LIB=lib64 \
        -DLIBBPF_EMBEDDED=OFF \
build      : |
    %ninja_build
install    : |
    %ninja_install
