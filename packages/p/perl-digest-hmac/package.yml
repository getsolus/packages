# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-digest-hmac
version    : '1.05'
release    : 8
source     :
    - https://cpan.metacpan.org/authors/id/A/AR/ARODLAND/Digest-HMAC-1.05.tar.gz : 215cb59cba610745cfb2d4b3f8ef756d590e57e3ad7986a992e87c4969fcdc7a
