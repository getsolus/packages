# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : perl-datetime
version    : '1.66'
release    : 15
source     :
    - https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/DateTime-1.66.tar.gz : afabd686fb83d3ebf49ee453974f9122f3eec9b25ff8d2ddf4f12de92af1e5e2
homepage   : https://metacpan.org/pod/DateTime
license    : Artistic-2.0
component  : programming.perl
summary    : DateTime - A date and time object for Perl
description: |
    DateTime is a class for the representation of date/time combinations, and is part of the Perl DateTime project.
checkdeps  :
    - perl-cpan-meta-check
    - perl-datetime-locale
    - perl-datetime-timezone
    - perl-test-warnings
    - perl-test-without-module
rundeps    :
    - perl-datetime-locale
    - perl-datetime-timezone
    - perl-dist-checkconflicts
    - perl-namespace-autoclean
    - perl-params-validationcompiler
    - perl-specio-exporter
    - perl-try-tiny
setup      : |
    %perl_setup
build      : |
    %perl_build
install    : |
    %perl_install
    %install_license LICENSE
check      : |
    %perl_build test
patterns   : /*
