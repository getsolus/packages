# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : aerc
version    : 0.22.0
release    : 4
source     :
    - https://git.sr.ht/~rjarry/aerc/archive/0.22.0.tar.gz : f1cd5e358fd836051d4d88c189ecaa025a108b729281985525b45b13bc49e70f
homepage   : https://aerc-mail.org
license    : MIT
component  : network.mail
summary    : An email client for your terminal.
description: |
    aerc is an email client that runs in your terminal. It's highly efficient and extensible, perfect for the discerning hacker.
networking : true
builddeps  :
    - golang
    - scdoc
build      : |
    %make
install    : |
    %make_install PREFIX=/usr
    %install_license LICENSE
