# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : android-tools
version    : 37.0.0
release    : 30
source     :
    - https://github.com/nmeum/android-tools/releases/download/37.0.0/android-tools-37.0.0.tar.xz : 2725d09f892a3a38e534429f47a321f58ecf6a3169caa42c915fb2cb7d46be0e
    - https://github.com/M0Rf30/android-udev-rules/archive/refs/tags/20250525.tar.gz#android-udev-rules.tar.gz : 582bf8daa23f318047e77ece4c101c8696fd9151c459f695dca56cf4a40a72a2
homepage   : https://developer.android.com/studio/releases/platform-tools
license    :
    - Apache-2.0
    - GPL-3.0-or-later
summary    : Android development tools (adb and fastboot)
component  : programming.tools
description: |
    Android development tools, this includes adb (android debug bridge) and fastboot (diagnostic protocol for androids fastboot bootloader)
clang      : true
networking : true
fatfakeroot: true
builddeps  :
    - pkgconfig(fmt)
    - pkgconfig(libbrotlicommon)
    - pkgconfig(liblz4)
    - pkgconfig(libpcre2-8)
    - pkgconfig(libusb-1.0)
    - pkgconfig(libzstd)
    - pkgconfig(protobuf)
    - golang
setup      : |
    # From AerynOS: LOG() clashes with protobuf 36 macros
    %patch -p1 -i ${pkgfiles}/0001-ftbfs-protobuf-36.0.patch

    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %ninja_install

    mkdir android-udev-rules
    tar --strip-components=1 -xf ${sources}/android-udev-rules.tar.gz -C android-udev-rules
    %install_file android-udev-rules/51-android.rules ${installdir}/usr/lib/udev/rules.d/51-android.rules

    %install_license LICENSE
    %install_file android-udev-rules/LICENSE ${installdir}/usr/share/licenses/android-udev-rules/LICENSE
