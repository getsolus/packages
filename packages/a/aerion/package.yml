# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : aerion
version    : 0.3.3
release    : 5
source     :
    - https://github.com/hkdb/aerion/archive/refs/tags/v0.3.3.tar.gz : 31be6df533ccb03ee158b5d886acb90a67f23587ab9f49ecf58b1fca77d134f3
homepage   : https://aerion.3df.io/
license    : Apache-2.0
component  : network.mail
summary    : Lightweight open-source email client
description: |
    Aerion is a modern, lightweight email client inspired by Geary, focused on
    resource efficiency and a clean user experience. It supports Gmail, Outlook,
    Microsoft 365, and generic IMAP/SMTP, with conversation threading, rich text
    composition, contact sync, PGP/S/MIME, and multiple color themes.
networking : true
builddeps  :
    - pkgconfig(glib-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(webkit2gtk-4.1)
    - golang
    - nodejs
environment: |
    export CGO_ENABLED=1
    export CGO_CFLAGS="${CFLAGS}"
    export CGO_CXXFLAGS="${CXXFLAGS}"
    export CGO_LDFLAGS="${LDFLAGS}"
    export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
setup      : |
    go mod download -x
build      : |
    pushd frontend
    npm install
    npm run build
    popd

    go build -tags desktop,webkit2_41,production -ldflags "-w -s -linkmode=external" -o aerion .
install    : |
    %install_bin aerion
    %install_file build/appicon.png ${installdir}/usr/share/icons/hicolor/256x256/apps/io.github.hkdb.Aerion.png
    %install_file build/linux/aerion.desktop ${installdir}/usr/share/applications/io.github.hkdb.Aerion.desktop

    %install_file build/flatpak/io.github.hkdb.Aerion.metainfo.xml -t ${installdir}/usr/share/metainfo
    %install_license LICENSE
