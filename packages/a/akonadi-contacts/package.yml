    Libraries and daemons to implement Contact Management in Akonadi.
builddeps  :
    - akonadi-devel
    - grantleetheme-devel
    - kf6-kcontacts-devel
    - kf6-kiconthemes-devel
    - kf6-kio-devel
    - kf6-kmime-devel
    - kf6-ktextwidgets-devel
    - kf6-kxmlgui-devel
    - kf6-prison-devel
    - kf6-syntax-highlighting-devel
    - ktextaddons-devel
rundeps    :
    - devel :
        - akonadi-devel
        - grantleetheme-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
