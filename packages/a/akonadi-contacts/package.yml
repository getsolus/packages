# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : akonadi-contacts
version    : 26.08.2
release    : 107
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/akonadi-contacts-26.08.2.tar.xz : 18e5ae5796fba0bcc9e196b1e4afc52d704da067d4567aec9b0013e02f3fcb0f
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
    - MIT
component  : desktop.library
summary    : Libraries and daemons to implement Contact Management in Akonadi
