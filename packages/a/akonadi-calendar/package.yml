# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : akonadi-calendar
version    : 26.08.1
release    : 105
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/akonadi-calendar-26.08.1.tar.xz : 7fd92f7b4be2b36ff33b96ec8668285b967d3a0dcd26d61ac9826524dc99cfba
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
    - MIT
component  : desktop.library
summary    : Library that effectively bridges the type-agnostic API of the Akonadi client libraries and the domain-specific KCalCore library
description: |
    Akonadi Calendar is a library that effectively bridges the type-agnostic API of the Akonadi client libraries and the domain-specific KCalCore library. It provides jobs, models and other helpers to make working with events and calendars through Akonadi easier.
builddeps  :
    - pkgconfig(KF6CalendarCore)
    - akonadi-contacts-devel
    - akonadi-mime-devel
    - kcalutils-devel
    - kf6-kdbusaddons-devel
    - kf6-kio-devel
    - kf6-kmime-devel
    - kf6-knotifications-devel
    - kf6-kxmlgui-devel
    - kf6-sonnet-devel
    - kf6-syntax-highlighting-devel
    - kidentitymanagement-devel
    - kmailtransport-devel
    - libkleo-devel
    - messagelib-devel
rundeps    :
    - devel :
        - akonadi-devel
        - kf6-kcalendarcore-devel
        - kf6-ki18n-devel
        - kf6-kwidgetsaddons-devel
        - kidentitymanagement-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6 \
        -DBUILD_PYTHON_BINDINGS=OFF
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
