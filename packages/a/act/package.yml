# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : act
version    : 0.2.89
release    : 1
source     :
    - https://github.com/nektos/act/archive/refs/tags/v0.2.89.tar.gz : 649cd5b91cad870871d2283fb3ad95c8fa1d5ced7a1db8d7b346d1a7dcd3ec71
homepage   : https://nektosact.com/
license    : MIT
component  : programming.tools
summary    : A tool to run your GitHub Actions locally
description: |
    Act is a tool to let you run and test your GitHub repo's workflows locally using Docker.
networking : true
builddeps  :
    - golang
rundeps    :
    - docker
build      : |
    %make build VERSION=%version%
install    : |
    %install_bin ./dist/local/act
    %install_license LICENSE
