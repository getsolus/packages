# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : act
version    : 0.2.94
release    : 2
source     :
    - https://github.com/nektos/act/archive/refs/tags/v0.2.94.tar.gz : 0e1881bcf1cc9217d1ff8f4c5dba56004a0609502e55b059c0518f4c49153a9a
homepage   : https://nektosact.com/
license    : MIT
component  : programming.tools
summary    : A tool to run your GitHub Actions locally
description: |
    Act is a tool to let you run and test your GitHub repo's workflows locally using Docker.
networking : true
builddeps  :
    - golang
rundeps    :
    - docker
build      : |
    %make build VERSION=%version%
install    : |
    %install_bin ./dist/local/act
    %install_license LICENSE
