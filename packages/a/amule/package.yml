# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : amule
version    : 3.2.0
release    : 33
source     :
    - https://github.com/amule-org/amule/releases/download/3.2.0/aMule-3.2.0-src.tar.gz : 
        9c060a79fe5444b2700b4e3c8c6162032cd56dd4a242d384d7ff95d977c288d1
homepage   : https://amule-org.github.io/
license    : GPL-2.0-or-later
component  : network.util
summary    : aMule is a multi-platform ed2k client, fork of the eMule client
description: |
    aMule is a multi-platform ed2k client, fork of the eMule client
builddeps  :
    - pkgconfig(gdlib)
    - pkgconfig(libmaxminddb)
    - pkgconfig(libpng)
    - pkgconfig(libupnp)
    - cryptopp-devel
    - libboost-devel
    - wxwidgets-devel
setup      : |
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE.md
    rm ${installdir}/usr/share/doc/amule/LICENSE.md
