# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ansible
version    : 2.21.4
release    : 74
source     :
    - https://github.com/ansible/ansible/archive/refs/tags/v2.21.4.tar.gz : f27a5c4177c605a1abaf25b517171ae0a31477c7d38bd81a186ff78a8480d29b
license    : GPL-3.0-or-later
homepage   : https://www.ansible.com/
component  : system.utils
summary    : Ansible is a radically simple IT automation system
description: |
    Ansible is a radically simple IT automation system
builddeps  :
    - pkgconfig(python3)
    - asciidoc
    - python-build
    - python-docutils
    - python-installer
    - python-jinja
    - python-setuptools
    - python-wheel
rundeps    :
    - python-jinja
    - python-jmespath
    - python-paramiko
    - python-resolvelib
    - pyyaml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_license COPYING
