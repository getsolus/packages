# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ansible
version    : 2.21.3
release    : 73
source     :
    - https://github.com/ansible/ansible/archive/refs/tags/v2.21.3.tar.gz : 23703309ab32e8e801a9ae2a3cd9a02f0cd5839d201316170fdd9fb6b92a4590
license    : GPL-3.0-or-later
homepage   : https://www.ansible.com/
component  : system.utils
summary    : Ansible is a radically simple IT automation system
description: |
    Ansible is a radically simple IT automation system
builddeps  :
    - pkgconfig(python3)
    - asciidoc
    - python-build
    - python-docutils
    - python-installer
    - python-jinja
    - python-setuptools
    - python-wheel
rundeps    :
    - python-jinja
    - python-jmespath
    - python-paramiko
    - python-resolvelib
    - pyyaml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_license COPYING
