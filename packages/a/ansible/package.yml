# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ansible
version    : 2.22.0
release    : 75
source     :
    - https://github.com/ansible/ansible/archive/refs/tags/v2.22.0.tar.gz : 2cb7fba15ecef48e7cbb8b18430fd4b932502d8904fd0897c4893a3825aac536
license    : GPL-3.0-or-later
homepage   : https://www.ansible.com/
component  : system.utils
summary    : Ansible is a radically simple IT automation system
description: |
    Ansible is a radically simple IT automation system
builddeps  :
    - pkgconfig(python3)
    - asciidoc
    - python-build
    - python-docutils
    - python-installer
    - python-jinja
    - python-setuptools
    - python-wheel
rundeps    :
    - python-jinja
    - python-jmespath
    - python-paramiko
    - python-resolvelib
    - pyyaml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_license COPYING
