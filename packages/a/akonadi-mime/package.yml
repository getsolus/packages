# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : akonadi-mime
version    : 26.08.2
release    : 111
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/akonadi-mime-26.08.2.tar.xz : 1f260c099b01ff5eefcba3c9d706b7ece17b251a5719afa43d8f40cdef0daaf5
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-only
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
    - LGPL-3.0-only
    - MIT
component  : desktop.library
summary    : Akonadi Mime is a library that effectively bridges the type-agnostic API of the Akonadi client libraries and the domain-specific KMime library
description: |
    Akonadi Mime is a library that effectively bridges the type-agnostic API of the Akonadi client libraries and the domain-specific KMime library. It provides jobs, models and other helpers to make working with emails through Akonadi easier.
builddeps  :
    - pkgconfig(libxslt)
    - akonadi-devel
    - kf6-kio-devel
    - kf6-kitemmodels-devel
    - kf6-kmime-devel
    - kf6-kxmlgui-devel
    - qt6-base-private-devel
rundeps    :
    - devel :
        - akonadi-devel
        - kf6-kmime-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
