# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : apparmor
version    : 5.0.2
release    : 38
source     :
    - https://gitlab.com/apparmor/apparmor/-/archive/v5.0.2/apparmor-v5.0.2.tar.gz : bef45f228c0bde2f80d9630084e56bd8020b3fc4dfa7ee48a6aca585bb5ea0ed
license    :
    - GPL-2.0-only
    - LGPL-2.1-or-later
component  : system.base
homepage   : https://gitlab.com/apparmor/apparmor
summary    : AppArmor LSM user-space component
description: |
    AppArmor LSM user-space component
builddeps  :
    - pkgconfig(python3)
    - autoconf-archive
    - python-setuptools
    - swig
checkdeps  :
    - dejagnu
    - perl-gettext
    - pyflakes
rundeps    :
    - aa-lsm-hook
    - python-notify2
    - python3
networking : true
environment: |
    export PYTHON=/usr/bin/python3
    export PYTHON_VERSION=3
    export PYTHON_VERSIONS=python3
setup      : |
    %apply_patches
    # You can't build this with --disable-static since the libraries here need to statically compile it
    cd libraries/libapparmor
    %autogen --with-python
build      : |
    %make -C libraries/libapparmor
    %make -C binutils
    %make -C parser
    %make -C profiles
    %make -C utils
    %make -C changehat/pam_apparmor
install    : |
    install -dm0644 $installdir/lib/apparmor

    # TODO: Validate profiles, tools, etc, and make stateless!
    %make_install -C libraries/libapparmor
    %make_install -C binutils
    %make_install -C parser
    %make_install -C init install-systemd
    %make_install -C utils
    %make_install -C changehat/pam_apparmor
    %make_install -C profiles

    # Enable apparmor service by default
    install -Dm00644 -t ${installdir}/%libdir%/systemd/system-preset/ ${pkgfiles}/20-apparmor.preset

    install -Dm 00644 $pkgfiles/apparmor.tmpfiles $installdir/usr/lib/tmpfiles.d/apparmor.conf

    # For now remove unvalidated profiles..
    rm -v $installdir/etc/apparmor.d/*.*.*

    # Disable apparmor for php-fpm systemd service
    rm -v $installdir/etc/apparmor.d/php-fpm

    # Disable apparmor for samba
    find $installdir/etc/apparmor.d/ \( -path '*smb*' -o -path '*samba*' -o -path '*nmb*' \) \( -print -a -delete \)
    sed -i '/smbpass/d' $installdir/etc/apparmor.d/abstractions/authentication

    # Move some things into /usr
    mv $installdir/lib/*  $installdir/usr/lib64/
    mv $installdir/sbin/* $installdir/usr/sbin/
    rmdir $installdir/lib $installdir/sbin

    # Cleanup
    #rmdir $installdir/etc/apparmor.d/disable
    # TODO: fix /etc/apparmor.d/abstractions/authentication

    %install_license LICENSE
