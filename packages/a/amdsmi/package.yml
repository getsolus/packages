# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : amdsmi
version    : '7.14'
release    : 1
source     :
    - git|https://github.com/ROCm/rocm-systems.git : 2b22ab0195cc1461cd9abf3b969e9dd7c10af350
homepage   : https://github.com/ROCm/rocm-systems
license    : MIT
component  : programming.devel
summary    : AMD System Management Interface (AMD SMI) library
description: |
    ROCm System Management Interface Library
# TODO(GZGavinZhao): the build system is tightly coupled to pull esmi from the
# network...
networking : true
builddeps  :
    - pkgconfig(libdrm)
    - pkgconfig(libmnl)
    - pkgconfig(libnl-3.0)
    - rocm-cmake
setup      : |
    %patch -p1 -i $pkgfiles/0001-amdsmi-Don-t-install-libamdsminic.a.patch

    %cmake_ninja -S projects/amdsmi -L \
      -DCMAKE_INSTALL_LIBDIR=lib%LIBSUFFIX% \
      -DBUILD_SHARED_LIBS=ON \
      -DAUTO_BUILD_STATIC_LIBS=OFF
build      : |
    %ninja_build
install    : |
    %ninja_install
