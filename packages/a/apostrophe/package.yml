# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : apostrophe
version    : '3.5'
release    : 20
source     :
    - https://gitlab.gnome.org/World/apostrophe/-/archive/v3.5/apostrophe-v3.5.tar.gz : 67db4b783e0a69eb22cb393e92e91f53fb48d72598379a5829b7d05d95dc3149
homepage   : https://world.pages.gitlab.gnome.org/apostrophe/
license    : GPL-3.0-or-later
component  : office.notes
summary    : Distraction free Markdown editor
description: |
    Apostrophe is a GTK+ based distraction free Markdown editor, mainly developed by Wolf Vollprecht and Manuel Genovés. It uses pandoc as backend for markdown parsing and offers a very clean and sleek user interface.
replaces   :
    - uberwriter
builddeps  :
    - pkgconfig(libadwaita-1)
rundeps    :
    - font-fira-ttf
    - libadwaita
    - libspelling
    - libwebkit-gtk6
    - pyenchant
    - python-chardet
    - python-gobject
    - python-levenshtein
    - python-pypandoc
    - python-regex
    - python-weasyprint
setup      : |
    # Upstream depends on pandoc >3.11, use flag compatible with our pandoc
    %patch -p1 -i $pkgfiles/0001-Use-valid-pandoc-flag.patch
    # https://gitlab.gnome.org/World/apostrophe/-/merge_requests/338
    %patch -p1 -i $pkgfiles/338.patch
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
