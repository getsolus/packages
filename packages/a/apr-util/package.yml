# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : apr-util
version    : 1.6.4
release    : 21
source     :
    - https://dlcdn.apache.org//apr/apr-util-1.6.4.tar.bz2 : 3e2ae08f40efa0c3701e54a954cefa08242de22a69f91a8ae44fc1e624ba309b
homepage   : https://apr.apache.org/
license    : Apache-2.0
component  : programming
summary    : apr-util provides a number of abstractions for Apache apr
description: |
    apr-util provides a number of abstractions for Apache apr
builddeps  :
    - pkgconfig(apr-1)
    - pkgconfig(expat)
    - pkgconfig(ldap)
    - pkgconfig(libpq)
    - pkgconfig(libxcrypt)
    - pkgconfig(nss)
    - pkgconfig(openssl)
    - pkgconfig(sqlite3)
    - db5-devel
    - gdbm-devel
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Prevent-broken-test-from-running.patch
    %patch -p1 -i ${pkgfiles}/disable-failing-nss-tests.patch
    %configure \
        --with-apr=/usr \
        --with-crypto \
        --with-gdbm=/usr \
        --with-ldap \
        --with-nss=/usr \
        --with-openssl=/usr \
        --with-pgsql=/usr \
        --with-sqlite3=/usr \
build      : |
    %make
install    : |
    %make_install
    %install_license LICENSE
check      : |
    %make check -j1
