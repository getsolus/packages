# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kup
version    : 6.8.2
release    : 2
source     :
    - https://download.kde.org/stable/plasma/6.8.2/kup-6.8.2.tar.xz : 413d5edebd5590d47a274f26d8a5e92bb17808263e25e78fd6fe0b28ca0923f2
homepage   : https://kde.org/plasma-desktop/
license    :
    - CC0-1.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
component  : desktop.kde.core
summary    : Backup scheduler for KDE's Plasma desktop
description: |
    Kup is a backup scheduler for KDE's Plasma desktop. It can be configured to run
    backups on a schedule and to keep multiple versions of backed-up files.
builddeps  :
    - pkgconfig(KF6CoreAddons)
    - pkgconfig(KF6WindowSystem)
    - pkgconfig(libgit2)
    - extra-cmake-modules
    - kf6-kcmutils-devel
    - kf6-kconfig-devel
    - kf6-kcrash-devel
    - kf6-kdbusaddons-devel
    - kf6-ki18n-devel
    - kf6-kidletime-devel
    - kf6-kio-devel
    - kf6-kirigami-devel
    - kf6-kjobwidgets-devel
    - kf6-knotifications-devel
    - kf6-kwidgetsaddons-devel
    - kf6-kxmlgui-devel
    - kf6-solid-devel
    - libplasma-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
