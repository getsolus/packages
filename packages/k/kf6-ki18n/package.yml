# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-ki18n
version    : 6.31.0
release    : 44
source     :
    - https://download.kde.org/stable/frameworks/6.31/ki18n-6.31.0.tar.xz : 9fa271c7a33b856451de1ed3ff105626c2763fbd3b11d3210b02cb30de43f2ba
homepage   : https://community.kde.org/Frameworks
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
    - ODbL-1.0
component  : programming.tools
summary    : KDE Gettext-based UI text internationalization.
description: |
    KDE Gettext-based UI text internationalization.
builddeps  :
    - pkgconfig(Qt6Designer)
    - extra-cmake-modules
    - qt6-base-private-devel
rundeps    :
    - devel :
        - extra-cmake-modules
        - qt6-tools-devel
clang      : true
optimize   : thin-lto
