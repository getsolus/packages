# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : koko
version    : 26.08.3
release    : 5
source     :
    - https://download.kde.org/stable/release-service/26.08.3/src/koko-26.08.3.tar.xz : 51a91aae40c7c606235c218eee32f59048a528394ba68994a7ce34d26bcf3e5e
homepage   : https://apps.kde.org/koko/
license    :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC-BY-4.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0-only
component  : desktop.kde
summary    : Koko is an image viewer designed for desktop and touch devices.
description: |
    Koko is an image viewer designed for desktop and touch devices.
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6Positioning)
    - pkgconfig(Qt6Svg)
    - pkgconfig(exiv2)
    - pkgconfig(xcb-util)
    - extra-cmake-modules
    - kf6-kconfig-devel
    - kf6-kconfigwidgets-devel
    - kf6-kcoreaddons-devel
    - kf6-kdbusaddons-devel
    - kf6-kdeclarative-devel
    - kf6-kfilemetadata-devel
    - kf6-ki18n-devel
    - kf6-kio-devel
    - kf6-kirigami-devel
    - kf6-knotifications-devel
    - kf6-purpose-devel
    - kirigami-addons-devel
    - kirigami-app-components-devel
    - kquickimageeditor-devel
    - qt6-base-private-devel
setup      : |
    %cmake_kf6
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSES/*
