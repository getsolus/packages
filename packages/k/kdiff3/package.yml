# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kdiff3
version    : 1.12.6
release    : 9
source     :
    - https://download.kde.org/stable/kdiff3/kdiff3-1.12.6.tar.xz : edeaa2313cb74b650958d24cd98b300b73173ac8a9c87067de62babf02baa37c
license    : 
    - BSD-2-Clause
    - CC0-1.0
    - GPL-2.0-or-later
    - MIT
component  : programming.tools
homepage   : https://apps.kde.org/kdiff3
summary    : Utility for comparing and merging files and directories
description: |
    kdiff3 is a 3-way text editor from KDE capable of comparing and merging two or three input files or directories. It is a supported git mergetool.
optimize   :
    - lto
builddeps  :
    - pkgconfig(Qt6Gui)
    - pkgconfig(cups)
    - kf6-kconfig
    - kf6-kcoreaddons-devel
    - kf6-kcrash-devel
    - kf6-kdoctools-devel
    - kf6-ki18n-devel
    - kf6-kio-devel
    - kf6-kxmlgui-devel
    - libboost-devel
setup      : |
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
    rm -rf ${installdir}/usr/share/doc
