# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kdnssd
version    : 6.29.0
release    : 35
source     :
    - https://download.kde.org/stable/frameworks/6.29/kdnssd-6.29.0.tar.xz : c48b0c7a06bbcc27e181d9d6f7aeafc2c8bcd4d828497a1e4ddeb252f6fd9674
homepage   : https://community.kde.org/Frameworks
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
component  : desktop.library
summary    : Network service discovery using Zeroconf
description: |
    Network service discovery using Zeroconf
builddeps  :
    - pkgconfig(Qt6Designer)
