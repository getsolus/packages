# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kdnssd
version    : 6.31.0
release    : 37
source     :
    - https://download.kde.org/stable/frameworks/6.31/kdnssd-6.31.0.tar.xz : 7b5884ef22522bc25f8158546956b75b72f46e1af7765fedf4fb816b9c34574d
homepage   : https://community.kde.org/Frameworks
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
component  : desktop.library
summary    : Network service discovery using Zeroconf
description: |
    Network service discovery using Zeroconf
builddeps  :
    - pkgconfig(Qt6Designer)
    - pkgconfig(avahi-core)
    - extra-cmake-modules
rundeps    :
    - devel :
        - extra-cmake-modules
        - qt6-base-devel
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_kf6
