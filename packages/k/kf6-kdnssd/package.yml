# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kdnssd
version    : 6.32.0
release    : 38
source     :
    - https://download.kde.org/stable/frameworks/6.32/kdnssd-6.32.0.tar.xz : 60f8de14e4a6026c5e843355a180dadd038d6efe41eb9c9a2444971915466b41
homepage   : https://community.kde.org/Frameworks
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
component  : desktop.library
summary    : Network service discovery using Zeroconf
description: |
    Network service discovery using Zeroconf
builddeps  :
    - pkgconfig(Qt6Designer)
    - pkgconfig(avahi-core)
    - extra-cmake-modules
rundeps    :
    - devel :
        - extra-cmake-modules
        - qt6-base-devel
clang      : true
optimize   : thin-lto
