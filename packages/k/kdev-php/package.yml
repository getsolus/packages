# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kdev-php
version    : 26.08.1
release    : 58
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/kdev-php-26.08.1.tar.xz : cbb566e00335153e824bb6b20f8f4db554e2b224f1dc5035ec7e4665bebf1d5d
homepage   : https://apps.kde.org/kdev-php/
license    :
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-only
    - LGPL-2.0-or-later
component  : programming.tools
summary    : PHP support for KDevelop
description: |
    KDevelop plugin which provides PHP language support.
libsplit   : false
builddeps  :
    - pkgconfig(Qt6Core)
    - kdevelop-devel
    - kdevelop-pg-qt-devel
    - kf6-kcmutils-devel
    - kf6-ki18n-devel
    - kf6-ktexteditor-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
