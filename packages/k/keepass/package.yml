# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : keepass
version    : 2.61.1
release    : 49
source     :
    - https://sourceforge.net/projects/keepass/files/KeePass%202.x/2.61.1/KeePass-2.61.1-Source.zip : 
        711bd9ec7076661678469e51bae876debac07a08c32f1b1c6b3b8fe5e761c13a
homepage   : https://keepass.info/
license    : GPL-2.0-or-later
component  : security
summary    : KeePass Password Safe is a free, open source, lightweight, and easy-to-use password manager
description: |
    KeePass Password Safe is a free, open source, lightweight, and easy-to-use password manager.
builddeps  :
    - pkgconfig(gtk-sharp-2.0)
    - pkgconfig(libgdiplus)
    - pkgconfig(mono)
rundeps    :
    - libgdiplus
    - mono-devel
    - xdotool
    - xsel
build      : |
    cd ../Build/
    chmod +x PrepMonoDev.sh
    ./PrepMonoDev.sh
    cd ../
    xbuild /target:KeePass /property:Configuration=Release KeePass.sln
    cp Ext/KeePass.exe.config Build/KeePass/Release
install    : |
    cd ${workdir}/../
    %install_dir ${installdir}/usr/bin
    %install_dir ${installdir}/usr/share/keepass/XSL

    %install_exe Build/KeePass/Release/KeePass.exe ${installdir}/usr/share/keepass/KeePass.exe
    %install_exe Ext/KeePass.config.xml ${installdir}/usr/share/keepass/KeePass.config.xml
    %install_exe Ext/KeePass.exe.config ${installdir}/usr/share/keepass/KeePass.exe.config
    %install_file Ext/XSL/* ${installdir}/usr/share/keepass/XSL

    # Install Icons
    for icon_size in 16 20 24 32 48 64 128 256 512 1024
    do
        %install_file Ext/Icons_15_VA/KeePass_Round/KeePass_Round_${icon_size}.png ${installdir}/usr/share/icons/hicolor/${icon_size}x${icon_size}/apps/keepass.png
    done

    # KeePass Desktop File and Exec Adding
    echo '#!/bin/sh
    exec mono /usr/share/keepass/KeePass.exe "$@"' >> ${installdir}/usr/bin/keepass
    chmod +x ${installdir}/usr/bin/keepass
    %install_file ${pkgfiles}/keepass.desktop ${installdir}/usr/share/applications/keepass.desktop

    # Install appstream metainfo
    %install_file ${pkgfiles}/info.keepass.keepass.metainfo.xml -t ${installdir}/usr/share/metainfo
    
    %install_license Docs/License.txt
