# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ktnef
version    : 26.08.1
release    : 98
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/ktnef-26.08.1.tar.xz : f044833403ac6d9352287ccaed35af4eea07a95b9d89dfb740b01061e5af48a1
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - MIT
component  : programming.library
summary    : API for handling TNEF data
description: |
    API for handling TNEF data.
builddeps  :
    - pkgconfig(KF6CalendarCore)
    - kcalutils-devel
    - kf6-kcontacts-devel
rundeps    :
    - devel :
        - kf6-kcalendarcore-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
