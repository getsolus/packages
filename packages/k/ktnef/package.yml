# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ktnef
version    : 26.08.3
release    : 100
source     :
    - https://download.kde.org/stable/release-service/26.08.3/src/ktnef-26.08.3.tar.xz : badb933874840b1fc2566297be4182b00f1ea2ecf0385d800a8537f7cd209fa1
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - MIT
component  : programming.library
summary    : API for handling TNEF data
description: |
    API for handling TNEF data.
builddeps  :
    - pkgconfig(KF6CalendarCore)
    - kcalutils-devel
    - kf6-kcontacts-devel
rundeps    :
    - devel :
        - kf6-kcalendarcore-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
