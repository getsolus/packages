# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ktnef
version    : 26.08.2
release    : 99
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/ktnef-26.08.2.tar.xz : 07950712fee0b4965405ce0498e66505adf9c850fd2a7463111c38a474866ad8
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - MIT
component  : programming.library
summary    : API for handling TNEF data
description: |
    API for handling TNEF data.
builddeps  :
    - pkgconfig(KF6CalendarCore)
    - kcalutils-devel
    - kf6-kcontacts-devel
