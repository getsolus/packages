# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kraft
version    : 2.1.0
release    : 17
source     :
    - https://github.com/dragotin/kraft/archive/refs/tags/v2.1.0.tar.gz : b0ea6bbfb68b2c3aaf38fc6eca8ab3661732c10ca80d13da810638430f8d6fa8
homepage   : https://volle-kraft-voraus.de
license    : GPL-2.0-or-later
component  : office.finance
summary    : Kraft helps to handle your daily quotes and invoices in your small business.
description: |
    Kraft is a Qt/KF6 based desktop software with a strong focus on ease of use and the just enough feature set for the use case.
    With Kraft, writing documents like quotes and invoices is very easy and fast. Repeating tasks are supported, documents can be generated semi automatically, ie. invoices from offers sent out before.
builddeps  :
    - pkgconfig(Qt6Svg)
    - pkgconfig(libctemplate)
    - pkgconfig(sqlite3)
    - akonadi-contacts-devel
    - extra-cmake-modules
    - grantlee-devel
    - kf6-kcodecs-devel
    - kf6-kconfig-devel
    - kf6-kcontacts-devel
    - kf6-kcoreaddons-devel
    - kf6-ki18n-devel
rundeps    :
    - kf6-kiconthemes
    - python-pypdf2
    - python-reportlab
    - python-six
    - python-weasyprint
setup      : |
    # Added StartupWMClass to desktop file
    %patch -p1 -i ${pkgfiles}/0001-fix-icon-in-overview.patch

    # Cmake need .tag file
    echo "%version%" > .tag

    %cmake_ninja
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license COPYING
