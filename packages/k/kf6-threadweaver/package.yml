# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-threadweaver
version    : 6.32.0
release    : 38
source     :
    - https://download.kde.org/stable/frameworks/6.32/threadweaver-6.32.0.tar.xz : b3ee9e6cdfdb3dec7c7df8e7f66ace6a94e73a531ba4f1d8f7b74360e7201e05
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
