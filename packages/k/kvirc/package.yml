# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kvirc
version    : 5.2.10
release    : 23
source     :
    - https://github.com/kvirc/KVIrc/archive/refs/tags/5.2.10.tar.gz : 6b448b08aeaf5fd3f2b120525c8c87ddad3336f5b750a557b2022aaad0dda626
homepage   : https://www.kvirc.net/
license    : GPL-2.0-or-later
component  : network.irc
summary    : The KVIrc IRC Client
description: |
    KVIrc is a free portable IRC client based on the excellent Qt GUI toolkit.
builddeps  :
    - pkgconfig(KF6WindowSystem)
    - pkgconfig(Qt6Core5Compat)
    - pkgconfig(Qt6Multimedia)
    - pkgconfig(Qt6Svg)
    - pkgconfig(Qt6WebEngineWidgets)
    - pkgconfig(enchant-2)
    - pkgconfig(phonon4qt6)
    - pkgconfig(python3)
    - pkgconfig(theora)
    - pkgconfig(vorbis)
    - kf6-kio-devel
    - kf6-knotifications-devel
    - kf6-kparts-devel
    - kf6-kservice-devel
    - kf6-kstatusnotifieritem-devel
    - kf6-kxmlgui-devel
libsplit   : false
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Force-app_id-to-be-set-in-more-places.patch

    %cmake_ninja \
        -DWANT_OGG_THEORA=ON
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license COPYING

    # Install AppStream metainfo
    %install_file ${pkgfiles}/net.kvirc.KVIrc5.metainfo.xml -t ${installdir}/usr/share/metainfo
