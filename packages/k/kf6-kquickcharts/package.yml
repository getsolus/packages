# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kquickcharts
version    : 6.32.0
release    : 43
source     :
    - https://download.kde.org/stable/frameworks/6.32/kquickcharts-6.32.0.tar.xz : 9f676e504f73fa43e394833e514522baac3f3ca2b8c63908eef7f6bdf1053046
homepage   : https://community.kde.org/Frameworks
license    :
    - BSD-2-Clause
    - CC0-1.0
    - LGPL-2.1-only
    - LGPL-3.0-only
    - MIT
component  : desktop.library
summary    : A QtQuick plugin providing high-performance charts
description: |
    A QtQuick plugin providing high-performance charts
builddeps  :
    - pkgconfig(Qt6Designer)
    - pkgconfig(Qt6QuickControls2)
    - pkgconfig(Qt6ShaderTools)
    - extra-cmake-modules
    - qt6-base-private-devel
rundeps    :
    - devel :
        - extra-cmake-modules
        - qt6-base-devel
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
