# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kmbox
version    : 26.08.2
release    : 101
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/kmbox-26.08.2.tar.xz : a4b08915584d0b7ec5fa28adae1eb3d0bc63a1d95f15e40bfae529505d0307a5
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - MIT
component  : desktop.library
summary    : KMBox provides API to access emails in storages in the MBox format
description: |
    KMBox provides API to access emails in storages in the MBox format.
builddeps  :
    - kf6-kmime-devel
rundeps    :
    - devel :
        - kf6-kmime-devel
clang      : true
optimize   :
