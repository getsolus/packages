# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kmbox
version    : 26.08.3
release    : 102
source     :
    - https://download.kde.org/stable/release-service/26.08.3/src/kmbox-26.08.3.tar.xz : b897e2c360b2b2e0d34ab196cef4c9e840920e6001df73538fa05407c4270bad
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - MIT
component  : desktop.library
summary    : KMBox provides API to access emails in storages in the MBox format
description: |
    KMBox provides API to access emails in storages in the MBox format.
builddeps  :
    - kf6-kmime-devel
rundeps    :
    - devel :
        - kf6-kmime-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
