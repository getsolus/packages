# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kmbox
version    : 26.08.1
release    : 100
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/kmbox-26.08.1.tar.xz : 4bda0a789e010d383db7a56294941853cc2d878ddd57b33f1e08daeb2714a75b
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - MIT
component  : desktop.library
summary    : KMBox provides API to access emails in storages in the MBox format
description: |
    KMBox provides API to access emails in storages in the MBox format.
builddeps  :
    - kf6-kmime-devel
rundeps    :
    - devel :
        - kf6-kmime-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
