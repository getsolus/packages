# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kmailtransport
version    : 26.08.3
release    : 107
source     :
    - https://download.kde.org/stable/release-service/26.08.3/src/kmailtransport-26.08.3.tar.xz : 6df7dfed390c016ba0460cabf9b83743b78e458a2a51051cc738edadc5c7a7ce
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
    - MIT
component  : desktop.library
summary    : Mail Transport Service
description: |
    Mail Transport Service.
builddeps  :
    - kf6-kio-devel
    - ksmtp-devel
    - libkgapi-devel
    - qtkeychain-qt6-devel
rundeps    :
    - devel :
        - kf6-kconfig-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
