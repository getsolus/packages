# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kmailtransport
version    : 26.08.1
release    : 105
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/kmailtransport-26.08.1.tar.xz : 2a227c011a54d38b61c33e6a7d0d7b499174ed35ed4f1dd5b05ab38afda47614
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
    - MIT
component  : desktop.library
summary    : Mail Transport Service
description: |
    Mail Transport Service.
builddeps  :
    - kf6-kio-devel
    - ksmtp-devel
    - libkgapi-devel
    - qtkeychain-qt6-devel
rundeps    :
    - devel :
        - kf6-kconfig-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
