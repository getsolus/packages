# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kmscon
version    : 10.1.0
release    : 14
source     :
    - https://github.com/kmscon/kmscon/archive/refs/tags/v10.1.0.tar.gz : ac8e763b3c0e88f155daa7c4273009a9042fd43b2f7d54bc95dccfab0d81d953
homepage   : https://www.freedesktop.org/wiki/Software/kmscon
license    :
    - MIT
    - LGPL-2.1-or-later # external/htable.* external/dbus-loop.*
component  :
    - terminfo : system.base
    - system.utils
summary    :
    - terminfo : Terminfo for kmscon
    - Linux KMS/DRM based virtual Console Emulator
description:
    - terminfo : Terminfo for kmscon, split out so that it can be used from ncurses
    - |
          kmscon is a system console for linux. It does not depend on any graphics-server on your system (like X.org), but instead provides a raw console layer that can be used independently. It can replace the linux kernel console entirely but was designed to work well side-by-side, too. Even though initially targeted at providing internationalization to the system-console, it has grown into a fully modularized console layer including features like multi-head support, internationalized font rendering, XKB-compatible keyboard handling, hardware-accelerated graphics access and more.

builddeps  :
    - pkgconfig(egl)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(gbm)
    - pkgconfig(glesv2)
    - pkgconfig(libdrm)
    # Uncomment when libseat support is more stable
    # - pkgconfig(libseat)
    - pkgconfig(libtsm)
    - pkgconfig(libudev)
    - pkgconfig(pangoft2)
    - pkgconfig(xkbcommon)
rundeps    :
    - kmscon-terminfo
checkdeps  :
    - pkgconfig(check)
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING

    # Install PAM config to correct location
    # Uncomment when libseat support is more stable
    #%install_dir ${installdir}/usr/share/defaults/etc
    # mv ${installdir}/etc/pam.d ${installdir}/usr/share/defaults/etc/

    # Use the defaults
    rm -fr ${installdir}/etc/

    # Make it the default VT provider if installed
    # FIXME: statelessness
    %install_dir ${installdir}/etc/systemd/system/
    ln -sv ../../../usr/lib/systemd/system/kmsconvt@.service ${installdir}/etc/systemd/system/autovt@.service

    %install_file -t ${installdir}/%libdir%/systemd/system-preset/ ${pkgfiles}/60-kmscon.preset
check      : |
    %ninja_check
patterns   :
    - terminfo :
        - /usr/share/terminfo
