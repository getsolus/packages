# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : keychain
version    : 3.0.7
release    : 5
source     :
    - https://github.com/danielrobbins/keychain/archive/refs/tags/3.0.7.tar.gz : 573002c4da81efa27908d197fec7121e5bb7b0018605aa34f345c1cbf7486843
homepage   : https://kernel-seeds.org/projects/keychain/
license    : GPL-3.0-or-later
component  : network.util
summary    : agent manager for ssh and gnupg
description: |
    Helps you to manage ssh and GPG keys in a convenient and secure manner. It acts as a frontend to ssh-agent and ssh-add, but allows you to easily have one long running ssh-agent process per system, rather than the norm of one ssh-agent per login session.
builddeps  :
    - python-build
    - python-installer
    - python-packaging
    - python-setuptools
    - python-wheel
rundeps    :
    - python3
checkdeps  :
    - openssh
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest
