# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-karchive
version    : 6.29.0
release    : 36
source     :
    - https://download.kde.org/stable/frameworks/6.29/karchive-6.29.0.tar.xz : 3d66cd9d71fbbebc3cea68757111002666b366898b01178b6fa7203715574287
homepage   : https://community.kde.org/Frameworks
license    :
    - Apache-2.0
    - BSD-2-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
component  : programming.library
