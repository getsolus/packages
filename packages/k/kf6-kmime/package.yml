# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kmime
version    : 6.32.0
release    : 3
source     :
    - https://download.kde.org/stable/frameworks/6.32/kmime-6.32.0.tar.xz : 390870842f4b6afeab01a0f76b63e22f0b97f788f8815d847a43d7a4f23e7941
homepage   : https://community.kde.org/Frameworks
license    :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC0-1.0
    - CC-BY-SA-4.0
    - LGPL-2.0-only
    - LGPL-2.0-or-later
component  : desktop.library
summary    : KMime is a library for handling mail messages and newsgroup articles
description: |
    KMime is a library for handling mail messages and newsgroup articles
builddeps  :
    - extra-cmake-modules
    - kf6-kcodecs-devel
rundeps    :
    - devel :
        - kf6-kcodecs-devel
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
