# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kmime
version    : 6.31.0
release    : 2
source     :
    - https://download.kde.org/stable/frameworks/6.31/kmime-6.31.0.tar.xz : 859a5c233ef0a70af76fe678da3b1d519086de9cd410826342bdf2c02eadcf90
homepage   : https://community.kde.org/Frameworks
license    :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC0-1.0
    - CC-BY-SA-4.0
    - LGPL-2.0-only
    - LGPL-2.0-or-later
component  : desktop.library
summary    : KMime is a library for handling mail messages and newsgroup articles
description: |
    KMime is a library for handling mail messages and newsgroup articles
builddeps  :
    - extra-cmake-modules
    - kf6-kcodecs-devel
rundeps    :
    - devel :
        - kf6-kcodecs-devel
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
