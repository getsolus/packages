# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kiconthemes
version    : 6.32.0
release    : 45
source     :
    - https://download.kde.org/stable/frameworks/6.32/kiconthemes-6.32.0.tar.xz : 1bd4fe3246af5527c136afc650703e5231b8b2de32ca1eac48fa310adece8db8
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
    - GPL-2.0-only
    - GPL-3.0-only
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
component  : desktop.library
summary    : Icon GUI utilities.
description: |
    Icon GUI utilities.
builddeps  :
    - pkgconfig(Qt6Svg)
    - breeze-icons-devel
    - kf6-karchive-devel
    - kf6-kconfigwidgets-devel
    - kf6-ki18n-devel
    - qt6-base-private-devel
rundeps    :
    - devel :
        - breeze-icons-devel
        - kf6-karchive-devel
        - kf6-kconfigwidgets-devel
        - kf6-ki18n-devel
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
