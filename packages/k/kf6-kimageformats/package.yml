# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kimageformats
version    : 6.32.0
release    : 49
source     :
    - https://download.kde.org/stable/frameworks/6.32/kimageformats-6.32.0.tar.xz : 298069eab84d34b909fc271d818b0762c6c63cc8490f2d8b0fe48dc0d8804b5c
homepage   : https://community.kde.org/Frameworks
license    :
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0-only
component  : desktop.library
summary    : A fast and easy to use image viewer
description: |
    A fast and easy to use image viewer
builddeps  :
    - pkgconfig(OpenEXR)
    - pkgconfig(libavif)
    - pkgconfig(libheif)
    - pkgconfig(libjxl)
    - pkgconfig(libopenjp2)
    - pkgconfig(libraw)
    - pkgconfig(libsharpyuv)
    - kf6-karchive-devel
rundeps    :
    - qt6-imageformats
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_kf6 \
        -DKIMAGEFORMATS_HEIF:BOOL=ON \
        -DKIMAGEFORMATS_JXR:BOOL=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
