# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kdegraphics-mobipocket
version    : 26.08.1
release    : 103
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/kdegraphics-mobipocket-26.08.1.tar.xz : 69ec5076b02332f23d96cfd7b560ae716726bfab2984ce0285e0a67c1270522a
homepage   : https://invent.kde.org/graphics/kdegraphics-mobipocket/
license    : GPL-2.0-or-later
component  : programming
summary    : Plugins for mobpocket
description: |
    A collection of plugins to handle mobipocket files.
builddeps  :
    - pkgconfig(Qt6Core5Compat)
    - extra-cmake-modules
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6 -DBUILD_WITH_QT6=ON
build      : |
    %ninja_build
    %install_license LICENSES/*
install    : |
    %ninja_install
