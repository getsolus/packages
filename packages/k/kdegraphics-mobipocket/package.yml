# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kdegraphics-mobipocket
version    : 26.08.2
release    : 104
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/kdegraphics-mobipocket-26.08.2.tar.xz : 771fb6343177cc9b61ab83fda6d32ed3e87b57de0ce2744ce86b00f8488b6300
homepage   : https://invent.kde.org/graphics/kdegraphics-mobipocket/
license    : GPL-2.0-or-later
component  : programming
summary    : Plugins for mobpocket
description: |
    A collection of plugins to handle mobipocket files.
builddeps  :
    - pkgconfig(Qt6Core5Compat)
    - extra-cmake-modules
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6 -DBUILD_WITH_QT6=ON
build      : |
    %ninja_build
    %install_license LICENSES/*
install    : |
    %ninja_install
