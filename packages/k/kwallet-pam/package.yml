# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kwallet-pam
version    : 6.8.2
release    : 149
source     :
    - https://download.kde.org/stable/plasma/6.8.2/kwallet-pam-6.8.2.tar.xz : 858025e222ba1cce66591d3a0cf4d41d60917e7b55418840422712910a853022
homepage   : https://www.kde.org/workspaces/plasmadesktop/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.1-or-later
