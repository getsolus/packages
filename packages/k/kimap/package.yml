# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kimap
version    : 26.08.1
release    : 100
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/kimap-26.08.1.tar.xz : dadca1d3090bc600998333bae006d8062e374ef46d699fa308f52eee00e96f01
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - MIT
component  : desktop.library
summary    : This library provides a job-based API for interacting with an IMAP4rev1 server
description: |
    This library provides a job-based API for interacting with an IMAP4rev1 server. It manages connections, encryption and parameter quoting and encoding, but otherwise provides quite a low-level interface to the protocol.  This library does not implement an IMAP client; it merely makes it easier to do so.
builddeps  :
    - pkgconfig(libsasl2)
    - kf6-kio-devel
    - kf6-kmime-devel
rundeps    :
    - devel :
        - kf6-kcoreaddons-devel
        - kf6-kmime-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
