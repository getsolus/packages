# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kmag
version    : 26.08.1
release    : 96
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/kmag-26.08.1.tar.xz : 7e6b7d29bbc492b697f22a9a7bd1b707d9cfd7559da46f54f80be096a6bf8f2c
homepage   : https://kde.org/applications/utilities/org.kde.kmag
license    :
    - BSD-3-Clause
    - CC0-1.0
    - GFDL-1.2-only
    - GPL-2.0-or-later
component  : desktop.kde
summary    : KMag is a screen magnifier
description: |
    KMag is a screen magnifier.
builddeps  :
    - kf6-kdoctools-devel
    - kf6-kio-devel
    - kf6-kxmlgui-devel
    - libqaccessibilityclient-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*

    # remove docs
    rm -rfv $installdir/usr/share/doc
