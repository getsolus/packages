# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : keepassxc
version    : 2.8.0
release    : 57
homepage   : https://keepassxc.org
source     :
    - https://github.com/keepassxreboot/keepassxc/releases/download/2.8.0/keepassxc-2.8.0-src.tar.xz : 4ed4b77d375f021fc04648c257fedfb41dc13c6bd5c4965d8ded31284c9c653c
license    :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
    - GPL-3.0
    - LGPL-2.1-only
    - LGPL-3.0
    - MIT
    - OFL-1.1
component  : security
summary    : KeePassXC is a modern, secure, and open-source password manager that stores and manages your most sensitive information.
description: |
    KeePassXC is a cross-platform, open-source password manager that keeps passwords, credentials, and notes encrypted in an offline database.
    It provides strong password generation, customizable organization, and fast search for easy management.
replaces   :
    - keepassx
builddeps  :
    - pkgconfig(Qt6Concurrent)
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6DBus)
    - pkgconfig(Qt6Gui)
    - pkgconfig(Qt6Network)
    - pkgconfig(Qt6Svg)
    - pkgconfig(Qt6UiTools)
    - pkgconfig(Qt6Widgets)
    - pkgconfig(botan-3)
    - pkgconfig(libargon2)
    - pkgconfig(libkeyutils)
    - pkgconfig(libpcsclite)
    - pkgconfig(libqrencode)
    - pkgconfig(libusb-1.0)
    - pkgconfig(minizip)
    - pkgconfig(xtst)
rundeps    :
    - wl-clipboard
setup      : |
    %cmake_ninja \
        -DKPXC_FEATURE_DOCS=OFF \
        -DKPXC_FEATURE_UPDATES=OFF \
        -DWITH_TESTS=OFF
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING LICENSE.*
