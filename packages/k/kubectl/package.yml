# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kubectl
version    : 1.37.2
release    : 54
source     :
    - https://github.com/kubernetes/kubernetes/archive/refs/tags/v1.37.2.tar.gz : 6b1a4921ce0249a4607528e2b4f211c6aaeb2f03204bcabefabb3f6742ba67b8
homepage   : https://kubernetes.io/
license    : Apache-2.0
component  : network.clients
summary    : Command line interface for running commands against Kubernetes clusters
description: |
    kubectl is a command line interface for running commands against Kubernetes clusters
builddeps  :
    - golang
    - rsync
environment: |
    export CGO_CPPFLAGS="$CPPFLAGS"
    export CGO_CFLAGS="$CFLAGS"
    export CGO_CXXFLAGS="$CXXFLAGS"
    export CGO_LDFLAGS="$LDFLAGS"

    # NOTE: -mod=readonly in GOFLAGS breaks the build
    export GOFLAGS="-buildmode=pie -ldflags=-linkmode=external -ldflags=-compressdwarf=false -modcacherw"
    # NOTE: this also ensures the binaries have full RELRO
    export GOLDFLAGS="-linkmode=external -compressdwarf=false"

    # Otherwise this will try to download the upstream golang toolchain
    export GOTOOLCHAIN=local
setup      : |
    %patch -p1 -i ${pkgfiles}/kubernetes-1.24.0-static_cgo_enabled.patch
build      : |
    hack/update-generated-docs.sh
    %make kubectl
install    : |
    %install_dir ${installdir}/usr/share/man/man1
    %install_file docs/man/man1/kubectl* ${installdir}/usr/share/man/man1
    %install_bin _output/bin/kubectl

    # Install completion scripts
    _output/bin/kubectl completion bash > kubectl-bash-completion
    _output/bin/kubectl completion fish > kubectl-fish-completion
    _output/bin/kubectl completion zsh > kubectl-zsh-completion
    %install_file kubectl-bash-completion ${installdir}/usr/share/bash-completion/completions/kubectl
    %install_file kubectl-fish-completion ${installdir}/usr/share/fish/vendor_completions.d/kubectl
    %install_file kubectl-zsh-completion ${installdir}/usr/share/zsh/site-functions/_kubectl

    %install_license LICENSE
