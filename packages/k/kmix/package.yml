# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kmix
version    : 26.08.1
release    : 96
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/kmix-26.08.1.tar.xz : e50d9b6190b07459eb16485fdd48595fa6ecbc1761920e8b667d9aeb4ade99b4
homepage   : https://kde.org/applications/multimedia/org.kde.kmix
license    :
    - GPL-2.0-or-later
component  : desktop.kde
summary    : KDE volume control program
description: |
    KDE volume control program.
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(libcanberra)
    - pkgconfig(libpulse)
    - kf6-kconfigwidgets-devel
    - kf6-kcoreaddons-devel
    - kf6-kcrash-devel
    - kf6-kdbusaddons-devel
    - kf6-kdoctools-devel
    - kf6-kglobalaccel-devel
    - kf6-ki18n-devel
    - kf6-knotifications-devel
    - kf6-kstatusnotifieritem-devel
    - kf6-kwidgetsaddons-devel
    - kf6-kwindowsystem-devel
    - kf6-kxmlgui-devel
    - kf6-solid-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING*

    # remove docs
    rm -rfv $installdir/usr/share/doc
