# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kicad
version    : 10.0.8
release    : 59
source     :
    - https://github.com/KiCad/kicad-source-mirror/archive/refs/tags/10.0.8.tar.gz : 96a58c70ff2abf94633e2a896055d8ed23cf38f79889acb59c9a2f8b55192447
homepage   : https://www.kicad.org/
license    : GPL-3.0-or-later
component  : office.scientific
summary    : KiCad is an open source software suite for Electronic Design Automation
description: |
    KiCad is an open source software suite for Electronic Design Automation (EDA).
libsplit   : false
builddeps  :
    - pkgconfig(cairo)
    - pkgconfig(dri)
    - pkgconfig(glew)
    - pkgconfig(glm)
    - pkgconfig(glut)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libcurl)
    - pkgconfig(libgit2)
    - pkgconfig(libsecret-1)
    - pkgconfig(odbc)
    - pkgconfig(poppler)
    - pkgconfig(protobuf)
    - pkgconfig(python3)
    - pkgconfig(spnav)
    - pkgconfig(x11)
    - libboost-devel
    - ngspice-devel
    - nng-devel
    - opencascade-devel
    - swig
    - wxPython
    - wxwidgets-devel
rundeps    :
    - kicad-footprints
    - kicad-packages3d
    - kicad-symbols
    - kicad-templates
    - ngspice-devel
clang      : true
setup      : |
    %cmake \
        -DKICAD_USE_EGL=TRUE \
        -DKICAD_SCRIPTING_WXPYTHON=OFF \
        -DKICAD_USE_OCE=OFF \
        -DKICAD_USE_OCC=ON \
        -DKICAD_I18N_UNIX_STRICT_PATH=ON
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE*
    rm -rf ${installdir}/usr/share/mimelnk
