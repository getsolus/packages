# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kauth
version    : 6.32.0
release    : 40
source     :
    - https://download.kde.org/stable/frameworks/6.32/kauth-6.32.0.tar.xz : 5bcdb298a2ee84bca93a989247fd6d6e34a1e1029caae17705a85b8ac4dbe837
homepage   : https://community.kde.org/Frameworks
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
