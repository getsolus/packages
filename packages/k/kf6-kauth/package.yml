# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kauth
version    : 6.31.0
release    : 39
source     :
    - https://download.kde.org/stable/frameworks/6.31/kauth-6.31.0.tar.xz : 6fb4e3d1de3364bab82453bd635387e845f227764c4d75ad505348ba3a2e34f8
homepage   : https://community.kde.org/Frameworks
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
