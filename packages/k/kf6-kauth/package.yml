# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kauth
version    : 6.30.0
release    : 38
source     :
    - https://download.kde.org/stable/frameworks/6.30/kauth-6.30.0.tar.xz : 60b75e02abc2bfbb247c586e3ab94def7ecd7b4e1ddb8260358951d84d9ea8c9
homepage   : https://community.kde.org/Frameworks
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
