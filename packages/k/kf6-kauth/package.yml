# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kauth
version    : 6.29.0
release    : 37
source     :
    - https://download.kde.org/stable/frameworks/6.29/kauth-6.29.0.tar.xz : 40a7ec156aa1842216e1377b327efe173a737c0e6434b1dda66d2b098a307824
homepage   : https://community.kde.org/Frameworks
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
