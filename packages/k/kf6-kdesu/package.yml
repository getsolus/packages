# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kdesu
version    : 6.29.0
release    : 35
source     :
    - https://download.kde.org/stable/frameworks/6.29/kdesu-6.29.0.tar.xz : 9c128248f6259ed8f6be8ab9fd670ab10efa9ab6b500429b98f7df25d169c312
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
    - GPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
component  : desktop.library
summary    : User interface for running shell commands with root privileges
description: |
    User interface for running shell commands with root privileges
builddeps  :
    - pkgconfig(x11)
    - kf6-ki18n-devel
    - kf6-kpty-devel
    - kf6-kservice-devel
rundeps    :
    - devel :
        - kf6-kpty-devel
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
