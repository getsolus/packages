# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kompare
version    : 26.08.3
release    : 95
source     :
    - https://download.kde.org/stable/release-service/26.08.3/src/kompare-26.08.3.tar.xz : 23b414d2d2a69b24a18b8e63aa45d18cd96e97f8dca02c8c93bfb6551fbbec96
homepage   : https://kde.org/applications/development/org.kde.kompare
license    :
    - GFDL-1.2-or-later
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
component  : programming.tools
summary    : File Comparator
description: |
    Tool to visualize changes between two versions of a file.
builddeps  :
    - kf6-kdoctools-devel
    - kf6-kiconthemes-devel
    - kf6-kparts-devel
    - kf6-ktexteditor-devel
    - libkomparediff2-devel
    - qt6-base-private-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*

    # remove doc
    rm -rfv $installdir/usr/share/doc
