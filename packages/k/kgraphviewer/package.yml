# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kgraphviewer
version    : 26.08.3
release    : 31
source     :
    - https://download.kde.org/stable/release-service/26.08.3/src/kgraphviewer-26.08.3.tar.xz : 04fea783ee146267dfeb14c44d125e98b30241ff776494255dc026b2344164e8
homepage   : https://apps.kde.org/kgraphviewer/
license    : GPL-2.0-only
component  : multimedia.graphics
summary    : Graphviz dot graph file viewer
description: |
    Graphviz dot graph file viewer
builddeps  :
    - pkgconfig(Qt6Core5Compat)
    - pkgconfig(Qt6Svg)
    - pkgconfig(libgvc)
    - kf6-kdoctools-devel
    - kf6-ki18n-devel
    - kf6-kparts-devel
    - kf6-kwidgetsaddons-devel
    - libboost-devel
    - qt6-base-private-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    # https://invent.kde.org/graphics/kgraphviewer/-/merge_requests/22
    %patch -p1 -i $pkgfiles/add-svg-logo.patch
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING

    # remove docs
    rm -rfv $installdir/usr/share/doc

    install -Dm00644 logo.svg $installdir/usr/share/icons/hicolor/scalable/apps/kgraphviewer.svg
