# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kamera
version    : 26.08.3
release    : 103
source     :
    - https://download.kde.org/stable/release-service/26.08.3/src/kamera-26.08.3.tar.xz : 1ea2ecaed044f76d5c943b37b9fbd874a0a7e77f7c9d982c409f5aaf1dad51cd
homepage   : https://kde.org/applications/utilities/org.kde.kamera
license    :
    - BSD-3-Clause
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
component  : desktop.kde.core
summary    : KDE integration for gphoto2 cameras
description: |
    KDE integration for gphoto2 cameras.
builddeps  :
    - pkgconfig(libgphoto2)
    - kf6-kcmutils-devel
    - kf6-kdoctools-devel
    - kf6-kio-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*

    #remove docs
    rm -rfv $installdir/usr/share/doc
