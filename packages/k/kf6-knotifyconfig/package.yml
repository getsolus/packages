# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-knotifyconfig
version    : 6.30.0
release    : 36
source     :
    - https://download.kde.org/stable/frameworks/6.30/knotifyconfig-6.30.0.tar.xz : 4a133decdb0d3731dbaa1d3625b30f057089e5c59c8326ff88a047cef35b2efb
