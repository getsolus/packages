# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-knotifyconfig
version    : 6.32.0
release    : 38
source     :
    - https://download.kde.org/stable/frameworks/6.32/knotifyconfig-6.32.0.tar.xz : 708e19857b4ac7ccf82541319d2a3bac30c1b451e79e4b0c71e6f58bc1b5307a
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
    - LGPL-2.0-only
component  : desktop.library
