# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-knotifyconfig
version    : 6.31.0
release    : 37
source     :
    - https://download.kde.org/stable/frameworks/6.31/knotifyconfig-6.31.0.tar.xz : 185b326c746ee983c9dc19ff19cd40205f9be9dcd2b41e6619015f85abcc47e6
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
    - LGPL-2.0-only
component  : desktop.library
summary    : Configuration dialog for desktop notifications.
description: |
    Configuration dialog for desktop notifications.
builddeps  :
