# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kldap
version    : 26.08.3
release    : 105
source     :
    - https://download.kde.org/stable/release-service/26.08.3/src/kldap-26.08.3.tar.xz : a3460ece61ab2bb48f6eef24375317c22e897336912bc95ba9fecfb0d21597c2
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - MIT
component  : desktop.library
summary    : Allows LDAP accessing with a convenient Qt style C++ API
description: |
    Allows LDAP accessing with a convenient Qt style C++ API.
builddeps  :
    - pkgconfig(ldap)
    - pkgconfig(libsasl2)
    - kf6-kdoctools-devel
    - kf6-kio-devel
    - qtkeychain-qt6-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*

    # remove doc
    rm -rfv $installdir/usr/share/doc
