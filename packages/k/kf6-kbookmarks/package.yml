# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kbookmarks
version    : 6.30.0
release    : 37
source     :
    - https://download.kde.org/stable/frameworks/6.30/kbookmarks-6.30.0.tar.xz : 680120f09929d51da0a65e96a1f7d20ffbbdd2795a165719b0d07e00475e77c4
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
    - LGPL-2.0-only
