# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kbookmarks
version    : 6.32.0
release    : 39
source     :
    - https://download.kde.org/stable/frameworks/6.32/kbookmarks-6.32.0.tar.xz : a796db0d6f91bd8795ef3319f85f75074d76be315119335c339cf37c1552a472
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-3.0-only
component  : desktop.library
summary    : Bookmarks management library.
description: |
    Bookmarks management library.
builddeps  :
    - extra-cmake-modules
    - kf6-kconfig-devel
    - kf6-kcoreaddons-devel
    - kf6-kwidgetsaddons-devel
rundeps    :
    - devel :
        - kf6-kconfig-devel
        - kf6-kcoreaddons-devel
        - kf6-kwidgetsaddons-devel
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
