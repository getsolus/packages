# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kbookmarks
version    : 6.31.0
release    : 38
source     :
    - https://download.kde.org/stable/frameworks/6.31/kbookmarks-6.31.0.tar.xz : 2d2c53c07fbc813e891bbc95a3ff4828c9e8e348e84a0d94fc2b69adf5897f55
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-3.0-only
component  : desktop.library
summary    : Bookmarks management library.
description: |
    Bookmarks management library.
