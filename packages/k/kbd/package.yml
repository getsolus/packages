# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kbd
version    : 2.10.0
release    : 10
source     :
    - https://mirrors.edge.kernel.org/pub/linux/utils/kbd/kbd-2.10.0.tar.xz : 6e5ca4f8d76ee9e3a8db700b667f13e12aac9933828a64e1aaad93d26be9b479
license    : GPL-2.0-or-later
component  : system.utils
homepage   : https://kbd-project.org/
summary    : Linux keyboard tools
description: |
    Tools for managing Linux console (Linux console, virtual terminals, keyboard, etc.) – mainly, what they do is loading console fonts and keyboard maps.
checkdeps  :
    - pkgconfig(check)
setup      : |
    %configure
build      : |
    %make
install    : |
    %make_install

    # PAM
    rm -v ${installdir}/etc/pam.d/vlock
    %install_file ${pkgfiles}/vlock.pam ${installdir}/usr/share/defaults/etc/pam.d/vlock

    # Cleanup
    find ${installdir} -type d -empty -print -delete
check      : |
    %make check
