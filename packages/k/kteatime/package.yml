# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kteatime
version    : 26.08.1
release    : 101
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/kteatime-26.08.1.tar.xz : 4b047d3c4682b05a12b8e93f8ec2506b5911e31d812d30755ec24c3a7b1b2572
homepage   : https://kde.org/applications/utilities/org.kde.kteatime
license    :
    - CC0-1.0
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
component  : desktop
summary    : KTeaTime is a handy timer for steeping tea
description: |
    KTeaTime is a handy timer for steeping tea. No longer will you have to guess at how long it takes for your tea to be ready. Simply select the type of tea you have, and it will alert you when the tea is ready to drink.
builddeps  :
    - pkgconfig(KF6GuiAddons)
    - kf6-kcrash-devel
    - kf6-kdoctools-devel
    - kf6-kiconthemes-devel
    - kf6-knotifications-devel
    - kf6-knotifyconfig-devel
    - kf6-kstatusnotifieritem-devel
    - kf6-ktextwidgets-devel
    - kf6-kxmlgui-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*

    # remove docs
    rm -rf $installdir/usr/share/doc
