# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kglobalacceld
version    : 6.8.3
release    : 59
source     :
    - https://download.kde.org/stable/plasma/6.8.3/kglobalacceld-6.8.3.tar.xz : e0fa8b3d951e85d1713e92f4d5c0622a5b0cd441a50383b8b26ac25cceab45c6
homepage   : https://kde.org/plasma-desktop/
license    :
    - CC0-1.0
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
component  : desktop.library
