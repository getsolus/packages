# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kglobalacceld
version    : 6.8.2
release    : 58
source     :
    - https://download.kde.org/stable/plasma/6.8.2/kglobalacceld-6.8.2.tar.xz : aeedd8546b25e3907497eebb041f1ad3ca5044d9893b5cc654100a0312ecc3f6
homepage   : https://kde.org/plasma-desktop/
license    :
    - CC0-1.0
    - LGPL-2.0-or-later
