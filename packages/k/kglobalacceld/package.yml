# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kglobalacceld
version    : 6.8.1
release    : 57
source     :
    - https://download.kde.org/stable/plasma/6.8.1/kglobalacceld-6.8.1.tar.xz : 33ca06aefb17ee663282fe60a6d2d7211d5832515d1f0a4387a77858bdadf219
homepage   : https://kde.org/plasma-desktop/
license    :
    - CC0-1.0
    - LGPL-2.0-or-later
