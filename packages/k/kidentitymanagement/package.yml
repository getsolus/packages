# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kidentitymanagement
version    : 26.08.1
release    : 107
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/kidentitymanagement-26.08.1.tar.xz : afd285bac8ce85e87b9f06672423311e299ce75ce1baf4720a59c65e4b4d235a
homepage   : https://kde.org/
license    :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - LGPL-2.1-only
