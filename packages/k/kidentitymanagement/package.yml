# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kidentitymanagement
version    : 26.08.3
release    : 110
source     :
    - https://download.kde.org/stable/release-service/26.08.3/src/kidentitymanagement-26.08.3.tar.xz : 1472ce2572d2126c5cdd6f028eb1e974e4bba05eecfce9ea431236caf14b64a5
homepage   : https://kde.org/
license    :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0-only
    - MIT
