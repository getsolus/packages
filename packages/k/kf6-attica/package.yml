# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-attica
version    : 6.32.0
release    : 39
source     :
    - https://download.kde.org/stable/frameworks/6.32/attica-6.32.0.tar.xz : 4f2b525649c6a23924bdf2647e9cd6c591285d33d8d4f01db45b37622e3b839b
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
component  : desktop.library
summary    : Open Collaboration Service client library.
description: |
    Open Collaboration Service client library.
builddeps  :
    - pkgconfig(Qt6Designer)
    - extra-cmake-modules
rundeps    :
    - devel :
        - extra-cmake-modules
        - qt6-tools-devel
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_kf6
build      : |
