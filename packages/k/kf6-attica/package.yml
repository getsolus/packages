# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-attica
version    : 6.30.0
release    : 37
source     :
    - https://download.kde.org/stable/frameworks/6.30/attica-6.30.0.tar.xz : 3eec8d2d9c77ad5f7cfd38e44e4b1492c5d0dec695b13f711c09f7d6187c276c
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
component  : desktop.library
summary    : Open Collaboration Service client library.
description: |
    Open Collaboration Service client library.
builddeps  :
    - pkgconfig(Qt6Designer)
