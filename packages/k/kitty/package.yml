# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kitty
version    : 0.48.2
release    : 103
source     :
    - https://github.com/kovidgoyal/kitty/releases/download/v0.48.2/kitty-0.48.2.tar.xz : 792a2bbde715bb26839677875a44202f1c30e91a20351842e0a61b5c6a1e666e
    - https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/NerdFontsSymbolsOnly.tar.xz : 7f8c090da3b0eaa7108646bf34cbbb6ed13d5358a72460522108b06c7ecd716a
homepage   : https://sw.kovidgoyal.net/kitty/
license    :
    - GPL-3.0-only
    - MIT
component  :
    - terminfo : system.base
    - system.utils
summary    :
    - terminfo : Terminfo for kitty
    - A fast and featureful GPU-based terminal emulator
description:
    - terminfo : Terminfo for kitty, split out so that it can be used from ncurses
    - Kitty is designed for power keyboard users. To that end all its controls work with the keyboard (although it fully supports mouse interactions as well). Its configuration is a simple, human editable, single file for easy reproducibility. Kitty is designed from the ground up to support all modern terminal features, such as unicode, true color, bold/italic fonts, text formatting, etc. It even extends existing text formatting escape codes, to add support for features not available elsewhere, such as colored and styled (curly) underlines. One of the design goals of Kitty is to be easily extensible so that new features can be added in the future with relatively less effort.
networking : true
builddeps  :
    - pkgconfig(cairo-fc)
    - pkgconfig(fontconfig)
    - pkgconfig(gl)
    - pkgconfig(harfbuzz)
    - pkgconfig(lcms2)
    - pkgconfig(libxxhash)
    - pkgconfig(python3)
    - pkgconfig(simde)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-scanner)
    - pkgconfig(xcursor)
    - pkgconfig(xi)
    - pkgconfig(xinerama)
    - pkgconfig(xkbcommon)
    - pkgconfig(xrandr)
    - golang
rundeps    :
    - kitty-terminfo
    - libcanberra
    - libpng
    - pygments
environment: |
    export CGO_CPPFLAGS="${CPPFLAGS}"
    export CGO_CFLAGS="${CFLAGS}"
    export CGO_CXXFLAGS="${CXXFLAGS}"
    export CGO_LDFLAGS="${LDFLAGS}"
    export GOFLAGS='-buildmode=pie -trimpath -mod=readonly -modcacherw'
setup      : |
    mkdir -p fonts
    tar xf ${sources}/NerdFontsSymbolsOnly.tar.xz -C fonts
build      : |
    %make
install    : |
    python3 setup.py linux-package --prefix ${installdir}/usr --update-check-interval=0
    %install_license LICENSE

    # install license for fonts
    %install_file fonts/LICENSE ${installdir}/usr/share/licenses/kitty/NerdFontsSymbolsOnly.LICENSE

    # install shell completions
    linux-package/bin/kitten __complete__ setup bash | %install_file /dev/stdin ${installdir}/usr/share/bash-completion/completions/kitty
    linux-package/bin/kitten __complete__ setup fish | %install_file /dev/stdin ${installdir}/usr/share/fish/vendor_completions.d/kitty.fish
    linux-package/bin/kitten __complete__ setup zsh  | %install_file /dev/stdin ${installdir}/usr/share/zsh/site-functions/_kitty

    # install AppStream metainfo
    %install_file ${pkgfiles}/net.kovidgoyal.kitty.metainfo.xml -t ${installdir}/usr/share/metainfo
patterns   :
    - terminfo :
        - /usr/share/terminfo
