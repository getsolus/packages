# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kgeography
version    : 26.08.2
release    : 104
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/kgeography-26.08.2.tar.xz : fde7bd9e275786e60118390cf0d10696413c404e07725b420559ecdbafaaee4d
homepage   : https://kde.org/applications/education/org.kde.kgeography
license    :
    - GPL-2.0-or-later
component  : games.learning
summary    : KGeography is a geography learning tool
description: |
    KGeography is a geography learning tool
builddeps  :
    - kf6-kcrash-devel
    - kf6-kdoctools-devel
    - kf6-kiconthemes-devel
    - kf6-kxmlgui-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING

    #remove docs
    rm -rfv $installdir/usr/share/doc
