# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kf6-kservice
version    : 6.32.0
release    : 41
source     :
    - https://download.kde.org/stable/frameworks/6.32/kservice-6.32.0.tar.xz : 495545ac7120305e3c13d5d1c7760c5607527db5816c6ceedf8c9a623b051e2e
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-only
component  : programming.library
summary    : Plugin framework for desktop services.
description: |
    Plugin framework for desktop services.
builddeps  :
    - kf6-kconfig-devel
    - kf6-kcoreaddons-devel
    - kf6-kdoctools-devel
    - kf6-ki18n-devel
rundeps    :
    - devel :
        - kf6-kconfig-devel
        - kf6-kcoreaddons-devel
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
