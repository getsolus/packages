# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : kpkpass
version    : 26.08.1
release    : 87
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/kpkpass-26.08.1.tar.xz : d1b9f52e266d7be21e818780a1a4578c3d8cf574925f5c0265e583f82408c903
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
    - MIT
component  : programming.library
summary    : Apple Wallet Pass reader
description: |
    Library to deal with Apple Wallet pass files.
builddeps  :
    - kf6-karchive-devel
rundeps    :
    - devel :
        - kf6-karchive-devel
        - qt6-base-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
