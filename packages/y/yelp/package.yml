# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : yelp
version    : '49.2'
release    : 38
source     :
    - https://download.gnome.org/sources/yelp/49/yelp-49.2.tar.xz : 5afc8e77308451ee45ee919efee5a154ca3c153a90e2a1b58cebf7827ab88ad0
homepage   : https://gitlab.gnome.org/GNOME/yelp
license    : GPL-2.0-or-later
component  : desktop.gnome
summary    : GNOME Help Browser
description: |
    Yelp is the default help browser for the GNOME desktop.  Yelp provides a simple graphical interface for viewing DocBook, HTML, man, and info formatted documentation.  The name Yelp was suggested by Daniel Lundin. Yelp is pronounced the same as the swedish word for help.
builddeps  :
    - pkgconfig(bzip2)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libgcrypt)
    - pkgconfig(libhandy-1)
    - pkgconfig(libsoup-2.4)
    - pkgconfig(libxslt)
    - pkgconfig(sqlite3)
    - pkgconfig(webkitgtk-6.0)
    - pkgconfig(yelp-xsl)
    - desktop-file-utils
    - itstool
rundeps    :
    - docbook-xml
    - yelp-xsl
setup      : |
    %meson_configure \
             -Dlzma=enabled \
             -Dbzip2=enabled
build      : |
    %ninja_build
install    : |
    %ninja_install
