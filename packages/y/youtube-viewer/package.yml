# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : youtube-viewer
version    : 3.11.6
release    : 47
source     :
    - https://github.com/trizen/youtube-viewer/archive/refs/tags/3.11.6.tar.gz : bf0a5b2bf911ecb2201212d2a87d8425c9140f87093957af1e61cbe1039a46f1
homepage   : https://github.com/trizen/youtube-viewer
license    : Artistic-2.0
component  : network.web
summary    : A lightweight application for searching and streaming videos from YouTube
description: |
    A lightweight application for searching and streaming videos from YouTube.
builddeps  :
    - perl-module-build
    - perl-test-pod
rundeps    :
    - libwww-perl
    - mpv
    - perl-clone
    - perl-file-sharedir
    - perl-gtk2
    - perl-gtk3
    - perl-json
    - perl-json-xs
    - perl-term-readline-gnu
    - perl-unicode-linebreak
    - yt-dlp
setup      : |
    # The Makefile build doesn't include the gtk app (yet)
    rm Makefile.PL
build      : |
    %perl_setup --gtk
install    : |
    %perl_install
    %install_file share/gtk-youtube-viewer.desktop ${installdir}/usr/share/applications/gtk-youtube-viewer.desktop
    %install_file share/icons/gtk-youtube-viewer.png ${installdir}/usr/share/pixmaps/gtk-youtube-viewer.png
    %install_file ${pkgfiles}/io.github.trizen.youtube_viewer.metainfo.xml -t ${installdir}/usr/share/metainfo/
    %install_license LICENSE
check      : |
    ./Build test
patterns   :
    - /*
