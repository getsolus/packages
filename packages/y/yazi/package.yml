# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : yazi
version    : 26.9.1
release    : 10
source     :
    - https://github.com/sxyazi/yazi/archive/refs/tags/v26.9.1.tar.gz : 66857f1b670469daf258edd0bb2ea51d9ad3e2cab4eea9684028c80059fd6862
homepage   : https://yazi-rs.github.io
license    : MIT
component  : system.utils
summary    : Blazingly fast terminal file manager
description: |
    Yazi is a terminal file manager written in Rust with async I/O, rich preview,
    and extensibility through plugins and themes.
networking : true
builddeps  :
    - pkgconfig(oniguruma)
    - pkgconfig(zlib)
    - rust
rundeps    :
    - hicolor-icon-theme
    - oniguruma
environment: |
    export VERGEN_GIT_SHA="Solus"
    export YAZI_GEN_COMPLETIONS=true
    export RUSTONIG_DYNAMIC_LIBONIG=1
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install yazi ya
    %install_license LICENSE*
    %install_file "assets/yazi.desktop" -t "${installdir}/usr/share/applications"

    # Install appstream metainfo
    %install_file "${pkgfiles}/io.github.sxyazi.yazi.metainfo.xml" -t "${installdir}/usr/share/metainfo"

    # Install icon
    %install_file "assets/logo.png" "${installdir}/usr/share/icons/hicolor/512x512/apps/yazi.png"

    # Install shell completions for yazi
    %install_file "yazi-boot/completions/yazi.bash" "${installdir}/usr/share/bash-completion/completions/yazi"
    %install_file "yazi-boot/completions/yazi.fish" "${installdir}/usr/share/fish/vendor_completions.d/yazi.fish"
    %install_file "yazi-boot/completions/_yazi" "${installdir}/usr/share/zsh/site-functions/_yazi"

    # Install shell completions for ya
    %install_file "yazi-cli/completions/ya.bash" "${installdir}/usr/share/bash-completion/completions/ya"
    %install_file "yazi-cli/completions/ya.fish" "${installdir}/usr/share/fish/vendor_completions.d/ya.fish"
    %install_file "yazi-cli/completions/_ya" "${installdir}/usr/share/zsh/site-functions/_ya"
