# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : yacreader
version    : 10.5.1
release    : 19
source     :
    - https://github.com/YACReader/yacreader/archive/refs/tags/10.5.1.tar.gz : a1b3982fd60d018f846ddcafe594498c4482a1f34d0519159806096db43196bd
homepage   : https://www.yacreader.com/
license    : GPL-3.0-or-later
component  : office.viewers
summary    : Yet another comic reader
description: |
    A comic reader for cross-platform reading and managing your digital comic collection.
builddeps  :
    - pkgconfig(Qt6Core5Compat)
    - pkgconfig(Qt6Help)
    - pkgconfig(Qt6Multimedia)
    - pkgconfig(Qt6QuickControls2)
    - pkgconfig(Qt6ShaderTools)
    - pkgconfig(Qt6Svg)
    - pkgconfig(Qt6TextToSpeech)
    - pkgconfig(libarchive)
    - pkgconfig(poppler-qt6)
    - qt6-base-private-devel
rundeps    :
    - qt6-quick3d
clang      : true
setup      : |
    %cmake_ninja \
      -DBUILD_TESTS=OFF
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_file ${pkgfiles}/com.yacreader.YACReader.metainfo.xml -t ${installdir}/usr/share/metainfo
    # Install translations, https://github.com/YACReader/yacreader/issues/590
    for i in YACReader YACReaderLibrary YACReaderLibraryServer; do
      pushd solusBuildDir/${i}
        %install_file yacreader*_* -t ${installdir}/usr/share/yacreader/languages
      popd
    done
    %install_license COPYING.txt
