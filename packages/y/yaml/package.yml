# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : yaml
version    : 0.2.6
release    : 9
source     :
    - https://github.com/yaml/libyaml/releases/download/0.2.6/yaml-0.2.6.tar.gz : 43b393a117bd4fe39812fddc94e3d654359a3ae05653dcf0110a1122d1747e61
homepage   : https://pyyaml.org/wiki/LibYAML
license    : MIT
component  : system.utils
summary    : A YAML parser and emitter library
description: |
    LibYAML is a YAML parser and emitter library.
setup      : |
    %patch -p1 -i ${pkgfiles}/fix-libtool-versioning.patch

    %configure --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license License
check      : |
    %make check
