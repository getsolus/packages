# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : yad
version    : '15.0'
release    : 22
source     :
    - https://github.com/v1cont/yad/archive/v15.0.tar.gz : 0f98319bc27df6d1f351d0da0fe86e91142ca5b64901bc3008dbfb6ef456dd6b
license    : GPL-3.0-or-later
homepage   : https://github.com/v1cont/yad
component  : system.utils
summary    : A tool for creating graphical dialogs from shell scripts
description: |
    YAD (yet another dialog) is a tool for creating graphical dialogs from shell scripts
builddeps  :
    - pkgconfig(gspell-1)
    - pkgconfig(gtksourceview-3.0)
    - pkgconfig(webkit2gtk-4.1)
    - gettext-devel
setup      : |
    autoreconf -ivf
    %configure --enable-html \
               --enable-sourceview \
               --enable-spell \
               --with-gtk=gtk3
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
