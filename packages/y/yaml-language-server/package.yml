# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : yaml-language-server
version    : 1.24.0
release    : 2
source     :
    - https://github.com/redhat-developer/yaml-language-server/archive/refs/tags/1.24.0.tar.gz : 9f96660671083d41a300ba197c4979364b75889a6ed7390cf8e26281fe5e2e3b
homepage   : https://github.com/redhat-developer/yaml-language-server
license    : MIT
component  : programming.tools
summary    : Language Server for YAML Files
description: |
    Supports JSON Schema 7 and below. Starting from 1.0.0 the language server uses eemeli/yaml as the new YAML parser, which strictly enforces the specified YAML spec version. Default YAML spec version is 1.2, it can be changed with yaml.yamlVersion setting.
builddeps  :
    - nodejs
rundeps    :
    - nodejs
networking : true
setup      : |
    npm ci
build      : |
    npm run compile
install    : |
    export mod_dir=%libdir%/node_modules/yaml-language-server

    %install_license LICENSE

    %install_dir "${installdir}"/{usr/bin,${mod_dir}}
    ln -srv ${installdir}/${mod_dir}/bin/yaml-language-server "${installdir}"/usr/bin/yaml-language-server

    npm prune --omit=dev

    cp -arv --no-preserve=ownership bin l10n node_modules out package.json "${installdir}"/${mod_dir}
# check     : |
#     npm test
