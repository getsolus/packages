# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : yt-dlp
version    : 2026.11.23
release    : 277
source     :
    - https://github.com/yt-dlp/yt-dlp/archive/refs/tags/2026.11.23.tar.gz : 129f357ae3d81191a02bcd2c7af591d1c2c6b3346053e91ae041ab5a5c7877d8
homepage   : https://github.com/yt-dlp/yt-dlp
license    : Unlicense
component  : network.download
summary    : yt-dlp is a small command-line program for downloading videos from YouTube and other platforms
description: |
    yt-dlp, a fork of youtube-dl, is a small command-line program for downloading videos from YouTube and other platforms
builddeps  :
    - pkgconfig(python3)
    - pandoc
    - python-build
    - python-hatchling
    - python-installer
rundeps    :
    - deno
    - mutagen
    - python-certifi
    - python-pycryptodome
    - python-websockets
    - python3
    - yt-dlp-ejs
build      : |
    %make PREFIX=${installdir}/usr \
        yt-dlp.1 \
        completion-bash \
        completion-fish \
        completion-zsh

    %pyproject_build
install    : |
    %pyproject_install

    rm -rf ${installdir}/usr/share/doc
    ln -s /usr/bin/yt-dlp ${installdir}/usr/bin/youtube-dl
    ln -s /usr/bin/yt-dlp ${installdir}/usr/bin/yt-dlc
replaces   :
    - youtube-dl
    - yt-dlc
