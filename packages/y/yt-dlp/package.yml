# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : yt-dlp
version    : 2026.10.26
release    : 276
source     :
    - https://github.com/yt-dlp/yt-dlp/archive/refs/tags/2026.10.26.tar.gz : 7d5da51731c3f5f5db13d16249fae085e170cc58807c43d68dcb41b7ede99a0d
license    : Unlicense
component  : network.download
homepage   : https://github.com/yt-dlp/yt-dlp
summary    : yt-dlp is a small command-line program for downloading videos from YouTube and other platforms
description: |
    yt-dlp, a fork of youtube-dl, is a small command-line program for downloading videos from YouTube and other platforms
replaces   :
    - youtube-dl
    - yt-dlc
builddeps  :
    - pkgconfig(python3)
    - pandoc
    - python-build
    - python-hatchling
    - python-installer
rundeps    :
    - deno
    - mutagen
    - python-certifi
    - python-pycryptodome
    - python-websockets
    - python3
    - yt-dlp-ejs
build      : |
    %make PREFIX=$installdir/usr yt-dlp.1 completion-bash completion-fish completion-zsh
    %pyproject_build
install    : |
    %pyproject_install
    rm -rf $installdir/usr/share/doc
    ln -s /usr/bin/yt-dlp $installdir/usr/bin/youtube-dl
    ln -s /usr/bin/yt-dlp $installdir/usr/bin/yt-dlc
