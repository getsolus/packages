# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : unbound
version    : 1.26.2
release    : 25
source     :
    - https://nlnetlabs.nl/downloads/unbound/unbound-1.26.2.tar.gz : d8ee7aa6bbb3ff1be7d9e57637d0d0ec2f18273a8efff1a0afe2c665858b96f7
homepage   : https://nlnetlabs.nl/projects/unbound/about/
license    : BSD-3-Clause
component  : network.util
summary    : Unbound is a validating, recursive, and caching DNS resolver.
description: |
    Unbound is a validating, recursive, and caching DNS resolver.
builddeps  :
    - pkgconfig(libevent)
setup      : |
    %configure \
        --disable-static \
        --enable-event-api \
        --enable-pie \
        --enable-relro-now \
        --enable-systemd \
        --enable-ipsecmod \
        --with-libevent \
        --with-conf-file=%libdir%/unbound/unbound.conf \
        --with-pidfile=/run/unbound/unbound.pid
build      : |
    %make
install    : |
    %make_install
    %install_license LICENSE

    %install_file contrib/unbound.{service,socket} -t ${installdir}/%libdir%/systemd/system
    %install_file contrib/libunbound.pc -t ${installdir}/%libdir%/pkgconfig
    %install_file ${pkgfiles}/unbound.tmpfiles ${installdir}/%libdir%/tmpfiles.d/unbound.conf
    %install_file ${pkgfiles}/unbound.sysusers ${installdir}/%libdir%/sysusers.d/unbound.conf

    # Use our own settings (lot of work is still required to provide sane config but at least this allows to start the service)
    %install_file ${pkgfiles}/unbound.service ${installdir}/%libdir%/systemd/system/unbound.service
    %install_file ${pkgfiles}/unbound.conf ${installdir}/%libdir%/unbound/unbound.conf
check      : |
    %make check
