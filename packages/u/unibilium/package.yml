# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : unibilium
version    : 2.1.4
release    : 6
source     :
    - https://github.com/neovim/unibilium/archive/refs/tags/v2.1.4.tar.gz : 7360907bcf79ba49f6fc4a504767ff86e93ab9018477026fcc70d5ab77e1f2c1
homepage   : https://github.com/neovim/unibilium/
license    : LGPL-3.0
component  : programming
summary    : A terminfo parsing library
description: |
    Unibilium is a very basic terminfo library. It can read and write ncurses-style terminfo files. It doesn't depend on curses or any other library. It also doesn't use global variables, so it should be thread-safe.
setup      : |
    %reconfigure
build      : |
    %make
install    : |
    %make_install
    %install_license LICENSE GPLv3 LGPLv3
    # No static libraries
    rm ${installdir}/%libdir%/libunibilium.a
check      : |
    %make test
