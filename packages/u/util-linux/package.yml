# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : util-linux
version    : 2.42.4
release    : 63
source     :
    - https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.4.tar.xz : fbd62a100ab7bb8746ba0661255c3c48185b1e9021507c624da01fbc696330ec
homepage   : https://github.com/util-linux/util-linux
license    :
    - BSD-3-Clause
    - BSD-4-Clause-UC
    - GPL-2.0-only
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
    - Public-Domain
component  :
    - system.base
    - ^python3-libmount : programming.python
summary    :
    - util-linux (Essential Linux utilties)
    - ^python3-libmount : Libmount bindings for Python
description:
    - Util-linux is a suite of essential tools for any Linux system, such as chsh, kill, cfdisk, mkfs, mount, and more.
    - ^python3-libmount : Libmount bindings for Python
emul32     : true
autodep    : false
devel      : true
builddeps  :
    - pkgconfig32(libeconf)
    - pkgconfig32(libgcrypt)
    - pkgconfig32(liblzma)
    - pkgconfig32(libsystemd)
    - pkgconfig32(libxcrypt)
    - pkgconfig32(ncursesw)
    - pkgconfig32(pam)
    - pkgconfig32(zlib)
    - pkgconfig(libcap-ng)
    - pkgconfig(python3)
    - pkgconfig(sqlite3)
    - asciidoctor
    - po4a
rundeps    :
    - 32bit :
        - systemd-32bit # TODO: why isn't this be resolved automatically?
    - 32bit-devel :
        - libeconf-32bit-devel
    - devel :
        - libeconf-devel
setup      : |
    # Fix usage with musl
    export CFLAGS="${CFLAGS/-D_FORTIFY_SOURCE=2/}"

    if [ -n "${EMUL32BUILD+set}" ]; then
        %meson_configure \
                         -Dbuild-python=disabled
    else
        %meson_configure \
                         -Deconf=enabled \
                         -Dvendordir=/usr/share/defaults/etc
    fi
build      : |
    if [ -n "${EMUL32BUILD+set}" ]; then
        meson compile -C solusBuildDir %JOBS% \
                      ./libblkid/blkid:shared_library \
                      ./libblkid/blkid:static_library \
                      fdisk:shared_library \
                      mount:shared_library \
                      ./libsmartcols/smartcols:shared_library \
                      ./libsmartcols/smartcols:static_library \
                      ./libuuid/uuid:shared_library
    else
        %ninja_build
    fi
install    : |
    if [ -n "${EMUL32BUILD+set}" ]; then
        # create the dirs we need first
        %install_dir ${installdir}/usr/lib32/pkgconfig
        # install libraries
        find solusBuildDir/ \
            \( -name '*.so.*.*' -o -name '*.a' \) ! -name '*.p' ! -name '*.symbols'  \
            -print \
            -exec %install_file '{}' ${installdir}/usr/lib32/ \;

        # Manually create soname links
        for lib in ${installdir}/%libdir%/lib*.so.*; do
            i=`dirname ${lib}`
            clean=`echo $(basename ${lib})|sed -e 's|.so\..*|.so|'`
            soname=`objdump -p ${lib} | gawk '/SONAME/ {print $2}'`
            echo $lib $i $clean $soname
            if [[ ! -e $i/${soname} ]] ; then
                ln -sv `basename ${lib}` $i/${soname}
            fi
            if [[ ! -e $i/${clean} ]]; then
                ln -sv `basename ${lib}` $i/${clean}
            fi
        done

        # install .pc files
        find solusBuildDir/ \
            -type f -name '*.pc' ! -name '*uninstalled*' \
            -print \
            -exec %install_file '{}' ${installdir}/usr/lib32/pkgconfig/ \;
    else
        %ninja_install

        # Arch command
        %install_bin ${pkgfiles}/arch

        mv ${installdir}/usr/lib/* ${installdir}/usr/lib64
        rmdir ${installdir}/usr/lib

        # Ensure that uuid daemon works
        %install_file ${pkgfiles}/util-linux.sysusers ${installdir}/%libdir%/sysusers.d/util-linux.conf

        # Install systemd service presets
        %install_file -t ${installdir}/%libdir%/systemd/system-preset/ ${pkgfiles}/20-util-linux.preset

        # PAM
        %install_dir ${installdir}/usr/share/defaults/etc/pam.d
        %install_file ${pkgfiles}/pam.d/* -t ${installdir}/usr/share/defaults/etc/pam.d
    fi

    %install_license COPYING
# Tests compile but they are not run because of
# "Ignore util-linux test suite [non-root UID expected]."
# check      : |
#     if [ -z "${EMUL32BUILD+set}" ]; then
#         unset LD_PRELOAD
#         %ninja_check
#     fi
patterns   :
    - ^python3-libmount :
        - /usr/lib64/python3*/site-packages/libmount
