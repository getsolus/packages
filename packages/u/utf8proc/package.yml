# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : utf8proc
version    : 2.12.0
release    : 5
source     :
    - https://github.com/JuliaStrings/utf8proc/archive/refs/tags/v2.12.0.tar.gz : f564011d38b2888d583d510b08e69ffa15aa117155db1b9b49ef1dfe1fa25111
homepage   : https://juliastrings.github.io/utf8proc/
license    :
    - MIT
    - Unicode-TOU
component  : programming.library
summary    : A clean C library for processing UTF-8 Unicode data
description: |
    utf8proc is a small, clean C library that provides Unicode normalization, case-folding, and other operations for data in the UTF-8 encoding.
setup      : |
    %cmake_ninja \
        -DUTF8PROC_ENABLE_TESTING:BOOL=true \
        -DBUILD_SHARED_LIBS:BOOL=true
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE.md
check      : |
    %ninja_check
