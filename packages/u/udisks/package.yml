# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : udisks
version    : 2.11.2
release    : 34
source     :
    - https://github.com/storaged-project/udisks/releases/download/udisks-2.11.2/udisks-2.11.2.tar.bz2 : 18630a8aad806bea0bc626ce97e71e50ec82c742956ac1c834a4275f8f22207b
homepage   : https://github.com/storaged-project/udisks
license    : GPL-2.0-or-later
component  : desktop.core
summary    : Daemon, tools and libraries to access disks and storage devices
description: |
    The UDisks package provides a daemon, tools and libraries to access and manipulate disks and storage devices.
builddeps  :
    - pkgconfig(blockdev)
    - pkgconfig(devmapper)
    - pkgconfig(libacl)
    - pkgconfig(libatasmart)
    - pkgconfig(libattr)
rundeps    :
    - cryptsetup
    - exfatprogs
    - gptfdisk
    - mdadm
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Add-support-for-a-stateless-configuration-file.patch

    %configure \
        --disable-static \
        --enable-introspection \
        --with-udevdir=%libdir%/udev \
        --with-modprobedir=%libdir%/modprobe.d \
        --disable-man \
        --enable-btrfs \
        --enable-lvm2
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING

    %install_file ${pkgfiles}/udisks.preset ${installdir}/%libdir%/systemd/system-preset/60-${package}.preset

    # Polkit rules file
    %install_file $pkgfiles/org.freedesktop.UDisks2.rules ${installdir}/usr/share/polkit-1/rules.d/org.freedesktop.UDisks2.rules

    # Stateless
    %install_file -t ${installdir}/usr/share/defaults/udisks2 udisks/udisks2.conf
    rm -v ${installdir}/etc/udisks2/mount_options.conf.example \
          ${installdir}/etc/udisks2/udisks2.conf
    rmdir -v ${installdir}/etc/udisks2 \
             ${installdir}/etc \
             ${installdir}/var/lib/udisks2 \
             ${installdir}/var/lib \
             ${installdir}/var
check      : |
    %make check
