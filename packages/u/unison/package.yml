# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : unison
version    : 2.54.0
release    : 10
source     :
    - https://github.com/bcpierce00/unison/archive/refs/tags/v2.54.0.tar.gz : 0f14154611a2dfebb8c229be85ceda29a750eace4fb75d06e0d43fe5b58a6e87
homepage   : https://github.com/bcpierce00/unison
license    : GPL-3.0-or-later
component  : network.util
summary    : Unison is a file-synchronization tool for Unix and Windows.
description: |
    Unison is a file-synchronization tool for Unix and Windows. It allows two replicas of a collection of files and directories to be stored on different hosts (or different disks on the same host), modified separately, and then brought up to date by propagating the changes in each replica to the other.
builddeps  :
    - ocaml
build      : |
    make -j1
install    : |
    %install_bin src/unison
    %install_bin src/unison-fsmonitor
    %install_license LICENSE
