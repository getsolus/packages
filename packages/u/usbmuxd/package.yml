# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : usbmuxd
version    : 1.1.1.99
release    : 11
source     :
    # Commit date 2025-12-05
    - git|https://github.com/libimobiledevice/usbmuxd.git : 3ded00c9985a5108cfc7591a309f9a23d57a8cba
homepage   : https://libimobiledevice.org/
license    : GPL-3.0-or-later
component  : system.utils
summary    : A socket daemon to multiplex connections from and to iOS devices.
description: |
    A socket daemon to multiplex connections from and to iOS devices.
builddeps  :
    - pkgconfig(libimobiledevice-1.0)
    - pkgconfig(libimobiledevice-glue-1.0)
    - pkgconfig(libusb-1.0)
setup      : |
    %reconfigure --prefix=/usr --sbindir=/usr/bin
build      : |
    %make
install    : |
    %make_install
    %install_file ${pkgfiles}/usbmux.sysusers ${installdir}/%libdir%/sysusers.d/usbmux.conf
    %install_license COPYING.*
