# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : utfcpp
version    : 4.2.1
release    : 9
source     :
    - https://github.com/nemtrif/utfcpp/archive/refs/tags/v4.2.1.tar.gz : 6d6a5493a111884cc085ee31babfe6d9960c8fb08fc80a64852eaeea8323dbc1
license    : BSL-1.0
component  : programming.library
homepage   : https://github.com/nemtrif/utfcpp
summary    : UTF-8 with C++ in a Portable Way.
description: |
    UTF-8 with C++ in a Portable Way.
patterns   :
    - /* # it's a header-only library
setup      : |
    %cmake_ninja -DUTF8_SAMPLES=OFF -DUTF8_TESTS=OFF
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
