# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : umbrello
version    : 26.08.3
release    : 121
source     :
    - https://download.kde.org/stable/release-service/26.08.3/src/umbrello-26.08.3.tar.xz : 6395fee2110eb4de73c84aad1128a7c58e4898064bc03d48f38812a0f90bd38a
homepage   : https://kde.org/applications/development/org.kde.umbrello
license    :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - GPL-3.0-or-later
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - MIT
component  : programming.tools
summary    : Umbrello UML Modeller is a UML diagramming tool for KDE
description: |
    Umbrello UML Modeller is a UML diagramming tool for KDE
builddeps  :
    - pkgconfig(Qt6Svg)
    - pkgconfig(libxslt)
    - kdevelop-devel
    - kdevelop-pg-qt-devel
    - kf6-karchive-devel
    - kf6-kcrash-devel
    - kf6-kdoctools-devel
    - kf6-kiconthemes-devel
    - kf6-ktexteditor-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*

    #Remove docs
    rm -rfv $installdir/usr/share/doc
    rm -rfv $installdir/usr/share/umbrello6/apidoc
