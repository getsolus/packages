# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : usdx
version    : 2026.9.0
release    : 28
source     :
    - https://github.com/UltraStar-Deluxe/USDX/archive/refs/tags/v2026.9.0.tar.gz : a8f0fc78f307046224fd85314abe6771e9daf54374cf656372d5ed96b46f4e49
homepage   : https://usdx.eu/
license    : GPL-2.0-or-later
component  : games
summary    : UltraStar Deluxe - A free and open source karaoke singing game inspired by Sony SingStar™
description: |
    UltraStar Deluxe (USDX) is a free and open source karaoke game. It allows up to six players to sing along with music using microphones in order to score points, depending on the pitch of the voice and the rhythm of singing. UltraStar Deluxe is a fork of the original UltraStar (developed by corvus5). Many features have been added like party mode, theme support and support for more audio and video formats.
builddeps  :
    - pkgconfig(SDL2_image)
    - pkgconfig(freetype2)
    - pkgconfig(libavformat)
    - pkgconfig(lua)
    - pkgconfig(portaudio-2.0)
    - pkgconfig(sqlite3)
    - pkgconfig(x11)
    - fpc
setup      : |
    %autogen
build      : |
    %make LDFLAGS="-O1 --sort-common --as-needed -z relro"
install    : |
    %make_install
    %install_license LICENSE
    # Install icons
    install -d -m 00644 ${installdir}/usr/share/icons/hicolor
    for i in 32 256 512; do
        %install_file icons/ultrastardx-icon_$i.png "${installdir}/usr/share/icons/hicolor/${i}x$i/apps/ultrastardx.png"
    done
    %install_file icons/ultrastardx-icon.svg ${installdir}/usr/share/icons/hicolor/scalable/apps/ultrastardx.svg
    # Install desktop file and appstream metadata
    %install_file dists/ultrastardx.desktop -t ${installdir}/usr/share/applications
    %install_file dists/ultrastardx.appdata.xml -t ${installdir}/usr/share/metainfo
