# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : upx
version    : 5.2.1
release    : 11
source     :
    - https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-src.tar.xz : a7d457be4ef942e46844ee8f301206b111394cbcbde3599747a6904c54ff116b
homepage   : https://upx.github.io/
license    : GPL-2.0-or-later
component  : system.utils
summary    : Ultimate Packer for eXecutables.
description: |
    Free, portable, extendable, high-performance executable packer for several executable formats. UPX achieves an excellent compression ratio and offers very fast decompression. Your executables suffer no memory overhead or other drawbacks for most of the formats supported, because of in-place decompression.
build      : |
    %make
install    : |
    %install_bin build/release/upx
    %install_file doc/upx.1 ${installdir}/usr/share/man/man1/upx.1
    %install_license LICENSE COPYING
