# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : urlscan
version    : 1.2.0
release    : 16
source     :
    - https://github.com/firecat53/urlscan/archive/refs/tags/1.2.0.tar.gz : afd4e3b33ed8ec58f8f60c28767f89fa8c638efbe00baf137865f0cdcf0b11a0
homepage   : https://github.com/firecat53/urlscan
license    : GPL-2.0-or-later
component  : network.mail
summary    : Mutt and terminal url selector (similar to urlview)
description: |
    Urlscan is a small program that is designed to integrate with the "mutt" mailreader to allow you to easily launch a Web browser for URLs contained in email messages. It is a replacement for the "urlview" program.
builddeps  :
    - python-build
    - python-hatch-vcs
    - python-hatchling
    - python-installer
    - python-wheel
checkdeps  :
    - python-pytest
    - python3-urwid
rundeps    :
    - python3-urwid
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest
