# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : urlscan
version    : 1.0.9
release    : 15
source     :
    - https://files.pythonhosted.org/packages/source/u/urlscan/urlscan-1.0.9.tar.gz : 067087895077762807ff028ed332e4e1ab6e1a7c249188dc846f6d160afba7ff
homepage   : https://github.com/firecat53/urlscan
license    : GPL-2.0-or-later
component  : network.mail
summary    : Mutt and terminal url selector (similar to urlview)
description: |
    Urlscan is a small program that is designed to integrate with the "mutt" mailreader to allow you to easily launch a Web browser for URLs contained in email messages. It is a replacement for the "urlview" program.
builddeps  :
    - python-build
    - python-hatch-vcs
    - python-hatchling
    - python-installer
    - python-wheel
rundeps    :
    - python3-urwid
build      : |
    %python3_setup
install    : |
    %python3_install
