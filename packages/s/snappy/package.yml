# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : snappy
version    : 1.2.2
release    : 5
source     :
    - https://github.com/google/snappy/archive/1.2.2.tar.gz : 90f74bc1fbf78a6c56b3c4a082a05103b3a56bb17bca1a27e052ea11723292dc
license    : BSD-3-Clause
component  : programming
homepage   : https://google.github.io/snappy/
summary    : Snappy is a compression/decompression library.
description: |
    Snappy is a compression/decompression library. It does not aim for maximum compression, or compatibility with any other compression library; instead, it aims for very high speeds and reasonable compression.
checkdeps  :
    - pkgconfig(benchmark)
    - pkgconfig(gtest)
setup      : |
    %patch -p1 -i $pkgfiles/cmake_add_pkgconfig.patch
    %patch -p1 -i $pkgfiles/system-gtest.patch
    %patch -p1 -i $pkgfiles/snappy-reenable_rtti.patch

    cp $pkgfiles/snappy.pc.in .
    # compile without assertions
    CXXFLAGS+=\ -DNDEBUG

    %cmake_ninja \
                 -DBUILD_SHARED_LIBS=ON \
                 -DSNAPPY_USE_BUNDLED_GTEST=OFF \
                 -DSNAPPY_BUILD_BENCHMARKS=OFF \
                 -DCMAKE_CXX_STANDARD=17
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
check      : |
    %ninja_check
