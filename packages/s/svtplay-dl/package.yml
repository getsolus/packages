# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : svtplay-dl
version    : '4.199'
release    : 43
source     :
    - https://github.com/spaam/svtplay-dl/archive/refs/tags/4.199.tar.gz : d8ec28646cdd644c35b1bf64546b723ac41b07c533fe3292d2c2a2aa74e78b07
homepage   : https://svtplay-dl.se/
license    : MIT
component  : network.download
summary    : Small command-line program to download videos from some streaming sites
description: |
    svtplay-dl is an open source command-line program written in python. You can quickly download published videos from various sites to your local computer.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - ffmpeg
    - python-cryptography
    - python-pysocks
    - python-requests
    - pyyaml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
