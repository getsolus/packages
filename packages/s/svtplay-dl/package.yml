# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : svtplay-dl
version    : '4.211'
release    : 44
source     :
    - https://github.com/spaam/svtplay-dl/archive/refs/tags/4.211.tar.gz : 47f5386fbc22edc320649abb205e56af4319dbeaccea0f030218af8c111c4934
homepage   : https://svtplay-dl.se/
license    : MIT
component  : network.download
summary    : Small command-line program to download videos from some streaming sites
description: |
    svtplay-dl is an open source command-line program written in python. You can quickly download published videos from various sites to your local computer.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - ffmpeg
    - python-cryptography
    - python-pysocks
    - python-requests
    - pyyaml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
