# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : svtplay-dl
version    : '4.193'
release    : 42
source     :
    - https://github.com/spaam/svtplay-dl/archive/refs/tags/4.193.tar.gz : ba79be27373761c81bac11c18bb652ab4a170dadf11a810395662d9337a82b5c
homepage   : https://svtplay-dl.se/
license    : MIT
component  : network.download
summary    : Small command-line program to download videos from some streaming sites
description: |
    svtplay-dl is an open source command-line program written in python. You can quickly download published videos from various sites to your local computer.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - ffmpeg
    - python-cryptography
    - python-pysocks
    - python-requests
    - pyyaml
build      : |
    %python3_setup
install    : |
    %python3_install
