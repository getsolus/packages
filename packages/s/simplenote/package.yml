# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : simplenote
version    : 2.27.1
release    : 52
source     :
    - https://github.com/Automattic/simplenote-electron/releases/download/v2.27.1/Simplenote-linux-2.27.1-amd64.deb : 07652e366637d7120c761f4f755d83479a40e9d807a0530dc7052f22750d5a34
extract    : false
homepage   : https://simplenote.com/
license    : GPL-2.0-only
component  : office.notes
summary    : The simplest way to keep notes
description: |
    A Simplenote React app packaged in Electron.
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(cups)
    - pkgconfig(gbm)
    - pkgconfig(gtk+-3.0)
setup      : |
    ar xf ${sources}/Simplenote-linux-${version}-amd64.deb
    mkdir root
    tar xf data.tar.gz -C root
install    : |
    %install_dir ${installdir}/usr/bin

    cp -arv --no-preserve=ownership root/usr/* ${installdir}/usr
    cp -arv --no-preserve=ownership root/opt/* ${installdir}/usr/share

    ln -srv ${installdir}/usr/share/Simplenote/simplenote ${installdir}/usr/bin/simplenote

    %install_file ${pkgfiles}/simplenote.desktop -t ${installdir}/usr/share/applications
    %install_file ${pkgfiles}/com.simplenote.Simplenote.appdata.xml -t ${installdir}/usr/share/metainfo
