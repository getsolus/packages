# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : stella
version    : '7.0'
release    : 13
source     :
    - https://github.com/stella-emu/stella/archive/refs/tags/7.0c.tar.gz : b9309198aa5746cd568e91caaea10bbeab4ca8155493d0243694b41bdb39d7ca
homepage   : https://stella-emu.github.io/
license    :
    - BSD-3-Clause
    - GPL-2.0-or-later
component  : games.emulator
summary    : Stella Atari 2600 Emulator
description: |
    Stella is a multi-platform Atari 2600 VCS emulator.
builddeps  :
    - pkgconfig(libpng)
    - pkgconfig(sdl2) # does not work with sdl3 yet
setup      : |
    %configure
build      : |
    %make
install    : |
    %make_install
    # Install appstream metainfo
    %install_file ${pkgfiles}/io.github.stella_emu.Stella.metainfo.xml -t ${installdir}/usr/share/metainfo/
