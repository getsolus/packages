# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : safeeyes
version    : 3.5.1
release    : 24
source     :
    - https://github.com/slgobinath/safeeyes/archive/refs/tags/v3.5.1.tar.gz : fffa71c7f1baaf185e402895e75b2e13bbf9d45a059c7689407cf4db805b8972
homepage   : https://slgobinath.github.io/safeeyes/
license    : GPL-3.0-or-later
component  : desktop
summary    : Safe Eyes is a tool to reduce and prevent repetitive strain injury (RSI)
description: |
    Protect your eyes from eye strain using this simple and beautiful, yet extensible break reminder.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - libgtk-4
    - libnotify
    - pipewire
    - python-babel
    - python-croniter
    - python-gobject
    - python-psutil
    - python-pywayland
    - python-xlib
    - xprintidle
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_license LICENSE

    %install_file safeeyes/platform/io.github.slgobinath.SafeEyes.desktop -t ${installdir}/usr/share/applications

    %install_file safeeyes/platform/io.github.slgobinath.SafeEyes.metainfo.xml -t ${installdir}/usr/share/metainfo

    # Install icons
    for size in 16x16 24x24 32x32 48x48 64x64 128x128; do
        if [ -d safeeyes/platform/icons/hicolor/${size}/status ]; then
            %install_file safeeyes/platform/icons/hicolor/${size}/status/*.png -t ${installdir}/usr/share/icons/hicolor/${size}/status
        fi

        %install_file safeeyes/platform/icons/hicolor/${size}/apps/*.png -t ${installdir}/usr/share/icons/hicolor/${size}/apps
    done

    # Remove duplicate icons and desktop file.
    rm -rv ${installdir}/usr/lib/python%python3_version%/site-packages/safeeyes/platform
