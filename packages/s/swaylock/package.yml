# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : swaylock
version    : 1.8.6
release    : 11
source     :
    - https://github.com/swaywm/swaylock/archive/refs/tags/v1.8.6.tar.gz : 904376fd012bfff888d042606539c677d90e11f8beeeccc50a9fe387fc41a686
homepage   : https://github.com/swaywm/swaylock
license    : MIT
component  : desktop
summary    : swaylock is a screen locking utility for Wayland compositors
description: |
    swaylock is a screen locking utility for Wayland compositors
builddeps  :
    - pkgconfig(cairo)
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(scdoc)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(xkbcommon)
setup      : |
    %patch -p1 -i ${pkgfiles}/stateless.patch

    %meson_configure \
        -Dgdk-pixbuf=enabled \
        -Dpam=enabled
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSE
