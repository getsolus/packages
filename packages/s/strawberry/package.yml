# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : strawberry
version    : 1.2.30
release    : 108
source     :
    - https://github.com/strawberrymusicplayer/strawberry/releases/download/1.2.30/strawberry-1.2.30.tar.xz : 30fea0fdfc2f9c5449ac30d78ac2f5429fb5e1d025a4d1d3473d10f2abe1ef2a
license    : GPL-3.0-or-later
homepage   : https://www.strawberrymusicplayer.org
component  : multimedia.audio
summary    : Strawberry is a audio player and music collection organizer.
description: |
    Strawberry is a audio player and music collection organizer. It is a fork of Clementine released in 2018 aimed at music collectors, audio enthusiasts and audiophiles.
builddeps  :
    - pkgconfig(Qt6UiTools)
    - pkgconfig(alsa)
    - pkgconfig(fftw3)
    - pkgconfig(gstreamer-audio-1.0)
    - pkgconfig(icu-i18n)
    - pkgconfig(libcdio)
    - pkgconfig(libchromaprint)
    - pkgconfig(libebur128)
    - pkgconfig(libmtp)
    - pkgconfig(libpulse)
    - pkgconfig(libsparsehash)
    - pkgconfig(sqlite3)
    - pkgconfig(taglib)
    - gstreamer-plugins-good
    - gstreamer-plugins-ugly
    - kdsingleapplication-devel
    - libboost-devel
    - qt6-base-private-devel
setup      : |
    %cmake \
        -DINSTALL_TRANSLATIONS=ON \
        -DENABLE_GPOD=OFF
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license COPYING
