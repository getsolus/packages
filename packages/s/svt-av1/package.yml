# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : svt-av1
version    : 4.3.1
release    : 16
source     :
    - https://github.com/AOMediaCodec/SVT-AV1/archive/refs/tags/v4.3.1.tar.gz : ad94f481cb74821af183f37f4533fc52324b76ffbd98ec7723e282bab0cf9fc4
homepage   : https://gitlab.com/AOMediaCodec/SVT-AV1
license    :
    - AOMPL-1.0
    - BSD-2-Clause
component  : multimedia.codecs
summary    : Scalable Video Technology for AV1 (SVT-AV1 Encoder)
description: |
    The Scalable Video Technology for AV1 (SVT-AV1 Encoder) is an AV1-compliant encoder library core.
optimize   :
    - lto
builddeps  :
    - yasm
setup      : |
    %cmake_ninja \
        -DBUILD_APPS=OFF \
        -DUSE_CPUINFO=OFF
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE* PATENTS.md
