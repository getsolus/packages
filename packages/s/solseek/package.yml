# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : solseek
version    : 1.6.2
release    : 58
source     :
    - https://codeberg.org/clintre/solseek/archive/v1.6.2.tar.gz : 0dca5f8285c6197e9a37bc34dc81310bbee6158e7d95e70ddffdeb08abb0b6f3
homepage   : https://codeberg.org/clintre/solseek
license    : GPL-3.0-or-later
component  : system.utils
summary    : A TUI Package Manager for Solus
description: |
    Solseek is a simple terminal user interface that allows you to browse, search, and manage packages from the Solus packages.
rundeps    :
    - appstream
    - font-firacode-nerd
    - fzf
    - libayatana-appindicator
    - packagekit
    - python-rich-cli
    - python3
    - xdg-terminal-exec
install    : |-
    %install_bin ${workdir}/package/bin/solseek
    %install_dir ${installdir}/usr/share

    cp -r ${workdir}/package/share/solseek ${installdir}/usr/share/
    chmod 00755 ${installdir}/usr/share/solseek/helpers/eopkg-info.py
    chmod 00755 ${installdir}/usr/share/solseek/helpers/solseek-tray.py

    %install_file ${workdir}/package/system/Solseek.desktop ${installdir}/usr/share/applications/Solseek.desktop
    %install_file ${workdir}/package/system/solseek.svg ${installdir}/usr/share/icons/hicolor/scalable/apps/solseek.svg
    %install_file ${workdir}/package/system/solseek.metainfo.xml ${installdir}/usr/share/metainfo/solseek.metainfo.xml

    %install_file ${workdir}/package/system/solseek-uc.service ${installdir}/%libdir%/systemd/user/solseek-uc.service
    %install_file ${workdir}/package/system/solseek-uc.timer ${installdir}/%libdir%/systemd/user/solseek-uc.timer
    %install_file ${workdir}/package/system/60-solseek-uc.preset ${installdir}/%libdir%/systemd/user-preset/60-solseek-uc.preset

    %install_license LICENSE
