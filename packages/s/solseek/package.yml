# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : solseek
version    : 1.5.0
release    : 49
source     :
    - https://github.com/clintre/solseek/archive/refs/tags/v1.5.0.tar.gz : 04125f318711bd0d6d794c14f27130e638619c5ce0954dbbc59b080a8c01640c
homepage   : https://github.com/clintre/solseek
license    : GPL-3.0-or-later
component  : system.utils
summary    : A TUI Package Manager for Solus
description: |
    Solseek is a simple terminal user interface that allows you to browse, search, and manage packages from the Solus packages.
rundeps    :
    - appstream
    - font-firacode-nerd
    - fzf
    - libayatana-appindicator
    - packagekit
    - python3
    - xdg-terminal-exec
install    : |-
    %install_bin $workdir/package/bin/solseek
    %install_dir $installdir/usr/share
    
    cp -r $workdir/package/share/solseek $installdir/usr/share/
    chmod 00755 $installdir/usr/share/solseek/helpers/eopkg-info.py
    chmod 00755 $installdir/usr/share/solseek/helpers/solseek-tray.py

    %install_file $workdir/package/share/applications/Solseek.desktop $installdir/usr/share/applications/Solseek.desktop
    %install_file $workdir/package/share/icons/hicolor/scalable/apps/solseek.svg $installdir/usr/share/icons/hicolor/scalable/apps/solseek.svg
    %install_file $workdir/package/share/metainfo/solseek.metainfo.xml $installdir/usr/share/metainfo/solseek.metainfo.xml

    %install_file $workdir/package/share/applications/solseek-uc.service $installdir/%libdir%/systemd/user/solseek-uc.service
    %install_file $workdir/package/share/applications/solseek-uc.timer $installdir/%libdir%/systemd/user/solseek-uc.timer
    %install_file $workdir/package/share/applications/60-solseek-uc.preset $installdir/%libdir%/systemd/user-preset/60-solseek-uc.preset

    %install_license LICENSE
