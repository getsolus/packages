# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : scx-tools
version    : 1.1.3
release    : 7
source     :
    - https://github.com/sched-ext/scx-loader/archive/refs/tags/v1.1.3.tar.gz : ef43f02674d0630eea4645533e4c59a70fdf2ea744e4135ea6115782ffffb8c7
homepage   : https://github.com/sched-ext/scx-loader
license    : GPL-2.0-only
component  : system.utils
summary    : sched_ext tools
description: |
    sched_ext tools
networking : true
builddeps  :
    - rust-devel
environment: |
    export VENDORDIR=/usr/share/defaults/
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    find target/release \
            -maxdepth 1 -type f -executable \
            -exec %install_bin {} +

    ./target/release/xtask install --destdir "${installdir}/"

    %install_license LICENSE

    # Useless stuff not needed
    rm -v $installdir/usr/bin/xtask

    # Replaced by our own
    rm -v $installdir/usr/share/scx_loader/config.toml
    rmdir $installdir/usr/share/scx_loader

    # Install our default config
    %install_file ${pkgfiles}/config.toml -t ${installdir}/${VENDORDIR}/scx_loader

    %install_file -t ${installdir}/%libdir%/systemd/system-preset/ ${pkgfiles}/20-scx-tools.preset
