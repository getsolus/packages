# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : satty
version    : 0.22.0
release    : 2
source     :
    - https://github.com/Satty-org/Satty/archive/refs/tags/v0.22.0.tar.gz : eee18b5f9eabf164da69c7e6e916c98afb78dd296d83e28bb96d9f9636a5fe36
homepage   : https://github.com/gabm/Satty
license    : MPL-2.0
component  : multimedia.graphics
summary    : Modern Screenshot Annotation
description: |
    Satty is a screenshot annotation tool inspired by Swappy and Flameshot. It has been created to provide the following improvements over existing screenshot annotation tools.
builddeps  :
    - pkgconfig(epoxy)
    - pkgconfig(fontconfig)
    - pkgconfig(gtk4)
    - pkgconfig(libadwaita-1)
    - rust
networking : true
setup      : |
    %cargo_fetch
build      : |
    %cargo_build --features ci-release
install    : |
    %cargo_install
    %install_license LICENSE

    %install_file org.satty.Satty.metainfo.xml -t ${installdir}/usr/share/metainfo
    %install_file satty.desktop -t ${installdir}/usr/share/applications
    %install_file assets/satty.svg -t ${installdir}/usr/share/icons/hicolor/scalable/apps

    %install_file completions/satty.bash ${installdir}/usr/share/bash-completion/completions/satty
    %install_file completions/satty.fish -t ${installdir}/usr/share/fish/vendor_completions.d
    %install_file completions/_satty -t ${installdir}/usr/share/zsh/site-functions

    %install_file man/satty.1 -t ${installdir}/usr/share/man/man1
