# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : spacenavd
version    : 1.3.1
release    : 1
source     :
    - https://github.com/FreeSpacenav/spacenavd/releases/download/v1.3.1/spacenavd-1.3.1.tar.gz : 44ea2a3af1050df0ac26ee8fb00cf8c7358ed98a900159b8756ee2c7979c34bc
homepage   : https://spacenav.sourceforge.net/
license    : GPL-3.0-or-later
component  : programming.tools
summary    : Free user-space driver for 6-dof space-mice.
description: |
    Free user-space driver for 6-dof space-mice.
builddeps  :
    - pkgconfig(x11)
    - pkgconfig(xext)
setup      : |
    # Upstream commit: Direct logs to systemd journal
    %patch -p1 -i ${pkgfiles}/fix-service-paths.patch
    # Correct service bindir
    sed -i 's:/usr/local/bin:/usr/bin:' contrib/systemd/spacenavd.service

    %configure
build      : |
    %make
install    : |
    %make_install
    %install_file ${workdir}/contrib/systemd/spacenavd.service -t ${installdir}/%libdir%/systemd/system
    %install_file ${pkgfiles}/spacenavd.preset ${installdir}/%libdir%/systemd/system-preset/60-spacenavd.preset
    %install_license COPYING
