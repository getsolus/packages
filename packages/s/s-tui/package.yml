# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : s-tui
version    : 1.5.0
release    : 12
source     :
    - https://github.com/amanusk/s-tui/archive/refs/tags/v1.5.0.tar.gz : d6669cb6e67bb9653751a2b00e7f472816e96acfaf67018980f3c19862e9e40c
license    : GPL-2.0-or-later
homepage   : https://amanusk.github.io/s-tui
component  : system.utils
summary    : Terminal-based CPU stress and monitoring utility
description: |
    Stress-Terminal UI, s-tui, monitors CPU temperature, frequency, power and utilization in a graphical way from the terminal.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
rundeps    :
    - python-psutil
    - python3-urwid
    - stress-ng
setup      : |
    %patch -p1 -i $pkgfiles/use-zenergy.patch
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_license LICENSE
