# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : spyder3
version    : 6.1.6
release    : 45
source     :
    - https://github.com/spyder-ide/spyder/archive/refs/tags/v6.1.6.tar.gz : eb8fd50a4a8af2e507e556481dcadd1413b2f62f6ff18de2e49e46865c9e9645
homepage   : https://www.spyder-ide.org/
license    :
    - BSD-3-Clause
    - CC-BY-2.5
    - CC-BY-3.0
    - CC-BY-SA-4.0
    - EPL-1.0
    - GPL-3.0-or-later
    - LGPL-2.1-or-later
    - LGPL-3.0-or-later
    - MIT
    - Python-2.0
    - Zlib
component  : programming.ide
summary    : The Scientific Python Development Environment
description: |
    Spyder is a powerful scientific environment written in Python, for Python, and designed by and for scientists, engineers and data analysts. It offers a unique combination of the advanced editing, analysis, debugging, and profiling functionality of a comprehensive development tool with the data exploration, interactive execution, deep inspection, and beautiful visualization capabilities of a scientific package.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - cython
    - matplotlib
    - python-aiohttp
    - python-asyncssh
    - python-atomicwrites
    - python-bcrypt
    - python-chardet
    - python-cookiecutter
    - python-intervaltree
    - python-jellyfish
    - python-keyring
    - python-lsp-black
    - python-nbconvert
    - python-numpydoc
    - python-opengl
    - python-pandas
    - python-psutil
    - python-pygithub
    - python-pylint-venv
    - python-pyls-spyder
    - python-pyqt6-webengine
    - python-pyuca
    - python-qdarkstyle
    - python-qstylizer
    - python-qt6
    - python-qtawesome
    - python-qtconsole
    - python-rtree
    - python-spyder-kernels
    - python-superqt
    - python-textdistance
    - python-three-merge
    - python-watchdog
    - pyxdg
    - scipy
    - sympy
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Don-t-require-importlib_metadata-on-python-3.10.patch
    # qtpy prefers PyQt5 when both bindings are installed; match Spyder's Qt6 CI.
    sed -i '/^import os$/a os.environ.setdefault("QT_API", "pyqt6")' spyder/app/start.py
    sed -i 's|^Exec=spyder %F|Exec=env QT_API=pyqt6 spyder %F|' scripts/spyder.desktop
build      : |
    export SPYDER_QT_BINDING=pyqt6
    export QT_API=pyqt6
    %python3_setup
install    : |
    %python3_install

    # Upstream installs spyder.png to /usr/share/icons (not a theme path)
    rm -rf ${installdir}/usr/share/icons
    %install_file img_src/spyder.svg ${installdir}/usr/share/icons/hicolor/scalable/apps/spyder.svg

    # Symlinking spyder3 to reduce breakages
    ln -sv /usr/bin/spyder ${installdir}/usr/bin/spyder3
