# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : sayonara-player
version    : 1.12.0
release    : 15
source     :
    - https://gitlab.com/luciocarreras/sayonara-player/-/archive/1.12.0-stable1/sayonara-player-1.12.0-stable1.tar.gz : 2a2e5320e9a9ad3fa593ae21f5bc78fb84eb1649fd632f20a7831a3273b037a4
homepage   : https://sayonara-player.com/
license    : GPL-3.0-or-later
component  : multimedia.audio
summary    : A small and fast audio player built with Qt
description: |
    Sayonara is a small, clear and fast audio player written in C++, supported by the Qt framework. It uses GStreamer as audio backend.
builddeps  :
    - pkgconfig(Qt5Svg)
    - pkgconfig(Qt5UiTools)
    - pkgconfig(gstreamer-app-1.0)
    - pkgconfig(taglib)
setup      : |
    %cmake_ninja -DBUILD_SHARED_LIBS=true -DCMAKE_BUILD_TYPE=Release
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE COPYING
