# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : subnetcalc
version    : 2.7.5
release    : 9
source     :
    - https://github.com/dreibh/subnetcalc/archive/refs/tags/subnetcalc-2.7.5.tar.gz : 919bd9c9a9500d6b91f1e75c1658efbe41bfa77294be8568910c44b33c045b4a
homepage   : https://github.com/dreibh/subnetcalc
license    : GPL-3.0-or-later
component  : network.util
summary    : An IPv4/IPv6 Subnet Calculator
description: |
    SubNetCalc is an IPv4/IPv6 subnet address calculator. For given IPv4 or IPv6 address and netmask or prefix length, it calculates network address, broadcast address, maximum number of hosts and host address range.
builddeps  :
    - pkgconfig(libmaxminddb)
setup      : |
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
