# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : solus-kst
version    : 0.10.1
release    : 1
source     :
    - https://codeberg.org/clintre/solus-kst/archive/v0.10.1.tar.gz : 63f4cedf7a1dc324cb6b40498d0a7b1e5e1b4c176c8b3d1fc2267c9941173779
homepage   : https://codeberg.org/clintre/
license    : GPL-3.0-or-later
component  : system.utils
summary    : Solus Kernel Smoke and Sanity test
