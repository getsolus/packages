# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : swaync
version    : 0.12.6
release    : 3
source     :
    - https://github.com/ErikReider/SwayNotificationCenter/archive/refs/tags/v0.12.6.tar.gz : 0c844eb5c9524f924495bd4145e5db575096de36f3ec87fb37e4c1ed6eacb897
homepage   : https://github.com/ErikReider/SwayNotificationCenter
license    : GPL-3.0-or-later
component  : desktop
summary    : A simple GTK based notification daemon for any Wayland compositor
description: |
    A simple notification daemon with a GTK gui for notifications and the control center.
builddeps  :
    - pkgconfig(blueprint-compiler)
    - pkgconfig(gee-0.8)
    - pkgconfig(granite-7)
    - pkgconfig(gtk4)
    - pkgconfig(gtk4-layer-shell-0)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libnotify)
    - pkgconfig(libpulse)
    - gvfs
    - sassc
    - scdoc
    - vala
rundeps    :
    - gvfs
setup      : |
    %meson_configure \
        --sysconfdir=/usr/share
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
