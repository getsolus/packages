# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : scummvm
version    : 2026.4.0
release    : 28
source     :
    - https://github.com/scummvm/scummvm/archive/refs/tags/v2026.4.0.tar.gz : e9615bad3794121be740aef7270fe3bec75e9b372fbaadaf8a07bb8fe2aa016a
homepage   : https://www.scummvm.org/
license    :
    - BSD-3-Clause
    - GPL-3.0-or-later
    - GPL-3.0-or-later WITH Font-exception-2.0
    - ISC
    - LGPL-2.1-or-later
    - MIT
    - OFL-1.1
component  : games.emulator
summary    : ScummVM is a program which allows you to run certain classic graphical point-and-click adventure games
description: |
    ScummVM is a program which allows you to run certain classic graphical point-and-click adventure games, provided you already have their data files. The clever part about this: ScummVM just replaces the executables shipped with the games, allowing you to play them on systems for which they were never designed!
builddeps  :
    - pkgconfig(SDL2_net)
    - pkgconfig(alsa)
    - pkgconfig(faad2)
    - pkgconfig(flac)
    - pkgconfig(fluidsynth)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libcurl)
    - pkgconfig(libmikmod)
    - pkgconfig(libmpeg2)
    - pkgconfig(libturbojpeg)
    - pkgconfig(mad)
    - pkgconfig(theoradec)
    - pkgconfig(vorbisfile)
    - pkgconfig(vpx)
    - giflib-devel
    - liba52dec-devel
setup      : |
    # Neither configure or reconfigure is working.
    %configure_no_runstatedir \
        --datadir=/usr/share/scummvm \
        --disable-debug \
        --enable-release
build      : |
    %make
install    : |
    %make_install
    rm -fr ${installdir}/usr/share/doc
    %install_license COPYING LICENSES/*
check      : |
    %make test
