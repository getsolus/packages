# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : shader-slang
version    : 2026.18.2
release    : 1
source     :
    # The tag tarball omits submodules that are compiled in: miniz, unordered_dense, cmark, fast_float, and lua.
    - git|https://github.com/shader-slang/slang.git : afeaf511c23dbcce397d9cd9934e724c2795ad35 # v2026.18.2
homepage   : https://shader-slang.com/
license    :
    - Apache-2.0 WITH LLVM-exception
    - BSD-2-Clause
    - MIT
    - Unlicense
component  : programming.tools
summary    : Shading language for large, high-performance shader codebases
description: |
    Slang is a shading language and compiler for building and maintaining large shader codebases. It accepts HLSL-like source and generates code for Vulkan, Direct3D, Metal, CUDA, and CPU targets.
builddeps  :
    - pkgconfig(SPIRV-Tools)
    - pkgconfig(liblz4)
    - glslang-devel
    - vulkan-headers
setup      : |
    # Gentoo dev-util/shader-slang
    %apply_patches

    # Headers live under include/shader-slang so they do not collide with slang.
    # LLVM and DXIL prebuilts are fetched at configure time, so leave them off.
    # System spirv-headers 1.4.341.0 lacks SpvOpAbortKHR; use the pinned submodule.
    %cmake_ninja \
        -DCMAKE_INSTALL_INCLUDEDIR=include/shader-slang \
        -DSLANG_ENABLE_AFTERMATH=OFF \
        -DSLANG_ENABLE_CUDA=OFF \
        -DSLANG_ENABLE_DXIL=OFF \
        -DSLANG_ENABLE_EXAMPLES=OFF \
        -DSLANG_ENABLE_GFX=OFF \
        -DSLANG_ENABLE_OPTIX=OFF \
        -DSLANG_ENABLE_PCH=OFF \
        -DSLANG_ENABLE_SLANG_PROXY=OFF \
        -DSLANG_ENABLE_SLANG_RHI=OFF \
        -DSLANG_ENABLE_SPLIT_DEBUG_INFO=OFF \
        -DSLANG_ENABLE_TESTS=OFF \
        -DSLANG_EXCLUDE_TINT=ON \
        -DSLANG_SLANG_LLVM_FLAVOR=DISABLE \
        -DSLANG_USE_SYSTEM_GLSLANG=ON \
        -DSLANG_USE_SYSTEM_LZ4=ON \
        -DSLANG_USE_SYSTEM_SPIRV_HEADERS=OFF \
        -DSLANG_USE_SYSTEM_SPIRV_TOOLS=ON \
        -DSLANG_USE_SYSTEM_VULKAN_HEADERS=ON \
        -DSLANG_VERSION_FULL=$version \
        -DSLANG_VERSION_NUMERIC=$version
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE LICENSES/*
patterns   :
    # Runtime-loaded modules. The filename embeds the release, so they
    # still end in .so and would otherwise land in -devel.
    - /usr/lib64/libslang-glsl-module-*.so
    - /usr/lib64/libslang-glslang-*.so
