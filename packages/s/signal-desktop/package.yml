# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : signal-desktop
version    : 8.20.0
release    : 210
source     :
    - https://updates.signal.org/desktop/apt/pool/s/signal-desktop/signal-desktop_8.20.0_amd64.deb : acd0da309256f5b5bed90bb1380163bb38771cf3529e98509f919815ec866328
homepage   : https://signal.org
license    : AGPL-3.0-or-later
component  : network.im
summary    : A private messenger for Windows, macOS, and Linux
description: |
    Signal Desktop is an Electron application that links with your Signal Android or Signal iOS app.
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(cups)
    - pkgconfig(gbm)
    - pkgconfig(gtk+-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libdrm)
    - pkgconfig(libpulse)
    - pkgconfig(xscrnsaver)
setup      : |
    ar xf ${sources}/signal-desktop_${version}_amd64.deb
    mkdir root
    tar xf data.tar.xz -C root
install    : |
    # This only excludes /usr/bin link which will be invalid
    %install_dir ${installdir}/usr/bin
    %install_dir ${installdir}/usr/share/signal-desktop

    for icon_size in 16 24 32 48 64 128 256 512 1024; do
        %install_file root/usr/share/icons/hicolor/${icon_size}x${icon_size}/apps/signal-desktop.png \
            ${installdir}/usr/share/icons/hicolor/${icon_size}x${icon_size}/apps/signal-desktop.png
    done

    # We do not use /opt for binary packages in Solus, so just use /usr/share.
    cp -arv --no-preserve=ownership root/opt/Signal/* ${installdir}/usr/share/signal-desktop/
    ln -srv ${installdir}/usr/share/signal-desktop/signal-desktop ${installdir}/usr/bin/signal-desktop

    %install_file ${pkgfiles}/org.signal.Signal.desktop -t ${installdir}/usr/share/applications
    %install_file ${pkgfiles}/org.signal.Signal.metainfo.xml -t ${installdir}/usr/share/metainfo

    %install_license root/opt/Signal/LICENSE.electron.txt root/opt/Signal/LICENSES.chromium.html
