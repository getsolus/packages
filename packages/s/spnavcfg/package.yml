# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : spnavcfg
version    : '1.3'
release    : 1
source     :
    - https://github.com/FreeSpacenav/spnavcfg/releases/download/v1.3/spnavcfg-1.3.tar.gz : 
        59bd470109b9b70a0f88b75183021db2170c84e0ce7a64ff83ce484d09c3616d
homepage   : https://spacenav.sourceforge.net/
license    : GPL-3.0-or-later
component  : programming.tools
summary    : Spacenav interactive configuration GUI
description: |
    Spacenav interactive configuration GUI
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(spnav)
    - pkgconfig(x11)
setup      : |
    %configure
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
    %install_file ${pkgfiles}/net.sourceforge.spacenav.spnavcfg.metainfo.xml -t ${installdir}/usr/share/metainfo
