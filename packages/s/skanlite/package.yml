# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : skanlite
version    : 26.08.2
release    : 58
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/skanlite-26.08.2.tar.xz : 57789835a9bc488e7e8b204e77a636cf5316659229427e357654c85c221df5c2
homepage   : https://apps.kde.org/skanlite/
license    :
    - GPL-2.0-only
    - GPL-3.0-only
component  : desktop.kde
summary    : Image Scanning Application for KDE
description: |
    Skanlite is a simple image scanning application that does nothing more than scan and save images, based on the KSane backend.
builddeps  :
    - pkgconfig(Qt6Core)
    - kf6-kcoreaddons-devel
    - kf6-kdoctools-devel
    - kf6-ki18n-devel
    - kf6-kio-devel
    - kf6-kxmlgui-devel
    - ksanecore-devel
    - libksane-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*

    rm -rfv $installdir/usr/share/doc
