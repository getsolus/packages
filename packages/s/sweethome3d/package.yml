# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : sweethome3d
version    : 7.6.1
release    : 5
source     :
    - https://sourceforge.net/projects/sweethome3d/files/SweetHome3D-source/SweetHome3D-7.6.1-src/SweetHome3D-7.6.1-src.zip : 
        b82de76095b2b07fcab59637dc16bd8cd1c92e6208ed18b5e37a5d2a304beee6
homepage   : https://www.sweethome3d.com/
license    : GPL-2.0-or-later
component  : office
summary    : An interior design application to draw the plan of your house in a 3D environment
description: |
    An interior design application to draw the plan of your house in a 3D environment
builddeps  :
    - pkgconfig(libglvnd)
    - apache-ant
rundeps    :
    - openjdk-25
build      : |
    ant application textures furniture examples help java3dLibraries
install    : |
    %install_license COPYING.TXT

    # Desktop and launchers
    %install_exe ${pkgfiles}/sweethome3d.sh ${installdir}/usr/bin/sweethome3d
    %install_file ${pkgfiles}/sweethome3d.desktop ${installdir}/usr/share/applications/sweethome3d.desktop
    %install_file ${pkgfiles}/com.sweethome3d.Sweethome3d.metainfo.xml ${installdir}/usr/share/metainfo/com.sweethome3d.Sweethome3d.metainfo.xml

    # Install icon
    %install_file ${workdir}/deploy/SweetHome3DIcon48x48.png ${installdir}/usr/share/pixmaps/sweethome3d.png

    # Install main program and libraries
    %install_dir ${installdir}/usr/share/java/sweethome3d
    %install_file -t ${installdir}/usr/share/java/sweethome3d build/*.jar
    %install_file -t ${installdir}/usr/share/java/sweethome3d libtest/jnlp.jar
    cd "lib"
    %install_file -t ${installdir}/usr/share/java/sweethome3d *.jar

    # Java3D 1.5 libraries
    %install_dir ${installdir}/usr/lib/sweethome3d/java3d-1.5
    mv -t ${installdir}/usr/lib/sweethome3d/java3d-1.5 \
      ${installdir}/usr/share/java/sweethome3d/{j3dcore.jar,j3dutils.jar,vecmath.jar}
    %install_exe -t ${installdir}/usr/lib/sweethome3d/java3d-1.5 linux/x64/libj3dcore-ogl.so

    # Java3D 1.6 libraries
    %install_dir ${installdir}/usr/lib/sweethome3d/java3d-1.6
    %install_file -t ${installdir}/usr/lib/sweethome3d/java3d-1.6 java3d-1.6/*.jar
    %install_exe -t ${installdir}/usr/lib/sweethome3d/java3d-1.6 java3d-1.6/linux/amd64/*.so

    # Yafaray libraries
    %install_dir ${installdir}/usr/lib/sweethome3d/yafaray
    %install_exe -t ${installdir}/usr/lib/sweethome3d/yafaray yafaray/linux/x64/*.so

    # Yafaray plugins
    %install_dir ${installdir}/usr/lib/sweethome3d/yafaray/yafaray-plugins
    %install_exe -t ${installdir}/usr/lib/sweethome3d/yafaray/yafaray-plugins yafaray/linux/x64/yafaray-plugins/*.so
    