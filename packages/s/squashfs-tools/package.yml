# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : squashfs-tools
version    : 4.7.5
release    : 16
source     :
    - https://github.com/plougher/squashfs-tools/archive/refs/tags/4.7.5.tar.gz : 547b7b7f4d2e44bf91b6fc554664850c69563701deab9fd9cd7e21f694c88ea6
homepage   : https://sourceforge.net/projects/squashfs
license    : GPL-2.0-or-later
component  : system.utils
summary    : Set of tools which creates squashfs filesystem
description: |
    Set of tools which creates squashfs filesystem
optimize   : speed
builddeps  :
    - pkgconfig(liblz4)
    - pkgconfig(liblzma)
    - pkgconfig(libzstd)
    - pkgconfig(lzo2)
build      : |
    %make -C squashfs-tools LZ4_SUPPORT=1 LZO_SUPPORT=1 LZMA_XZ_SUPPORT=1 XZ_SUPPORT=1 ZSTD_SUPPORT=1
install    : |
    # Install the main binaries
    %install_bin squashfs-tools/mksquashfs
    %install_bin squashfs-tools/unsquashfs

    # Recreate the symlinks expected by the system
    ln -s mksquashfs $installdir/usr/bin/sqfstar
    ln -s unsquashfs $installdir/usr/bin/sqfscat

    # Install the license
    %install_license COPYING
    
    # install manpages
    install -Dm00644 Documentation/manpages/*.1 -t $installdir/usr/share/man/man1
