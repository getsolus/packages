# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : swayidle
version    : 1.9.1
release    : 6
source     :
    - https://github.com/swaywm/swayidle/archive/refs/tags/v1.9.1.tar.gz : 846372a151e9f65bbc50e86d600fc7d7f9e494c3e2fcbc23b4d1ead9a13bcd1e
license    : MIT
