# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : signon-kwallet-extension
version    : 26.08.3
release    : 97
source     :
    - https://download.kde.org/stable/release-service/26.08.3/src/signon-kwallet-extension-26.08.3.tar.xz : e80090087eddc7f823ac5647e290288e890bd6d2372aaeaa24ff17cecd0480a9
homepage   : https://kde.org/
license    : GPL-2.0-or-later
component  : programming
