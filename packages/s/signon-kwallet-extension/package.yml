# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : signon-kwallet-extension
version    : 26.08.1
release    : 95
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/signon-kwallet-extension-26.08.1.tar.xz : d50f42b725e5d1bcb7c9e3caff77c2b9c835715567427e544c3824e484776ced
homepage   : https://kde.org/
license    : GPL-2.0-or-later
component  : programming
