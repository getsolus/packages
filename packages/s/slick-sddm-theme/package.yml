# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : slick-sddm-theme
version    : 0.1.0
release    : 1
source     :
    - git|https://github.com/UbuntuBudgie/slickSDDM.git : 
        410a898d944163ebb1c7cc31348d043dc0ea999e
homepage   : https://github.com/UbuntuBudgie/slickSDDM
license    :
    - GPL-2.0-or-later
    - GPL-3.0-or-later
component  : desktop
summary    : Slick theme for SDDM
description: |
    Slick theme for SDDM.
builddeps  :
    - pkgconfig(Qt6HunspellInputMethod)
    - pkgconfig(Qt6Multimedia)
    - pkgconfig(Qt6Svg)
    - kf6-kimageformats-devel
    - sddm
rundeps    :
    - kf6-kimageformats
    - sddm
setup      : |
    %meson_configure \
      -Dtheme_name="slick" \
      -Dtheme_display_name="Slick" \
      -Dtheme_description="Slick theme for SDDM" \
      -Ddefault_background="/usr/share/backgrounds/solus/dessert-at-dusk.jxl" \
      -Dsddm_conf_dir="/usr/share/sddm/sddm.conf.d"
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSE
