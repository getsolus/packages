# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : sdl3-net
version    : 3.2.0
release    : 1
source     :
    - https://github.com/libsdl-org/SDL_net/archive/refs/tags/release-3.2.0.tar.gz : 195036ba82322e03fd3562149634fb582e5e9298ccc6cb2c5e362bf40c5018be
homepage   : https://github.com/libsdl-org/SDL_net
license    : Zlib
component  : multimedia.library
summary    : Small sample cross-platform networking library for SDL3.
description: |
    SDL_net is a portable network library for use with SDL3. Its goal is to simplify the use of the usual socket interfaces and use SDL infrastructure to handle some portability things (such as threading and reporting errors).
builddeps  :
    - pkgconfig(sdl3)
clang      : true
optimize   : speed
setup      : |
    %cmake_ninja \
        -DBUILD_SHARED_LIBS=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
