# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : scrcpy
version    : 5.0.1
release    : 41
source     :
    - https://github.com/Genymobile/scrcpy/archive/v5.0.1.tar.gz : a24b996ac23d0f674d3237c00b39a97829d8acbe9e1657a6c216fd51ea488ee5
    - https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-server-v5.0.1 : 764eb6f79811d5211fe9df341120882ba9994c7a61b897d7bf3fb662e53bc536
homepage   : https://github.com/Genymobile/scrcpy
license    : Apache-2.0
component  : network.util
summary    : Display and control your Android device
description: |
    This application provides display and control of Android devices connected on USB (or over TCP/IP). It does not require any root access.
builddeps  :
    - pkgconfig(libavformat)
    - pkgconfig(libusb-1.0)
    - pkgconfig(sdl3)
rundeps    :
    - android-tools
setup      : |
    %meson_configure \
        --buildtype release \
        --strip \
        -Dportable=false \
        -Dprebuilt_server="$sources/scrcpy-server-v$version" \
        -Db_lto=true
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
