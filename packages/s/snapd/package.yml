# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : snapd
version    : '2.78'
homepage   : https://snapcraft.io/
release    : 99
source     :
    - https://github.com/canonical/snapd/archive/refs/tags/2.78.tar.gz : b974291dbd87ec067801667d738b5f08ced9ad2cd5cfc64b9b06366cb4aca982
license    : GPL-3.0-only
component  : desktop
summary    : The snapd and snap tools enable systems to work with .snap files
description: |
    Universal applications support - .snap files allow you to run Snap packages on any Linux distribution, with full sandboxing and additional security.
networking : true
builddeps  :
    - pkgconfig(glib-2.0)
    - pkgconfig(libapparmor)
    - pkgconfig(libcap)
    - pkgconfig(libseccomp)
    - pkgconfig(libudev)
    - autoconf-archive
    - golang
    - python-docutils
    - xfsprogs-devel
rundeps    :
    - apparmor
    - libselinux
    - squashfs-tools
environment: |
    export CGO_ENABLED="1"
    export CGO_CFLAGS="${CFLAGS}"
    export CGO_CPPFLAGS="${CPPFLAGS}"
    export CGO_CXXFLAGS="${CXXFLAGS}"
    export CGO_LDFLAGS="${LDFLAGS}"
    export go_binaries=(snapctl snap-seccomp snap-update-ns snapd snap-failure)
    export static_binaries=(snap-update-ns snapctl)
    export dcommands=(snapctl snapd snap-update-ns snap-seccomp snap-failure)
    export snap_tools=(snap-preseed snapd-apparmor snap-gpio-helper snap-recovery-chooser snap-fde-keymgr)
setup      : |
    go mod vendor

    ./mkversion.sh "$version"

    %apply_patches

    pushd cmd
    %reconfigure \
        --enable-nvidia-biarch \
        --enable-merged-usr \
        --with-snap-mount-dir=/snap
    popd
build      : |
    %make -C cmd

    for snapvar in ${go_binaries[@]}; do
        go build -o bin/$snapvar -buildmode=pie --ldflags "-w -linkmode external -extldflags '$LDFLAGS'" -trimpath -mod=vendor ./cmd/$snapvar
    done
    for staticpath in ${static_binaries[@]} ; do
        go build -o bin/$staticpath -buildmode=pie --ldflags "-linkmode external -extldflags '$LDFLAGS -static'" -trimpath -mod=vendor ./cmd/$staticpath
    done
install    : |
    %make_install -C cmd

    # Golang binaries
    for snap_lib in ${dcommands[@]} ; do
        %install_exe bin/$snap_lib $installdir/%libdir%/$package/.
    done

    # install snap wrapper
    %install_exe $pkgfiles/wrapper.sh $installdir/usr/bin/snap

    # symlinked tools
    ln -s -r $installdir/%libdir%/$package/{snapd,snap}
    ln -s -r $installdir/%libdir%/$package/{snapctl,snap-exec}
    for tool in ${snap_tools[@]}; do
        ln -s -r -v $installdir/%libdir%/$package/{snapd-tool-wrap,$tool}
    done

    # snapctl is run from inside the snap
    ln -s %libdir%/$package/snapctl $installdir/usr/bin/snapctl

    # Move into the base dir so we can install stuff
    %make_install -C data/ \
            DBUSSERVICESDIR=/usr/share/dbus-1/services \
            LIBEXECDIR="%libdir%" \
            SYSTEMDSYSTEMUNITDIR="%libdir%/systemd/system" \
            SNAP_MOUNT_DIR=/snap

    # empty usr/src directory (i.e. linux-lts-headers linux-current-headers) to
    # satisfy bindmounts in confinement
    %install_dir $installdir/usr/src

    %install_file -t ${installdir}/%libdir%/systemd/system-preset/ ${pkgfiles}/60-snap.preset

    %install_file data/info $installdir/%libdir%/$package/info
    %install_file data/polkit/io.snapcraft.snapd.policy $installdir/usr/share/polkit-1/actions/io.snapcraft.snapd.policy
    %install_file $pkgfiles/snapd.tmpfiles $installdir/%libdir%/tmpfiles.d/snapd.conf

    # Capabilities
    setcap -q - $installdir/%libdir%/snapd/snap-confine < $installdir/%libdir%/snapd/snap-confine.v2-only.caps
    rm -v $installdir/%libdir%/snapd/*.caps

    # Completions
    %install_file data/completion/bash/snap $installdir/usr/share/bash-completion/completions/snap
    %install_file data/completion/bash/complete.sh $installdir/%libdir%/snapd/complete.sh
    %install_file data/completion/bash/etelpmoc.sh $installdir/%libdir%/snapd/etelpmoc.sh
    %install_file data/completion/zsh/_snap $installdir/usr/share/zsh/site-functions/_snap

    # Sort out fish completions (unsure why this is automatic and bash/zsh are not)
    %install_dir $installdir/usr/share/fish/vendor_completions.d/
    mv $installdir/usr/share/fish/vendor_conf.d/snapd.fish $installdir/usr/share/fish/vendor_completions.d/snapd.fish
    rmdir $installdir/usr/share/fish/vendor_conf.d/

    # Stateless
    %install_dir $installdir/usr/share/xdg/autostart/
    mv $installdir/etc/xdg/autostart/snap-userd-autostart.desktop $installdir/usr/share/xdg/autostart/
    rmdir $installdir/etc/xdg/autostart
    rmdir $installdir/etc/xdg
    %install_dir $installdir/usr/share/defaults/etc/profile.d
    mv $installdir/etc/profile.d/snapd.sh $installdir/usr/share/defaults/etc/profile.d/70-snapd.sh
    rmdir $installdir/etc/profile.d

    # remove unneeded stuff
    rm -rvf $installdir/var

    # Even though it's empty it still needs to mount /usr/src ...
    rm -rvf $installdir/usr/bin/ubuntu-core-launcher
    rm -rvf $installdir/%libdir%/snapd/{system-shutdown,snapd.core-fixup.sh}
    rm -rvf $installdir/%libdir%/systemd/system/{snapd.system-shutdown.service,snapd.autoimport.service,snapd.snap-repair.*,snapd.core-fixup.*}

    %install_license COPYING
