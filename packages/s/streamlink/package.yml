# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : streamlink
version    : 6.8.2
release    : 77
source     :
    - https://github.com/streamlink/streamlink/releases/download/8.6.2/streamlink-8.6.2.tar.gz : 7f02e31e99e1a0e0022a48187b16461fba59bd5fad764ad4cab4ce654b05ee23
homepage   : https://streamlink.github.io/
license    : BSD-2-Clause
component  : network.clients
summary    : Extracts streams from various services and pipes them into a video player of choice
description: |
    Streamlink is a command-line utility which pipes video streams from various services into a video player, such as VLC or mpv. The main purpose of Streamlink is to avoid resource-heavy and unoptimized websites, while still allowing the user to enjoy various streamed content.
networking : true
builddeps  :
    - python-build
    - python-installer
    - python-packaging
    - python-setuptools
checkdeps  :
    - python-freezegun
    - python-pytest
    - python-pytest-trio
    - python-requests-mock
    # rundeps required for running tests
    - python-isodate
    - python-lxml
    - python-pycountry
    - python-pycryptodome
    - python-requests
    - python-trio
    - python-trio-websocket
    - python-urllib3
    - python-websocket-client
rundeps    :
    - ffmpeg
    - python-certifi
    - python-isodate
    - python-lxml
    - python-pycountry
    - python-pycryptodome
    - python-pysocks
    - python-requests
    - python-trio
    - python-trio-websocket
    - python-urllib3
    - python-websocket-client
setup      : |
    %patch -p1 -i $pkgfiles/remove-pytest-minversion.patch
build      : |
    %pyproject_build
install    : |
    %pyproject_install
# TODO 3.14
#check      : |
#    %python3_test pytest3
