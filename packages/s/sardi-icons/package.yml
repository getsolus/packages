# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : sardi-icons
version    : 26.03.01
release    : 30
source     :
    - https://sourceforge.net/projects/sardi/files/sardi-icons-26.03-01.tar.gz : 
        53195da6938175467cc7378d40c00ac38551b85b0a20c937006683960ad01907
homepage   : https://erikdubois.online/
license    : CC-BY-NC-SA-4.0
component  :
    - desktop.theme
    - colora : desktop.theme
    - flat : desktop.theme
    - flexible : desktop.theme
    - ghost : desktop.theme
    - mono : desktop.theme
    - numix : desktop.theme
    - qogir : desktop.theme
    - vertexed : desktop.theme
summary    : Simple and flat icon theme with long shadow
description: |
    Simple and flat icon theme with long shadow
rundeps    :
    - colora : sardi-icons-flat
    - flat : sardi-icons
    - flexible : sardi-icons
    - ghost : sardi-icons
    - mono : sardi-icons
    - numix : sardi-icons-mono
    - qogir : sardi-icons
    - vertexed : sardi-icons-mono
install    : |
    %install_dir ${installdir}/usr/share/icons/

    cp -arv --no-preserve=ownership ${workdir}/* ${installdir}/usr/share/icons/

    # Remove unwanted files
    pushd ${installdir}/usr/share/icons
    for del in *Amazon* *changelog* *chrome-* *cinnamon-* *emerald-* *.cache *distributor-* *.sh \
        *lite* *masterpdf* *mintbackup* *mintdrivers* *mints* *mintup* *mintwhel* *mx-* *nero* *netflix* *nuvola* \
        *openofficeorg* *ooo-* *peppermint* *popcorntime* *reborn* *redhat* *silicon* *sparky* *unity-* *unity8-* \
        *amazon* *arco* *debian* *deepin* *facebook* *fedora* *garuda* *google-play* *googleplay* *kingsoft* \
        *mageia* *mandriva* *manjaro* *lx* *sparkleshare* *ubuntu* *zorin* *web-* ; do
        find -path "${del}" -prune -exec rm -rv '{}' \;
    done

    # Fix icons that were deleted in the really aggressive part above
    for theme in Sardi Sardi-Orb-Colora Sardi-Flat Sardi-Flexible Sardi-Ghost-Flexible Sardi-Mono; do
        %install_file "${workdir}/${theme}"/scalable/apps/distributor-logo-solus.svg -t ${installdir}/usr/share/icons/${theme}/scalable/apps
        %install_file "${workdir}/${theme}"/scalable/apps/distributor-logo.svg -t ${installdir}/usr/share/icons/${theme}/scalable/apps
        %install_file "${workdir}/${theme}"/scalable/apps/gnome-web.svg -t ${installdir}/usr/share/icons/${theme}/scalable/apps
        %install_file "${workdir}/${theme}"/scalable/apps/web-browser.svg -t ${installdir}/usr/share/icons/${theme}/scalable/apps
    done
    popd

    # Remove broken symlinks, and scripts
    find ${installdir}/usr/share/icons/* -xtype l -delete
patterns   :
    - colora :
        - /usr/share/icons/Sardi-Orb-Colora
    - flat :
        - /usr/share/icons/*Flat*
    - flexible :
        - /usr/share/icons/*Sardi-Flexible*
    - ghost :
        - /usr/share/icons/*Ghost*
    - mono :
        - /usr/share/icons/*Mono*
    - numix :
        - /usr/share/icons/*Numix*
    - qogir :
        - /usr/share/icons/*Qogir*
    - vertexed :
        - /usr/share/icons/*Vertexed
