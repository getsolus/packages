# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : sane-airscan
version    : 0.99.38
release    : 6
source     :
    - https://github.com/alexpevzner/sane-airscan/archive/refs/tags/0.99.38.tar.gz : 1e5b3b8373141caa37bf42fe74ae1950de3ff15c84966d8a415485d334ba5507
homepage   : https://github.com/alexpevzner/sane-airscan
license    : GPL-2.0-or-later
component  : office
summary    : SANE backend for AirScan (eSCL) and WSD document scanners
description: |
    SANE backend for MFP and document scanners that implements either eSCL (AirScan/AirPrint scanning) or WSD "driverless" scanning protocol.
builddeps  :
    - pkgconfig(avahi-client)
    - pkgconfig(gnutls)
    - pkgconfig(libjpeg)
    - pkgconfig(libpng)
    - pkgconfig(libtiff-4)
    - pkgconfig(libxml-2.0)
    - pkgconfig(sane-backends)
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
check      : |
    %ninja_check
