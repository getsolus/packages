# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : samurai
version    : 1.3
release    : 1
source     :
    - https://github.com/michaelforney/samurai/archive/refs/tags/1.3.tar.gz : 44ff119a27b343ec47a797fa8701c19b9e672230bc15f3c6a6cede9641ea6332
homepage   : https://github.com/michaelforney/samurai
