# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : speedcrunch
version    : 1.0.0
release    : 6
source     :
    - https://github.com/heldercorreia/speedcrunch/archive/refs/tags/v1.0.0.tar.gz : bbf58c84bae90aa42ecbea2b22d94e4c4519fe3af9d6071d33e61c4d44c36ca9
homepage   : https://www.speedcrunch.org/
license    : GPL-2.0-or-later
component  : office.maths
summary    : SpeedCrunch is a high-precision scientific calculator
description: |
    SpeedCrunch is a high-precision scientific calculator. It features a syntax-highlighted scrollable display and is designed to be fully used via keyboard. Some distinctive features are auto-completion of functions and variables, a formula book, and quick insertion of constants from various fields of knowledge.
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6Help)
    - pkgconfig(Qt6Network)
    - pkgconfig(Qt6Widgets)
setup      : |
    pushd src
    %cmake_ninja
build      : |
    pushd src
    %cmake_build
install    : |
    sed -i "s:Icon=org.speedcrunch.SpeedCrunch:Icon=/usr/share/icons/hicolor/scalable/apps/speedcrunch.svg:g" pkg/org.speedcrunch.SpeedCrunch.desktop
    
    pushd src
    %cmake_install
    popd
    
    %install_file gfx/speedcrunch.svg ${installdir}/usr/share/icons/hicolor/scalable/apps/speedcrunch.svg
    %install_license LICENSE
