# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : spirv-cross
version    : 1.4.363.0
release    : 14
source     :
    - https://github.com/KhronosGroup/SPIRV-Cross/archive/refs/tags/vulkan-sdk-1.4.363.0.tar.gz : f708982e88b763ef5b0394ed468fc2c3628f68cdab89f2e7a946cd628c04e721
license    : Apache-2.0
component  : programming.tools
homepage   : https://github.com/KhronosGroup/SPIRV-Cross/
summary    : SPIRV-Cross is a tool designed for parsing and converting SPIR-V to other shader languages
description: |
    SPIRV-Cross is a practical tool and library for performing reflection on SPIR-V and disassembling SPIR-V back to high level languages.
builddeps  :
    - glslang-devel
    - spirv-tools
setup      : |
    %patch -p1 -i $pkgfiles/0001-system-glslang-and-spirv-tools.patch
    %cmake_ninja -DSPIRV_CROSS_SHARED=ON -DPYTHON_EXECUTABLE=/usr/bin/python3
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE LICENSES/*
# Tests seem to fail using non-bundled deps.
# check      : |
#     %ninja_check
