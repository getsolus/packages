# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : jxrlib
version    : 1.4.4
release    : 5
source     :
    - https://github.com/mircomir/jxrlib/archive/refs/tags/1.4.4.tar.gz : 
        8f331b1bb79c96d081f8a6301503adbab9648d607ed37e5fc2be1fdcc059bc89
homepage   : https://github.com/mircomir/jxrlib
license    : BSD-2-Clause
component  : multimedia.graphics
summary    : Open source implementation of jpegxr
description: |
    An open source implementation of the jpegxr image format standard.
environment: |
    export CFLAGS="${CFLAGS} -Wno-error=incompatible-pointer-types"
setup      : |
    # Remove included binaries
    rm -rf bin

    # Use system build flags
    sed -e "s|^CC=cc|CC=${CC} ${CFLAGS} ${LDFLAGS}|" -i Makefile
build      : |
    %make \
        SHARED=1 \
        DIR_INSTALL=/usr
install    : |
    %make_install \
        SHARED=1 \
        DIR_INSTALL=${installdir}/usr
    %install_license LICENSE

    # Fix install dir in pc file
    sed -e 's|/home/build/YPKG/root/jxrlib/install||' -i ${installdir}/usr/lib/pkgconfig/libjxr.pc
patterns   :
    - main :
        - /usr/lib/libjpegxr.so
        - /usr/lib/libjxrglue.so
