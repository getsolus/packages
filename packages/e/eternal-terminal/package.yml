# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : eternal-terminal
version    : 7.0.0
release    : 18
source     :
    - https://github.com/MisterTea/EternalTerminal/archive/refs/tags/et-v7.0.0.tar.gz : 3580962861589c0b69efd6b385ff92ad8fdf688c91d1a0edc1a83278205e28e8
homepage   : https://eternalterminal.dev
license    : Apache-2.0
component  : network.clients
summary    : Remote shell that automatically reconnects without interrupting the session.
description: |
    Eternal Terminal is a remote shell that automatically reconnects without interrupting the session. It also supports scrollback.
builddeps  :
    - pkgconfig(libcurl)
    - pkgconfig(libsodium)
    - pkgconfig(protobuf)
    - extra-cmake-modules
    - libboost-devel
setup      : |
    %cmake_ninja \
        -DDISABLE_VCPKG=on
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE

    %install_file etc/et.cfg ${installdir}/etc/et.cfg
    %install_file systemctl/et.service ${installdir}/usr/lib/systemd/system/et.service

    # Enable service by default
    %install_file ${pkgfiles}/et.preset ${installdir}/%libdir%/systemd/system-preset/60-et.preset
