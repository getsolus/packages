# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : erlang
version    : 29.1.2
release    : 56
source     :
    - https://github.com/erlang/otp/archive/refs/tags/OTP-29.1.2.tar.gz : 7a4235d19e460ea91798e46a42cf910278d56b56a69af846a058986f703658da
homepage   : https://www.erlang.org/
license    : Apache-2.0
component  : programming
summary    : Erlang is a programming language used to build massively scalable systems.
description: |
    Erlang is a programming language used to build massively scalable soft real-time systems with requirements on high availability.
builddeps  :
    - pkgconfig(glu)
    - pkgconfig(x11)
    - perl
    - wxwidgets-devel
setup      : |
    ./otp_build setup
    %configure \
        --disable-static \
        --enable-shared
build      : |
    %make
install    : |
    %make_install
    %install_license LICENSE.txt LICENSES/*

    # Remove static libraries
    find ${installdir}/usr/lib64 -name "*.a" -delete
