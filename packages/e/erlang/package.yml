# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : erlang
version    : 29.0.4
release    : 54
source     :
    - https://github.com/erlang/otp/archive/refs/tags/OTP-29.0.4.tar.gz : a1265554cdfbd1c5382b38ed49f51fc2a7616515ff76f68d09288301a167c131
homepage   : https://www.erlang.org/
license    : Apache-2.0
component  : programming
summary    : Erlang is a programming language used to build massively scalable systems.
description: |
    Erlang is a programming language used to build massively scalable soft real-time systems with requirements on high availability.
builddeps  :
    - pkgconfig(glu)
    - pkgconfig(x11)
    - perl
    - wxwidgets-devel
setup      : |
    ./otp_build setup
    %configure \
        --disable-static \
        --enable-shared
build      : |
    %make
install    : |
    %make_install
    %install_license LICENSE.txt LICENSES/*

    # Remove static libraries
    find ${installdir}/usr/lib64 -name "*.a" -delete
