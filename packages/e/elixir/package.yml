# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : elixir
version    : 1.20.5
release    : 56
source     :
    - https://github.com/elixir-lang/elixir/archive/refs/tags/v1.20.5.tar.gz : 3d99f2e129418800817e0e5a3ce4812c34537a32d50e37578189e90c79de7062
homepage   : https://elixir-lang.org/
license    : Apache-2.0
component  : programming
summary    : Elixir is a dynamic, functional language designed for building scalable and maintainable applications
description: |
    Elixir is a dynamic, functional language designed for building scalable and maintainable applications.
builddeps  :
    - erlang
rundeps    :
    - erlang
build      : |
    export LC_ALL=en_US.utf8
    %make LIBDIR=lib64
install    : |
    %make_install PREFIX=/usr LIBDIR=lib64
    make clean
    %install_license LICENSE
