# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : endless-sky
version    : 0.11.4
release    : 28
source     :
    - https://github.com/endless-sky/endless-sky/archive/refs/tags/v0.11.4.tar.gz : 971399cc91956171261f5a36429572201a35662db2b1d3615fd6043ee4a38a61
homepage   : https://endless-sky.github.io/
license    :
    - CC-BY-SA-4.0
    - CC-BY-SA-3.0
    - GPL-3.0-or-later
component  : games.arcade
summary    : Endless Sky is a sandbox-style space exploration game similar to Elite, Escape Velocity, or Star Control
description: |
    Explore other star systems. Earn money by trading, carrying passengers, or completing missions. Use your earnings to buy a better ship or to upgrade the weapons and engines on your current one. Blow up pirates. Take sides in a civil war. Or leave human space behind and hope to find some friendly aliens whose culture is more civilized than your own...
builddeps  :
    - pkgconfig(catch2)
    - pkgconfig(flac++)
    - pkgconfig(glew)
    - pkgconfig(libavif)
    - pkgconfig(libpng)
    - pkgconfig(libturbojpeg)
    - pkgconfig(mad)
    - pkgconfig(minizip)
    - pkgconfig(openal)
    - pkgconfig(sdl2)
    - pkgconfig(x11)
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Use-standard-directory-for-resource-files.patch
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_exe solusBuildDir/endless-sky ${installdir}/usr/bin/endless-sky.bin
    %install_exe ${pkgfiles}/endless-sky-wrapper ${installdir}/usr/bin/endless-sky
    %install_license copyright license.txt
