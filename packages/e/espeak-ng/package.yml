# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : espeak-ng
version    : 1.52.0
release    : 8
source     :
    - https://github.com/espeak-ng/espeak-ng/archive/refs/tags/1.52.0.tar.gz : bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23
homepage   : https://github.com/espeak-ng/espeak-ng
license    :
    - Apache-2.0
    - BSD-2-Clause
    - GPL-3.0-or-later
component  : programming.library
summary    : Text-to-speech engine
description: |
    Next generation text-to-speech engine, a fork of espeak.
builddeps  :
    - pcaudiolib-devel
setup      : |
    %autogen
    %configure --with-pcaudiolib \
               --with-klatt \
               --with-mbrola \
               --with-async \
               --disable-static
build      : |
    %make -j1
install    : |
    %make_install -j1
    %install_license COPYING*
    # symlink buggery
    rm -v $installdir/%libdir%/*.la
