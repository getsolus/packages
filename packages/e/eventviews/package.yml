# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : eventviews
version    : 26.08.1
release    : 104
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/eventviews-26.08.1.tar.xz : 6e8fed1a2cbfab0ac10d9b6f5c086060de33435c99d3f34c7437386e8f49ebe2
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
    - MIT
component  : desktop.library
summary    : Library for creating events
description: |
    Library for creating events.
builddeps  :
    - pkgconfig(KF6CalendarCore)
    - pkgconfig(KF6GuiAddons)
    - akonadi-calendar-devel
    - calendarsupport-devel
    - kcalutils-devel
    - kdiagram-devel
    - kf6-kcompletion-devel
    - kf6-kcontacts-devel
    - kf6-kholidays-devel
    - kf6-kiconthemes-devel
    - kf6-kservice-devel
    - libkdepim-devel
rundeps    :
    - devel :
        - akonadi-calendar-devel
        - akonadi-devel
        - calendarsupport-devel
        - kcalutils-devel
        - kf6-kcalendarcore-devel
        - kf6-kholidays-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
