# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : eventviews
version    : 26.08.2
release    : 106
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/eventviews-26.08.2.tar.xz : e1c4e943f2e7cbde55639bb32822df80377f9d3cffd5f6a1c618dd91bb77117a
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
    - MIT
component  : desktop.library
summary    : Library for creating events
description: |
    Library for creating events.
builddeps  :
    - pkgconfig(KF6CalendarCore)
    - pkgconfig(KF6GuiAddons)
    - akonadi-calendar-devel
    - calendarsupport-devel
    - kcalutils-devel
    - kdiagram-devel
    - kf6-kcompletion-devel
    - kf6-kcontacts-devel
    - kf6-kholidays-devel
    - kf6-kiconthemes-devel
    - kf6-kservice-devel
    - libkdepim-devel
rundeps    :
    - devel :
        - akonadi-calendar-devel
        - akonadi-devel
        - calendarsupport-devel
        - kcalutils-devel
        - kf6-kcalendarcore-devel
        - kf6-kholidays-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
