# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ETL
version    : 1.5.5
release    : 10
source     :
    - https://github.com/synfig/synfig/releases/download/v1.5.5/ETL-1.5.5.tar.gz : 570c898f1c976fac3026866d718ea3f48f8bce1b232ed8cbedc65921c4e3cc25
license    : GPL-3.0-or-later
component  : programming.library
homepage   : https://www.synfig.org/
summary    : Multi-platform class and template library
description: |
    ETL is a multi-platform class and template library designed to add new datatypes and functions which combine well with the existing types and functions from the C++ Standard Template Library (STL).
patterns   :
    - /
builddeps  :
    - pkgconfig(glibmm-2.4)
setup      : |
    %configure
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
check      : |
    %make check
