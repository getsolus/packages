# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : engrampa
version    : 1.28.3
release    : 29
source     :
    - https://github.com/mate-desktop/engrampa/releases/download/v1.28.3/engrampa-1.28.3.tar.xz : d01b119981a3947f2072ef88319eca0f58600ff81dc933b5f4a7d8f0eb72e916
homepage   : https://www.mate-desktop.org/
license    : GPL-2.0-or-later
component  : desktop.mate
summary    : Archive manager for the MATE Desktop
description: |
    Engrampa is an application for creating and viewing archives files, such as zip, xv, bzip2, cab, rar and other compress formats.
builddeps  :
    - pkgconfig(gtk+-3.0)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(libcaja-extension)
    - pkgconfig(sm)
    - itstool
setup      : |
    %configure --disable-static \
        --disable-packagekit \
        --enable-magic
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
