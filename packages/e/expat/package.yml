# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : expat
version    : 2.9.0
release    : 44
source     :
    - https://github.com/libexpat/libexpat/releases/download/R_2_9_0/expat-2.9.0.tar.xz : 1e6371862cc31999b368c3b89b49994f0677e1bab5f1b2b85ae3741f5d803051
homepage   : https://libexpat.github.io/
license    : MIT
component  :
    - system.base
    - devel : system.devel
summary    : XML Parsing Library
description: |
    The Expat package contains a stream oriented C library for parsing XML.
emul32     : true
setup      : |
    %configure --disable-static
build      : |
    %make
profile    : |
    %make check
install    : |
    %make_install
    %install_license COPYING
check      : |
    %make check
