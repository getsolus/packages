# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : expat
version    : 2.8.4
release    : 42
source     :
    - https://github.com/libexpat/libexpat/releases/download/R_2_8_4/expat-2.8.4.tar.xz : 656ae1cc8da3b4ea513bb4e254f33e6243938084c0ec6239da873376b09985a7
homepage   : https://libexpat.github.io/
license    : MIT
component  :
    - system.base
    - devel : system.devel
summary    : XML Parsing Library
description: |
    The Expat package contains a stream oriented C library for parsing XML.
emul32     : true
setup      : |
    %configure --disable-static
build      : |
    %make
profile    : |
    %make check
install    : |
    %make_install
    %install_license COPYING
check      : |
    %make check
