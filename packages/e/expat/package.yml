# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : expat
version    : 2.11.0
release    : 46
source     :
    - https://github.com/libexpat/libexpat/releases/download/R_2_11_0/expat-2.11.0.tar.xz : 61e7614b602201c28a189dafee78f5bceaee192bbde46a930752ff09cf5542fa
homepage   : https://libexpat.github.io/
license    : MIT
component  :
    - system.base
    - devel : system.devel
summary    : XML Parsing Library
description: |
    The Expat package contains a stream oriented C library for parsing XML.
emul32     : true
setup      : |
    export CFLAGS="$CFLAGS -fno-strict-aliasing"
    %configure --disable-static
build      : |
    %make
profile    : |
    %make check
install    : |
    %make_install
    %install_license COPYING
check      : |
    %make check
