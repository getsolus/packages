    - https://github.com/exfatprogs/exfatprogs/releases/download/1.4.5/exfatprogs-1.4.5.tar.gz : 
        51b7e06691c583a35f5cc51a346843ffe3a68324dbe1c8beeaa34ac1d61dba81
homepage   : https://github.com/exfatprogs/exfatprogs
