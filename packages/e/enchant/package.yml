# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : enchant
version    : 2.8.21
release    : 31
source     :
    - https://github.com/rrthomas/enchant/releases/download/v2.8.21/enchant-2.8.21.tar.gz : 
        dd2a762697c463148a8f59867089a5ebf2dd1449d869f93764b76c12bcf8acc0
homepage   : https://rrthomas.github.io/enchant/
license    : LGPL-2.1-or-later
component  : office.spelling
summary    : Spell check library wrapper program
description: |
    Enchant is a library wrapper program that allows the use of mulitple spell checker backends at the same time.
builddeps  :
    - pkgconfig(hunspell)
    - pkgconfig(libvoikko)
    - groff
setup      : |
    %configure --disable-static --with-system-myspell=yes \
               --with-myspell-dir=/usr/share/hunspell
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING.LIB
