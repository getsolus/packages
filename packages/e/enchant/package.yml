# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : enchant
version    : 2.8.19
release    : 30
source     :
    - https://github.com/rrthomas/enchant/releases/download/v2.8.19/enchant-2.8.19.tar.gz : 
        c8d70991d544ee39274b96bd01d2858a009fe732ff43f2aaf605fd61ecd06f60
homepage   : https://rrthomas.github.io/enchant/
license    : LGPL-2.1-or-later
component  : office.spelling
summary    : Spell check library wrapper program
description: |
    Enchant is a library wrapper program that allows the use of mulitple spell checker backends at the same time.
builddeps  :
    - pkgconfig(hunspell)
    - pkgconfig(libvoikko)
    - groff
setup      : |
    %configure --disable-static --with-system-myspell=yes \
               --with-myspell-dir=/usr/share/hunspell
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING.LIB
