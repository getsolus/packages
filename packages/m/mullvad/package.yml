# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : mullvad
version    : '2026.5'
release    : 27
source     :
    - git|https://github.com/mullvad/mullvadvpn-app.git : 2026.5
homepage   : https://mullvad.net
license    : GPL-3.0-or-later
summary    : The Mullvad VPN client app for desktop
component  : network.clients
description: |
    The Mullvad VPN client app for desktop.
networking : true
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(gbm)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(jemalloc)
    - pkgconfig(protobuf)
    - git
    - nodejs
    - rust
rundeps    :
    - libayatana-appindicator
setup      : |
    %apply_patches
build      : |
    ./build.sh --optimize
install    : |
    %install_dir ${installdir}/usr/share/mullvad
    cp -a dist/linux-unpacked/* ${installdir}/usr/share/mullvad

    %install_bin dist-assets/mullvad
    %install_bin dist-assets/mullvad-exclude
    %install_bin dist-assets/mullvad-daemon

    %install_file ${pkgfiles}/mullvad-vpn.desktop -t ${installdir}/usr/share/applications
    %install_file ${pkgfiles}/net.mullvad.MullvadVPN.metainfo.xml -t ${installdir}/usr/share/metainfo
    %install_file graphics/icon.svg ${installdir}/usr/share/icons/hicolor/scalable/apps/mullvad-vpn.svg

    %install_file dist-assets/linux/mullvad-daemon.service ${installdir}/%libdir%/systemd/system/mullvad-daemon.service
    %install_file dist-assets/linux/mullvad-early-boot-blocking.service ${installdir}/%libdir%/systemd/system/mullvad-early-boot-blocking.service
    sed -i 's/\/opt\/Mullvad.*VPN/\/usr\/share\/mullvad/g' ${installdir}/%libdir%/systemd/system/mullvad-daemon.service
    %install_file ${pkgfiles}/60-mullvad-daemon.preset ${installdir}/%libdir%/systemd/system-preset/60-mullvad-daemon.preset

    %install_license LICENSE.md
