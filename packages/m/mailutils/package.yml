# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : mailutils
version    : '3.21'
release    : 25
source     :
    - https://ftp.gnu.org/gnu/mailutils/mailutils-3.21.tar.gz : 5e305de7fcf2f744c8b210f1cfe904d49842bfc6d13a913031ec4dbf0c669c54
homepage   : https://mailutils.org/
license    :
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
component  : network.mail
summary    : Mail Utils
description: |
    Mailutils is a swiss army knife of electronic mail handling. It offers a rich set of utilities and daemons for processing the e-mail.
builddeps  :
    - pkgconfig(fribidi)
    - pkgconfig(gnutls)
    - pkgconfig(krb5)
    - pkgconfig(libxcrypt)
    - pkgconfig(python3)
    - gdbm-devel
environment: |
    export CFLAGS="${CFLAGS} -Wno-incompatible-pointer-types"
setup      : |
    %configure --disable-static \
        --enable-ipv6 \
        --without-ldap \
        --with-fribidi \
        --with-gnutls \
        --with-gdbm
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING*
check      : |
    # CCache and fakeroot both break parts of the tests
    unset LD_PRELOAD
    export CCACHE_DISABLE=1

    %make check
