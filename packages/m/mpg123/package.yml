# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : mpg123
version    : 1.33.7
release    : 27
source     :
    - https://sourceforge.net/projects/mpg123/files/mpg123/1.33.7/mpg123-1.33.7.tar.bz2 : 31d0e35a4ca567ec9b5ebda6c3062bb4435d6d3eacd6ef0d95cadd7854dc03ee
homepage   : https://www.mpg123.de/
license    : LGPL-2.1-only
component  :
    - multimedia.codecs
    - bin : multimedia.codecs
summary    : Console based mp3 decoder
description: |
    mpg123 is a fast and Free real time MPEG Audio Layer 1, 2 and 3 decoding library and console player. It uses floating point or integer math, along with several special optimizations (3DNow, SSE, ARM, ...) to make it most efficient.
emul32     : true
builddeps  :
    - pkgconfig32(alsa)
    - pkgconfig32(json-c)
    - pkgconfig32(libpulse)
    - pkgconfig32(sndfile)
setup      : |
    %configure --enable-int-quality
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
patterns   :
    - bin :
        - /usr/bin
        - /usr/share/man
replaces   :
    - libmpg123
    - devel : libmpg123-devel
