# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : mda-lv2
version    : 1.2.12
release    : 6
source     :
    - https://download.drobilla.net/mda-lv2-1.2.12.tar.xz : 8f2090433e60e90d9c4d0326970c845a3cb471951657cd9355d3dbca4040b873
homepage   : https://drobilla.net/software/mda-lv2.html
license    :
    - 0BSD
    - GPL-2.0-or-later
    - MIT
component  : multimedia.audio
summary    : MDA-LV2 is an LV2 port of the MDA plugins by Paul Kellett.
description: |
    MDA-LV2 is an LV2 port of the MDA plugins by Paul Kellett. It contains 36 high-quality plugins for a variety of tasks.
builddeps  :
    - pkgconfig(lv2)
setup      : |
    %meson_configure --libdir=%libdir%
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
