# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : marp-cli
version    : 4.5.0
release    : 22
homepage   : https://marp.app/
source     :
    - https://github.com/marp-team/marp-cli/archive/refs/tags/v4.5.0.tar.gz : 075829ab03c391460a49f2e39279b3037a6300fb6484a2c79d63879704105eff
license    : MIT
component  : office
summary    : A CLI interface for Marp and Marpit based converters
description: |
    A CLI interface for Marp and any slide deck converter based on Marpit framework. It can convert Marp / Marpit Markdown files into static HTML / CSS, PDF, PowerPoint document, and image(s) easily.
networking : true
strip      : false
debug      : false
builddeps  :
    - git
    - nodejs
    - yarn
setup      : |
    yarn install
build      : |
    yarn build
    yarn run pkg . \
        --out-path ./bin \
        --targets host \
        --compress Brotli
install    : |
    install -Dm0755 bin/marp-cli $installdir/usr/bin/marp
    %install_license LICENSE
