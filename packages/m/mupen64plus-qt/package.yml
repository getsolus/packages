# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : mupen64plus-qt
version    : '1.17'
release    : 4
source     :
    - https://github.com/dh4/mupen64plus-qt/archive/1.17.tar.gz : 2da57d302265f8c0a2e705660e243c2a827a086cba2a6ed92fccdb1ea333f328
homepage   : https://github.com/dh4/mupen64plus-qt
license    : BSD-3-Clause
component  : games.emulator
summary    : Customizable cross-platform launcher for mupen64plus
description: |
    A customizable cross-platform launcher. This was adapted from CEN64-Qt to work with Mupen64Plus.
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6Core5Compat)
    - pkgconfig(quazip1-qt6)
    - pkgconfig(sdl2)
rundeps    :
    - mupen64plus
clang      : true
setup      : |
    sed -i s/FILENAME_VARIABLE/OUTPUT_SCRIPT/g CMakeLists.txt #Fix for Qt 6.10
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %install_bin ${workdir}/solusBuildDir/mupen64plus-qt
    %install_file ${workdir}/resources/mupen64plus-qt.desktop ${installdir}/usr/share/applications/mupen64plus-qt.desktop
    %install_file ${workdir}/resources/images/mupen64plus.png ${installdir}/usr/share/icons/hicolor/128x128/apps/mupen64plus-qt.png
    %install_file ${workdir}/resources/mupen64plus-qt.6 ${installdir}/usr/share/man/man6/mupen64plus-qt.6
    %install_file ${pkgfiles}/io.github.dh4.mupen64plus_qt.metainfo.xml -t ${installdir}/usr/share/metainfo/
    %install_license LICENSE
