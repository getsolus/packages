# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : mumble
version    : 1.6.870
release    : 48
source     :
    - https://github.com/mumble-voip/mumble/releases/download/v1.6.870/mumble-1.6.870.tar.gz : cd4726e36538d09b2fa4f7445cbe0be5cb1fcf642c2ea31ae6a6ed04d60e2513
homepage   : https://www.mumble.info
license    : BSD-3-Clause
component  : network.clients
summary    : High quality voice chat software
description: |
    Mumble is an open source, low-latency, high quality voice chat software primarily intended for use while gaming.
builddeps  :
    - pkgconfig(Qt6Linguist)
    - pkgconfig(Qt6Svg)
    - pkgconfig(alsa)
    - pkgconfig(avahi-compat-libdns_sd)
    - pkgconfig(gl)
    - pkgconfig(harfbuzz)
    - pkgconfig(libcap)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(libutf8proc)
    - pkgconfig(nlohmann_json)
    - pkgconfig(openssl)
    - pkgconfig(opus)
    - pkgconfig(protobuf)
    - pkgconfig(sndfile)
    - pkgconfig(speex)
    - pkgconfig(xi)
    - libboost-devel
    - microsoft-gsl
    - poco-devel
setup      : |
    export CXXFLAGS="${CXXFLAGS} -Wno-error=deprecated-declarations"
    %cmake_ninja \
        -DCMAKE_C_STANDARD=17 \
        -DCMAKE_CXX_STANDARD=17 \
        -Dbundle-qt-translations=OFF \
        -Dbundled-gsl=OFF \
        -Dbundled-json=OFF \
        -Dbundled-renamenoise=ON \
        -Dbundled-speex=OFF \
        -Dice=OFF \
        -Doverlay-xcompile=OFF \
        -Dserver=OFF \
        -Dspeechd=OFF \
        -Dupdate=OFF \
        -Dwarnings-as-errors=OFF
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
