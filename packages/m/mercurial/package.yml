# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : mercurial
version    : 7.2.4
release    : 50
source     :
    - https://www.mercurial-scm.org/release/mercurial-7.2.4.tar.gz : 85839e0f39e6cb893a88932aa36ef661759f3c5c5de4551ad26bd9df53cb71a2
homepage   : https://www.mercurial-scm.org/
license    : GPL-2.0-or-later
summary    : Mercurial is a free, distributed source control management tool.
component  : programming.tools
description: |
    Mercurial is a free, distributed source control management tool. It efficiently handles projects of any size and offers an easy and intuitive interface.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
    - python-setuptools-scm
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_license COPYING

    # Docs
    %install_file doc/hg.1 -t ${installdir}/usr/share/man/man1
    %install_file doc/{hgrc.5,hgignore.5} -t ${installdir}/usr/share/man/man5
    %install_bin contrib/hgk

    # Completions
    %install_file contrib/zsh_completion ${installdir}/usr/share/zsh/site-functions/_hg
    %install_file contrib/bash_completion ${installdir}/usr/share/bash-completion/completions/hg
    %install_file contrib/{mq.el,mercurial.el} -t ${installdir}/usr/share/emacs/site-lisp
    %install_file contrib/vim/HGAnnotate.vim ${installdir}/usr/share/vim/vimfiles/syntax/HGAnnotate.vim
# TODO: Disable for now, tests don't work
