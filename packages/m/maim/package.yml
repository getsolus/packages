# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : maim
version    : 5.8.2
release    : 16
source     :
    - https://github.com/naelstrof/maim/archive/refs/tags/v5.8.2.tar.gz : 2252c95c7eeebdee190c0a8cae3adeb1bb9c70858aef807060669fd02180204c
homepage   : https://github.com/naelstrof/maim/
license    : GPL-3.0-or-later
component  : system.utils
summary    : maim (Make Image) is a screenshot tool for the command line
description: |
    maim (Make Image) is a screenshot tool for the command line. Developed as an improvement to scrot.
builddeps  :
    - pkgconfig(glm)
    - pkgconfig(glu)
    - pkgconfig(libpng)
    - pkgconfig(libturbojpeg)
    - pkgconfig(libwebp)
    - pkgconfig(xcomposite)
    - pkgconfig(xrandr)
    - slop-devel
setup      : |
    # for icu 75
    sed -e 's|CXX_STANDARD 11|CXX_STANDARD 17|g' -i CMakeLists.txt

    %cmake_ninja
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license COPYING
