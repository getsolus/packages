# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : mutt
version    : 2.4.3
release    : 40
source     :
    - https://gitlab.com/muttmua/mutt/-/archive/mutt-2-4-3-rel/mutt-mutt-2-4-3-rel.tar.gz : 712c220f2f76a27a5014604a4c30d1d422eb6ef19f12af1542abea621e488fde
homepage   : https://gitlab.com/muttmua/mutt
license    : GPL-2.0-or-later
component  : network.mail
summary    : Mutt (Small, powerful text based email client)
description: |
    Mutt is a small but powerful text-based mail client for Unix operating systems. It was originally based on ELM, and was written by Michael Elkins.
builddeps  :
    - pkgconfig(gpgme)
    - pkgconfig(libassuan)
    - pkgconfig(libsasl2)
    - pkgconfig(ncursesw)
    - gdbm-devel
    - gnupg
rundeps    :
    - vim
setup      : |
    %patch -p1 -i $pkgfiles/mutt-1.5.23-system_certs.patch #fedora patch
    %patch -p1 -i $pkgfiles/mutt-1.8.0-cabundle.patch #fedora patch with our bundle path
    %patch -p1 -i $pkgfiles/mutt-1.9.0-ssl_ciphers.patch #fedora patch

    %reconfigure \
       --sysconfdir=/etc/mutt \
       --enable-compressed \
       --enable-gpgme \
       --enable-hcache \
       --enable-imap \
       --enable-locales-fix \
       --enable-pop \
       --enable-sidebar \
       --enable-smtp \
       --with-curses \
       --with-homespool=/var/spool/ \
       --with-regex \
       --with-sasl \
       --with-ssl
build      : |
    %make
install    : |
    %make_install
    %install_license GPL
