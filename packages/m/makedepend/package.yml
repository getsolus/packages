# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : makedepend
version    : 1.0.10
release    : 14
source     :
    - https://www.x.org/releases/individual/util/makedepend-1.0.10.tar.gz : baf742fb6c76c15febf5181e5cd814066205d8be9aef4abfdc2c54b235e14917
license    : MIT
component  : xorg.base
homepage   : https://www.x.org/
summary    : X11 utility to determine build-time dependencies
description: |
    The makedepend package contains a C-preprocessor like utility to determine build-time dependencies.
builddeps  :
    - pkgconfig(xproto)
setup      : |
    %configure
build      : |
    %make
install    : |
    %make_install
