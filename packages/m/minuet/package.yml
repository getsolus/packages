# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : minuet
version    : 26.08.2
release    : 104
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/minuet-26.08.2.tar.xz : 01e13c43abfbbf0ae662b0d2ec4a9b5618f3fb8b8ae1dec68abbebec17bdfcd4
homepage   : https://kde.org/applications/education/org.kde.minuet
license    :
    - GPL-2.0-or-later
    - GFDL-1.3-or-later
component  : multimedia.audio
summary    : KDE software for music education
description: |
    Minuet aims at supporting students and teachers in many aspects of music education, such as ear training, first-sight reading, solfa, scales, rhythm, harmony, and improvisation. Minuet makes extensive use of MIDI capabilities to provide a full-fledged set of features regarding volume, tempo, and pitch changes, which makes Minuet a valuable tool for both novice and experienced musicians.
builddeps  :
    - pkgconfig(Qt6Multimedia)
    - pkgconfig(Qt6Quick)
    - pkgconfig(Qt6Svg)
    - pkgconfig(aubio)
    - pkgconfig(fluidsynth)
    - kf6-kcoreaddons-devel
    - kf6-kcrash-devel
    - kf6-kdoctools-devel
    - kf6-ki18n-devel
    - kf6-kirigami-devel
    - kf6-qqc2-desktop-style-devel
    - kirigami-addons-devel
rundeps    :
    - qt6-declarative
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING

    #remove docs
    rm -rfv $installdir/usr/share/doc
