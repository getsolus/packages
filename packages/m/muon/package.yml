# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : muon
version    : 0.7.1
release    : 8
source     :
    - https://muon.build/releases/v0.7.1/muon-v0.7.1.tar.gz : 956b5a74f7852ec4c57a11825dac79052da878da78f507bee1a0ef955053fbbb
homepage   : https://muon.build/
license    : GPL-3.0-only
component  : system.devel
summary    : A meson-compatible build system.
description: |
    muon is an implementation of the meson build system in c99 with minimal dependencies.
builddeps  :
    - pkgconfig(libarchive)
    - pkgconfig(libcurl)
    - pkgconfig(libpkgconf)
    - pkgconfig(scdoc)
    - meson
rundeps    :
    - samurai
patterns   :
    - /*
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Look-for-installed-samu-first.patch
    %meson_configure --buildtype=release -Dsamurai=disabled
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSES/*
