# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : muon
version    : 0.7.0
release    : 7
source     :
    - https://muon.build/releases/v0.7.0/muon-v0.7.0.tar.gz : 573a3137e2a478e84e71dbbaf874623f7bc9848cf3367c948016ed284e8d637c
homepage   : https://muon.build/
license    : GPL-3.0-only
component  : system.devel
summary    : A meson-compatible build system.
description: |
    muon is an implementation of the meson build system in c99 with minimal dependencies.
builddeps  :
    - pkgconfig(libarchive)
    - pkgconfig(libcurl)
    - pkgconfig(libpkgconf)
    - pkgconfig(scdoc)
    - meson
rundeps    :
    - samurai
patterns   :
    - /*
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Look-for-installed-samu-first.patch
    %meson_configure --buildtype=release -Dsamurai=disabled
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSES/*
