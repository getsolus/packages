# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : meson
version    : 1.12.1
release    : 73
source     :
    - https://github.com/mesonbuild/meson/releases/download/1.12.1/meson-1.12.1.tar.gz : ab0a6ca09f8ef70c564c8241fb5a23957886a0b53fb58412b5e07eaf07dba743
homepage   : https://mesonbuild.com/
license    : Apache-2.0
component  : system.devel
summary    : A high performance build system
description: |
    Meson® is a project to create the best possible next-generation build system.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-packaging
    - python-setuptools
    - python-wheel
rundeps    :
    - ninja
build      : |
    %pyproject_build
install    : |
    %pyproject_install

    # install autocompletions
    %install_file ${workdir}/data/shell-completions/bash/meson -t ${installdir}/usr/share/bash-completion/completions
    %install_file ${workdir}/data/shell-completions/zsh/_meson -t ${installdir}/usr/share/zsh/site-functions
