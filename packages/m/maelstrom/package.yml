# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : maelstrom
version    : 4.0.2
release    : 9
source     :
    - git|https://github.com/libsdl-org/Maelstrom.git : release-4.0.2
homepage   : https://www.libsdl.org/projects/Maelstrom/
license    :
    - GPL-2.0-or-later
    - CC-BY-3.0
component  : games.arcade
summary    : Pseudo-3D-rendered Asteroids clone
description: |
    Pseudo-3D-rendered Asteroids clone
builddeps  :
    - pkgconfig(physfs)
    - pkgconfig(sdl3)
    - pkgconfig(sdl3-net)
setup      : |
    %cmake_ninja \
        -DSTANDALONE_INSTALL=OFF \
        -DSTEAM=OFF \
        -DUSE_VENDORED_PHYSFS=OFF \
        -DUSE_VENDORED_SDL=OFF \
        -DUSE_VENDORED_SDL_NET=OFF
build      : |
    %ninja_build
install    : |-
    %ninja_install

    ln -s Maelstrom $installdir/usr/bin/maelstrom

    # Install desktop file, icon and appstream metadata
    %install_file $pkgfiles/org.libsdl.Maelstrom.desktop -t $installdir/usr/share/applications
    %install_file $pkgfiles/maelstrom.png -t $installdir/usr/share/icons/hicolor/512x512/apps
    %install_file $pkgfiles/org.libsdl.Maelstrom.appdata.xml -t $installdir/usr/share/metainfo
