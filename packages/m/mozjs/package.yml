# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : mozjs
version    : 140.17.0
release    : 42
source     :
    - https://archive.mozilla.org/pub/firefox/releases/140.17.0esr/source/firefox-140.17.0esr.source.tar.xz : 4d6ed3b18b2069c55bab12d8ba95da6013ac0b036d8a031df8b9f39a25d05c33
homepage   : https://spidermonkey.dev/
license    :
    - GPL-2.0-or-later
    - MPL-1.1
component  : desktop.library
summary    : JS is Mozilla's JavaScript engine written in C/C++
description: |
    JS is Mozilla's JavaScript engine written in C/C++
strip      : false
libsplit   : false
networking : true
builddeps  :
    - pkgconfig(icu-uc)
    - autoconf213
    - cbindgen
    - clang
    - rust
environment: |
    export AR=llvm-ar
    export NM=llvm-nm
    export RANLIB=llvm-ranlib
setup      : |
    %apply_patches
    head -n -1 config/milestone.txt > config/milestone.txt
    echo "${version}" >> config/milestone.txt

    %patch -p1 -i $pkgfiles/0001-Bug-1973994-mozjs-140.pc-does-not-contain-DXP_UNIX-o.patch

    %patch -p1 -i $pkgfiles/0002-Bug-1969769-Change-uses-of-ast.Str-with-ast.Constant.patch
    %patch -p1 -i $pkgfiles/0003-Bug-1983713-Use-non-deprecated-ast-value.-r-firefox-.patch
    %patch -p1 -i $pkgfiles/0004-Bug-1983736-Patch-jsonschema-to-work-with-Python-3.1.patch
    %patch -p1 -i $pkgfiles/0005-Bug-1993797-Fix-AST-parsing-in-DecoratorVisitor-for-.patch

    mkdir $workdir/building
    cd $workdir/building

    ../js/src/%configure \
        --disable-debug \
        --disable-debug-symbols \
        --disable-jemalloc \
        --disable-strip \
        --disable-tests \
        --enable-optimize \
        --enable-posix-nspr-emulation \
        --enable-readline \
        --enable-release \
        --enable-shared-js \
        --enable-unaligned-private-values \
        --with-system-zlib \
        --with-system-icu
build      : |
    cd $workdir/building
    %make
install    : |
    cd $workdir/building
    %make_install
    rm -r $installdir/%libdir%/*.ajs
    %install_license $workdir/toolkit/content/license.html
patterns   :
    - devel :
        - /usr/bin/js*-config
