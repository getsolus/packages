# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : mimetreeparser
version    : 26.08.1
release    : 38
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/mimetreeparser-26.08.1.tar.xz : b81506a5876039c0aa9969f7bd71040880b171b53014a76a8bbaed02287cc5f9
homepage   : https://invent.kde.org/pim/mimetreeparser
license    :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC0-1.0
    - FSFULLR
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0-only
    - MIT
component  : desktop.library
summary    : Parser for MIME trees
description: |
    A parser for a MIME tree and is based on KMime. The goal is given a MIME tree to extract a list of parts (e.g. text, html) and a list of attachments, check the validity of the signatures and decrypt any encrypted part.
builddeps  :
    - pkgconfig(KF6CalendarCore)
    - pkgconfig(Qt6Qml)
    - kf6-kcodecs-devel
    - kf6-kcolorscheme-devel
    - kf6-kconfig-devel
    - kf6-ki18n-devel
    - kf6-kio-devel
    - kf6-kirigami-devel
    - kf6-kmime-devel
    - kf6-kwidgetsaddons-devel
    - kirigami-addons-devel
    - kmbox-devel
    - libkleo-devel
    - qt6-base-private-devel
rundeps    :
    - kf6-kirigami
    - kirigami-addons
    - devel :
        - kf6-ki18n-devel
        - kf6-kmime-devel
        - kmbox-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
