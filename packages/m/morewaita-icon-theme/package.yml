# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : morewaita-icon-theme
version    : '50'
release    : 12
source     :
    - https://github.com/somepaulo/MoreWaita/archive/refs/tags/v50.tar.gz : 2df5022854f8bc77f467dbc71c8dc5e7a5f0f042f90acad0773bc623bd92f769
homepage   : https://github.com/somepaulo/MoreWaita/
license    : GPL-3.0-or-later
component  : desktop.theme
summary    : An expanded Adwaita-styled companion icon theme with extra icons for popular apps to complement Gnome Shell's original icons
description: |
    An Adwaita styled theme with extra icons for popular apps to complement Gnome Shell's original icons. The purpose of this theme is to provide a consistent look and feel with Gnome Shell's design.
setup      : |
    %patch -p1 -i $pkgfiles/0001-Fix-invalid-meson-variable.patch
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
