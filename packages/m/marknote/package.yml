# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : marknote
version    : 1.6.0
release    : 8
source     :
    - https://download.kde.org/stable/marknote/marknote-1.6.0.tar.xz : d3bb39614e22fd1a8ddd74bcfb4c384cbffe25685ec01116f694e470816284a9
homepage   : https://apps.kde.org/marknote
license    :
    - BSD-3-Clause
    - CC0-1.0
    - CC-BY-SA-4.0
    - GPL-2.0-only
    - GPL-2.0-or-later
    - GPL-3.0-only
    - GPL-3.0-or-later
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
    - LGPL-3.0-or-later
component  : desktop.kde
summary    : A simple markdown note management app
description: |
    Marknote lets you create rich text notes and easily organise them into notebooks. You can personalise your notebooks by choosing an icon and accent color for each one, making it easy to distinguish between them and keep your notes at your fingertips. Your notes are saved as Markdown files in your Documents folder, making it easy to use your notes outside of Marknote as well as inside the app.
builddeps  :
    - pkgconfig(Qt6Qml)
    - pkgconfig(Qt6Svg)
    - pkgconfig(md4c)
    - kf6-kcolorscheme-devel
    - kf6-kconfig-devel
    - kf6-kcoreaddons-devel
    - kf6-kcrash-devel
    - kf6-ki18n-devel
    - kf6-kiconthemes-devel
    - kf6-kirigami-devel
    - kf6-kitemmodels-devel
    - kf6-kmime-devel
    - kf6-knotifications-devel
    - kf6-krunner-devel
    - kf6-kwindowsystem-devel
    - kf6-syntax-highlighting-devel
    - kirigami-addons-devel
rundeps    :
    - kf6-kirigami
    - kf6-kitemmodels
    - kf6-qqc2-desktop-style
    - kirigami-addons
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
replaces   :
    - knotes
