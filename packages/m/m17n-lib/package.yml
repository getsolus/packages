# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : m17n-lib
version    : 1.8.6
release    : 6
source     :
    - http://download.savannah.nongnu.org/releases/m17n/m17n-lib-1.8.6.tar.gz : 7129fe3b7ad500f88b8af8605ef07b96c87a75ec986a695fffc0a409f44a7c86
homepage   : https://www.nongnu.org/m17n/
license    : LGPL-2.1
component  : programming
summary    : The m17n library is a multilingual text processing library for the C language
description: |
    The m17n library is a multilingual text processing library for the C language
builddeps  :
    - pkgconfig(anthy)
    - pkgconfig(fribidi)
    - pkgconfig(xft)
    - pkgconfig(xt)
rundeps    :
    - m17n-db
setup      : |
    %configure --disable-static
build      : |
    %make -j1
install    : |
    %make_install -j1
    rm -rf $installdir/usr/share
