# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : m17n-lib
version    : 1.8.7
release    : 7
source     :
    #- http://download.savannah.nongnu.org/releases/m17n/m17n-lib-1.8.7.tar.gz : 7129fe3b7ad500f88b8af8605ef07b96c87a75ec986a695fffc0a409f44a7c86
    - https://download-mirror.savannah.gnu.org/releases/m17n/m17n-lib-1.8.7.tar.gz : a72cf78e40198020aa05217b9839dd260b94d4f2dc59a5a8d60bae7b84104caa
homepage   : https://www.nongnu.org/m17n/
license    : LGPL-2.1-or-later
component  : programming
summary    : The m17n library is a multilingual text processing library for the C language
description: |
    The m17n library is a multilingual text processing library for the C language
builddeps  :
    - pkgconfig(anthy)
    - pkgconfig(fribidi)
    - pkgconfig(xft)
    - pkgconfig(xt)
rundeps    :
    - m17n-db
setup      : |
    %configure --disable-static
build      : |
    %make -j1
install    : |
    %make_install -j1
    rm -rf $installdir/usr/share
    %install_license COPYING
