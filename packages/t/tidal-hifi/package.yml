# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : tidal-hifi
version    : 8.1.0
release    : 7
source     :
    - https://github.com/Mastermindzh/tidal-hifi/archive/refs/tags/8.1.0.tar.gz : ea2d547032f023c7c55927a3d7bad85ee00e611d11fc13ee700e9f8e76dcbfaa
homepage   : https://github.com/Mastermindzh/tidal-hifi
license    : MIT
component  : multimedia.audio
summary    : Tidal in Electron with HiFi support via Widevine
description: |
    The web version of Tidal running in Electron with HiFi support thanks to Widevine.
    A desktop client for Tidal streaming music service with high-fidelity audio support.
networking : true
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(gbm)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(xscrnsaver)
    - nodejs
setup      : |
    npm install
build      : |
    npm run build-unpacked
install    : |
    %install_license LICENSE

    # Drop musl native addon; glibc variant is what we use and musl confuses dep resolver
    rm -rf dist/linux-unpacked/resources/app.asar.unpacked/node_modules/@parcel/watcher-linux-x64-musl

    %install_dir ${installdir}/usr/share/tidal-hifi
    cp -arv --no-preserve=ownership dist/linux-unpacked/. ${installdir}/usr/share/tidal-hifi/
    chmod +x ${installdir}/usr/share/tidal-hifi/tidal-hifi

    # Wrapper launcher so users can tune flags and avoid sandbox-related zygote crashes.
    %install_exe ${pkgfiles}/tidal-hifi.sh ${installdir}/usr/bin/tidal-hifi

    %install_file assets/icon.png ${installdir}/usr/share/icons/hicolor/512x512/apps/tidal-hifi.png
    %install_file ${pkgfiles}/tidal-hifi.desktop -t ${installdir}/usr/share/applications

    # AppStream metainfo for software center
    %install_file ${pkgfiles}/com.mastermindzh.tidal-hifi.metainfo.xml -t ${installdir}/usr/share/metainfo
