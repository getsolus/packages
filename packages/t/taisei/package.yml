# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : taisei
version    : 1.4.6
release    : 21
homepage   : https://taisei-project.org
source     :
    - https://github.com/taisei-project/taisei/releases/download/v1.4.6/taisei-1.4.6.tar.xz : 18d03c67dcc8c7faff22e8defdafc3a734b46c591618d1a678e6e914846889d9
license    :
    - CC0-1.0
    - CC-BY-4.0
    - MIT
component  : games.arcade
summary    : A free and open-source Touhou Project clone and fangame
description: |
    Taisei is an open clone of the Tōhō Project series. Tōhō is a one-man project of shoot-em-up games set in an isolated world full of Japanese folklore.
builddeps  :
    - pkgconfig(cglm)
    - pkgconfig(freetype2)
    - pkgconfig(gamemode)
    - pkgconfig(libunibreak)
    - pkgconfig(libwebpdecoder)
    - pkgconfig(libzip)
    - pkgconfig(libzstd)
    - pkgconfig(opusfile)
    - pkgconfig(sdl3)
    - pkgconfig(shaderc)
    - pygments
    - python-docutils
    - python-zstandard
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING.txt
