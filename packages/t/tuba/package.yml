# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : tuba
version    : 0.11.1
release    : 14
source     :
    # Upstream code is at Codeberg, keep using GitHub as source
    - https://github.com/GeopJr/Tuba/archive/refs/tags/v0.11.1.tar.gz : 10de8fab3dbd1e7d3f6482060e007cceaaa81f88aebd7a9e44e6e677608414eb
homepage   : https://tuba.geopjr.dev/
license    : GPL-3.0-or-later
component  : network.clients
summary    : Browse the Fediverse
description: |
    Browse the Fediverse. Explore the federated social web with Tuba for GNOME. Stay connected to your favorite communities, family and friends with support for popular Fediverse platforms like Mastodon, GoToSocial, Akkoma & more!
builddeps  :
    - pkgconfig(gee-0.8)
    - pkgconfig(gstreamer-plugins-base-1.0)
    - pkgconfig(gtk4)
    - pkgconfig(gtksourceview-5)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libsecret-1)
    - pkgconfig(libsoup-3.0)
    - pkgconfig(libwebp)
    - gstreamer-plugins-good
    - vala
setup      : |
    %meson_configure \
        -Ddistro=true
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
