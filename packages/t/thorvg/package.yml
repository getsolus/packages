# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : thorvg
version    : 1.1.3
release    : 1
source     :
    - https://github.com/thorvg/thorvg/archive/refs/tags/v1.1.3.tar.gz : ba9957aeeadb4151d4486f11c638ae118c00210fa4906daa7b30143aa341e690
homepage   : https://www.thorvg.org
license    : MIT
component  : programming.library
summary    : A production-ready C++ vector graphics engine supporting SVG and Lottie formats.
description: |
    Thor Vector Graphics (ThorVG) is a production-ready, lightweight vector graphics engine for interactive apps and creative tools across embedded systems, desktop apps, and the web.
builddeps  :
    - pkgconfig(libjpeg)
    - pkgconfig(libpng)
    - pkgconfig(libwebp)
setup      : |
    %meson_configure -Dbindings=capi -Dextra="opengl_es, openmp" -Dengines="cpu, gl" -Dloaders="all"
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSE
