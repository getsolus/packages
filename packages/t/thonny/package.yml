# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : thonny
version    : 5.0.0
release    : 35
source     :
    - https://files.pythonhosted.org/packages/source/t/thonny/thonny-5.0.0.tar.gz : efd0d28d143292f3943a6f3cb82edfecb91b88cc4f75f013209de5756aaf54b4
homepage   : https://thonny.org
license    : MIT
component  : programming.ide
summary    : Python IDE for beginners
description: |
    Thonny is a simple Python IDE with features useful for learning programming. It comes with a debugger which is able to visualize all the conceptual steps taken to run a Python program (executing statements, evaluating expressions, maintaining the call stack). There is a GUI for installing 3rd-party packages and special mode for learning about references.
builddeps  :
    - python-build
    - python-installer
    - python-uv-build
rundeps    :
    - pylint
    - python-asttokens
    - python-distro
    - python-docutils
    - python-jedi
    - python-mypy
    - python-pyserial
    - python-send2trash
    - python-wheel
    - python3-tkinter
build      : |
    %pyproject_build
install    : |
    %pyproject_install

    %install_file packaging/linux/org.thonny.Thonny.desktop -t ${installdir}/usr/share/applications
    %install_file packaging/linux/thonny.1 -t ${installdir}/usr/share/man/man1
    %install_file packaging/linux/org.thonny.Thonny.appdata.xml -t ${installdir}/usr/share/metainfo

    # Installing icons
    for px in 16 22 32 48 64 128 192 256 ; do
        %install_file packaging/icons/thonny-${px}x${px}.png ${installdir}/usr/share/icons/hicolor/${px}x${px}/apps/thonny.png
    done
