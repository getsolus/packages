# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : tealdeer
version    : 1.9.0
release    : 17
source     :
    - https://github.com/tealdeer-rs/tealdeer/archive/refs/tags/v1.9.0.tar.gz : 1387a04ddba714668ff0925377a2de0d0ab14533d44dd0766d673fbbd71e3119
license    : MIT
component  : system.utils
homepage   : https://tldr.sh/
summary    : A very fast implementation of tldr in Rust.
description: |
    A very fast implementation of tldr in Rust: Simplified, example based and community-driven man pages.
networking : true
builddeps  :
    - rust
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install tldr
    
    pushd $workdir/completion
    %install_file bash_tealdeer $installdir/usr/share/bash-completion/completions/tldr
    %install_file fish_tealdeer $installdir/usr/share/fish/vendor_completions.d/tldr.fish
    %install_file zsh_tealdeer $installdir/usr/share/zsh/site-functions/_tealdeer
    popd
    
    %install_license LICENSE-*
