# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : taskwarrior
version    : 3.5.0
release    : 10
source     :
    - https://github.com/GothenburgBitFactory/taskwarrior/releases/download/v3.5.0/task-3.5.0.tar.gz : 9ea64b411f8314414f440ec765dfdf5a86c9f6159df47e2f60cff3db6b31157a
homepage   : https://taskwarrior.org
license    : MIT
component  : office.notes
summary    : Command-Line Task Management
description: |
    Taskwarrior is Free and Open Source Software that manages your TODO list from the command line. It is flexible, fast, and unobtrusive. It does its job then gets out of your way.
networking : true
builddeps  :
    - corrosion
    - rust
setup      : |
    %cmake_ninja
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE
check      : |
    %cmake_test
