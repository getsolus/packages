# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : tor
version    : 0.4.9.13
release    : 47
source     :
    - https://dist.torproject.org/tor-0.4.9.13.tar.gz : 5e748d3272cdf44a7d7741173f371c8def3d96eecb77e93c89c50663ce9cc792
homepage   : https://www.torproject.org/
license    : BSD-3-Clause
component  : security
summary    : Tor is free software and an open network that helps you defend against traffic analysis
description: |
    Tor is free software and an open network that helps you defend against traffic analysis
builddeps  :
    - pkgconfig(libevent)
    - pkgconfig(libseccomp)
    - pkgconfig(libzstd)
    - asciidoc
    - ca-certs
setup      : |
    %configure_no_runstatedir
build      : |
    %make
install    : |
    %make_install
    rm $installdir/etc/tor/torrc.sample
    %install_file $pkgfiles/torrc $installdir/etc/tor/torrc
    %install_file $pkgfiles/tor.service $installdir/%libdir%/systemd/system/tor.service
    %install_file $pkgfiles/tor.sysusers $installdir/%libdir%/sysusers.d/tor.conf
    %tmpfiles 'd /var/cache/tor 0755 - - -'
    %install_license LICENSE
