# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : trackma
version    : 0.10.3
release    : 22
source     :
    - https://github.com/z411/trackma/archive/v0.10.3.tar.gz : ff15982555b377e63c36fc8d8964d210cdd79564ea633ecce22ca1796dcac41f
homepage   : https://z411.github.io/trackma/
license    : GPL-3.0-or-later
component  : multimedia.video
summary    : Lightweight and simple client for managing Anilist, Kitsu, MyAnimeList, Shikimori and VNDB lists
description: |
    Trackma aims to be a lightweight and simple, but feature-rich program for Unix based systems for managing personal lists hosted in several media tracking websites. Currently supported sites include Anilist, Kitsu, MyAnimeList, Shikimori and VNDB.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-packaging
    - python-poetry
    - python-wheel
rundeps    :
    - lsof # for polling tracker support
    - python-inotify # for inotify tracker support
    - python-pillow # for showing preview images in Qt/GTK interfaces
    - python3-dbus # for MPRIS tracker support
    - curses:
        - python3-urwid
        - trackma
    - gtk   :
      - python-cairo
      - python-gobject
      - trackma
    - qt    :
      - python-qt6
      - trackma
setup      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_file ${pkgfiles}/trackma-curses.desktop ${installdir}/usr/share/applications/trackma-curses.desktop
    %install_file ${pkgfiles}/trackma-gtk.desktop ${installdir}/usr/share/applications/trackma-gtk.desktop
    %install_file ${pkgfiles}/trackma-qt.desktop ${installdir}/usr/share/applications/trackma-qt.desktop
    %install_file trackma/data/icon.png  ${installdir}/usr/share/icons/hicolor/96x96/apps/trackma.png
    %install_file trackma/data/icon.png  ${installdir}/usr/share/icons/hicolor/96x96/apps/trackma-gtk.png
    %install_file trackma/data/icon.png  ${installdir}/usr/share/icons/hicolor/96x96/apps/trackma-qt.png
    %install_file ${pkgfiles}/trackma-gtk.metainfo.xml ${installdir}/usr/share/metainfo/io.github.z411.trackma.trackma_gtk.metainfo.xml
    %install_file ${pkgfiles}/trackma-qt.metainfo.xml ${installdir}/usr/share/metainfo/io.github.z411.trackma.trackma_qt.metainfo.xml
    %install_license COPYING
patterns   :
    - curses:
      - /usr/bin/trackma-curses
      - /usr/share/applications/trackma-curses.desktop
      - /usr/share/icons/hicolor/96x96/apps/trackma.png
      - /usr/lib/python3.14/site-packages/trackma/ui/curses.py
    - gtk:
      - /usr/bin/trackma-gtk
      - /usr/share/applications/trackma-gtk.desktop
      - /usr/share/icons/hicolor/96x96/apps/trackma-gtk.png
      - /usr/share/metainfo/io.github.z411.trackma.trackma_gtk.metainfo.xml
      - /usr/lib/python3.*/site-packages/trackma/ui/gtk
    - qt:
      - /usr/bin/trackma-qt
      - /usr/share/applications/trackma-qt.desktop
      - /usr/share/icons/hicolor/96x96/apps/trackma-qt.png
      - /usr/share/metainfo/io.github.z411.trackma.trackma_qt.metainfo.xml
      - /usr/lib/python3.*/site-packages/trackma/ui/qt
