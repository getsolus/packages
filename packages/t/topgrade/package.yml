# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : topgrade
version    : '17.12.2'
release    : 1
source     :
    - https://github.com/topgrade-rs/topgrade/archive/refs/tags/v17.12.2.tar.gz : 9cffc162b7a4e0bc40379bc05eff44f62ce57c3ac13126b2d310068f138488ca
homepage   : https://github.com/topgrade-rs/topgrade
license    : GPL-3.0-or-later
component  : system.utils
summary    : Upgrade all the things
description: |
    topgrade is a command line tool that updates everything on a system in one
    go. It detects the package managers, version managers, and other tools
    present on the system, then runs the appropriate update and cleanup
    command for each, followed by optional post-update hooks.
builddeps  :
    - cmake
    - pkgconf
    - rust
networking : true
setup      : |
    %cargo_fetch
build      : |
    # --no-default-features is deliberate: topgrade's self-updater lives
    # behind the optional `self-update` cargo feature, which is not in
    # `default = []`. Keeps a future upstream change to the defaults from
    # enabling it.
    %cargo_build --no-default-features
install    : |
    %cargo_install
    %install_license LICENSE
    %symlink_check
