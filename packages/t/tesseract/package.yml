# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : tesseract
version    : 5.5.4
release    : 22
source     :
    - https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.4.tar.gz : a8dbf8b8c8ee427ff6ad1d99116502feaf59440af1adb893caf60a6576826cf4
homepage   : https://tesseract-ocr.github.io/
license    : Apache-2.0
component  : office
summary    : Tesseract Open Source OCR Engine
description: |
    Tesseract is an open source text recognition (OCR) Engine.
builddeps  :
    - pkgconfig(lept)
    - pkgconfig(libarchive)
rundeps    :
    - tessdata
clang      : true
setup      : |
    # Since we're building with Clang we need to make sure it links against libomp
    export CFLAGS="$CFLAGS -fopenmp"
    export CXXFLAGS="$CXXFLAGS -fopenmp"

    %autogen --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license LICENSE