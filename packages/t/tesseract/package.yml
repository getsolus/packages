# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : tesseract
version    : 5.5.5
release    : 23
source     :
    - https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.5.tar.gz : b02cf6f37cfc95be5bf7e4b2d39e51997b1ac41f7beb4e2bd16777bb67561c79
homepage   : https://tesseract-ocr.github.io/
license    : Apache-2.0
component  : office
summary    : Tesseract Open Source OCR Engine
description: |
    Tesseract is an open source text recognition (OCR) Engine.
builddeps  :
    - pkgconfig(lept)
    - pkgconfig(libarchive)
rundeps    :
    - tessdata
clang      : true
setup      : |
    # Since we're building with Clang we need to make sure it links against libomp
    export CFLAGS="$CFLAGS -fopenmp"
    export CXXFLAGS="$CXXFLAGS -fopenmp"

    %autogen --disable-static
build      : |
    %make
install    : |-
    %make_install
    %install_license LICENSE
