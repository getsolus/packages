# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : tcpdump
version    : 4.99.7
release    : 20
source     :
    - https://github.com/the-tcpdump-group/tcpdump/archive/refs/tags/tcpdump-4.99.7.tar.gz : f748d773343f9149723ab76b2025163038137bf6af6780f2fd43d99830547991
homepage   : https://www.tcpdump.org/
license    : BSD-2-Clause
component  : network.util
summary    : Dump traffic on a network
description: |
    Tcpdump prints out a description of the contents of packets on a network interfacethat matches a given expression, allowing targeted analysis. It can save data to files for analysis later as well.
builddeps  :
    - pkgconfig(libpcap)
setup      : |
    %reconfigure
build      : |
    %make
install    : |
    %make_install
    %install_license LICENSE
