# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : typescript
version    : 7.0.2
release    : 3
source     :
    - https://github.com/microsoft/TypeScript/archive/refs/tags/v7.0.2.tar.gz : 8472f284b1465f5c4826a64c88853eccba667446f31a435ed1d0b28d373dbc0b
homepage   : https://www.typescriptlang.org
license    : Apache-2.0
component  : programming
summary    : A language for application-scale JavaScript
description: |
    TypeScript is a language for application-scale JavaScript. TypeScript adds optional types to JavaScript that support tools for large-scale JavaScript applications for any browser, for any host, on any OS. TypeScript compiles to readable, standards-based JavaScript.
networking : true
builddeps  :
    - golang
environment: |
    export CGO_CPPFLAGS="${CPPFLAGS}"
    export CGO_CFLAGS="${CFLAGS}"
    export CGO_CXXFLAGS="${CXXFLAGS}"
    export CGO_LDFLAGS="${LDFLAGS}"
    export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
setup      : |
    go -C tsc mod download
build      : |
    # noembed makes tsc load lib.*.d.ts from its own directory, matching upstream's npm build.
    go build -C tsc -v -trimpath -tags noembed -o tsc ./cmd/tsgo
install    : |
    %install_exe tsc/tsc -t ${installdir}/%libdir%/${package}
    %install_file tsc/internal/bundled/libs/*.d.ts -t ${installdir}/%libdir%/${package}

    %install_dir ${installdir}/usr/bin
    ln -s /%libdir%/${package}/tsc ${installdir}/usr/bin/tsc

    %install_license LICENSE.txt
