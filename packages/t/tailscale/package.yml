# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : tailscale
version    : 1.102.3
release    : 64
source     :
    - https://github.com/tailscale/tailscale/archive/refs/tags/v1.102.3.tar.gz : 0e94d961c31ce7d33e8b7ce4ac6fdbec83ee5658784eed69eb7fce300729d717
homepage   : https://tailscale.com
license    : BSD-3-Clause
component  : network.clients
summary    : Private WireGuard® networks made easy
description: |
    The easiest, most secure way to use WireGuard and 2FA.
networking : true
builddeps  :
    - golang
environment: |
    export VERSION_LONG=%version%
    export VERSION_SHORT=%version%
setup      : |
    %patch -p1 -i ${pkgfiles}/defaults.patch
build      : |
    ./build_dist.sh tailscale.com/cmd/tailscale
    ./build_dist.sh tailscale.com/cmd/tailscaled
install    : |
    %install_license LICENSE
    %install_bin tailscale
    %install_exe tailscaled ${installdir}/usr/sbin/tailscaled
    %install_file cmd/tailscaled/tailscaled.service ${installdir}/%libdir%/systemd/system/tailscaled.service
    %install_file cmd/tailscaled/tailscaled.defaults ${installdir}/usr/share/defaults/tailscale/tailscaled

    # Install service preset file
    %install_file -t ${installdir}/%libdir%/systemd/system-preset/ ${pkgfiles}/60-tailscale.preset

    # Shell completions
    ./tailscale completion bash | %install_file /dev/stdin ${installdir}/usr/share/bash-completion/completions/tailscale
    ./tailscale completion zsh | %install_file /dev/stdin ${installdir}/usr/share/zsh/site-functions/_tailscale
    ./tailscale completion fish | %install_file /dev/stdin ${installdir}/usr/share/fish/vendor_completions.d/tailscale.fish
