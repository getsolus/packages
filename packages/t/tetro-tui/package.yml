# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : tetro-tui
version    : 3.6.2
release    : 5
source     :
    - https://github.com/Strophox/tetro-tui/archive/refs/tags/v3.6.2.tar.gz : 2485eee4978b5a92d22c0fa03ccc9214a4f5b742d404bed3d544ca236a87da40
homepage   : https://github.com/Strophox/tetro-tui
license    : MIT
component  : games.puzzle
summary    : Cross-platform terminal tetromino game
description: |
    A cross-platform terminal game where tetrominos fall and stack. Features multiple
    game modes (Swift, Classic, Master, Puzzle, and more), customizable graphics and
    keybinds, scoreboards, replays, and statistics.
networking : true
builddeps  :
    - rust
setup      : |
    %cargo_fetch
build      : |
    %cargo_build --all-features
install    : |
    %cargo_install
    %install_license LICENSE
check      : |
    %cargo_test
replaces   :
    - tetrs
    - dbginfo :
        - tetrs-dbginfo
