# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : tabularis
version    : 0.22.0
release    : 4
source     :
    - https://github.com/TabularisDB/tabularis/archive/refs/tags/v0.22.0.tar.gz : 7a994302743a1783ab579cd5085c5e797185007a09424c6cf8a003071af0fe93
homepage   : https://tabularis.dev
license    : Apache-2.0
component  : database
summary    : Tabularis is a free, open-source desktop database client for PostgreSQL, MySQL/MariaDB, SQLite, and more.
description: |
    Tabularis is a free, open-source desktop database client for PostgreSQL, MySQL/MariaDB, and SQLite. Built with Rust, Tauri,and React. It is fast, lightweight, and designed for everyday SQL work. Brings optional LLM connectivity.
networking : true
builddeps  :
    - pkgconfig(ayatana-appindicator3-0.1)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libsecret-1)
    - pkgconfig(webkit2gtk-4.1)
    - git
    - nodejs
    - pnpm
    - rust
rundeps    :
    - libayatana-appindicator
    - libgtk-3
    - libsecret
    - libwebkit-gtk41
    - openssl
ccache     : false
setup      : |
    pnpm install --frozen-lockfile --ignore-scripts
build      : |
    export PACKAGE_MANAGER_SRC=eopkg
    export PACKAGE_MANAGER_NAME=Solus

    pnpm tauri build --no-bundle
install    : |
    %install_bin src-tauri/target/release/tabularis
    %install_license LICENSE

    %install_file $pkgfiles/dev.tabularis.Tabularis.desktop $installdir/usr/share/applications/dev.tabularis.Tabularis.desktop
    %install_file $pkgfiles/dev.tabularis.Tabularis.metainfo.xml $installdir/usr/share/metainfo/dev.tabularis.Tabularis.metainfo.xml

    %install_file src-tauri/icons/128x128@2x.png $installdir/usr/share/icons/hicolor/128x128@2/apps/tabularis.png
    %install_file src-tauri/icons/128x128.png $installdir/usr/share/icons/hicolor/128x128/apps/tabularis.png
    %install_file src-tauri/icons/64x64.png $installdir/usr/share/icons/hicolor/64x64/apps/tabularis.png
    %install_file src-tauri/icons/32x32.png $installdir/usr/share/icons/hicolor/32x32/apps/tabularis.png
