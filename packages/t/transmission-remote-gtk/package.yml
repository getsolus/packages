# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : transmission-remote-gtk
version    : 1.7.1
release    : 10
source     :
    - https://github.com/transmission-remote-gtk/transmission-remote-gtk/releases/download/1.7.1/transmission-remote-gtk-1.7.1.tar.xz : 5ef98bd96b3b77eb3880474a2d904e316bb29cbd22dfa0ca85d43b04a28fba34
homepage   : https://github.com/transmission-remote-gtk/transmission-remote-gtk
license    : GPL-2.0-or-later
component  : network.download
