# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : typos
version    : 1.49.0
release    : 6
source     :
    - https://github.com/crate-ci/typos/archive/refs/tags/v1.49.0.tar.gz : e585a0ae08c5fe9924061aeddf80f31214c146d26ab8094f2f241528f0b9473e
license    :
    - Apache-2.0
    - MIT
component  : programming.tools
homepage   : https://github.com/crate-ci/typos
summary    : Source code spell checker
description: |
    Source code spell checker
builddeps  :
    - rust
checkdeps  :
    - rust-devel # Needs rustfmt
networking : true
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install
    %install_license LICENSE-APACHE
    %install_license LICENSE-MIT
check      : |
    %cargo_test
