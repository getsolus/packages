# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : typos
version    : 1.52.2
release    : 7
source     :
    - https://github.com/crate-ci/typos/archive/refs/tags/v1.52.2.tar.gz : 72d8b9ab9cc54512865f51d8ff65903532785b1c32d58fc4e179ddf89299c5be
license    :
    - Apache-2.0
    - MIT
component  : programming.tools
homepage   : https://github.com/crate-ci/typos
summary    : Source code spell checker
description: |
    Source code spell checker
builddeps  :
    - rust
checkdeps  :
    - rust-devel # Needs rustfmt
networking : true
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install
    %install_license LICENSE-APACHE
    %install_license LICENSE-MIT
check      : |
    %cargo_test
