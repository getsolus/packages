# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : tree-sitter
version    : 0.27.2
release    : 23
source     :
    - https://github.com/tree-sitter/tree-sitter/archive/refs/tags/v0.27.2.tar.gz : 356528363bf7fbad12a2cfeb5a2678c0118ef886a4d69ad9a379db5fdef0735f
homepage   : https://tree-sitter.github.io
license    : MIT
component  :
    - programming.library
    - cli : programming.tools
summary    :
    - An incremental parsing system for programming tools
    - cli : CLI tool for developing, testing, and using Tree-sitter parsers
description: |
    Tree-sitter is a parser generator tool and an incremental parsing library.
networking : true
optimize   :
    - lto
    - speed
builddeps  :
    - rust
setup      : |
    %cargo_fetch
    %cmake_ninja
build      : |
    %ninja_build
    %cargo_build -p tree-sitter-cli
install    : |
    %ninja_install
    # rm -v $installdir/%libdir%/libtree-sitter.a
    install -Dm00755 target/release/tree-sitter -t $installdir/usr/bin
    %install_license LICENSE
patterns   :
    - cli :
        - /usr/bin
