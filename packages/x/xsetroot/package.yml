# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xsetroot
version    : 1.1.4
release    : 10
source     :
    - https://www.x.org/releases/individual/app/xsetroot-1.1.4.tar.gz : 15913c5c86ff10005e53ea46efe57d3ba7f2df2a0c4636d164c3bc6ebe2f5c6b
license    : MIT
component  : xorg.apps
homepage   : https://www.x.org/
summary    : X.Org Applications - xsetroot
description: |
    The xsetroot program allows you to tailor the appearance of the background ("root") window on a workstation display running X.
builddeps  :
    - pkgconfig(x11)
    - pkgconfig(xbitmaps)
    - pkgconfig(xcursor)
    - pkgconfig(xmuu)
    - pkgconfig(xorg-macros)
    - pkgconfig(xproto)
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING
