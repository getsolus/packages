# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xfce4-timer-plugin
version    : 1.8.0
release    : 1
source     :
    - https://archive.xfce.org/src/panel-plugins/xfce4-timer-plugin/1.8/xfce4-timer-plugin-1.8.0.tar.xz : 1d3ac3aa2c4345400c025642778e7643aab41047622baf9cdc00bbac78e89f99
homepage   : https://docs.xfce.org/panel-plugins/xfce4-timer-plugin/start
license    : GPL-2.0-or-later
component  : desktop.xfce
summary    : Timer and alarm plugin for the Xfce panel
description: |
    The Xfce Timer Plugin allows users to run countdown timers and alarms
    directly from the Xfce panel. It supports alarms at specified times,
    repeating alarms, and custom commands when a timer finishes.
builddeps  :
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libxfce4panel-2.0)
    - pkgconfig(libxfce4ui-2)
    - pkgconfig(libxfce4util-1.0)
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING
