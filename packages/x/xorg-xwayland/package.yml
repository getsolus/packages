# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xorg-xwayland
version    : 24.1.15
release    : 44
source     :
    - https://www.x.org/releases/individual/xserver/xwayland-24.1.15.tar.xz : 7311b4bcda22cfc19cb99680eb1c35cfc1ea885981310639f0429fe2948c122e
license    : MIT
component  : xorg.server
homepage   : https://www.x.org/
summary    : X server intended for Xorg only clients to run under Wayland for backwards compatibility.
description: |
    X server intended for Xorg only clients to run under Wayland for backwards compatibility.
builddeps  :
    - pkgconfig(dri)
    - pkgconfig(epoxy)
    - pkgconfig(fontutil)
    - pkgconfig(inputproto)
    - pkgconfig(libdecor-0)
    - pkgconfig(libdrm)
    - pkgconfig(libei-1.0)
    - pkgconfig(libtirpc)
    - pkgconfig(libxcvt)
    - pkgconfig(nettle)
    - pkgconfig(pixman-1)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-eglstream-protocols)
    - pkgconfig(wayland-protocols)
    - pkgconfig(xfont2)
    - pkgconfig(xkbcomp)
    - pkgconfig(xkbfile)
    - pkgconfig(xshmfence)
    - pkgconfig(xtrans)
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING

    # Provided by xorg-server
    rm -fr ${installdir}/usr/lib64/xorg/
    rm ${installdir}/usr/share/man/man1/Xserver.1
patterns   : /*
