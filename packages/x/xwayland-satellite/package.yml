# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xwayland-satellite
version    : 0.8.3
release    : 6
source     :
    - https://github.com/Supreeeme/xwayland-satellite/archive/refs/tags/v0.8.3.tar.gz : 8b32873d7d740143ce9efa3cfb43c17d0176b89d2e8ffaa497db709f154fc478
homepage   : https://github.com/Supreeeme/xwayland-satellite
license    : MPL-2.0
component  : desktop
summary    : Xwayland outside your Wayland
description: |
    Grants rootless Xwayland integration to any Wayland compositor implementing xdg_wm_base and viewporter. This is particularly useful for compositors that (understandably) do not want to go through implementing support for rootless Xwayland themselves.
builddeps  :
    - pkgconfig(xcb-cursor)
    - pkgconfig(xwayland)
    - rust
networking : true
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-systemd-use-usr-bin-for-exectuable-path.patch

    %cargo_fetch
build      : |
    %cargo_build -F systemd
install    : |
    %cargo_install
    %install_license LICENSE
    %install_file resources/xwayland-satellite.service -t ${installdir}/%libdir%/systemd/user
