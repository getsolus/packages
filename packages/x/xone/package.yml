# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xone
version    : 0.5.8
release    : 133
source     :
    - https://github.com/dlundqvist/xone/archive/refs/tags/v0.5.8.tar.gz : f1905d5046ce79b94df0501045008203c4ae4ce6f43dbcf8bd04d7c944bf420e
    - git|https://github.com/forkymcforkface/xpad-noone : 7b5361475c719b03b9e0152e44cf7fca0b85af60
homepage   : https://github.com/dlundqvist/xone
license    : GPL-2.0-or-later
component  :
    - kernel.drivers
    - current : kernel.drivers
    - common : system.utils
    - modaliases : kernel.drivers
summary    :
    - Linux kernel driver for Xbox One and Xbox Series X|S accessories
    - current : xone for the linux-current kernel
    - common : Common component for xone kernel modules
    - modaliases : These files are used by the Software Center for hardware detection
description: |
    xone is a Linux kernel driver for Xbox One and Xbox Series X|S accessories. It serves as a modern replacement for xpad, aiming to be compatible with Microsoft's Game Input Protocol.
builddeps  :
    - pkgconfig(alsa)
    - linux-current
    - linux-current-headers
    - linux-lts
    - linux-lts-headers
rundeps    :
    - common :
        - cabextract
        - libarchive-bin
        - upower
    - current :
        - xone-common
    - xone-common
environment: |
    kernels=(
        %kernel_version_current%
        %kernel_version_lts%
    )
setup      : |
    pushd ..

    for _kernel in "${kernels[@]}"; do
        mkdir "${_kernel}"
        cp -a "xone-${version}" "${_kernel}"/xone
        cp -a "${sources}/xpad-noone.git" "${_kernel}/xpad-noone"
    done
build      : |
    for _kernel in "${kernels[@]}"; do
        pushd "${_kernel}"

        # Build xone kernel modules
        pushd xone
        %make -C "%libdir%/modules/${_kernel}/build" M="${PWD}"
        popd

        # Build xpad-noone kernel modules
        pushd xpad-noone
        %make -C "%libdir%/modules/${_kernel}/build" M="${PWD}"
        popd

        # Build modaliases for LDM
        mkmodaliases "${package}" -o "${package}.modaliases" {xone,xpad-noone}/*.ko
        popd
    done
install    : |
    for _kernel in "${kernels[@]}"; do
        pushd "${_kernel}"

        # Install xone
        pushd xone
        %install_file *.ko -t "${installdir}/%libdir%/modules/${_kernel}/extra/drivers/input/joystick"
        %install_file install/modprobe.conf ${installdir}/usr/lib/modprobe.d/xone-blacklist.conf
        %install_file install/firmware.sh ${installdir}/usr/bin/xone-get-firmware.sh
        %install_license LICENSE
        popd

        # Install xpad-noone
        pushd xpad-noone
        %install_file *.ko -t "${installdir}/%libdir%/modules/${_kernel}/extra/drivers/input/joystick"
        popd

        # Install modaliases for hardware detection
        %install_file ${package}.modaliases -t ${installdir}/usr/share/linux-driver-management/modaliases
        popd
    done

    # Compress modules with zstd
    find "${installdir}" -name '*.ko' -exec strip --strip-debug {} \; -exec zstd {} \; -exec rm -v {} \;

    # Usr-merge
    %install_dir ${installdir}/lib64
    pushd ${installdir}/usr
    file_list=()
    while IFS=  read -r -d $'\0'; do
        file_list+=("$REPLY")
    done < <(find lib64/modules -type f -print0)
    for file in "${file_list[@]}"; do
        parent=$(dirname "$file")
        %install_dir "${installdir}/${parent}"
        ln -srv "${installdir}/usr/${file}" "${installdir}/${file}"
    done
    popd
patterns   :
    - common : /*
    - main :
        - /lib64/modules/*.lts
        - /usr/lib64/modules/*.lts
    - current :
        - /lib64/modules/*.current
        - /usr/lib64/modules/*.current
    - modaliases : /usr/share/linux-driver-management/modaliases
permanent  :
    - /lib64/modules
    - /usr/lib64/modules
