# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json

name       : xfce4-eyes-plugin
version    : 4.7.0
release    : 1
source     :
    - https://archive.xfce.org/src/panel-plugins/xfce4-eyes-plugin/4.7/xfce4-eyes-plugin-4.7.0.tar.xz : 87f9b978ca75abb3aa5edb1315eb65ef98654a662c14621847ddffe8aa6574ad
homepage   : https://docs.xfce.org/panel-plugins/xfce4-eyes-plugin/start
license    : GPL-2.0-or-later
component  : desktop.xfce
summary    : Eyes plugin for the Xfce panel
description: |
    A simple plugin for the Xfce panel that displays animated eyes
    which follow the mouse pointer. Includes several eye themes.
builddeps  :
    - pkgconfig(glib-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libxfce4panel-2.0)
    - pkgconfig(libxfce4ui-2)
    - pkgconfig(libxfce4util-1.0)
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING
