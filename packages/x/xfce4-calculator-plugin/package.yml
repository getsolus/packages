# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json

name       : xfce4-calculator-plugin
version    : 0.8.0
release    : 1
source     :
    - https://archive.xfce.org/src/panel-plugins/xfce4-calculator-plugin/0.8/xfce4-calculator-plugin-0.8.0.tar.xz : aaf3d7e9654ef6cf8ec442ad9e4316c481f9a6087a8e8949261140f5ae136aeb
homepage   : https://docs.xfce.org/panel-plugins/xfce4-calculator-plugin/start
license    : GPL-2.0-or-later
component  : desktop.xfce
summary    : Calculator plugin for the Xfce panel
description: |
    A lightweight calculator plugin for the Xfce panel. Enter a mathematical
    expression directly in the panel to calculate its result.
builddeps  :
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libxfce4panel-2.0)
    - pkgconfig(libxfce4ui-2)
    - pkgconfig(libxfce4util-1.0)
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
