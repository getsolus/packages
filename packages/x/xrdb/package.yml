# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xrdb
version    : 1.2.3
release    : 12
source     :
    - https://www.x.org/releases/individual/app/xrdb-1.2.3.tar.gz : 89c3d0a5ee77e3f1b25a3a63cce2a322fe899acb061ed8e0bab6920189b61edd
license    : MIT
component  : xorg.apps
homepage   : https://www.x.org/
summary    : |
    X server resource database utility
description: |
    xrdb (X resource database manager) is a program used for accessing the X resources of a server.
builddeps  :
    - pkgconfig(x11)
    - pkgconfig(xmuu)
    - pkgconfig(xorg-macros)
    - pkgconfig(xproto)
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING
