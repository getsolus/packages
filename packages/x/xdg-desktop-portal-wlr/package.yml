# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xdg-desktop-portal-wlr
version    : 0.8.4
release    : 5
source     :
    - https://github.com/emersion/xdg-desktop-portal-wlr/releases/download/v0.8.4/xdg-desktop-portal-wlr-0.8.4.tar.gz : 41b9683acae9415005d7b62d801e34946cb95da5eaaa83528c7085759a635187
license    : MIT
component  : desktop.util
homepage   : https://github.com/emersion/xdg-desktop-portal-wlr
summary    : xdg-desktop-portal backend for wlroots
description: |
    xdg-desktop-portal backend for wlroots
builddeps  :
    - pkgconfig(gbm)
    - pkgconfig(inih)
    - pkgconfig(libdrm)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libsystemd)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - scdoc
rundeps    :
    - grim
    - pipewire
    - slurp
    - xdg-desktop-portal
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-screencast-Try-slurp-when-the-request-includes-monit.patch

    %meson_configure \
        -Dsd-bus-provider=libsystemd
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE

    # Install our portal configuration
    install -Dm00644 $pkgfiles/wlroots-portals.conf $installdir/usr/share/xdg-desktop-portal/wlroots-portals.conf
