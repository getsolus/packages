# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xpad
version    : 6.0.0
release    : 6
source     :
    - https://launchpad.net/xpad/trunk/6.0/+download/xpad-6.0.0.tar.bz2 : 4c37c7648a42029bfb6e9e2a6a58ddb8fcf48b58cca68c5a34297f530b9fe0ae
homepage   : https://launchpad.net/xpad
license    : GPL-3.0-or-later
component  : office.notes
summary    : A basic sticky note application
description: |
    A sticky note application for jotting down things to remember
builddeps  :
    - pkgconfig(gtksourceview-4)
    - pkgconfig(xt)
    - gettext-devel
setup      : |
    NOCONFIGURE=1 %autogen
    %configure
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
