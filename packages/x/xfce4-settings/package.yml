# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xfce4-settings
version    : 4.20.5
release    : 15
source     :
    - https://archive.xfce.org/src/xfce/xfce4-settings/4.20/xfce4-settings-4.20.5.tar.bz2 : a5fbe0e511cce29d603320ade575ad4001bd570e60f37760233237ba478affe8
homepage   : https://docs.xfce.org/xfce/xfce4-settings/start
license    : GPL-2.0-or-later
component  : desktop.xfce
summary    : Xfce's Configuration System.
description: |
    Xfce's Configuration System.
builddeps  :
    - pkgconfig(exo-2)
    - pkgconfig(garcon-gtk3-1)
    - pkgconfig(libxfce4ui-2)
    - pkgconfig(libxfconf-0)
    - pkgconfig(libxklavier)
    - pkgconfig(xi)
    - pkgconfig(xrandr)
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Use-Solus-defaults.patch

    %configure \
        --enable-xrandr \
        --enable-xcursor \
        --enable-libnotify \
        --enable-libxklavier \
        --enable-pluggable-dialogs \
        --enable-sound-settings \
        --disable-debug \
        --sysconfdir=/usr/share
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
