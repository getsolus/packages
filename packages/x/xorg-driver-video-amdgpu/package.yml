# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xorg-driver-video-amdgpu
version    : 25.0.0
release    : 31
source     :
    - https://www.x.org/releases/individual/driver/xf86-video-amdgpu-25.0.0.tar.xz : 7653cead024a6820ed1139958503278d78b4b3f80befcacf54ce87a5199b0ce2
license    : MIT
homepage   : https://www.x.org/
summary    : Support for AMDGPU devices
component  : xorg.driver
description: |
    Support for AMDGPU devices
builddeps  :
    - pkgconfig(gbm)
    - pkgconfig(libdrm)
    - pkgconfig(libudev)
    - pkgconfig(xorg-server)
    - pkgconfig(xproto)
optimize   :
    - no-bind-now
    - no-symbolic
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING
