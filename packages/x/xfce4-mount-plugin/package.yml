# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xfce4-mount-plugin
version    : 1.2.0
release    : 1
source     :
    - https://archive.xfce.org/src/panel-plugins/xfce4-mount-plugin/1.2/xfce4-mount-plugin-1.2.0.tar.xz : adef71a83078e7dc45997e57411f8c43080a0204159a8b8db2ade0a9877e7b4c
homepage   : https://docs.xfce.org/panel-plugins/xfce4-mount-plugin/start
license    : GPL-2.0-or-later
component  : desktop.xfce
summary    : Mount and unmount filesystems from the Xfce panel
description: |
    The Xfce Mount Plugin allows users to mount and unmount filesystems from the panel, including devices and network filesystems listed in /etc/fstab. It displays mount status and filesystem usage, and supports configurable commands for mounting, unmounting, and opening mounted devices.
builddeps  :
    - pkgconfig(libxfce4panel-2.0)
    - pkgconfig(libxfce4ui-2)
    - pkgconfig(libxfce4util-1.0)
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
