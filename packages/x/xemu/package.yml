# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xemu
version    : 0.8.136
release    : 4
source     :
    - git|https://github.com/xemu-project/xemu.git : v0.8.136
license    :
    - GPL-2.0-or-later
    - MIT
    - BSD-2-Clause
component  : game.emulator
homepage   : https://xbox.app
summary    : Original Xbox Emulator
description: |
    An open-source, cross-platform application that emulates the hardware of the original Xbox game console, allowing users to play their Xbox games on Windows, macOS, and Linux systems.
networking : true
builddeps  :
    - pkgconfig(epoxy)
    - pkgconfig(glu)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(keyutils)
    - pkgconfig(libcurl)
    - pkgconfig(libpcap)
    - pkgconfig(liburing)
    - pkgconfig(libxxhash)
    - pkgconfig(openssl)
    - pkgconfig(pixman-1)
    - pkgconfig(samplerate)
    - pkgconfig(sdl3) 
    - pkgconfig(sdl3-image)
    - pkgconfig(slirp)
    - pkgconfig(tomlplusplus)
    - pkgconfig(vulkan)
    - pkgconfig(xscrnsaver)
    - acpica-unix
    - glslang-devel
    - ninja
    - pyyaml
    - volk
setup      : |
    %configure_no_runstatedir \
                --extra-cflags="-DXBOX=1 -Wno-error=redundant-decls ${CFLAGS} -O3 -I$workdir/ui/imgui" \
                --target-list=i386-softmmu \
                --enable-lto --disable-werror
build      : |
    %make
install    : |
    %install_exe $workdir/build/qemu-system-i386 $installdir/usr/bin/xemu
    
    %install_license LICENSE COPYING COPYING.LIB 
    
    # Appdata, desktop, and icons
    %install_file $pkgfiles/app.xemu.xemu.desktop $installdir/usr/share/applications/app.xemu.xemu.desktop
    %install_file $pkgfiles/xemu.metainfo.xml $installdir/usr/share/metainfo/xemu.metainfo.xml
    

    for i in 16 24 32 48 64 128 256 512; do
        %install_file $workdir/ui/icons/xemu_${i}x${i}.png $installdir/usr/share/icons/hicolor/${i}x${i}/apps/app.xemu.xemu.png
    done

