# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xfce4-notes-plugin
version    : 1.12.0
release    : 1
source     :
    - https://archive.xfce.org/src/panel-plugins/xfce4-notes-plugin/1.12/xfce4-notes-plugin-1.12.0.tar.xz : cf4cc8f2e9785b7032aef6a74f316b8d7945457982295f8465a872b75da46a2a
homepage   : https://docs.xfce.org/panel-plugins/xfce4-notes-plugin/start
license    : GPL-2.0-or-later
component  : desktop.xfce
summary    : Sticky notes plugin for the Xfce desktop
description: |
    The Xfce Notes plugin provides a convenient way to create and manage
    sticky notes on the desktop. It can be used for quick reminders,
    to-do lists, and storing short pieces of text.

builddeps  :
    - pkgconfig(gio-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(gtksourceview-4)
    - pkgconfig(libxfce4panel-2.0)
    - pkgconfig(libxfce4ui-2)
    - pkgconfig(libxfce4util-1.0)
    - pkgconfig(libxfconf-0)
    - vala
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    install -Dm644 "${installdir}/etc/xdg/autostart/xfce4-notes-autostart.desktop" "${installdir}/usr/share/xdg/autostart/xfce4-notes-autostart.desktop"
    rm "${installdir}/etc/xdg/autostart/xfce4-notes-autostart.desktop"
    rmdir "${installdir}/etc/xdg/autostart"
    rmdir "${installdir}/etc/xdg" 2>/dev/null || true
    rmdir "${installdir}/etc" 2>/dev/null || true
    %install_license COPYING
    %install_file ${pkgfiles}/org.xfce.notes.metainfo.xml ${installdir}/usr/share/metainfo/org.xfce.notes.metainfo.xml
