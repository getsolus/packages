# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xfce4-power-manager
version    : 4.20.1
release    : 10
source     :
    - https://archive.xfce.org/src/xfce/xfce4-power-manager/4.20/xfce4-power-manager-4.20.1.tar.bz2 : 4fe18ef5f89c5ca9b96dde84dbd88ca7e36af1caf70ddd6429dc72128007edf7
homepage   : https://docs.xfce.org/xfce/xfce4-power-manager/start
license    : GPL-2.0-or-later
component  : desktop.xfce
summary    : Power Manager for Xfce.
description: |
    Power Manager for Xfce.
builddeps  :
    - pkgconfig(libnotify)
    - pkgconfig(libxfce4panel-2.0)
    - pkgconfig(libxfce4ui-2)
    - pkgconfig(upower-glib)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-data-appdata-Add-launchable-desktop-id-tag-for-appst.patch

    %configure \
        --enable-polkit \
        --disable-debug \
        --sysconfdir=/usr/share
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
