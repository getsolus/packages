# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xz
version    : 5.8.4
release    : 43
source     :
    - https://github.com/tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.xz : 4ce24038fd4221e0d13bc1a2de7a4db56e90b92b3bf75321f6c14be73f65de4b
homepage   : https://tukaani.org/xz/
license    :
    - 0BSD
    - GPL-2.0-or-later
component  : system.base
summary    : xz (Data compression software)
description: |
    XZ Utils is a free data compression software with high compression ratio. XZ Utils is the successor to LZMA.
optimize   :
    - lto
emul32     : true
setup      : |
    export CFLAGS="${CFLAGS} -D_FILE_OFFSET_BITS=64"
    %reconfigure --disable-rpath --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING COPYING.*
profile    : |
    %make check
check      : |
    %make check
patterns   :
    - docs :
        - /usr/share/doc
