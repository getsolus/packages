# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xournalpp
version    : 1.3.8
release    : 38
source     :
    - git|https://github.com/xournalpp/xournalpp.git : v1.3.8
homepage   : https://xournalpp.github.io/
license    :
    - GPL-2.0-or-later
    - GPL-3.0-or-later # icons
    - ISC # icons
    - CC-BY-SA-4.0 # icons
    - CC0-1.0 # metadata
component  : office.viewers
summary    : Xournal++ is a handwriting notetaking software with PDF annotation support
description: |
    Xournal++ is a hand note taking software written in C++ with the target of flexibility, functionality and speed. Stroke recognizer and other parts are based on Xournal.
networking : true # cpptrace subproject
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(gtksourceview-4)
    - pkgconfig(libqpdf)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libzip)
    - pkgconfig(lua-5.4)
    - pkgconfig(poppler-glib)
    - pkgconfig(portaudiocpp)
    - pkgconfig(sndfile)
    - help2man
setup      : |
    %cmake_ninja
build      : |
    %ninja_build translations
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
