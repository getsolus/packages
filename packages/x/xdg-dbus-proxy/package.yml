# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xdg-dbus-proxy
version    : 0.1.8
release    : 8
source     :
    - https://github.com/flatpak/xdg-dbus-proxy/releases/download/0.1.8/xdg-dbus-proxy-0.1.8.tar.xz : b6630bd24f8161b0e2546d2acbb014a3b3249f5c0d75f2a863ade898b9034d3d
license    : LGPL-2.1-or-later
component  : security
homepage   : https://github.com/flatpak/xdg-dbus-proxy
summary    : Filtering proxy for D-Bus connections.
description: |
    xdg-dbus-proxy is a filtering proxy for D-Bus connections. It was originally part of the flatpak project, but it has been broken out as a standalone module to facilitate using it in other contexts.
builddeps  :
    - docbook-xml
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
check      : |
    %ninja_check
