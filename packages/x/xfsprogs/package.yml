# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xfsprogs
version    : 7.3.0
release    : 39
source     :
    - https://mirrors.edge.kernel.org/pub/linux/utils/fs/xfs/xfsprogs/xfsprogs-7.3.0.tar.xz : 310c11e9e1d336064921cc123de5c84a331d5abe3c3b82aeadb89a191d34b449
homepage   : https://xfs.wiki.kernel.org/
license    :
    - GPL-2.0-only
    - LGPL-2.1-only
component  : system.utils
summary    : XFS User Tools
description: |
    XFS combines advanced journaling technology with full 64-bit addressing and scalable structures and algorithms. This combination delivers the most scalable high-performance filesystem ever conceived.
builddeps  :
    - pkgconfig(inih)
    - pkgconfig(libedit)
    - pkgconfig(liburcu)
    - libunistring-devel
setup      : |
    %configure \
        --disable-static \
        --enable-editline=yes \
        --libexecdir=%libdir% \
        --with-crond=no

    # Prevent rpath from ending up in the binaries
    sed -i 's|^hardcode_libdir_flag_spec=.*|hardcode_libdir_flag_spec=""|g' libtool
    sed -i 's|^runpath_var=LD_RUN_PATH|runpath_var=DIE_RPATH_DIE|g' libtool
build      : |
    %make
install    : |
    make DESTDIR="${installdir}" install install-dev
    %install_license LICENSES/*

    # Fix permission issue caused by not using fakeroot during the build
    chown root:root --recursive ${installdir}/

    # Stateless
    %install_file ${pkgfiles}/xfsprogs.tmpfiles ${installdir}/usr/lib/tmpfiles.d/xfsprogs.conf
    rmdir -v ${installdir}/var/lib/xfsprogs \
             ${installdir}/var/lib \
             ${installdir}/var
