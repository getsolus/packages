# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xfce4-indicator-plugin
version    : 2.5.0
release    : 1
source     :
    - https://archive.xfce.org/src/panel-plugins/xfce4-indicator-plugin/2.5/xfce4-indicator-plugin-2.5.0.tar.xz : e1a29a2c4837f53dd4825c51f0bd81da42cf36e6eec85d266d04c3d49511b451
homepage   : https://docs.xfce.org/panel-plugins/xfce4-indicator-plugin/start
license    : GPL-2.0-or-later
component  : desktop.xfce
summary    : Indicator plugin for the Xfce panel
description: |
    The Indicator Plugin displays application indicators in the Xfce panel.
builddeps  :
    - pkgconfig(ayatana-indicator3-0.4)
    - pkgconfig(glib-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libayatana-ido3-0.4)
    - pkgconfig(libxfce4panel-2.0)
    - pkgconfig(libxfce4ui-2)
    - pkgconfig(libxfce4util-1.0)
    - pkgconfig(libxfconf-0)
    - gettext
setup      : |
    %meson_configure \
        -Dlibayatana-ido=enabled \
        -Dindicator-application=enabled
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING
