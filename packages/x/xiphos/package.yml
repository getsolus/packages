# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xiphos
version    : 4.5.0
release    : 40
source     :
    - https://github.com/crosswire/xiphos/releases/download/4.5.0/xiphos-4.5.0.tar.xz : bad517f01740cbdb37461a8034bcb7218c8a2e634240985574a953f46b56a490
homepage   : https://xiphos.org/
license    : GPL-2.0-only
component  : office
