description: |
    Xiphos is a Bible study application
builddeps  :
    - pkgconfig(appstream)
    - pkgconfig(gconf-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libglade-2.0)
    - pkgconfig(libgsf-1)
    - pkgconfig(libsoup-3.0)
    - pkgconfig(minizip)
    - pkgconfig(rarian)
    - pkgconfig(speech-dispatcher)
    - pkgconfig(sword)
    - pkgconfig(uuid)
    - pkgconfig(webkit2gtk-4.1)
    - pkgconfig(yelp-xsl)
    - biblesync-devel
    - desktop-file-utils
    - intltool
    - itstool
    - rarian
    - yelp-tools
setup      : |
    %cmake_ninja
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license COPYING
