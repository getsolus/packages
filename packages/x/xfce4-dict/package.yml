# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : xfce4-dict
version    : 0.8.10
release    : 1
source     :
    - https://archive.xfce.org/src/apps/xfce4-dict/0.8/xfce4-dict-0.8.10.tar.xz : 0a0be97fd056a528a1f37c8db05f5385ffc3dc9945b424cdafa05caf5f054b67
homepage   : https://docs.xfce.org/apps/xfce4-dict/start
license    : GPL-2.0-or-later
component  : desktop.xfce
summary    : Dictionary client and panel plugin for Xfce
description: |
    Xfce4 Dictionary is a lightweight dictionary client that can look up words and phrases using DICT servers, online dictionaries, and spell checking programs. It includes a standalone application and a plugin for the Xfce panel.
builddeps  :
    - pkgconfig(glib-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libxfce4panel-2.0)
    - pkgconfig(libxfce4ui-2)
    - pkgconfig(libxfce4util-1.0)
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING
    %install_file ${pkgfiles}/org.xfce.Dictionary.metainfo.xml ${installdir}/usr/share/metainfo/org.xfce.Dictionary.metainfo.xml
