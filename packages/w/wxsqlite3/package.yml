# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : wxsqlite3
version    : 5.0.2
release    : 11
source     :
    - https://github.com/utelle/wxsqlite3/archive/refs/tags/v5.0.2.tar.gz : 1297253c3ac732971f24596609b8fffdfd0ee783fc15daccf9fe1efa60114706
homepage   : https://utelle.github.io/wxsqlite3
license    : LGPL-3.0-or-later WITH WxWindows-exception-3.1
component  : programming
summary    : wxSQLite3 is a C++ wrapper around the public domain SQLite 3.x database
description: |
    wxSQLite3 is a C++ wrapper around the public domain SQLite 3.x database.
builddeps  :
    - pkgconfig(sqlite3)
    - wxwidgets-devel
setup      : |
    %reconfigure --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license GPL-3.0.txt LGPL-3.0.txt
