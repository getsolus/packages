# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : waydroid
version    : 1.6.3
release    : 4
source     :
    - https://github.com/waydroid/waydroid/archive/refs/tags/1.6.3.tar.gz : f138a287eb8b0be7be7f7060971446490138bc2c8315665c8aa9c2c85576d8a5
homepage   : https://waydro.id/
license    : GPL-3.0-or-later
component  : virt
summary    : Run Android apps on GNU/Linux
description: |
    Container-based approach to boot a full Android system on GNU/Linux
rundeps    :
    - dnsmasq
    - lxc
    - nftables
    - python-gbinder
    - python3-dbus
setup      : |
    %patch -p1 -i $pkgfiles/0001-Service-tweaks.patch
install    : |
    %make_install \
                 USE_SYSTEMD=1 \
                 USE_DBUS_ACTIVATION=1 \
                 USE_NFTABLES=1 \
                 APPS_MENU_DIR=/usr/share/xdg/menus/applications-merged

    %install_license LICENSE
    
    %install_file $pkgfiles/dev-binderfs.mount $installdir/usr/lib/systemd/system/dev-binderfs.mount
    %install_file $pkgfiles/waydroid-pre.service $installdir/usr/lib/systemd/system/waydroid-pre.service

    # No need to pre-enable the service, it's DBUS-activated
