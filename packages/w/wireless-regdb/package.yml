# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : wireless-regdb
version    : 2026.09.03
release    : 13
source     :
    - https://mirrors.edge.kernel.org/pub/software/network/wireless-regdb/wireless-regdb-2026.09.03.tar.gz : 5803f25172c8668434faf95844e1ef98315adeece49b444562712e2efb1faf62
homepage   : https://wireless.wiki.kernel.org/en/developers/regulatory/wireless-regdb
license    : ISC
component  : system.base
summary    : This package contains the wireless regulatory database used by all cfg80211 based Linux wireless drivers.
description: |
    This package contains the wireless regulatory database used by all cfg80211 based Linux wireless drivers.
install    : |
    %make_install FIRMWARE_PATH=/usr/lib64/firmware

    # Usr-merge
    %install_dir ${installdir}/lib64
    pushd ${installdir}/usr
    file_list=()
    while IFS=  read -r -d $'\0'; do
        file_list+=("$REPLY")
    done < <(find lib64 -type f -print0)
    for file in "${file_list[@]}"; do
        parent=$(dirname "$file")
        %install_dir "${installdir}/$parent"
        ln -srv "${installdir}/usr/$file" "${installdir}/$file"
    done
    popd

    # License
    %install_license LICENSE
