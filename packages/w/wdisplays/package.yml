# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : wdisplays
version    : 1.3.0
release    : 2
source     :
    - https://github.com/artizirk/wdisplays/archive/refs/tags/1.3.0.tar.gz : 6cf3f68d260fbd8cc1ea502e11ec94a6acf525ed95fa825e4b379be0bab9b61b
homepage   : https://github.com/artizirk/wdisplays
license    : GPL-3.0-or-later
component  : desktop
summary    : GUI display configurator for wlroots compositors
description: |
    wdisplays is a graphical application for configuring displays in Wayland compositors. It borrows some code from kanshi. It should work in any compositor that implements the wlr-output-management-unstable-v1 protocol, including sway.
builddeps  :
    - pkgconfig(epoxy)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSES/*

    # Install AppStream metainfo
    %install_file ${pkgfiles}/network.cycles.wdisplays.metainfo.xml -t ${installdir}/usr/share/metainfo
