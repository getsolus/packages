# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : wcslib
version    : '8.10'
release    : 3
source     :
    - https://www.atnf.csiro.au/computing/software/wcs/wcslib-releases/wcslib-8.10.tar.bz2 : b394d3306da9a52410f056136911496e599b5c48f1cff2f221563697077bbd8d
homepage   : https://www.atnf.csiro.au/computing/software/wcs/WCS/
license    : LGPL-3.0-or-later
component  : office.scientific
summary    : An implementation of the FITS World Coordinate System standard
description: |
    WCSLIB is a library that implements the "World Coordinate System" (WCS) convention in FITS (Flexible Image Transport System)
setup      : |
    %configure
build      : |
    %make
install    : |
    %make_install
    # Remove static libs
    rm ${installdir}/usr/lib64/libwcs{,-8.10}.a
patterns    :
    - docs  : /usr/share/doc/*
