# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : wayland-pipewire-idle-inhibit
version    : 0.7.1
release    : 1
source     :
    - https://github.com/rafaelrc7/wayland-pipewire-idle-inhibit/archive/refs/tags/v0.7.1.tar.gz : 6644562aa9ac0210ae7203453f7d3d38fe9d74059e0864d60e13b45033dc2652
homepage   : https://github.com/rafaelrc7/wayland-pipewire-idle-inhibit
license    : GPL-3.0-only
component  : desktop.wayland
summary    : Inhibit Wayland idle state when audio is playing via PipeWire
description: |
    Small utility that monitors PipeWire for active audio playback and automatically inhibits Wayland idle management systems to prevent screen dimming or lock.
networking : true
builddeps  :
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(wayland-client)
    - rust
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install
    %install_file -t ${installdir}/%libdir%/systemd/user ${package}.service
    %install_license LICENCE
