# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : watchexec
version    : 2.8.0
release    : 6
source     :
    - https://github.com/watchexec/watchexec/archive/refs/tags/v2.8.0.tar.gz : 861496cd1e7d8546f770551893077e9b898fef1a6623d5e2207cf28c932e7738
homepage   : https://watchexec.github.io
license    : Apache-2.0
component  : system.utils
summary    : Executes commands in response to file modifications.
description: |
    watchexec is a simple, standalone tool that watches a path and runs a command whenever it detects modifications.
networking : true
builddeps  :
    - rust
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install
    %install_file ${workdir}/doc/watchexec.1 ${installdir}/usr/share/man/man1/watchexec.1
    %install_file ${workdir}/completions/bash ${installdir}/usr/share/bash-completion/completions/watchexec
    %install_file ${workdir}/completions/fish ${installdir}/usr/share/fish/vendor_completions.d/watchexec.fish
    %install_file ${workdir}/completions/zsh ${installdir}/usr/share/zsh/site-functions/_watchexec
    %install_license LICENSE
