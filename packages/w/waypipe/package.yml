# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : waypipe
version    : 0.11.2
release    : 5
source     :
    - https://gitlab.freedesktop.org/mstoeckl/waypipe/-/archive/v0.11.2/waypipe-v0.11.2.tar.gz : 70914b590b2b9a74a16fe9936bb7dba6b3eb59466ed17aaba2613c9fa09b8dad
homepage   : https://gitlab.freedesktop.org/mstoeckl/waypipe
license    : MIT
component  : network.util
summary    : A proxy for Wayland protocol applications; like ssh -X
description: |
    A proxy for Wayland protocol applications; like ssh -X
networking : true
builddeps  :
    - pkgconfig(gbm)
    - pkgconfig(libavfilter)
    - pkgconfig(libdrm)
    - pkgconfig(liblz4)
    - pkgconfig(libva-wayland)
    - pkgconfig(scdoc)
    - pkgconfig(shaderc)
    - pkgconfig(wayland-protocols)
    - rust
    - rust-bindgen
    - vulkan-headers
clang      : true
setup      : |
    %cargo_fetch
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE*
