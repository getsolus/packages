# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : waypipe
version    : 0.11.3
release    : 6
source     :
    - https://gitlab.freedesktop.org/mstoeckl/waypipe/-/archive/v0.11.3/waypipe-v0.11.3.tar.gz : 92482a459eb86bef2dae025ea2eb37f5560aea3d3744a097bed9d284b863a5a6
homepage   : https://gitlab.freedesktop.org/mstoeckl/waypipe
license    : MIT
component  : network.util
summary    : A proxy for Wayland protocol applications; like ssh -X
description: |
    A proxy for Wayland protocol applications; like ssh -X
networking : true
builddeps  :
    - pkgconfig(gbm)
    - pkgconfig(libavfilter)
    - pkgconfig(libdrm)
    - pkgconfig(liblz4)
    - pkgconfig(libva-wayland)
    - pkgconfig(scdoc)
    - pkgconfig(shaderc)
    - pkgconfig(wayland-protocols)
    - rust
    - rust-bindgen
    - vulkan-headers
clang      : true
setup      : |
    %cargo_fetch
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE*
