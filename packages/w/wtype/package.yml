# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : wtype
version    : '0.5'
release    : 2
source     :
    - https://github.com/atx/wtype/archive/refs/tags/v0.5.tar.gz : 684308ac8b47c510dddf4abac3aef86b4f7b8c0e165389a40608679a7a5b77ed
homepage   : https://github.com/atx/wtype
license    : MIT
component  : system.utils
summary    : xdotool type for wayland
description: |
    wtype is a Wayland tool that allows you to simulate keyboard input like xdotool type for X11.
    This is accomplished via the virtual-keyboard Wayland protocol.
builddeps  :
    - pkgconfig(wayland-client)
    - pkgconfig(xkbcommon)
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
