# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : wildmidi
version    : 0.5.0
release    : 6
source     :
    - https://github.com/Mindwerks/wildmidi/releases/download/wildmidi-0.5.0/wildmidi-0.5.0.tar.gz : 84a0d75fa2ea818995a57a7ccbfdda8c1042a39f388d5561b767a2c275b1b1eb
homepage   : https://github.com/Mindwerks/wildmidi/
license    :
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
component  : programming.library
summary    : WildMIDI is a simple software midi player which has a core softsynth library that can be use with other applications
description: |
    WildMIDI is a simple software midi player which has a core softsynth library that can be use with other applications
builddeps  :
    - pkgconfig(alsa)
rundeps    :
    - freepats
setup      : |
    %cmake_ninja .
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license docs/license/*

    #Install configuraton files for wildimidi (take from freepats) so it poduces sound
    %install_file ${pkgfiles}/wildmidi.cfg ${installdir}/etc/wildmidi/wildmidi.cfg
