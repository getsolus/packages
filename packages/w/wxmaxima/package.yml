# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : wxmaxima
version    : 26.10.0
release    : 42
source     :
    - https://github.com/wxMaxima-developers/wxmaxima/archive/refs/tags/Version-26.10.0.tar.gz : 6098d3b54b531ed59cd2aff568f70039b41f6e7f89cbb84d1da2e5b796a7bb71
homepage   : https://wxmaxima-developers.github.io/wxmaxima/
