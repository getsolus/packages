# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : wabt
version    : 1.0.41
release    : 6
source     :
    - https://github.com/WebAssembly/wabt/archive/refs/tags/1.0.41.tar.gz : 5dcaa5d3ea23827ee62634289cc46cd9baa4847b3831050b9bdf23971c689eb7
    - git|https://github.com/WebAssembly/wasm-c-api : b6dd1fb658a282c64b029867845bc50ae59e1497
homepage   : https://webassembly.org/
license    : Apache-2.0
component  : programming.tools
summary    : The WebAssembly Binary Toolkit
description: |
    WABT is a suite of tools for WebAssembly, including an dis/assembler, an interpreter, an objdump and strip utilities, etc.
setup      : |
    %patch -p1 -i $pkgfiles/shared-wasm-rt-impl.patch
    cp -r $sources/wasm-c-api*/* third_party/wasm-c-api
    %cmake_ninja -DBUILD_TESTS=OFF
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
    # Remove static libs
    rm -fv $installdir/usr/lib64/libwabt.a
