# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : wireplumber
version    : 0.5.19
release    : 40
source     :
    - https://gitlab.freedesktop.org/pipewire/wireplumber/-/archive/0.5.19/wireplumber-0.5.19.tar.gz : f9454eae3a5a6ca903c05ead2a7e47d7d3957fb0ffac3ebb11d92842603ae80f
homepage   : https://pipewire.pages.freedesktop.org/wireplumber/
license    : MIT
component  : multimedia.library
summary    : Session / policy manager implementation for PipeWire
description: |
    WirePlumber is a modular session / policy manager for PipeWire and a GObject-based high-level library that wraps PipeWire's API, providing convenience for writing the daemon's modules as well as external tools for managing PipeWire.
builddeps  :
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(lua)
    - doxygen
    - python-lxml
setup      : |
    %meson_configure \
        -Dsystem-lua=true \
        -Delogind=disabled
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSE

    %install_file -t ${installdir}/%libdir%/systemd/user-preset/ ${pkgfiles}/60-wireplumber.preset
