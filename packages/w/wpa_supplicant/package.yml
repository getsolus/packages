# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : wpa_supplicant
version    : '2.12'
release    : 37
source     :
    - https://w1.fi/releases/wpa_supplicant-2.12.tar.gz : 08e23937e16d0155e55cab2b51f51fbe10d80a1aa91c4e15442645059b737ef6
homepage   : https://w1.fi/wpa_supplicant/
license    : BSD-3-Clause
component  : network.base
summary    : WiFi authentication client and server
description: |
    WPA Supplicant is a Wi-Fi Protected Access (WPA) client and IEEE 802.1X supplicant. It implements WPA key negotiation with a WPA Authenticator and Extensible Authentication Protocol (EAP) authentication with an Authentication Server. In addition, it controls the roaming and IEEE 802.11 authentication/association of the wireless LAN driver. This is useful for connecting to a password protected wireless access point.
builddeps  :
    - pkgconfig(libnl-3.0)
    - pkgconfig(libpcsclite)
    - pkgconfig(openssl)
setup      : |
    %apply_patches

    %install_file ${pkgfiles}/config wpa_supplicant/.config
build      : |
    pushd wpa_supplicant
    %make BINDIR=/usr/sbin LIBDIR=/usr/lib PREFIX=/usr
    %make BINDIR=/usr/sbin LIBDIR=/usr/lib PREFIX=/usr eapol_test
install    : |
    %install_license COPYING

    pushd wpa_supplicant
    %make_install BINDIR=/usr/sbin LIBDIR=/usr/lib PREFIX=/usr
    %install_exe eapol_test -t ${installdir}/usr/sbin

    %install_dir ${installdir}/usr/share/dbus-1/system-services
    %install_file dbus/*.service ${installdir}/usr/share/dbus-1/system-services/.
    %install_file dbus/dbus-wpa_supplicant.conf ${installdir}/usr/share/dbus-1/system.d/dbus-wpa_supplicant.conf

    %install_file systemd/wpa_supplicant.service -t ${installdir}/usr/lib/systemd/system/

    # Tmpfiles
    %install_file ${pkgfiles}/${package}.tmpfiles ${installdir}/%libdir%/tmpfiles.d/${package}.conf

    # Man files
    %install_file doc/docbook/*.5 -t ${installdir}/usr/share/man/man5
    %install_file doc/docbook/*.8 -t ${installdir}/usr/share/man/man8
    rm -v ${installdir}/usr/share/man/man8/wpa_{priv,gui}.8
