# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : warpinator
version    : 2.0.6
release    : 9
source     :
    - https://github.com/linuxmint/warpinator/archive/refs/tags/2.0.6.tar.gz : 1cce1829c5fbdbd0ef6474d672a31f8c89d25b07c4d3c182fca36740c0276c16
homepage   : https://github.com/linuxmint/warpinator/
license    : GPL-3.0-or-later
component  : network.util
summary    : Send and receive files across a local network
description: |
    Warpinator allows you to easily connect multiple computers on a local area network and share files quickly and securely.
builddeps  :
    - pkgconfig(polkit-gobject-1)
rundeps    :
    - python-grpcio
    - python-netifaces
    - python-protobuf
    - python-pynacl
    - python-qrcode
    - python-setproctitle
    - python-xapp
    - python-zeroconf
    - xapp
setup      : |
    %meson_configure \
        -Dbundle-zeroconf=false \
        -Dbundle-grpc=false
build      : |
    %ninja_build
install    : |
    %ninja_install
    # Remove autostart file
    rm -fr $installdir/etc/
    %install_license COPYING
