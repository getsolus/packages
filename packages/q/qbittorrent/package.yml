# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qbittorrent
version    : 5.3.0
release    : 115
source     :
    - https://github.com/qbittorrent/qBittorrent/archive/refs/tags/release-5.3.0.tar.gz : dcb5273496117ebf264fc1fc7936de8707374f07dcee0805228ac5adb403a465
homepage   : https://www.qbittorrent.org/
license    : GPL-2.0-or-later
component  : network.download
summary    : qBittorrent project aims to provide a Free Software alternative to µTorrent
description: |
    qBittorrent project aims to provide a Free Software alternative to µTorrent
builddeps  :
    - pkgconfig(Qt6Help)
    - pkgconfig(Qt6Svg)
    - pkgconfig(libtorrent-rasterbar)
    - libboost-devel
    - qt6-base-private-devel
rundeps    :
    - qt6-svg
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING*
