# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qbittorrent
version    : 5.3.1
release    : 117
source     :
    - https://github.com/qbittorrent/qBittorrent/archive/refs/tags/release-5.3.1.tar.gz : 5b97c28f890a86788288cbcdf2b1f587e4804c8383f97e0f7aa8c5f2f4e2af68
homepage   : https://www.qbittorrent.org/
license    : GPL-2.0-or-later
component  : network.download
summary    : qBittorrent project aims to provide a Free Software alternative to µTorrent
description: |
    qBittorrent project aims to provide a Free Software alternative to µTorrent
builddeps  :
    - pkgconfig(Qt6Help)
    - pkgconfig(Qt6Svg)
    - pkgconfig(libtorrent-rasterbar)
    - libboost-devel
    - qt6-base-private-devel
rundeps    :
    - qt6-svg
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_ninja
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license COPYING*
