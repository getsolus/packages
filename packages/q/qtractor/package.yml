# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qtractor
version    : 1.6.3
release    : 53
source     :
    - https://sourceforge.net/projects/qtractor/files/qtractor/1.6.3/qtractor-1.6.3.tar.gz : 529fffa0fb13b7bdff3d309de2b50cd14aef4de1f57aedc4b12b48e815292f6a
homepage   : https://qtractor.org/
license    : GPL-2.0-or-later
component  : multimedia.audio
summary    : Qtractor is an audio/MIDI multi-track sequencer application
description: |
    Qtractor is an audio/MIDI multi-track sequencer application
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6Designer)
    - pkgconfig(Qt6Svg)
    - pkgconfig(alsa)
    - pkgconfig(jack)
    - pkgconfig(liblo)
    - pkgconfig(lilv-0)
    - pkgconfig(mad)
    - pkgconfig(rubberband)
    - pkgconfig(samplerate)
    - pkgconfig(sndfile)
    - pkgconfig(suil-0)
    - pkgconfig(vorbis)
    - ladspa-devel
setup      : |
    %cmake_ninja \
        -D CONFIG_QT6=ON \
        -D CONFIG_LV2_UI_GTK2=OFF \
        -D CONFIG_LV2_UI_GTKMM2=OFF \
        -W no-dev
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE
