# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qwt
version    : 6.3.0
release    : 6
source     :
    - https://downloads.sourceforge.net/qwt/qwt-6.3.0.tar.bz2 : dcb085896c28aaec5518cbc08c0ee2b4e60ada7ac929d82639f6189851a6129a
homepage   : https://qwt.sourceforge.io/
license    : LGPL-2.1-or-later
component  :
    - qt5 : programming.library
    - qt5-devel : programming.devel
    - programming.library
summary    :
    - qt5 : Qwt is an extension to the libraries of the Qt project - Qt5 version
    - qt5-devel : Development files for qwt-qt5
    - Qwt is an extension to the libraries of the Qt Project - Qt6 version
description: |
    The Qwt library contains widgets and components which are primarily useful for technical and scientifical purposes.
clang      : true
builddeps  :
    - pkgconfig(Qt5Designer)
    - pkgconfig(Qt5Svg)
    - pkgconfig(Qt6Designer)
    - pkgconfig(Qt6Svg)
setup      : |
    %patch -p1 -i ${pkgfiles}/qwt-qt_install_paths.patch
    %patch -p1 -i ${pkgfiles}/qwt-libsuffix.patch
    %patch -p1 -i ${pkgfiles}/qwt-no_rpath.patch
    %patch -p1 -i ${pkgfiles}/qwt-pkgconfig.patch

    for qt_ver in qt5 qt6; do
        mkdir "${qt_ver}"
        pushd "${qt_ver}"

        if [[ "${qt_ver}" == "qt5" ]]; then
            %qmake QWT_CONFIG+=QwtPkgConfig ..
        elif [[ "${qt_ver}" == "qt6" ]]; then
            qmake6 \
                QMAKE_CFLAGS_RELEASE="${CFLAGS}" \
                QMAKE_CXXFLAGS_RELEASE="${CXXFLAGS}" \
                QMAKE_LFLAGS="${LDFLAGS}" \
                QWT_CONFIG+=QwtPkgConfig \
                ..
        fi
        popd
    done
build      : |
    for qt_ver in qt5 qt6; do
        %make -C "${qt_ver}"
    done
install    : |
    for qt_ver in qt5 qt6; do
        %make_install INSTALL_ROOT=${installdir} -C "${qt_ver}"
    done

    %install_license COPYING
    %install_file -t ${installdir}/usr/share/licenses/${package}-qt5 COPYING

    # Move docs to proper dirs
    %install_dir ${installdir}/usr/share/doc/${package} ${installdir}/usr/share/doc/${package}-qt5
    mv ${installdir}/usr/share/doc/qt6/html/html ${installdir}/usr/share/doc/${package}/html
    mv ${installdir}/usr/share/qt5/doc/html/html ${installdir}/usr/share/doc/${package}-qt5/html
    rm -rfv ${installdir}/usr/share/qt5 \
            ${installdir}/usr/share/doc/qt6
patterns   :
    - qt5 :
        - /usr/lib64/libqwt-qt5.so.*
        - /usr/lib64/qt5/mkspecs
        - /usr/share/doc/qwt-qt5
        - /usr/share/licenses/qwt-qt5
    - qt5-devel :
        - /usr/include/qwt
        - /usr/lib64/libqwt-qt5.so
        - /usr/lib64/pkgconfig/Qt5Qwt6.pc
        - /usr/lib64/qt5/plugins
