# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qtpass
version    : 1.8.0
release    : 20
source     :
    - https://github.com/IJHack/QtPass/archive/refs/tags/v1.8.0.tar.gz : 0907e2a7d362dac0c45989aee88afc811eb3777e4007f4a0fdcbd7292b9a98c1
homepage   : https://qtpass.org/
license    :
    - CC0-1.0
    - CC-BY-4.0
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - MIT
component  : security
summary    : QtPass is a multi-platform GUI for pass, the standard unix password manager.
description: |
    QtPass is a multi-platform GUI for pass, the standard unix password manager.
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6Help)
    - pkgconfig(Qt6Svg)
    - pkgconfig(Qt6UiTools)
rundeps    :
    - password-store
setup      : |
    qmake6 -spec linux-g++ QMAKE_CC="$CC" QMAKE_CXX="$CXX" QMAKE_LINK="$CXX" PREFIX=$installdir/usr
build      : |
    /usr/lib64/qt6/bin/lrelease localization/localization_*
    %make
install    : |
    %make_install
    %install_file qtpass.desktop $installdir/usr/share/applications/qtpass.desktop
    %install_file qtpass.appdata.xml $installdir/usr/share/metainfo/qtpass.appdata.xml
    %install_file artwork/icon.svg $installdir/usr/share/icons/hicolor/scalable/apps/qtpass-icon.svg
    %install_license LICENSES/*
