# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qrca
version    : 26.08.2
release    : 6
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/qrca-26.08.2.tar.xz : 517b067fa2781b3ac4375e828329706c8277071e59f70796027f15de684e3af3
homepage   : https://apps.kde.org/qrca/
license    :
    - BSD-2-Clause
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
    - GPL-3.0-or-later
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
component  : desktop.kde
summary    : qrca is an application for Plasma Desktop that lets you scan many barcode formats and create your own QR code images.
description: |
    qrca is an application for Plasma Desktop that lets you scan many barcode formats and create your own QR code images.
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6Multimedia)
    - pkgconfig(Qt6Svg)
    - extra-cmake-modules
    - kf6-kconfig-devel
    - kf6-kcontacts-devel
    - kf6-kcoreaddons-devel
    - kf6-kcrash-devel
    - kf6-kdbusaddons-devel
    - kf6-ki18n-devel
    - kf6-kio-devel
    - kf6-kirigami-devel
    - kf6-knotifications-devel
    - kf6-networkmanager-qt-devel
    - kf6-prison-devel
    - kirigami-addons-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
