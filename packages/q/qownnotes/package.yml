# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qownnotes
version    : 26.8.3
release    : 296
source     :
    - https://github.com/pbek/QOwnNotes/releases/download/v26.8.3/qownnotes-26.8.3.tar.xz : 1e230f08c922cd59b1d71ff8d2219a54f83c57646bcd89ae0550b27cdffa4ebe
homepage   : https://www.qownnotes.org/
license    : GPL-2.0-or-later
component  : office.notes
summary    : QOwnNotes is a plain-text file notepad and todo-list manager with markdown support and ownCloud integration.
description: |
    QOwnNotes is a plain-text file notepad and todo-list manager with markdown support and ownCloud integration.
clang      : true
builddeps  :
    - pkgconfig(Qt6Qml)
    - pkgconfig(Qt6Svg)
    - pkgconfig(Qt6WebSockets)
    - pkgconfig(botan-3)
    - pkgconfig(x11)
rundeps    :
    - qt6-svg
setup      : |
    # botan-3 requires C++20; the Qt6 branch of QOwnNotes.pro hardcodes c++17
    sed -i 's/CONFIG += c++17/CONFIG += c++20/' QOwnNotes.pro
    echo "#define RELEASE \"Solus\"" > release.h
build      : |
    qmake6 USE_SYSTEM_BOTAN=1
    %make
install    : |
    %install_bin QOwnNotes
    # Keep this as QOwnNotes. Breaks Budgie otherwise.
    %install_file PBE.QOwnNotes.desktop ${installdir}/usr/share/applications/org.qownnotes.QOwnNotes.desktop
    for size in {16x16,24x24,32x32,48x48,64x64,96x96,128x128,256x256,512x512}; do
        %install_file images/icons/$size/apps/QOwnNotes.png ${installdir}/usr/share/icons/hicolor/$size/apps/QOwnNotes.png
    done
    %install_file images/icons/scalable/apps/QOwnNotes.svg ${installdir}/usr/share/icons/hicolor/scalable/apps/QOwnNotes.svg
    %install_file ${pkgfiles}/qownnotes.appdata.xml -t ${installdir}/usr/share/metainfo/
    %install_file languages/*.qm -t ${installdir}/usr/share/qt6/translations
