# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qelectrotech
version    : '0.100'
release    : 8
source     :
    - https://github.com/qelectrotech/qelectrotech-source-mirror/releases/download/0.100/qelectrotech-0.100.tar.gz : 
        2a658df42fa9f8be95bf6dafae2a53ab47962af8afb7043f78a018b7ca6b7310
    - https://raw.githubusercontent.com/qelectrotech/qelectrotech-source-mirror/refs/heads/master/misc/qelectrotech.appdata.xml : c8d6600ff8c8de146f92231c6f17b011823b8f675eea622def811124e7b8a29f
homepage   : https://qelectrotech.org/
license    : GPL-2.0-or-later
component  : office.scientific
summary    : QElectroTech is a Qt5 application to design electric diagrams
description: |
    QElectrotech uses XML files for elements and diagrams, and includes both a diagram editor, a element editor, and an titleblock editor.
clang      : true
builddeps  :
    - pkgconfig(Qt5Svg)
    - pkgconfig(sqlite3)
    - kcoreaddons-devel
    - kwidgetsaddons-devel
setup      : |
    patch -p1 -i $pkgfiles/0001-Fix-install-paths.patch
    cp $sources/qelectrotech.appdata.xml $workdir/misc/qelectrotech.appdata.xml
build      : |
    %qmake
install    : |
    %make_install INSTALL_ROOT=%installroot%
    rm -rf $installdir/usr/share/doc
    %install_license LICENSE

    # Match appstream metainfo desktop-id
    mv $installdir/usr/share/applications/{org.qelectrotech.qelectrotech.desktop,org.qelectrotech.QElectroTech.desktop}
