# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qpwgraph
version    : 1.0.4
release    : 16
source     :
    - https://gitlab.freedesktop.org/rncbc/qpwgraph/-/archive/v1.0.4/qpwgraph-v1.0.4.tar.gz : ec5a9232e65493aee08f067c301009e3a1e1627a80b26a25bf86673f2ea5e2e5
homepage   : https://gitlab.freedesktop.org/rncbc/qpwgraph
license    : GPL-2.0-or-later
component  : multimedia.audio
summary    : PipeWire Graph Qt GUI Interface
description: |
    PipeWire Graph Qt GUI Interface
builddeps  :
    - pkgconfig(Qt6Svg)
    - pkgconfig(alsa)
    - pkgconfig(libpipewire-0.3)
rundeps    :
    - qt6-svg
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_ninja -DCONFIG_WAYLAND=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE.md
