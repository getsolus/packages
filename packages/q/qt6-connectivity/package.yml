# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qt6-connectivity
version    : 6.12.1
release    : 25
source     :
    - https://download.qt.io/official_releases/qt/6.12/6.12.1/submodules/qtconnectivity-everywhere-src-6.12.1.tar.xz : e0319d2f365bc128b45b051ac9de54240279d26188256bb9b1e89d3a99f3be62
license    :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
component  :
    - desktop.qt
    - demos : programming.library
homepage   : https://www.qt.io
summary    : Qt6 Connectivity components
description: |
    Qt connectivity provides access to Bluetooth hardware.
builddeps  :
    - pkgconfig(Qt6Qml)
    - pkgconfig(bluez)
    - pkgconfig(libpcsclite)
    - qt6-base-private-devel
rundeps    :
    - devel :
        - bluez-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_ninja \
                 -DCMAKE_MESSAGE_LOG_LEVEL=STATUS
build      : |
    %ninja_build
install    : |
    %ninja_install
patterns   :
    - demos :
        - /usr/lib64/qt6/examples
