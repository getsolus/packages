# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qt6-lottie
version    : 6.12.1
release    : 24
source     :
    - https://download.qt.io/official_releases/qt/6.12/6.12.1/submodules/qtlottie-everywhere-src-6.12.1.tar.xz : 90e63b85d853be7a46c05cd46bef6ed21e452aa0de77f509fe372cb165a16d34
license    :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
component  :
    - desktop.qt
    - examples : programming
homepage   : https://www.qt.io
summary    : Qt6 Lottie Animation module
description: |
    Qt Lottie Animation provides a QML API for rendering graphics and animations that are exported in JSON format.
builddeps  :
    - pkgconfig(Qt6Qml)
    - pkgconfig(Qt6Svg)
    - qt6-base-private-devel
rundeps    :
    - devel :
        - qt6-declarative-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_ninja \
                 -DCMAKE_MESSAGE_LOG_LEVEL=STATUS
build      : |
    %ninja_build
install    : |
    %ninja_install
patterns   :
    - examples :
        - /usr/lib64/qt6/examples
