# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qt6-lottie
version    : 6.11.3
release    : 23
source     :
    - https://download.qt.io/official_releases/qt/6.11/6.11.3/submodules/qtlottie-everywhere-src-6.11.3.tar.xz : 5f9e59c977e0ee5acc5188a0edc824ecd744a3471affdaa2083a0949a5555b9c
license    :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
component  :
    - desktop.qt
    - examples : programming
homepage   : https://www.qt.io
summary    : Qt6 Lottie Animation module
description: |
    Qt Lottie Animation provides a QML API for rendering graphics and animations that are exported in JSON format.
builddeps  :
    - pkgconfig(Qt6Qml)
    - pkgconfig(Qt6Svg)
    - qt6-base-private-devel
rundeps    :
    - devel :
        - qt6-declarative-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_ninja \
                 -DCMAKE_MESSAGE_LOG_LEVEL=STATUS
build      : |
    %ninja_build
install    : |
    %ninja_install
patterns   :
    - examples :
        - /usr/lib64/qt6/examples
