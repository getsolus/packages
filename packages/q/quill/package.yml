# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : quill
version    : 13.0.0
release    : 1
source     :
    - https://github.com/odygrd/quill/archive/refs/tags/v13.0.0.tar.gz : 88b4a1542125577a4d51cf444c51e34d63618c422ba6a4fa9bd23894b49d696b
homepage   : https://quillcpp.readthedocs.io
license    : MIT
component  : programming.library
summary    : Ultra-low-latency asynchronous C++17 logging and metrics library for performance-critical applications
description: |
    Quill is an asynchronous logging and metrics library for C++17 and later. It keeps formatting and I/O away from latency-sensitive application threads by encoding log arguments on the frontend and processing them on a dedicated backend worker.
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSE
patterns:
    - /* # header only library

