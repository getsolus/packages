# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qgis
version    : 4.2.1
release    : 134
source     :
    - https://github.com/qgis/QGIS/archive/refs/tags/final-4_2_1.tar.gz : 47c66520e0027b6b5a2063bc924eae92e8149a8ea9f177cd674065e9401ac498
homepage   : https://qgis.org/
license    : GPL-2.0-or-later
component  : office.scientific
summary    : A Free and Open Source Geographic Information System
description: |
    QGIS is a professional GIS application that is built on top of and proud to be itself Free and Open Source Software (FOSS). Create, edit, visualise, analyse and publish geospatial information on Windows, Mac, Linux, BSD (Android coming soon).
clang      : true
builddeps  :
    - pkgconfig(Qt63DExtras)
    - pkgconfig(Qt6Core5Compat)
    - pkgconfig(Qt6Multimedia)
    - pkgconfig(Qt6Positioning)
    - pkgconfig(Qt6SerialPort)
    - pkgconfig(Qt6Svg)
    - pkgconfig(Qt6UiTools)
    - pkgconfig(Qt6WebEngineCore)
    - pkgconfig(draco)
    - pkgconfig(exiv2)
    - pkgconfig(geos)
    - pkgconfig(gsl)
    - pkgconfig(harfbuzz)
    - pkgconfig(hdf5)
    - pkgconfig(libpng)
    - pkgconfig(libpq)
    - pkgconfig(libssh)
    - pkgconfig(libzip)
    - pkgconfig(libzstd)
    - pkgconfig(minizip)
    - pkgconfig(netcdf)
    - pkgconfig(ocl-icd)
    - pkgconfig(pdal)
    - pkgconfig(proj)
    - pkgconfig(protobuf)
    - pkgconfig(python3)
    - pkgconfig(rttopo)
    - pkgconfig(spatialite)
    - laz-perf-devel
    #- libspatialindex-devel
    - opencl-clhpp
    - pyqt-builder
    - python-qscintilla-qt6
    - python-setuptools
    - python-sip
    - python-six
    - qca-qt6-devel
    - qscintilla-devel
    - qt6-base-private-devel
    - qtkeychain-qt6-devel
    - qwt-devel
rundeps    :
    - geos
    - psycopg2
    - pygments
    - python-future
    - python-jinja
    - python-owslib
    - python-qscintilla-qt6
    - pyyaml
setup      : |
    %cmake_ninja \
        -DENABLE_TESTS=FALSE \
        -DQGIS_MANUAL_SUBDIR=share/man \
        -DWITH_CUSTOM_WIDGETS=TRUE \
        -DWITH_PDAL=TRUE \
        -DWITH_QTWEBKIT=FALSE \
        -DWITH_3D=TRUE \
        -DWITH_QWTPOLAR=TRUE \
        -DQWTPOLAR_LIBRARY=/usr/lib/libqwt-qt6.so \
        -DQWTPOLAR_INCLUDE_DIR=/usr/include/qt6/qwt \
        -DWITH_INTERNAL_QWTPOLAR=FALSE \
        -DWITH_INTERNAL_SPATIALINDEX=TRUE # Too new for gqis https://github.com/libspatialindex/libspatialindex/issues/276
build      : |
    %ninja_build
install    : |
    %ninja_install
    %python3_compile
    %install_license COPYING
conflicts  :
    - qgis-ltr
    - dbginfo :
        - qgis-ltr-dbginfo
    - devel :
        - qgis-ltr-devel
