# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qt6-graphs
version    : 6.11.2
release    : 3
source     :
    - https://download.qt.io/official_releases/qt/6.11/6.11.2/submodules/qtgraphs-everywhere-src-6.11.2.tar.xz : 9f2109854afa45dd144116c11461989c411a17065c63da5068441a1200fb8b21
license    :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
component  :
    - desktop.qt
homepage   : https://www.qt.io
summary    : Qt6 Graphs Module
description: |
    The Qt Graphs module enables you to visualize data in 2D and 3D graphs. Qt Graphs is built on Qt 6 and the 3D graphs on Qt Quick 3D to take advantage of hardware acceleration and Qt Quick.
builddeps  :
    - pkgconfig(Qt63DCore)
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6Quick)
    - pkgconfig(Qt6Quick3D)
    - pkgconfig(Qt6ShaderTools)
    - qt6-base-private-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_ninja \
                 -DCMAKE_MESSAGE_LOG_LEVEL=STATUS
build      : |
    %ninja_build
install    : |
    %ninja_install

    %install_license LICENSES/*
