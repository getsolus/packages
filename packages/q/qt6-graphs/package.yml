# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qt6-graphs
version    : 6.12.1
release    : 5
source     :
    - https://download.qt.io/official_releases/qt/6.12/6.12.1/submodules/qtgraphs-everywhere-src-6.12.1.tar.xz : 41bf52c13ab64e69037604187ba8d20463b9d1db292d8e2ad89e1be04a14298d
license    :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
component  :
    - desktop.qt
homepage   : https://www.qt.io
summary    : Qt6 Graphs Module
description: |
    The Qt Graphs module enables you to visualize data in 2D and 3D graphs. Qt Graphs is built on Qt 6 and the 3D graphs on Qt Quick 3D to take advantage of hardware acceleration and Qt Quick.
builddeps  :
    - pkgconfig(Qt63DCore)
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6Quick)
    - pkgconfig(Qt6Quick3D)
    - pkgconfig(Qt6ShaderTools)
    - qt6-base-private-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_ninja \
                 -DCMAKE_MESSAGE_LOG_LEVEL=STATUS
build      : |
    %ninja_build
install    : |
    %ninja_install

    %install_license LICENSES/*
