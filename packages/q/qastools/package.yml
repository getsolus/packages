# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qastools
version    : 1.5.0
release    : 9
source     :
    - https://gitlab.com/sebholt/qastools/-/archive/v1.5.0/qastools-v1.5.0.tar.gz : c4db0fe6ced63864f6100b91414f08634777726a8b1d1257afc07d8020f341bd
homepage   : https://gitlab.com/sebholt/qastools
license    : MIT
component  : multimedia.audio
summary    : Desktop toolset for the Linux sound system ALSA
description: |
    QasTools is a collection of Qt-based mixer and setup tools for the Linux sound system ALSA.
builddeps  :
    - pkgconfig(Qt6Svg)
    - pkgconfig(Qt6UiTools)
    - pkgconfig(alsa)
setup      : |
    %cmake_ninja
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license COPYING
