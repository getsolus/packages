# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : quickemu
version    : 4.9.9
release    : 4
source     :
    - https://github.com/quickemu-project/quickemu/archive/refs/tags/4.9.9.tar.gz : ef5c5015e91c4fef6797c4961c400d18e1ae8191a8d1eae6e3512823dd2ff2a8
homepage   : https://github.com/quickemu-project/quickemu
license    : MIT
component  : virt
summary    : Quickly create and run optimised Windows, macOS and Linux virtual machines
description: |
    Quickemu is a wrapper for the excellent QEMU that automatically "does the right thing" when creating virtual machines. No requirement for exhaustive configuration options. You decide what operating system you want to run and Quickemu takes care of the rest.
rundeps    :
    - cdrtools # for mkisofs
    - edk2-ovmf
    - jq
    - mesa-demos # for glxinfo
    - pciutils
    - python3
    - qemu
    - socat
    - spice-gtk # for spicy
    - swtpm
    - xdg-user-dirs
    - xrandr
    - zsync
install    : |
    %install_bin chunkcheck \
      quickemu \
      quickget \
      quickreport
      
    %install_license LICENSE

    %install_file -t $installdir/usr/share/man/man1 docs/*.1
    %install_file -t $installdir/usr/share/man/man5 docs/*.5
