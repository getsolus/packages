# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qt6-sensors
version    : 6.11.3
release    : 24
source     :
    - https://download.qt.io/official_releases/qt/6.11/6.11.3/submodules/qtsensors-everywhere-src-6.11.3.tar.xz : 841d62343aa3dda607527080acd3c91ec1f17cf13a56a7cc033f5e3871f7aeb4
license    :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
component  :
    - desktop.qt
    - demos : programming.library
homepage   : https://www.qt.io
summary    : Qt6 Sensors Module
description: |
    The Qt Sensors API provides access to sensor hardware via QML and C++ interfaces. The Qt Sensors API also provides a motion gesture recognition API for devices.
builddeps  :
    - pkgconfig(Qt6Bluetooth)
    - pkgconfig(Qt6Qml)
    - pkgconfig(Qt6Svg)
    - qt6-base-private-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_ninja \
                 -DCMAKE_MESSAGE_LOG_LEVEL=STATUS
build      : |
    %ninja_build
install    : |
    %ninja_install
patterns   :
    - demos :
        - /usr/lib64/qt6/examples
