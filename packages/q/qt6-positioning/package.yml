# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qt6-positioning
version    : 6.12.1
release    : 23
source     :
    - https://download.qt.io/official_releases/qt/6.12/6.12.1/submodules/qtpositioning-everywhere-src-6.12.1.tar.xz : 8d8a27660c52c45ad71ab552968c1b073912cd09a4eb864ef67b7d6133e74fef
license    :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
component  :
    - desktop.qt
    - demos : programming.library
homepage   : https://www.qt.io
summary    : Qt6 position, satellite and area monitoring classes
description: |
    Provides access to position, satellite and area monitoring classes
builddeps  :
    - pkgconfig(Qt6Qml)
    - pkgconfig(Qt6SerialPort)
    - pkgconfig(Qt6Svg)
    - pkgconfig(gconf-2.0)
    - qt6-base-private-devel
rundeps    :
    - devel :
        - gconf-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_ninja \
                 -DCMAKE_MESSAGE_LOG_LEVEL=STATUS
build      : |
    %ninja_build
install    : |
    %ninja_install
patterns   :
    - devel :
        - /usr/bin
        - /usr/lib64/qt6/bin
    - demos :
        - /usr/lib64/qt6/examples
