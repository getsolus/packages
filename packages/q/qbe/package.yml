# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qbe
version    : '1.3'
release    : 2
source     :
    - https://c9x.me/compile/release/qbe-1.3.tar.xz : d587905d620dc5e1d2bfa7c2cc642b9b837aa89a3188c6e37b53d756cf66e320
homepage   : https://c9x.me/compile/
license    : MIT
component  : programming.tools
summary    : QBE a compiler backend
description: |
    QBE is a compiler backend that aims to provide 70% of the performance of industrial optimizing compilers in 10% of the code.
build      : |
    %make
install    : |
    %make_install PREFIX=%PREFIX%
    %install_license LICENSE
    install -Dm00644 $workdir/doc/* -t $installdir/usr/share/doc/qbe
check      : |
    make check
