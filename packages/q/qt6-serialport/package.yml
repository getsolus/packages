# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : qt6-serialport
version    : 6.12.1
release    : 24
source     :
    - https://download.qt.io/official_releases/qt/6.12/6.12.1/submodules/qtserialport-everywhere-src-6.12.1.tar.xz : ee05511d4993438b6b2babd8df8f8fae8c5e7aab563090dd81f1f0be9bbb3374
license    :
    - GFDL-1.3-or-later
    - GPL-3.0-or-later
    - LGPL-3.0-or-later
component  :
    - desktop.qt
    - demos : programming.library
homepage   : https://www.qt.io
summary    : Qt6 Serial Port Module
description: |
    Qt6 Serial Port provides the basic functionality, which includes configuring, I/O operations, getting and setting the control signals of the RS-232 pinouts.
builddeps  :
    - pkgconfig(Qt6Core)
    - qt6-base-private-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_ninja \
                 -DCMAKE_MESSAGE_LOG_LEVEL=STATUS
build      : |
    %ninja_build
install    : |
    %ninja_install
patterns   :
    - demos :
        - /usr/lib64/qt6/examples
