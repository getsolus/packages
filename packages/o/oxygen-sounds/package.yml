# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : oxygen-sounds
version    : 6.8.2
release    : 52
source     :
    - https://download.kde.org/stable/plasma/6.8.2/oxygen-sounds-6.8.2.tar.xz : 89cfad4b243cdd6e031739566693df77ffdc7a29cedc10dad0b96507a2b3ea62
homepage   : https://www.kde.org/workspaces/plasmadesktop/
license    :
    - BSD-2-Clause
    - CC0-1.0
    - CC-BY-3.0
    - LGPL-3.0-or-later
component  : desktop.theme
summary    : The Oxygen Sound Theme
description: The Oxygen Sound Theme
builddeps  :
    - pkgconfig(Qt6Core)
