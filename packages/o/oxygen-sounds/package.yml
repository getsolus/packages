    - https://download.kde.org/stable/plasma/6.7.4/oxygen-sounds-6.7.4.tar.xz : 4e7b942544e5ebdecda5eb23a6858ac2a9429c0c54ffba8a2455f1ff4b9ca9de
homepage   : https://www.kde.org/workspaces/plasmadesktop/
license    :
    - BSD-2-Clause
    - CC0-1.0
