# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : oxygen-sounds
version    : 6.7.5
release    : 50
source     :
    - https://download.kde.org/stable/plasma/6.7.5/oxygen-sounds-6.7.5.tar.xz : 0cc5b60004d8feb8b1de032cb5d3c056c98f62a8713589b90b471e5943e31ad9
homepage   : https://www.kde.org/workspaces/plasmadesktop/
license    :
    - BSD-2-Clause
    - CC0-1.0
    - CC-BY-3.0
    - LGPL-3.0-or-later
component  : desktop.theme
summary    : The Oxygen Sound Theme
description: The Oxygen Sound Theme
builddeps  :
    - pkgconfig(Qt6Core)
