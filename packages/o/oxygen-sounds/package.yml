# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : oxygen-sounds
version    : 6.8.3
release    : 53
source     :
    - https://download.kde.org/stable/plasma/6.8.3/oxygen-sounds-6.8.3.tar.xz : faab8fda3e37cd609f51703c9279d7e238f032e9c0df83de227c65bcf19b60d5
homepage   : https://www.kde.org/workspaces/plasmadesktop/
license    :
    - BSD-2-Clause
    - CC0-1.0
    - CC-BY-3.0
    - LGPL-3.0-or-later
component  : desktop.theme
summary    : The Oxygen Sound Theme
description: The Oxygen Sound Theme
builddeps  :
    - pkgconfig(Qt6Core)
