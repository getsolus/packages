# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : openxr
version    : 1.1.62
release    : 8
source     :
    - https://github.com/KhronosGroup/OpenXR-SDK-Source/releases/download/release-1.1.62/OpenXR-SDK-Source-release-1.1.62.tar.gz : 977073d7f4c0d1af8ab975f57e4b6ffd1c4e9209be66075812b890576e0e1e5f
homepage   : https://www.khronos.org/openxr/
license    : Apache-2.0
component  : multimedia.library
summary    : An open standard for virtual reality and augmented reality platforms and devices
description: |
    An open standard for virtual reality and augmented reality platforms and devices
builddeps  :
    - pkgconfig(jsoncpp)
    - pkgconfig(libglvnd)
    - pkgconfig(vulkan)
    - pkgconfig(x11)
    - pkgconfig(xrandr)
    - pkgconfig(xxf86vm)
setup      : |
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
