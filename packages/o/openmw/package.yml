# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : openmw
version    : 0.51.0
release    : 55
source     :
    - https://gitlab.com/OpenMW/openmw/-/archive/openmw-0.51.0/openmw-openmw-0.51.0.tar.gz : 7a65e63a5687ff0d51f319ebd529a9e93770fed3cc5408201de4588d1140f144
homepage   : https://openmw.org/
license    : GPL-3.0-or-later
component  : games.rpg
summary    : OpenMW is a recreation of the engine for the popular role-playing game Morrowind by Bethesda Softworks
description: |
    OpenMW is a recreation of the engine for the popular role-playing game Morrowind by Bethesda Softworks
builddeps  :
    - pkgconfig(MYGUI)
    - pkgconfig(Qt6Linguist)
    - pkgconfig(Qt6Svg)
    - pkgconfig(bullet)
    - pkgconfig(icu-i18n)
    - pkgconfig(libavcodec)
    - pkgconfig(liblz4)
    - pkgconfig(libunshield)
    - pkgconfig(luajit)
    - pkgconfig(openal)
    - pkgconfig(openscenegraph)
    - pkgconfig(recastnavigation)
    - pkgconfig(sdl2)
    - pkgconfig(sqlite3)
    - pkgconfig(tinyxml)
    - pkgconfig(xt)
    - pkgconfig(yaml-cpp)
    - libboost-devel
optimize   : lto
setup      : |
    sed -i "s|games/||" CMakeLists.txt
    %cmake_ninja \
        -DOPENMW_USE_SYSTEM_RECASTNAVIGATION=ON \
        -DUSE_SYSTEM_TINYXML=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
