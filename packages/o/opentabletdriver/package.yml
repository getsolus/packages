# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : opentabletdriver
version    : 0.6.7
release    : 9
source     :
    - https://github.com/OpenTabletDriver/OpenTabletDriver/archive/refs/tags/v0.6.7.tar.gz : 95e8fe646ccfcee97da5477f2432ce3265ec6c0c5356a23b1b2f41a0b738796f
homepage   : https://opentabletdriver.net/
license    : LGPL-3.0-only
component  : multimedia.graphics
summary    : An open source tablet driver
description: |
    OpenTabletDriver is an open-source, user-friendly tablet driver designed to provide support for various drawing tablets on Linux. It offers advanced configuration options, customizable settings, and robust performance, ensuring a seamless experience for artists and designers.
debug      : false
strip      : false
networking : true
builddeps  :
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libevdev)
    - pkgconfig(x11)
    - pkgconfig(xrandr)
    - dotnet-sdk
    - git
    - jq
rundeps    :
    - dotnet
build      : |
    %patch -p1 -i $pkgfiles/net10.patch
    ./eng/bash/package.sh --package Generic
install    : |
    install -dm00755 $installdir
    %install_license dist/files/usr/share/doc/opentabletdriver/LICENSE
    rm -r dist/files/usr/share/doc
    cp -a dist/files/* $installdir
    mv $installdir/usr/lib{,64}

    install -Dm00644 -t ${installdir}/%libdir%/systemd/user-preset/ ${pkgfiles}/20-opentabletdriver.preset

    install -Dm00644 $pkgfiles/net.opentabletdriver.OpenTabletDriver.metainfo.xml -t $installdir/usr/share/metainfo
