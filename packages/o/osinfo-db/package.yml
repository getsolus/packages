# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : osinfo-db
version    : '20260812'
release    : 18
source     :
    - https://gitlab.com/libosinfo/osinfo-db/-/releases/v20260812/downloads/osinfo-db-20260812.tar.xz : f13ed6e1e480b5266d39cad7f0010febdf0265dfc45579de2fb34543bc6b35de
    - https://gitlab.com/libosinfo/osinfo-db/-/raw/main/COPYING : ab15fd526bd8dd18a9e77ebc139656bf4d33e97fc7238cd11bf60e2b9b8666c6
homepage   : https://libosinfo.org
license    : GPL-2.0-or-later
component  : virt
summary    : OS database for libosinfo
extract    : false
description: |
    Operating system database for libosinfo
builddeps  :
    - osinfo-db-tools
install    : |
    osinfo-db-import --root "$installdir" --system $sources/$package-$version.tar.xz
    %install_file $pkgfiles/solus-rolling.xml $installdir/usr/share/osinfo/os/getsol.us/solus-rolling.xml
    %install_license $sources/COPYING
