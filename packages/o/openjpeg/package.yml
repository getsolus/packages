# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : openjpeg
version    : 2.5.4
release    : 24
source     :
    - https://github.com/uclouvain/openjpeg/archive/refs/tags/v2.5.4.tar.gz : a695fbe19c0165f295a8531b1e4e855cd94d0875d2f88ec4b61080677e27188a
homepage   : https://www.openjpeg.org/
license    : BSD-2-Clause
component  :
    - docs : multimedia.library
    - tools : system.utils
    - multimedia.library
summary    :
    - docs : Documentation for openjpeg
    - tools : OpenJPEG 2 command line tools
    - An open-source JPEG 2000 codec written in C
description:
    - docs : Documentation for openjpeg.
    - tools : OpenJPEG 2 command line tools.
    - OpenJPEG is an open-source JPEG 2000 codec written in C language. It has been developed in order to promote the use of JPEG 2000, a still-image compression standard from the Joint Photographic Experts Group (JPEG). Since April 2015, it is officially recognized by ISO/IEC and ITU-T as a JPEG 2000 Reference Software.
builddeps  :
    - pkgconfig(lcms2)
    - pkgconfig(libpng)
    - pkgconfig(libtiff-4)
    - doxygen
rundeps    :
    - devel :
        openjpeg-tools
setup      : |
    %apply_patches

    %cmake_ninja \
        -DBUILD_DOC=ON \
        -DBUILD_STATIC_LIBS=OFF
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE
patterns   :
    - tools :
        - /usr/bin
        - /usr/share/man/man1
    - docs :
        - /usr/share/doc
