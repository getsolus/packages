# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : openrgb
version    : '1.0'
release    : 12
source     :
    - https://codeberg.org/OpenRGB/OpenRGB/archive/release_1.0.tar.gz : 7f4ff78d96a82f2e628c596728db46fc997392b105ea49982066e532b7568086
homepage   : https://openrgb.org/
license    : GPL-2.0-only
component  : system.utils
summary    : Open source RGB lighting control that doesn't depend on manufacturer software
description: |
    An easy-to-use open source software program and library for accessing and controlling RGB lights on various PC hardware including motherboards, RAM modules, graphics cards, cooling devices, and peripherals.
clang      : true
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(hidapi-libusb)
    - pkgconfig(libusb-1.0)
    - pkgconfig(mbedtls)
    - qt6-tools-devel
setup      : |
    qmake6 OpenRGB.pro
build      : |
    %make
install    : |
    %make INSTALL_ROOT="${installdir}" install
    %install_license LICENSE

    # Generate udev rules using the binary we just built.
    %install_dir ${installdir}/%libdir%/udev/rules.d
    ./openrgb --generate-udev-rules ${installdir}/%libdir%/udev/rules.d/60-openrgb.rules

    %install_file -t ${installdir}/%libdir%/modules-load.d ${pkgfiles}/openrgb.conf
