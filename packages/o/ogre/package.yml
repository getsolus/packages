# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ogre
version    : 14.5.2
release    : 29
source     :
    - https://github.com/OGRECave/ogre/archive/refs/tags/v14.5.2.tar.gz : 1949fe62f3e4b8043e82e4dc94f9b0ab412a5bffc9e10d3b1dddc80fe54fe1e3
    - https://github.com/ocornut/imgui/archive/refs/tags/v1.91.9b.tar.gz#imgui.tar.gz : 8e1bbc76c71d74fef2fb85db7e7ca8eba13d6a86623c54992b60162db554ffdb
homepage   : https://ogrecave.github.io/ogre/
license    : MIT
component  : programming.library
summary    : OGRE (Object-Oriented Graphics Rendering Engine) is a scene-oriented, flexible 3D engine
description: |
    OGRE (Object-Oriented Graphics Rendering Engine) is a scene-oriented, flexible 3D engine written in C++ designed to make it easier and more intuitive for developers to produce applications utilizing hardware-accelerated 3D graphics.
builddeps  :
    - pkgconfig(OIS)
    - pkgconfig(OpenEXR)
    - pkgconfig(freetype2)
    - pkgconfig(gl)
    - pkgconfig(glew)
    - pkgconfig(pugixml)
    - pkgconfig(python3)
    - pkgconfig(sdl2)
    - pkgconfig(tinyxml)
    - pkgconfig(xaw7)
    - pkgconfig(xrandr)
    - pkgconfig(xt)
    - pkgconfig(zziplib)
    - intel-tbb-devel
    - libboost-devel
    - swig
setup      : |
    mkdir solusBuildDir
    tar -xf ${sources}/imgui.tar.gz -C solusBuildDir/

    %cmake_ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DPYTHON_EXECUTABLE=/usr/bin/python3 \
        -DOGRE_INSTALL_SAMPLES_SOURCE=TRUE \
        -DOGRE_BUILD_SAMPLES=FALSE \
        -DOGRE_BUILD_TESTS=FALSE \
        -DOGRE_BUILD_COMPONENT_CSHARP=FALSE \
        -DOGRE_LIB_DIRECTORY=%libdir%
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE
patterns   :
    - devel :
        - /usr/lib64/OGRE/cmake
