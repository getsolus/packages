# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : opencsg
version    : 1.8.2
release    : 6
source     :
    - http://www.opencsg.org/OpenCSG-1.8.2.tar.gz : 5ac5df73b1ad3340dd6705ff90e009f1a946bb9536c21c2263a6f974265664c0
license    : GPL-2.0-or-later
component  : programming.library
homepage   : https://opencsg.org/
summary    : OpenCSG is a library that does image-based CSG rendering using OpenGL
description: |
    OpenCSG is a library that does image-based CSG rendering using OpenGL
builddeps  :
    - pkgconfig(glew)
    - pkgconfig(glut)
    - pkgconfig(x11)
setup      : |
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %ninja_install
    rm -rf %{installdir}/usr/bin
    %install_license copying.txt
