# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : oxygen-icons
version    : 6.29.0
release    : 4
source     :
    - https://download.kde.org/stable/frameworks/6.29/oxygen-icons-6.29.0.tar.xz : 3d365f052087de1b5f870a4ecee083a6eb6e5f9174925152331110025113367a
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
    - LGPL-3.0-or-later
component  : desktop.theme
summary    : Oxygen icon theme
description: |
    Oxygen Icons is a freedesktop.org compatible icon theme originally developed for the KDE Plasma desktop environment in combination with the Oxygen Style
builddeps  :
    - pkgconfig(Qt6Core)
    - extra-cmake-modules
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
