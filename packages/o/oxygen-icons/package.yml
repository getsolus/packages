# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : oxygen-icons
version    : 6.30.0
release    : 5
source     :
    - https://download.kde.org/stable/frameworks/6.30/oxygen-icons-6.30.0.tar.xz : 8ae13c8827883d54cf903f63fbc9eff246b3a4dd8c0d7c835b610d642f49f37e
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
    - LGPL-3.0-or-later
component  : desktop.theme
summary    : Oxygen icon theme
description: |
    Oxygen Icons is a freedesktop.org compatible icon theme originally developed for the KDE Plasma desktop environment in combination with the Oxygen Style
builddeps  :
    - pkgconfig(Qt6Core)
    - extra-cmake-modules
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
