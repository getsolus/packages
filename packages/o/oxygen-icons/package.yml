# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : oxygen-icons
version    : 6.31.0
release    : 6
source     :
    - https://download.kde.org/stable/frameworks/6.31/oxygen-icons-6.31.0.tar.xz : f63811206c7c01b78c625abfbe866484b71849be833272a7375bb9f86ac7d5b5
homepage   : https://community.kde.org/Frameworks
license    :
    - CC0-1.0
    - LGPL-3.0-or-later
component  : desktop.theme
summary    : Oxygen icon theme
description: |
    Oxygen Icons is a freedesktop.org compatible icon theme originally developed for the KDE Plasma desktop environment in combination with the Oxygen Style
builddeps  :
    - pkgconfig(Qt6Core)
    - extra-cmake-modules
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
