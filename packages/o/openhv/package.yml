# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : openhv
version    : '20250725'
release    : 1
source     :
    - https://github.com/OpenHV/OpenHV/archive/refs/tags/20250725.tar.gz : da92e417eb843789fa34a4f99def52c09f7fa0da963578c4664388d3e1e6d17f
license    : GPL-3.0-or-later
homepage   : https://www.openhv.net/
component  : games.strategy
summary    : An Open Source Pixelart Science-Fiction Real-Time-Strategy game
description: |
    Set in the distant future where mega corporation battle themselves
    this game comes with multiplayer (LAN and internet) support,
    competent skirmish bots as well as an integrated map editor.
    It allows for spectators to join and replays to be shared.
networking : true
builddeps  :
    - pkgconfig(freetype2)
    - pkgconfig(lua-5.1)
    - pkgconfig(openal)
    - pkgconfig(sdl2)
    - dotnet-sdk
environment: |
    unset version
build      : |
    %make version VERSION=$version
    %make TARGETPLATFORM=unix-generic
install    : |
    %make_install prefix=/usr TARGETPLATFORM=unix-generic DESTDIR=$installdir
