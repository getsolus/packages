# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : obs-studio
version    : 32.2.2
release    : 135
source     :
    - git|https://github.com/obsproject/obs-studio.git : 32.2.2
homepage   : https://obsproject.com/
license    : GPL-2.0-or-later
component  : multimedia.video
summary    : Open Broadcaster Software is free and open source software for video recording and live streaming.
description: |
    Open Broadcaster Software is free and open source software for video recording and live streaming.
libsplit   : false
builddeps  :
    - pkgconfig(Qt6Svg)
    - pkgconfig(alsa)
    - pkgconfig(asio)
    - pkgconfig(fdk-aac)
    - pkgconfig(ffnvcodec)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(gio-2.0)
    - pkgconfig(jansson)
    - pkgconfig(libavcodec)
    - pkgconfig(libcurl)
    - pkgconfig(libdrm)
    - pkgconfig(libpci)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(librist)
    - pkgconfig(libudev)
    - pkgconfig(libv4l2)
    - pkgconfig(libva)
    - pkgconfig(libvlc)
    - pkgconfig(luajit)
    - pkgconfig(mbedtls)
    - pkgconfig(nlohmann_json)
    - pkgconfig(python3)
    - pkgconfig(qrcodegencpp)
    - pkgconfig(rnnoise)
    - pkgconfig(simde)
    - pkgconfig(speexdsp)
    - pkgconfig(srt)
    - pkgconfig(uthash)
    - pkgconfig(uuid)
    - pkgconfig(vpl)
    - pkgconfig(wayland-client)
    - pkgconfig(x11-xcb)
    - pkgconfig(x264)
    - pkgconfig(xcb-composite)
    - pkgconfig(xcb-randr)
    - pkgconfig(xcb-shm)
    - pkgconfig(xcb-xfixes)
    - pkgconfig(xcb-xinerama)
    - pkgconfig(xcb-xinput)
    - pkgconfig(xkbcommon)
    - cef-minimal-devel
    - extra-cmake-modules
    - libdatachannel-devel
    - swig
    - websocketpp
setup      : |
    %cmake_ninja \
        -DCEF_ROOT_DIR="/usr/share/cef-minimal" \
        -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
        -DENABLE_AJA=OFF \
        -DENABLE_BROWSER=ON \
        -DENABLE_LIBFDK=ON \
        -DOBS_VERSION_OVERRIDE="$version"
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license $installdir/usr/share/obs/obs-studio/license/*
    rm -r $installdir/usr/share/obs/obs-studio/license
