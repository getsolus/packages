# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : openshot-qt
version    : 4.1.0
release    : 31
source     :
    - https://github.com/OpenShot/openshot-qt/archive/refs/tags/v4.1.0.tar.gz : 5c7b6720f38b4319ce3ec25c375c30d4a2e9843ce97d1ee037afca6910b2f895
homepage   : https://www.openshot.org/
license    : GPL-3.0-or-later
component  : multimedia.video
summary    : Openshot video editor
description: |
    OpenShot Video Editor is a free, open-source, non-linear video editor. It can create and edit videos and movies using many popular video, audio, and image formats. Create videos for YouTube, Flickr, Vimeo, Metacafe, Xbox, and many more common formats!
builddeps  :
    - pkgconfig(python3)
    - python-setuptools
rundeps    :
    - libopenshot
    - python-pyside6
    - python-pyzmq
    - python-requests
    - pyxdg
    - shiboken6
setup      : |
    %patch -p1 -i ${pkgfiles}/openshot-2.6.1-no_metric_default.patch
    sed -i 's/from qt_api/from .qt_api/' src/launch.py
    # Use wrapper file to make sure  it always use Pyside6
    sed -i 's|^Exec=.*|Exec=openshot %F|' xdg/org.openshot.OpenShot.desktop
build      : |
    %python3_setup
install    : |
    %python3_install
    %install_exe $pkgfiles/openshot.sh $installdir/usr/bin/openshot
    %install_license COPYING
