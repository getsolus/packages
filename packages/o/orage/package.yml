
# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : orage
version    : 4.20.3
release    : 1
source     :
    - https://archive.xfce.org/src/apps/orage/4.20/orage-4.20.3.tar.bz2 : d9f6a3bcd1fdcd83d8277bc1996684a02d06ef60492b69c2404815f3314d640e
homepage   : https://docs.xfce.org/apps/orage/start
license    : GPL-2.0-or-later
component  : desktop.xfce
summary    : Calendar application for the XFCE desktop environment
description: |
    Orage is a lightweight calendar and scheduling application for XFCE.
    It supports appointments, recurring events, reminders, alarms,
    and the iCalendar file format.
builddeps  :
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libical)
    - pkgconfig(libicalss)
    - pkgconfig(libnotify)
    - pkgconfig(libxfce4ui-2)
    - pkgconfig(popt)
    - intltool
    - xfce4-dev-tools-devel
# libical 4 compatibility patch adapted from Arch Linux packaging:
# https://gitlab.archlinux.org/archlinux/packaging/packages/orage
# Includes an LLM-assisted recurrence-rule pointer fix.
setup      : |
    %patch -p1 -i $pkgfiles/0001-support-libical-4.patch
    NOCONFIGURE=1 xdt-autogen
    %configure
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
