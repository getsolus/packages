# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : orca
version    : '51.0'
release    : 46
source     :
    - https://download.gnome.org/sources/orca/51/orca-51.0.tar.xz : 8bc3e44bc5b7b66ec7e0cc5c82695c0075661922745d25724f5fc84a25602108
homepage   : https://gitlab.gnome.org/GNOME/orca
license    : LGPL-2.1-or-later
component  : desktop.gnome
summary    : Orca Screen Reader
description: |
    Orca is a free, open source, flexible, and extensible screen reader that provides access to the graphical desktop via user-customizable combinations of speech and/or braille.
networking : true # cargo
builddeps  :
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(libwnck-3.0)
    - pkgconfig(pygobject-3.0)
    - pkgconfig(python3)
    - pkgconfig(speech-dispatcher)
    - itstool
    - python-dasbus
    - rust
    - yelp-tools
rundeps    :
    - pyatspi2
    - python-dasbus
    - speech-dispatcher
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING

    # Stateless XDG
    mv $installdir/etc/xdg $installdir/usr/share/.
    rmdir $installdir/etc
