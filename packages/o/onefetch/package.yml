# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : onefetch
version    : 3.0.0
release    : 18
source     :
    - https://github.com/o2sh/onefetch/archive/refs/tags/3.0.0.tar.gz : 2877f2473120b41a33d03cc09bcded9ff4280951dfe447c1709df45b029e6e8b
homepage   : https://onefetch.dev
license    : MIT
component  : system.utils
networking : true
summary    : A command-line Git information tool written in Rust
description: |
    Onefetch is a command-line Git information tool written in Rust that will display project information and code statistics about your Git repository directly on your terminal.
builddeps  :
    - rust
environment: |
    # Force use of system libs
    export ZSTD_SYS_USE_PKG_CONFIG=1
setup      : |
    %cargo_fetch
build      : |
    %cargo_build --all-features
install    : |
    %cargo_install
    %install_file docs/onefetch.1 ${installdir}/usr/share/man/man1/onefetch.1
    %install_license LICENSE.md

    # Generate shell completions
    for shellcomp in bash fish zsh; do
        ./target/release/onefetch --generate "$shellcomp" > onefetch."$shellcomp"
    done

    %install_file onefetch.bash ${installdir}/usr/share/bash-completion/completions/onefetch
    %install_file onefetch.fish ${installdir}/usr/share/fish/vendor_completions.d/onefetch.fish
    %install_file onefetch.zsh  ${installdir}/usr/share/zsh/site-functions/_onefetch
