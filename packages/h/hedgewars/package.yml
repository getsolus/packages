# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : hedgewars
version    : 1.0.3
release    : 39
source     :
    - https://www.hedgewars.org/download/releases/hedgewars-src-1.0.3.tar.bz2 : c5c1877c0bae1354c75d2b9527b6f9a9f79e99932e5d08b1f6f7de1708066130
homepage   : https://www.hedgewars.org/
license    : GPL-2.0-only
component  : games.strategy
summary    : Funny turn-based artillery game, featuring fighting Hedgehogs!
description: |
    Hedgewars is a turn based strategy, artillery, action and comedy game, featuring the antics of pink hedgehogs with attitude as they battle from the depths of hell to the depths of space. As commander, it's your job to assemble your crack team of hedgehog soldiers and bring the war to your enemy.
builddeps  :
    - pkgconfig(Qt5UiTools)
    - pkgconfig(SDL2_image)
    - pkgconfig(SDL2_mixer)
    - pkgconfig(SDL2_net)
    - pkgconfig(SDL2_ttf)
    - pkgconfig(glut)
    - pkgconfig(libavcodec)
    - pkgconfig(lua-5.1)
    - pkgconfig(physfs)
    - fpc
    - imagemagick # convert
libsplit   : false
setup      : |
    # Fix build with FFmpeg 9 (from Arch)
    # https://gitlab.archlinux.org/archlinux/packaging/packages/hedgewars/-/blob/main/ffmpeg-9.patch
    %patch -p1 -i ${pkgfiles}/ffmpeg-9.patch

    sed -i 's|set(ghc_flags|set(ghc_flags -dynamic -package network-2.8.0.1 -hide-package network-bsd|' gameServer/CMakeLists.txt
    # Note, this doesn't work with ninja
    %cmake . -DNOSERVER=1
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
    
    # Don't use obsolete metainfo path
    %install_file ${installdir}/usr/share/appdata/hedgewars.appdata.xml \
    ${installdir}/usr/share/metainfo/hedgewars.metainfo.xml
    rm -rv ${installdir}/usr/share/appdata/

    %install_file misc/hedgewars.png ${installdir}/usr/share/icons/hicolor/512x512/apps/hedgewars.png
check      : |
    %make test || :
