# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : hunspell-fr
version    : '7.7'
release    : 11
source     :
    - https://grammalecte.net/oxt/lo-oo-ressources-linguistiques-fr-v7.7.oxt : 9f679889ff60f787a06e74f271ed1b40d2fa0ee8cdd10ecbe56134cba9c71b05
homepage   : https://grammalecte.net/
license    : MPL-2.0
component  : office.spelling
summary    : French (classic) hunspell dictionaries
description: |
    French (classic) hunspell dictionaries
rundeps    :
    - libhunspell
setup      : |
    unzip -o $sources/lo-oo-ressources-linguistiques-fr-v7.7.oxt
install    : |
    pushd dictionaries
    install -Dm00644 fr-classique.dic $installdir/usr/share/hunspell/fr_FR.dic
    install -m00644 fr-classique.aff $installdir/usr/share/hunspell/fr_FR.aff
    popd

    pushd $installdir/usr/share/hunspell/
        for lang in fr_BE fr_CA fr_CH fr_LU; do
            ln -s fr_FR.aff $lang.aff
            ln -s fr_FR.dic $lang.dic
        done
    popd
    %install_license dictionaries/README_*
