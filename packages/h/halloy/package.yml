# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : halloy
version    : '2026.10'
release    : 19
source     :
    - https://github.com/squidowl/halloy/archive/refs/tags/2026.10.tar.gz : 19b77a7e09cf66ef518bfa5b1e8b3c07713373d7468d30500b093e327729a00b
homepage   : https://halloy.squidowl.org/
license    : GPL-3.0-or-later
component  : network.im
summary    : IRC application written in Rust
description: |
    Halloy is an open-source IRC client written in Rust, with the Iced GUI library. It aims to provide a simple and fast client for Mac, Windows, and Linux platforms.
networking : true
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(xcb)
    - rust
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install
    %install_license LICENSE
    install -Dm00644 assets/linux/org.squidowl.halloy.desktop -t $installdir/usr/share/applications
    install -Dm00644 assets/linux/org.squidowl.halloy.appdata.xml -t $installdir/usr/share/metainfo
    cp -r assets/linux/icons $installdir/usr/share
