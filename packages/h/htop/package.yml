# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : htop
version    : 3.5.3
release    : 30
source     :
    - https://github.com/htop-dev/htop/releases/download/3.5.3/htop-3.5.3.tar.xz : a8b164386494cb85bb255a415a3f5f80afe7a0c4491da5d113b3a0f951087e65
homepage   : https://htop.dev
license    : GPL-2.0-or-later
component  : system.utils
summary    : htop (interactive process viewer for Linux)
description: |
    htop is an interactive process viewer for Linux.
builddeps  :
    - lm_sensors-devel
rundeps    :
    - lm_sensors
setup      : |
    %reconfigure
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
    install -Dm00644 $pkgfiles/htop.metainfo.xml -t $installdir/usr/share/metainfo
