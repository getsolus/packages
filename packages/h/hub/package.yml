# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : hub
version    : 2.14.2
release    : 15
source     :
    # Commit date 2023-10-04
    - git|https://github.com/github/hub.git : 5c547ed804368763064e51f3990851e267e88edd
homepage   : https://hub.github.com/
license    : MIT
component  : system.utils
summary    : A command line tool that wraps git in order to extend it with extra features and commands that make working with GitHub easier
description: |
    hub is a command line tool that wraps git in order to extend it with extra features and commands that make working with GitHub easier.
networking : true
builddeps  :
    - golang
    - groff
build      : |
    mkdir -p src/github.com/github
    export GOPATH=`pwd`
    ln -sv `pwd` src/github.com/github/hub
    cd src/github.com/github/hub
    export prefix=$installdir/usr
    %make install
    %install_license LICENSE
