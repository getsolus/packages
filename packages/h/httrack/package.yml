# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : httrack
version    : 3.51.0
release    : 13
source     :
    - https://github.com/xroche/httrack/releases/download/3.51.0/httrack-3.51.0.tar.gz : 1daa7ec0153ec16e6bea809c2d8829ceddf0e06f74471fa0528ffbf20275f5f1
homepage   : https://www.httrack.com/
license    : GPL-3.0-or-later
component  : network.download
summary    : A command line tool for mirroring websites.
description: |
    A powerful command line tool for mirroring and making offline copies of websites.
setup      : |
    %configure --disable-static --disable-online-unit-tests
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
check      : |
    %make check