# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : helixnotes
version    : 1.3.5
release    : 9
source     :
    - https://gitlab.com/ArkHost/HelixNotes/-/archive/v1.3.5/HelixNotes-v1.3.5.tar.gz : 21d0691565310be67067a8c27ba81b7a0f439787c951f2186f96a1ab6a08c648
homepage   : https://helixnotes.com/
license    : AGPL-3.0-only
component  : office.notes
summary    : Local-first Markdown note-taking app
description: |
    HelixNotes is a local-first markdown note-taking app built with Tauri, SvelteKit, and Rust. Your notes are stored as standard Markdown files on your local filesystem. No cloud, no lock-in.
networking : true
builddeps  :
    - pkgconfig(ayatana-appindicator3-0.1)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libsoup-3.0)
    - pkgconfig(webkit2gtk-4.1)
    - nodejs
    - pnpm
    - rust
rundeps    :
    - libayatana-appindicator
    - libgtk-3
    - librsvg
    - libwebkit-gtk41
    - openssl
setup      : |
    pnpm install --ignore-scripts
build      : |
    export HELIXNOTES_INSTALL_TYPE=solus
    npx tauri build --no-bundle
install    : |
    %install_bin src-tauri/target/release/helixnotes
    %install_license LICENSE

    %install_file $pkgfiles/helixnotes.desktop $installdir/usr/share/applications/helixnotes.desktop
    %install_file $pkgfiles/io.codeberg.arkhost.helixnotes.metainfo.xml $installdir/usr/share/metainfo/io.codeberg.arkhost.helixnotes.metainfo.xml
    %install_file src-tauri/icons/128x128@2x.png $installdir/usr/share/icons/hicolor/128x128@2/apps/helixnotes.png
    %install_file src-tauri/icons/128x128.png $installdir/usr/share/icons/hicolor/128x128/apps/helixnotes.png
    %install_file src-tauri/icons/64x64.png $installdir/usr/share/icons/hicolor/64x64/apps/helixnotes.png
    %install_file src-tauri/icons/32x32.png $installdir/usr/share/icons/hicolor/32x32/apps/helixnotes.png
