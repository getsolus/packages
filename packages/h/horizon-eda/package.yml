# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : horizon-eda
version    : 2.7.2
release    : 17
source     :
    - https://github.com/horizon-eda/horizon/archive/refs/tags/v2.7.2.tar.gz : 6b605f7e4c46d894a64997e0f60eba937e7d68d908b4d715cd2dde3364bd79a2
homepage   : https://horizon-eda.org/
license    : GPL-3.0-or-later
component  : office.scientific
summary    : Horizon is a free EDA package
description: |
    Horizon EDA is an Electronic Design Automation package supporting an integrated end-to-end workflow for printed circuit board design including parts management and schematic entry.
builddeps  :
    - pkgconfig(cppzmq)
    - pkgconfig(glm)
    - pkgconfig(gtkmm-3.0)
    - pkgconfig(libarchive)
    - pkgconfig(libcurl)
    - pkgconfig(libgit2)
    - pkgconfig(libpodofo)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(sqlite3)
    - opencascade-devel
rundeps    :
    - python-cairo
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
