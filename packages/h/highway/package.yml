# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : highway
version    : 1.4.0
release    : 5
source     :
    - https://github.com/google/highway/archive/refs/tags/1.4.0.tar.gz : e72241ac9524bb653ae52ced768b508045d4438726a303f10181a38f764a453c
license    : Apache-2.0
homepage   : https://github.com/google/highway
component  : programming.library
summary    : SIMD/vector intrinsics library
description: |
    Performance-portable, length-agnostic SIMD with runtime dispatch
builddeps  :
    - pkgconfig(gtest)
clang      : true
optimize   :
    - speed
setup      : |
    %cmake_ninja \
                 -DBUILD_SHARED_LIBS=ON \
                 -DHWY_SYSTEM_GTEST=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
check      : |
    %ninja_check
