# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : virtualbox
version    : 7.2.14
release    : 395
source     :
    - https://download.virtualbox.org/virtualbox/7.2.14/VirtualBox-7.2.14.tar.bz2 : 384f293184c52fd51bc941c17d753b4019446f53a6b07c828adfb3e61fe0a500
    - https://download.virtualbox.org/virtualbox/7.2.14/VBoxGuestAdditions_7.2.14.iso : 4f51a073296de31cce53924860549149be5dc339f65dcd1dbf34fd7accefe8fb
homepage   : https://www.virtualbox.org
license    : GPL-2.0-only
component  :
    - virt
    - common : virt
    - current : virt
    - guest : virt
    - guest-common : virt
    - guest-current : virt
    - guest-additions-iso : virt
summary    :
    - VirtualBox host modules for the linux-lts kernel
    - common : Common components for VirtualBox host packages
    - current : VirtualBox host modules for the linux-current kernel
    - devel : Development components for VirtualBox
    - guest : VirtualBox guest additions for the linux-lts kernel
    - guest-common : Common components for the VirtualBox guest packages
    - guest-current : VirtualBox guest additions for the linux-current kernel
    - guest-additions-iso : The official VirtualBox Guest Additions ISO image
description: |
    VirtualBox is a free powerful open source solution for running other x86 and x86_64 operating systems virtually on your computer.

    Installation Guide: https://help.getsol.us/docs/user/software/virtualization/virtualbox/
builddeps  :
    - pkgconfig(Qt6Help)
    - pkgconfig(Qt6StateMachine)
    - pkgconfig(alsa)
    # Still in the configure script, but it doesn't actually use it anymore. Can probably be removed in the future:
    - pkgconfig(devmapper)
    - pkgconfig(glu)
    - pkgconfig(libIDL-2.0)
    - pkgconfig(libcurl)
    - pkgconfig(liblzma)
    - pkgconfig(libpng)
    - pkgconfig(libpulse)
    - pkgconfig(libtpms)
    - pkgconfig(libxslt)
    - pkgconfig(python3)
    - pkgconfig(sdl2)
    - pkgconfig(vpx)
    - pkgconfig(xcursor)
    - pkgconfig(xinerama)
    - pkgconfig(xmu)
    - pkgconfig(xrandr)
    - acpica-unix
    - glibc-32bit-devel
    - glslang
    - libgcc-32bit
    - linux-current
    - linux-current-headers
    - linux-lts
    - linux-lts-headers
    - python-setuptools
    - yasm
permanent  :
    - /usr/lib64/modules
autodep    : false
rundeps    :
    - common :
        - libtpms
        - libx11
        - libxt
        - qt6-scxml
        - qt6-tools
        - sdl2
    - current :
        - linux-current
        - virtualbox-common
    - devel :
        - virtualbox-common
    - guest :
        - linux-lts
        - virtualbox-guest-common
    - guest-common :
        - libx11
        - libxt
        - pam
    - guest-current :
        - linux-current
        - virtualbox-guest-common
    - linux-lts
    - virtualbox-common
patterns   :
    - common : /usr
    - devel :
        - /usr/lib/python*
        - /usr/lib64/virtualbox/sdk
    - current :
        - /usr/lib64/modules/*.current/extra/vbox
    - guest :
        - /usr/lib64/modules/*.lts/extra/vbox-guest
    - guest-current :
        - /usr/lib64/modules/*.current/extra/vbox-guest
    - guest-common :
        - /usr/sbin
        - /usr/bin/VBoxClient
        - /usr/bin/VBoxControl
        - /usr/bin/VBoxClient-all
        - /usr/lib64/security
        - /usr/lib64/vboxguestadditions
        - /usr/lib64/udev/rules.d/60-vboxguest.rules
        - /usr/lib64/modules-load.d/vboxguest.conf
        - /usr/lib64/sysusers.d/vboxguest.conf
        - /usr/lib64/systemd/system/vboxservice.service
        - /usr/lib64/systemd/system-preset/60-virtualbox-guest.preset
        - /usr/share/xdg
    - guest-additions-iso :
        - /usr/share/virtualbox/VBoxGuestAdditions.iso
    - main :
        - /usr/lib64/modules/*.lts/extra/vbox
setup      : |
    # Apply patches before we go off changing the tree
    %apply_patches

    # Ensure we don't ever use bundled libraries
    # Note that VBox uses private libslirp headers, so that can't be debundled
    rm -rvf src/libs/{curl-*,liblzma-*,libpng-*,libtpms-*,libxml2-*,openssl-*,zlib-*}

    cp ${pkgfiles}/LocalConfig.kmk .
    echo "VBOX_GCC_OPT=${CXXFLAGS}" >> LocalConfig.kmk

    # It actually wants SDL2
    sed -i 's/sdl-config/sdl2-config/' configure

    ./configure --disable-kmods \
                --disable-docs \
                --disable-java \
                --with-makeself=/bin/true   # we don't need this guy; it's used by linux installer
build      : |
    source ./env.sh
    kmk all

    ##### hosts modules #####
    cd out/linux.amd64/release/bin
    for kern in "%kernel_version_lts%" "%kernel_version_current%"; do
        cp -arv --no-preserve=ownership src ${kern}
        pushd ${kern}
            %make KERN_VER=${kern}
        popd
    done

    ##### guest modules #####
    cd additions
    for kern in "%kernel_version_lts%" "%kernel_version_current%"; do
        cp -arv --no-preserve=ownership src ${kern}
        pushd ${kern}
            %make all KERN_VER=${kern}
        popd
    done
install    : |
    ##### Host #####
    cd out/linux.amd64/release/bin

    # binaries
    %install_bin VBox.sh

    for i in VirtualBox VBoxManage VBoxSDL VBoxHeadless VBoxAutostart VBoxBalloonCtrl VBoxBugReport VBoxDTrace VBoxVRDP; do
        ln -s VBox.sh ${installdir}/usr/bin/${i}
    done

    # libraries
    %install_dir ${installdir}/%libdir%/virtualbox
    %install_exe *.so -t ${installdir}/%libdir%/virtualbox
    %install_file *.r0 VBoxEFI*.fd -t ${installdir}/%libdir%/virtualbox

    # binaries & scripts
    %install_exe VirtualBox VBoxManage VBoxSVC VBoxExtPackHelperApp VBoxBalloonCtrl -t ${installdir}/%libdir%/virtualbox
    %install_exe VBoxAutostart VBoxCpuReport VBoxBugReport VBoxVMMPreload -t ${installdir}/%libdir%/virtualbox
    %install_exe VBoxCreateUSBNode.sh VBoxSysInfo.sh -t ${installdir}/%libdir%/virtualbox

    # setuid root binaries
    install -m04755 VBoxSDL VBoxVolInfo VirtualBoxVM VBoxHeadless VBoxNetDHCP VBoxNetAdpCtl VBoxNetNAT -t ${installdir}/%libdir%/virtualbox

    # components
    %install_dir ${installdir}/%libdir%/virtualbox/components
    %install_exe components/* -t ${installdir}/%libdir%/virtualbox/components

    # languages
    %install_dir ${installdir}/usr/share/virtualbox/nls
    %install_file nls/*.qm -t ${installdir}/usr/share/virtualbox/nls

    # icons
    pushd icons
        for i in *; do
            %install_dir ${installdir}/usr/share/icons/hicolor/${i}/mimetypes
            cp -arv --no-preserve=ownership ${i}/* ${installdir}/usr/share/icons/hicolor/${i}/mimetypes
        done
    popd
    # desktop Icon=virtualbox
    %install_file icons/scalable/virtualbox.svg ${installdir}/usr/share/icons/hicolor/scalable/apps/virtualbox.svg
    rm -f ${installdir}/usr/share/icons/hicolor/scalable/mimetypes/virtualbox.svg

    # .desktop
    %install_file virtualbox.desktop ${installdir}/usr/share/applications/virtualbox.desktop
    %install_file virtualbox.xml ${installdir}/usr/share/mime/packages/virtualbox.xml

    # appstream metainfo
    %install_file ${pkgfiles}/org.virtualbox.virtualbox.metainfo.xml -t ${installdir}/usr/share/metainfo

    # kernel modules
    for kern in "%kernel_version_lts%" "%kernel_version_current%"; do
        pushd ${kern}
            %install_dir ${installdir}/usr/lib64/modules/${kern}/extra/vbox/
            %install_file *.ko -t ${installdir}/usr/lib64/modules/${kern}/extra/vbox/
        popd
    done

    # devel
    %install_exe vboxshell.py ${installdir}/%libdir%/virtualbox/vboxshell.py
    pushd sdk/installer/python
        VBOX_INSTALL_PATH="%libdir%/virtualbox" python3 vboxapisetup.py install --root=${installdir}
    popd
    %install_dir ${installdir}/%libdir%/virtualbox/sdk/bindings
    cp -arv --no-preserve=ownership sdk/bindings/{VirtualBox.xidl,auth,xpcom} ${installdir}/%libdir%/virtualbox/sdk/bindings

    # systemd stuffs
    %install_file ${pkgfiles}/virtualbox.sysusers ${installdir}/%libdir%/sysusers.d/virtualbox.conf
    %install_file ${pkgfiles}/60-vboxdrv.rules ${installdir}/%libdir%/udev/rules.d/60-vboxdrv.rules
    %install_exe ${pkgfiles}/vboxdrv.sh ${installdir}/%libdir%/virtualbox/vboxdrv.sh
    %install_file ${pkgfiles}/vboxdrv.service ${installdir}/%libdir%/systemd/system/vboxdrv.service
    %install_file -t ${installdir}/%libdir%/systemd/system-preset/ ${pkgfiles}/60-virtualbox.preset

    ##### Guest #####
    cd additions
    %install_exe mount.vboxsf -t ${installdir}/usr/sbin
    %install_exe VBoxService -t ${installdir}/usr/sbin
    %install_bin VBoxClient VBoxControl
    %install_exe ${workdir}/src/VBox/Additions/x11/Installer/98vboxadd-xclient ${installdir}/usr/bin/VBoxClient-all

    %install_file ${workdir}/src/VBox/Additions/x11/Installer/vboxclient.desktop ${installdir}/usr/share/xdg/autostart/vboxclient.desktop

    %install_exe pam_vbox.so -t ${installdir}/%libdir%/security

    # current kernel modules
    pushd %kernel_version_current%
        %install_file *.ko -t ${installdir}/usr/lib64/modules/%kernel_version_current%/extra/vbox-guest/
    popd

    # lts kernel modules
    pushd %kernel_version_lts%
        %install_file *.ko -t ${installdir}/usr/lib64/modules/%kernel_version_lts%/extra/vbox-guest/
    popd

    # systemd configuration
    %install_file ${pkgfiles}/vboxguest.modules ${installdir}/%libdir%/modules-load.d/vboxguest.conf
    %install_file ${pkgfiles}/vboxguest.sysusers ${installdir}/%libdir%/sysusers.d/vboxguest.conf
    %install_file ${pkgfiles}/60-vboxguest.rules ${installdir}/%libdir%/udev/rules.d/60-vboxguest.rules
    %install_file ${pkgfiles}/vboxservice.service ${installdir}/%libdir%/systemd/system/vboxservice.service
    %install_file -t ${installdir}/%libdir%/systemd/system-preset/ ${pkgfiles}/60-virtualbox-guest.preset

    # Compress modules with zstd
    find "${installdir}" -name '*.ko' -exec strip --strip-debug {} \; -exec zstd {} \; -exec rm -v {} \;

    # Install Guest Additons ISO
    %install_file ${sources}/VBoxGuestAdditions_*.iso ${installdir}/usr/share/virtualbox/VBoxGuestAdditions.iso

    # Disable KVM
    %install_file ${pkgfiles}/virtualbox.conf ${installdir}/usr/lib/modprobe.d/virtualbox.conf

    # Install licenses
    cd ${workdir}
    %install_license COPYING COPYING.CDDL LICENSE.txt THIRD_PARTY_LICENSES.txt
