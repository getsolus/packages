# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : verilator
version    : '5.054'
release    : 58
source     :
    - https://github.com/verilator/verilator/archive/refs/tags/v5.054.tar.gz : 18658731b46922ef660bcb650be0aa503d751e5c17eb9d4644fdfabb11835198
license    :
    - Artistic-2.0
    - LGPL-3.0-only
homepage   : https://www.veripool.org/wiki/verilator
component  : programming.tools
summary    : Verilator converts synthesizable (generally not behavioral) Verilog code into C++ or SystemC code.
description: |
    Verilator converts synthesizable (generally not behavioral) Verilog code into C++ or SystemC code. It is not a complete simulator, just a translator.
builddeps  :
    - help2man
rundeps    :
    - ccache
checkdeps  :
    - python-distro
setup      : |
    autoconf
    %configure
build      : |
    %make
install    : |
    %make_install
    %install_license LICENSE LICENSES/*
check      : |
    make test
