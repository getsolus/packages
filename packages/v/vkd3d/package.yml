# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : vkd3d
version    : '2.1'
release    : 17
source     :
    - https://dl.winehq.org/vkd3d/source/vkd3d-2.1.tar.xz : 7510146aff2adfb4ae07ab890701a607e5ff7c66e57100cfc9f630ec92eeda6a
homepage   : https://gitlab.winehq.org/wine/vkd3d
license    : LGPL-2.1-or-later
component  : programming.library
summary    : vkd3d 3D Graphics Library
description: |
    Vkd3d is a 3D graphics library built on top of Vulkan. It has an API very similar, but not identical, to Direct3D 12.
emul32     : true
builddeps  :
    - pkgconfig32(ncursesw)
    - pkgconfig32(vulkan)
    - pkgconfig32(x11)
    - pkgconfig32(xcb)
    - pkgconfig32(xcb-keysyms)
    - pkgconfig32(xcb-util)
    - perl-json
    - spirv-headers
    - vulkan-headers
setup      : |
    %configure --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license AUTHORS COPYING
check      : |
    %make check
