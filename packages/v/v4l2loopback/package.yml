# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : v4l2loopback
version    : 0.15.4
release    : 378
source     :
    - https://github.com/umlaeute/v4l2loopback/archive/v0.15.4.tar.gz : 21a17702648aa6a937b88a93bd71ef9f547815ead28719cafcfcc247396643dc
homepage   : https://github.com/umlaeute/v4l2loopback
license    : GPL-2.0-or-later
component  :
    - kernel.drivers
    - current : kernel.drivers
    - common : system.utils
summary    :
    - A kernel module to create V4L2 loopback devices
    - current : v4l2loopback package for linux-current
    - common : Common components for v4l2loopback packages
description: |
    A kernel module to create V4L2 loopback devices
builddeps  :
    - pkgconfig(libelf)
    - help2man
    - linux-current
    - linux-current-headers
    - linux-lts
    - linux-lts-headers
rundeps    :
    - current :
        - v4l2loopback-common
    - v4l2loopback-common
environment: |
    kernels=(
        %kernel_version_current%
        %kernel_version_lts%
    )
setup      : |
    pushd ..

    for _kernel in "${kernels[@]}"; do
        cp -ar v4l2loopback-${version} "${_kernel}"
    done
build      : |
    for _kernel in "${kernels[@]}"; do
        pushd "${_kernel}"
        %make KERNELRELEASE="${_kernel}"
        popd
    done
install    : |
    for _kernel in "${kernels[@]}"; do
        pushd "${_kernel}"
        %make \
            KERNELRELEASE="${_kernel}" \
            install-utils \
            install-man \
            DESTDIR="${installdir}" \
            PREFIX=%PREFIX%
        %install_exe "${package}.ko" -t "${installdir}/%libdir%/modules/${_kernel}/extra"
        %install_license COPYING
        popd
    done

    # Compress modules with zstd
    find "${installdir}" -name '*.ko' -exec strip --strip-debug {} \; -exec zstd {} \; -exec rm -v {} \;
patterns   :
    - common :
        - /usr/bin
        - /usr/share/man
        - /usr/share/licenses
    - current :
        - /usr/lib64/modules/*.current
permanent  :
    - /usr/lib64/modules
