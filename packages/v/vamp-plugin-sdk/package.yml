# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : vamp-plugin-sdk
version    : 2.10.0
release    : 7
source     :
    - https://github.com/vamp-plugins/vamp-plugin-sdk/archive/refs/tags/vamp-plugin-sdk-v2.10.tar.gz : 
        b552bc91817294c7f90ea07d70938642ebf15d5e3bafc81cf7d55efab9995399
homepage   : https://www.vamp-plugins.org/
license    : MIT
component  : programming.library
summary    : The Vamp audio analysis plug-in system
description: |
    The Vamp audio analysis plug-in system
builddeps  :
    - pkgconfig(sndfile)
setup      : |
    %patch -p1 -i $pkgfiles/01-fix_multiarch.patch
    %reconfigure
build      : |
    %make
install    : |
    %make_install
    # Doesn't accept --disable-static
    rm $installdir/usr/lib64/*.a
    %install_license COPYING
check      : |
    %make test
