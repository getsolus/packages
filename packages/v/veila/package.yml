# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : veila
version    : 0.5.0
release    : 1
source     :
    - https://github.com/naurissteins/Veila/archive/refs/tags/0.5.0.tar.gz : acd71bac2960a7689c64164646f5979d5ea43ce4a9043518f31892d6c50a793a
homepage   : https://naurissteins.com/veila
license    :
    - GPL-3.0-or-later
    - OFL-1.1
component  : desktop
summary    : Secure, elegant and fast Wayland screen locker
description: |
    Secure, elegant and fast Wayland screen locker.
networking : true
builddeps  :
    - pkgconfig(pam)
    - pkgconfig(wayland-client)
    - pkgconfig(xkbcommon)
    - rust
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Fix-PAM-dir-on-Solus.patch

    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install
    %install_license LICENSE

    # Veila assets
    %install_dir ${installdir}/usr/share/${package}
    cp -a --no-preserve=ownership \
        assets/fonts \
        assets/icons \
        assets/themes \
        ${installdir}/usr/share/${package}/

    # Systemd service
    %install_file -t ${installdir}/%libdir%/systemd/user assets/systemd/veila.service

    # PAM
    %install_file ${pkgfiles}/veila.pam ${installdir}/usr/share/defaults/etc/pam.d/${package}
check      : |
    %cargo_test -- \
        --skip config::tests::theme_mutation_safety_tests::theme_edit_rejects_read_only_config_symlink
