# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : volk
version    : 3.3.0
release    : 9
source     :
    - https://github.com/gnuradio/volk/releases/download/v3.3.0/volk-3.3.0.tar.xz : 10e9c26c8d9362f5cb14a58752116f4268dc107505a1d7f50efe4ba06d90982b
license    : GPL-3.0-or-later
homepage   : https://www.libvolk.org
component  : programming.library
summary    : VOLK is the Vector-Optimized Library of Kernels
description: |
    It is a library that contains kernels of hand-written SIMD code for different mathematical operations.
builddeps  :
    - pkgconfig(fmt)
    - mako
setup      : |
    %cmake_ninja
build      : |
    %cmake_build
install    : |
    %cmake_install

    rm -fr $installdir/%libdir%/libcpu_features.a
    %install_license COPYING
