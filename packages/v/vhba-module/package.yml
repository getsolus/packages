# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : vhba-module
version    : '20260313'
release    : 321
source     :
    - https://sourceforge.net/projects/cdemu/files/vhba-module/vhba-module-20260313.tar.xz#vhba-module.tar.xz : 293003bf5d9dc2b386db0d05f595c5548355a535d6dfc06fd379fd98bb190174
extract    : false
homepage   : https://cdemu.sourceforge.io/
license    : GPL-2.0-or-later
component  :
    - kernel.drivers
    - current : kernel.drivers
summary    : Provides the vhba_ctl device for CDemu
description: |
    Provides the vhba_ctl device for CDemu
builddeps  :
    - pkgconfig(libelf)
    - linux-current
    - linux-current-headers
    - linux-lts
    - linux-lts-headers
rundeps    :
    - current :
        - vhba-module-common
    - main :
        - vhba-module-common
environment: |
    kernels=(
        %kernel_version_current%
        %kernel_version_lts%
    )
setup      : |
    for _kernel in "${kernels[@]}"; do
        mkdir "${_kernel}"
        tar -xf ${sources}/vhba-module.tar.xz --strip-components=1 -C "${_kernel}"
    done
build      : |
    for _kernel in "${kernels[@]}"; do
        pushd "${_kernel}"
        KERNELRELEASE="${_kernel}" %make
        popd
    done
install    : |
    # Kernel modules
    for _kernel in "${kernels[@]}"; do
        pushd "${_kernel}"
        %install_file vhba.ko -t "${installdir}/%libdir%/modules/${_kernel}/extra/drivers/misc"

        # Install license here so we don't have to find the subdir
        %install_license COPYING
        popd
    done

    # common files
    %install_file ${pkgfiles}/60-udev.rules ${installdir}/%libdir%/udev/rules.d/60-vhba-module.rules
    %install_file ${pkgfiles}/modprobe ${installdir}/%libdir%/modules-load.d/vhba-module.conf

    # Compress modules with zstd
    find "${installdir}" -name '*.ko' -exec strip --strip-debug {} \; -exec zstd {} \; -exec rm -v {} \;

    # Usr-merge
    %install_dir ${installdir}/lib64
    pushd ${installdir}/usr
    file_list=()
    while IFS=  read -r -d $'\0'; do
        file_list+=("$REPLY")
    done < <(find lib64/modules -type f -print0)
    for file in "${file_list[@]}"; do
        parent=$(dirname "$file")
        %install_dir "${installdir}/${parent}"
        ln -srv "${installdir}/usr/${file}" "${installdir}/${file}"
    done
    popd
patterns   :
    - common :
        - /usr/lib64/udev
        - /usr/lib64/modules-load.d
        - /usr/share/licenses
    - current :
        - /lib64/modules/*.current
        - /usr/lib64/modules/*.current
permanent  :
    - /lib64/modules
    - /usr/lib64/modules
