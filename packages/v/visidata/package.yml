# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : visidata
version    : '3.5'
release    : 18
source     :
    - https://github.com/saulpw/visidata/archive/refs/tags/v3.5.tar.gz : 3e08fab9e3697983d0b2bf23718fc52445806779627190e5c2c595375ba97bb6
homepage   : https://www.visidata.org/
license    : GPL-3.0-only
component  : office.viewers
summary    : A terminal spreadsheet multitool for discovering and arranging data
description: |
    VisiData supports tsv, csv, sqlite, json, xlsx (Excel), hdf5, and many other formats.
builddeps  :
    - groff
    - man-db
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-dateutil
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_license LICENSE*
check      : |
    %pytest -q visidata/tests
