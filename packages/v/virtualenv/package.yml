# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : virtualenv
version    : 21.7.2
release    : 25
source     :
    - https://pypi.debian.net/virtualenv/virtualenv-21.7.2.tar.gz : 8bf688bd159b32c3bd6966555c5a2605a07724b93671c32cfe3e45ac28058987
homepage   : https://virtualenv.pypa.io/
license    : MIT
component  : programming.python
summary    : Tool to create isolated 'virtual' python environments
description: |
    virtualenv is a tool to create isolated python environments, allowing for easier management of versions and dependencies in Python applications.
builddeps  :
    - python-build
    - python-hatch-vcs
    - python-installer
    - python-wheel
rundeps    :
    - pip-wheel
    - python-discovery
    - python-distlib
    - python-filelock
    - python-platformdirs
    - python-setuptools-wheel
checkdeps  :
    - pip-wheel
    - python-discovery
    - python-distlib
    - python-filelock
    - python-flaky
    - python-platformdirs
    - python-pytest
    - python-pytest-mock
    - python-pytest-timeout
    - python-setuptools-wheel
    - tcsh
setup      : |
    %patch -p1 -i ${pkgfiles}/system-wheel.patch

    rm src/virtualenv/seed/wheels/embed/pip-*
    rm src/virtualenv/seed/wheels/embed/setuptools-*
build      : |
    %pyproject_build
install    : |
    %pyproject_install
