# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : virglrenderer
version    : 1.3.0
release    : 23
source     :
    - https://gitlab.freedesktop.org/virgl/virglrenderer/-/archive/virglrenderer-1.3.0/virglrenderer-virglrenderer-1.3.0.tar.gz : 56170f8caa1bb642a2624b649e3bcca095ec2834814e5c308efc8a85a709e4ce
homepage   : https://docs.mesa3d.org/drivers/virgl
license    : MIT
component  : virt
summary    : Allows KVM guests to render OpenGL 3D calls on the host GPU via mesa
description: |
    Virgil is a research project to investigate the possibility of creating a virtual 3D GPU for use inside qemu virtual machines, that allows the guest operating system to use the capabilities of the host GPU to accelerate 3D rendering. The plan is to have a guest GPU that is fully independent of the host GPU.
builddeps  :
    - pkgconfig(epoxy)
    - pkgconfig(gbm)
    - pkgconfig(libva)
    - pkgconfig(vulkan)
    - pkgconfig(x11)
    - vulkan-headers
checkdeps  :
    - pkgconfig(check)
setup      : |
    %meson_configure \
                     -Dtests=true \
                     -Dvenus=true \
                     -Dvideo=true
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
