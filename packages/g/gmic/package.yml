# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gmic
version    : 4.0.5
release    : 65
source     :
    - https://gmic.eu/files/source/gmic_4.0.5.tar.gz : c6771c48693ed615b2e85d1db7a9626358d4606eb2c75dcf009b2924f396da59
homepage   : https://gmic.eu/
license    :
    - CECILL-2.1
    - CECILL-C
component  :
    - multimedia.graphics
    - gimp : multimedia.graphics
summary    :
    - GREYC's Magic for Image Computing
    - gimp : G'MIC plugin for GIMP
description: |
    G'MIC is a full-featured open-source framework for image processing, distributed under the CeCILL free software licenses (LGPL-like and/or GPL-compatible). It provides several different user interfaces to convert / manipulate / filter / visualize generic image datasets, ranging from 1d scalar signals to 3d+t sequences of multi-spectral volumetric images, hence including 2d color images.
builddeps  :
    - pkgconfig(GraphicsMagick)
    - pkgconfig(OpenEXR)
    - pkgconfig(Qt6UiTools)
    - pkgconfig(eigen3)
    - pkgconfig(fftw3)
    - pkgconfig(gimp-3.0)
    - pkgconfig(hdf5)
    - pkgconfig(libcurl)
    - pkgconfig(libpng)
    - pkgconfig(libtiff-4)
    - pkgconfig(libturbojpeg)
    - pkgconfig(opencv4)
    - pkgconfig(xext)
rundeps    :
    - gimp : gmic
build      : |
    # Build gmic
    %cmake_ninja \
        -DBUILD_LIB_STATIC=OFF \
        -DENABLE_DYNAMIC_LINKING=ON \
        -DENABLE_OPENCV=ON
    %cmake_build

    # Temporary install so we can link gmic-qt
    DESTDIR="tmp-install" cmake --install solusBuildDir

    # Build GIMP and Krita plugins
    common_flags=(
        -DENABLE_DYNAMIC_LINKING=ON \
        -DGMIC_PATH=${workdir}/src \
        -DCMAKE_PREFIX_PATH=${workdir}/tmp-install/usr \
        -DBUILD_WITH_QT6=ON \
    )

    pushd gmic-qt
    for build in qt gimp; do
        qt_host="none"

        if [[ "${build}" == "gimp" ]]; then
            qt_host="gimp3"
        fi

        export LDFLAGS="$LDFLAGS -L../solusBuildDir"
        %cmake_ninja -B "build-${build}" \
            "${common_flags[@]}" \
            -DGMIC_QT_HOST="${qt_host}"

        BUILDDIR="build-${build}"
        %cmake_build
    done
    popd
install    : |
    %cmake_install
    %install_license COPYING

    %install_file -t ${installdir}/usr/share/gmic resources/gmic_cluts.gmz

    # Included by gmic.h:
    %install_file -t ${installdir}/usr/include src/gmic.cpp

    # Install GIMP and Krita plugins
    for build in qt gimp; do
        BUILDDIR="gmic-qt/build-${build}"
        %cmake_install
    done
patterns   :
    - gimp : /usr/lib64/gimp
