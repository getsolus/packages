# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : guile
version    : 3.0.11
release    : 15
source     :
    - https://mirrors.rit.edu/gnu/guile/guile-3.0.11.tar.xz : 818c79d236657a7fa96fb364137cc7b41b3bdee0d65c6174ca03769559579460
homepage   : https://www.gnu.org/software/guile
license    : LGPL-3.0-or-later
component  : programming.tools
emul32     : true
summary    : GNU Ubiquitous Intelligent Language for Extensions
builddeps  :
    - pkgconfig32(gmp)
    - pkgconfig32(libffi)
    - pkgconfig32(libxcrypt)
    - bdwgc-32bit-devel
    - libtool-32bit-devel
    - libunistring-32bit-devel
description: |
    Guile is the official extension language for GNU, designed to help programmers create flexible applications by allowing extension through plug-ins, modules, or scripts.
environment: export CFLAGS="${CFLAGS} -std=gnu17"
setup      : |
    %configure_no_runstatedir --disable-static --prefix=/usr
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING*
