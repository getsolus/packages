# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gajim
version    : 2.7.0
release    : 46
source     :
    - https://gajim.org/downloads/2.7/gajim-2.7.0.tar.gz : 8f893b527c22e3c87414aa6f3c7de51ced839959d26c520f8fb35d53f20df926
homepage   : https://gajim.org
license    : GPL-3.0-or-later
component  : network.im
summary    : Full featured and easy to use Jabber/XMPP client
description: |
    The goal of Gajim is to provide a full featured and easy to use Jabber/XMPP client.
builddeps  :
    - python-build
    - python-installer
    - python-packaging
    - python-setuptools
    - python-wheel
rundeps    :
    - farstream              # Audio/Video.
    - gstreamer-plugin-libav # Audio/Video.
    - gstreamer-plugins-ugly # Audio/Video.
    - libgtksourceview5
    - python-css-parser
    - python-emoji
    - python-gssapi
    - python-hpack
    - python-httpx2
    - python-hyperframe
    - python-keyring
    - python-nbxmpp
    - python-omemo-dr
    - python-openssl
    - python-pillow
    - python-pysequoia
    - python-qrcode
    - python-sqlalchemy
    - python-truststore
setup      : |
    ./make.py build --dist unix
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    $workdir/make.py install --dist unix --prefix=$installdir/usr

    # Move locales to the system path
    mv $installdir/usr/lib/python%python3_version%/site-packages/gajim/data/locale $installdir/usr/share
    ln -sv /usr/share/locale $installdir/usr/lib/python%python3_version%/site-packages/gajim/data/locale

    %install_license COPYING
