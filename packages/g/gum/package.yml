# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gum
version    : 2.0.0
release    : 6
source     :
    - https://github.com/charmbracelet/gum/archive/refs/tags/v2.0.0.tar.gz : 8a5baa1e1647cdc3f7fdf91939de5372791ab133117416c8e3d944afbf0b3c9c
homepage   : https://charm.land/
license    : MIT
component  : programming.tools
summary    : A tool for glamorous shell scripts
description: |
    Effects include
    choose     Choose an option from a list of choices
    confirm    Ask a user to confirm an action
    file       Pick a file from a folder
    filter     Filter items from a list
    format     Format a string using a template
    input      Prompt for some input
    join       Join text vertically or horizontally
    pager      Scroll through a file
    spin       Display spinner while running a command
    style      Apply coloring, borders, spacing to text
    table      Render a table of data
    write      Prompt for long-form text
    log        Log messages to output
networking : true
builddeps  :
    - golang
build      : |
    export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"
    go build -v -o build/gum \
        -ldflags="-linkmode=external -X=main.Version=$version"

    # Build man page
    ./build/gum man > build/gum.1
    # Reproducible man page date
    source_date=$(date -d "@$SOURCE_DATE_EPOCH" +"%Y-%m-%d")
    sed \
        -i build/gum.1 \
        -e "s|\"[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\"|\"$source_date\"|"

    # Completions
    for shell in bash fish zsh; do
        ./build/gum completion "$shell" > "build/$shell-completion"
    done
install    : |
    %install_bin build/gum
    %install_file build/gum.1 -t ${installdir}/usr/share/man/man1/

    # Completions
    %install_file build/bash-completion ${installdir}/usr/share/bash-completion/completions/gum
    %install_file build/zsh-completion ${installdir}/usr/share/zsh/site-functions/_gum
    %install_file build/fish-completion ${installdir}/usr/share/fish/vendor_completions.d/gum.fish

    %install_file README.md ${installdir}/usr/share/docs/gum/README.md
    %install_license LICENSE
