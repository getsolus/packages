# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gnome-maps
version    : '50.4'
release    : 77
source     :
    - https://download.gnome.org/sources/gnome-maps/50/gnome-maps-50.4.tar.xz : 45308c1e4ecae8ef1d356e88d97a10671ffe8030e9f897f9c2c8b2b96935434a
homepage   : https://apps.gnome.org/Maps/
license    : GPL-2.0-or-later
component  : office
summary    : Find places around the world
description: |
    Maps gives you quick access to maps all across the world. It allows you to quickly find the place you’re looking for by searching for a city or street, or locate a place to meet a friend. Maps uses the collaborative OpenStreetMap database, made by hundreds of thousands of people across the globe.
builddeps  :
    - pkgconfig(geoclue-2.0)
    - pkgconfig(gjs-1.0)
    - pkgconfig(gweather4)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libportal)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(rest-1.0)
    - pkgconfig(shumate-1.0)
    - blueprint-compiler
    - desktop-file-utils
rundeps    :
    - geoclue
    - gjs
    - libgeocode-glib2
    - libgweather
    - librest
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
