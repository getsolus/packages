# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gimp
version    : 3.2.8
release    : 99
source     :
    - https://download.gimp.org/gimp/v3.2/gimp-3.2.8.tar.xz : 16a2696cadc9e03a2ef97ccb895e062f654cb2b8211fb57074db85f26646c847
homepage   : https://www.gimp.org/
license    : GPL-3.0-or-later
component  : multimedia.graphics
summary    : GNU Image Manipulation Program
description: |
    GIMP is a mature image editor with many advanced features and plugin support.
builddeps  :
    - pkgconfig(OpenEXR)
    - pkgconfig(alsa)
    - pkgconfig(appstream)
    - pkgconfig(bzip2)
    - pkgconfig(cfitsio)
    - pkgconfig(dbus-glib-1)
    - pkgconfig(gegl-0.4)
    - pkgconfig(gexiv2)
    - pkgconfig(gjs-1.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(lcms2)
    - pkgconfig(libarchive)
    - pkgconfig(libcurl)
    - pkgconfig(libexif)
    - pkgconfig(libheif)
    - pkgconfig(libjxl)
    - pkgconfig(libmypaint)
    - pkgconfig(libopenjp2)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libtiff-4)
    - pkgconfig(libturbojpeg)
    - pkgconfig(libwebp)
    - pkgconfig(mypaint-brushes-2.0)
    - pkgconfig(poppler)
    - pkgconfig(pygobject-3.0)
    - pkgconfig(xmu)
    - pkgconfig(xpm)
    - aalib-devel
    - ghostscript-devel
    - gi-docgen
    - glib-networking
    - poppler-utils
rundeps    :
    - mypaint-brushes
    - python-gobject
    - xdg-utils
environment: |
    export CFLAGS+=" -Wno-implicit-function-declaration -Wno-int-conversion"
setup      : |
    %patch -p1 -i ${pkgfiles}/girepository-2.0.patch

    %meson_configure \
        -Dcheck-update=no \
        -Dbug-report-url='https://github.com/getsolus/packages/issues'
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING LICENSE
