# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : geos
version    : 3.15.0
release    : 7
source     :
    - https://github.com/libgeos/geos/archive/refs/tags/3.15.0.tar.gz : 134aaf78026f4311737e20ff1465cd31a48c4ca8858fb68e99d13ccd3d52753a
homepage   : https://trac.osgeo.org/geos
license    : LGPL-2.1-only
component  : programming
summary    : GEOS - Geometry Engine, Open Source
description: |
    GEOS (Geometry Engine - Open Source) is a C++ port of the JTS Topology Suite (JTS). It includes the OpenGIS Simple Features for SQL spatial predicate functions and spatial operators, as well as specific JTS enhanced topology functions.
libsplit   : false
setup      : |
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
check      : |
    %ninja_check
patterns   :
    - devel :
        - /usr/bin/geos-config
