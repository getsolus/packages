# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gspell
version    : 1.14.6
release    : 37
source     :
    - https://download.gnome.org/sources/gspell/1.14/gspell-1.14.6.tar.xz : d02a6f1ff3cf324798f184062a6777302ef4b325deab277d8469d3816c69282d
homepage   : https://gitlab.gnome.org/GNOME/gspell
license    : LGPL-2.1-or-later
component  : desktop.gnome.core
summary    : GTK+ Spell Checker Library
description: |
    GTK+ Spell Checker Library
optimize   :
    - lto
builddeps  :
    - pkgconfig(enchant-2)
    - pkgconfig(gobject-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(icu-i18n)
    - gtk-doc
    - vala
setup      : |
    %meson_configure -Dinstall_tests=false
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
