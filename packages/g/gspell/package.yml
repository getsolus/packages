# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gspell
version    : 1.14.5
release    : 36
source     :
    - https://download.gnome.org/sources/gspell/1.14/gspell-1.14.5.tar.xz : 788783b56fc3d03283b3aa29302d0b958aeca88835e10b1ec61f19e0efc7e8a4
homepage   : https://gitlab.gnome.org/GNOME/gspell
license    : LGPL-2.1-or-later
component  : desktop.gnome.core
summary    : GTK+ Spell Checker Library
description: |
    GTK+ Spell Checker Library
optimize   :
    - lto
builddeps  :
    - pkgconfig(enchant-2)
    - pkgconfig(gobject-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(icu-i18n)
    - gtk-doc
    - vala
setup      : |
    %meson_configure -Dinstall_tests=false
build      : |
    %ninja_build
install    : |
    %ninja_install
