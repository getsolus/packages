# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gspell
version    : 1.14.4
release    : 35
source     :
    - https://download.gnome.org/sources/gspell/1.14/gspell-1.14.4.tar.xz : e73a89d68c70f8748aefb6b0f5cfdfec3ff173cf4449837fd6cb17d1e9fcf486
homepage   : https://gitlab.gnome.org/GNOME/gspell
license    : LGPL-2.1-or-later
component  : desktop.gnome.core
summary    : GTK+ Spell Checker Library
description: |
    GTK+ Spell Checker Library
optimize   :
    - lto
builddeps  :
    - pkgconfig(enchant-2)
    - pkgconfig(gobject-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(icu-i18n)
    - gtk-doc
    - vala
setup      : |
    %meson_configure -Dinstall_tests=false
build      : |
    %ninja_build
install    : |
    %ninja_install
