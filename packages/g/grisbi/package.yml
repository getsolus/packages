# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : grisbi
version    : 3.92.0
release    : 21
source     :
    - https://github.com/grisbi/grisbi/archive/refs/tags/upstream_version_3_92_0.tar.gz : fbffd7eae1362419555d4511f7f26b852913880dba1ce203ab076575ce9ed5dc
homepage   : https://www.grisbi.org/
license    : GPL-2.0-or-later
component  : office.finance
summary    : Personal finance manager
description: |
    Grisbi is a personal accounting application capable of managing multiple accounts, currencies and users.Grisbi is a personal accounting application capable of managing multiple accounts, currencies and users.
builddeps  :
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libgoffice-0.10)
    - pkgconfig(libofx)
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |-
    %ninja_install
    %install_license COPYING

    # Remove French documentation
    rm -rf ${installdir}/usr/share/doc/grisbi/fr
