# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gtklock
version    : 5.0.1
release    : 2
source     :
    - https://github.com/jovanlanik/gtklock/archive/refs/tags/v5.0.1.tar.gz : b51bce5d81643dc3dcb422554d28e919f95d418ef54a082509763dfb6fdfb145
homepage   : https://github.com/jovanlanik/gtklock
license    : GPL-3.0-only
component  : desktop
summary    : GTK-based lockscreen for Wayland
description: |
    gtklock is a lockscreen based on gtkgreet. It uses the ext-session-lock Wayland protocol. Works on sway and other wlroots-based compositors.
builddeps  :
    - pkgconfig(gmodule-export-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(gtk-session-lock-0)
    - pkgconfig(pam)
    - scdoc
setup      : |
    %meson_configure \
        --sysconfdir=/usr/share/defaults/etc
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSE
