# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gtk-vnc
version    : 1.6.0
release    : 30
source     :
    - https://download.gnome.org/sources/gtk-vnc/1.6/gtk-vnc-1.6.0.tar.xz : 0e1a1023f191a842e994e5d10053bbe0e76d5f5fb9ec2eb525e2f8fdea57347f
homepage   : https://gitlab.gnome.org/GNOME/gtk-vnc
license    : LGPL-2.1-or-later
component  : desktop.gnome.core
summary    : GTK VNC viewer widget
description: |
    gtk-vnc is a VNC viewer widget for GTK. It is built using coroutines allowing it to be completely asynchronous while remaining single threaded. It provides a core C library, and bindings for Python (PyGTK).
builddeps  :
    - pkgconfig(gnutls)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libpulse)
    - pkgconfig(libsasl2)
    - pkgconfig(python3)
    - pkgconfig(x11)
    - vala
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING.LIB
