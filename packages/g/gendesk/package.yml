# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gendesk
version    : 1.0.15
release    : 2
source     :
    - https://roboticoverlords.org/gendesk/gendesk-1.0.15.tar.xz : 0d33bf249322c8445a800be146b9c2f86cf3ede5fc18b894ffce257fdf709b99
    - https://roboticoverlords.org/images/gendesk.png : 4d96eded48e536d02e35727c36dc20844c2e44654e81baf78e10aee4eb48e837
homepage   : https://gendesk.roboticoverlords.org/
license    : MIT
summary    : Utility for generating desktop files by specifying a minimum of information
description: |
    Utility for generating desktop files by specifying a minimum of information
builddeps  :
    - golang
build      : |
    go build -v -mod=vendor -trimpath -buildmode=pie -ldflags="-s -w -extldflags '$LDFLAGS'"
install    : |
    %install_bin gendesk
    %install_file gendesk.1.gz ${installdir}/usr/share/man/man1/gendesk.1.gz
    %install_file ${sources}/gendesk.png ${installdir}/usr/share/pixmaps/gendesk.png
    %install_license LICENSE
