# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gnome-sushi
version    : '51.2'
release    : 26
source     :
    - https://download.gnome.org/sources/sushi/51/sushi-51.2.tar.xz : 928c0155bd5664098bdb4d591806e70e8219a4b66bf46c95382f72589e4e9a6e
homepage   : https://gitlab.gnome.org/GNOME/sushi
license    : GPL-2.0-or-later
component  : desktop.gnome
summary    : Sushi is a quick previewer for Nautilus
description: |
    Sushi is a quick previewer for Nautilus.
builddeps  :
    - pkgconfig(gjs-1.0)
    - pkgconfig(glycin-gtk4-2)
    - pkgconfig(gstreamer-audio-1.0)
    - pkgconfig(gtksourceview-5)
    - pkgconfig(papers-document-4.0)
    - pkgconfig(webkitgtk-6.0)
    - blueprint-compiler
rundeps    :
    - gjs
    - libgtksourceview4
    - papers-previewer
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
