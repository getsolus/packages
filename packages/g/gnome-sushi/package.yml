# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gnome-sushi
version    : '51.1'
release    : 24
source     :
    - https://download.gnome.org/sources/sushi/51/sushi-51.1.tar.xz : d326ec69fc004be3a5fc048f7ecf2c8eb828b7d8b682f1e7a2ba01a5e72993e1
homepage   : https://gitlab.gnome.org/GNOME/sushi
license    : GPL-2.0-or-later
component  : desktop.gnome
summary    : Sushi is a quick previewer for Nautilus
description: |
    Sushi is a quick previewer for Nautilus.
builddeps  :
    - pkgconfig(gjs-1.0)
    - pkgconfig(glycin-gtk4-2)
    - pkgconfig(gstreamer-audio-1.0)
    - pkgconfig(gtksourceview-5)
    - pkgconfig(papers-document-4.0)
    - pkgconfig(webkitgtk-6.0)
    - blueprint-compiler
rundeps    :
    - gjs
    - libgtksourceview4
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
