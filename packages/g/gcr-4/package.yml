# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gcr-4
version    : 4.4.1
release    : 13
source     :
    - https://download.gnome.org/sources/gcr/4.4/gcr-4.4.1.tar.xz : c4442c15d4330f17a1f5194df08c576877af68412ab2521446a93bd5e24c931b
homepage   : https://gitlab.gnome.org/GNOME/gcr
license    : GPL-3.0-or-later
component  : desktop.gnome.core
summary    :
    - The Gcr package contains libraries used for displaying certificates and accessing key stores. It also provides the viewer for crypto files on the GNOME Desktop.
    - preset : Preset to enable the Gcr SSH socket by default
description: |
    The Gcr package contains libraries used for displaying certificates and accessing key stores. It also provides the viewer for crypto files on the GNOME Desktop.
builddeps  :
    - pkgconfig(gnutls)
    - pkgconfig(gtk4)
    - pkgconfig(libsecret-1)
    - pkgconfig(p11-kit-1)
    - gnupg
    - openssh
    - vala
setup      : |
    %meson_configure -Dgtk_doc=false -Dcrypto=gnutls
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING

    install -Dm00644 -t ${installdir}/%libdir%/systemd/user-preset/ ${pkgfiles}/60-gcr4.preset
patterns   :
    - preset :
        - /usr/lib64/systemd/user-preset
