# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gnome-chess
version    : '50.1'
release    : 40
source     :
    - https://download.gnome.org/sources/gnome-chess/50/gnome-chess-50.1.tar.xz : dc29a330b8157cfac8d04a24c1afa848b6f0f4792454d8479d2bfeb7a3519298
homepage   : https://gitlab.gnome.org/GNOME/gnome-chess
license    : GPL-2.0-or-later
component  : games.strategy
summary    : GNOME Chess Game
description: |
    GNOME Chess is a 2D chess game, where games can be played between a combination of human and computer players. GNOME Chess detects known third party chess engines for computer players.
optimize   :
    - lto
builddeps  :
    - pkgconfig(glu)
    - pkgconfig(libadwaita-1)
    - pkgconfig(librsvg-2.0)
    - desktop-file-utils
    - itstool
    - vala
rundeps    :
    - gnuchess
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
