# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : granite-6
version    : 6.2.0
release    : 1
source     :
    - https://github.com/elementary/granite/archive/refs/tags/6.2.0.tar.gz : 067d31445da9808a802fca523630c3e4b84d2d7c78ae547ced017cb7f3b9c6b5
homepage   : https://github.com/elementary/granite
license    : LGPL-3.0-or-later
component  :
    - demo : programming.library
    - programming.library
summary    :
    - demo : Demo for Granite
    - elementary Development Library/Framework
description: |
    An extension to GTK+ that provides several useful widgets and classes to ease application development.
builddeps  :
    - pkgconfig(gee-0.8)
    - pkgconfig(gtk+-3.0)
    - vala
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
patterns   :
    - demo :
        - /usr/bin/granite-demo
        - /usr/share/applications
        - /usr/share/metainfo
