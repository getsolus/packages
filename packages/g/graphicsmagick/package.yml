# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : graphicsmagick
version    : 1.3.48
release    : 34
source     :
    - https://sourceforge.net/projects/graphicsmagick/files/graphicsmagick/1.3.48/GraphicsMagick-1.3.48.tar.xz : 9218eb78179110f91371066ab75cb3b4dd034b9bb464b29ce9bab7a11979232b
homepage   : https://graphicsmagick.sourceforge.io/index.html
license    :
    - BSD-2-Clause
    - MIT
component  : multimedia.graphics
summary    : GraphicsMagick provides a set of commandline tools and programming APIs for manipulating, editing, and converting raster and vector images.
description: |
    GraphicsMagick provides a set of commandline tools and programming APIs for manipulating, editing, and converting raster and vector images. It is derived from ImageMagick, with the objective of providing better stability and performance than ImageMagick.
builddeps  :
    - pkgconfig(bzip2)
    - pkgconfig(freetype2)
    - pkgconfig(lcms2)
    - pkgconfig(libjpeg)
    - pkgconfig(libjxl)
    - pkgconfig(libpng)
    - pkgconfig(libtiff-4)
    - pkgconfig(libwebp)
    - pkgconfig(x11)
lastrip    : false
setup      : |
    %reconfigure \
        --disable-static \
        --enable-shared=yes \
        --with-modules \
        --with-quantum-depth=16
build      : |
    %make
install    : |
    %make_install
check      : |
    %make check
