# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gnome-backgrounds
version    : '51.0'
release    : 25
source     :
    - https://download.gnome.org/sources/gnome-backgrounds/51/gnome-backgrounds-51.0.tar.xz : 5811d24118d78f41b66c616efb1094c20507cb546e484dca4963fe738a4ba7db
homepage   : https://gitlab.gnome.org/GNOME/gnome-backgrounds
license    :
    - CC-BY-SA-3.0
    - GPL-2.0-or-later
component  : desktop.gnome
summary    : Default GNOME artwork
description: |
    Default GNOME artwork
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    install -m00644 $pkgfiles/*.jpg -t $installdir/usr/share/backgrounds/gnome/
