# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gnome-backgrounds
version    : 51.0.1
release    : 26
source     :
    - https://download.gnome.org/sources/gnome-backgrounds/51/gnome-backgrounds-51.0.1.tar.xz : 
        ec50534d7749be0e1503c5504f826c61d1460d2b41cb84518fa6b2f5547d1e1e
homepage   : https://gitlab.gnome.org/GNOME/gnome-backgrounds
license    :
    - CC-BY-SA-3.0
    - GPL-2.0-or-later
component  : desktop.gnome
summary    : Default GNOME artwork
description: |
    Default GNOME artwork
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    install -m00644 $pkgfiles/*.jpg -t $installdir/usr/share/backgrounds/gnome/
