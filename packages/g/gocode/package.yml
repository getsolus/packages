# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gocode
version    : 1.6.1
release    : 3
source     :
    - git|https://github.com/visualfc/gocode.git : v1.6.1
homepage   : https://github.com/visualfc/gocode
license    : MIT
component  : programming.tools
summary    : Gocode is a golang code autocomplete support for LiteIDE.
description: |
    Gocode is a golang code autocomplete support for LiteIDE.
networking : true
builddeps  :
    - golang
rundeps    :
    - golang
build      : |
    go build -o gocode
install    : |
    %install_bin gocode
    %install_license LICENSE
