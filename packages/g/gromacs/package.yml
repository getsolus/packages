# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gromacs
version    : '2026.3'
release    : 12
source     :
    - https://ftp.gromacs.org/pub/gromacs/gromacs-2026.3.tar.gz : 1094b7bbc6a3960223827114626657110b40096cdf9598a727935fc84ebf8aa0
homepage   : https://www.gromacs.org/
license    : LGPL-2.1-or-later
component  : office.scientific
summary    : GROMACS is a versatile package to perform molecular dynamics
description: |
    GROMACS is a versatile package to perform molecular dynamics, i.e. simulate the Newtonian equations of motion for systems with hundreds to millions of particles.
avx2       : true
optimize   : avx256
builddeps  :
    - pkgconfig(fftw3f)
    - pkgconfig(lapack)
    - pkgconfig(muparser)
    - pkgconfig(openblas)
    - pkgconfig(x11)
setup      : |
    if [[ ! -z "${AVX2BUILD}" ]]; then
      export _target="AVX2_256"
    else
      export _target="SSE2"
    fi
    %cmake -DGMX_SIMD=${_target} \
           -DGMX_USE_MUPARSER=EXTERNAL \
           -DGMX_X11=1
build      : |
    %make -C solusBuildDir
install    : |
    %make_install -C solusBuildDir
    %install_license COPYING
check      : |
    %make check -C solusBuildDir
