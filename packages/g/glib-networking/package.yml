# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : glib-networking
version    : 2.90.0
release    : 51
source     :
    - https://download.gnome.org/sources/glib-networking/2.90/glib-networking-2.90.0.tar.xz : 83a75e3d9c36b66ee86d3281c2fc997816101968a5126ba322b2acb9a74dd8c0
homepage   : https://gitlab.gnome.org/GNOME/glib-networking
license    : LGPL-2.1-or-later
component  : network.base
summary    : The GLib Networking package contains Network related gio modules for GLib.
description: |
    The GLib Networking package contains Network related gio modules for GLib.
emul32     : true
builddeps  :
    - pkgconfig32(glib-2.0)
    - pkgconfig32(gnutls)
    - pkgconfig32(libtasn1)
    - pkgconfig32(nettle)
    - pkgconfig32(openssl)
    - pkgconfig(libproxy-1.0)
    - pkgconfig(libtasn1)
    - libtool-32bit
    - libunistring-32bit-devel
setup      : |
    if [[ ! -z "${EMUL32BUILD}" ]]; then
        proxy_setting="disabled"
    else
        proxy_setting="enabled"
    fi

    %meson_configure \
           -Dgnome_proxy=disabled \
           -Dinstalled_tests=false \
           -Dlibproxy=$proxy_setting \
           -Dopenssl="enabled" 
build      : |
    unset LD_AS_NEEDED
    %ninja_build
install    : |
    unset LD_AS_NEEDED
    %ninja_install
