# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gzip
version    : '1.15'
release    : 22
source     :
    - https://mirror.team-cymru.com/gnu/gzip/gzip-1.15.tar.gz : 545886cf57fa88a65e967fbf705903d7fcb2567c82c7342493e82e8d7b1a210b
homepage   : https://www.gnu.org/software/gzip/
license    : GPL-3.0-or-later
summary    : gzip (Compression utility)
component  : system.base
description: |
    gzip (GNU zip) is a compression utility designed to replace compress. gzip was written by Jean-loup Gailly (jloup@gzip.org) and Mark Adler.
optimize   :
    - speed
    - lto
setup      : |
    %reconfigure
build      : |
    %make
profile    : |
    %make check
install    : |
    %make_install
    %install_license COPYING
check      : |
    %make check
