# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : geode-gem
version    : 1.0.0
release    : 1
source     :
    - https://archives.kawateam.dev/geode-gem/geode_gem-1.0.0.tar.gz : ed910cf8a426a7e4a74613011b90eb9c8bef0d9f360a8012bab0f498b456973b
homepage   : https://geode.kawateam.dev/
license    : GPL-3.0-or-later
component  : games.emulator
summary    : Graphical Emulators Manager
description: |
    Geode-Gem is a graphical interface made with Python and Gtk+3 for the GNU/Linux system. It was designed to manage collection of games without the burden to add each game one by one.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - libgtksourceview4
    - python-gobject
    - python-setuptools
    - pyxdg
setup      : |
    %pyproject_build
install    : |
    %pyproject_install
    # Install desktop, metainfo and icon files
    %install_file ${pkgfiles}/geode-gem.desktop -t $installdir/usr/share/applications/
    %install_file ${pkgfiles}/dev.kawateam.geode.gem.metainfo.xml -t $installdir/usr/share/metainfo/
    for i in 16 32 64 96 256; do
        %install_file geode_gem/data/icons/geode-gem-$i.png "${installdir}/usr/share/icons/hicolor/${i}x$i/apps/dev.kawateam.geode.gem.png"
    done
replaces   :
  - gem
