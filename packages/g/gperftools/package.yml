# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gperftools
version    : 2.18.1
release    : 8
source     :
    - https://github.com/gperftools/gperftools/releases/download/gperftools-2.18.1/gperftools-2.18.1.tar.gz : d18d919175f9e4d740ace6b52f0f4f91284160c454e91b36ffd6456282a02206
homepage   : https://github.com/gperftools/gperftools
license    : BSD-3-Clause
component  : programming.tools
summary    : gperftools (originally Google Performance Tools)
description: |
    gperftools is a collection of a high-performance multi-threaded malloc() implementation, plus some pretty nifty performance analysis tools.
builddeps  :
    - pkgconfig32(libunwind)
emul32     : true
patterns   :
    - docs : /usr/share/doc
setup      : |
    %reconfigure --prefix=/usr \
               --disable-static
build      : |
    %make
install    : |
    %make_install
