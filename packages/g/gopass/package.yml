# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gopass
version    : 1.17.4
release    : 46
source     :
    - https://github.com/gopasspw/gopass/archive/refs/tags/v1.17.4.tar.gz#gopass.tar.gz : abf3f67e6e2ffa09b802203d1dce324859edbcbaf3f1d95fea6f41118c11d1a0
    - https://github.com/gopasspw/git-credential-gopass/archive/refs/tags/v1.17.4.tar.gz#git-credential-gopass.tar.gz : 115d1a10dc5356f094b6159cc346d81e2f4abae55c1ad03b697f2427e68b748f
    - https://github.com/gopasspw/gopass-hibp/archive/refs/tags/v1.17.4.tar.gz#gopass-hibp.tar.gz : 4ef22b4b73fa70ab858664d462abe23469199d7d8e85316bc81b77edfd9eb0fa
    - https://github.com/gopasspw/gopass-jsonapi/archive/refs/tags/v1.17.4.tar.gz#gopass-jsonapi.tar.gz : 5cc12a3894a60fc3b0233344636638fcb04a0e834912247160e333878a60e37f
    - https://github.com/gopasspw/gopass-summon-provider/archive/refs/tags/v1.17.4.tar.gz#gopass-summon-provider.tar.gz : 276eb9d4fb526b9348dcd1dea91f70dd1d08fc5cb9f364bbaf2394c983bbc905
homepage   : https://www.gopass.pw
license    : MIT
component  : security
networking : true
summary    : The slightly more awesome standard unix password manager for teams
description: |
    gopass is a rewrite of the pass password manager in Go with the aim of making it cross-platform and adding additional features.
builddeps  :
    - golang
rundeps    :
    - git
    - gnupg
    - xdotool
    - xsel
setup      : |
    mkdir -p integrations
    for i in git-credential-gopass gopass-{hibp,jsonapi,summon-provider}; do
        tar -x -C integrations -f $sources/$i.tar.gz
    done
build      : |
    %make
    for i in integrations/*; do
        pushd $i; go mod tidy; popd
        %make -C $i
    done
install    : |
    %make_install PREFIX=/usr
    for i in integrations/*; do
        %make_install -C $i PREFIX=/usr
    done

    # Set correct permission bits for the shell completion files
    chmod 644 $installdir/usr/share/zsh/site-functions/_gopass
    chmod 644 $installdir/usr/share/bash-completion/completions/gopass
    chmod 644 $installdir/usr/share/fish/vendor_completions.d/gopass.fish

    %install_license LICENSE
