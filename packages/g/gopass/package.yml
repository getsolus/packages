# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gopass
version    : 1.17.3
release    : 45
source     :
    - https://github.com/gopasspw/gopass/archive/refs/tags/v1.17.3.tar.gz#gopass.tar.gz : ed7f594a23893c99f027927fb15c4d8d5a7f27f9e351decee3530f7ad22a0386
    - https://github.com/gopasspw/git-credential-gopass/archive/refs/tags/v1.17.3.tar.gz#git-credential-gopass.tar.gz : 5b5d017234eb59c153ec29b6ea3dcec78e12934a344c519e4bb90cadafbe75a8
    - https://github.com/gopasspw/gopass-hibp/archive/refs/tags/v1.17.3.tar.gz#gopass-hibp.tar.gz : 589525247a8f6a9c13b70d39cfaecda2abebdc185e97c04631b05763325e2672
    - https://github.com/gopasspw/gopass-jsonapi/archive/refs/tags/v1.17.3.tar.gz#gopass-jsonapi.tar.gz : 4b2c0fc019b2667af845202059103f70d684d924a5dc0590469f825ca7d251d3
    - https://github.com/gopasspw/gopass-summon-provider/archive/refs/tags/v1.17.3.tar.gz#gopass-summon-provider.tar.gz : 095b7c6570852c66d59701517b7c8802c3d750a810774191995978998b976451
homepage   : https://www.gopass.pw
license    : MIT
component  : security
networking : true
summary    : The slightly more awesome standard unix password manager for teams
description: |
    gopass is a rewrite of the pass password manager in Go with the aim of making it cross-platform and adding additional features.
builddeps  :
    - golang
rundeps    :
    - git
    - gnupg
    - xdotool
    - xsel
setup      : |
    mkdir -p integrations
    for i in git-credential-gopass gopass-{hibp,jsonapi,summon-provider}; do
        tar -x -C integrations -f $sources/$i.tar.gz
    done
build      : |
    %make
    for i in integrations/*; do
        pushd $i; go mod tidy; popd
        %make -C $i
    done
install    : |
    %make_install PREFIX=/usr
    for i in integrations/*; do
        %make_install -C $i PREFIX=/usr
    done

    # Set correct permission bits for the shell completion files
    chmod 644 $installdir/usr/share/zsh/site-functions/_gopass
    chmod 644 $installdir/usr/share/bash-completion/completions/gopass
    chmod 644 $installdir/usr/share/fish/vendor_completions.d/gopass.fish

    %install_license LICENSE
