# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gopass
version    : 1.17.5
release    : 47
source     :
    - https://github.com/gopasspw/gopass/archive/refs/tags/v1.17.5.tar.gz#gopass.tar.gz : c098cad3a55d7c1021b84e12e8a2c0d6bf67f72b234902218b1413b2c01af95a
    - https://github.com/gopasspw/git-credential-gopass/archive/refs/tags/v1.17.5.tar.gz#git-credential-gopass.tar.gz : 3f6f71d1b8220b2cc9bc4eeb154127b91979ac0fac43e99f9c0ef89a210bdbf3
    - https://github.com/gopasspw/gopass-hibp/archive/refs/tags/v1.17.5.tar.gz#gopass-hibp.tar.gz : fa83f213737cbdbfd21d22290915e0a11ee5a398f7566e10a5051e4fe53577a9
    - https://github.com/gopasspw/gopass-jsonapi/archive/refs/tags/v1.17.5.tar.gz#gopass-jsonapi.tar.gz : 1c04aa5497c8597a4caa689387ee4e625575ad3db82a1ff89f9d57f75eac1c0a
    - https://github.com/gopasspw/gopass-summon-provider/archive/refs/tags/v1.17.5.tar.gz#gopass-summon-provider.tar.gz : 764cf0d523c5f411091e8f913176edd0f404a0d5e537f414e80c26a8696bca65
homepage   : https://www.gopass.pw
license    : MIT
component  : security
networking : true
summary    : The slightly more awesome standard unix password manager for teams
description: |
    gopass is a rewrite of the pass password manager in Go with the aim of making it cross-platform and adding additional features.
builddeps  :
    - golang
rundeps    :
    - git
    - gnupg
    - xdotool
    - xsel
setup      : |
    mkdir -p integrations
    for i in git-credential-gopass gopass-{hibp,jsonapi,summon-provider}; do
        tar -x -C integrations -f $sources/$i.tar.gz
    done
build      : |
    %make
    for i in integrations/*; do
        pushd $i; go mod tidy; popd
        %make -C $i
    done
install    : |
    %make_install PREFIX=/usr
    for i in integrations/*; do
        %make_install -C $i PREFIX=/usr
    done

    # Set correct permission bits for the shell completion files
    chmod 644 $installdir/usr/share/zsh/site-functions/_gopass
    chmod 644 $installdir/usr/share/bash-completion/completions/gopass
    chmod 644 $installdir/usr/share/fish/vendor_completions.d/gopass.fish

    %install_license LICENSE
