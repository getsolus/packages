# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : guvcview
version    : 2.2.2
release    : 29
source     :
    - https://sourceforge.net/projects/guvcview/files/source/guvcview-src-2.2.2.tar.bz2 : 6a1b1348b99e79da957a0d9e237395a54757a09db7e0c0809f6c30668b69da3b
homepage   : https://guvcview.sourceforge.net/
license    : GPL-3.0-or-later
component  : multimedia.video
summary    : Simple GTK interface for capturing and viewing video from devices
description: |
    Simple GTK interface for capturing and viewing video from devices
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(gsl)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libavcodec)
    - pkgconfig(libpng)
    - pkgconfig(libpulse)
    - pkgconfig(libudev)
    - pkgconfig(libusb-1.0)
    - pkgconfig(libv4l2)
    - pkgconfig(portaudio-2.0)
    - pkgconfig(sdl2)
setup      : |
    %patch -p1 -i $pkgfiles/0005-data-guvcview.appdata.xml.in-Fix-format.patch
    %patch -p0 -i $pkgfiles/desktop-standard-icon-loc.patch
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING

    # Move appstream to non-deprecated location
    %install_file $installdir/usr/share/appdata/guvcview.appdata.xml \
                $installdir/usr/share/metainfo/guvcview.metainfo.xml
    rm -frv $installdir/usr/share/appdata

    # Move icon to non-deprecated location
    %install_file $installdir/usr/share/pixmaps/guvcview.png -t \
                $installdir/usr/share/icons/hicolor/128x128/apps/
    rm -frv $installdir/usr/share/pixmaps/
