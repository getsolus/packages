# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : grub-customizer
version    : 5.2.8
release    : 16
source     :
    - https://launchpad.net/grub-customizer/5.2/5.2.8/+download/grub-customizer_5.2.8.tar.gz : fa4dc00c58e29eed84d8687a30e11920fcf3359ccad207698d4207d155819332
homepage   : https://launchpad.net/grub-customizer
license    : GPL-3.0-or-later
component  : system.utils
summary    : Grub Customizer is a graphical interface to configure the GRUB2/BURG settings and menuentries
description: |
    Grub Customizer is a graphical interface to configure the GRUB2/BURG settings and menuentries
builddeps  :
    - pkgconfig(atkmm-1.6)
    - pkgconfig(glibmm-2.4)
    - pkgconfig(gtkmm-3.0)
    - pkgconfig(libarchive)
    - pkgconfig(libcrypto)
setup      : |
    %cmake -DCMAKE_INSTALL_PREFIX=/usr
build      : |
    %make -C solusBuildDir
install    : |
    %make_install -C solusBuildDir
    %install_license COPYING
