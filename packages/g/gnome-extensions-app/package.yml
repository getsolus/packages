# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gnome-extensions-app
version    : '51.0'
release    : 1
source     :
    - https://download.gnome.org/sources/gnome-extensions-app/51/gnome-extensions-app-51.alpha.tar.xz : c60998fab1f67e73fcebeaa40c5806dc1ebffd6e1eb16e3b7472dc42691c85e6
homepage   : https://gitlab.gnome.org/GNOME/gnome-extensions-app
license    : GPL-2.0-or-later
component  : desktop.gnome
summary    : GNOME Extensions is a small app for managing GNOME Shell extensions
description: |
    GNOME Extensions is a small app for managing GNOME Shell extensions. It is usually built as part of gnome-shell, but can be used as a stand-alone project as well.
builddeps:
    - pkgconfig(gtk4)
    - gjs
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING
