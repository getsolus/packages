# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : granite
version    : 7.8.1
release    : 23
source     :
    - https://github.com/elementary/granite/archive/refs/tags/7.8.1.tar.gz : bc8e7946ca091fdeeeebeb64db4e95d33a3ffb879048137f8d8a41ecd76caa3f
homepage   : https://github.com/elementary/granite
license    : LGPL-3.0-or-later
component  : programming.library
summary    : elementary Development Library/Framework
description: |
    An extension to GTK+ that provides several useful widgets and classes to ease application development.
builddeps  :
    - pkgconfig(gee-0.8)
    - pkgconfig(gtk4)
    - sassc
    - vala
setup      : |
    %meson_configure \
        -Ddemo=false
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
