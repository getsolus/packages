# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ghostty
version    : 1.4.0
release    : 20
source     :
    - https://github.com/ghostty-org/ghostty/archive/refs/tags/v1.4.0.tar.gz : 2e2a2516f9bea89a4991ad7c9401b77682eed366387a5b1d7c629472b5d11a43
homepage   : https://ghostty.org/
license    : MIT
component  : system.utils
summary    : Fast, native, feature-rich terminal emulator pushing modern features
description: |
    Ghostty is a terminal emulator that differentiates itself by being fast, feature-rich, and native. While there are many excellent terminal emulators available, they all force you to choose between speed, features, or native UIs. Ghostty provides all three.
networking : true
builddeps  :
    - pkgconfig(blueprint-compiler)
    - pkgconfig(egl)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(gtk4)
    - pkgconfig(gtk4-layer-shell-0)
    - pkgconfig(harfbuzz)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libhwy)
    - pkgconfig(libpng)
    - pkgconfig(libxml-2.0)
    - pkgconfig(oniguruma)
    - pkgconfig(zlib)
    - gettext
    - glslang-devel
    - ncurses
    - pandoc
    - zig
environment: |
    export ZIG_GLOBAL_CACHE_DIR=${workdir}/zig-cache
    export DESTDIR=%installroot%
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Do-not-build-static-libghostty-vt.patch

    # Fetch the full dependency tree (including lazy deps) into the global cache.
    # Zig 0.17 stores packages as tarballs, but --system wants unpacked directories.
    zig build --fetch=all

    mkdir -p offline
    for f in "$ZIG_GLOBAL_CACHE_DIR"/p/*.tar.gz; do
        bsdtar -xf "$f" -C offline
    done
build      : |
    zig build %JOBS% \
        --prefix %PREFIX% \
        --system offline \
        --summary all \
        -Doptimize=ReleaseFast \
        -Dstrip=false \
        -Dcpu=baseline \
        -Dversion-string="${version}"
install    : |
    mkdir -p ${installdir}/usr/share/xdg-terminals
    cp ${installdir}/usr/share/applications/com.mitchellh.ghostty.desktop \
       ${installdir}/usr/share/xdg-terminals/com.mitchellh.ghostty.desktop

    # g/ghostty is owned by ncurses. x/xterm-ghostty stays in this package.
    rm -rv ${installdir}/usr/share/terminfo/g

    %install_license LICENSE
