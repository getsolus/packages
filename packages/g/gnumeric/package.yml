# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gnumeric
version    : 1.12.61
release    : 50
source     :
    - https://download.gnome.org/sources/gnumeric/1.12/gnumeric-1.12.61.tar.xz : 2ac135d856572713c1a408b76b50a59f2a9769ed21f1213446b5af255df20a12
homepage   : https://gnome.pages.gitlab.gnome.org/gnumeric-web/
license    :
    - GPL-2.0-only
    - GPL-3.0-only
summary    : GNOME Desktop spreadsheet application aiming for speed and lightness
component  : office
description: |
    GNOME Desktop spreadsheet application aiming for speed and lightness
builddeps  :
    - pkgconfig(gtk-doc)
    - pkgconfig(libgoffice-0.10)
    - pkgconfig(libgsf-1)
    - pkgconfig(pygobject-3.0)
    - itstool
    - yelp-tools
setup      : |
    %configure
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING*
patterns   :
    - /usr/lib64/*.so
