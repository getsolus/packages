# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gbml
version    : 1.4.0.0
release    : 6
source     :
    - https://gitlab.com/supremesonicbrazil/GBML/-/archive/v1.4.0.0/GBML-v1.4.0.0.tar.gz : 93a49aa609020fc2ba056962fe2d98d65c65687ac9856d1aceaf3fe297908780
homepage   : https://gitlab.com/supremesonicbrazil/GBML
license    : GPL-3.0-or-later
component  : games.platformer
summary    : Gaming Backup Multitool for Linux
description: |
    Gaming Backup Multitool for Linux - Backup utility and database for Linux Steam games
rundeps    :
    - steam
builddeps  :
    - pkgconfig(Qt5Core)
    - pkgconfig(Qt5Gui)
    - pkgconfig(Qt5Widgets)
    - sqlite3
clang      : true
build      : |
    ./BUILD.sh
install    : |
    %install_bin bin/gbml
    %install_file bin/SteamLinuxGames.db ${installdir}/usr/share/gbml/SteamLinuxGames.db
    %install_file ${pkgfiles}/gaming-backup-multitool-linux.desktop -t ${installdir}/usr/share/applications
    %install_file ${pkgfiles}/com.gitlab.gaming_backup_multitool_for_linux.metainfo.xml -t ${installdir}/usr/share/metainfo
    %install_file ${workdir}/img/icon.png ${installdir}/usr/share/pixmaps/gbml.png
    cp -r ./img ${installdir}/usr/share/gbml
    %install_license COPYING
