# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : glfw
version    : 3.5.1
release    : 15
source     :
    - https://github.com/glfw/glfw/archive/refs/tags/3.5.1.tar.gz : 5234f4f29473e9a06bc7847d8371858dd135d38466eeeaa652fdc9f8f9ff0c20
homepage   : https://www.glfw.org/
license    : Zlib
component  : programming
summary    : A multi-platform library for OpenGL, OpenGL ES and Vulkan, window and input.
description: |
    A multi-platform library for OpenGL, OpenGL and Vulkan development on the desktop. It provides a simple API for creating windows, contexts and surfaces, receiving input and events.
builddeps  :
    - pkgconfig(gl)
    - pkgconfig(wayland-scanner)
    - pkgconfig(xcursor)
    - pkgconfig(xi)
    - pkgconfig(xinerama)
    - pkgconfig(xkbcommon)
    - pkgconfig(xrandr)
rundeps    :
    - devel :
        - libxcursor-devel
        - libxi-devel
        - libxinerama-devel
        - libxrandr-devel
        - libxxf86vm-devel
    - libxcursor
    - libxi
    - libxinerama
    - libxrandr
    - libxxf86vm
setup      : |
    %cmake_ninja -DBUILD_SHARED_LIBS=ON
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE.md
