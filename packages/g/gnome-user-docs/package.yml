# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gnome-user-docs
version    : '50.5'
release    : 42
source     :
    - https://download.gnome.org/sources/gnome-user-docs/50/gnome-user-docs-50.5.tar.xz : adb2e358eb72631dbe90f741234d0d2949807e2af246ef26bb2901c8a8e9b21e
homepage   : https://gitlab.gnome.org/GNOME/gnome-user-docs
license    : CC-BY-3.0
component  : desktop.gnome.doc
summary    : GNOME core documentation
description: |
    This package contains documents which will be packaged together and shipped as gnome-user-docs in the core GNOME distribution. They should be documents targeted for end-users of GNOME and have general GNOME applicability.
builddeps  :
    - pkgconfig(yelp-xsl)
    - itstool
    - yelp-tools
setup      : |
    %configure
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
