name       : graft
version    : 0.2.2
release    : 1
homepage   : https://github.com/eonik-ai/graft
source     :
    - https://github.com/eonik-ai/graft/archive/refs/tags/v0.2.2.tar.gz : aa736b49bd825eaabcd0d713b3c0e502f794766c1c65cf061d18963daa69bf3b
license    : Apache-2.0
component  : multimedia.video
summary    : Change the hook. Keep the body
description: |
    Local-first composition workspace. Incremental compiler for video. Git owns recipe history; graft owns scions, layers, and compile. Runtime ffmpeg is not linked; graft shells out.
networking : true
builddeps  :
    - rust
rundeps    :
    - ffmpeg
setup      : |
    %cargo_fetch
build      : |
    %cargo_build --bin graft
install    : |
    %cargo_install
    install -Dm00755 target/release/graft "$installdir/usr/bin/graft"
    %install_license LICENSE
