# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : goverlay
version    : 1.8.10
release    : 26
source     :
    - https://github.com/benjamimgois/goverlay/archive/refs/tags/1.8.10.tar.gz : 2507a4e2b7fb5e60dfba10f9db96f69bd199247e29554dbd6aad4b8876ea3987
homepage   : https://github.com/benjamimgois/goverlay
license    : GPL-3.0-only
component  : system.utils
summary    : GUI for configuring Vulkan/OpenGL overlays - MangoHud, vkBasalt and ReplaySorcery
description: |
    GOverlay is an open source project aimed to create a Graphical UI to manage Vulkan/OpenGL overlays. It currently supports MangoHud and GOverlay.
    It also serves as an alternative to Nvidia Shadowplay, alowing you to record gameplay as well as save replays instantly with ReplaySorcery.
builddeps  :
    - pkgconfig(sdl2)
    - pkgconfig(x11)
    - lazarus
    - qt6pas-devel
rundeps    :
    - 7zip
    - git
    - mangohud
    - mesa-demos
    - sdl2
    - vkbasalt
    - vulkan-tools
build      : |
    # Build via make so pascube is produced (same as Arch)
    %make LAZBUILDOPTS="--lazarusdir=%libdir%/lazarus"
install    : |
    %make_install prefix=/usr
    %install_license LICENSE
