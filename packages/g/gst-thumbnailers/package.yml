# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gst-thumbnailers
version    : 1.1.0
release    : 1
source     :
    - https://download.gnome.org/sources/gst-thumbnailers/1.1/gst-thumbnailers-1.1.0.tar.xz : d980be383088261f8bc2ec5a8953edaca7c59abcc90abf24a5052493e726bf53
homepage   : https://gitlab.gnome.org/GNOME/gst-thumbnailers
license    : GPL-3.0-or-later
component  : desktop.gnome
summary    : GStreamer video and audio file thumbnailer
description: |
    GStreamer video and audio file thumbnailer
networking : true
builddeps  :
    - pkgconfig(glycin-2)
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gstreamer-app-1.0)
    - pkgconfig(gstreamer-plugins-bad-1.0)
    - pkgconfig(gstreamer-plugins-base-1.0)
    - rust
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSE
conflict   :
    - ffmpegthumbnailer
