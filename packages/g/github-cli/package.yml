# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : github-cli
version    : 2.103.3
release    : 104
source     :
    - https://github.com/cli/cli/archive/refs/tags/v2.103.3.tar.gz : bb148138a3a2fe023e57c78042fe3b42fc09171c0e8fff4cf983b227b7a2eade
homepage   : https://cli.github.com
license    : MIT
component  : system.utils
summary    : GitHub’s official command line tool
description: |
    github-cli is a tool that allows for GitHub concepts such as pull requests, issues, and gists to be used on the command line.
networking : true
builddeps  :
    - git
    - golang
rundeps    :
    - git
environment: |
    export CGO_CPPFLAGS="${CPPFLAGS}"
    export CGO_CFLAGS="${CFLAGS}"
    export CGO_CXXFLAGS="${CXXFLAGS}"
    export CGO_LDFLAGS="${LDFLAGS}"
    export GOFLAGS='-buildmode=pie -trimpath -mod=readonly -modcacherw'
    export GO_BUILDTAGS='noupdateable,notelemetry'
setup      : |
    # As-yet unmerged telemetry patch, see https://github.com/cli/cli/issues/13260
    %patch -p1 -i ${pkgfiles}/disable-telemetry.patch

    go mod vendor
build      : |
    %make GH_VERSION="v${version}" bin/gh manpages
    bin/gh completion -s bash | %install_file /dev/stdin share/bash-completion/completions/gh
    bin/gh completion -s zsh | %install_file /dev/stdin share/zsh/site-functions/_gh
    bin/gh completion -s fish | %install_file /dev/stdin share/fish/vendor_completions.d/gh.fish
install    : |
    %install_bin ${workdir}/bin/gh
    cp -av --no-preserve=ownership ${workdir}/share/ ${installdir}/usr

    %install_license LICENSE
