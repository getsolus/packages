# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
# If you're updating this package to a new major version of golang, please update gopls to a version with support for that golang version
name       : golang
version    : 1.27.4
release    : 150
homepage   : https://golang.org
source     :
    - https://golang.org/dl/go1.27.4.src.tar.gz : 73cfb8571aec0c01177687db87163d46aa20e9779672772891aa17654d9a6099
license    : BSD-3-Clause
summary    : The Go programming language
description: Go is an open source programming language that makes it easy to build simple, reliable, and efficient software.
autodep    : false
strip      : false
component  : programming
builddeps  :
    - binutils-gold # Needed for src/cmd/go/note_test.go
    - clang  # Needed for src/cmd/link/cgo_test.go
    - golang
rundeps    :
    - glibc
environment: |
    export GOROOT_BOOTSTRAP="%libdir%/golang"
setup      : |
    %apply_patches
build      : |
    # Build and run test suites
    pushd src
    bash ./make.bash
    popd

    # Install into this working tree
    GOROOT=$(pwd) \
    PATH=$(pwd)/bin:$PATH \
    go install \
        -buildmode=shared \
        std
install    : |
    %install_dir \
        ${installdir}/%libdir%/golang \
        ${installdir}/usr/bin

    cp -a --no-preserve=ownership * ${installdir}/%libdir%/golang
    chmod +x ${installdir}/%libdir%/golang/bin/{go,gofmt}

    ln -srv ${installdir}/%libdir%/golang/bin/go ${installdir}/usr/bin/go
    ln -srv ${installdir}/%libdir%/golang/bin/gofmt ${installdir}/usr/bin/gofmt

    rm -rf ${installdir}/usr/lib64/golang/pkg/obj

    asciify ${installdir}

    %install_license LICENSE PATENTS
replaces   :
    - golang-binary
