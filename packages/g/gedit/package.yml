# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gedit
version    : '51.0'
release    : 66
source     :
    - https://gitlab.gnome.org/World/gedit/gedit/-/archive/51.0/gedit-51.0.tar.bz2 : 25070b5c70af1839efab396f03e50caff15262a2e22ff8a550013e2bec84738d
homepage   : https://gedit-text-editor.org/
license    : GPL-2.0-or-later
component  : desktop.gnome
summary    : gedit is an easy-to-use and general-purpose text editor.
description: |
    gedit is an easy-to-use and general-purpose text editor. You can use it to write simple notes and documents, or you can enable more advanced features that are useful for software development.
builddeps  :
    - pkgconfig(gdlib)
    - pkgconfig(gsettings-desktop-schemas)
    - pkgconfig(gspell-1)
    - pkgconfig(gtksourceview-4)
    - pkgconfig(libgedit-tepl-6)
    - pkgconfig(libpeas-1.0)
    - pkgconfig(pygobject-3.0)
    - pkgconfig(python3)
    - desktop-file-utils
    - gtk-doc
    - itstool
    - python-setuptools
    - vala
    - yelp-tools
rundeps    :
    - python-gobject
setup      : |
    %meson_configure -Dgtk_doc=true
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
