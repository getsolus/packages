# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gumbo-parser
version    : 0.14.1
release    : 4
source     :
    - https://codeberg.org/gumbo-parser/gumbo-parser/archive/0.14.1.tar.gz : ba5d13b9b508ec693613b3b61518163aced38f8e885f7e28dc047348a4e61365
homepage   : https://codeberg.org/gumbo-parser/gumbo-parser
license    : Apache-2.0
component  : programming.library
summary    : An HTML5 parsing library in pure C99
description: |
    Gumbo is an implementation of the HTML5 parsing algorithm implemented as a pure C99 library with no outside dependencies.
setup      : |
    %reconfigure --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license doc/COPYING
