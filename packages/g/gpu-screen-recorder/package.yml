# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gpu-screen-recorder
version    : 6.1.7
release    : 5
source     :
    - https://dec05eba.com/snapshot/gpu-screen-recorder.git.6.1.7.tar.gz : 17be095ed8c6200c467c1477cc127c97b056b25071443d015e0ef026cf3fcd73
homepage   : https://git.dec05eba.com/gpu-screen-recorder/about/
license    : GPL-3.0-only
component  : multimedia.video
summary    : A shadowplay-like screen recorder for Linux. The fastest screen recorder for Linux.
description: |
    This is a screen recorder that has minimal impact on system performance by recording your monitor using the GPU only, similar to shadowplay on windows. This is the fastest screen recording tool for Linux.
clang      : true
builddeps  :
    - pkgconfig(dbus-1)
    - pkgconfig(libavcodec)
    - pkgconfig(libcap)
    - pkgconfig(libdrm)
    - pkgconfig(libglvnd)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libpulse)
    - pkgconfig(libva)
    - pkgconfig(vulkan)
    - pkgconfig(wayland-client)
    - pkgconfig(x11)
    - pkgconfig(xcomposite)
    - pkgconfig(xdamage)
    - pkgconfig(xrandr)
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
