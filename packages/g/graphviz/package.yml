# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : graphviz
version    : 16.1.2
release    : 38
source     :
    - https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/16.1.2/graphviz-16.1.2.tar.xz : 9780938f03659e2effbbfbbaec94940108e794199b73196fa339ca911890e8c9
homepage   : https://www.graphviz.org
license    : EPL-2.0
component  :
    - libs : programming.devel
    - multimedia.graphics
summary    :
    - libs : Library files for graphviz
    - Graphviz is open source graph visualization software
description: |
    Graphviz is open source graph visualization software
clang      : true
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(gdk-3.0)
    - pkgconfig(gdk-pixbuf-2.0)
    - pkgconfig(gdlib)
    - pkgconfig(glu)
    - pkgconfig(glut)
    - pkgconfig(gtk+-2.0)
    - pkgconfig(gts)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libwebp)
    - pkgconfig(pango)
    - pkgconfig(poppler)
    - pkgconfig(xaw6)
    - ghostscript-devel
    - groff
rundeps    :
    - devel :
        - graphviz-libs
setup      : |
    %configure \
        --enable-lefty

    sed -i -e 's/ -shared / -Wl,-O1,--as-needed\0/g' libtool # Fix overlinking
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING

    export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:${installdir}/usr/lib64
    ${installdir}/usr/bin/dot -c
patterns   :
    - libs :
        - /usr/lib64/libcdt.so.*
        - /usr/lib64/libcgraph.so.*
        - /usr/lib64/libgvc.so.*
        - /usr/lib64/libgvpr.so.*
        - /usr/lib64/libpathplan.so.*
        - /usr/lib64/libxdot.so.*
    - devel :
        - /usr/lib64/graphviz/*.so
