# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gimagereader
version    : 3.4.5
release    : 38
source     :
    - https://github.com/manisandro/gImageReader/releases/download/v3.4.5/gimagereader-3.4.5.tar.xz : c15830a1bdfcf15e3d73acaabef8101e18aa2f266d8de54811746d522598860e
homepage   : https://github.com/manisandro/gImageReader
license    : GPL-3.0-or-later
component  : office
summary    : gImageReader is a simple Gtk/Qt front-end to tesseract
description: |
    gImageReader is a simple Gtk/Qt front-end to tesseract.
builddeps  :
    - pkgconfig(ddjvuapi)
    - pkgconfig(gtksourceviewmm-3.0)
    - pkgconfig(gtkspellmm-3.0)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(libarchive)
    - pkgconfig(libpodofo)
    - pkgconfig(libturbojpeg)
    - pkgconfig(libxml++-2.6)
    - pkgconfig(libzip)
    - pkgconfig(poppler)
    - pkgconfig(pygobject-3.0)
    - pkgconfig(sane-backends)
    - pkgconfig(tesseract)
setup      : |
    %cmake_ninja \
        -DINTERFACE_TYPE=gtk \
        -DENABLE_VERSIONCHECK=OFF
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license COPYING
