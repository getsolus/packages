# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gnome-characters
version    : '51.0'
release    : 17
source     :
    - https://download.gnome.org/sources/gnome-characters/51/gnome-characters-51.0.tar.xz : 8b90e9d7fcff43622ed34677f0029cd74b440185f1639af48c439f63bebadc31
homepage   : https://apps.gnome.org/Characters/
license    :
    - BSD-3-Clause
    - GPL-2.0-or-later
component  : office.spelling
summary    : Character map application
description: |
    Characters is a simple utility application to find and insert unusual characters. It allows you to quickly find the character you are looking for by searching for keywords. You can also browse characters by categories, such as Punctuation, Pictures, etc.
optimize   :
    - lto
builddeps  :
    - pkgconfig(gjs-1.0)
    - pkgconfig(libadwaita-1)
    - desktop-file-utils
    - libunistring-devel
rundeps    :
    - gjs
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
