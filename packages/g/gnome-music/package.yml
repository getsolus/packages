# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gnome-music
version    : '51.0'
release    : 60
source     :
    - https://download.gnome.org/sources/gnome-music/51/gnome-music-51.0.tar.xz : 3dc094d8de87bc5ef74d45faaf381e676cb0d33026db470523924b19ec8c604e
homepage   : https://apps.gnome.org/Music/
license    : GPL-2.0-or-later
component  : multimedia.audio
summary    : Play and organize your music collection
description: |
    An easy and pleasant way to play your music. Find tracks in your local collection, use automatically generated playlists or curate a fresh one.
builddeps  :
    - pkgconfig(blueprint-compiler)
    - pkgconfig(flac)
    - pkgconfig(gee-0.8)
    - pkgconfig(glycin-gtk4-2)
    - pkgconfig(goa-1.0)
    - pkgconfig(grilo-0.3)
    - pkgconfig(grilo-plugins-0.3)
    - pkgconfig(gstreamer-plugins-base-1.0)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libcue)
    - pkgconfig(libdazzle-1.0)
    - pkgconfig(libexif)
    - pkgconfig(libgsf-1)
    - pkgconfig(libmediaart-2.0)
    - pkgconfig(libsecret-1)
    - pkgconfig(libsoup-3.0)
    - pkgconfig(poppler-glib)
    - pkgconfig(py3cairo)
    - pkgconfig(pygobject-3.0)
    - pkgconfig(python3)
    - pkgconfig(taglib)
    - pkgconfig(tinysparql-3.0)
    - pkgconfig(totem-plparser)
    - pkgconfig(upower-glib)
    - pkgconfig(vorbis)
    - desktop-file-utils
    - itstool
    - python-requests
    - python3-dbus
    - vala
rundeps    :
    - dleyna-connector-dbus
    - dleyna-server
    - grilo-plugins
    - localsearch
    - python-gobject
    - python-requests
    - python3-dbus
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
