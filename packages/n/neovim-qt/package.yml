# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : neovim-qt
version    : 0.2.20
release    : 20
source     :
    - https://github.com/equalsraf/neovim-qt/archive/refs/tags/v0.2.20.tar.gz : 1ba4da6594a22c7fd950876329ca55cc483a37bfc87f586b1226eb34b8f3ce9d
homepage   : https://github.com/equalsraf/neovim-qt
license    : ISC
component  : editor
summary    : Neovim client library and GUI, in Qt.
description: |
    Neovim client library and GUI, in Qt.
builddeps  :
    - pkgconfig(Qt6Svg)
    - pkgconfig(dri)
    - pkgconfig(msgpack-c)
    - neovim
rundeps    :
    - neovim
setup      : |
    # Allow use of newer msgpack
    sed -i 's|msgpack-c 6.0.0|msgpack-c 7.0.0|' CMakeLists.txt

    %cmake_ninja \
        -DUSE_SYSTEM_MSGPACK=ON \
        -DWITH_QT=Qt6
build      : |
    %ninja_build
install    : |
    %ninja_install

    # Install AppStream metainfo
    %install_file ${pkgfiles}/io.github.equalsraf.neovim_qt.metainfo.xml -t ${installdir}/usr/share/metainfo
