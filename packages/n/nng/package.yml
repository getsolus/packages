# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : nng
version    : 1.12.0
release    : 3
source     :
    - https://github.com/nanomsg/nng/archive/refs/tags/v1.12.0.tar.gz : 50b7264bd8f0901f7ebdf3ec7c48f4e23dd689bbe7b2917d9d8fad58ffd09e5c
homepage   : https://nng.nanomsg.org/
license    : MIT
component  : system.utils
summary    : nanomsg-next-generation -- light-weight brokerless messaging
description: |
    nanomsg-next-generation -- light-weight brokerless messaging
builddeps  :
    - pkgconfig(mbedtls)
setup      : |
    %cmake_ninja \
        -DBUILD_SHARED_LIBS=ON \
        -DNNG_ENABLE_TLS=ON \
        -DNNG_ENABLE_NNGCAT=ON \
        -DNNG_TESTS=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE.txt
test       : |
    %ninja_check
