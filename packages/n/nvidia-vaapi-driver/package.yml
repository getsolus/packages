# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : nvidia-vaapi-driver
version    : 0.0.18
release    : 24
homepage   : https://github.com/elFarto/nvidia-vaapi-driver
source     :
    - https://github.com/elFarto/nvidia-vaapi-driver/archive/refs/tags/v0.0.18.tar.gz : 7459205cd1719a5865ab9c8969723c27e9863add5e7229e8e56c5f8816017b2a
license    : MIT
component  : xorg.display
summary    : A VA-API implementation using NVIDIA's NVDEC as the backend (UNSUPPORTED)
description: |
    This is an VA-API implementation that uses NVDEC as a backend. Mostly useful for firefox. (UNSUPPORTED)
builddeps  :
    - pkgconfig(dri)
    - pkgconfig(ffnvcodec)
    - pkgconfig(gstreamer-codecparsers-1.0)
    - pkgconfig(libva)
    - nvidia-utils
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
conflicts  :
    - libva-vdpau-driver
