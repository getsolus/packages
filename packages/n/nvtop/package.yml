# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : nvtop
version    : 3.4.0
release    : 10
source     :
    - https://github.com/Syllo/nvtop/archive/refs/tags/3.4.0.tar.gz : 7979f425dc2b748ff191e3999a0994af6154795e0e8640fae1e177684a296e08
homepage   : https://github.com/Syllo/nvtop/
license    : GPL-3.0-or-later
component  : system.utils
summary    : GPUs process monitoring for AMD, Intel and NVIDIA.
description: |
    NVTOP stands for Neat Videocard TOP, a (h)top like task monitor for AMD, Intel and NVIDIA GPUs. It can handle multiple GPUs and print information about them in a htop-familiar way.
builddeps  :
    - pkgconfig(libdrm)
setup      : |
    %cmake_ninja \
        -DNVIDIA_SUPPORT=ON \
        -DAMDGPU_SUPPORT=ON \
        -DINTEL_SUPPORT=ON
build      : |
    %ninja_build
install    : |
    # breaks appstream compose
    sed --in-place '/<icon type="cached">nvtop.svg<\/icon>/d' solusBuildDir/desktop/io.github.syllo.nvtop.metainfo.xml

    %ninja_install
    %install_license COPYING
