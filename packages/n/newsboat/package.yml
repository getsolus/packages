# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : newsboat
version    : 2.45.1
release    : 14
source     :
    - https://github.com/newsboat/newsboat/archive/refs/tags/r2.45.1.tar.gz : 11b9426ea2de9aff3d3a723ff936125e8ce7e5e298012b4da4f3807bc73b7867
homepage   : https://newsboat.org/
license    : MIT
component  : network.news
summary    : RSS/Atom feed reader for the text console
description: |
    Newsboat is an RSS/Atom feed reader for the text console. It's an actively maintained fork of Newsbeuter.
networking : true
builddeps  :
    - pkgconfig(json-c)
    - pkgconfig(libcurl)
    - pkgconfig(libxml-2.0)
    - pkgconfig(sqlite3)
    - pkgconfig(stfl)
    - asciidoctor
    - gawk
    - gettext
    - rust
setup      : |
    ./config.sh
build      : |
    %make prefix=/usr
install    : |
    %make_install prefix=/usr
    %install_license LICENSE
