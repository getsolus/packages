# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ntfs-3g
version    : 2026.11.23
release    : 26
source     :
    - https://github.com/tuxera/ntfs-3g/archive/refs/tags/2026.11.23.tar.gz : fa72b202a4ee509436e722172e7a94d12ab917fb4cacf2b4994fd45be2ea5cb8
homepage   : https://github.com/tuxera/ntfs-3g/wiki
license    : GPL-2.0-or-later
component  : system.utils
summary    : Open source, driver for Windows NTFS file system
description: |
    Open source, driver for Windows NTFS file system. This can mount Windows partitions so that they are writable and allows you edit or delete Windows files from Linux.
builddeps  :
    - pkgconfig(fuse)
    - pkgconfig(gnutls)
    - pkgconfig(libacl)
    - pkgconfig(libattr)
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Fix-FILEREADER-callback-return-type.patch

    %reconfigure \
        --disable-static \
        --disable-ldconfig \
        --enable-crypto \
        --enable-extras \
        --enable-posix-acls \
        --enable-xattr-mappings \
        --with-fuse=external \
        --sbin=/usr/sbin
build      : |
    %make
install    : |
    %make_install \
        rootbindir=/usr/bin \
        rootsbindir=/usr/sbin \
        rootlibdir=%libdir%
    %install_license COPYING COPYING.LIB

    mv ${installdir}/sbin/* ${installdir}/usr/sbin/
    rmdir ${installdir}/sbin -v

    ln -srv ${installdir}/usr/bin/ntfs-3g ${installdir}/usr/sbin/mount.ntfs
    ln -srv ${installdir}/usr/bin/ntfs-3g ${installdir}/usr/sbin/mount.ntfs-fuse
