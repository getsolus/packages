# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : newt
version    : 0.52.25
release    : 14
source     :
    - https://releases.pagure.org/newt/newt-0.52.25.tar.gz : ef0ca9ee27850d1a5c863bb7ff9aa08096c9ed312ece9087b30f3a426828de82
homepage   : https://pagure.io/newt
license    : LGPL-2.0-or-later
component  : programming.library
summary    : Newt is a programming library for color text mode, widget based user interfaces
description: |
    Newt is a programming library for color text mode, widget based user interfaces.
builddeps  :
    - pkgconfig(popt)
    - pkgconfig(python3)
    - pkgconfig(slang)
setup      : |
    %configure --disable-static --with-python=python%python3_version%
build      : |
    %make
install    : |
    %make_install
    rm $installdir/%libdir%/*.a
    %install_license COPYING
