# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : nautilus-python
version    : 4.2.0
release    : 24
homepage   : https://gitlab.gnome.org/GNOME/nautilus-python
source     :
    - https://download.gnome.org/sources/nautilus-python/4.2/nautilus-python-4.2.0.tar.xz : a45b9b407a6d11328afb4d8a9ea014758c100d77e845ccb280882d2f7e4adfbc
license    : GPL-2.0-or-later
component  : desktop
summary    : Nautilus-python enables Python extentions in Nautilus
description: |
    These are unstable bindings for the nautilus extension library introduced in Gnome 2.6.
builddeps  :
    - pkgconfig(libnautilus-extension-4)
    - pkgconfig(pygobject-3.0)
    - pkgconfig(python3)
patterns   :
    - docs : /usr/share/doc
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
