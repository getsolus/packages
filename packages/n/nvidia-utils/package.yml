# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : nvidia-utils
version    : 615.71.09
release    : 6
source     :
    - https://us.download.nvidia.com/XFree86/Linux-x86_64/615.71.09/NVIDIA-Linux-x86_64-615.71.09.run : cdceed22bbeb61248d1a6deabc2596673e3a6501698ee71ac8d2fdc28f3b70fe
extract    : false
homepage   : https://nvidia.com
license    :
    - EULA
summary    :
    - NVIDIA userspace driver components
    - 32bit : 32-bit libraries for NVIDIA driver
component  :
    - xorg.driver
    - 32bit : xorg.driver
description:
    - NVIDIA userspace driver components - libraries, Xorg driver, Vulkan ICD, VDPAU, CUDA, NVENC/NVDEC, and management utilities. These are the common userspace components shared by the various NVIDIA kernel driver variants.
    - 32bit : 32-bit libraries for NVIDIA driver. Generally required by older games.
rundeps    :
    - 32bit :
        - egl-gbm-32bit
        - egl-wayland-32bit
        - egl-x11-32bit
        - libglvnd-32bit
        - nvidia-utils
    - main :
        - egl-gbm
        - egl-wayland
        - egl-x11
        - kbd
        - libglvnd
        - linux-driver-management
conflicts  :
    - nvidia-470-glx-driver-common
    - nvidia-580-glx-driver-common
    - nvidia-beta-driver-common
    - nvidia-developer-driver-common
    - 32bit :
        - nvidia-470-glx-driver-32bit
        - nvidia-580-glx-driver-32bit
        - nvidia-beta-driver-32bit
        - nvidia-developer-driver-32bit
patterns   :
    - main : /*
    - 32bit :
        - /usr/lib32/*
        - /usr/share/metainfo/nvidia-utils-32bit.metainfo.xml
replaces   :
    - nvidia-glx-driver-common
    - 32bit :
        - nvidia-glx-driver-32bit
strip      : false
debug      : false
builddeps  :
    - pkgconfig(gtk+-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(xorg-server)
    - libglvnd-32bit
setup      : |
    sh $sources/NVIDIA-Linux-x86_64-$version.run --extract-only
    pushd NVIDIA*
    # We need systemd units.
    tar xf nvidia-persistenced-init.tar.bz2
install    : |
    # Install nvidia driver for xorg
    %install_exe nvidia_drv.so $installdir/%libdir%/xorg/modules/drivers/nvidia_drv.so

    # Install all binaries
    %install_dir $installdir/usr/bin
    install -m 00755 `find . -maxdepth 1 -type f -name "nvidia-*" -executable` $installdir/usr/bin/.
    rm -v $installdir/usr/bin/nvidia-installer

    # Needs setuid set to create /dev/ thingyies
    chmod 4755 $installdir/usr/bin/nvidia-modprobe

    # Install all libraries
    %install_dir $installdir/usr/lib{32,64}
    install -m 00755 lib*.so* $installdir/%libdir%/.
    install -m 00755 32/lib*.so* $installdir/usr/lib32/.

    # Strip glvnd bits and OpenCL, we have those elsewhere
    rm -v $installdir/usr/lib{32,64}/{libGLX.so.0,libGL.so.1.7.0,libOpenGL.so.0,libOpenCL.so.1.0.0,libGLdispatch.so*}

    # Remove the non glvnd portions
    rm -v $installdir/usr/lib{32,64}/lib{EGL,GLESv1_CM,GLESv2}.so*

    # Nuke egl-gbm/wayland/x11 conflicts, we package those separately
    rm -fv $installdir/usr/lib{32,64}/libnvidia-egl-{gbm,wayland,xcb,xlib}*

    # Remove OpenSSL 1.1 fallback library
    rm -fv $installdir/%libdir%/libnvidia-pkcs11.so*

    function redo_libs() {
        for gl in $* ; do
            i=`dirname ${gl}`
            clean=`echo $(basename ${gl})|sed -e 's@\.so\.%version%@@g'`
            soname=`objdump -p ${gl} | grep SONAME | awk '{print $2}'`
            if [[ ! -e $i/${soname} ]] ; then
                ln -sv `basename ${gl}` $i/${soname}
            fi
            if [[ ! -e $i/{clean}.so ]]; then
                ln -sv `basename ${gl}` $i/${clean}.so
            fi
        done
    }

    redo_libs $installdir/usr/lib{32,64}/lib*.so.%version%

    # GSP Firmware
    install -Dm644 -t "$installdir/usr/lib64/firmware/nvidia/$version/" firmware/*.bin

    # Move vdpau into the final position
    %install_dir $installdir/usr/lib{32,64}/vdpau
    mv -v $installdir/%libdir%/libvdpau* $installdir/%libdir%/vdpau/.
    mv -v $installdir/usr/lib32/libvdpau* $installdir/usr/lib32/vdpau/.

    # Data files
    %install_file nvidia-settings.desktop $installdir/usr/share/applications/nvidia-settings.desktop
    sed -e 's@__UTILS_PATH__@/usr/bin@' -i $installdir/usr/share/applications/nvidia-settings.desktop
    %install_file nvidia-settings.png $installdir/usr/share/pixmaps/nvidia-settings.png
    %install_file nvidia.icd $installdir/usr/share/OpenCL/vendors/nvidia.icd
    %install_dir $installdir/usr/share/nvidia/files.d
    %install_file nvoptix.bin $installdir/usr/share/nvidia/nvoptix.bin
    %install_file sandboxutils-filelist.json $installdir/usr/share/nvidia/files.d/sandboxutils-filelist.json

    # Vulkan
    %install_file nvidia_icd.json $installdir/usr/share/vulkan/icd.d/10_nvidia.json
    %install_file nvidia_icd_vksc.json $installdir/usr/share/vulkansc/icd.d/nvidia_icd_vksc.json
    %install_file nvidia_layers.json $installdir/usr/share/vulkan/implicit_layer.d/nvidia_layers.json

    # GBM
    %install_dir $installdir/%libdir%/gbm
    ln -s "../libnvidia-allocator.so.$version" $installdir/%libdir%/gbm/nvidia-drm_gbm.so

    # Make sure glvnd knows where to be
    %install_dir $installdir/usr/share/glvnd/egl_vendor.d
    %install_file 10_nvidia.json $installdir/usr/share/glvnd/egl_vendor.d/10_nvidia.json

    # Keep settings UI happy
    %install_file nvidia-application-profiles-${version}-rc -t $installdir/usr/share/nvidia
    %install_file nvidia-application-profiles-${version}-key-documentation -t $installdir/usr/share/nvidia

    # Install NVIDIA NGX dll for use with Proton and Wine
    %install_dir $installdir/%libdir%/nvidia/wine
    install -m 00644 *nvngx*.dll $installdir/%libdir%/nvidia/wine/.

    # Blacklist nouveau/nova
    %install_file $pkgfiles/nvidia-blacklist.conf $installdir/usr/lib64/modprobe.d/nvidia-blacklist.conf

    # Nvidia module parameters
    %install_file $pkgfiles/nvidia.conf $installdir/usr/lib64/modprobe.d/nvidia.conf

    # Force uvm load
    %install_file $pkgfiles/nvidia-uvm.conf $installdir/usr/lib64/modules-load.d/nvidia-uvm.conf

    # Fixes Wayland sleep
    %install_file $pkgfiles/nvidia-sleep.conf $installdir/usr/lib64/modprobe.d/nvidia-sleep.conf

    # Init
    %install_file nvidia-persistenced-init/systemd/nvidia-persistenced.service.template \
                  $installdir/usr/lib64/systemd/system/nvidia-persistenced.service
    sed -e 's@__USER__@nvidia-persistenced@' -i $installdir/usr/lib64/systemd/system/nvidia-persistenced.service

    # Additional files
    %install_file $pkgfiles/nvidia.rules $installdir/%libdir%/udev/rules.d/60-nvidia.rules
    %install_file $pkgfiles/nvidia-utils.tmpfiles $installdir/%libdir%/tmpfiles.d/nvidia-utils.conf
    %install_file $pkgfiles/nvidia-utils.sysusers $installdir/%libdir%/sysusers.d/nvidia-utils.conf

    # We enable modprobe and fbdev by default now, but we still need to the corresponding kernel args until either we support
    # early KMS with grub or it's determined that the 0001-drivers-firmware-skip-simpledrm-if-nvidia-drm.modese.patch kernel patch
    # is no longer necessary and it's removed from all supported kernels.
    %install_file $pkgfiles/cmdline-nvidia.conf $installdir/usr/lib64/kernel/cmdline.d/40_nvidia.conf

    # new PM stuff
    install -D -m 00644 systemd/system/*.service -t $installdir/%libdir%/systemd/system
    %install_exe systemd/system-sleep/nvidia $installdir/%libdir%/systemd/system-sleep/nvidia
    %install_bin systemd/nvidia-sleep.sh
    # enable new PM stuff OOTB
    %install_dir $installdir/%libdir%/systemd/system/systemd-hibernate.service.wants
    ln -sv ../nvidia-hibernate.service $installdir/%libdir%/systemd/system/systemd-hibernate.service.wants/
    ln -sv ../nvidia-resume.service $installdir/%libdir%/systemd/system/systemd-hibernate.service.wants/
    %install_dir $installdir/%libdir%/systemd/system/systemd-suspend.service.wants
    ln -sv ../nvidia-suspend.service $installdir/%libdir%/systemd/system/systemd-suspend.service.wants/
    ln -sv ../nvidia-resume.service $installdir/%libdir%/systemd/system/systemd-suspend.service.wants/

    # Enable Dynamic Boost support OOTB.
    %install_bin nvidia-powerd
    %install_file nvidia-dbus.conf $installdir/usr/share/dbus-1/system.d/nvidia-dbus.conf
    %install_dir $installdir/%libdir%/systemd/system/multi-user.target.wants
    ln -sv ../nvidia-powerd.service $installdir/%libdir%/systemd/system/multi-user.target.wants/

    # Make sure our glx is found, LDM will handle the main config file
    %install_file $pkgfiles/xorg.conf $installdir/usr/share/X11/xorg.conf.d/10-nvidia.conf
    # install glxserver extension for xorg
    %install_dir $installdir/%libdir%/nvidia/modules
    mv $installdir/usr/lib64/libglxserver_nvidia.so* $installdir/%libdir%/nvidia/modules/

    # Check for broken symlinks
    %symlink_check

    # Appstream metainfo
    %install_file $pkgfiles/nvidia-utils-32bit.metainfo.xml $installdir/usr/share/metainfo/nvidia-utils-32bit.metainfo.xml

    # Generate single initrd with the GSP firmware
    mkdir -p init-firmware/usr/lib64/firmware/nvidia && pushd init-firmware/
    cp -rav $installdir/usr/lib64/firmware/nvidia/* usr/lib64/firmware/nvidia/
    find . | cpio --create --format='newc' | zstd -19 > $workdir/initrd-firmware
    popd
    %install_file $workdir/initrd-firmware $installdir/usr/lib64/kernel/initrd.d/com.solus-project.nvidia-firmware
permanent  :
    - /usr/lib64/firmware
