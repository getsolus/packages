# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ninja
version    : 1.13.2
release    : 12
source     :
    - https://github.com/ninja-build/ninja/archive/refs/tags/v1.13.2.tar.gz : 974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17
homepage   : https://ninja-build.org
license    : Apache-2.0
component  : programming.tools
summary    : A small build system with a focus on speed
description: |
    Ninja is a small build system with a focus on speed. It differs from other build systems in two major respects: it is designed to have its input files generated by a higher-level build system, and it is designed to run builds as fast as possible.
optimize   :
    - lto
builddeps  :
    - re2c
checkdeps  :
    - pkgconfig(gtest)
setup      : |
    %cmake_ninja
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license COPYING

    # Completions
    %install_file misc/bash-completion ${installdir}/usr/share/bash-completion/completions/ninja
    %install_file misc/zsh-completion ${installdir}/usr/share/zsh/site-functions/_ninja
check      : |
    %cmake_test
