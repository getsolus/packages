# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : noctalia
version    : 5.1.0
release    : 3
source     :
    - https://github.com/noctalia-dev/noctalia/releases/download/v5.1.0/noctalia-v5.1.0.tar.gz : c85a9bd2ee272ba92c5f0a785183fb721664f27c065157a094698088901e0816
homepage   : https://noctalia.dev
license    : MIT
component  : desktop
summary    : A sleek and minimal desktop shell thoughtfully crafted for Wayland
description: |
    Noctalia is a native Wayland desktop shell for people who want a polished, configurable Linux desktop without stitching together a separate bar, launcher, notification daemon, lock screen, wallpaper tool, and settings UI.
builddeps  :
    - pkgconfig(cairo)
    - pkgconfig(egl)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(glesv2)
    - pkgconfig(glib-2.0)
    - pkgconfig(harfbuzz)
    - pkgconfig(jemalloc)
    - pkgconfig(libcurl)
    - pkgconfig(libical)
    - pkgconfig(libjxl)
    - pkgconfig(libpipewire-0.3)
    - pkgconfig(libqalculate)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libsecret-1)
    - pkgconfig(libsodium)
    - pkgconfig(libwebp)
    - pkgconfig(libxml-2.0)
    - pkgconfig(md4c)
    - pkgconfig(nlohmann_json)
    - pkgconfig(pam)
    - pkgconfig(pango)
    - pkgconfig(pangocairo)
    - pkgconfig(polkit-agent-1)
    - pkgconfig(sdbus-c++)
    - pkgconfig(sndfile)
    - pkgconfig(stb)
    - pkgconfig(tomlplusplus)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-egl)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wireplumber-0.5)
    - pkgconfig(xkbcommon)
    - git
rundeps    :
    - git # Used for fetching plugins
clang      : true
optimize   :
    - thin-lto
    - speed
setup      : |
    %meson_configure \
        -Djemalloc=enabled \
build      : |
    %meson_build

    # Completions
    mkdir completions
    ./solusBuildDir/noctalia completions bash > completions/noctalia
    ./solusBuildDir/noctalia completions fish > completions/noctalia.fish
    ./solusBuildDir/noctalia completions zsh > completions/_noctalia
install    : |
    %meson_install
    %install_license LICENSE

    # Completions
    %install_file -t ${installdir}/usr/share/bash-completion/completions completions/noctalia
    %install_file -t ${installdir}/usr/share/fish/vendor_completions.d completions/noctalia.fish
    %install_file -t ${installdir}/usr/share/zsh/site-functions completions/_noctalia

    # Licenses for vendored deps
    %install_file third_party/fzy/LICENSE "${installdir}"/usr/share/licenses/"${package}"/LICENSE.fzy
    %install_file third_party/luau/LICENSE.txt "${installdir}"/usr/share/licenses/"${package}"/LICENSE.luau
    %install_file third_party/luau/lua_LICENSE.txt "${installdir}"/usr/share/licenses/"${package}"/LICENSE.lua
    %install_file third_party/material_color_utilities/LICENSE "${installdir}"/usr/share/licenses/"${package}"/LICENSE.material-color-utilities
    %install_file third_party/wuffs/LICENSE-APACHE "${installdir}"/usr/share/licenses/"${package}"/LICENSE.wuffs.Apache
    %install_file third_party/wuffs/LICENSE-MIT "${installdir}"/usr/share/licenses/"${package}"/LICENSE.wuffs.MIT
