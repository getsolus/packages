# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : nginx
version    : 1.30.7
release    : 58
source     :
    - https://github.com/nginx/nginx/releases/download/release-1.30.7/nginx-1.30.7.tar.gz : 2565b5c837050e958f70fb0f73c48e2bca4542ad349fd356f46fb0c72610bc6e
homepage   : https://nginx.org/
license    : BSD-2-Clause
component  : programming
summary    : Multi-purpose TCP server, mainly a proxy or HTTP server
description: |
    nginx is an HTTP and reverse proxy server, a mail proxy server, and a generic TCP/UDP proxy server.
builddeps  :
    - pkgconfig(libpcre2-8)
    - pkgconfig(libxcrypt)
    - pkgconfig(libxslt)
setup      : |
    %patch -p1 -i ${pkgfiles}/Load-welcome-website-if-no-other-sites-are-available.patch
    %patch -p1 -i ${pkgfiles}/Customize-welcome-page.patch

    loggingDir=/var/log/nginx

    ./configure \
        --build=x86_64-solus-linux \
        --conf-path=/usr/share/defaults/nginx/nginx.conf \
        --error-log-path=${loggingDir}/error.log \
        --group=nginx \
        --http-log-path=${loggingDir}/access.log \
        --pid-path=/run/nginx.pid \
        --prefix=/usr \
        --user=nginx \
        --with-file-aio \
        --with-http_gunzip_module \
        --with-http_gzip_static_module \
        --with-http_ssl_module \
        --with-http_v2_module \
        --with-http_xslt_module \
        --with-pcre-jit \
        --with-threads
build      : |
    %make
install    : |
    %make_install
    %install_license LICENSE

    # VIM files
    %install_dir ${installdir}/usr/share/vim/vimfiles
    cp -a --no-preserve=ownership ${workdir}/contrib/vim/* ${installdir}/usr/share/vim/vimfiles

    # Welcome website (appears at first run)
    %install_file ${pkgfiles}/welcome.conf -t ${installdir}/usr/share/nginx
    mv ${installdir}/usr/html ${installdir}/usr/share/nginx/welcome

    # Systemd stuff
    %install_file ${pkgfiles}/nginx.service -t ${installdir}/%libdir%/systemd/system
    %install_file ${pkgfiles}/nginx.sysusers ${installdir}/%libdir%/sysusers.d/nginx.conf
    %install_file ${pkgfiles}/nginx.tmpfiles ${installdir}/%libdir%/tmpfiles.d/nginx.conf

    # Make nginx stateless
    rm -rf ${installdir}/usr/share/defaults/*.default
    %install_file ${pkgfiles}/nginx.conf -t ${installdir}/usr/share/defaults/nginx

    # Cleanup
    rm -rf ${installdir}/{run,var}
