# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : netavark
version    : 2.1.0
release    : 5
source     :
    - https://github.com/containers/netavark/archive/refs/tags/v2.1.0.tar.gz : 96677048168ddd1abe313e4c2e17f1cace72b60ee1bac8ca12a4bd7dfcadfbbb
    - https://github.com/containers/aardvark-dns/archive/refs/tags/v2.1.0.tar.gz#aardvark-dns.tar.gz : daf871488603e659b0501224cf0731ac317809b1d1701fc061cb4f6ae39a894f
homepage   : https://github.com/containers/netavark
license    : Apache-2.0
summary    : A container network stack
component  : network.util
description: |
    Netavark is a rust based network stack for containers. It is being designed to work with Podman but is also applicable for other OCI container management applications.
    Aardvark-dns is an authoritative dns server for A/AAAA container records. It can forward other requests to configured resolvers.
replaces   : cni-plugins
networking : true
builddeps  :
    - pkgconfig(protobuf)
    - go-md2man
    - rust
build      : |
    mkdir aardvark-dns
    tar --strip-components=1 -xf ${sources}/aardvark-dns.tar.gz -C aardvark-dns

    %make build docs

    cd aardvark-dns
    %make PREFIX=%PREFIX%
install    : |
    %make_install PREFIX=%PREFIX%

    cd aardvark-dns
    %make_install PREFIX=%PREFIX%
    %install_license LICENSE
