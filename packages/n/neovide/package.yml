# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : neovide
version    : 0.17.4
release    : 8
source     :
    - https://github.com/neovide/neovide/archive/refs/tags/0.17.4.tar.gz : ac9bcfcc510da39ac861cbba468296df0f1270fdcd82846a5820c33a73d7da98
homepage   : https://neovide.dev/
license    :
    - MIT
    - CC-BY-4.0  # Neovide and rust logo
    - CC-BY-3.0  # Neovim logo
component  : editor
summary    : A simple, no-nonsense, cross-platform graphical user interface for Neovim.
description: |
    Neovide is a simple graphical user interface for Neovim (an aggressively refactored and updated Vim editor).
    Where possible there are some graphical improvements, but functionally it should act like the terminal UI.
    To checkout all the cool features, installation instructions, configuration settings and much more, head on over to neovide.dev.
networking : true
builddeps  :
    - pkgconfig(fontconfig)
    - rust
rundeps    :
    - neovim
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Use-fully-qualified-app_id.patch

    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install

    # Install desktop file
    %install_file assets/neovide.desktop ${installdir}/usr/share/applications/dev.neovide.Neovide.desktop

    # Install variable size icons
    for s in 16 32 48 256; do
      %install_file assets/neovide-${s}x${s}.png ${installdir}/usr/share/icons/hicolor/${s}x${s}/apps/neovide.png
    done

    # Install scalable icons
    %install_file assets/neovide.svg ${installdir}/usr/share/icons/hicolor/scalable/apps/neovide.svg

    # Install license
    %install_license LICENSE

    # Install AppStream metainfo
    %install_file ${pkgfiles}/dev.neovide.Neovide.metainfo.xml -t ${installdir}/usr/share/metainfo
