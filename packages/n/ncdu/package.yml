# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ncdu
version    : 2.12.0
release    : 30
source     :
    - https://github.com/BratishkaErik/ncdu/archive/refs/tags/v2.12.0.tar.gz : cd55cb5dcd30f7a40b283e5e189aede8cffe69700aa9eae1208fd6fde79dc159
homepage   : https://github.com/BratishkaErik/ncdu
license    : MIT
component  : system.utils
summary    : Disk usage analyzer with ncurses interface
description: |
    ncdu is a disk usage analyzer with an ncurses interface, aimed to be run on a remote server over SSH. It is therefore designed to be fast, simple, and easy to use.
networking : true
environment: |
    export ZIG_FLAGS="-Dcpu=baseline --release=fast -fsys=zstd -fsys=ncurses"
builddeps  :
    - pkgconfig(libzstd)
    - pkgconfig(ncursesw)
    - zig
build      : |
    %make
install    : |
    %install_bin zig-out/bin/ncdu
    %install_file ncdu.1 ${installdir}/usr/share/man/man1/ncdu.1
    %install_license LICENSES/*
