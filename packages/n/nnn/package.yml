# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : nnn
version    : '5.3'
release    : 35
source     :
    - https://github.com/jarun/nnn/archive/refs/tags/v5.3.tar.gz : 79ee69f3ced7c0778d207df76b4d4d680636975ccda002eeb19d0917fcba3d36
license    : BSD-2-Clause
homepage   : https://github.com/jarun/nnn
component  : system.utils
summary    : A simple console file manager forked from Noice.
description: |
    A simple console file manager forked from Noice.
builddeps  :
    - pkgconfig(ncursesw)
rundeps    :
    - atool
    - libarchive
    - mediainfo
    - moreutils
    - rclone
    - sshfs-fuse
build      : |
    %make
install    : |
    %make_install PREFIX=/usr
    %install_license LICENSE
