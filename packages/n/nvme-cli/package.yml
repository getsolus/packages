# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : nvme-cli
version    : '3.1'
release    : 29
source     :
    - https://github.com/linux-nvme/nvme-cli/archive/refs/tags/v3.1.tar.gz : 8a6879f1f2af53743c03a8f77f247261306300d3f3b0edfd242c5f646bdfdccb
homepage   : https://github.com/linux-nvme/nvme-cli
license    : GPL-2.0-only
component  : system.utils
summary    :
    - NVM-Express user space tooling for Linux.
    - ^libnvme: C Library for NVM Express
description:
    - NVM-Express user space tooling for Linux.
    - ^libnvme: libnvme provides type definitions for NVMe specification structures, enumerations, and bit fields, helper functions to construct, dispatch, and decode commands and payloads, and utilities to connect, scan, and manage nvme devices.
builddeps  :
    - pkgconfig(json-c)
conflicts  :
    - ^libnvme3-devel: libnvme-devel
setup      : |
    %meson_configure \
        -Dudevrulesdir=lib64/udev/rules.d \
        -Dsystemddir=lib/systemd/system \
        -Ddocs=man
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE

    # Remove default/example config
    rm -rv $installdir/etc/
patterns   :
    - ^libnvme3:
        - /usr/lib64/libnvme3.so.1*
    - ^libnvme3-devel:
        - /usr/lib64/libnvme3.so
        - /usr/lib64/pkgconfig
        - /usr/include
        - /usr/share/man/man2
