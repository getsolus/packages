# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : neohtop
version    : 1.3.0
release    : 4
source     :
    - https://github.com/Abdenasser/neohtop/archive/refs/tags/v1.3.0.tar.gz : b967c22c659f73e309fade15a1c1a0a1404a3a4ea43c929d14cda54e811620ca
homepage   : https://abdenasser.github.io/neohtop/
license    : MIT
component  : system.utils
summary    : Blazing-fast system monitoring for your desktop.
description: |
    A modern, cross-platform system monitor built on top of Svelte, Rust, and Tauri.
networking : true
builddeps  :
    - pkgconfig(ayatana-appindicator3-0.1)
    - pkgconfig(gdk-3.0)
    - pkgconfig(javascriptcoregtk-4.1)
    - pkgconfig(libsoup-3.0)
    - pkgconfig(webkit2gtk-4.1)
    - nodejs
    - rust
build      : |
    npm i
    npm run tauri build
install    : |
    # Install binary
    %install_exe src-tauri/target/release/NeoHtop ${installdir}/usr/bin/neohtop

    # Install desktop file, app icon and metainfo.
    %install_file ${pkgfiles}/io.github.abdenasser.neohtop.desktop ${installdir}/usr/share/applications/io.github.abdenasser.neohtop.desktop
    %install_file src-tauri/icons/icon.png ${installdir}/usr/share/icons/hicolor/512x512/apps/io.github.abdenasser.neohtop.png
    %install_file ${pkgfiles}/io.github.abdenasser.neohtop.metainfo.xml ${installdir}/usr/share/metainfo/io.github.abdenasser.neohtop.neohtop.metainfo.xml

    %install_license LICENSE
