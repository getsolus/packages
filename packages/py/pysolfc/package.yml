# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pysolfc
version    : 3.6.1
release    : 22
source     :
    - https://sourceforge.net/projects/pysolfc/files/PySolFC/PySolFC-3.6.1/pysolfc-3.6.1.tar.xz : aa1127fb44977e2ee3508c5bbab461bea005d5e91301467cecc3422f7e40f3f9
homepage   : https://pysolfc.sourceforge.io/
license    : GPL-3.0-or-later
component  : games.card
summary    : PySol Fan Club edition
description: |
    PySol Fan Club Edition (PySolFC) is a collection of more than 1000 solitaire card games.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - pysolfc-cardsets
    - python-attrs
    - python-configobj
    - python-pillow
    - python-pysol-cards
    - python3-tkinter
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_file $pkgfiles/io.sourceforge.pysolfc.PySolFC.metainfo.xml -t $installdir/usr/share/metainfo/
