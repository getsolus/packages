# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-charset-normalizer
version    : 3.5.1
release    : 14
source     :
    - https://pypi.io/packages/source/c/charset_normalizer/charset_normalizer-3.5.1.tar.gz : 6117b84ea48435e5356dc737f5121485c30920ba43375fa7b434fd753df0eac3
homepage   : https://github.com/ousret/charset_normalizer
license    : MIT
component  : programming.python
summary    : Truly universal encoding detector in pure Python
description: |
    The Real First Universal Charset Detector. Open, modern and actively maintained alternative to Chardet.
builddeps  :
    - python-build
    - python-installer
    - python-mypy
    - python-setuptools
checkdeps  :
    - python-pytest
    - python-pytest-cov
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
