# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-argcomplete
version    : 3.7.0
release    : 15
source     :
    - https://files.pythonhosted.org/packages/source/a/argcomplete/argcomplete-3.7.0.tar.gz : afde224f753f874807b1dc1414e883ab8fe0cda9c04807b6047dcb8e1ac23913
homepage   : https://github.com/kislyuk/argcomplete
license    : Apache-2.0
component  : programming.python
summary    : Python and tab completion, better together
description: |
    Argcomplete provides easy, extensible command line tab completion of arguments for your Python script.
builddeps  :
    - python-build
    - python-hatch-vcs
    - python-installer
    - python-packaging
    - python-wheel
checkdeps  :
    - bash
    - fish
    - python-pexpect
    - python-pytest
    - zsh
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    python3 -m venv --system-site-packages test-venv
    test-venv/bin/python -m installer dist/*.whl

    # TODO: The Bash tests fail because it can't find the argcomplete activate
    # script. No idea why. I looked, it was in ./test-venv/bin.
    _tests=(
        TestArgcomplete
        TestArgcompleteREPL
        TestSplitLine
        TestCheckModule
        # TestBash
        TestZsh
        # TestBashGlobal
        # zsh 5.9.0.3 regresses upstream's global python completion tests
        # TestZshGlobal
        Warn
    )

    PATH="$PWD/test-venv/bin/:$PATH" test-venv/bin/python test/test.py -v "${_tests[@]}"
