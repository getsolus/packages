# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-decorator
version    : 5.3.1
release    : 17
source     :
    - https://github.com/micheles/decorator/archive/refs/tags/5.3.1.tar.gz : 4cfb62b78554a1be9b4c1d773257999f311326821f0b605fac0b096dc18efed7
homepage   : https://github.com/micheles/decorator
license    : BSD-2-Clause
component  : programming.python
summary    : Better living through Python with decorators
description: |
    The aim of the decorator module is to simplify the usage of decorators for the average programmer, and to popularize decorators usage giving examples of useful decorators, such as memoize, tracing, redirecting_stdout, locked, etc. The core of this module is a decorator factory called decorator.
builddeps  :
    - python-build
    - python-installer
    - python-packaging
    - python-setuptools
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    export PYTHONPATH="${PWD}/src:${PYTHONPATH}"
    python -m unittest discover -vs tests/
replaces   :
    - python3-decorator
