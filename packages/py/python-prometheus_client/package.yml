# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-prometheus_client
version    : 0.26.0
release    : 12
source     :
    - https://github.com/prometheus/client_python/archive/refs/tags/v0.26.0.tar.gz : 862e0fb8569e0eec4ceceee7a9f8d4ca0d5d9b81c938f917d4d963e414790d42
homepage   : https://github.com/prometheus/client_python
license    : Apache-2.0
component  : programming.python
summary    : Prometheus instrumentation library for Python applications
description: |
    Prometheus instrumentation library for Python applications
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-asgiref
    - python-pytest
    - python-twisted
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
