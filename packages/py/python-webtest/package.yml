# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-webtest
version    : 3.0.7
release    : 1
source     :
    - https://github.com/Pylons/webtest/archive/refs/tags/3.0.7.tar.gz : 45e01233a96f4b578b5409c9e9314c3508875fe6b4a0a7f45b2a04fb0fdbc88a
homepage   : https://docs.pylonsproject.org/projects/webtest/en/latest/
license    : MIT
component  : programming.python
summary    : Helper to test WSGI applications
description: |
    Wraps any WSGI application and makes it easy to send test requests to that application, without starting up an HTTP server.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
    - python-wheel
checkdeps  :
    - python-beautifulsoup4
    # - python-pyquery
    - python-pytest
    - python-waitress
    - python-webob
rundeps    :
    - python-beautifulsoup4
    - python-waitress
    - python-webob
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_license license.rst
# TODO(Evan): Enable after pyquery lands
# check      : |
#     %pytest -v
