# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-llfuse
version    : 1.5.2
release    : 17
source     :
    - https://files.pythonhosted.org/packages/source/l/llfuse/llfuse-1.5.2.tar.gz : 3f7fdc86e3db433c48cb6505fe3000ec1b3e84a4a40a84ad67b8df3a847f0697
homepage   : https://github.com/python-llfuse/python-llfuse/
license    : LGPL-2.1-or-later
component  : programming.python
summary    : Python bindings for the low-level FUSE API
description: |
    Python-LLFUSE is a set of Python bindings for the low level FUSE API.
builddeps  :
    - pkgconfig(fuse)
    - pkgconfig(libattr)
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest
