# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-imagesize
version    : 2.0.0
release    : 14
source     :
    - https://pypi.io/packages/source/i/imagesize/imagesize-2.0.0.tar.gz : 8e8358c4a05c304f1fccf7ff96f036e7243a189e9e42e90851993c558cfe9ee3
homepage   : https://github.com/shibukawa/imagesize_py
license    : MIT
component  : programming.python
summary    : Python lib for getting image size from png/jpeg/jpeg2000/gif file
description: |
    This module analyzes JPEG/JPEG 2000/PNG/GIF/TIFF/SVG/Netpbm/WebP image headers and returns image size or DIP.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    python -m unittest discover -v
