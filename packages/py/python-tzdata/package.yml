# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-tzdata
version    : '2026.5'
release    : 8
source     :
    - https://files.pythonhosted.org/packages/source/t/tzdata/tzdata-2026.5.tar.gz : 8cc73c0a0bfca7dbfa59235d60b2eff82231dee33f53d206db1acd9173cfc0a7
homepage   : https://github.com/python/tzdata
license    : Apache-2.0
component  : programming.python
summary    : Python package wrapping the IANA time zone database
description: |
    This is a Python package containing zic-compiled binaries for the IANA time zone database. It is intended to be a fallback for systems that do not have system time zone data installed (or don't have it installed in a standard location), as a part of PEP 615
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
