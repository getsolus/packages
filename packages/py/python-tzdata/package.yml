# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-tzdata
version    : '2026.6'
release    : 9
source     :
    - https://files.pythonhosted.org/packages/source/t/tzdata/tzdata-2026.6.tar.gz : 85d2cd9c09f81f0bb29db27759fc83af4f1e620efb814f8c5bf8b4cc4feece6d
homepage   : https://github.com/python/tzdata
license    : Apache-2.0
component  : programming.python
summary    : Python package wrapping the IANA time zone database
description: |
    This is a Python package containing zic-compiled binaries for the IANA time zone database. It is intended to be a fallback for systems that do not have system time zone data installed (or don't have it installed in a standard location), as a part of PEP 615
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
