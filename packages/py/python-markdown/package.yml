# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
# NOTE: Also update python-types-pyyaml when updating this package.
name       : python-markdown
version    : 3.10.3
release    : 18
source     :
    - https://github.com/Python-Markdown/markdown/archive/refs/tags/3.10.3.tar.gz : 909c1fa72ba67aeb8afce5c42d3f98f1421b35d68702a1bb4b927bbdcc7fcc2c
homepage   : https://github.com/Python-Markdown/markdown
license    : BSD-3-Clause
component  : programming.python
summary    : A Python implementation of Markdown
description: |
    This is a Python implementation of Markdown. It is almost completely compliant with the reference implementation, though there are a few known issues.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - pyyaml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # doesn't work with pytest macro
    python3 -m unittest discover tests
