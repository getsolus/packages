# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-markdown-math
version    : '0.9'
release    : 10
source     :
    - https://github.com/mitya57/python-markdown-math/archive/refs/tags/0.9.tar.gz : 446fe1d51d16024f1b32bd76eef3f9a65ca7a81c00fe56380b39c52c4517ca3c
homepage   : https://github.com/mitya57/python-markdown-math
license    : MIT
component  : programming.python
summary    : Math extension for Python-Markdown
description: |
    This extension adds math formulas support to Python-Markdown.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-markdown
rundeps    :
    - python-markdown
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # test doesnt run with pytest macro
    %python3_test
