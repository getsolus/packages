# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-argon2-cffi
version    : 25.1.0
release    : 8
source     :
    - https://github.com/hynek/argon2-cffi/archive/refs/tags/25.1.0.tar.gz : eb5cc2917bd3b4d1084839e9551d7deb1f3bf9fe1cdb2fac52613deaeac36fe0
homepage   : https://github.com/hynek/argon2-cffi
license    : MIT
component  : programming.python
summary    : Secure Password Hashes for Python
description: |
    Argon2 won the Password Hashing Competition and argon2-cffi is the simplest way to use it in Python and PyPy.
builddeps  :
    - pkgconfig(libargon2)
    - pkgconfig(python3)
    - python-build
    - python-hatch-fancy-pypi-readme
    - python-hatch-vcs
    - python-installer
checkdeps  :
    - python-argon2-cffi-bindings
    - python-hypothesis
    - python-pytest
rundeps    :
    - python-argon2-cffi-bindings
build      : |
    export SETUPTOOLS_SCM_PRETEND_VERSION=${version}
    export ARGON2_CFFI_USE_SSE2=1

    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
