# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-proton-core
version    : 0.7.4
release    : 8
source     :
    - https://github.com/ProtonVPN/python-proton-core/archive/refs/tags/v0.7.4.tar.gz : 602f2554333a9165e56ab9fc4c42960dc6ebaf4eb8a64cbb2e1d95d72dcf20c2
homepage   : https://github.com/ProtonVPN/python-proton-core
license    : GPL-3.0-or-later
component  : programming.python
summary    : The proton-core component
description: |
    The proton-core component contains core logic used by the other Proton components.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
replaces   :
    - proton-python-client
