# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-typeguard
version    : 4.6.0
release    : 16
source     :
    - https://files.pythonhosted.org/packages/source/t/typeguard/typeguard-4.6.0.tar.gz : e7414f09111317de3e335de92cd397c5c0ca00b1cc1676de12e1d444a79b3f21
homepage   : https://github.com/agronholm/typeguard
license    : MIT
component  : programming.python
summary    : Run-time type checker for Python
description: |
    This library provides run-time type checking for functions defined with PEP 484 argument (and return) type annotations.
builddeps  :
    - python-build
    - python-installer
    - python-mypy           # check
    - python-pytest         # check
    - python-setuptools-scm
    - python-wheel
rundeps    :
    - python-typing-extensions
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v 
