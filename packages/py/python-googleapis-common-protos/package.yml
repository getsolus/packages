# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-googleapis-common-protos
version    : 1.75.1
release    : 6
source     :
    - https://github.com/googleapis/google-cloud-python/archive/refs/tags/googleapis-common-protos-v1.75.1.tar.gz : d3bc073645fa8d971c0b3201d7352fcf89a95602b4a0391321d28bdb4855fc08
homepage   : https://pypi.org/project/googleapis-common-protos/
license    : Apache-2.0
component  : programming.python
summary    : Common protobufs used in Google APIs
description: |
    googleapis-common-protos contains the python classes generated from the common protos in the googleapis/api-common-protos repository.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-protobuf
    - python-pytest
rundeps    :
    - python-protobuf
build      : |
    pushd packages/googleapis-common-protos
    %pyproject_build
install    : |
    pushd packages/googleapis-common-protos
    %pyproject_install
check      : |
    pushd packages/googleapis-common-protos
    %pytest -v
