# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-gobject
version    : 3.58.1
release    : 48
source     :
    - https://download.gnome.org/sources/pygobject/3.58/pygobject-3.58.1.tar.gz : 4c80598ade17fbaa7798e01a25d0bf29ce109740786026a074c5c62bb3e79d23
homepage   : https://gnome.pages.gitlab.gnome.org/pygobject/
license    : LGPL-2.1-or-later
summary    : Python GObject bindings
description: |
    PyGObject provides Python bindings to the GObject class from GLib.
component  : programming.python
builddeps  :
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(py3cairo)
    - pkgconfig(python3)
    - meson-python
    - patchelf
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
rundeps    :
    - python-cairo
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
replaces   :
    - python3-gobject
    - devel : python3-gobject-devel
conflicts  :
    - devel :
        - python2-gobject-devel
