# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-bleach
version    : 6.4.0
release    : 21
source     :
    - https://files.pythonhosted.org/packages/source/b/bleach/bleach-6.4.0.tar.gz : 4202482733d85cedd04e59fcb2f89f4e4c7c385a78d3c3c23c30446843a37452
homepage   : https://github.com/mozilla/bleach
license    : Apache-2.0
component  : programming.python
summary    : Bleach is an allowed-list-based HTML sanitizing library that escapes or strips markup and attributes
description: |
    Bleach is an allowed-list-based HTML sanitizing library that escapes or strips markup and attributes.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-pytest
    - python-webencodings
rundeps    :
    - python-tinycss2
    - python-webencodings
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
