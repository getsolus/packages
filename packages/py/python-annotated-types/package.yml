# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-annotated-types
version    : 0.8.0
release    : 5
source     :
    - https://github.com/annotated-types/annotated-types/archive/refs/tags/v0.8.0.tar.gz : 4d038ad7abecc913fdf426d1b28ce60c4fb129c65ed33863515dfd1975e97dce
homepage   : https://github.com/annotated-types/annotated-types
license    : MIT
component  : programming.python
summary    : Reusable constraint types to use with typing.Annotated
description: |
    PEP-593 added `typing.Annotated` as a way of adding context-specific metadata to existing types, and specifies that `Annotated[T, x]` should be treated as `T` by any tool or library without special logic for `x`.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
checkdeps:
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
