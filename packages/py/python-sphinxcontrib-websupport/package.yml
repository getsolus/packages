# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-sphinxcontrib-websupport
version    : 2.0.0
release    : 12
source     :
    - https://github.com/sphinx-doc/sphinxcontrib-websupport/archive/2.0.0.tar.gz : ec7b8da36e1ccbb46bcb55697229eaae9da7ef771319c7aeeaffde434e9787f3
homepage   : https://www.sphinx-doc.org
license    : BSD-2-Clause
component  : programming.python
summary    : Sphinx API for WebApps
description: |
    sphinxcontrib-webuspport provides a Python API to easily integrate Sphinx documentation into your Web application.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-flit-core
    - python-installer
    - python-setuptools
rundeps    :
    - python-sqlalchemy
build      : |
    %pyproject_build
install    : |
    %pyproject_install
