# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pandas
version    : 3.0.5
release    : 35
source     :
    - https://files.pythonhosted.org/packages/source/p/pandas/pandas-3.0.5.tar.gz : dca3734d6ab7c906e6730f0788b0a1dbb9f2467731f9711f77995c8e9d62d712
homepage   : https://pandas.pydata.org/
license    : BSD-3-Clause
component  : programming.python
summary    : Flexible and powerful Python data analysis toolkit
description: |
    Flexible and powerful data analysis / manipulation library for Python, providing labeled data structures similar to R data.frame objects, statistical functions, and much more.
builddeps  :
    - cython
    - meson-python
    - numpy
    - patchelf
    - python-build
    - python-installer
    - python-packaging
    - python-versioneer
    - python-wheel
#checkdeps  :
    #- python-dateutil
    #- python-hypothesis
    #- python-pytest
    #- python-pytest-xdist
    #- python-pytz
rundeps    :
    - python-bottleneck # optional
    - python-dateutil
    - python-numexpr
    - python-pytz
    - python-tzdata
build      : |
    # no macros as we need skip-dependency-check here
    python3 -m build --wheel --no-isolation --skip-dependency-check
install    : |
    python3 -m installer --destdir=%installroot% dist/*.whl

#check      : |
    #mkdir -p .pytest_sandbox
    #cd .pytest_sandbox
    #%pytest --pyargs pandas -m "not slow and not network and not db and not single" -n 4 -r sxX
