# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-execnet
version    : 2.1.2
release    : 1
source     :
    - https://github.com/pytest-dev/execnet/archive/refs/tags/v2.1.2.tar.gz : 47771d96dc506b62aac01569c4494385ce41f08d2e43928230f27bee7bbb91c5
homepage   : https://execnet.readthedocs.io/
license    : MIT
component  : programming.python
summary    : Distributed Python deployment and communication
description: |
    Provides carefully tested means to ad-hoc interact with Python interpreters across version, platform and network barriers. It provides a minimal and fast API.
builddeps  :
    - python-build
    - python-hatch-vcs
    - python-installer
    - python-setuptools
checkdeps  :
    - python-pytest
    - python-pytest-timeout
environment: |
    export SETUPTOOLS_SCM_PRETEND_VERSION=${version}
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
