# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-fakefs
version    : 6.2.0
release    : 14
source     :
    - https://github.com/pytest-dev/pyfakefs/archive/refs/tags/v6.2.0.tar.gz : 181b4a6dcefdf223223458b2f9fd2a3c93d8abc3e539546b9bd3c48bf1a1641f
homepage   : https://github.com/jmcgeheeiv/pyfakefs
license    : Apache-2.0
component  : programming.python
summary    : pyfakefs implements a fake file system that mocks the Python file system modules
description: |
    pyfakefs implements a fake file system that mocks the Python file system modules. Using pyfakefs, your tests operate on a fake file system in memory without touching the real disk. The software under test requires no modification to work with pyfakefs.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-openpyxl
    - python-pandas
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    export PYTHONPATH="${PWD}:${PYTHONPATH}"

    %pytest -v pyfakefs/pytest_tests
    %pytest -v pyfakefs/tests --deselect 'pyfakefs/tests/fake_pathlib_test.py::SkipPathlibTest::test_exists'
