# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-annotated-doc
version    : 0.0.5
release    : 2
source     :
    - https://files.pythonhosted.org/packages/source/a/annotated-doc/annotated_doc-0.0.5.tar.gz : c7e58ce09192557605d8bbd92836d7e1d520ac9580096042c0bfd197efacf1bb
homepage   : https://github.com/fastapi/annotated-doc
license    : MIT
component  : programming.python
summary    : Inline documentation helpers for typing.Annotated
description: |
    Document parameters, class attributes, return types, and variables inline, with Annotated.
builddeps  :
    - python-build
    - python-installer
    - python-pdm-backend
    - python-setuptools
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
