# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pythran
version    : 0.18.1
release    : 9
source     :
    - https://files.pythonhosted.org/packages/source/p/pythran/pythran-0.18.1.tar.gz : 8803ed948bf841a11bbbb10472a8ff6ea24ebd70e67c3f77b77be3db900eccfe
homepage   : https://github.com/serge-sans-paille/pythran
license    : BSD-3-Clause
component  : programming.python
summary    : Ahead of Time compiler for numeric kernels
description: |
    Pythran is an ahead of time compiler for a subset of the Python language, with a focus on scientific computing. It takes a Python module annotated with a few interface descriptions and turns it into a native Python module with the same interface, but (hopefully) faster.
builddeps  :
    - numpy
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - numpy
    - python-beniget
    - python-ply
    - python-setuptools
build      : |
    %pyproject_build
install    : |
    %pyproject_install
