# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-yarl
version    : 1.24.5
release    : 16
source     :
    - https://files.pythonhosted.org/packages/source/y/yarl/yarl-1.24.5.tar.gz : e81b83143bee16329c23db3c1b2d82b29892fcbcb849186d2f6e98a5abe9a57f
homepage   : https://yarl.aio-libs.org/
license    : Apache-2.0
component  : programming.python
summary    : The module provides handy URL class for URL parsing and changing
description: |
    The module provides handy URL class for URL parsing and changing
builddeps  :
    - cython
    - python-build
    - python-expandvars
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-idna
    - python-multidict
    - python-propcache
    - python-pytest
rundeps    :
    - python-idna
    - python-multidict
    - python-propcache
build      : |
    %python3_setup
install    : |
    %python3_install
check      : |
    %python3_test pytest -v -m "not hypothesis" \
        --ignore=tests/test_pydantic.py \
        --ignore=tests/test_quoting.py \
        --ignore=tests/test_quoting_benchmarks.py \
        --ignore=tests/test_url_benchmarks.py \
        -o addopts="-v -ra --showlocals --doctest-modules --strict-markers"
