# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-yarl
version    : 1.25.1
release    : 17
source     :
    - https://files.pythonhosted.org/packages/source/y/yarl/yarl-1.25.1.tar.gz : 03dd38de09bc213e9a8b29761eec33ee1d5318dac0e49d8af36e4d27830e23a7
homepage   : https://yarl.aio-libs.org/
license    : Apache-2.0
component  : programming.python
summary    : The module provides handy URL class for URL parsing and changing
description: |
    The module provides handy URL class for URL parsing and changing
builddeps  :
    - cython
    - python-build
    - python-expandvars
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-idna
    - python-multidict
    - python-propcache
    - python-pytest
rundeps    :
    - python-idna
    - python-multidict
    - python-propcache
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %python3_test pytest -v -m "not hypothesis" \
        --ignore=tests/test_pydantic.py \
        --ignore=tests/test_quoting.py \
        --ignore=tests/test_quoting_benchmarks.py \
        --ignore=tests/test_url_benchmarks.py \
        -o addopts="-v -ra --showlocals --doctest-modules --strict-markers"
