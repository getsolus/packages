# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-stevedore
version    : 5.6.0
release    : 15
source     :
    - https://files.pythonhosted.org/packages/source/s/stevedore/stevedore-5.6.0.tar.gz : f22d15c6ead40c5bbfa9ca54aa7e7b4a07d59b36ae03ed12ced1a54cf0b51945
homepage   : https://opendev.org/openstack/stevedore
license    : Apache-2.0
component  : programming.python
summary    : Manage dynamic plugins for Python applications
description: |
    Manage dynamic plugins for Python applications
builddeps  :
    - pkgconfig(python3)
    - pbr
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-docutils
    - python-pytest
    - python-sphinx
rundeps    :
    - pbr
    - python-six
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    #need testtools packaged
    rm $workdir/stevedore/tests/test_callback.py
    %pytest
