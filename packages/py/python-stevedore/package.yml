# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-stevedore
version    : 5.9.1
release    : 16
source     :
    - https://files.pythonhosted.org/packages/source/s/stevedore/stevedore-5.9.1.tar.gz : e97a2667923efda926e8713fde6a73616df68210a3cbc6f02b48967b676fd8bf
homepage   : https://opendev.org/openstack/stevedore
license    : Apache-2.0
component  : programming.python
summary    : Manage dynamic plugins for Python applications
description: |
    Manage dynamic plugins for Python applications
builddeps  :
    - pkgconfig(python3)
    - pbr
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-docutils
    - python-pytest
    - python-sphinx
rundeps    :
    - pbr
    - python-six
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    #need testtools packaged
    rm $workdir/stevedore/tests/test_callback.py
    %pytest
