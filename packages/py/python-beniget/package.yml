# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-beniget
version    : 0.5.0
release    : 7
source     :
    - https://github.com/serge-sans-paille/beniget/archive/refs/tags/0.5.0.tar.gz : 494b61850c7df16c49685a745bbea9e3ed75928fa29cd2a89a00b026e5690948
homepage   : https://github.com/serge-sans-paille/beniget/
license    : BSD-3-Clause
component  : programming.python
summary    : Extract semantic information about static Python code
description: |
    Beniget is a collection of Compile-time analyse on Python Abstract Syntax Tree(AST). It's a building block to write static analyzer or compiler for Python.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-gast
rundeps    :
    - python-gast
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    python3 -m unittest discover
