# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pytz
version    : '2026.3'
release    : 29
source     :
    - https://pypi.debian.net/pytz/pytz-2026.3.tar.gz : 3a30feb7a1a04cf0fa0be1624415930843b02f012eb800380f36f906a723e4ae
homepage   : https://pythonhosted.org/pytz
license    : MIT
component  : programming.python
summary    : World timezone definitions, modern and historical
description: |
    World timezone definitions, modern and historical
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-pytest
setup      : |
    %patch -p1 -i $pkgfiles/use-system-zoneinfo.patch
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    rm -rf %python3_sitepackages%/pytz/zoneinfo
# Fails using system timezone info
#check      : |
#    %pytest -v
