# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-setuptools-rust
version    : 1.13.0
release    : 16
source     :
    # Use full git clones or pypi tarballs only. The Github release-tag-generated tarballs do not have the required metadata
    - https://pypi.debian.net/setuptools-rust/setuptools_rust-1.13.0.tar.gz : f2afcf4baeee689910ce49cfa8aad4e08cce72f417449bcc32891b8664fdc726
homepage   : https://github.com/PyO3/setuptools-rust
license    : MIT
component  : programming.python
summary    : setuptools plugin for rust support
description: |
    Compile and distribute Python extensions written in rust as easily as if they were written in C.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools-scm
    - python-wheel
rundeps    :
    - python-semanticversion
    - python-setuptools
    - rust
build      : |
    %pyproject_build
install    : |
    %pyproject_install
