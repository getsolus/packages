# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-patsy
version    : 1.0.2
release    : 13
source     :
    - https://pypi.io/packages/source/p/patsy/patsy-1.0.2.tar.gz : cdc995455f6233e90e22de72c37fcadb344e7586fb83f06696f54d92f8ce74c0
homepage   : https://github.com/pydata/patsy
license    : BSD-2-Clause
component  : programming.python
summary    : Python package for describing statistical models and building design matrices
description: |
    patsy is a Python package for describing statistical models (especially linear models, or models that have a linear component) and building design matrices. It is closely inspired by and compatible with the formula mini-language used in R and S.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-pytest
    - scipy
rundeps    :
    - scipy
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest
