# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-docstring_parser
version    : 0.18.0
release    : 3
source     :
    - https://github.com/rr-/docstring_parser/archive/refs/tags/0.18.0.tar.gz : 88fa8a7a3b251ec0f34da4cb0443ec17ec3d054ffd748087f7c19dd85019a93d
homepage   : https://github.com/rr-/docstring_parser
license    : MIT
component  : programming.python
summary    : Parse Python docstrings. Currently support ReST, Google, Numpydoc-style and Epydoc docstrings.
description: |
    Parse Python docstrings. Currently support ReST, Google, Numpydoc-style and Epydoc docstrings.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
    - python-wheel
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
