# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-openssl
version    : 26.4.0
release    : 26
source     :
    - https://pypi.debian.net/pyOpenSSL/pyopenssl-26.4.0.tar.gz : 28dfcce0162b9211413e26dfbfdf1d24317fbeba18fc93c12400a1856b2a0bc7
homepage   : https://pyopenssl.org/
license    : Apache-2.0
component  : programming.python
summary    : Python interface to the OpenSSL library
description: |
    pyOpenSSL - A Python wrapper around the OpenSSL library
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-cryptography
    - python-installer
    - python-setuptools
    - python-sphinx
checkdeps  :
    - python-pretend
    - python-pytest-rerunfailures
rundeps    :
    - python-cryptography
    - python-typing-extensions
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # https://github.com/pyca/pyopenssl/issues/1455
    %pytest -v \
        --deselect tests/test_ssl.py::TestOCSP::test_client_receives_servers_data
