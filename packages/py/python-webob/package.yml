# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-webob
version    : 1.8.11
release    : 1
source     :
    - https://github.com/Pylons/webob/archive/refs/tags/1.8.11.tar.gz : 006ccfb3b5897b1a4355a7284e450d267de5bddfa5a1d31d19e0563ccc6d62ba
homepage   : https://webob.org/
license    : MIT
component  : programming.python
summary    : WSGI request and response objects
description: |
  WebOb provides objects for HTTP requests and responses. Specifically it does this by wrapping the WSGI request environment and response status/headers/app_iter(body).
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-coverage
    - python-legacy-cgi
    - python-pytest
    - python-pytest-cov
    - python-pytest-xdist
rundeps    :
    - python-legacy-cgi
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # Deselected test fails under Python 3.14 due to DisconnectionError being
    # raised before IOError.
    %pytest -v \
        --ignore=docs \
        --deselect=tests/test_in_wsgiref.py::test_interrupted_request
