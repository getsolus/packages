# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-shtab
version    : 1.9.3
release    : 5
source     :
    - https://pypi.debian.net/shtab/shtab-1.9.3.tar.gz : 76d9b980cb7fca90b808380f9f1d251f37891d1abc30e1d63f6bde030f804c02
license    : Apache-2.0
component  : programming.python
