# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-shtab
version    : 1.12.1
release    : 6
source     :
    - https://pypi.debian.net/shtab/shtab-1.12.1.tar.gz : 0637338723a8fc08ed1c2fd826d8432229924649c26e3247bb48c53d60ca3bf9
license    : Apache-2.0
component  : programming.python
homepage   : https://github.com/tqdm/shtab
summary    : Automagic shell tab completion for Python CLI applications
description: |
    Automagic shell tab completion for Python CLI applications
builddeps  :
    - python-build
    - python-installer
    - python-setuptools-scm
    - python-wheel
checkdeps  :
    - fish
    - python-click
    - python-pytest
    - python-pytest-cov
    - python-pytest-timeout
    - tcsh
    - zsh
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest
