# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-rich-cli
version    : 1.8.1
release    : 1
source     :
    - https://github.com/Textualize/rich-cli/archive/refs/tags/v1.8.1.tar.gz : fdc485358275a58b47c700a5456d85242aab8f141b8764ff49deed03e7c04723
homepage   : https://github.com/Textualize/rich-cli
license    : MIT
component  : programming.python
summary    : Rich-cli is a command line toolbox for fancy output in the terminal
description: |
    Use the rich command to highlight a variety of file types in the terminal, with specialized rendering for Markdown and JSON files. Additionally you can markup and format text from the command line.
builddeps  :
    - python-build
    - python-installer
    - python-poetry-core
    - python-rich
checkdeps  :
    - python-pytest
rundeps    :
    - python-click
    - python-rich
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest
