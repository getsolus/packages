# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-cssselect
version    : 1.5.0
release    : 8
source     :
    - https://files.pythonhosted.org/packages/source/c/cssselect/cssselect-1.5.0.tar.gz : 3cbe82dd7acbee9ba9e5723b5f9e4749826912f1fb31cd7f92aabed5fde15b15
homepage   : https://github.com/scrapy/cssselect
license    : BSD-3-Clause
component  : programming.python
summary    : cssselect parses CSS3 Selectors and translates them to XPath 1.0
description: |
    cssselect parses CSS3 Selectors and translate them to XPath 1.0 expressions. Such expressions can be used in lxml or another XPath engine to find the matching elements in an XML or HTML document.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
    - python-wheel
checkdeps  :
    - python-lxml
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
