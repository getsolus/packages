# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-absl-py
version    : 2.5.0
release    : 14
source     :
    - https://github.com/abseil/abseil-py/archive/refs/tags/v2.5.0.tar.gz : f9f336f2c815198bf4d0c9b949c7147bdff7449b97b26bd5275f2019f5861401
homepage   : https://github.com/abseil/abseil-py
license    : Apache-2.0
component  : programming.python
summary    : Abseil Python Common Libraries
description: |
    A collection of Python library code from Google's Python code base for building Python applications.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
    - python-wheel
rundeps    :
    - python-six
checkdeps:
    - python-six
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # Upstream provides some “smoke tests” that we can run, too. We cannot use the
    # wrapper smoke_tests/smoke_test.sh because it downloads things from the
    # Internet, but we can run the Python scripts manually.
    export PYTHONPATH=%python3_sitepackages%:"$PWD"

    python3 smoke_tests/sample_app.py --echo smoke 2>&1 | grep -F 'echo is smoke.'
    python3 smoke_tests/sample_test.py | grep -Fq 'msg_for_test'
