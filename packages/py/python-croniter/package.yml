# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-croniter
version    : 6.2.4
release    : 17
source     :
    - https://files.pythonhosted.org/packages/source/c/croniter/croniter-6.2.4.tar.gz : fc124f751b1b04805c2a04b061898b436b45ab2320b045e1e052ea895de65189
homepage   : https://github.com/kiorky/croniter
license    : MIT
component  : programming.python
summary    : croniter provides iteration for datetime object with cron like format
description: |
    croniter is a python module to provide iteration for datetime object.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
    - python-packaging
    - python-pathspec
    - python-pluggy
    - python-setuptools
    - python-trove-classifiers
checkdeps  :
    - python-dateutil
    - python-pytest
    - python-pytz
rundeps    :
    - python-dateutil
    - python-pytz
setup      : |
    # don't hardcode fucking version constraints
    sed -i 's/==/>=/g' pyproject.toml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # pytz/DST/timezone tests fail on Python 3.14 (zoneinfo vs pytz tzinfo behavior)
    %pytest -v -k 'not pytz and not test_dst_daily and not test_dst_hourly and not test_timezone_dateutil'
