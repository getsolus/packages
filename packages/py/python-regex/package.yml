# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-regex
version    : 2026.7.19
release    : 23
source     :
    - https://github.com/mrabarnett/mrab-regex/archive/refs/tags/2026.7.19.tar.gz : b9c7340160c4a9c6efe599dfdb191a239666de0fcdc9aed2897d99a91e076e97
homepage   : https://github.com/mrabarnett/mrab-regex
license    : Python-2.0
component  : programming.python
summary    : Alternative regular expression module, to replace re
description: |
    This regex implementation is backwards-compatible with the standard 're' module, but offers additional functionality.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
build      : |
    %pyproject_build
install    : |
    %pyproject_install
