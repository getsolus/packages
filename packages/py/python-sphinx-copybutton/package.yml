# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-sphinx-copybutton
version    : 0.5.2
release    : 1
source     :
    - https://pypi.debian.net/sphinx-copybutton/sphinx-copybutton-0.5.2.tar.gz : 4cf17c82fb9646d1bc9ca92ac280813a3b605d8c421225fd9913154103ee1fbd
homepage   : https://sphinx-copybutton.readthedocs.io
license    : MIT
component  : programming.python
summary    : Add a "copy" button to code blocks in Sphinx
description: |
    A small sphinx extension to add a "copy" button to code blocks.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - python-sphinx
build      : |
    %pyproject_build
install    : |
    %pyproject_install
