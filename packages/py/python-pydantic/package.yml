# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pydantic
version    : 2.13.4
release    : 8
source     :
    - https://github.com/pydantic/pydantic/archive/refs/tags/v2.13.4.tar.gz : 414655bcc8f10ee68017c3efdd76bdd3e39172a5b119525e16cda4305d4b9505
homepage   : https://github.com/pydantic/pydantic
license    : MIT
component  :
    - core : programming.python
    - programming.python
summary    :
    - core : Core functionality for Pydantic validation and serialization
    - Data validation using Python type hints
description: |
    Data validation using Python type hints. Fast and extensible, Pydantic plays nicely with your linters/IDE/brain. Define how data should be in pure, canonical Python 3.8+; validate it with Pydantic.
networking : true
builddeps  :
    - python-build
    - python-hatch-fancy-pypi-readme
    - python-hatchling
    - python-installer
    - python-maturin
    - python-packaging
    - python-wheel
checkdeps  :
    - python-annotated-types
    - python-dirty-equals
    - python-hypothesis
    - python-inline-snapshot
    - python-jsonschema
    - python-pytest
    - python-pytest-benchmark
    - python-pytest-examples
    - python-pytest-mock
    - python-pytest-run-parallel
    - python-pytest-timeout
    - python-pytokens
    - python-pytz
    - python-ruff
    - python-typing-extensions
    - python-typing-inspection
rundeps    :
    - core :
        - python-typing-extensions
    - python-annotated-types
    - python-pydantic-core
    - python-typing-extensions
    - python-typing-inspection
environment: |
    # Set these manually because we don't have a macro for this.
    # Usually, our Cargo build macro sets these options, but we're
    # not using that in this package.
    CARGO_BUILD_DEP_INFO_BASEDIR="${workdir}"; export CARGO_BUILD_DEP_INFO_BASEDIR;
    CARGO_NET_RETRY=5; export CARGO_NET_RETRY;
    CARGO_PROFILE_RELEASE_DEBUG="full"; export CARGO_PROFILE_RELEASE_DEBUG;
    CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO="off"; export CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO;
    CARGO_PROFILE_RELEASE_LTO="off"; export CARGO_PROFILE_RELEASE_LTO;
    CARGO_PROFILE_RELEASE_STRIP="none"; export CARGO_PROFILE_RELEASE_STRIP;
setup      : |
    %patch -p1 -i ${pkgfiles}/53706f8f95585f2ae0cee43c1df944956dd2a31f.patch
    %patch -p1 -i ${pkgfiles}/e3fe82eba47c78758a21d8413c52063fc105550e.patch

    pushd pydantic-core
    %cargo_fetch
    popd

    # We don't need benchmark testing for a distro package.
    rm -rf tests/benchmarks
build      : |
    pushd pydantic-core
    %pyproject_build
    popd

    %pyproject_build
install    : |
    pushd pydantic-core
    %pyproject_install
    popd

    %pyproject_install
check      : |
    _pytest_args=(
        # We don't care about benchmarks
        --deselect tests/benchmarks
        --deselect tests/pydantic_core/benchmarks
        # We don't care about code formatting
        --deselect tests/test_docs.py
        --deselect tests/pydantic_core/test_docstrings.py
        --deselect tests/test_types.py::test_string_fails
        --deselect 'tests/test_networks.py::test_address_invalid[foobar-An email address must have an @-sign.]'
        # Probably pytz
        --deselect tests/test_annotated.py::test_utcoffset_validator_example_pattern
        # No idea. Revisit another time
        --deselect tests/pydantic_core/validators/test_union.py
    )

    %pytest -v "${_pytest_args[@]}"
patterns   :
    - core :
        - /usr/lib/python3.*/site-packages/pydantic_core*
