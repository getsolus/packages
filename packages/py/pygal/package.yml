# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pygal
version    : 3.1.3
release    : 12
source     :
    - https://github.com/Kozea/pygal/archive/refs/tags/3.1.3.tar.gz : 39dd727cb65400cb76c4a70a522a9899bbf10f9be19ace90ee4796b6476d8720
homepage   : https://www.pygal.org/
license    : LGPL-3.0-or-later
component  : programming.python
summary    : PYthon svg GrAph plotting Library
description: |
    pygal is a dynamic SVG charting library written in python.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-cairosvg
    - python-lxml
    - python-pyquery
    - python-pytest
    - python-pytest-cov
    - python-ruff
setup      : |
    %patch -p1 -i  ${pkgfiles}/fix-importlib.patch

    # Drop deprecated pytest-runner
    sed -e "s|'pytest-runner'||" -i setup.py
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
