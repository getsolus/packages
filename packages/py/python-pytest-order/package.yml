# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pytest-order
version    : 1.5.0
release    : 1
source     :
    - https://github.com/pytest-dev/pytest-order/archive/refs/tags/v1.5.0.tar.gz : 7cfecc01621bff0736f15de825c15eb9a7f7b1cec86bec2ed70e4741e59bc826
homepage   : https://pytest-order.readthedocs.io/
license    : MIT
component  : programming.python
summary    : Pytest plugin that allows to customize the test execution order
description: |
    Pytest plugin that allows you to customize the order in which your tests are run. It uses the marker order that defines when a specific test shall run, either by using an ordinal number, or by specifying the relationship to other tests.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest
    - python-pytest-dependency
    - python-pytest-mock
    - python-pytest-xdist
rundeps    :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
