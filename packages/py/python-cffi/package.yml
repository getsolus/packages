# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-cffi
version    : 2.1.0
release    : 24
source     :
    - https://pypi.io/packages/source/c/cffi/cffi-2.1.0.tar.gz : efc1cdd798b1aaf39b4610bba7aad28c9bea9b910f25c784ccf9ec1fa719d1f9
homepage   : https://cffi.readthedocs.io
license    : MIT
component  : programming.python
summary    : Foreign Function Interface for Python calling C code
description: |
    C Foreign Function Interface for Python. Interact with almost any C code from Python, based on C-like declarations that you can often copy-paste from header files or documentation.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-packaging
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-cparser
    - python-pytest
rundeps    :
    - python-cparser
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v -k 'not test_distutils_api and not test_setuptools'
