# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-libevdev
version    : 0.13.1
release    : 8
source     :
    - https://gitlab.freedesktop.org/libevdev/python-libevdev/-/archive/0.11/python-libevdev-0.13.1.tar.gz : 
        97137a2b622116085eb79af233766bbdb5a748d1b8d01ecb04e4a7737ab41113
homepage   : https://gitlab.freedesktop.org/libevdev/python-libevdev/
license    : MIT
component  : programming.python
summary    : A Python wrapper around libevdev
description: |
    This project is a Python wrapper around libevdev, taking advantage of libevdev's advanced event handling.
builddeps  :
    - pkgconfig(libevdev)
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-pytest
rundeps    :
    - libevdev
build      : |
    %pyproject_build
install    : |
    %python3_install
check       : |
    %pytest -v -k 'not test_has_property and not test_enable_event_code and not test_mt_value and not test_slot_value'
