# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-toolz
version    : 1.2.0
release    : 8
source     :
    - https://files.pythonhosted.org/packages/source/t/toolz/toolz-1.2.0.tar.gz : 9667a038e9d6ecba37995e26cb2f59ec6420b6ad8dd9677de59db9b956b08490
license    : BSD-3-Clause
homepage   : https://github.com/pytoolz/toolz/
component  : programming.python
summary    : A functional standard library for Python
description: |
    A set of utility functions for iterators, functions, and dictionaries for Python
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-setuptools-git-versioning
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %python3_test pytest
