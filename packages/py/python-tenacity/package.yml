# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-tenacity
version    : 9.2.0
release    : 17
source     :
    - https://github.com/jd/tenacity/archive/refs/tags/9.2.0.tar.gz : 597d0ee1f4ab5e06c67f06422740babb49c6ca865cb28fdc352e81ce90e49fba
homepage   : https://tenacity.readthedocs.io/en/latest/
license    : Apache-2.0
component  : programming.python
summary    : Retrying library for Python
description: |
    Tenacity is a general-purpose retrying library, written in Python, to simplify the task of adding retry behavior to just about anything.
builddeps  :
    - python-build
    - python-hatch-vcs
    - python-hatchling
    - python-installer
    - python-setuptools
    - python-setuptools-scm
checkdeps  :
    - python-pytest
    - python-tornado
    - python-typeguard
rundeps    :
    - python-six
    - python-tornado
build      : |
    # hatch VCS has trouble with this package
    export SETUPTOOLS_SCM_PRETEND_VERSION=%version%
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest
