# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-json-logger
version    : 4.2.0
release    : 5
source     :
    - https://github.com/nhairs/python-json-logger/releases/download/v4.2.0/python_json_logger-4.2.0.tar.gz : e371ebe22ec01e289850102091a2b1f6fc9e655c7f1f5f29073936756c290afa
homepage   : https://github.com/nhairs/python-json-logger
license    : BSD-2-Clause
component  : programming.python
summary    : A python library adding a json log formatter
description: |
    This library is provided to allow standard python logging to output log data as json objects. With JSON we can make our logs more readable by machines and we can stop writing custom parsers for syslog type records.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-freezegun
    - python-pytest
    - python-tzdata
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
