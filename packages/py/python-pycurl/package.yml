# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pycurl
version    : 7.47.0
release    : 29
source     :
    - https://files.pythonhosted.org/packages/source/p/pycurl/pycurl-7.47.0.tar.gz : 5e3cf357939da8d4ceefe3c7f305afcf9b47cba66cfd95e7768ca43b38445e14
homepage   : https://pypi.org/project/pycurl
license    :
    - LGPL-2.1-or-later
    - MIT
component  : programming.python
summary    : Curl module for python
description: |
    PycURL is a Python interface to libcurl. PycURL can be used to fetch objects identified by a URL from a Python program, similar to the urllib Python module. PycURL is mature, very fast, and supports a lot of features.
builddeps  :
    - pkgconfig(libcurl)
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - flask
    - python-flaky
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    mv $installdir/usr/share/doc/pycurl $installdir/usr/share/doc/python-pycurl
check      : |
    # remove test-cases that won't work in our sandbox
    rm -fv tests/{ftp_test.py,seek_cb_test.py,ssh_key_cb_test.py,test_connect_only_send_recv.py,test_websocket.py,test_websocket_callback.py}
    rm examples/tests/{test_gtk.py,test_build_config.py}
    # Deselect test_libcurl_ssl tests (require bundled libcurl) and Kerberos tests (libcurl not built with Kerberos support)
    %pytest -v -k "not (test_libcurl_ssl or test_krb4level or test_krblevel)"
