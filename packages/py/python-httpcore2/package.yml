# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-httpcore2
version    : 2.16.0
release    : 1
source     :
    - https://files.pythonhosted.org/packages/source/h/httpcore2/httpcore2-2.16.0.tar.gz : c72cd0413563b17e1cd8354677dff887466f8ec2551679759e93126534428643
homepage   : https://github.com/pydantic/httpx2
license    : BSD-3-Clause
component  : programming.python
summary    : A minimal low-level HTTP client
description: |
    The HTTPCore 2 package provides a minimal low-level HTTP client, which does one thing only. Sending HTTP requests.
builddeps  :
    - python-build
    - python-hatch-fancy-pypi-readme
    - python-hatchling
    - python-installer
    - python-setuptools
    - python-uv-dynamic-versioning
rundeps    :
    - python-anyio
    - python-idna
build      : |
    %pyproject_build
install    : |
    %pyproject_install
