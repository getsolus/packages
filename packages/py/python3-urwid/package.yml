# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python3-urwid
version    : 4.0.13
release    : 17
source     :
    - https://files.pythonhosted.org/packages/source/u/urwid/urwid-4.0.13.tar.gz : 23afb15197b9e3b656b8c55bb3e18d50463c34db1982ec81ef5034525bea6c76
