# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pymediainfo
version    : 7.0.1
release    : 21
source     :
    - https://files.pythonhosted.org/packages/source/p/pymediainfo/pymediainfo-7.0.1.tar.gz : 0d5df59ecc615e24c56f303b8f651579c6accab7265715e5d429186d7ba21514
homepage   : https://github.com/sbraz/pymediainfo
license    : MIT
component  : programming.python
summary    : A Python wrapper around the MediaInfo command line utility
description: |
    This small package is a wrapper around the MediaInfo library. It works on Linux, Mac OS X and Windows.
builddeps  :
    - pkgconfig(libmediainfo)
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-pdm-backend
checkdeps  :
    - python-pytest
rundeps    :
    - libmediainfo
setup      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest
