# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pytest-examples
version    : 0.0.18
release    : 1
source     :
    - https://github.com/pydantic/pytest-examples/archive/refs/tags/v0.0.18.tar.gz : 9437fe5490af8683db6749411c6ef7b949601f32fdb174eedf26e1829290d545
homepage   : https://pypi.org/project/pytest-examples/
license    : MIT
component  : programming.python
summary    : Pytest plugin for testing examples in docstrings and markdown files
description: |
    Pytest plugin for testing examples in docstrings and markdown files.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
    - python-wheel
checkdeps  :
    - python-black
    - python-pytest
    - python-pytokens
    - python-ruff
rundeps    :
    - python-black
    - python-pytest
setup      : |
    # Fix tests with new ruff
    %patch -p1 -i ${pkgfiles}/60ae70d0.patch
    %patch -p1 -i ${pkgfiles}/fix-tests.patch
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    _pytest_args=(
        -W=ignore::DeprecationWarning
        # Failures with new Ruff
        --deselect 'tests/test_lint.py::test_ruff_config'
        --deselect 'tests/test_run_examples.py::test_run_example_ok_fail'
        --deselect 'tests/test_run_examples.py::test_ruff_ok'
        --deselect 'tests/test_run_examples.py::test_ruff_error'
        # Failures with Black
        --deselect 'tests/test_run_examples.py::test_black_error'
        --deselect 'tests/test_run_examples.py::test_black_error_dot_space'
        --deselect 'tests/test_run_examples.py::test_black_error_multiline'
    )

    %pytest -v "${_pytest_args[@]}"
