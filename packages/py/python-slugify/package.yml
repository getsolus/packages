# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-slugify
version    : 9.0.0
release    : 13
source     :
    - https://github.com/un33k/python-slugify/archive/refs/tags/v9.0.0.tar.gz : 77144c542e3dd21f50185a5f19919042567a622928d4bc30a2acb7edb96986c2
homepage   : https://github.com/un33k/python-slugify
license    : MIT
component  : programming.python
summary    : Returns unicode slugs
description: |
    A Python slugify application that handles unicode.
builddeps  :
    - python-build
    - python-setuptools
    - python-installer
    - python-text-unidecode
checkdeps  :
    - python-pytest
rundeps    :
    - python-text-unidecode
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest test.py
