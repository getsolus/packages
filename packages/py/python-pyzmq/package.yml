# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pyzmq
version    : 27.1.0
release    : 26
source     :
    - https://github.com/zeromq/pyzmq/archive/refs/tags/v27.1.0.tar.gz : 4fd229c1c7b10e2b578778a8919694186731c69dcb26e9c33239bee67a4dc0be
homepage   : https://github.com/zeromq/pyzmq
license    :
    - BSD-3-Clause
    - LGPL-3.0-or-later
component  : programming.python
summary    : Python bindings for zeromq
description: |
    This package contains Python bindings for ØMQ. ØMQ is a lightweight and fast messaging implementation
builddeps  :
    - pkgconfig(libzmq)
    - cmake
    - cython
    - python-build
    - python-installer
    - python-scikit-build-core
    - python-setuptools
    - python-wheel
rundeps    :
    - python-tornado
build      : |
    %pyproject_build
install    : |
    %pyproject_install
