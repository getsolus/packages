# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pyzmq
version    : 27.2.0
release    : 27
source     :
    - https://github.com/zeromq/pyzmq/archive/refs/tags/v27.2.0.tar.gz : 25f91f9ea7c0b4a4c1884379463006a383516a47c49c197aba8c5ae67fd3678a
homepage   : https://github.com/zeromq/pyzmq
license    :
    - BSD-3-Clause
    - LGPL-3.0-or-later
component  : programming.python
summary    : Python bindings for zeromq
description: |
    This package contains Python bindings for ØMQ. ØMQ is a lightweight and fast messaging implementation
builddeps  :
    - pkgconfig(libzmq)
    - cmake
    - cython
    - python-build
    - python-installer
    - python-scikit-build-core
    - python-setuptools
    - python-wheel
checkdeps  :
    - cython
    - python-cffi
    - python-gevent
    - python-paramiko
    - python-pexpect
    - python-pytest
    - python-pytest-asyncio
    - python-tornado
rundeps    :
    - python-tornado
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest --ignore=tests/test_curve_keygen.py
