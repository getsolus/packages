# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-httpx2
version    : 2.16.0
release    : 1
source     :
    - https://github.com/pydantic/httpx2/archive/refs/tags/v2.16.0.tar.gz : 9112f94395334ffac6afc93a370bd7a7a13fc3f2d335e62774ebbd29f8cebcf0
homepage   : https://github.com/pydantic/httpx2
license    : GPL-2.0-or-later
component  : programming.python
summary    : A next generation HTTP client for Python
description: |
    HTTPX2 is a fully featured HTTP client library for Python. It includes an integrated command line client, has support for both HTTP/1.1 and HTTP/2, and provides both sync and async APIs.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
build      : |
    %python3_setup
install    : |
    %python3_install
