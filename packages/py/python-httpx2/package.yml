# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-httpx2
version    : 2.13.1
release    : 1
source     :
    - https://github.com/pydantic/httpx2/archive/refs/tags/v2.13.1.tar.gz : 73e63260d8fdfc6a35fd91056e46f721b40c6ef0f07e7824cd68b584352a5972
homepage   : https://github.com/pydantic/httpx2
license    : GPL-2.0-or-later
component  : programming.python
summary    : A next generation HTTP client for Python
description: |
    HTTPX2 is a fully featured HTTP client library for Python. It includes an integrated command line client, has support for both HTTP/1.1 and HTTP/2, and provides both sync and async APIs.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
build      : |
    %python3_setup
install    : |
    %python3_install
