# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-httpx2
version    : 2.16.2
release    : 3
source     :
    - https://files.pythonhosted.org/packages/source/h/httpx2/httpx2-2.16.2.tar.gz : 748b615678f07d8e3b183efe81ad13b655ca88bfc56ce4589219b2d442860574
homepage   : https://github.com/pydantic/httpx2
license    : GPL-2.0-or-later
component  : programming.python
summary    : A next generation HTTP client for Python
description: |
    HTTPX2 is a fully featured HTTP client library for Python. It includes an integrated command line client, has support for both HTTP/1.1 and HTTP/2, and provides both sync and async APIs.
builddeps  :
    - python-build
    - python-hatch-fancy-pypi-readme
    - python-hatchling
    - python-installer
    - python-setuptools
    - python-uv-dynamic-versioning
rundeps    :
    - python-click
    - python-httpcore2
    - python-rich
build      : |
    %pyproject_build
install    : |
    %pyproject_install
