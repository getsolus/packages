# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-lsp-server
version    : 1.15.0
release    : 20
source     :
    - https://files.pythonhosted.org/packages/source/p/python_lsp_server/python_lsp_server-1.15.0.tar.gz : 85fa090262c3d1aef09b759d98811d6cb9ad5bbc58af15d588608ae8c1925801
homepage   : https://github.com/python-lsp/python-lsp-server
license    : MIT
component  : programming.python
summary    : Python Language Server for the Language Server Protocol
description: |
    Fork of the python-language-server project, maintained by the Spyder IDE team and the community. This is a Python 3.6+ implementation of the Language Server Protocol.
networking : true
builddeps  :
    - python-build
    - python-docstring-to-markdown
    - python-installer
    - python-setuptools-scm
    - python-wheel
checkdeps  :
    - autopep8
    - flake8
    - matplotlib
    - pydocstyle
    - pylint
    - python-flaky
    - python-jedi
    - python-lsp-jsonrpc
    - python-pandas
    - python-pytest-cov
    - python-qtpy
    - python-rope
    - python-ujson
    - python-websockets
    - python-whatthepatch
    - yapf
rundeps    :
    - autopep8
    - flake8
    - pydocstyle
    - pylint
    - python-docstring-to-markdown
    - python-jedi
    - python-lsp-jsonrpc
    - python-pluggy
    - python-rope
    - python-ujson
    - python-whatthepatch
    - yapf
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # Ignore websockets test file, pylint integration tests, and specific flaky hover/teardown tests
    %pytest --ignore=test/test_python_lsp.py \
            --ignore=test/plugins/test_pylint_lint.py \
            -k 'not test_pyqt_completion and not test_hover_signature_formatting and not test_missing_message'
