# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-xxhash
version    : 4.0.0
release    : 15
source     :
    - https://files.pythonhosted.org/packages/source/x/xxhash/xxhash-4.0.0.tar.gz : 6b4040b26c73c75e6c12273b0ae237f9235f39cce5fabb683a64e9f20d09df8b
homepage   : https://github.com/ifduyue/python-xxhash
license    : BSD-2-Clause
component  : programming.python
summary    : Python binding for xxHash
description: |
    xxhash is a Python binding for the xxHash library.
builddeps  :
    - pkgconfig(libxxhash)
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-pytest
rundeps    :
    - xxhash
environment: |
    export XXHASH_LINK_SO=1
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    ## Tests wont run without this trick
    mv xxhash xxhash_hidden
    %pytest -v --ignore=tests/test_stubs_pyright.py
