# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-guessit
version    : 4.4.0
release    : 18
source     :
    - https://github.com/guessit-io/guessit/releases/download/v4.4.0/guessit-4.4.0.tar.gz : cca2c19ecd872c75ee7ebcbdc11075f5ae884882ec0ad67f742c3d25f2d47beb
homepage   : https://github.com/guessit-io/guessit
license    : LGPL-3.0-or-later
component  : programming.python
summary    : A library for guessing information from video filenames
description: |
    GuessIt is a python library that extracts as much information as possible from a video filename. It has a very powerful matcher that allows to guess properties from a video using its filename only. This matcher works with both movies and tv shows episodes.
builddeps  :
    - pylint
    - python-babelfish
    - python-build
    - python-dateutil
    - python-hatchling
    - python-installer
    - python-wheel
checkdeps  :
    - python-pytest
    - python-pytest-benchmark
    - python-pytest-cov
    - python-pytest-mock
    - python-rebulk
    - pyyaml
rundeps    :
    - python-babelfish
    - python-dateutil
    - python-rebulk
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
