# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-svglib
version    : 2.1.0
release    : 8
source     :
    - https://files.pythonhosted.org/packages/source/s/svglib/svglib-2.1.0.tar.gz : c079bc5fa9e12736b23e7855413320a78afdab54c9492de48ade7bf318187605
license    : LGPL-3.0-only
homepage   : https://github.com/deeplook/svglib
component  : programming.python
summary    : A pure-Python library for reading and converting SVG
description: |
    svglib is a pure-Python library for reading SVG files and converting them (to a reasonable degree) to other formats using the ReportLab Open Source toolkit
networking : true        #check
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
    - python-wheel
checkdeps  :
    - harfbuzz
    - python-cssselect2
    - python-lxml
    - python-pytest
    - python-reportlab
rundeps    :
    - python-cssselect2
    - python-lxml
    - python-reportlab
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
   %pytest -v
