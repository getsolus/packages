# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-marshmallow
version    : 4.3.1
release    : 13
source     :
    - https://github.com/marshmallow-code/marshmallow/archive/refs/tags/4.3.1.tar.gz : 0b15487b6329cbe692870d1e8306f5f87371904c833c0b4a063596532b5e8c01
homepage   : https://github.com/marshmallow-code/marshmallow
license    : MIT
component  : programming.python
summary    : A lightweight library for converting complex datatypes to and from native Python datatypes
description: |
    marshmallow is an ORM/ODM/framework-agnostic library for converting complex datatypes, such as objects, to and from native Python datatypes.
builddeps  :
    - python-build
    - python-flit-core
    - python-installer
    - python-packaging
    - python-wheel
checkdeps  :
    - python-pytest
    - python-pytz
    - python-simplejson
rundeps    :
    - python-packaging
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
