# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-faust-cchardet
version    : 3.2.0
release    : 7
source     :
    - https://files.pythonhosted.org/packages/source/f/faust-cchardet/faust_cchardet-3.2.0.tar.gz : ffae2d6fccd414adf542931602b7b28239d6d85a22f493e54df02d6bbc7d3dcd
homepage   : https://github.com/faust-streaming/cChardet
license    :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
    - MPL-1.1
component  : programming.python
summary    : universal character encoding detector
description: |
    cChardet is high speed universal character encoding detector.
replaces   :
    - python-cchardet
builddeps  :
    - cython
    - meson-python
    - patchelf
    - python-build
    - python-installer
    - python-pkgconfig
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
