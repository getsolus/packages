# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-greenlet
version    : 3.5.4
release    : 20
source     :
    - https://files.pythonhosted.org/packages/source/g/greenlet/greenlet-3.5.4.tar.gz : 0232ae1de90a8e07867bb127d7a6ba2301e859145489f25cda8a6096dabe1d20
homepage   : https://github.com/python-greenlet/greenlet
license    :
    - MIT
    - PSF-2.0
component  : programming.python
summary    : Lightweight in-process concurrent programming
description: |
    The greenlet package is a spin-off of Stackless, a version of CPython that supports micro-threads called "tasklets". Tasklets run pseudo-concurrently (typically in a single or a few OS-level threads) and are synchronized with data exchanges on "channels".
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-objgraph
    - python-psutil
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    _python_version=$(python -c 'import sys; print("".join(map(str, sys.version_info[:2])))')
    export PYTHONPATH="${PWD}/build/lib.linux-x86_64-cpython-${_python_version}:${PYTHONPATH}"
    python -m unittest discover -v greenlet.tests
