# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-websocket-client
version    : 1.10.0
release    : 20
source     :
    - https://github.com/websocket-client/websocket-client/archive/refs/tags/v1.10.0.tar.gz : ca21324d087f3bfd1efd29c21b25687c353c4bced514eeb9bfeef15340d105f8
homepage   : https://github.com/websocket-client/websocket-client
license    : LGPL-2.1-or-later
component  : programming.python
summary    : Websocket client for python
description: |
    The websocket-client module is WebSocket client for python. It provides the low level APIs for WebSocket. All APIs are the synchronous functions.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - python-six
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    # remove tests that got installed into the buildroot
    rm -r $installdir/usr/lib/python%python3_version%/site-packages/websocket/tests/
