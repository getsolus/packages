# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-aiohappyeyeballs
version    : 2.7.1
release    : 8
source     :
    - https://files.pythonhosted.org/packages/source/a/aiohappyeyeballs/aiohappyeyeballs-2.7.1.tar.gz : 065665c041c42a5938ed220bdcd7230f22527fbec085e1853d2402c8a3615d9d
homepage   : https://aiohappyeyeballs.readthedocs.io/
license    : PSF-2.0
component  : programming.python
summary    : Happy Eyeballs for pre-resolved hosts
description: |
    This library exists to allow connecting with Happy Eyeballs (RFC 8305) when you already have a list of addrinfo and not a DNS name.
builddeps  :
    - python-build
    - python-installer
    - python-poetry-core
checkdeps  :
    - python-pytest
    - python-pytest-asyncio
    - python-pytest-cov
build      : |
    %python3_setup
install    : |
    %python3_install
check      : |
    %python3_test pytest -v --no-cov
