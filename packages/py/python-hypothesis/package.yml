# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-hypothesis
version    : 6.165.0
release    : 22
source     :
    - https://github.com/HypothesisWorks/hypothesis/archive/refs/tags/v6.165.0.tar.gz : 0c2da644957a8cd7a077be13e5920ed2f3ab08c1416929b9ed25a4559024c793
homepage   : https://hypothesis.works/
license    : MPL-2.0
component  : programming.python
summary    : Advanced property-based (QuickCheck-like) testing for Python
description: |
    Hypothesis is an advanced testing library for Python. It lets you write tests which are parametrized by a source of examples, and then generates simple and comprehensible examples that make your tests fail. This lets you find more bugs in your code with less work.
networking : true
builddeps  :
    - python-build
    - python-installer
    - python-maturin
    - python-wheel
checkdeps  :
    - git
    - numpy
    - python-attrs
    - python-black
    - python-dpcontracts
    - python-lark-parser
    - python-libcst
    - python-pandas
    - python-pexpect
    - python-pytest
    - python-pytest-xdist
    - python-pytokens
    - python-pytz
    - python-sortedcontainers
    - python-watchdog
    - scipy
rundeps    :
    - python-attrs
    - python-sortedcontainers
environment: |
    # Set these manually because we don't have a macro for this.
    # Usually, our Cargo build macro sets these options, but we're
    # not using that in this package.
    CARGO_BUILD_DEP_INFO_BASEDIR="${workdir}"; export CARGO_BUILD_DEP_INFO_BASEDIR;
    CARGO_NET_RETRY=5; export CARGO_NET_RETRY;
    CARGO_PROFILE_RELEASE_DEBUG="full"; export CARGO_PROFILE_RELEASE_DEBUG;
    CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO="off"; export CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO;
    CARGO_PROFILE_RELEASE_LTO="off"; export CARGO_PROFILE_RELEASE_LTO;
    CARGO_PROFILE_RELEASE_STRIP="none"; export CARGO_PROFILE_RELEASE_STRIP;
setup      : |
    pushd hypothesis/rust
    %cargo_fetch
    popd
build      : |
    pushd hypothesis
    %pyproject_build
    popd
install    : |
    pushd hypothesis
    %pyproject_install
    popd
check      : |
    pushd hypothesis
    _pytest_args=(
        # --override-ini="addopts="
        # ignore deprecation warnings
        -W=ignore::DeprecationWarning
        # Run tests in parallel, takes forever otherwise
        -n %YJOBS%
        # Keep rootdir at hypothesis-python/ so --deselect node ids resolve
        --rootdir=.
        # Depends on python-hypothesis-crosshair which is not packaged
        --ignore=tests/crosshair
        # Depends on python-fakeredis which is not packaged
        --ignore=tests/redis
        # pytz is fucky
        --ignore=tests/datetime
        # Not pulling in GhostWriter for this
        --ignore=tests/ghostwriter
        # Fails with AssertionError for some reason
        --ignore=tests/nocover/test_scrutineer.py
        # fails with mismatch for some reason
        --deselect 'tests/snapshots/test_always_failing.py::test_always_failing[emails]'
        --deselect 'tests/quality/test_integers.py::test_biases_towards_boundary_values'
        # The pytest-snapshot plugin is dead and no longer works
        --ignore=tests/snapshots
        --deselect 'tests/cover/test_custom_reprs.py::test_reprs_as_created'
        --deselect 'tests/cover/test_custom_reprs.py::test_reprs_as_created_interactive'
        --deselect 'tests/cover/test_custom_reprs.py::test_reprs_as_created_consistent_calls_despite_indentation'
        --deselect 'tests/cover/test_custom_reprs.py::test_map_to_str_prints_as_repr'
        --deselect 'tests/cover/test_custom_reprs.py::test_map_to_bytes_prints_as_repr'
        --deselect 'tests/cover/test_custom_reprs.py::test_invalid_call_syntax_falls_back_to_repr'
      )

    export PATH="${installdir}/usr/bin:${PATH}"

    %pytest -vv "${_pytest_args[@]}" tests/
    popd
