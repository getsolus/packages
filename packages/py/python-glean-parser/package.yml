# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-glean-parser
version    : 20.2.0
release    : 3
source     :
    - https://github.com/mozilla/glean_parser/archive/refs/tags/v20.2.0.tar.gz : 4ba20752196393b4a377b6a3db6903f236470727494bd3bc4ec48e249da1c06c
homepage   : https://mozilla.github.io/glean_parser/
license    : MPL-2.0
component  : programming.python
summary    : Parser tools for Mozilla's Glean telemetry.
description: |
    Contains various utilities for handling metrics.yaml and pings.yaml for the Glean SDKs. This includes producing generated code for various integrations, linting and coverage testing.
networking : true # Check
builddeps  :
    - python-build
    - python-hatch-vcs
    - python-installer
    - python-wheel
checkdeps  :
    - python-click
    - python-diskcache
    - python-jinja
    - python-jsonschema
    - python-platformdirs
    - python-pytest
    - pyyaml
rundeps    :
    - python-click
    - python-diskcache
    - python-jinja
    - python-jsonschema
    - python-platformdirs
    - pyyaml
build      : |
    export SETUPTOOLS_SCM_PRETEND_VERSION=${version}

    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
