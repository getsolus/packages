# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-requests-oauthlib
version    : 2.0.0
release    : 13
source     :
    - https://github.com/requests/requests-oauthlib/archive/refs/tags/v2.0.0.tar.gz : ef958f83da020629259afd41f793e6d10ef32139ce849ada8a9c3b9d3ef2e56b
homepage   : https://github.com/requests/requests-oauthlib
license    : ISC
component  : programming.python
summary    : OAuthlib support for Python-Requests
description: |
    This project provides first-class OAuth library support for python-requests.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-mock
    - python-oauthlib
    - python-pyjwt
    - python-pytest
    - python-requests
    - python-requests-mock
rundeps    :
    - python-oauthlib
    - python-requests
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # Run pytest but skip specific tests that attempt to contact external servers
    %pytest -v --ignore=tests/examples -k 'not testCanPostBinaryData and not test_content_type_override and not test_url_is_native_str'
