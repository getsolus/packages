# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-selenium
version    : 4.46.0
release    : 13
source     :
    - https://files.pythonhosted.org/packages/source/s/selenium/selenium-4.46.0.tar.gz : 54f7e1a4df5f7508ac8c38ce2ea584db1b27083dd79962b22524219219df5cbe
homepage   : https://www.selenium.dev/
license    : Apache-2.0
component  : programming.python
summary    : A browser automation framework and ecosystem
description: |
    Selenium is an umbrella project encapsulating a variety of tools and libraries enabling web browser automation. Selenium specifically provides infrastructure for the W3C WebDriver specification — a platform and language-neutral coding interface compatible with all major web browsers.
networking : true
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-setuptools-rust
    - python-wheel
rundeps    :
    - geckodriver
    - python-certifi
    - python-trio-websocket
    - python-urllib3
    - python-websocket-client
environment: |
    export PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
build      : |
    %pyproject_build
install    : |
    %pyproject_install
