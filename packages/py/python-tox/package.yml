# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-tox
version    : 4.60.0
release    : 21
source     :
    - https://files.pythonhosted.org/packages/source/t/tox/tox-4.60.0.tar.gz : 6f93bb580d35e00fc69cfec1116eecbe21155f747753ca5019374f7c69b2eac9
homepage   : https://tox.wiki/
license    : MIT
component  : programming.python
summary    : Python virtualenv management and testing tool
description: |
    Tox is a generic virtualenv management and test command line tool
networking : true
builddeps  :
    - python-build
    - python-docutils
    - python-hatch-vcs
    - python-hatchling
    - python-installer
    - python-packaging
    - python-wheel
rundeps    :
    - python-cachetools
    - python-chardet
    - python-colorama
    - python-filelock
    - python-packaging
    - python-platformdirs
    - python-pluggy
    - python-pyproject-api
    - python-tomli-w 
    - virtualenv
setup      : |
    %pyproject_build
install    : |
    %pyproject_install
