# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-injector
version    : 0.24.0
release    : 11
source     :
    - https://files.pythonhosted.org/packages/source/i/injector/injector-0.24.0.tar.gz : e85a75d1516cff2f03170f3fd1219f56acb25c9a05e307819ae0dcde3dad3d3f
homepage   : https://github.com/python-injector/injector
license    : BSD-3-Clause
component  : programming.python
summary    : Python dependency injection framework
description: |
    Injector - Python dependency injection framework, inspired by Guice.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-pytest
    - python-pytest-cov
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
