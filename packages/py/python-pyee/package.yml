# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pyee
version    : 14.0.0
release    : 13
source     :
    - https://pypi.io/packages/source/p/pyee/pyee-14.0.0.tar.gz : 76dd0f4314ecd27f02dc73589dea7fd3853f9b6176d8ef9b122860657e3602de
homepage   : https://github.com/jfhbrook/pyee
license    : MIT
component  : programming.python
summary    : A port of node.js's EventEmitter to python
description: |
    pyee supplies a EventEmitter object that is similar to the EventEmitter class from Node.js. It also supplies a number of subclasses with added support for async and threaded programming in python, such as async/await as seen in python 3.5+
builddeps  :
    - python-build
    - python-installer
    - python-setuptools-scm
    - python-wheel
checkdeps  :
    - python-pytest-asyncio
    - python-pytest-trio
    - python-twisted
rundeps    :
    - python-typing-extensions
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
