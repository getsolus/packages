# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-docutils
version    : '0.23'
release    : 18
source     :
    - https://files.pythonhosted.org/packages/source/d/docutils/docutils-0.23.tar.gz : 746f5060322511280a1e50eb76846ed6bf2342984b2ac04dc42caa1a8d78799e
homepage   : https://docutils.sourceforge.io/
license    :
    - CC0-1.0
    - BSD-2-Clause
    - GPL-3.0-or-later
    - Python-2.0
component  : programming.python
summary    : Python Documentation Utilities
description: |
    Docutils is a modular system for processing documentation into useful formats, such as HTML, XML, and LaTeX. For input Docutils supports reStructuredText, an easy-to-read, what-you-see-is-what-you-get plaintext markup syntax.
builddeps  :
    - python-build
    - python-flit-core
    - python-installer
    - python-packaging
    - python-wheel
checkdeps  :
    - python-myst-parser
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %python3_test -v test/alltests.py
