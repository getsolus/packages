# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-apsw
version    : 3.53.4.0
release    : 23
source     :
    - https://github.com/rogerbinns/apsw/releases/download/3.53.4.0/apsw-3.53.4.0.tar.gz : cd59f6b333094bacd802b5e5796f179f5fd61364f91e788074119b5ec66dc46b
homepage   : https://github.com/rogerbinns/apsw
license    : Zlib
component  : programming.python
summary    : Another Python SQLite Wrapper
description: |
    APSW is a Python wrapper for the SQLite embedded relational database engine. In contrast to other wrappers such as pysqlite it focuses on being a minimal layer over SQLite attempting just to translate the complete SQLite API into Python.
builddeps  :
    - pkgconfig(python3)
    - pkgconfig(sqlite3)
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    _python_version=$(python3 -c 'import sys; print("".join(map(str, sys.version_info[:2])))')
    pushd build/lib.linux-x86_64-cpython-"${_python_version}"
    python3 -m apsw.tests -v
    popd
