# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-asgiref
version    : 3.12.1
release    : 8
source     :
    - https://files.pythonhosted.org/packages/source/a/asgiref/asgiref-3.12.1.tar.gz : 59dcb51c272ad209d59bed5708a64a333083e86017d7fcdd67498eeab7784340
homepage   : https://github.com/django/asgiref/
license    : BSD-3-Clause
component  : programming.python
summary    : ASGI specs, helper code, and adapters
description: |
    ASGI is a standard for Python asynchronous web apps and servers to communicate with each other, and positioned as an asynchronous successor to WSGI.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-pytest-asyncio
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
