# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-mpi4py
version    : 4.1.2
release    : 5
source     :
    - https://files.pythonhosted.org/packages/source/m/mpi4py/mpi4py-4.1.2.tar.gz : 56860286dc45f20e8821e93cb06669e30462348bf866f685553fa4b712d58d02
homepage   : https://github.com/mpi4py/mpi4py
license    : BSD-3-Clause
component  : programming.python
summary    : Python bindings for MPI
description: |
    This package provides Python bindings for the Message Passing Interface (MPI) standard. It is implemented on top of the MPI specification and exposes an API which grounds on the standard MPI-2 C++ bindings.
builddeps  :
    - pkgconfig(ompi)
    - cython
    - python-build
    - python-installer
    - python-setuptools
build      : |
    %pyproject_build
install    : |
    %pyproject_install
