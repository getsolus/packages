# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-setuptools-git-versioning
version    : 3.2.2
release    : 5
source     :
    - https://files.pythonhosted.org/packages/source/s/setuptools-git-versioning/setuptools_git_versioning-3.2.2.tar.gz : c5b38f3242027cdc53c9eb6c4c8410496afdd2895eb0507115d44dbb98af48e5
homepage   : https://pypi.org/project/setuptools-git-versioning/
license    : MIT
component  : programming.python
summary    : Use git repo data for building a version number according to PEP-440
description: |
    setuptools-git-versioning uses git repo data (latest tag, current commit hash, etc) for building a version number according to PEP 440.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
