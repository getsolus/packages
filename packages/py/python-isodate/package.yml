# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-isodate
version    : 0.7.2
release    : 12
source     :
    - https://files.pythonhosted.org/packages/source/i/isodate/isodate-0.7.2.tar.gz : 4cd1aa0f43ca76f4a6c6c0292a85f40b35ec2e43e315b59f06e6d32171a953e6
homepage   : https://github.com/gweis/isodate
license    : BSD-3-Clause
component  : programming.python
summary    : An ISO 8601 date/time/duration parser and formatter
description: |
    This module implements ISO 8601 date, time and duration parsing. The implementation follows ISO8601:2004 standard, and implements only date/time representations mentioned in the standard. If something is not mentioned there, then it is treated as non existent, and not as an allowed option.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools-scm
checkdeps  :
    - python-pytest
build      : |
    export SETUPTOOLS_SCM_PRETEND_VERSION=${version}
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
