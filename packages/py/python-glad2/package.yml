# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-glad2
version    : 2.0.8
release    : 9
source     :
    - https://github.com/Dav1dde/glad/archive/refs/tags/v2.0.8.tar.gz : 44f06f9195427c7017f5028d0894f57eb216b0a8f7c4eda7ce883732aeb2d0fc
homepage   : https://glad.dav1d.de/
license    : MIT
component  : programming.python
summary    : Multi-Language Vulkan/GL/GLES/EGL/GLX/WGL Loader-Generator based on the official specs
description: |
    Vulkan/GL/GLES/EGL/GLX/WGL Loader-Generator based on the official specifications for multiple languages.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
# checkdeps  :
#     - pkgconfig(glfw3)
#     - pkgconfig(x11)
#     - python-jinja
#     - python-pytest
#     - xorg-server-xvfb
rundeps    :
    - python-jinja
build      : |
    %pyproject_build
install    : |
    %pyproject_install
