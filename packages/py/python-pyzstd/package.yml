# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pyzstd
version    : 0.19.1
release    : 8
source     :
    - https://files.pythonhosted.org/packages/source/p/pyzstd/pyzstd-0.19.1.tar.gz : 36723d3c915b3981de9198d0a2c82b2f5fe3eaa36e4d8d586937830a8afc7d72
homepage   : https://github.com/Rogdham/pyzstd
license    : BSD-3-Clause
component  : programming.python
summary    : Python bindings to Zstandard (zstd) compression library, the API style is similar to Python's bz2/lzma/zlib modules.
description: |
    Pyzstd module provides classes and functions for compressing and decompressing data, using Facebook's Zstandard (or zstd as short name) algorithm.
builddeps  :
    - python-build
    - python-hatch-vcs
    - python-hatchling
    - python-installer
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build --skip-dependency-check
install    : |
    %pyproject_install
check      : |
    %pytest -v
