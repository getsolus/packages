# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-python-pskc
version    : 1.4
release    : 1
source     :
    - https://github.com/arthurdejong/python-pskc/archive/refs/tags/1.4.tar.gz : 22fa03253be795dd595347562cab52efba132fcf7730da2ec410cec42932c368
homepage   : https://github.com/arthurdejong/python-pskc
license    : LGPL-2.1-or-later
component  : programming.python
summary    : Python module for handling PSKC files
description: |
    Python module for handling PSKC files
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps:
    - python-dateutil
    - python-pytest
    - python-pytest-cov
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_license COPYING
check: |
    # Remove coverage tests, steal Fedora's list of ignored tests
    sed -i 's/--cov[^ ]*//g' setup.cfg
    %python3_test pytest \ 
        --ignore=tests/test_signature.doctest \
        --ignore=tests/test_draft_ietf_keyprov_pskc_02.doctest \
        --ignore=tests/test_draft_keyprov.doctest \
        --ignore=tests/test_feitian.doctest \
        --ignore=tests/test_misc.doctest \
        --ignore=tests/test_rfc6030.doctest \
        --ignore=tests/test_yubico.doctest
