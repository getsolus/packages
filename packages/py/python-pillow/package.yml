# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pillow
version    : 13.0.0
release    : 47
source     :
    - https://github.com/python-pillow/Pillow/archive/refs/tags/13.0.0.tar.gz : edf59ba26a21ea6d7e6a3755fe139a57297704591c4113ad470dac9ac2ccaf5e
homepage   : https://python-pillow.github.io/
license    : MIT-CMU
component  : programming.python
summary    : The friendly PIL fork (Python Imaging Library)
description: |
    Pillow is the "friendly PIL fork" by Alex Clark and Contributors. PIL is the Python Imaging Library by Fredrik Lundh and Contributors.
builddeps  :
    - pkgconfig(freetype2)
    - pkgconfig(lcms2)
    - pkgconfig(libopenjp2)
    - pkgconfig(libtiff-4)
    - pkgconfig(libturbojpeg)
    - pkgconfig(libwebp)
    - pkgconfig(pybind11)
    - pkgconfig(python3)
    - pkgconfig(tk)
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-pytest
rundeps    :
    - libjpeg-turbo
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    %install_dir ${installdir}/usr/include/python%python3_version%/
    %install_file src/libImaging/*.h ${installdir}/usr/include/python%python3_version%/
check      : |
    %pytest selftest.py
