# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-asyncssh
version    : 2.24.0
release    : 8
source     :
    - https://files.pythonhosted.org/packages/source/a/asyncssh/asyncssh-2.24.0.tar.gz : 4064c590e59ce2e8d82a2f66d35f3120d765828b4df5e3dbfb07b4a8c24686c9
homepage   : https://github.com/ronf/asyncssh
license    : EPL-2.0
component  : programming.python
summary    : Asynchronous SSHv2 client and server library
description: |
    AsyncSSH is a Python package which provides an asynchronous client and server implementation of the SSHv2 protocol on top of the Python 3.6+ asyncio framework.
builddeps  :
    - python-build
    - python-installer
    - python-packaging
    - python-setuptools
# checkdeps  :
#     - python-bcrypt
#     - python-cryptography
#     - python-fido2
#     - python-ifaddr
#     - python-openssl
#     - python-pytest
#     - python-pytest-cov
#     - python-typing-extensions
rundeps    :
    - python-cryptography
    - python-typing-extensions
build      : |
    %pyproject_build
install    : |
    %pyproject_install
