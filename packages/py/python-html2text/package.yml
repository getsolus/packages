# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-html2text
version    : 2025.4.15
release    : 11
source     :
    - https://github.com/Alir3z4/html2text/archive/2025.4.15.tar.gz : 6c76f207d25fd2fe2d9d7f18f2d3d3a35b19bcc931595221a9c3e4491d5c2802
homepage   : https://alir3z4.github.io/html2text
license    : GPL-3.0-only
component  : programming.python
summary    : Convert HTML to Markdown-formatted text
description: |
    html2text is a Python script that converts a page of HTML into clean, easy-to-read plain ASCII text. Better yet, that ASCII also happens to be valid Markdown (a text-to-HTML format).
builddeps  :
    - python-build
    - python-installer
    - python-setuptools-scm
checkdeps  :
    - python-pytest
build      : |
    export SETUPTOOLS_SCM_PRETEND_VERSION="${version}"
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
