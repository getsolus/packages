# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-llvmlite
version    : 0.49.0
release    : 23
source     :
    - https://github.com/numba/llvmlite/archive/refs/tags/v0.49.0.tar.gz : e73ad74110d60ec3eef076431b8853a5e8f940a83bd544cbff4c02d4c544ada0
license    : BSD-2-Clause
homepage   : https://llvmlite.readthedocs.io/
component  : programming.python
summary    : A lightweight LLVM python binding for writing JIT compilers
description: |
    llvmlite is a project originally tailored for Numba's needs, using the following approach:
        - small C wrapper around the parts of the LLVM C++ API we need that are not already exposed by the LLVM C API.
        - ctypes Python wrapper around the C API.
        - pure Python implementation of the subset of the LLVM IR builder that we need for Numba.
builddeps  :
    - llvm-devel
    - python-build
    - python-installer
environment: |
    export LLVMLITE_SKIP_LLVM_VERSION_CHECK=1
build      : |
    %pyproject_build
install    : |
    %pyproject_install
#check      : |
    #%pytest -m llvmlite.tests
