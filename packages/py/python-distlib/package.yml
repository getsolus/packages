# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-distlib
version    : 0.4.3
release    : 15
source     :
    - https://pypi.debian.net/distlib/distlib-0.4.3.tar.gz : f152097224a0ae24be5a0f6bae1b9359af82133bce63f98a95f86cae1aede9ed
homepage   : https://github.com/pypa/distlib
license    : PSF-2.0
component  : programming.python
summary    : Low-level components of distutils2/packaging
description: |
    Low-level parts of packaging/distutils2 which implement the relevant PEPs and which could be used by third-party packaging tools to achieve interoperability, enhanced with additional features for dependency resolution, package resource management and more.
networking : true # Check
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest
setup      : |
    rm distlib/*.exe
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    export PYTHONHASHSEED=0

    pytest_args=(
        # URL in test 404's
        --deselect tests/test_util.py::UtilTestCase::test_package_data
        # Build runs as root, so /etc is unexpectedly writable
        --deselect tests/test_util.py::FileOpsTestCase::test_is_writable
    )

    %pytest -v "${pytest_args[@]}"
