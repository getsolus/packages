# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-cachetools
version    : 7.1.6
release    : 15
source     :
    - https://files.pythonhosted.org/packages/source/c/cachetools/cachetools-7.1.6.tar.gz : c7a79e7f30ba9943c1cefd08cc36f006aaae086e017af9166f1d59d6170c47e1
homepage   : https://github.com/tkem/cachetools/
license    : MIT
component  : programming.python
summary    : Extensible memoizing collections and decorators
description: |
    This module provides various memoizing collections and decorators, including variants of the Python 3 Standard Library @lru_cache function decorator.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools-scm
    - python-wheel
checkdeps  :
    - python-pytest
rundeps    :
    - python3
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
