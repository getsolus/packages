# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-propcache
version    : 0.5.4
release    : 10
source     :
    - https://files.pythonhosted.org/packages/source/p/propcache/propcache-0.5.4.tar.gz : ff6b113f50bc066a698db5d944d2c6dc7507168dd3341e255a8892fd0715a558
homepage   : https://propcache.readthedocs.io/
license    : Apache-2.0
component  : programming.python
summary    : Fast property caching
description: |
    The module provides a fast implementation of cached properties for Python 3.9+
builddeps  :
    - cython
    - python-build
    - python-expandvars
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %python3_test pytest -v \
        --ignore=tests/test_benchmarks.py \
        -o addopts="-v -ra --showlocals --doctest-modules --strict-markers"
