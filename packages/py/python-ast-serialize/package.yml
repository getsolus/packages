# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-ast-serialize
version    : 0.8.0
release    : 1
source     :
    - https://github.com/mypyc/ast_serialize/archive/refs/tags/v0.8.0.tar.gz : 86ce29e2327d0c6a3abe71bc4e093ee31b7ad2b35c37197597bf918d6f502716
homepage   : https://github.com/mypyc/ast_serialize
license    : MIT
component  : programming.python
summary    : Python bindings for mypy AST serialization
description: |
    Fast Python extension for parsing Python files and serializing the AST using the native binary format used by mypy.
networking : true
builddeps  :
    - cargo-c
    - python-build
    - python-installer
    - python-maturin
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
