# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pyquery
version    : 2.1.0
release    : 1
source     :
    - https://github.com/gawel/pyquery/archive/refs/tags/2.1.0.tar.gz : be10c927e6ebe154dcdf6bc5dc7cec75b6981487664406e58a3eb01335219e9d
homepage   : https://pyquery.rtfd.org/
license    : BSD-3-Clause
component  : programming.python
summary    : A jquery-like library for python
description: |
  pyquery allows you to make jquery queries on xml documents. The API is as much as possible similar to jquery. pyquery uses lxml for fast xml and html manipulation.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-cssselect
    - python-lxml
    - python-pytest
    - python-requests
    - python-webob
    - python-webtest
rundeps    :
    - python-cssselect
    - python-lxml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # Deselected tests fail, possibly because of encoding problem
    %pytest -v \
        --deselect 'tests/test_pyquery.py::TestHTMLParser::test_replaceWith' \
        --deselect 'tests/test_pyquery.py::TestHTMLParser::test_replaceWith_with_function'
