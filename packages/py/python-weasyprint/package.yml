# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-weasyprint
version    : 69.0
release    : 1
source     :
    - https://github.com/Kozea/WeasyPrint/archive/refs/tags/v69.0.tar.gz : fcaf06772eb2936394731f224e42c5d5a1c1790e2e24617aa355846b35f22a13
homepage   : https://weasyprint.org/
license    : BSD-3-Clause
component  : programming.python
summary    : The Awesome Document Factory (HTML to PDF converter)
description: |
    WeasyPrint is a smart solution helping web developers to create PDF documents. It turns simple HTML pages into gorgeous statistical reports, invoices, tickets, and more using a Python-native CSS layout engine.
builddeps  :
    - pango-devel
    - python-build
    - python-flit-core
    - python-installer
rundeps    :
    - pango
    - python-cffi
    - python-cssselect2
    - python-fonttools
    - python-pillow
    - python-pydyf
    - python-pyphen
    - python-tinycss2
    - python-tinyhtml5
checkdeps  :
    - dejavu-fonts-ttf
    - liberation-fonts-ttf
    - ghostscript
    - pango
    - python-cffi
    - python-cssselect2
    - python-fonttools
    - python-pillow
    - python-pydyf
    - python-pyphen
    - python-pytest
    - python-ruff
    - python-tinycss2
    - python-tinyhtml5
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check : |
    %pytest -v -k "not test_emoji_text_svg"
