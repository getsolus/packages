# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-jupyter-builder
version    : 1.2.2
release    : 1
source     :
    - https://files.pythonhosted.org/packages/source/j/jupyter_builder/jupyter_builder-1.2.2.tar.gz : b6cea88f58e44b2c5eba96f28d2e0d16fd453d3ca6dc9c4492ff8a1f2e97f601
homepage   : https://github.com/jupyterlab/jupyter-builder
license    : BSD-3-Clause
component  : programming.python
summary    : Build tools for JupyterLab extensions
description: |
    Build tools for JupyterLab extensions — extracted from the core JupyterLab codebase to be maintained and used independently.
builddeps  :
    - python-build
    - python-hatch-nodejs-version
    - python-hatchling
    - python-installer
rundeps    :
    - python-jupyter_core
    - python-traitlets
build      : |
    %pyproject_build
install    : |
    %python3_install
