# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-proton-vpn-core-api
version    : 5.2.5
release    : 22
source     :
    - https://github.com/ProtonVPN/python-proton-vpn-api-core/archive/refs/tags/v5.2.5.tar.gz : 5724b974c299736954105ae19fc497e724c71345e9e27708e389209bae02c322
homepage   : https://github.com/ProtonVPN/python-proton-vpn-api-core
license    : GPL-3.0-or-later
component  : programming.python
summary    : The proton-vpn-core-api component
description: |
    The proton-vpn-core-api acts as a facade to the other Proton VPN components, exposing a uniform API to the available Proton VPN services.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
build      : |
    %python3_setup
install    : |
    %python3_install
replaces   :
    - python-proton-vpn-logger
    - python-proton-vpn-network-manager
