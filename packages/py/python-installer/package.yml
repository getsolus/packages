# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-installer
version    : 1.0.1
release    : 15
source     :
    - https://github.com/pypa/installer/archive/refs/tags/1.0.1.tar.gz : 391b8068eb6b5629496a71e33b948b10c31bea77a12d302034323406ee03ffd1
homepage   : https://github.com/pypa/installer
license    : MIT
component  : programming.python
summary    : A low-level library for installing from a Python wheel distribution
description: |
    This is a low-level library for installing a Python package from a wheel distribution. It provides basic functionality and abstractions for handling wheels and installing packages from wheels.
networking : false # flip this for python3 rebuilds
builddeps  :
    - python-build
    - python-flit-core
    - python-installer
checkdeps  :
    - python-pytest
environment: |
    # flip this for python3 rebuilds
    export BOOTSTRAP=0
build      : |
    if [[ ${BOOTSTRAP} == "1" ]]; then
        python3 -m pip wheel --no-deps .
    else
        %pyproject_build
    fi
install    : |
    if [[ ${BOOTSTRAP} == "1" ]]; then
        python3 -m pip install --root=%installroot% --no-deps --ignore-installed .
    else
        %pyproject_install
    fi
check      : |
    %pytest -v
