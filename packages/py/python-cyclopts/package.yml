# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-cyclopts
version    : 4.23.3
release    : 4
source     :
    - https://github.com/BrianPugh/cyclopts/archive/refs/tags/v4.23.3.tar.gz : be9bf1a5cfcc17245198b1ff6e0c5da1fe4635829f58924ed48ad983b907f971
homepage   : https://pypi.org/project/cyclopts/
license    : Apache-2.0
component  : programming.python
summary    : A modern, easy-to-use command-line interface (CLI) framework.
description: |
    Cyclopts is a modern, easy-to-use command-line interface (CLI) framework that aims to provide an intuitive & efficient developer experience.
builddeps  :
    - python-build
    - python-hatch-vcs
    - python-hatchling
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-attrs
    - python-docstring_parser
    - python-docutils
    - python-pydantic
    - python-pytest
    - python-pytest-mock
    - python-rich
    - python-sniffio
    - python-syrupy
    - python-trio
rundeps    :
    - python-attrs
    - python-docstring_parser
    - python-rich
build      : |
    export SETUPTOOLS_SCM_PRETEND_VERSION=${version}
    %pyproject_build
install    : |
    %pyproject_install
    %install_license LICENSE
