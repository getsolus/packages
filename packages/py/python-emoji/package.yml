# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-emoji
version    : 2.15.0
release    : 5
source     :
    - https://files.pythonhosted.org/packages/source/e/emoji/emoji-2.15.0.tar.gz : eae4ab7d86456a70a00a985125a03263a5eac54cd55e51d7e184b1ed3b6757e4
homepage   : https://pypi.org/project/emoji/
license    : BSD-3-Clause
component  : programming.python
summary    : Emoji for Python.
description: |
    The entire set of Emoji codes as defined by the Unicode consortium is supported in addition to a bunch of aliases. By default, only the official list is enabled but doing emoji.emojize(language='alias') enables both the full list and aliases.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
