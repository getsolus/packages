# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-h2
version    : 4.4.1
release    : 3
source     :
    - https://files.pythonhosted.org/packages/source/h/h2/h2-4.4.1.tar.gz : 4e866ffb1a869ae14dd9b5e6beb5c24a13da0495ad72b65925ded182521c1516
homepage   : https://python-hyper.org/
license    : MIT
component  : programming.python
summary    : Pure-Python HTTP/2 protocol implementation
description: |
    A pure-Python implementation of a HTTP/2 protocol stack. It's written from the ground up to be embeddable in whatever program you choose to use, ensuring that you can speak HTTP/2 regardless of your programming paradigm.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-hpack
    - python-hyperframe
    - python-hypothesis
    - python-pytest
    - python-pytest-cov
    - python-pytest-xdist
rundeps    :
    - python-hpack
    - python-hyperframe
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
