# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-isort
version    : 8.0.1
release    : 20
source     :
    - https://pypi.io/packages/source/i/isort/isort-8.0.1.tar.gz : 171ac4ff559cdc060bcfff550bc8404a486fee0caab245679c2abe7cb253c78d
homepage   : https://pycqa.github.io/isort/
license    : MIT
component  : programming.python
summary    : A Python utility / library to sort imports
description: |
    isort is a Python utility / library to sort imports alphabetically, and automatically separated into sections and by type. It provides a command line utility, Python library and plugins for various editors to quickly sort all your imports.
builddeps  :
    - python-build
    - python-hatch-vcs
    - python-installer
checkdeps  :
    - python-colorama
    - python-hypothesis
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    _pytest_args=(
        # We don't care about benchmark tests
        --deselect tests/benchmark/test_api.py $(: no benchmarks please )
        # We don't care about formatting
        --ignore=tests/unit/profiles/test_black.py
        # python-hypothesmith is not packaged
        --ignore=tests/integration/test_hypothesmith.py
        # Clones git repositories
        --deselect tests/integration/test_projects_using_isort.py $(: requires network )
        # Other failures
        --deselect tests/unit/test_main.py::test_gitignore $(: example integrations )
        --deselect tests/integration/test_setting_combinations.py $(: unknown )
        --deselect tests/unit/test_isort.py::test_settings_path_skip_issue_909 $(: example integrations )
        --deselect tests/unit/test_isort.py::test_skip_paths_issue_938 $(: example integrations )
        --deselect tests/unit/test_ticketed_features.py::test_isort_supports_shared_profiles_issue_970 $(: example integrations )
        --deselect tests/unit/test_ticketed_features.py::test_sort_configurable_sort_issue_1732 $(: unknown )
    )

    %pytest -v "${_pytest_args[@]}"
