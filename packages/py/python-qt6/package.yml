# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-qt6
version    : 6.12.1
release    : 38
source     :
    - https://pypi.debian.net/PyQt6/pyqt6-6.12.1.tar.gz : 17bb18b3ae953ab54b23026291ecea2579b028597b56c281a752c8ed66dd1a58
homepage   : https://www.riverbankcomputing.com/software/pyqt/
license    : GPL-3.0-or-later
component  : programming.python
summary    : A set of Python bindings for Qt6
description: |
    Python bindings for the Qt6 cross platform application toolkit.
builddeps  :
    - pkgconfig(Qt6Bluetooth)
    - pkgconfig(Qt6Multimedia)
    - pkgconfig(Qt6Positioning)
    - pkgconfig(Qt6Quick)
    - pkgconfig(Qt6Quick3D)
    - pkgconfig(Qt6QuickControls2)
    - pkgconfig(Qt6RemoteObjects)
    - pkgconfig(Qt6Scxml)
    - pkgconfig(Qt6Sensors)
    - pkgconfig(Qt6SerialPort)
    - pkgconfig(Qt6ShaderTools)
    - pkgconfig(Qt6Svg)
    - pkgconfig(Qt6TextToSpeech)
    - pkgconfig(Qt6UiTools)
    - pkgconfig(Qt6WebChannel)
    - pkgconfig(Qt6WebSockets)
    - pkgconfig(dbus-python)
    - pkgconfig(python3)
    - pyqt-builder
    - python-opengl
    - python-ply
    - python-pyqt6-sip
    - python-setuptools
    - python-sip
    - qt6-base-private-devel
rundeps    :
    - python-pyqt6-sip
    - python3-dbus
clang      : true
setup      : |
    sip-build \
        --confirm-license \
        --no-make \
        --pep484-pyi \
        --qmake=/usr/bin/qmake6 \
        --qt-shared \
        --verbose
build      : |
    %make -C build
install    : |
    %make_install -C build INSTALL_ROOT="$installdir"
    %python3_compile
