# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-simplejson
version    : 4.1.1
release    : 23
source     :
    - https://github.com/simplejson/simplejson/archive/refs/tags/v4.1.1.tar.gz : e7939be17e8ed28b937aaf3ff9eb7fd6539d9db0dd165e040ce4af0f2bafd3e8
homepage   : https://github.com/simplejson/simplejson
license    : MIT
component  : programming.python
summary    : simplejson is a simple, fast, extensible JSON encoder/decoder for Python
description: |
    simplejson is a simple, fast, complete, correct and extensible JSON encoder and decoder for Python. It is pure Python code with no dependencies, but includes an optional C extension for a serious speed boost.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
