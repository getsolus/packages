# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-typing-inspection
version    : 0.4.2
release    : 1
source     :
    - https://github.com/pydantic/typing-inspection/archive/refs/tags/v0.4.2.tar.gz : a5c835171179a7744fbd10f102e68dac9b7eae6b73da52c82a3deedfcef6ed2b
homepage   : https://typing-inspection.pydantic.dev/
license    : MIT
component  : programming.python
summary    : Runtime typing introspection tools
