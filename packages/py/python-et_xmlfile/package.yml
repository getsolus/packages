# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-et_xmlfile
version    : 2.0.0
release    : 9
source     :
    - https://foss.heptapod.net/openpyxl/et_xmlfile/-/archive/2.0.0/et_xmlfile-2.0.0.tar.bz2 : 720f0e40e322781b690d53bef27e469536c938b2087e821d93a30826e8f8b991
homepage   : https://pypi.org/project/et-xmlfile/
license    : MIT
component  : programming.python
summary    : et_xmlfile is a low memory library for creating large XML files.
description: |
    et_xmlfile is a low memory library for creating large XML files. It is based upon the xmlfile module from lxml with the aim of allowing code to be developed that will work with both libraries. It was developed initially for the openpyxl project but is now a standalone module.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-lxml
    - python-setuptools
checkdeps  :
    - python-pytest
setup      : |
    %patch -p1 -i ${pkgfiles}/et_xmlfile-2.0.0-fix-tests.patch
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
