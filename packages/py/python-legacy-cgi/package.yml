# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-legacy-cgi
version    : 2.6.4
release    : 1
source     :
    - https://github.com/jackrosenthal/legacy-cgi/archive/refs/tags/v2.6.4.tar.gz : 5dc1a194ccb18906ceefe1291bc32db327b97f09238f2b97e07e26050f04a8e3
