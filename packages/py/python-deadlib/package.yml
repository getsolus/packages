# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-deadlib
version    : 3.13.0
release    : 1
source     :
    - https://github.com/youknowone/python-deadlib/archive/refs/tags/v3.13.0.tar.gz : bde43692d5a1de2a33777ff99f4c4344f7cca3a49362b2484a13870706194613
homepage   : https://github.com/youknowone/python-deadlib
license    : PSF-2.0
component  :
    - ^python-standard-aifc : programming.python
    - ^python-standard-chunk : programming.python
    - ^python-standard-sunau : programming.python
    - programming.python
summary    :
    - ^python-standard-aifc : Standard library aifc redistribution. "dead battery".
    - ^python-standard-chunk : Standard library chunk redistribution. "dead battery".
    - ^python-standard-sunau : Standard library sunau redistribution. "dead battery".
    - Python dead batteries. See PEP594 and PEP632 for more information
description: |
    Python dead batteries. See PEP594 and PEP632 for more information.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
rundeps  :
    - ^python-standard-aifc :
        - python-audioop-lts
        - python-standard-chunk
    - ^python-standard-sunau :
        - python-audioop-lts
environment: |
    _modules=(
        aifc
        chunk
        sunau
    )
build      : |
    for module in "${_modules[@]}"; do
        pushd "${module}"
        %pyproject_build
        popd
    done
install    : |
    for module in "${_modules[@]}"; do
        pushd "${module}"
        %pyproject_install
        popd
    done
patterns   :
    - ^python-standard-aifc :
        - /usr/lib/python3.*/site-packages/*aifc*
    - ^python-standard-chunk :
        - /usr/lib/python3.*/site-packages/*chunk*
    - ^python-standard-sunau :
        - /usr/lib/python3.*/site-packages/*sunau*
