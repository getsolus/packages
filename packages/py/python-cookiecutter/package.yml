# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-cookiecutter
version    : 2.7.1
release    : 14
source     :
    - https://github.com/cookiecutter/cookiecutter/archive/refs/tags/v2.7.1.tar.gz : ad22b0a6355e208a614ae0285268a6b612938935f1d29ec9edab85c6053c7224
homepage   : https://github.com/cookiecutter/cookiecutter
license    : BSD-3-Clause
component  : programming.python
summary    : A command-line utility that creates projects from project templates
description: |
    A command-line utility that creates projects from cookiecutters (project templates), e.g. Python package projects, VueJS projects.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - git
    - python-arrow
    - python-binaryornot
    - python-click
    - python-freezegun
    - python-jinja
    - python-pytest-cov
    - python-pytest-mock
    - python-requests
    - python-rich
    - python-slugify
rundeps    :
    - python-arrow
    - python-binaryornot
    - python-click
    - python-jinja
    - python-requests
    - python-rich
    - python-slugify
    - pyyaml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
