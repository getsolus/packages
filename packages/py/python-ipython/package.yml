# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-ipython
version    : 9.16.1
release    : 7
source     :
    - https://files.pythonhosted.org/packages/source/i/ipython/ipython-9.16.1.tar.gz : 5a3d1f9a47ff216d6cf9cf863124f6a2c1a198d1354c546a4d24a370a283b64c
homepage   : https://ipython.org/
license    : BSD-3-Clause
component  : programming.python
summary    : IPython provides a rich toolkit to help you make the most of using Python interactively
description: |
    IPython provides a rich toolkit to help you make the most of using Python interactively.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - matplotlib
    - pygments
    - python-decorator
    - python-ipython-pygments-lexers
    - python-jedi
    - python-matplotlib-inline
    - python-nbformat
    - python-pandas
    - python-pexpect
    - python-prompt-toolkit
    - python-psutil
    - python-pytest
    - python-pytest-asyncio
    - python-pytest-trio
    - python-stack-data
    - python-testpath
    - python-traitlets
rundeps    :
    - pygments
    - python-decorator
    - python-ipython-pygments-lexers
    - python-jedi
    - python-matplotlib-inline
    - python-pexpect
    - python-prompt-toolkit
    - python-psutil
    - python-stack-data
    - python-traitlets
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # ipdoctest scans IPython sources from the build tree while the staged
    # install is also on PYTHONPATH, causing ImportPathMismatchError in solbuild.
    %pytest -v tests/ -o addopts="" --deselect tests/test_shellapp.py
replaces   :
    - python3-ipython
