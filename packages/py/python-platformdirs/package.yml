# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-platformdirs
version    : 4.11.2
release    : 20
source     :
    - https://files.pythonhosted.org/packages/source/p/platformdirs/platformdirs-4.11.2.tar.gz : 3a2ae5fca3520a01ab1be8b45613537f52ddf5b5f6f53d88233892dfbf0cd82d
homepage   : https://github.com/platformdirs/platformdirs
license    : MIT
component  : programming.python
summary    : A small Python module for determining appropriate platform-specific dirs
description: |
    platformdirs is a library to determine platform-specific system directories. This includes directories where to place cache files, user data, configuration, etc.
builddeps  :
    - python-build
    - python-hatch-vcs
    - python-installer
    - python-wheel
checkdeps  :
    - python-pytest-mock
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # appdirs was deprecated in 4.10.0
    %pytest -v --ignore=tests/test_comp_with_appdirs.py
