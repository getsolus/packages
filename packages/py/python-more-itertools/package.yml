# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-more-itertools
version    : 11.1.0
release    : 13
source     :
    - https://files.pythonhosted.org/packages/source/m/more-itertools/more_itertools-11.1.0.tar.gz : 48e8f4d9e7e5878571ecf6f2b4e57634f93cd474cc8cfbd2376f2d11b396e30d
homepage   : https://more-itertools.rtfd.io/
license    : MIT
component  : programming.python
summary    : More routines for operating on iterables, beyond itertools
description: |
    Python's `itertools` library is a gem - you can compose elegant solutions for a variety of problems with the functions it provides. In `more-itertools` we collect additional building blocks, recipes, and routines for working with Python iterables.
builddeps  :
    - python-build
    - python-flit-core
    - python-installer
    - python-wheel
checkdeps  :
    - python-pytest
setup      : |
    rm -f setup.py
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
