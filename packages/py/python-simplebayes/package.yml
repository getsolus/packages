# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-simplebayes
version    : 3.2.0
release    : 10
source     :
    - https://files.pythonhosted.org/packages/source/s/simplebayes/simplebayes-3.2.0.tar.gz : 2d3e801409e88a1db76a070e1a28f9dbd1068102cb2d2e6967854abc082aa896
homepage   : https://github.com/hickeroar/simplebayes
license    : MIT
component  : programming.python
summary    : A memory-based, optional-persistence naïve bayesian text classifier
description: |
    A memory-based, optional-persistence naïve bayesian text classifier
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
setup      : |
    sed -e "s:long_description = open('README.rst', 'r').read(),::g" -i setup.py
build      : |
    %pyproject_build
install    : |
    %pyproject_install
