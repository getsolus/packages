# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pyphen
version    : 0.17.2
release    : 1
source     :
    - https://github.com/Kozea/Pyphen/archive/refs/tags/0.17.2.tar.gz : b7e67fbbcc52e6ae058479fa8ce393db4d2457f6f38007933cd6761ab9205501
homepage   : https://github.com/Kozea/Pyphen
license    : 
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
    - MPL-1.1
component  : programming.python
summary    : Pure Python module to hyphenate text
description: |
    Pyphen is a pure Python module to hyphenate text using existing Hunspell hyphenation dictionaries.
builddeps  :
    - python-build
    - python-flit-core
    - python-installer
checkdeps  :
    - python-pytest
    - python-ruff
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check : |
    %pytest -v
