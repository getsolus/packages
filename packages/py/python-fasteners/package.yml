# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-fasteners
version    : '0.20'
release    : 20
source     :
    - https://pypi.io/packages/source/f/fasteners/fasteners-0.20.tar.gz : 55dce8792a41b56f727ba6e123fcaee77fd87e638a6863cec00007bfea84c8d8
homepage   : https://github.com/harlowja/fasteners
license    : Apache-2.0
component  : programming.python
summary    : A python package that provides useful locks
description: |
    A python package that provides useful locks.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-diskcache
    - python-eventlet
    - python-more-itertools
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install

    # remove win32 files
    rm -rf $installdir/usr/lib/python%python3_version%/site-packages/fasteners/pywin32
check      : |
    %pytest -v
