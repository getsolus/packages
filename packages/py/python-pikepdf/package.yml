# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pikepdf
version    : 10.10.0
release    : 40
source     :
    - https://github.com/pikepdf/pikepdf/archive/refs/tags/v10.10.0.tar.gz : 57c83d6f5fce11ed852a20d1ca33c3a651dd45ab0e893d65b18a3a1620f6c010
homepage   : https://github.com/pikepdf/pikepdf
license    : MPL-2.0
component  : programming.python
summary    : A Python library for reading and writing PDF, powered by qpdf
description: |
    Pikepdf is a Python library for reading and writing PDF files. It is based on QPDF, a powerful PDF manipulation and repair library.
builddeps  :
    - pkgconfig(libqpdf)
    - pkgconfig(python3)
    - nanobind
    - python-build
    - python-installer
    - python-scikit-build-core
rundeps    :
    - python-lxml
    - python-packaging
    - python-pillow
checkdeps  :
    - nanobind
    - python-attrs
    - python-dateutil
    - python-hypothesis
    - python-lxml
    - python-packaging
    - python-pillow
    - python-pytest
    - python-pytest-cov
    - python-pytest-timeout
    - python-pytest-xdist
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
