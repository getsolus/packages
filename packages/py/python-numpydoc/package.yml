# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-numpydoc
version    : 1.10.0
release    : 21
source     :
    - https://github.com/numpy/numpydoc/archive/refs/tags/v1.10.0.tar.gz : 7005b3902c764dbb5d5a79889727d7aef39896c48f6b1ec252c2741d83140221
homepage   : https://github.com/numpy/numpydoc
license    :
    - BSD-2-Clause
    - BSD-3-Clause
    - Python-2.0
component  : programming.python
summary    : Numpy's Sphinx extensions
description: |
    Numpy's documentation uses several custom extensions to Sphinx. These are shipped in this numpydoc package, in case you want to make use of them in third-party projects.
networking : true # Check
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest-cov
    - python-sphinx
    - python-tabulate
rundeps    :
    - python-sphinx
    - python-tabulate
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest
