# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-editables
version    : '0.6'
release    : 7
source     :
    - https://github.com/pfmoore/editables/archive/refs/tags/0.6.tar.gz : 766d9b40616dbcf5cc920e9db26dd915de999cfab75768ff05b3ebf9c389acb2
homepage   : https://github.com/pfmoore/editables
license    : MIT
component  : programming.python
summary    : A Python library for creating "editable wheels"
description: |
    This library supports the building of wheels which, when installed, will expose packages in a local directory on sys.path in "editable mode". In other words, changes to the package source will be reflected in the package visible to Python, without needing a reinstall.
builddeps  :
    - python-build
    - python-flit-core
    - python-installer
    - python-wheel
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
