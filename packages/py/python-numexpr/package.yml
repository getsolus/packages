# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-numexpr
version    : 2.14.2
release    : 20
source     :
    - https://github.com/pydata/numexpr/archive/refs/tags/v2.14.2.tar.gz : d85f1c1b41dd26585f452ed446b11a3d6d52ffe735ca0fd56b5d5e02df910ae1
homepage   : https://github.com/pydata/numexpr
license    : MIT
component  : programming.python
summary    : Fast numerical array expression evaluator for Python, NumPy, PyTables, pandas, bcolz and more
description: |
    NumExpr is a fast numerical expression evaluator for NumPy. With it, expressions that operate on arrays (like '3*a+4*b') are accelerated and use less memory than doing the same calculation in Python.
builddeps  :
    - pkgconfig(python3)
    - numpy
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest
    - python-pytest-run-parallel
rundeps    :
    - numpy
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    mv numexpr _numexpr_hidden
    %pytest --pyargs numexpr
