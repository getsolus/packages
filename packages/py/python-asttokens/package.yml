# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-asttokens
version    : 3.0.2
release    : 21
source     :
    - https://files.pythonhosted.org/packages/source/a/asttokens/asttokens-3.0.2.tar.gz : 3ecdbd8f2cc195f53ccada3a613538bb5f9ef6f6869129f13e03c30a677b8fe2
homepage   : https://github.com/gristlabs/asttokens
license    : Apache-2.0
component  : programming.python
summary    : Annotate Python AST trees with source text and token information
description: |
    The asttokens module annotates Python abstract syntax trees (ASTs) with the positions of tokens and text in the source code that generated them.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-setuptools-scm
    - python-wheel
checkdeps  :
    - python-astroid
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
