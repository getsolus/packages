# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pytest-rerunfailures
version    : '16.6'
release    : 7
source     :
    - https://files.pythonhosted.org/packages/source/p/pytest-rerunfailures/pytest_rerunfailures-16.6.tar.gz : 29dbfee46f542073c888e0ed4e81c51e15b9096f49a299eb1a759629c601684a
homepage   : https://github.com/pytest-dev/pytest-rerunfailures/
license    : MPL-2.0
component  : programming.python
summary    : A plugin for py.test that re-runs failed tests
description: |
    A plugin for py.test that re-runs failed tests to eliminate intermittent failures
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-packaging
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest
rundeps    :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
