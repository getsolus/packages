# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-objgraph
version    : 3.6.2
release    : 1
source     :
    - https://github.com/mgedmin/objgraph/archive/refs/tags/3.6.2.tar.gz : 176a07ac93cce439f02c261307fbfb7b8941123fc5b40110d899c2279b08d310
homepage   : https://mg.pov.lt/objgraph/
license    : MIT
component  : programming.python
summary    : Visually explore Python object graphs
description: |
    Visually explore Python object graphs
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    export PYTHONPATH="%python3_sitepackages%:${PYTHONPATH}"
    python -m unittest discover -v ${workdir}
