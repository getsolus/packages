# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-gp-libs
version    : 0.0.19
release    : 3
source     :
    - https://github.com/git-pull/gp-libs/archive/refs/tags/v0.0.19.tar.gz : b4c8db6ce5db32d557017335967bf31f604aed844c2b834c38626c2b8749aced
homepage   : https://github.com/git-pull/gp-libs
license    : MIT
component  : programming.python
summary    : Incubator for pytest and sphinx helpers for git-pull python projects
description: |
    Incubator for pytest and sphinx helpers for git-pull python projects.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
    - python-wheel
rundeps    :
    - python-docutils
    - python-myst-parser
checkdeps  :
    - python-docutils
    - python-myst-parser
    - python-pytest
    - python-pytest-mock
    - python-pytest-rerunfailures
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v tests
