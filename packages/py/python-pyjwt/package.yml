# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pyjwt
version    : 2.15.1
release    : 21
source     :
    - https://files.pythonhosted.org/packages/source/P/PyJWT/pyjwt-2.15.1.tar.gz : 4f259e80cdfb6b3fc18a7de51fd1ef9ec79652f25019bae68975ca2468a34df8
homepage   : https://github.com/jpadilla/pyjwt
license    : MIT
component  : programming.python
summary    : JSON Web Token implementation in Python
description: |
    PyJWT is a Python library which allows you to encode and decode JSON Web Tokens (JWT). JWT is an open, industry-standard (RFC 7519) for representing claims securely between two parties.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-cryptography
    - python-pytest
    - python-pytest-cov
rundeps    :
    - python-cryptography
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
