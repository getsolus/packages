# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-sphinx-rtd-theme
version    : 3.1.0
release    : 15
source     :
    - https://files.pythonhosted.org/packages/source/s/sphinx_rtd_theme/sphinx_rtd_theme-3.1.0.tar.gz : b44276f2c276e909239a4f6c955aa667aaafeb78597923b1c60babc76db78e4c
homepage   : https://github.com/readthedocs/sphinx_rtd_theme
license    : MIT
component  : programming.python
summary    : Read the Docs theme for Sphinx
description: |
    This Sphinx theme was designed to provide a great reader experience for documentation users on both desktop and mobile devices. This theme is commonly used with projects on Read the Docs but can work with any Sphinx project.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - python-docutils
    - python-sphinxcontrib-jquery
build      : |
    %python3_setup
install    : |
    %python3_install
