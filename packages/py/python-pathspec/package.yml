# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pathspec
version    : 1.1.1
release    : 14
source     :
    - https://github.com/cpburnz/python-pathspec/archive/refs/tags/v1.1.1.tar.gz : 7befd398baeb84cd3872bcb84926e688361012d21c8c157dcc2f9f64684b9147
homepage   : https://github.com/cpburnz/python-path-specification
license    : MPL-2.0
component  : programming.python
summary    : Utility library for gitignore style pattern matching of file paths
description: |
    pathspec is a utility library for pattern matching of file paths. So far this only includes Git's wildmatch pattern matching which itself is derived from Rsync's wildmatch. Git uses wildmatch for its gitignore files.
builddeps  :
    - python-build
    - python-flit-core
    - python-installer
    - python-packaging
    - python-wheel
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest
