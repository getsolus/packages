# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-feedgenerator
version    : 2.2.1
release    : 10
source     :
    - https://pypi.io/packages/source/f/feedgenerator/feedgenerator-2.2.1.tar.gz : 0eaa955f1f0bcb5b87ac195af740f06ff9fff4a40ed30b8a7c6bbebb264d4dd1
homepage   : https://github.com/getpelican/feedgenerator
license    : BSD-3-Clause
component  : programming.python
summary    : Standalone version of django.utils.feedgenerator
description: |
    FeedGenerator is a standalone version of Django’s feedgenerator module. It has evolved over time and includes numerous enhancements.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
    - python-wheel
checkdeps  :
    - python-pytest
    - python-pytest-cov
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
