# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-coverage
version    : 7.15.3
release    : 19
source     :
    - https://github.com/nedbat/coveragepy/archive/refs/tags/7.15.3.tar.gz : e4ccac1d297ad01b9f278b08bb30137a566d0d95a39098efe2039ee24d58c5a7
homepage   : https://github.com/nedbat/coveragepy
license    : Apache-2.0
component  : programming.python
summary    : Code coverage measurement and testing for Python
description: |
    Coverage.py is a Python module that measures code coverage during Python execution. It uses the code analysis tools and tracing hooks provided in the Python standard library to determine which lines are executable, and which have been executed.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-packaging
    - python-setuptools
    - python-wheel
# checkdeps  :
#     - python-flaky
#     - python-gevent
#     - python-greenlet
#     - python-hypothesis
#     - python-pytest
#     - python-pytest-xdist
#     - virtualenv
build      : |
    %pyproject_build
install    : |
    %pyproject_install
