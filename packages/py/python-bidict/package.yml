# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-bidict
version    : 0.24.1
release    : 9
source     :
    - https://pypi.io/packages/source/b/bidict/bidict-0.24.1.tar.gz : 4dca6c17f0b01700e9f24359daa5ebabf7be022d99f4cb2a257b6af2a5076c88
homepage   : https://github.com/jab/bidict
license    : MPL-2.0
component  : programming.python
summary    : The bidirectional mapping library for Python
description: |
    Bidirectional mapping library that works out-of-the-box with Python's standard library and native integration with collections.abc.
builddeps  :
    - python-build
    - python-installer
    - python-packaging
    - python-uv-build
#checkdeps  :
#    - python-hypothesis
#    - python-pytest
#    - python-pytest-benchmark
#    - python-pytest-examples
#    - python-pytest-xdist
#    - python-pytokens
#    - python-ruff
setup      : |
    # Raise uv_build upper bound
    sed -i 's|uv_build>=0.8.13,<0.12|uv_build>=0.8.13,<0.13|' pyproject.toml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
# Possibly missing test deps, not entirely sure
#check      : |
#    %pytest -v
