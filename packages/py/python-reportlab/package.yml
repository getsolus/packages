# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-reportlab
version    : 5.0.1
release    : 20
source     :
    - https://pypi.python.org/packages/source/r/reportlab/reportlab-5.0.1.tar.gz : ebd13154be1c8515e665de70bd2d303ae9ddc3ef47e44afd5116441ca0283a26
homepage   : https://www.reportlab.com/
license    : BSD-3-Clause
component  : programming.python
summary    : The ReportLab Toolkit
description: |
    This is the ReportLab PDF Toolkit. It allows rapid creation of rich PDF documents, and also creation of charts in a variety of bitmap and vector formats.
builddeps  :
    - pkgconfig(freetype2)
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
rundeps    :
    - python-chardet
    - python-pillow
build      : |
    %pyproject_build
install    : |
    %pyproject_install

