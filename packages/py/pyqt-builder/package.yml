# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pyqt-builder
version    : 1.20.3
release    : 22
source     :
    - https://pypi.debian.net/PyQt-builder/pyqt_builder-1.20.3.tar.gz : be65ff822a75d020fafc0edcaf9fd79b7e3f145a00995a177c98c3286a5f85d5
homepage   : https://www.riverbankcomputing.com/software/pyqt-builder/
license    : GPL-3.0-or-later
component  : programming.python
summary    : The PEP 517 compliant PyQt build system
description: |
    PyQt-builder is the PEP 517 compliant build system for PyQt and projects that extend PyQt. It extends the SIP build system and uses Qt's qmake, in conjunction with make, to perform the actual compilation and installation of extension modules.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools-scm
build      : |
    %pyproject_build
install    : |
    %pyproject_install
