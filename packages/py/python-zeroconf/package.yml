# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-zeroconf
version    : 0.150.0
release    : 23
source     :
    - https://github.com/python-zeroconf/python-zeroconf/archive/refs/tags/0.150.0.tar.gz : 478ebcec8f4d4012fb8695b75663e5eea2aedff9a6c5b57ff12235ea035aebdf
homepage   : https://github.com/python-zeroconf/python-zeroconf
license    : LGPL-2.1-or-later
component  : programming.python
summary    : A pure python implementation of multicast DNS service discovery
description: |
    A pure python implementation of multicast DNS service discovery.
builddeps  :
    - cython
    - python-build
    - python-installer
    - python-poetry
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-async_timeout
    - python-ifaddr
    - python-pytest-asyncio
    - python-pytest-cov
rundeps    :
    - python-async_timeout
    - python-ifaddr
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    export SKIP_IPV6=1
    pytest_args=(
        --ignore-glob="tests/benchmarks/*" -k 'not (test_close_multiple_times or test_launch_and_close)'
    )
    
    %pytest -v "${pytest_args[@]}"
