# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-ipyparallel
version    : 9.2.0
release    : 11
source     :
    - https://files.pythonhosted.org/packages/source/i/ipyparallel/ipyparallel-9.2.0.tar.gz : 2b31bb4e94708e7ffb4ee6501d7f5f664df7e1c4c572e91e9e0d12484c6a6910
homepage   : https://pypi.org/project/ipyparallel/
license    : BSD-3-Clause
component  : programming.python
summary    : Interactive Parallel Computing with IPython
description: |
    IPython Parallel (ipyparallel) is a Python package and collection of CLI scripts for controlling clusters of IPython processes, built on the Jupyter protocol.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
checkdeps  :
    - python-dateutil
    - python-decorator
    - python-ipykernel
    - python-ipython
    - python-jupyter_client
    - python-psutil
    - python-pytest
    - python-pytest-asyncio
    - python-pytest-cov
    - python-pyzmq
    - python-testpath
    - python-tornado
    - python-tqdm
    - python-traitlets
rundeps    :
    - python-dateutil
    - python-decorator
    - python-ipykernel
    - python-ipython
    - python-jupyter_client
    - python-psutil
    - python-pyzmq
    - python-tornado
    - python-tqdm
    - python-traitlets
build      : |
    %pyproject_build --skip-dependency-check
install    : |
    %pyproject_install
check      : |
    %pytest -v
