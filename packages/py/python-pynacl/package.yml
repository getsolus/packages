# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pynacl
version    : 1.6.2
release    : 13
source     :
    - https://files.pythonhosted.org/packages/source/p/pynacl/pynacl-1.6.2.tar.gz : 018494d6d696ae03c7e656e5e74cdfd8ea1326962cc401bcf018f1ed8436811c
license    : Apache-2.0
component  : programming.python
homepage   : https://github.com/pyca/pynacl
summary    : Python binding to the Networking and Cryptography (NaCl) library
description: |
    PyNaCl is a Python binding to libsodium, which is a fork of the Networking and Cryptography library. These libraries have a stated goal of improving usability, security and speed.
builddeps  :
    - pkgconfig(libsodium)
    - pkgconfig(python3)
    - python-build
    - python-cffi
    - python-installer
    - python-wheel
rundeps    :
    - libsodium
    - python-cffi
    - python-six
setup      : |
    export SODIUM_INSTALL=system
    %pyproject_build
install    : |
    %pyproject_install
