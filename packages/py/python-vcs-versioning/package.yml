# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-vcs-versioning
version    : 2.2.3
release    : 1
source     :
    - https://github.com/pypa/setuptools-scm/archive/refs/tags/vcs-versioning-v2.2.3.tar.gz : 9b4978b69c3a22f0785f569e2715f235a2cc0f841bf358cf47f7cefb304e7220
homepage   : https://github.com/pypa/setuptools-scm
license    : MIT
component  : programming.python
summary    : The blessed package to manage your versions by vcs metadata
description: |
    The blessed package to manage your versions by vcs metadata.
builddeps  :
    - python-build
    - python-installer
checkdeps  :
    - git
    - jujutsu
    - mercurial
    - python-pytest
    - python-pytest-timeout
rundeps    :
    - python-packaging
    - python-setuptools
build      : |
    pushd vcs-versioning
    %pyproject_build
    popd
install    : |
    pushd vcs-versioning
    %pyproject_install
    popd
check      : |
    pushd vcs-versioning
    %pytest -v --deselect testing_vcs/test_jj.py::test_jj_disable_jj_falls_back_to_git
    popd
