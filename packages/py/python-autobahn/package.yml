# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-autobahn
version    : 26.7.1
release    : 17
source     :
    - https://github.com/crossbario/autobahn-python/archive/refs/tags/v26.7.1.tar.gz : 804f001ce90b34557d7fb877b478909b4cd004b6511e297b02c839ecf7031cdb
homepage   : https://github.com/crossbario/autobahn-python
license    : MIT
component  : programming.python
summary    : Real-time framework for Web, Mobile & Internet of Things
description: |
    Autobahn|Python is a subproject of Autobahn and provides open-source implementations of "The WebSocket Protocol" and "The Web Application Messaging Protocol (WAMP)", for Python 3.7+ and running on Twisted and asyncio.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-cffi
    - python-hatchling
    - python-installer
    - python-setuptools
    - python-twisted
    - python-txaio
# checkdeps  :
#     - python-pytest
#     - python-pytest-asyncio
rundeps    :
    - python-twisted
    - python-txaio
setup      : |
    %pyproject_build
install    : |
    %pyproject_install
# Disable tests temporarilly since autobahn doesn't work with the latest version of
# pytest-asyncio
# check      : |
#     %pytest -v
