# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-confuse
version    : 2.2.1
release    : 14
source     :
    - https://files.pythonhosted.org/packages/source/c/confuse/confuse-2.2.1.tar.gz : 8e7600c3261852122eb5f17b24b06ab8e5437b21d6224853c1420c38ac469d3c
homepage   : https://github.com/beetbox/confuse
license    : MIT
component  : programming.python
summary    : Painless YAML config files for Python
description: |
    Confuse is a configuration library for Python that uses YAML. It takes care of defaults, overrides, type checking, command-line integration, human-readable errors, and standard OS-specific locations.
builddeps  :
    - python-build
    - python-installer
    - python-poetry-core
checkdeps  :
    - python-pytest
rundeps    :
    - pyyaml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
