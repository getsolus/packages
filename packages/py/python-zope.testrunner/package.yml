# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-zope.testrunner
version    : '8.3'
release    : 5
source     :
    - https://github.com/zopefoundation/zope.testrunner/archive/refs/tags/8.3.tar.gz : f7fa94e97b8a4e04085205d28fb972aabfff9e28104d21ec768a7b7843ecda73
homepage   : https://zopetestrunner.readthedocs.io
license    : ZPL-2.1
component  : programming.python
summary    : A flexible test runner with layer support.
description: |
    A flexible test runner with layer support.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
    - python-zope.interface
rundeps    :
    - python-zope.exceptions
    - python-zope.interface
build      : |
    %python3_setup --skip-dependency-check
install    : |
    %python3_install

    rm -frv $installdir/usr/lib/python%python3_version%/site-packages/zope/testrunner/tests
