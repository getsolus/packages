# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pytest-xdist
version    : 3.8.0
release    : 1
source     :
    - https://github.com/pytest-dev/pytest-xdist/releases/download/v3.8.0/pytest_xdist-3.8.0.tar.gz : 7e578125ec9bc6050861aa93f2d59f1d8d085595d6551c2c90b6f4fad8d3a9f1
homepage   : https://github.com/pytest-dev/pytest-xdist
license    : MIT
component  : programming.python
summary    : pytest plugin for distributed testing and loop-on-failures testing modes
description: |
    The pytest-xdist plugin extends pytest with new test execution modes, the most used being distributing tests across multiple CPUs to speed up test execution.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools-scm
rundeps    :
    - python-execnet
    - python-pytest
checkdeps  :
    - python-execnet
    - python-filelock
    - python-psutil
    - python-pytest
setup      : |
    %patch -p1 -i ${pkgfiles}/44f4bea.patch
    %patch -p1 -i ${pkgfiles}/0c98447.patch
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
