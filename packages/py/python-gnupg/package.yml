# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-gnupg
version    : 0.5.6
release    : 13
source     :
    - https://pypi.debian.net/python-gnupg/python_gnupg-0.5.6.tar.gz : 5743e96212d38923fc19083812dc127907e44dbd3bcf0db4d657e291d3c21eac
homepage   : https://github.com/vsajip/python-gnupg
license    : BSD-3-Clause
component  : programming.python
summary    : A wrapper for the Gnu Privacy Guard (GPG or GnuPG)
description: |
    python-gnupg allows easy access to GnuPG's key management, encryption and signature functionality from Python programs.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
rundeps    :
    - gnupg
build      : |
    %pyproject_build
install    : |
    %pyproject_install
