# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-gnupg
version    : 0.5.7
release    : 14
source     :
    - https://pypi.debian.net/python-gnupg/python_gnupg-0.5.7.tar.gz : 73ea46219f992b361eb1ce54cb0968101670654454916a3ee5df8bb9bf0cc8cc
homepage   : https://github.com/vsajip/python-gnupg
license    : BSD-3-Clause
component  : programming.python
summary    : A wrapper for the Gnu Privacy Guard (GPG or GnuPG)
description: |
    python-gnupg allows easy access to GnuPG's key management, encryption and signature functionality from Python programs.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
rundeps    :
    - gnupg
setup      : |
    # 0.5.7 set a max version of 75 for setuptools. Check next version to see if can be removed
    %patch -p1 -i $pkgfiles/remove-setuptools-restriction.patch
build      : |
    %pyproject_build
install    : |
    %pyproject_install
