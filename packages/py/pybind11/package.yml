# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pybind11
version    : 3.1.0
release    : 18
source     :
    - https://github.com/pybind/pybind11/archive/refs/tags/v3.1.0.tar.gz : ef712655692a2e9bf7bb7874c022564a45f91d847ddee987e720cd9e28849665
homepage   : https://github.com/pybind/pybind11
license    : BSD-3-Clause
component  : programming.python
summary    : Seamless operability between C++11 and Python
description: |
    pybind11 is a lightweight header-only library that exposes C++ types in Python and vice versa, mainly to create Python bindings of existing C++ code.
patterns   :
    - /usr/include
    - /usr/share
builddeps  :
    - pkgconfig(python3)
    - libboost-devel
    - python-build
    - python-installer
    - python-scikit-build-core
    - python-setuptools
checkdeps  :
    - pkgconfig(eigen3)
    - python-pytest
    - scipy
setup      : |
    %cmake_ninja
build      : |
    %pyproject_build
    %ninja_build
install    : |
    %pyproject_install
    %ninja_install
    rm -rfv ${installdir}/usr/include/python3.*
check      : |
    export PYTEST_ADDOPTS="-k 'not test_array_resize and not test_import_in_subinterpreter_concurrently'"
    %ninja_build check
