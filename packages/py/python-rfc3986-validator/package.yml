# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-rfc3986-validator
version    : 0.1.1
release    : 5
source     :
    - https://files.pythonhosted.org/packages/source/r/rfc3986_validator/rfc3986_validator-0.1.1.tar.gz : 3d44bde7921b3b9ec3ae4e3adca370438eccebc676456449b145d533b240d055
homepage   : https://github.com/naimetti/rfc3986-validator
license    : MIT
component  : programming.python
summary    : Pure python rfc3986 validator
description: |
    Pure python rfc3986 validator
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-hypothesis
    - python-pytest
    - python-rfc3987
setup      : |
    # Drop deprecated pytest-runner
    sed -e "s|'pytest-runner',||" -i setup.py
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
