# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-invoke
version    : 3.0.3
release    : 16
source     :
    - https://github.com/pyinvoke/invoke/archive/refs/tags/3.0.3.tar.gz : dd36db4cc608682500f950ee7926ab91243d2a304131f73bf4edb337bb898467
homepage   : https://www.pyinvoke.org/
license    : BSD-2-Clause
component  : programming.python
summary    : Pythonic task management & command execution
description: |
    python-invoke is a Python library for managing shell-oriented subprocesses and organizing executable Python code into CLI-invokable tasks.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-icecream
    - python-mock
    - python-pytest-relaxed
    - pyyaml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v \
        --deselect tests/runners.py \
        --deselect tests/context.py::Context_::sudo::auto_response_merges_with_other_responses
