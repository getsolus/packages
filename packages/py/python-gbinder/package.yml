# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-gbinder
version    : 1.3.1
release    : 6
source     :
    - https://github.com/erfanoabdi/gbinder-python/archive/refs/tags/1.3.1.tar.gz : 27837fad61b741968a552d0b884e3d534b3b3cd1c92423018933972bc3aa9353
homepage   : https://github.com/erfanoabdi/gbinder-python
license    : GPL-3.0-only
component  : programming.python
summary    : Python bindings for libgbinder
description: |
    Python bindings for libgbinder
clang      : true
optimize   :
    - thin-lto
builddeps  :
    - pkgconfig(libgbinder)
    - cython
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
