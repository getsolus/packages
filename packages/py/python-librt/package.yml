# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-librt
version    : 0.15.0
release    : 3
source     :
    - https://github.com/mypyc/librt/archive/refs/tags/v0.15.0.tar.gz : 5220b66a8bbc4be13f134efd4626a032420b0801c29467a827ed920853f2c4ff
homepage   : https://github.com/mypyc/librt
license    : MIT
component  : programming.python
summary    : mypyc runtime library
description: |
    This library contains basic functionality that is useful in code compiled using mypyc, and efficient C implementations of various Python standard library classes and functions. Mypyc can produce faster extensions when you use librt in the code you compile. librt also contains some internal library features used by mypy.
clang      : true
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-mypy_extensions
    - python-pytest
setup      : |
    # See https://github.com/mypyc/librt/issues/17
    cp -r lib-rt/* ./
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest smoke_tests.py
