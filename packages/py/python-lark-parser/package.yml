# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-lark-parser
version    : 1.3.1
release    : 1
source     :
    - https://github.com/lark-parser/lark/archive/refs/tags/1.3.1.tar.gz : 7e6ee0e0e650643150ee42622d28e77324fe413eb83037817f05add5236356b2
homepage   : https://github.com/lark-parser/lark
license    : MIT
component  : programming.python
summary    : Lark is a parsing toolkit for Python, built with a focus on ergonomics, performance and modularity
description: |
    Lark is a parsing toolkit for Python, built with a focus on ergonomics, performance and modularity.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-setuptools-scm
    - python-wheel
checkdeps  :
    - python-atomicwrites
    - python-pytest
    - python-regex
    - python-typing-extensions
    - python-tzlocal
rundeps    :
    - python-typing-extensions
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -vv
