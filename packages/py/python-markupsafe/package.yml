# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-markupsafe
version    : 3.0.3
release    : 19
source     :
    - https://files.pythonhosted.org/packages/source/m/markupsafe/markupsafe-3.0.3.tar.gz : 722695808f4b6457b320fdc131280796bdceb04ab50fe1795cd540799ebe1698
homepage   : https://palletsprojects.com/p/markupsafe/
license    : BSD-3-Clause
component  : programming.python
summary    : Implements a XML/HTML/XHTML Markup safe string for Python
description: |
    MarkupSafe implements a text object that escapes characters so it is safe to use in HTML and XML. Characters that have special meanings are replaced so that they display as the actual characters. This mitigates injection attacks, meaning untrusted user input can safely be displayed on a page. Escaping is implemented in C so it is as efficient as possible.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-packaging
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
