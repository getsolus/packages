# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-cryptography
version    : 50.0.0
release    : 39
source     :
    - https://github.com/pyca/cryptography/archive/refs/tags/50.0.0.tar.gz : 173ac75ea60351540a237b8d4fde5d89b5d6645545771dfe3c9abe8b637f2b35
homepage   : https://cryptography.io
license    : Apache-2.0
component  : programming.python
networking : true
summary    : A package designed to expose cryptographic recipes and primitives to Python developers
description: |
    A package designed to expose cryptographic recipes and primitives to Python developers.
builddeps  :
    - pkgconfig(openssl)
    - pkgconfig(python3)
    - python-build
    - python-cffi
    - python-installer
    - python-maturin
    - python-setuptools
checkdeps  :
    - python-certifi
    - python-hypothesis
    - python-pretend
    - python-pytest
rundeps    :
    - python-cffi
environment: |
    # Set these manually because we don't have a macro for this.
    # Usually, our Cargo build macro sets these options, but we're
    # not using that in this package.
    CARGO_BUILD_DEP_INFO_BASEDIR="${workdir}"; export CARGO_BUILD_DEP_INFO_BASEDIR;
    CARGO_NET_RETRY=5; export CARGO_NET_RETRY;
    CARGO_PROFILE_RELEASE_DEBUG="full"; export CARGO_PROFILE_RELEASE_DEBUG;
    CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO="off"; export CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO;
    CARGO_PROFILE_RELEASE_LTO="off"; export CARGO_PROFILE_RELEASE_LTO;
    CARGO_PROFILE_RELEASE_STRIP="none"; export CARGO_PROFILE_RELEASE_STRIP;
setup      : |
    # Drop all benchmark tests, this means we don't have to checkdepends on
    # pytest-benchmark nor are benchmark tests interesting for a distribution.
    rm -rf tests/bench

    %cargo_fetch
build      : |
    %pyproject_build --skip-dependency-check
install    : |
    %pyproject_install
check      : |
    export PYTHONPATH=${PWD}/vectors:%python3_sitepackages%
    %pytest -v --override-ini="addopts=" tests
