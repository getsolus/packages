# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-cairo
version    : 1.29.0
release    : 16
source     :
    - https://github.com/pygobject/pycairo/archive/refs/tags/v1.29.0.tar.gz : 25c6a8a5a488afdd21208b5a71f95796891cceb2ee94f2ec1c51fdf0735eab0b
homepage   : https://pycairo.readthedocs.io/
license    :
    - LGPL-2.1-or-later
    - MPL-1.1
component  : programming.python
summary    : Python3 Cairo Bindings
description: |
    Python3 Cairo Bindings
builddeps  :
    - pkgconfig(cairo)
    - pkgconfig(python3)
    - meson-python
checkdeps  :
    - python-pytest
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING COPYING-*
check      : |
    %ninja_check
replaces   :
    - python3-cairo
    - devel : python3-cairo-devel
    - dbginfo : python3-cairo-dbginfo
