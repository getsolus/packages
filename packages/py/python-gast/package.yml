# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-gast
version    : 0.7.0
release    : 14
source     :
    - https://github.com/serge-sans-paille/gast/archive/refs/tags/0.7.0.tar.gz : 07926a53d1168eb73ae5e23a81e5a2f03819cb197a91657968d9fe1b00aac1c5
homepage   : https://github.com/serge-sans-paille/gast
license    : BSD-3-Clause
component  : programming.python
summary    : Python AST that abstracts the underlying Python version
description: |
    A generic AST to represent Python2 and Python3's Abstract Syntax Tree(AST).
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
