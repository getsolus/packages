# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pysequoia
version    : 0.1.36
release    : 2
source     :
    - https://files.pythonhosted.org/packages/source/p/pysequoia/pysequoia-0.1.36.tar.gz : 3e3f8d1e003cec0bf7b437d69f659c3d4ae784ac28b059580ef87fb56e8009d9
homepage   : https://github.com/wiktor-k/pysequoia
license    : Apache-2.0
component  : programming.python
summary    : OpenPGP in Python using Sequoia PGP
description: |
    This library provides OpenPGP facilities in Python through the Sequoia PGP library.
networking : true # for downloading rust crates
builddeps  :
    - python-build
    - python-installer
    - python-maturin
    - python-setuptools
build      : |
    %pyproject_build
install    : |
    %pyproject_install
