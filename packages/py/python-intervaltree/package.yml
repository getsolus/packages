# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-intervaltree
version    : 3.2.1
release    : 8
source     :
    - https://files.pythonhosted.org/packages/source/i/intervaltree/intervaltree-3.2.1.tar.gz : f3f7e8baeb7dd75b9f7a6d33cf3ec10025984a8e66e3016d537e52130c73cfe2
