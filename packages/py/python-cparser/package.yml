# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-cparser
version    : '3.00'
release    : 15
source     :
    - https://github.com/eliben/pycparser/archive/refs/tags/release_v3.00.tar.gz : e5d1c6879786a7ef12dd32b5a755db499000a79435926048b85b433a4b077b6a
homepage   : https://github.com/eliben/pycparser
license    : BSD-3-Clause
component  : programming.python
summary    : pycparser is a complete parser of the C language
description: |
    pycparser is a complete parser for the C language, written in pure Python. It is a module designed to be easily integrated into applications that need to parse C source code.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
