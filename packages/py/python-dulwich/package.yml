# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-dulwich
version    : 1.2.12
release    : 10
source     :
    - https://files.pythonhosted.org/packages/source/d/dulwich/dulwich-1.2.12.tar.gz : 1278d8ddb0a92fa4bc9f2e9b14edf0a2e140248bccc4c7c9752a1390e2ab4c64
homepage   : https://github.com/jelmer/dulwich
license    :
    - Apache-2.0
    - GPL-2.0-or-later
component  : programming.python
summary    : Pure-Python Git implementation
description: |
    This is the Dulwich project. It aims to provide an interface to git repos (both local and remote) that doesn't call out to git directly but instead uses pure Python.
networking : true
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-setuptools-rust
    - python-wheel
checkdeps  :
    - git
    - openssh
    - python-gevent
    - python-gpgme
    - python-paramiko
    - python-pytest
    - python-urllib3
rundeps    :
    - python-urllib3
environment: |
    # Set these manually because we don't have a macro for this.
    # Usually, our Cargo build macro sets these options, but we're
    # not using that in this package.
    CARGO_BUILD_DEP_INFO_BASEDIR="${workdir}"; export CARGO_BUILD_DEP_INFO_BASEDIR;
    CARGO_NET_RETRY=5; export CARGO_NET_RETRY;
    CARGO_PROFILE_RELEASE_DEBUG="full"; export CARGO_PROFILE_RELEASE_DEBUG;
    CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO="off"; export CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO;
    CARGO_PROFILE_RELEASE_LTO="off"; export CARGO_PROFILE_RELEASE_LTO;
    CARGO_PROFILE_RELEASE_STRIP="none"; export CARGO_PROFILE_RELEASE_STRIP;
setup      : |
    %cargo_fetch
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    _pytest_args=(
        # We run tests as root
        --deselect 'tests/test_sparse_patterns.py::ApplyIncludedPathsTests::test_local_modifications_ioerror'
        --ignore=contrib/test_swift_smoke.py
    )

    %pytest -v "${_pytest_args[@]}"
