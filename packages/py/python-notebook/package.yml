# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-notebook
version    : 7.6.2
release    : 21
source     :
    - https://files.pythonhosted.org/packages/source/n/notebook/notebook-7.6.2.tar.gz : cc02b5f0bb972160cccfe44ad8a1a202036206ba3439469c514f03aefa9ae807
homepage   : https://github.com/jupyter/notebook
license    : BSD-3-Clause
component  : programming.python
summary    : A web-based notebook environment for interactive computing
description: |
    The Jupyter Notebook is a web application that allows you to create and share documents that contain live code, equations, visualizations, and explanatory text. The Notebook has support for multiple programming languages, sharing, and interactive widgets.
builddeps  :
    - python-build
    - python-hatch-jupyter-builder
    - python-installer
    - python-jupyterlab
rundeps    :
    - python-jupyterlab
    - python-nbclassic
build      : |
    %pyproject_build --wheel --no-isolation --skip-dependency-check
install    : |
    %pyproject_install
