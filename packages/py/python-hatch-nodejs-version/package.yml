# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-hatch-nodejs-version
version    : 0.4.0
release    : 7
source     :
    - https://github.com/agoose77/hatch-nodejs-version/releases/download/v0.4.0/hatch_nodejs_version-0.4.0.tar.gz : 2428ea398dd053f019d2b7ac949dd6b690ca8e826b6d433ad13c5b6c475ae91b
homepage   : https://github.com/agoose77/hatch-nodejs-version
license    : MIT
component  : programming.python
summary    : Hatch plugin to read pyproject.toml metadata from package.json
description: |
    This package provides two Hatch plugins. Version source plugin that reads/writes the package version from the version field of the Node.js package.json file and metadata hook plugin that reads PEP 621 metadata from the Node.js package.json file.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
checkdeps  :
    - python-pytest
rundeps    :
    - python-hatchling
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
