# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-nbformat
version    : 5.11.1
release    : 18
source     :
    - https://files.pythonhosted.org/packages/source/n/nbformat/nbformat-5.11.1.tar.gz : 32d4521c68c6e7d5b29c76defaeed9f42ea733142b9b19f88277ce10390b9c4d
homepage   : https://github.com/jupyter/nbformat
license    : BSD-3-Clause
component  : programming.python
summary    : Reference implementation of the Jupyter Notebook format
description: |
    This package contains the base implementation of the Jupyter Notebook format, and Python APIs for working with notebooks.
builddeps  :
    - python-build
    - python-hatch-nodejs-version
    - python-installer
checkdeps  :
    - python-fastjsonschema
    - python-jsonschema
    - python-jupyter_core
    - python-pytest
    - python-testpath
rundeps    :
    - python-fastjsonschema
    - python-jsonschema
    - python-jupyter_core
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # Remove pep440 as we do not have it
    %pytest -v -k "not pep440"
