# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : pygraphviz
version    : 2.0.4
release    : 22
source     :
    - https://github.com/pygraphviz/pygraphviz/archive/pygraphviz-2.0.4.tar.gz : 3a68f2dac0c28047ac339de50450f8bac89ad3b6c58862192e6abe9a9601b37c
homepage   : https://pygraphviz.github.io/
license    : BSD-3-Clause
component  : programming.python
summary    : Python interface to Graphviz graph drawing package
description: |
    PyGraphviz is a Python interface to the Graphviz graph layout and visualization package
builddeps  :
    - pkgconfig(libpathplan)
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
    - swig
checkdeps  :
    - python-pytest
setup      : |
    %patch -p1 -i ${pkgfiles}/use-system-swig.patch
    %patch -p1 -i ${pkgfiles}/remove-spurious-rpaths.patch
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v \
        --doctest-modules \
        --durations=10 \
        --pyargs pygraphviz \
        --deselect tests/test_string.py::test_string_representation_large
