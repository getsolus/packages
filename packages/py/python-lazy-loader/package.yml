# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-lazy-loader
version    : '0.5'
release    : 4
source     :
    - https://files.pythonhosted.org/packages/source/l/lazy-loader/lazy_loader-0.5.tar.gz : 717f9179a0dbed357012ddad50a5ad3d5e4d9a0b8712680d4e687f5e6e6ed9b3
homepage   : https://github.com/scientific-python/lazy-loader
license    : BSD-3-Clause
component  : programming.python
summary    : Populate library namespace without incurring immediate import costs
description: |
    lazy-loader makes it easy to load subpackages and functions on demand.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - numpy
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %python3_install
check      : |
    %pytest
