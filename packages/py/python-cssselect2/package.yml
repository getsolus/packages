# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-cssselect2
version    : 0.9.0
release    : 7
source     :
    - https://files.pythonhosted.org/packages/source/c/cssselect2/cssselect2-0.9.0.tar.gz : 759aa22c216326356f65e62e791d66160a0f9c91d1424e8d8adc5e74dddfc6fb
homepage   : https://doc.courtbouillon.org/cssselect2/stable/
license    : BSD-3-Clause
component  : programming.python
summary    : CSS selectors for Python ElementTree
description: |
    cssselect2 is a straightforward implementation of CSS4 Selectors for markup documents (HTML, XML, etc.) that can be read by ElementTree-like parsers (including cElementTree, lxml, html5lib, etc.)
builddeps  :
    - python-build
    - python-flit-core
    - python-installer
    - python-packaging
    - python-tinycss2
    - python-webencodings
    - python-wheel
checkdeps  :
    - python-pytest
rundeps    :
    - python-tinycss2
    - python-webencodings
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
