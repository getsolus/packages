# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pyperclip
version    : 1.11.0
release    : 11
source     :
    - https://files.pythonhosted.org/packages/source/p/pyperclip/pyperclip-1.11.0.tar.gz : 244035963e4428530d9e3a6101a1ef97209c6825edab1567beac148ccc1db1b6
homepage   : https://github.com/asweigart/pyperclip
license    : BSD-3-Clause
component  : programming.python
summary    : Python module for copying and pasting text to the clipboard.
description: |
    Pyperclip is a cross-platform Python module for copy and paste clipboard functions. This module makes use of the xclip or xsel commands.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - python-pytest
rundeps    :
    - xclip
build      : |
    %pyproject_build
install    : |
    %pyproject_install
# Test suite for this version does not work in chroot 
#check      : |
    #%pytest  -v
