# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-fido2
version    : 2.2.1
release    : 22
source     :
    - https://github.com/Yubico/python-fido2/releases/download/2.2.1/fido2-2.2.1.tar.gz : 85787428a94c3f8eaf72f0ff30afba983b559a1b1b795c93318c81b4ad4062c4
homepage   : https://github.com/Yubico/python-fido2
license    :
    - Apache-2.0
    - BSD-2-Clause
    - MPL-2.0
component  : programming.python
summary    : Provides library functionality for communicating with a FIDO device over USB as well as verifying attestation and assertion signatures
description: |
    This library aims to support the FIDO U2F and FIDO 2.0 protocols for communicating with a USB authenticator via the Client-to-Authenticator Protocol (CTAP 1 and 2). In addition to this low-level device access, classes defined in the fido2.client implement higher level device operations.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-poetry
    - python-wheel
checkdeps  :
    - python-cryptography
    - python-pyscard
    - python-pytest
rundeps    :
    - python-cryptography
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # Pytest tests are interactive and require a physical device.
    # Obviously, we can't do that in a package test.
    python -m unittest discover -vs .
