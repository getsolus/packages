# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-scikit-build-core
version    : 1.0.3
release    : 5
source     :
    - https://files.pythonhosted.org/packages/source/s/scikit_build_core/scikit_build_core-1.0.3.tar.gz : a4d7a05978ee37975c37743510c8991e2debce7ef83afb0a07c0c576fd4f16e8
homepage   : https://github.com/scikit-build/scikit-build-core
license    : Apache-2.0
component  : programming.python
summary    : A next generation Python CMake adaptor and Python API for plugins
description: |
    Scikit-build-core is a build backend for Python that uses CMake to build extension modules. It has a simple yet powerful static configuration system in pyproject.toml, and supports almost unlimited flexibility via CMake. It was initially developed to support the demanding needs of scientific users, but can build any sort of package that uses CMake.
builddeps  :
    - python-build
    - python-hatch-vcs
    - python-hatchling
    - python-installer
    - python-packaging
    - python-wheel
#checkdeps  :
  #    - pybind11
  #    - python-fastjsonschema
  #    - python-pytest
  #    - virtualenv
rundeps    :
    - python-packaging
    - python-pathspec
build      : |
    %pyproject_build
install    : |
    %pyproject_install
#check      : |
    #%pytest
