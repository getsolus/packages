# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-peewee
version    : 4.3.0
release    : 22
source     :
    - https://github.com/coleifer/peewee/archive/refs/tags/4.3.0.tar.gz : 2df548df00bcce173297e3f264cefb8517d1215565e07f0225e4cd1055b50679
homepage   : https://github.com/coleifer/peewee
license    : MIT
component  : programming.python
summary    : A small, expressive orm -- supports postgresql, mysql and sqlite
description: |
    Peewee is a simple and small ORM. It has few (but expressive) concepts, making it easy to learn and intuitive to use.
builddeps  :
    - pkgconfig(sqlite3)
    - cython
    - flask
    - psycopg2
    - python-apsw
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # Cannot use macro with this custom test
    %python3_test runtests.py
