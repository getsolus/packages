# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-discovery
version    : 1.6.4
release    : 2
source     :
    - https://github.com/tox-dev/python-discovery/archive/refs/tags/1.6.4.tar.gz : 0a481c81eaf2104b329962bfa0d4d953979cf2919b536235bcfd68f0a198f07c
homepage   : https://pypi.org/project/python-discovery/
license    : MIT
component  : programming.python
summary    : Python interpreter discovery
description: |
    python-discovery is a library for discovering Python interpreters installed on your machine. You may have multiple Python versions from system packages, pyenv, mise, asdf, uv, or the Windows registry (PEP 514). This library finds the right one for you.
builddeps  :
    - python-build
    - python-hatch-vcs
    - python-installer
    - python-wheel
checkdeps  :
    - python-filelock
    - python-pytest
    - python-pytest-mock
    - python-vermin
rundeps    :
    - python-filelock
build      : |
    export SETUPTOOLS_SCM_PRETEND_VERSION=${version}

    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
