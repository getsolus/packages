# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-hatch-fancy-pypi-readme
version    : 25.1.0
release    : 7
source     :
    - https://github.com/hynek/hatch-fancy-pypi-readme/archive/refs/tags/25.1.0.tar.gz : 06b696395f0295e55efb14955d61db031e760129de7ee2643916c7b8347f4ba3
homepage   : https://github.com/hynek/hatch-fancy-pypi-readme
license    : MIT
component  : programming.python
summary    : Fancy PyPI READMEs with Hatch
description: |
    hatch-fancy-pypi-readme is a Hatch metadata plugin for everyone who cares about the first impression of their project’s PyPI landing page. It allows you to define your PyPI project description in terms of concatenated fragments that are based on static strings, files, and most importantly: parts of files defined using cut-off points or regular expressions.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
checkdeps  :
    - python-pytest
    - python-wheel
rundeps    :
    - python-hatchling
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # end-to-end test requires network access
    %pytest -v \
        --deselect 'tests/test_end_to_end.py'
