# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-dirty-equals
version    : 0.11.0
release    : 1
source     :
    - https://github.com/samuelcolvin/dirty-equals/archive/refs/tags/v0.11.0.tar.gz : 60e0be7d05669c780258804739c6882fd3d1069e72fe2b7909656bd8f2d48e2c
homepage   : https://dirty-equals.helpmanual.io/
license    : MIT
component  : programming.python
summary    : Doing dirty (but extremely useful) things with equals
description: |
    Python library that (mis)uses the __eq__ method to make python code (generally unit tests) more declarative and therefore easier to read and write.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
    - python-wheel
checkdeps  :
    - python-pydantic
    - python-pytest
    - python-pytest-examples
    - python-pytest-mock
    - python-pytokens
    - python-ruff
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # tests require UTC timezone: https://github.com/samuelcolvin/dirty-equals/issues/33
    export TZ=UTC

    # TODO(Evan): Revisit the ignore after pydantic update
    %pytest -v -W=ignore::DeprecationWarning --ignore=tests/test_other.py
