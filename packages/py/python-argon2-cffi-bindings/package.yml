# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-argon2-cffi-bindings
version    : 26.1.0
release    : 6
source     :
    - https://github.com/hynek/argon2-cffi-bindings/archive/refs/tags/26.1.0.tar.gz : 5555dd98c57e3f8c3e8f7b7607c0e6bdad53b9310eff9f4a23e39cb70a52dd2e
homepage   : https://github.com/hynek/argon2-cffi-bindings
license    : MIT
component  : programming.python
summary    : Low-level Python CFFI Bindings for Argon2
description: |
    argon2-cffi-bindings provides low-level CFFI bindings to the official implementation of the Argon2 password hashing algorithm.
builddeps  :
    - pkgconfig(libargon2)
    - pkgconfig(python3)
    - python-build
    - python-cffi
    - python-installer
    - python-scikit-build-core
    - python-setuptools-scm
    - python-wheel
checkdeps  :
    - argon2
    - python-cffi
    - python-pytest
rundeps    :
    - argon2
    - python-cffi
build      : |
    export SETUPTOOLS_SCM_PRETEND_VERSION=${version}
    export ARGON2_CFFI_USE_SYSTEM=1

    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
