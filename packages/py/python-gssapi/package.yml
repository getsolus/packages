# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-gssapi
version    : 1.11.1
release    : 11
source     :
    - https://files.pythonhosted.org/packages/source/g/gssapi/gssapi-1.11.1.tar.gz : 2049ee4b1d0c363163a1344b7282a363f9f4094e51d2c36de0cf01d4735e0ae2
homepage   : https://github.com/pythongssapi/python-gssapi
license    : ISC
component  : programming.python
summary    : Python GSSAPI Wrapper
description: |
    Python-GSSAPI provides both low-level and high level wrappers around the GSSAPI C libraries. While it focuses on the Kerberos mechanism, it should also be useable with other GSSAPI mechanisms.
builddeps  :
    - pkgconfig(krb5)
    - cython
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
rundeps    :
    - python-decorator
build      : |
    %pyproject_build
install    : |
    %pyproject_install
