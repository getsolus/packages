# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-msgpack
version    : 1.2.1
release    : 20
source     :
    - https://files.pythonhosted.org/packages/source/m/msgpack/msgpack-1.2.1.tar.gz : 04c721c2c7448767e9e3f2520a475663d8ee0f09c31890f6d2bd70fd636a9647
homepage   : https://msgpack.org/
license    : Apache-2.0
component  : programming.python
summary    : A fast, compact binary serialization format, suitable for similar data to JSON
description: |
    MessagePack is an efficient binary serialization format. It lets you exchange data among multiple languages like JSON. But it's faster and smaller. This package provides CPython bindings for reading and writing MessagePack data.
builddeps  :
    - cython
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
