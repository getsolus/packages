# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-types-pyyaml
version    : 6.0.12.20260815
release    : 10
source     :
    - https://pypi.python.org/packages/source/t/types-PyYAML/types_pyyaml-6.0.12.20260815.tar.gz : 28764110c9cf35846e733da32d8d734df7473c5dde9ef67c3b7332ec0e819858
homepage   : https://github.com/python/typeshed
license    : Apache-2.0
component  : programming.python
summary    : Typing stubs for PyYAML
description: |
    This is a PEP 561 type stub package for the PyYAML package. It can be used by type-checking tools like mypy, pyright, pytype, PyCharm, etc. to check code that uses PyYAML.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
