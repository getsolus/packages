# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-types-pyyaml
version    : 6.0.12.20260906
release    : 11
source     :
    - https://pypi.python.org/packages/source/t/types-PyYAML/types_pyyaml-6.0.12.20260906.tar.gz : f59c1cc05010b833d2d72287bbaa72610106b28d42d89a907313117faba85212
homepage   : https://github.com/python/typeshed
license    : Apache-2.0
component  : programming.python
summary    : Typing stubs for PyYAML
description: |
    This is a PEP 561 type stub package for the PyYAML package. It can be used by type-checking tools like mypy, pyright, pytype, PyCharm, etc. to check code that uses PyYAML.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
