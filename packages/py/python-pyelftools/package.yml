# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pyelftools
version    : '0.33'
release    : 14
source     :
    - https://github.com/eliben/pyelftools/archive/refs/tags/v0.33.tar.gz : 5507d69b42ac7211e5db57b42f427376b2cf3e3ab9a72b9239f4fc243566869d
homepage   : https://github.com/eliben/pyelftools
license    : Unlicense
component  : programming.python
summary    : Parsing ELF and DWARF in Python
description: |
    pyelftools is a pure-Python library for parsing and analyzing ELF files and DWARF debugging information.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    python3 test/run_all_unittests.py
    python3 test/run_examples_test.py
    python3 test/run_readelf_tests.py
