# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pytest-timeout
version    : 2.5.0
release    : 13
source     :
    - https://files.pythonhosted.org/packages/source/p/pytest-timeout/pytest_timeout-2.5.0.tar.gz : 68c9d82dfe95fa65712e107010c9344e7d8b4afe8c975a7be0d273d939583a93
homepage   : https://github.com/pytest-dev/pytest-timeout/
license    : MIT
component  : programming.python
summary    : py.test plugin to abort hanging tests
description: |
    This is a plugin which will terminate tests after a certain timeout, assuming the test session isn't being debugged. When aborting a test it will show a stack dump of all threads running at the time. This is useful when running tests under a continuous integration server or simply if you don't know why the test suite hangs.
builddeps  :
    - python-build
    - python-installer
    - python-packaging
    - python-pexpect
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest-cov
rundeps    :
    - python-pytest
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
