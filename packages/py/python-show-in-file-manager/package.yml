# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-show-in-file-manager
version    : 1.1.6
release    : 8
source     :
    - https://github.com/damonlynch/showinfilemanager/archive/refs/tags/v1.1.6.tar.gz : 14dc160ab7f27955ee23a567033dd3b2b6576f7d949ed307b007e990b03c3e9e
homepage   : https://github.com/damonlynch/showinfilemanager
license    : MIT
component  : programming.python
summary    : Python module to open the system file manager and select files in it
description: |
    Show in File Manager is a Python package to open the system file manager and optionally select files in it. The point is not to open the files, but to select them in the file manager, thereby highlighting the files and allowing the user to quickly do something with them.
builddeps  :
    - python-build
    - python-hatch-argparse-manpage
    - python-hatchling
    - python-installer
    - python-wheel
rundeps    :
    - python-packaging
    - pyxdg
build      : |
    %pyproject_build
install    : |
    %pyproject_install

    # Fix manpage location
    %install_dir ${installdir}/usr/share/man/man1
    mv %python3_sitepackages%/man/showinfilemanager.1 ${installdir}/usr/share/man/man1/showinfilemanager.1
    rmdir -v %python3_sitepackages%/man
