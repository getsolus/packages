# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-pywayland
version    : 0.4.19
release    : 3
source     :
    - https://files.pythonhosted.org/packages/source/p/pywayland/pywayland-0.4.19.tar.gz : 9d8478f5b0df3540333ccf85a55fe8b34150b2c28c685805de9ffa855898549e
homepage   : https://pypi.org/project/pywayland/
license    : Apache-2.0
component  : programming.python
summary    : Python bindings for the libwayland library written in pure Python.
description: |
    PyWayland provides a wrapper to the libwayland library using the CFFI library to provide access to the Wayland library calls and written in pure Python.
builddeps  :
    - pkgconfig(python3)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-server)
    - python-build
    - python-cffi
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest
rundeps    :
    - python-cffi
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # allows test suite the attempt to spawn a mock Wayland server/display 
    export XDG_RUNTIME_DIR=$(mktemp -d)
    %pytest
