# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-tifffile
version    : 2026.8.16
release    : 12
source     :
    - https://files.pythonhosted.org/packages/source/t/tifffile/tifffile-2026.8.16.tar.gz : 523a18b8183253e1e594162eed45f157c959d8cff6decde3f2d58f20a5a45389
homepage   : https://github.com/cgohlke/tifffile/
license    : BSD-3-Clause
component  : programming.python
summary    : Read and write TIFF files
description: |
    Tifffile is a Python library to store numpy arrays in TIFF (Tagged Image File Format) files, and read image and metadata from TIFF-like files used in bioimaging.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - numpy
build      : |
    %pyproject_build
install    : |
    %pyproject_install
#check      : |
#    # requires packaging python-fsspec and python-xarray
#    %python3_test pytest3 -v
