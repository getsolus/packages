# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-tifffile
version    : 2026.7.31
release    : 11
source     :
    - https://files.pythonhosted.org/packages/source/t/tifffile/tifffile-2026.7.31.tar.gz : 79b1f4b1aba3ef3e6b6f1691a32abb62f5d7383faa52a12771c695232ba40bee
homepage   : https://github.com/cgohlke/tifffile/
license    : BSD-3-Clause
component  : programming.python
summary    : Read and write TIFF files
description: |
    Tifffile is a Python library to store numpy arrays in TIFF (Tagged Image File Format) files, and read image and metadata from TIFF-like files used in bioimaging.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
rundeps    :
    - numpy
build      : |
    %pyproject_build
install    : |
    %pyproject_install
#check      : |
#    # requires packaging python-fsspec and python-xarray
#    %python3_test pytest3 -v
