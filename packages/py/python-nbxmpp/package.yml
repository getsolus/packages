# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-nbxmpp
version    : 7.5.0
release    : 36
source     :
    - https://files.pythonhosted.org/packages/source/n/nbxmpp/nbxmpp-7.5.0.tar.gz : be2163c2c83bf0743f83cd656e0e9ff2551f8499082f585f2eb57d56cc0c3715
homepage   : https://python-nbxmpp.gajim.org
license    : GPL-3.0-or-later
component  : programming.python
summary    : Library to connect to Jabber/XMPP networks in a non-blocking way
description: |
    python-nbxmpp is a Python library that provides a way for Python applications to use Jabber/XMPP networks in a non-blocking way.
builddeps  :
    - python-build
    - python-installer
    - python-packaging
    - python-setuptools
    - python-wheel
rundeps    :
    - libsoup
    - python-gobject
    - python-idna
    - python-packaging
    - python-precis_i18n
build      : |
    %pyproject_build
install    : |
    %pyproject_install
