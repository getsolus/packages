# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-hatch-argparse-manpage
version    : 1.0.1
release    : 1
source     :
    - https://github.com/damonlynch/hatch-argparse-manpage/releases/download/v1.0.1/hatch-argparse-manpage-1.0.1.tar.gz : 76cb65fb230e312f4b1bd78cbae8f237a14e784b9e246f53c35fd6f4adde6bac
homepage   : https://github.com/damonlynch/hatch-argparse-manpage
license    : GPL-3.0-or-later
component  : programming.python
summary    : Hatch build hook plugin to automatically generate manual pages
description: |
    This provides a build hook plugin for Hatch to automatically generate a manual page from an ArgumentParser object, using argparse-manpage by Pavel Raiskup.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
    - python-wheel
rundeps    :
    - python-argparse-manpage
    - python-rich
build      : |
    %pyproject_build
install    : |
    %pyproject_install
