# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-hatch-argparse-manpage
version    : 1.0.2
release    : 2
source     :
    - https://github.com/damonlynch/hatch-argparse-manpage/releases/download/v1.0.2/hatch-argparse-manpage-1.0.2.tar.gz : 3d3ea8f81424cd8ceea1e050f01a76ff88dfe1db523684b6c562fa01cda5fa15
homepage   : https://github.com/damonlynch/hatch-argparse-manpage
license    : GPL-3.0-or-later
component  : programming.python
summary    : Hatch build hook plugin to automatically generate manual pages
description: |
    This provides a build hook plugin for Hatch to automatically generate a manual page from an ArgumentParser object, using argparse-manpage by Pavel Raiskup.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
    - python-wheel
rundeps    :
    - python-argparse-manpage
    - python-rich
build      : |
    %pyproject_build
install    : |
    %pyproject_install
