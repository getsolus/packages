# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : python-docstring-to-markdown
version    : '0.17'
release    : 9
source     :
    - https://github.com/python-lsp/docstring-to-markdown/archive/refs/tags/v0.17.tar.gz : 2e5d77db913f8bbea1fb8bb1cb269896904e9fe43c75e00e01e20839ab0fae82
homepage   : https://github.com/python-lsp/docstring-to-markdown
license    : LGPL-2.1-or-later
component  : programming.python
summary    : On the fly conversion of Python docstrings to markdown
description: |
    On the fly conversion of Python docstrings to markdown. Currently can recognise reStructuredText and convert multiple of its features to Markdown. In the future will be able to convert Google docstrings too.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
checkdeps  :
    - python-pytest
rundeps    :
    - python-typing-extensions
setup      : |
    %patch -p1 -i ${pkgfiles}/fix-importlib.patch
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    # Override addopts as they invoke coverage testing
    %pytest -v --override-ini="addopts="
