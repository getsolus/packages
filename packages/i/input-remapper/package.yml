# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : input-remapper
version    : 2.2.1
release    : 14
source     :
    - https://github.com/sezanzeb/input-remapper/archive/refs/tags/2.2.1.tar.gz : 6ad3d58829e29f2943cbc874b910a94e699428547240f3e5b2a4acbd34e62d2f
homepage   : https://github.com/sezanzeb/input-remapper
license    : GPL-3.0-or-later
component  : system.utils
summary    : An easy to use tool to change the behaviour of your input devices.
description: |
    An easy to use tool to change the behaviour of your input devices. Supports X11, Wayland, combinations, programmable macros, joysticks, wheels, triggers, keys, mouse-movements and more. Maps any input to any other input.
builddeps  :
    - python-build
    - python-installer
rundeps    :
    - libgtksourceview4
    - python-cairo
    - python-dasbus
    - python-evdev
    - python-gobject
    - python-packaging
    - python-psutil
    - python-pydantic
setup      : |
    # appstream-builder chokes on this
    sed -i 's/\[year\]/2024/g; s/\[name\]/John Doe/g' data/io.github.sezanzeb.input_remapper.metainfo.xml
build      : |
    %pyproject_build
install    : |
    %pyproject_install
    # install non-python files
    python3 -m install --root ${installdir} --components data_files

    # pkexec refuses group-writable helpers
    chmod 0755 ${installdir}/%PREFIX%/bin/input-remapper-*
    chmod 0644 ${installdir}/%PREFIX%/share/polkit-1/actions/input-remapper.policy

    # hermetic /usr
    %install_dir ${installdir}/%PREFIX%/share/xdg/autostart/
    mv ${installdir}/etc/xdg/autostart/input-remapper-autoload.desktop ${installdir}/%PREFIX%/share/xdg/autostart/input-remapper-autoload.desktop
    rm -fr ${installdir}/etc

    # remove duplicate appstream metainfo
    rm -rfv ${installdir}/%PREFIX%/share/input-remapper/*.metainfo.xml

    # systemd preset
    %install_file -t ${installdir}/%libdir%/systemd/system-preset ${pkgfiles}/60-input-remapper.preset

    %install_license LICENSE
