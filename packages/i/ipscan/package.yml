# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ipscan
version    : 3.10.0
release    : 21
source     :
    - https://github.com/angryip/ipscan/archive/refs/tags/3.10.0.tar.gz : 
        2516b177a491e690ff5e456144ab0c56bbfae28d782f478657290e5e25f98847
license    : GPL-2.0-or-later
homepage   : https://angryip.org/
component  : network.util
summary    : Angry IP Scanner - Fast network scanner
description: |
    ipscan scans the network for reachable hosts and more.
networking : true
builddeps  :
    - gradle
    - openjdk-25
rundeps    :
    - openjdk-25
environment: |
    export JAVA_HOME=/usr/lib64/openjdk-25
    export PATH=$JAVA_HOME/bin:$PATH

    export GRADLE_USER_HOME=${workdir}/.gradle
setup      : |
    # This patch does the following:
    # - Uses a Gradle property for version detection instead of Git
    # - Disables building of deb and rpm packages
    %patch -p1 -i ${pkgfiles}/fix-build-gradle.patch
build      : |
    gradle -PipscanVersion=%version% linux64
install    : |
    %install_bin ${pkgfiles}/ipscan
    %install_file ${pkgfiles}/ipscan.desktop -t ${installdir}/usr/share/applications
    %install_file ${workdir}/build/libs/ipscan*linux64*.jar ${installdir}/usr/share/ipscan/ipscan.jar

    %install_file ${workdir}/build/resources/main/images/icon.svg ${installdir}/usr/share/icons/hicolor/scalable/apps/ipscan.svg
    for i in 32 48 128 256; do
        %install_file ${workdir}/build/resources/main/images/icon${i}.png ${installdir}/usr/share/icons/hicolor/${i}x${i}/apps/ipscan.png
    done
    %install_file ${pkgfiles}/org.angryip.ipscan.metainfo.xml -t ${installdir}/usr/share/metainfo
    %install_license LICENSE
