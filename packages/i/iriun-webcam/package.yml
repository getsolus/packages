# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : iriunwebcam
version    : 2.9.3
release    : 2
source     :
    - https://iriun.com/iriunwebcam-2.9.3.deb : 3635363ec642788aca1e5a3fd45ee978ab6f69ac0a0d2ab5d68ae11bc4a80cc9
homepage   : https://iriun.com/
license    : Proprietary
component  : system.utils
summary    : Iriun Webcam for Linux
description: |
    Use your phone's camera as a wireless webcam on your PC.
extract    : false
strip      : false
rundeps    :
    - pipewire
    - qt6-base-gui
    - v4l2loopback-current
    - libusbmuxd
    - usbmuxd
setup      : |
    ar xf $sources/iriunwebcam-$version.deb
    mkdir payload
    tar -xf data.tar.zst -C payload
install    : |
    # Application
    # Programme et alias dans un dossier privé
    install -Dm00755 payload/usr/local/bin/iriunwebcam \
        $installdir/usr/lib64/iriunwebcam/iriunwebcam

    install -dm00755 $installdir/usr/lib64/iriunwebcam/lib
    ln -s /usr/lib/libusbmuxd-2.0.so.6 \
        $installdir/usr/lib64/iriunwebcam/lib/libusbmuxd.so.6

    # Lanceur public

    install -dm00755 $installdir/usr/bin
    cat > $installdir/usr/bin/iriunwebcam <<'EOF'
    #!/bin/sh
    export LD_LIBRARY_PATH="/usr/lib64/iriunwebcam/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    exec /usr/lib64/iriunwebcam/iriunwebcam "$@"
    EOF
    chmod 00755 $installdir/usr/bin/iriunwebcam
    # Desktop launcher and icon
    install -Dm00644 payload/usr/share/applications/iriunwebcam.desktop \
        $installdir/usr/share/applications/iriunwebcam.desktop
    sed -i 's|/usr/local/bin/iriunwebcam|/usr/bin/iriunwebcam|' \
        $installdir/usr/share/applications/iriunwebcam.desktop

    install -Dm00644 payload/usr/share/pixmaps/iriunwebcam.png \
        $installdir/usr/share/pixmaps/iriunwebcam.png

    # PipeWire audio plugin
    install -Dm00755 \
        payload/usr/lib/x86_64-linux-gnu/spa-0.2/iriunaudio/libspa-iriunaudio.so \
        $installdir/usr/lib64/spa-0.2/iriunaudio/libspa-iriunaudio.so

    install -Dm00644 \
        payload/usr/share/pipewire/pipewire.conf.d/iriunaudio.conf \
        $installdir/usr/share/pipewire/pipewire.conf.d/iriunaudio.conf

    # Load and configure the virtual camera module
    install -Dm00644 payload/etc/modprobe.d/iriunwebcam-options.conf \
        $installdir/usr/lib/modprobe.d/iriunwebcam-options.conf
    install -Dm00644 payload/etc/modules-load.d/iriunwebcam.conf \
        $installdir/usr/lib/modules-load.d/iriunwebcam.conf
