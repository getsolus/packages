# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ibus
version    : 1.5.34
release    : 37
source     :
    - https://github.com/ibus/ibus/releases/download/1.5.34/ibus-1.5.34.tar.gz : 12a72210ce5250f8a66df562a75e034e67b2bce74c4df2983dc86d1154894943
homepage   : https://github.com/ibus/ibus
license    : LGPL-2.0-only
component  : desktop.core
summary    : Intelligent Input Bus
description: |
    IBus is an Intelligent Input Bus. It is a new input framework for Linux OS. It provides full featured and user friendly input method user interface.
builddeps  :
    - pkgconfig(dbusmenu-glib-0.4)
    - pkgconfig(dconf)
    - pkgconfig(gconf-2.0)
    - pkgconfig(gtk+-2.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(gtk4)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(libnotify)
    - pkgconfig(wayland-protocols)
    - gnome-common
    - gtk-doc
    - unicode-character-database
    - vala
rundeps    :
    - unicode-character-database
setup      : |
    %patch -p1 -i $pkgfiles/segv-bus-proxy.patch
    %patch -p1 -i $pkgfiles/0001-Stateless-dconf.patch
    %patch -p1 -i $pkgfiles/0001-dconf-Use-dbus-run-session-to-set-up-dconf-overrides.patch
    # https://gitlab.gnome.org/GNOME/gtk/-/work_items/8341
    %patch -p1 -i $pkgfiles/2929.patch
    # https://gitlab.gnome.org/GNOME/gnome-shell/-/work_items/9401
    %patch -p1 -i $pkgfiles/gnome-51-01.patch
    %patch -p1 -i $pkgfiles/gnome-51-02.patch

    %reconfigure --disable-python2 \
               --disable-silent-rules \
               --disable-static \
               --enable-gtk4 \
               --enable-memconf \
               --enable-gtk-doc \
               --enable-wayland
build      : |
    # Generate ibus-portal-dbus.c ourselves to work around https://github.com/ibus/ibus/issues/2734
    %make -C portal maintainer-clean-generic

    %make
install    : |
    %make_install
    %install_license COPYING

    # Pre-compile the dconf db
    pushd data/dconf
    mkdir temp
    make 00-upstream-settings
    mv 00-upstream-settings temp
    dconf compile ibus-dconf-defaults temp
    install -Dm00644 ibus-dconf-defaults $installdir/usr/share/ibus
    popd

    # Stateless
    install -dm0755 $installdir/usr/share/xdg/Xwayland-session.d/
    mv $installdir/etc/xdg/Xwayland-session.d/10-ibus-x11 $installdir/usr/share/xdg/Xwayland-session.d/
    rmdir -v $installdir/etc/xdg/Xwayland-session.d \
             $installdir/etc/xdg \
             $installdir/etc
