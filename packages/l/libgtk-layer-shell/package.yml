# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libgtk-layer-shell
version    : 0.10.1
release    : 4
source     :
    - https://github.com/wmww/gtk-layer-shell/archive/refs/tags/v0.10.1.tar.gz : 88c3a3e0a5300532f3d368d5df64838a87f1fb85273f22d41df0a6b8d0ec59c6
homepage   : https://wmww.github.io/gtk-layer-shell/
