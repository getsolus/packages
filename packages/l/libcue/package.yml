# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libcue
version    : 2.3.0
release    : 9
source     :
    - https://github.com/lipnitsk/libcue/archive/v2.3.0.tar.gz : cc1b3a65c60bd88b77a1ddd1574042d83cf7cc32b85fe9481c99613359eb7cfe
homepage   : https://github.com/lipnitsk/libcue
license    : GPL-2.0-or-later
component  : multimedia.library
summary    : Cue sheet parser library
description: |
    libcue is intended for parsing a so-called cue sheet from a char string or a file pointer.
setup      : |
    %cmake_ninja \
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DBUILD_SHARED_LIBS=ON
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE
