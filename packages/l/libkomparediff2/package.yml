# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libkomparediff2
version    : 26.08.3
release    : 104
source     :
    - https://download.kde.org/stable/release-service/26.08.3/src/libkomparediff2-26.08.3.tar.xz : 87c9e6b5dcf64463442f3748e4b7b79a85748def48c4d649152627e0b1836d4f
homepage   : https://kde.org/
license    :
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
component  : programming
