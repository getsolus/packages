# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libkomparediff2
version    : 26.08.1
release    : 102
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/libkomparediff2-26.08.1.tar.xz : d222901b0a90f853f21e86bf08db73c3edb65e8d4bbf820626512df82c8430c2
homepage   : https://kde.org/
license    :
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
component  : programming
summary    : Library to compare files and strings
description: |
    Library to compare files and strings, used in Kompare and KDevelop.
builddeps  :
    - kf6-kio-devel
    - kf6-kxmlgui-devel
rundeps    :
    - devel :
        - kf6-kconfig-devel
        - kf6-kxmlgui-devel
        - qt6-base-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
