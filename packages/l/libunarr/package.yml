# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libunarr
version    : 1.2.0
release    : 3
source     :
    - https://github.com/selmf/unarr/archive/refs/tags/v1.2.0.tar.gz : eba65db354a887c40b39e9f341553977bebc7a293f96c5e1d888064f8d9dd443
homepage   : https://github.com/selmf/unarr
license    : LGPL-3.0-or-later
component  : programming.library
summary    : (lib)unarr is a decompression library for RAR, TAR, ZIP and 7z* archives.
description: |
    It was forked from unarr, which originated as a port of the RAR extraction features from The Unarchiver project required for extracting images from comic book archives.
setup      : |
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING