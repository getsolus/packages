# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libvirt
version    : 12.9.0
release    : 90
source     :
    - https://libvirt.org/sources/libvirt-12.9.0.tar.xz : dcf579d8a949f4cbf56820529d48f200382a48ea12855ffded7c16a189353cd7
license    :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
homepage   : https://libvirt.org/
component  : virt
summary    : Library providing a simple virtualization API
description: |
    A toolkit to interact with the virtualization capabilities of recent versions of Linux
builddeps  :
    - pkgconfig(devmapper)
    - pkgconfig(fuse3)
    - pkgconfig(gnutls)
    - pkgconfig(json-c)
    - pkgconfig(libacl)
    - pkgconfig(libattr)
    - pkgconfig(libbsd)
    - pkgconfig(libcap-ng)
    - pkgconfig(libiptc)
    - pkgconfig(libnl-3.0)
    - pkgconfig(libparted)
    - pkgconfig(libpcap)
    - pkgconfig(libssh2)
    - pkgconfig(libtirpc)
    - pkgconfig(libxml-2.0)
    - pkgconfig(pciaccess)
    - dmidecode
    - dnsmasq
    - iptables
    - parted
    - python-docutils
    - rpcsvc-proto-devel
rundeps    :
    - dmidecode
    - dnsmasq
    - iptables
    - parted
setup      : |
    %patch -p1 -i ${pkgfiles}/CVE-2026-119151.patch

    # To make libvirt work with UFW (which uses iptables userspace tools), we have to ensure
    # that iptables take precedence over nftables (which is what firewalld uses).
    # See also: https://gitlab.com/libvirt/libvirt/-/issues/644
    %meson_configure \
        -Dchrdev_lock_files='/run/lock' \
        -Ddriver_interface=enabled \
        -Ddriver_libvirtd=enabled \
        -Ddriver_network=enabled \
        -Ddriver_qemu=enabled \
        -Dfirewalld=enabled \
        -Dfirewall_backend_priority=iptables,nftables \
        -Dinit_script='systemd' \
        -Drunstatedir='/run' \
        -Dselinux=disabled \
        -Dstorage_zfs=disabled
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING COPYING.LESSER

    # Install sysusers and tmpfiles, overriding the files that libvirt ships
    %install_file ${pkgfiles}/libvirt.sysusers ${installdir}/usr/lib/sysusers.d/libvirt-qemu.conf
    %install_file ${pkgfiles}/libvirt.tmpfiles ${installdir}/usr/lib/tmpfiles.d/libvirt.conf

    rm -v ${installdir}/usr/lib/sysusers.d/libvirt{,-login-shell}.conf

    # Custom polkit rules
    rm -fv ${installdir}/usr/share/polkit-1/rules.d/50-libvirt.rules
    %install_file ${pkgfiles}/org.libvirt.rules ${installdir}/usr/share/polkit-1/rules.d/org.libvirt.rules

    rm -rf ${installdir}/usr/share/doc

    %install_file -t ${installdir}/%libdir%/systemd/system-preset/ ${pkgfiles}/20-libvirt.preset

    # Fix virt-secret-init-encryption.service not starting because of a missing directory
    %install_file ${pkgfiles}/virt-secret-init-encryption.service \
        ${installdir}/usr/lib/systemd/system/virt-secret-init-encryption.service.d/50-create-dir.conf

    # Stateless
    rm -rfv ${installdir}/run \
            ${installdir}/var
