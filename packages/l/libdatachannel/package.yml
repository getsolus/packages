# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libdatachannel
version    : 0.24.8
release    : 3
source     :
    - https://github.com/paullouisageneau/libdatachannel/archive/refs/tags/v0.24.8.tar.gz : d2c982fec0c820dd7e640d7ddafc3b3b62e6cefd9d95915d9297aa36d0a1854b
homepage   : https://libdatachannel.org/
license    : MPL-2.0
component  : programming.library
summary    : C/C++ WebRTC network library featuring Data Channels, Media Transport, and WebSockets
description: |
    libdatachannel is a standalone implementation of WebRTC Data Channels, WebRTC Media Transport, and WebSockets in C++17 with C bindings for POSIX platforms (including GNU/Linux, Android, FreeBSD, Apple macOS and iOS) and Microsoft Windows. WebRTC is a W3C and IETF standard enabling real-time peer-to-peer data and media exchange between two devices.
builddeps  :
    - pkgconfig(libsrtp2)
    - pkgconfig(openssl)
    - pkgconfig(usrsctp)
    - libjuice-devel
    - plog
clang      : true
setup      : |
    %cmake_ninja \
        -DPREFER_SYSTEM_LIB=ON \
        -DNO_EXAMPLES=ON
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE
check      : |
    export PATH="$PATH:/usr/sbin"
    # provide a dummy interface for the tests to use.
    ip link add dtls0 type dummy
    ip addr add 192.0.2.1/24 dev dtls0
    ip link set dtls0 up

    ${workdir}/solusBuildDir/tests
