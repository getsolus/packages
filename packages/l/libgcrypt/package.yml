# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libgcrypt
version    : 1.12.3
release    : 33
source     :
    - https://gnupg.org/ftp/gcrypt/libgcrypt/libgcrypt-1.12.3.tar.bz2 : 98d1b0b3202d2b03fa754a35aa3cbbfcf526a3260d8d2ee213748001b1043006
license    :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
component  : system.base
homepage   : https://gnupg.org/software/libgcrypt/index.html
summary    : GNU's basic cryptographic library
description: |
    Libgcrypt is GNU's basic cryptographic library.
emul32     : true
optimize   :
    - size
    - lto
patterns   :
    - devel : /usr/share/aclocal
builddeps  :
    - pkgconfig32(gpg-error)
setup      : |
    %configure --with-gpg-error-prefix=/usr \
               --enable-noexecstack
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING COPYING.LIB LICENSES
check      : |
    %make check
