# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : labwc
version    : 0.20.3
release    : 21
source     :
    - https://github.com/labwc/labwc/archive/refs/tags/0.20.3.tar.gz : 1e70a5b74f149c5b47da76063dbdf967c44b2d7b6e94d3fdf65f70fc252f65c9
homepage   : https://labwc.github.io/
license    : GPL-2.0-or-later
component  : desktop
summary    :
    - Labwc is a window-stacking compositor for wayland
    - session : Labwc session
description:
    - Labwc is a wlroots-based window-stacking compositor for wayland, inspired by openbox.
    - session : Labwc session
builddeps  :
    - pkgconfig(cairo)
    - pkgconfig(glib-2.0)
    - pkgconfig(libinput)
    - pkgconfig(libpng)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libsfdo-basedir)
    - pkgconfig(libxml-2.0)
    - pkgconfig(pango)
    - pkgconfig(scdoc)
    - pkgconfig(wayland-protocols)
    - pkgconfig(wayland-server)
    - pkgconfig(wlroots-0.20)
    - pkgconfig(xkbcommon)
    - pkgconfig(xwayland)
rundeps    :
    - session :
        - alacritty
        - labwc
        - swaybg
        - swayidle
        - swaylock
        - waybar
    - xdg-desktop-portal-wlr
    - xorg-xwayland
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %meson_configure \
        --wrap-mode=nodownload
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSE
patterns   :
    - session :
        - /usr/share/icons
        - /usr/share/wayland-sessions/labwc.desktop
        - /usr/lib/systemd/user/labwc-session.target
