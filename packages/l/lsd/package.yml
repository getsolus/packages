# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : lsd
version    : 1.2.0
release    : 19
source     :
    - https://github.com/lsd-rs/lsd/archive/v1.2.0/lsd-1.2.0.tar.gz : dae8d43087686a4a1de0584922608e9cbab00727d0f72e4aa487860a9cbfeefa
homepage   : https://github.com/lsd-rs/lsd
license    : Apache-2.0
component  : system.utils
summary    : The next generation ls command
description: |
    The next generation ls command with a lot of pretty colors and icons.
networking : true
builddeps  :
    - pandoc
    - rust
rundeps    :
    # TODO: We might want to package https://github.com/gabrielelana/awesome-terminal-fonts
    # for this instead.
    - font-awesome-otf
setup      : |
    %cargo_fetch
build      : |
    export SHELL_COMPLETIONS_DIR=completions
    %cargo_build

    pandoc "doc/lsd.md" --standalone --to=man -o "doc/lsd.1"
install    : |
    %cargo_install
    %install_license LICENSE

    %install_file completions/_lsd -t ${installdir}/usr/share/zsh/site-functions
    %install_file completions/lsd.bash ${installdir}/usr/share/bash-completion/completions/lsd
    %install_file completions/lsd.fish -t ${installdir}/usr/share/fish/vendor_completions.d

    %install_file doc/lsd.1 -t ${installdir}/usr/share/man/man1
#check      : |
#    cargo test
