# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libp11
version    : 0.4.21
release    : 6
source     :
    - https://github.com/OpenSC/libp11/releases/download/libp11-0.4.21/libp11-0.4.21.tar.gz : efdb523aef8613d447e6a2d38227d4b389866f4bcf4b503130acd7f759490847
homepage   : https://github.com/OpenSC/libp11
license    : LGPL-2.1-or-later
component  : programming.devel
summary    : PKCS#11 wrapper library
description: |
    The PKCS#11 API is an abstract API to perform operations on cryptographic objects such as private keys, without requiring access to the objects themselves.
builddeps  :
    - pkgconfig(libssl)
    - pkgconfig(p11-kit-1)
setup      : |
    %configure --enable-static=no
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
check      : |
    %make check
