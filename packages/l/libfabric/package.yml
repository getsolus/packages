# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libfabric
version    : 2.6.0
release    : 5
source     :
    - https://github.com/ofiwg/libfabric/releases/download/v2.6.0/libfabric-2.6.0.tar.bz2 : 1ee2ab6eb16462c0fe7a836f9df52b8f12309dfee3f3774aa93a86f521a8e8b1
homepage   : https://ofiwg.github.io/libfabric/
license    :
    - BSD-2-Clause
    - GPL-2.0-only
component  : programming.library
summary    : Open Fabric Interfaces
description: |
    The Open Fabrics Interfaces (OFI) is a framework focused on exporting fabric communication services to applications.
