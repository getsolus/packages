# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libxtst
version    : 1.2.6
release    : 16
source     :
    - https://www.x.org/releases/individual/lib/libXtst-1.2.6.tar.gz : f30f2d4f8370077de9f35220a539bf34c042ca02a55669a4d8f345c661ce7839
homepage   : https://www.x.org/
license    : MIT
component  : xorg.library
summary    : X11 Testing -- Record extension library
description: |
    libXtst provides an X Window System client interface to the Record extension to the X protocol.
emul32     : true
optimize   :
    - speed
builddeps  :
    - pkgconfig32(x11)
    - pkgconfig32(xext)
    - pkgconfig32(xi)
    - pkgconfig(xproto)
setup      : |
    %configure \
        --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
