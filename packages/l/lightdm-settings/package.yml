# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : lightdm-settings
version    : 2.1.1
release    : 27
source     :
    - https://github.com/linuxmint/lightdm-settings/archive/refs/tags/2.1.1.tar.gz : 8a7a394ab30703fad32cf4073ff4f3f4e8c585d4cdd7877e1d8f2945724263b8
homepage   : https://github.com/linuxmint/lightdm-settings
license    : GPL-3.0-or-later
component  : desktop.gtk
summary    : A configuration tool for the LightDM display manager
description: |
    A configuration tool for the LightDM display manager. This tool currently lets users configure slick-greeter.
rundeps    :
    - hicolor-icon-theme
    - python-packaging
    - python-setproctitle
    - slick-greeter
build      : |
    %make
install    : |
    %install_dir ${installdir}
    %install_license COPYING

    cp -arv --no-preserve=ownership usr ${installdir}/

    %install_file ${pkgfiles}/lightdm-gtk-greeter.conf ${installdir}/etc/lightdm/lightdm.conf
