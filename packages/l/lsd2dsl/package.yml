# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : lsd2dsl
version    : 0.6.0
release    : 7
source     :
    - https://github.com/nongeneric/lsd2dsl/archive/refs/tags/v0.6.0.tar.gz : f5176331b9f8d663cfb9e459a94052a9800a445b9e2aaf1dd8bde1a8e0f541ca
homepage   : https://rcebits.com/lsd2dsl/index.html
license    : MIT
component  : programming.tools
summary    : Lingvo dictionaries decompiler
description: |
    ABBYY Lingvo dictionaries decompiler.
builddeps  :
    - pkgconfig(Qt6Core5Compat)
    - pkgconfig(Qt6Pdf)
    - pkgconfig(Qt6WebEngineCore)
    - pkgconfig(fmt)
    - pkgconfig(gtest)
    - pkgconfig(sndfile)
    - pkgconfig(vorbisfile)
    - libboost-devel
setup      : |
    # Backport upstream build fixes
    %patch -p1 -i ${pkgfiles}/lsd2dsl-0.6.0-add-missing-includes.patch

    export CFLAGS="$CFLAGS -Wno-unused-result" CXXFLAGS="$CXXFLAGS -Wno-unused-result"
    %cmake_ninja \
        -DENABLE_DUDEN=0
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE

    # Fix the install paths
    %install_dir ${installdir}/usr/bin
    mv ${installdir}/lsd2dsl \
       ${installdir}/lsd2dsl-qtgui \
       ${installdir}/usr/bin/
