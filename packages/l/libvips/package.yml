# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libvips
version    : 8.18.8
release    : 68
source     :
    - https://github.com/libvips/libvips/archive/refs/tags/v8.18.8.tar.gz : d76c94c89b4b581e0521e03f3a95ebf97c73d1a122689dfe2c83119849086b2e
homepage   : https://www.libvips.org/
license    : LGPL-2.1-or-later
component  :
    - multimedia.library
    - doc : programming.docs
summary    :
    - A fast image processing library with low memory needs
    - doc : Documentation for libvips
description: |
    libvips is a demand-driven, horizontally threaded image processing library. Compared to similar libraries, libvips runs quickly and uses little memory.
builddeps  :
    - pkgconfig(ImageMagick)
    - pkgconfig(OpenEXR)
    - pkgconfig(cfitsio)
    - pkgconfig(fftw3)
    - pkgconfig(gi-docgen)
    - pkgconfig(lcms2)
    - pkgconfig(libarchive)
    - pkgconfig(libexif)
    - pkgconfig(libheif)
    - pkgconfig(libjxl)
    - pkgconfig(libpng)
    - pkgconfig(libraw)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libtiff-4)
    - pkgconfig(libturbojpeg)
    - pkgconfig(libuhdr)
    - pkgconfig(libwebp)
    - pkgconfig(pangoft2)
    - pkgconfig(poppler-glib)
    - giflib-devel
setup      : |
    %meson_configure \
        -Ddocs=true
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSE
check      : |
    %meson_test
patterns   :
    - doc : /usr/share/doc/
