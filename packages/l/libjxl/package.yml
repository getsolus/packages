# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libjxl
version    : 0.13.0
release    : 13
source     :
    - https://github.com/libjxl/libjxl/archive/refs/tags/v0.13.0.tar.gz : 24d18c9af2d1f5a17730b3f8d3f70a5c16e5ac303f5d9d5fe9dc00cf7ca82af2
    - git|https://skia.googlesource.com/skcms.git : 96d9171c94b937a1b5f0293de7309ac16311b722
    - https://github.com/webmproject/sjpeg/archive/dd4d9857c58a25713711a46d37385ad23ca2177e.tar.gz#sjpeg.tar.gz : 94ee1d632b32ed9a1487afde078705fdf5772e8f1f54d80e7cb283b8f0ef8a95
    # Test data. Keep this in sync with the commit expected by the version tag
    - git|https://github.com/libjxl/testdata.git : 73695d303670c90e4d506ea89d9901b081385089
homepage   : https://jpeg.org/jpegxl
license    : BSD-3-Clause
component  : multimedia.codecs
summary    :
    - JPEG XL reference implementation
    - utils : JPEG XL reference implementation - Utilities
description: |
    JPEG XL offers significantly better image quality and compression ratios than legacy JPEG
builddeps  :
    - pkgconfig(OpenEXR)
    - pkgconfig(glut)
    - pkgconfig(lcms2)
    - pkgconfig(libbrotlicommon)
    - pkgconfig(libglvnd)
    - pkgconfig(libhwy)
    - pkgconfig(libjpeg)
    - pkgconfig(libpng)
    - asciidoc
    - doxygen
    - giflib-devel
checkdeps  :
    - pkgconfig(gtest)
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    rm -rfv third_party/skcms && cp -a ${sources}/skcms.git third_party/skcms
    rm -rfv testdata && cp -a ${sources}/testdata.git testdata
    tar -xf ${sources}/sjpeg.tar.gz -C third_party/sjpeg --strip-components 1

    %cmake_ninja \
        -DBUILD_SHARED_LIBS=ON \
        -DJPEGXL_ENABLE_BENCHMARK=OFF \
        -DJPEGXL_ENABLE_PLUGINS=ON \
        -DJPEGXL_BUNDLE_LIBPNG=OFF \
        -DJPEGXL_FORCE_SYSTEM_BROTLI=ON \
        -DJPEGXL_FORCE_SYSTEM_GTEST=ON \
        -DJPEGXL_FORCE_SYSTEM_HWY=ON \
        -DJPEGXL_VERSION=$version
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE
check      : |
    %cmake_test
patterns   :
    - utils :
        - /usr/bin/
        - /usr/share/man/man1

# Todo: Package GIMP plugin, not packaged currently due to it adding gimp as a dependency to this package
# Todo: Split out the gdk-pixbuf loader into a GNOME/Budgie specific package. 
# Both of these require a smarter dependency management system.
