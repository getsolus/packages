# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libopenshot-audio
version    : 1.0.1
release    : 19
source     :
    - https://github.com/OpenShot/libopenshot-audio/archive/refs/tags/v1.0.1.tar.gz : cedfa1edfe29d4e3982e84ccd28dfd62dd15bbcfa4a5fffb40c7a4981d395e55
homepage   : https://github.com/openshot/libopenshot-audio
license    : GPL-3.0-or-later
component  : multimedia.library
summary    : A high-quality audio editing and playback library used by libopenshot.
description: |
    A high-quality audio editing and playback library used by libopenshot.
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(freetype2)
    - pkgconfig(xcursor)
    - pkgconfig(xinerama)
    - pkgconfig(xrandr)
    - doxygen
setup      : |
    %cmake_ninja \
        -DENABLE_AUDIO_DOCS=OFF \
        -DLIB_SUFFIX=%LIBSUFFIX% .
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
patterns   :
    - devel :
        - /usr/bin/
        - /usr/share/man/
