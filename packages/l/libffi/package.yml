# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libffi
version    : 3.8.2
release    : 17
source     :
    - https://github.com/libffi/libffi/releases/download/v3.8.2/libffi-3.8.2.tar.gz : a699fda2b090c4b46cb79cf60c4dacfce480eb05742c0de66acf3af174a47f92
homepage   : https://sourceware.org/libffi
license    : MIT
component  : system.base
summary    : Foreign Function Interface library
description: |
    The libffi library provides a portable, high level programming interface to various calling conventions. This allows a programmer to call any function specified by a call interface description at run time.
emul32     : true
devel      : true
builddeps  :
    - dejagnu-devel
setup      : |
    %configure_no_runstatedir --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license LICENSE LICENSE-BUILDTOOLS
check      : |
    %make check
patterns   :
    - devel :
        - /usr/share/info
