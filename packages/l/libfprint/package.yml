# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libfprint
version    : 1.94.100
release    : 11
source     :
    - https://gitlab.freedesktop.org/libfprint/libfprint/-/archive/v1.94.100/libfprint-v1.94.100.tar.bz2 : ee5d07aa6c0acd8465b5b1b8b9d7bd96d4ce459d4091abc2c2656e876b7cfa52
homepage   : https://fprint.freedesktop.org/
license    : LGPL-2.1-or-later
component  : desktop.library
summary    : Library for fingerprint readers
description: |
    libfprint is an open source software library designed to make it easy for application developers to add support for consumer fingerprint readers to their software.
builddeps  :
    - pkgconfig(cairo)
    - pkgconfig(gtk-doc)
    - pkgconfig(gudev-1.0)
    - pkgconfig(gusb)
    - pkgconfig(libcrypto)
    - pkgconfig(pixman-1)
    - python-cairo
    - python-gobject
    - umockdev
setup      : |
    %meson_configure -Ddrivers=all -Dinstalled-tests=false
build      : |
    %ninja_build
install    : |
    %install_license COPYING
    %ninja_install
check      : |
    # work around for buildserver
    %ninja_check ||:
