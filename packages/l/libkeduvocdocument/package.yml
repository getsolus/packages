# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libkeduvocdocument
version    : 26.08.1
release    : 102
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/libkeduvocdocument-26.08.1.tar.xz : 2928b62af21d08de2f4ffd5efe055e007b321bf2c675045b6defb6799097898e
homepage   : https://kde.org/
license    :
    - BSD-1-Clause
    - GFDL-1.2-or-later
    - GPL-2.0-or-later
component  : desktop.library
summary    : Library to parse, convert, and manipulate KVTML files
description: |
    Contains KEduVocDocument and its related class for reading from/writing to the KVTML format (and others too).
builddeps  :
    - pkgconfig(Qt6Core)
    - kf6-karchive-devel
    - kf6-kio-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
