# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libglib-testing
version    : 0.2.0
release    : 1
source     :
    - https://gitlab.gnome.org/pwithnall/libglib-testing/-/archive/0.2.0/libglib-testing-0.2.0.tar.gz : f5110420ad3f03156e237357996365a9f2a8b48ac00a9c99a2fd221cc1d16a4c
homepage   : https://gitlab.gnome.org/pwithnall/libglib-testing
license    : LGPL-2.1-or-later
component  : programming.library
summary    : libglib-testing is a test library providing test harnesses and mock classes which complement the classes provided by GLib
description: |
    libglib-testing is a test library providing test harnesses and mock classes
    which complement the classes provided by GLib. It is intended to be used by
    any project which uses GLib and which wants to write internal unit tests.

    libglib-testing is a separate project from GLib itself for two reasons:
        • To allow unstable API to be prototyped before being stabilised.
        • To keep test harness API out of libglib, since it should only be needed
          at test time, not at runtime.
builddeps  :
    - pkgconfig(glib-2.0)
    - gtk-doc
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
