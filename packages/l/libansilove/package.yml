# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libansilove
version    : 1.4.2
release    : 9
source     :
    - https://github.com/ansilove/libansilove/archive/refs/tags/1.4.2.tar.gz : 8bd4d0775ff558aacfebd7e7e284baa96d781183bf767283bf8410f44a2e2434
homepage   : https://www.ansilove.org
license    : BSD-2-Clause
component  : programming.library
summary    : Library for converting ANSI, ASCII, and other formats to PNG
description: |
    libansilove is a library to convert ANSi and artscene related file formats into PNG images.
builddeps  :
    - pkgconfig(gdlib)
setup      : |
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %install_license LICENSE
    %ninja_install

    # remove static library
    rm -rf $installdir/%libdir%/libansilove-static.a
