# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libpcap
version    : 1.11.1
release    : 18
source     :
    - https://github.com/the-tcpdump-group/libpcap/archive/refs/tags/libpcap-1.11.1.tar.gz : 4fb439513073b4f33c7b7f5fe0a6c48d4d381f1272b22088dedd5f60e501d984
homepage   : https://www.tcpdump.org
license    : BSD-3-Clause
component  : system.utils
summary    : A system-independent interface for user-level packet capture
description: |
    libpcap is a library that provides a high level interface
    to packet capture systems. It is capable of accessing all packets
    the network, including those destined for other hosts.
emul32     : true
builddeps  :
    - pkgconfig32(libnl-3.0)
    - pkgconfig(bluez)
    - pkgconfig(dbus-1)
    - bison-32bit-devel
    - flex-32bit-devel
environment: |
    export PKG_CONFIG_PATH=%libdir%/pkgconfig
setup      : |
    if [[ ! -z "${EMUL32BUILD}" ]]; then
        disable_dbus="ON"
    else
        disable_dbus="OFF"
    fi

    set -x
    sed -i 's| lib/pkgconfig| ${CMAKE_INSTALL_LIBDIR}/pkgconfig|g' CMakeLists.txt
    %cmake_ninja \
        -DINET6=ON \
        -DDISABLE_DBUS=${disable_dbus} \
        -DCMAKE_POSITION_INDEPENDENT_CODE=ON
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE

    rm -v ${installdir}/%libdir%/*.a
patterns   :
    - devel :
        - /usr/bin/pcap-config
        - /usr/share/man/man1/pcap-config*
        - /usr/share/man/man5
