# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libp11-kit
version    : 0.26.5
release    : 24
source     :
    - https://github.com/p11-glue/p11-kit/releases/download/0.26.5/p11-kit-0.26.5.tar.xz : f2cc09111e44bf3fea58f023180b33acea90aa82d042d6fbb623fbc5ba033bb7
homepage   : https://p11-glue.github.io/p11-glue/p11-kit.html
license    : GPL-2.0-or-later
component  : security.crypto
summary    : The p11-kit package Provides a way to load and enumerate PKCS#11 (a Cryptographic Token Interface Standard) modules
description: |
    The p11-kit package Provides a way to load and enumerate PKCS #11 (a Cryptographic Token Interface Standard) modules.
emul32     : true
builddeps  :
    - pkgconfig32(libffi)
    - pkgconfig32(libtasn1)
    - pkgconfig(libsystemd)
    - libtasn1-utils
setup      : |
    exOpts=""
    if [[ ! -z "${EMUL32BUILD}" ]]; then
        exOpts="-Dsystemd=disabled"
    fi

    %meson_configure \
        -Dsystem_config="/usr/share/defaults/pkcs11" \
        -Duser_config="/etc/pkcs11" \
        -Dtrust_paths=/etc/ca-certificates/trust-source:/usr/share/ca-certificates/trust-source \
        $exOpts
build      : |
    %ninja_build
install    : |
    %ninja_install

    # Only need to do the rest for the 64-bit package
    if [[ "${EMUL32BUILD}" ]]; then
        exit 0
    fi
    
    %install_license COPYING

    %tmpfiles "# Create /etc/pkcs11 directory"
    %tmpfiles "d /etc/pkcs11 0755 - - -"
check      : |
    %ninja_check
