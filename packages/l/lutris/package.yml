# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : lutris
version    : 0.5.22
release    : 89
source     :
    - https://github.com/lutris/lutris/archive/refs/tags/v0.5.22.tar.gz : 1001b215d68c7e450b74bcf11510adb3ac60074ed46d5a160eb851bafcc14c3c
    - git|https://github.com/bartok765/galaxy_blizzard_plugin.git : 83cfb024ebc00cbc71702f101671bea596cfc96f
homepage   : https://lutris.net/
license    :
    - GPL-3.0-or-later
    - MIT
component  : games
summary    : Install and play any video game easily
description: |
    Lutris is a gaming platform for GNU/Linux. Its goal is to make gaming on Linux as easy as possible by taking care of installing and setting up the game for the user. The only thing you have to do is play the game. It aims to support every game that is playable on Linux.
builddeps  :
    - pkgconfig(protobuf)
rundeps    :
    - cabextract
    - gamemode-32bit
    - libgnome-keyring
    - libwebkit-gtk41
    - mangohud
    - python-cairo
    - python-distro
    - python-evdev
    - python-gobject
    - python-lxml
    - python-magic
    - python-moddb
    - python-pillow
    - python-protobuf
    - python-requests
    - pyyaml
    - wine
setup      : |
    cp -a ${sources}/galaxy_blizzard_plugin.git ${workdir}/galaxy_blizzard_plugin

    # Regenerate protos to fix BattleNet plugin
    # See https://gitlab.archlinux.org/archlinux/packaging/packages/lutris/-/issues/4
    # And https://github.com/lutris/lutris/issues/5659
    protoc --proto_path=galaxy_blizzard_plugin/src --python_out=. product_db.proto
    cp -vf product_db_pb2.py lutris/util/battlenet/product_db_pb2.py

    # Deprecated/removed attributes in GnomeDesktop
    # https://github.com/lutris/lutris/pull/6833
    %patch -p1 -i ${pkgfiles}/lutris-0.5.22-remove-deprecated-attributes-in-gnome-desktop.patch

    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSE
    %install_file galaxy_blizzard_plugin/LICENSE ${installdir}/usr/share/licenses/${package}/galaxy_blizzard_plugin-LICENSE
