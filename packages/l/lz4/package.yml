# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : lz4
version    : 1.11.0
release    : 21
source     :
    - https://github.com/lz4/lz4/archive/refs/tags/v1.11.0.tar.gz : 247e5fa64da5f7b75ee3dd3bed484076396c9ebe8254d9ccf693eb62800c5e26
homepage   : https://lz4.org/
license    :
    - BSD-2-Clause
    - GPL-2.0-or-later
component  : system.base
summary    : LZ4 commmand line tools
description: |
    LZ4 is a very fast lossless compression algorithm, providing compression speed at 400 MB/s per core, scalable with multi-cores CPU. It also features an extremely fast decoder, with speed in multiple GB/s per core, typically reaching RAM speed limits on multi-core systems.
clang      : true
setup      : |
    pushd build/meson
    %meson_configure -Dprograms=true \
                     -Dtests=true
build      : |
    pushd build/meson
    %ninja_build
install    : |
    %install_license LICENSE
    pushd build/meson
    %ninja_install
check      : |
    pushd build/meson
    %ninja_check
