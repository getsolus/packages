# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libnl
version    : 3.12.0
release    : 11
source     :
    - https://github.com/thom311/libnl/releases/download/libnl3_12_0/libnl-3.12.0.tar.gz : fc51ca7196f1a3f5fdf6ffd3864b50f4f9c02333be28be4eeca057e103c0dd18
homepage   : https://www.infradead.org/~tgr/libnl/
license    : LGPL-2.1-or-later
component  : network.base
summary    : a collection of libraries providing APIs to netlink protocol based Linux kernel interfaces.
description: |
    Netlink is a IPC mechanism primarily between the kernel and user space processes. It was designed to be a more flexible successor to ioctl to provide mainly networking related kernel configuration and monitoring interfaces.
clang      : true
emul32     : true
builddeps  :
    - glibc-32bit-devel
    - libgcc-32bit
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Stateless.patch

    %reconfigure --disable-static
build      : |
    %make
install    : |
    %make_install

    %install_file ${pkgfiles}/libnl.tmpfiles ${installdir}/usr/lib/tmpfiles.d/libnl.conf
    %install_license COPYING
