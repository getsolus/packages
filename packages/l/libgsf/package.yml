# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libgsf
version    : 1.14.60
release    : 20
source     :
    - https://download.gnome.org/sources/libgsf/1.14/libgsf-1.14.60.tar.xz : 83e12c36a099a8a7019bf425e2c24af66eeb2ef5874251e694431a07d9805dae
homepage   : https://gitlab.gnome.org/GNOME/libgsf
license    : LGPL-2.1-only
component  : desktop.library
summary    : Library providing I/O for structured file formats
description: |
    libgsf contains the library used for providing an extensible input/output abstraction layer for structured file formats within GNOME.
builddeps  :
    - pkgconfig(bzip2)
    - pkgconfig(gdk-pixbuf-2.0)
    - intltool
setup      : |
    %configure --disable-static
build      : |
    %make
install    : |
    %make_install
