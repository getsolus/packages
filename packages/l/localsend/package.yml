# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : localsend
version    : 1.18.2
release    : 4
source     :
    - https://github.com/localsend/localsend/archive/refs/tags/v1.18.2.tar.gz : 4425dfcf2e016d6540ea44941deb4ba6568201cc47d7f08753606e6e4b2769cd
    - https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.41.9-stable.tar.xz#flutter.tar.xz : cf2631dde02570733921a530f47a96abe896b5e334682d2743c29530ea88bb2e
homepage   : https://localsend.org/
license    : Apache-2.0
component  : network.download
summary    : Share files to nearby devices
description: |
    LocalSend is a free, open-source app that allows you to securely share files and messages with nearby devices over your local network without needing an internet connection.
networking : true
clang      : true # For Flutter
builddeps  :
    - pkgconfig(ayatana-appindicator-0.1)
    - pkgconfig(liblzma)
    - git
    - rustup
environment: |
    export PATH="$PATH:${sources}/flutter/bin"
    # error: 'app_indicator_new' is deprecated
    export CXXFLAGS="${CXXFLAGS} -Wno-deprecated-declarations"
setup      : |
    tar -xvf ${sources}/flutter.tar.xz -C ${sources}/
    # Flutter detects the version of itself through git
    git config --global --add safe.directory /home/build/YPKG/sources/flutter
build      : |
    pushd app
    flutter pub get --verbose
    flutter build linux --release --verbose
    popd
install    : |
    export LOCALSEND_DIR=/usr/share/localsend

    # GUI
    %install_dir ${installdir}/usr/share
    mv app/build/linux/x64/release/bundle ${installdir}/$LOCALSEND_DIR/

    # Binary
    %install_dir ${installdir}/usr/bin
    ln -sv $LOCALSEND_DIR/localsend_app ${installdir}/usr/bin/localsend

    # Desktop file, icons, appstream metainfo, and license
    %install_file ${pkgfiles}/org.localsend.localsend_app.desktop -t ${installdir}/usr/share/applications/
    for i in 32 128 256 512; do
        %install_file ${workdir}/app/assets/img/logo-${i}.png ${installdir}/usr/share/icons/hicolor/${i}x${i}/apps/org.localsend.localsend_app.png
    done
    %install_file ${workdir}/app/assets/img/logo-32-white.png ${installdir}/usr/share/icons/hicolor/32x32/apps/org.localsend.localsend_app-tray.png
    %install_file ${pkgfiles}/org.localsend.localsend_app.metainfo.xml -t ${installdir}/usr/share/metainfo/
    %install_license LICENSE
