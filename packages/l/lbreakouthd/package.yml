# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : lbreakouthd
version    : 1.2.4
release    : 11
source     :
    - https://sourceforge.net/projects/lgames/files/lbreakouthd/lbreakouthd-1.2.4.tar.gz : 4732c3852ba0030fecca65689591ac582c86af46b1a21b274640ffc6cd8fc826
homepage   : https://lgames.sourceforge.io/LBreakoutHD/
license    : GPL-3.0-or-later
component  : games.arcade
summary    : Arkanoid / Breakout alike game
description: |
    LBreakoutHD is a scaleable 16:9 remake of LBreakout2. You try to clear levels full of different types of bricks and extras by using your paddle to aim balls at the bricks.
builddeps  :
    - pkgconfig(SDL2_image)
    - pkgconfig(SDL2_mixer)
    - pkgconfig(SDL2_ttf)
setup      : |
    %configure
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
    # Install appstream metainfo and additional icon
    %install_file ${pkgfiles}/net.sourceforge.lgames.LBreakoutHD.metainfo.xml -t ${installdir}/usr/share/metainfo/
    %install_file ${pkgfiles}/lbreakouthd128.png ${installdir}/usr/share/icons/hicolor/128x128/apps/lbreakouthd.png
replaces   :
    - lbreakout2
    - dbginfo : lbreakout2-dbginfo
