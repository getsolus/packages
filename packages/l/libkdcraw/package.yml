# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libkdcraw
version    : 26.08.1
release    : 105
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/libkdcraw-26.08.1.tar.xz : cf49479043a75557f82b0213019c45291d612267e454b66d939f04b189c4f182
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - GPL-2.0-or-later
component  : multimedia.library
summary    : C++ interface to LibRaw
description: |
    Libkdcraw is a C++ interface around LibRaw library used to decode RAW picture files.
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(libraw)
    - extra-cmake-modules
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6 -DBUILD_WITH_QT6=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
