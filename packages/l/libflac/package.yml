# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libflac
version    : 1.5.0
release    : 19
source     :
    - https://github.com/xiph/flac/releases/download/1.5.0/flac-1.5.0.tar.xz : f2c1c76592a82ffff8413ba3c4a1299b6c7ab06c734dee03fd88630485c2b920
homepage   : https://xiph.org/flac/
license    :
    - BSD-3-Clause
    - GFDL-1.3-or-later
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
component  : multimedia.codecs
summary    : Encoder/decoder for the Free Lossless Audio Codec
description: |
    FLAC stands for Free Lossless Audio Codec, an audio format similar to MP3, but lossless, meaning that audio is compressed in FLAC without any loss in quality.
builddeps  :
    - pkgconfig32(ogg)
    - doxygen
    - glibc-32bit-devel
    - nasm
avx2       : true
emul32     : true
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    # Shorten tests
    sed -i 's/FLAC__TEST_LEVEL=1/FLAC__TEST_LEVEL=0/' test/CMakeLists.txt

    %cmake_ninja \
                 -DCMAKE_INSTALL_LIBDIR=%libdir% \
                 -DBUILD_SHARED_LIBS=ON
build      : |
    %ninja_build
install    : |
    %install_license COPYING.FDL COPYING.GPL COPYING.LGPL COPYING.Xiph
    %ninja_install

    # Save space as only want libFLAC.so*
    if [[ ! -z "${AVX2BUILD}" ]]; then
        rm -rf $installdir/%libdir%/libFLAC++.*
    fi
# Tests are broken when running as root.
#check      : |
    # Breaks libFLAC and libFLAC++ tests
    #unset LD_PRELOAD

    #CTEST_OUTPUT_ON_FAILURE=1 CTEST_STOP_ON_FAILURE=1 ninja test -j1 -C solusBuildDir
patterns   :
    - docs :
        - /usr/share/doc
