# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libxslt
version    : 1.1.45
release    : 16
source     :
    - https://download.gnome.org/sources/libxslt/1.1/libxslt-1.1.45.tar.xz : 9acfe68419c4d06a45c550321b3212762d92f41465062ca4ea19e632ee5d216e
homepage   : https://gitlab.gnome.org/GNOME/libxslt
license    : MIT
component  : system.base
emul32     : true
summary    : GNOME XSLT Library
description: |
    The libxslt package contains XSLT libraries used for extending libxml2 libraries to support XSLT files.
builddeps  :
    - pkgconfig32(gpg-error)
    - pkgconfig32(libgcrypt)
    - pkgconfig32(liblzma)
    - pkgconfig32(libxml-2.0)
    - pkgconfig32(zlib)
patterns   :
    - devel :
        - /usr/share/doc/
        - /usr/share/gtk-doc/
        - /usr/bin/xslt-config
        - /usr/share/man/man3/
setup      : |
    %reconfigure --disable-static --without-python
build      : |
    %make
install    : |
    %make_install
check      : |
    %make check
