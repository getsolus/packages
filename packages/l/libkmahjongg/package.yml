# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libkmahjongg
version    : 26.08.2
release    : 81
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/libkmahjongg-26.08.2.tar.xz : 5f5b592e54a3a2029307a3080ea98c9dad43f9ee45a356daf64965970eab91f1
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - GPL-2.0-or-later
component  : desktop.library
summary    : Common code and assets for Kmahjonhgg
description: |
    Library providing common code and assets for Kmahjonhgg.
builddeps  :
    - pkgconfig(Qt6Svg)
    - kf6-kconfig-devel
    - kf6-kconfigwidgets-devel
    - kf6-kcoreaddons-devel
    - kf6-ki18n-devel
    - kf6-kwidgetsaddons-devel
rundeps    :
    - devel :
        - kf6-kconfigwidgets-devel
        - qt6-base-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
