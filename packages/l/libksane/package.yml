# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libksane
version    : 26.08.1
release    : 89
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/libksane-26.08.1.tar.xz : 95281efd9a8754d152889958336deb9e16291ef77280bb29f8d48e9ed926fc07
homepage   : https://kde.org/
license    :
    - CC0-1.0
    - LGPL-2.1-only
    - LGPL-3.0-only
component  : desktop.library
summary    : SANE Library interface for KDE
description: |
    libKSane is an image scanning library that provides a QWidget containing all the logic needed to interface with a scanner.
builddeps  :
    - pkgconfig(Qt6Core)
    - kf6-ki18n-devel
    - kf6-ktextwidgets-devel
    - kf6-kwallet-devel
    - kf6-kwidgetsaddons-devel
    - ksanecore-devel
rundeps    :
    - sane-backends
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
