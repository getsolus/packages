# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libadwaita
version    : 1.10.0
release    : 43
source     :
    - https://download.gnome.org/sources/libadwaita/1.10/libadwaita-1.10.0.tar.xz : 
        b1bf56239269d101a6391ad4553c910eff9cc6170b803916405477ef60a66c84
homepage   : https://gnome.pages.gitlab.gnome.org/libadwaita/
license    : LGPL-2.1-or-later
component  : desktop.library
summary    : Building blocks for modern adaptive GNOME applications.
description: |
    Adwaita offers application developers many widgets and objects to build GNOME applications scaling from desktop workstations to mobile phones.
optimize   :
    - lto
builddeps  :
    - pkgconfig(appstream)
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(gtk4)
    - sassc
    - vala
setup      : |
    %meson_configure -Dexamples=false
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
#check      : |
#    %ninja_check
