# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libxmlb
version    : 0.3.29
release    : 15
source     :
    - https://github.com/hughsie/libxmlb/releases/download/0.3.29/libxmlb-0.3.29.tar.xz : 448294be33bfae62f00fa66e506f1cae80237ce71b7ab6530aefa75005eeb08a
homepage   : https://github.com/hughsie/libxmlb
license    :
    - LGPL-2.1-or-later
    - GPL-2.0-or-later
component  : programming.library
summary    : A library to help create and query binary XML blobs
description: |
    XML is slow to parse and strings inside the document cannot be memory mapped as they do not have a trailing NUL char. The libxmlb library takes XML source, and converts it to a structured binary representation with a deduplicated string table -- where the strings have the NULs included.
optimize   :
    - speed
    - lto
builddeps  :
    - pkgconfig(liblzma)
    - pkgconfig(libzstd)
    - libstemmer-devel
setup      : |
    %meson_configure \
        -Dgtkdoc=false \
        -Dstemmer=true
build      : |
    %ninja_build
profile    : |
    %ninja_check
    ./solusBuildDir/src/xb-tool compile test.xmlb /var/lib/eopkg/index/Solus/eopkg-index.xml.xz
    ./solusBuildDir/src/xb-tool dump test.xmlb
install    : |
    %ninja_install
check      : |
    %ninja_check
