# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libdrm
version    : 2.4.134
release    : 55
source     :
    - https://dri.freedesktop.org/libdrm/libdrm-2.4.134.tar.xz : ac5e74d157830eb8bee44c6a6bf3ad49774ef0dd2a72bdad74a8f20308b52a95
license    : MIT
component  : xorg.display
homepage   : https://dri.freedesktop.org/
summary    : Direct Rendering Manager API + Library
description: |
    libdrm provides core library routines for the X Window System to directly interface with video hardware using the Linux kernel's Direct Rendering Manager (DRM).
emul32     : true
optimize   : speed
builddeps  :
    - pkgconfig32(pciaccess)
    - pkgconfig(xorg-macros)
setup      : |
    %meson_configure -Dinstall-test-programs=true
build      : |
    %ninja_build
install    : |
    %ninja_install
check      : |
    %ninja_check
patterns   :
    - devel :
        - /usr/bin/*
