# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libical
version    : 4.0.4
release    : 25
source     :
    - https://github.com/libical/libical/releases/download/v4.0.4/libical-4.0.4.tar.gz : c851cdb46da5e6397881dafaa592c5516fb49da05dd1bb095f711a6d20eac422
homepage   : https://github.com/libical/libical
license    :
    - LGPL-2.1-only
    - MPL-2.0
component  : desktop.library
summary    : An implementation of the iCalendar protocols and data formats
description: |
    Libical is an Open Source implementation of the iCalendar protocols and protocol data units. The iCalendar specification describes how calendar clients can communicate with calendar servers so users can store their calendar data and arrange meetings with other users.
builddeps  :
    - pkgconfig(icu-i18n)
    - vala
setup      : |
    %cmake_ninja \
        -DCMAKE_INSTALL_LIBEXECDIR=lib64 \
        -DLIBICAL_GLIB_VAPI=True \
        -DLIBICAL_GOBJECT_INTROSPECTION=True \
        -DLIBICAL_GLIB_BUILD_DOCS=False \
        -DLIBICAL_JAVA_BINDINGS=False \
        -DLIB_SUFFIX=64
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING.LESSER.txt LICENSE.txt
