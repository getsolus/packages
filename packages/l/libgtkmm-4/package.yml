# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libgtkmm-4
version    : 4.24.0
release    : 7
source     :
    - https://download.gnome.org/sources/gtkmm/4.24/gtkmm-4.24.0.tar.xz : 7fd9cea356e7d3b74bf7d2a51d7e0e6763f3f9f1cddc5e77c8b0b5b7fa9d5e5a
homepage   : https://gtkmm.org
license    : LGPL-2.1-or-later
component  : desktop.gtk
summary    : C++ bindings to GTK+
description: |
    C++ bindings to GTK+
optimize   :
    - lto
builddeps  :
    - pkgconfig(epoxy)
    - pkgconfig(gtk4)
    - pkgconfig(pangomm-2.48)
patterns   :
    - devel : [/usr/lib64/g*]
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
