# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libfontenc
version    : 1.1.10
release    : 20
source     :
    - https://www.x.org/releases/individual/lib/libfontenc-1.1.10.tar.gz : 39ef163e175406a04858a144be1082d5eb9e060345490657f9e393b55be5dfff
homepage   : https://www.x.org/
license    : MIT
component  : xorg.library
summary    : X font encoding library
description: |
    libfontenc is a library which helps font libraries portably determine and deal with different encodings of fonts.
emul32     : true
builddeps  :
    - pkgconfig32(zlib)
    - pkgconfig(xproto)
setup      : |
    %configure  --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
