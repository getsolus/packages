# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : lapack
version    : 3.12.1
release    : 4
source     :
    - https://github.com/Reference-LAPACK/lapack/archive/refs/tags/v3.12.1.tar.gz : 2ca6407a001a474d4d4d35f3a61550156050c48016d949f0da0529c0aa052422
homepage   : https://www.netlib.org/lapack/
license    : BSD-3-Clause
component  : programming.library
optimize   :
    - speed
    - lto
avx2       : true
summary    : Basic Linear Algebra Subprograms
description: |
    Basic Linear Algebra Subprograms
builddeps  :
    - gfortran
setup      : |
    sed -e 's|/CMAKE/|/cmake/|' -i CBLAS/CMakeLists.txt
    mkdir build
    %cmake -B build \
           -DBUILD_TESTING=OFF \
           -DCMAKE_Fortran_COMPILER=gfortran \
           -DCMAKE_Fortran_FLAGS="-ffixed-line-length-none" \
           -DLAPACKE=ON \
           -DCBLAS=OFF \
           -DBUILD_DEPRECATED=ON \
           -DBUILD_SHARED_LIBS=ON
build      : |
    %make -C build
install    : |
    %install_license LICENSE
    %make_install -C build
