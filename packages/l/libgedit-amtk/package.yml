# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libgedit-amtk
version    : 5.11.0
release    : 6
source     :
    - https://gitlab.gnome.org/World/gedit/libgedit-amtk/-/archive/5.11.0/libgedit-amtk-5.11.0.tar.gz : 
        173c79288f8fff59f35863f117a1910aa0e9620e50378ca8d26da54d0a222a76
homepage   : https://gedit-technology.net/
license    : LGPL-3.0-or-later
component  : desktop.gnome
summary    : Actions, Menus and Toolbars Kit for GTK applications.
description: |
    Actions, Menus and Toolbars Kit for GTK applications.
builddeps  :
    - pkgconfig(gtk+-3.0)
    - gtk-doc
replaces   :
    - amtk
    - devel : amtk-devel
    - dbginfo : amtk-dbginfo
