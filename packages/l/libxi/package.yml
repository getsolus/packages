# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libxi
version    : 1.8.4
release    : 21
source     :
    - https://www.x.org/releases/individual/lib/libXi-1.8.4.tar.gz : 4d52f03b693cf3b32ae21701310cce34344ec8535f50d1667b1510a7083eca4a
homepage   : https://www.x.org/
license    : MIT
component  : xorg.library
summary    : X Input Extension Library
description: |
    libXi provides an X Window System client interface to the XINPUT extension to the X protocol. The Input extension allows setup and configuration of multiple input devices, and will soon allow hotplugging of input devices; to be added and removed on the fly.
emul32     : true
optimize   :
    - speed
builddeps  :
    - pkgconfig32(x11)
    - pkgconfig32(xext)
    - pkgconfig32(xfixes)
    - pkgconfig(inputproto)
setup      : |
    %configure \
        --prefix=/usr \
        --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
