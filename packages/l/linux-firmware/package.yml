# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : linux-firmware
version    : '20260910'
release    : 110
source     :
    - git|https://gitlab.com/kernel-firmware/linux-firmware.git : eeccccbe83daf22e1931e3557ba05b2c02427e4e
license    :
    - GPL-2.0-or-later
    - Distributable
component  : kernel
homepage   : https://git.kernel.org/?p=linux/kernel/git/firmware/linux-firmware.git;a=summary
summary    :
    - Firmware required for many devices
    - nvidia : Firmware required for many devices, Nvidia GSP firmware
description:
    - Free and non-free firmware required for enablement of many devices and hardware
    - nvidia : Firmware required for many devices, Nvidia GSP firmware
strip      : false
debug      : false
networking : true
builddeps  :
    - parallel
    - rdfind
rundeps    :
    - intel-microcode
    # 2025-02-26: At some point (perhaps 12 months after this post) we can remove these rundeps and ensure that they are instead installed by the installer
    # That would allow an end-user to remove firmware they don't need.
    - linux-firmware-amdgpu
    - linux-firmware-intel-graphics
    - linux-firmware-libertas
    - linux-firmware-mlxsw-spectrum
    - linux-firmware-qcom
setup      : |
    _backports=(
        # https://gitlab.freedesktop.org/drm/amd/-/work_items/5803
        # https://gitlab.freedesktop.org/drm/amd/-/work_items/5805
        # https://gitlab.freedesktop.org/drm/amd/-/work_items/5809
        a9f025fe99e7159c03879ff951e1a2a72686d884

        # https://gitlab.freedesktop.org/drm/amd/-/work_items/5615
        b167895782c55b31b199af021d41def5f69ad826
        bafc878828f7bec3383cdbb9257c53e9e6dbd048
        0d2ae4945d81e9811f676659edc31fa44c958e3c
        d7791ca498c22b1dd69b3f95578613d4163bda3d
        f027e6527d33a6a07af5518cd00ac5f95f70ace8
        eb58f6a2a5a3ee15a08593a162629c7b2cad4bd1
        26319976f210cd66b598c966ab9d78d65e67f4ac
        f960f2d0c65038d8ccc0d5f76ff993f1f07a40c6
        f30df53f0f0601642698999c0fc03bb0f47d4d51
        6762573523c6bce8e8d39ee4453b5507a6524660
        c7e90399bcad9340fd201c0cf53b608dd0598f31
        26899eccab832c02655c13df74cbd8ae9b7f9c17
        1aa2ae78637c162c6065dd4e47527f10ab99af96
        80be3dfc76233d847f50a8406d13fed2f2906921
        1e1716ff686ad271c54ebbc079309673b0c783e8
    )

    _reverts=(
    )

    for c in "${_backports[@]}"; do
        echo Backporting $(git log --oneline -1 "${c}")
        git cherry-pick -n "${c}"
    done

    for c in "${_reverts[@]}"; do
        echo Reverting $(git log --oneline -1 "${c}")
        git revert -n "${c}"
    done

#     git config --global user.email "solus@getsol.us"
#     git config --global user.name "Solus"

#     # https://lore.kernel.org/linux-firmware/87bjn6fgr6.fsf@gentoo.org/
#     git checkout 50bbf75a5c547e6e71c27b42ca9472a85eeb5ee4 -- mediatek/BT_RAM_CODE_MT7922_1_1_hdr.bin
#     git checkout 59df6ceeb259a81eb13cae36a44179981e95abde -- mediatek/WIFI_MT7922_patch_mcu_1_1_hdr.bin
#     git checkout 59df6ceeb259a81eb13cae36a44179981e95abde -- mediatek/WIFI_RAM_CODE_MT7922_1.bin
install    : |
    %make install-zst DESTDIR="$installdir" FIRMWAREDIR="/usr/lib64/firmware"

    # Remove blacklisted
    for i in airoha carl9170fw netronome liquidio powervr qed; do
        rm -rvf $installdir/usr/lib64/firmware/$i
    done

    # Exit if there are any absolute symlinks anywhere since those will mess things up
    pushd $installdir/
    ! find . -type l -lname '/*' -print | grep .
    popd

    # Usr-merge
    install -dm00755 $installdir/lib64
    pushd $installdir/usr
    dir_list=()
    while IFS=  read -r -d $'\0'; do
        dir_list+=("$REPLY")
    done < <(find lib64 -type d -print0)
    for file in "${dir_list[@]}"; do
        install -dm00755 "$installdir/$file"
    done

    file_list=()
    while IFS=  read -r -d $'\0'; do
        file_list+=("$REPLY")
    done < <(find lib64 -type f -print0)
    for file in "${file_list[@]}"; do
        ln -srv "$installdir/usr/$file" "$installdir/$file"
    done

    link_list=()
    while IFS=  read -r -d $'\0'; do
        link_list+=("$REPLY")
    done < <(find lib64 -type l -print0)
    for file in "${link_list[@]}"; do
        link=$(readlink "$file")
        ln -sv "$link" "$installdir/$file"
    done
    popd

    # Stick docs in
    %install_license LICENSES/*
    %install_license WHENCE
patterns   :
    - amdgpu :
        - /lib64/firmware/amdgpu
        - /lib64/firmware/amdnpu
        - /lib64/firmware/radeon
        - /usr/lib64/firmware/amdgpu
        - /usr/lib64/firmware/amdnpu
        - /usr/lib64/firmware/radeon
        - /usr/share/licenses/linux-firmware/LICENSE.amdgpu
        - /usr/share/licenses/linux-firmware/LICENSE.amdnpu
        - /usr/share/licenses/linux-firmware/LICENSE.radeon
    - intel-graphics :
        - /lib64/firmware/i915
        - /lib64/firmware/intel/ipu
        - /lib64/firmware/intel/irci_*
        - /lib64/firmware/intel/vsc
        - /lib64/firmware/xe
        - /usr/lib64/firmware/i915
        - /usr/lib64/firmware/intel/ipu
        - /usr/lib64/firmware/intel/irci_*
        - /usr/lib64/firmware/intel/vsc
        - /usr/lib64/firmware/xe
        - /usr/share/licenses/linux-firmware/LICENSE.i915
    - libertas : # Fedora has this additionally split into a mrvlprestera firmware package, maybe we want that?
        - /lib64/firmware/libertas
        - /lib64/firmware/mrvl
        - /usr/lib64/firmware/libertas
        - /usr/lib64/firmware/mrvl
        - /usr/share/licenses/linux-firmware/LICENCE.Marvell
        - /usr/share/licenses/linux-firmware/LICENCE.OLPC
    - mlxsw-spectrum :
        - /lib64/firmware/mellanox
        - /usr/lib64/firmware/mellanox
    - nvidia :
        - /lib64/firmware/nvidia/ad*/gsp
        - /lib64/firmware/nvidia/ga*/gsp
        - /lib64/firmware/nvidia/tu*/gsp
        - /usr/lib64/firmware/nvidia/ad*/gsp
        - /usr/lib64/firmware/nvidia/ga*/gsp
        - /usr/lib64/firmware/nvidia/tu*/gsp
        - /usr/share/licenses/linux-firmware/LICENCE.nvidia
    - qcom :
        - /lib64/firmware/qcom
        - /usr/lib64/firmware/qcom
        - /usr/share/licenses/linux-firmware/LICENSE.qcom
        - /usr/share/licenses/linux-firmware/LICENSE.qcom-2
        - /usr/share/licenses/linux-firmware/LICENSE.qcom_yamato
