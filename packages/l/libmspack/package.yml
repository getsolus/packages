# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libmspack
version    : '0.12'
release    : 13
source     :
    - https://github.com/kyz/libmspack/archive/refs/tags/v1.12.tar.gz : e9941cbfdab991af2afdd16ac746d3e194012838d81c80ce14d6a61bc69f78ce
homepage   : https://www.cabextract.org.uk/libmspack/
license    : LGPL-2.1-or-later
component  : programming.library
summary    : A library for Microsoft compression formats
description: |
    libmspack is a portable library for some loosely related Microsoft compression formats
setup      : |
    cd libmspack
    %autogen --disable-static
build      : |
    cd libmspack
    %make -j1
install    : |
    cd libmspack
    %make_install
    %install_license COPYING.LIB
