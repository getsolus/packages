# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : leocad
version    : '26.09'
release    : 10
source     :
    - https://github.com/leozide/leocad/archive/refs/tags/v26.09.tar.gz : 01c78e274cb2e3d496d6e904333f1cff88afb94929b5c9c7eb42bc018f3a530b
    - https://github.com/leozide/leocad/releases/download/v26.09/Library-26.08.zip : 7cddc89e0437555c317a0e663df73b0e73da2297939eebf8a199308ddad5ed76
homepage   : https://www.leocad.org/
license    :
    - CC-BY-2.0        # LDraw Library
    - GPL-2.0-or-later
component  : multimedia.graphics
summary    : CAD application for creating virtual LEGO models
description: |
    LeoCAD is a CAD program for creating virtual LEGO models. It has an intuitive interface, designed to allow new users to start creating new models without having to spend too much time learning the application.
clang      : true
builddeps  :
    - pkgconfig(Qt6UiTools)
setup      : |
    unzip ${sources}/Library-26.08.zip # Check Me
    qmake6 DISABLE_UPDATE_CHECK=1 LDRAW_LIBRARY_PATH=/usr/share/leocad leocad.pro
build      : |
    %make
install    : |
    %make_install INSTALL_ROOT=${installdir}

    # Install LDraw library
    %install_file library.bin -t ${installdir}/usr/share/leocad
    # Remove unnecessary files
    rm -rf ${installdir}/usr/share/doc
 
    %install_license docs/COPYING.txt
