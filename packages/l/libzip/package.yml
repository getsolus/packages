# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libzip
version    : 1.12.1
release    : 23
source     :
    - https://libzip.org/download/libzip-1.12.1.tar.xz : c40062022a1963c80573d48f6070792297cecd7c6bffe3aefcac0d8b9bee8913
homepage   : https://libzip.org/
license    : BSD-3-Clause
component  : programming.library
summary    : libzip is a C library for reading, creating, and modifying zip archives
description: |
    libzip is a C library for reading, creating, and modifying zip archives.
mancompress: true
builddeps  :
    - pkgconfig(bzip2)
    - pkgconfig(libcrypto)
    - pkgconfig(liblzma)
    - pkgconfig(libzstd)
setup      : |
    %cmake_ninja -DBUILD_REGRESS=OFF \
                 -DDOCUMENTATION_FORMAT=man \
                 -DENABLE_GNUTLS=OFF \
                 -DENABLE_MBEDTLS=OFF \
                 -DENABLE_OPENSSL=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
# TODO package nihtest so that we can run the testsuite (needs -DBUILD_REGRESS=ON)
# check      : |
#     %ninja_check
