# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : llvm-bolt
version    : 23.1.0
release    : 11
source     :
    - https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/llvm-project-23.1.0.src.tar.xz : ab1f0e3ec52448c33e8782eaf0422504b87c7b016b22514653ee0d8fcee479ff
homepage   : https://github.com/llvm/llvm-project/blob/main/bolt/README.md
license    : Apache-2.0
component  : programming.tools
summary    : Binary Optimization and Layout Tool.
description: |
    BOLT is a post-link optimizer developed to speed up large applications. It achieves the improvements by optimizing application's code layout based on execution profile gathered by sampling profiler, such as Linux perf tool.
patterns   :
    - /usr/lib/libbolt_rt*.a
clang      : true
setup      : |
    %patch -p1 -i $pkgfiles/0001-bolt-Set-version-string.patch
    %patch -p1 -i $pkgfiles/0001-BOLT-Don-t-delete-jump-table-covering-fixed-PIC-indi.patch
    %patch -p1 -i $pkgfiles/support-updating-sht-compressed-debug-sections.patch
    %patch -p1 -i $pkgfiles/0001-BOLT-Ensure-runtime-is-built-with-uncompressed-debug.patch
    %patch -p1 -i $pkgfiles/0001-BOLT-X86-Add-missing-MOV8-instruction-cases-in-X86MC.patch
    %patch -p1 -i $pkgfiles/bolt-fix-relr-addends-for-non-zero-image.patch

    %cmake_ninja -S llvm \
        -DLLVM_INSTALL_UTILS=ON \
        -DBUILD_SHARED_LIBS:BOOL=OFF \
        -DLLVM_LINK_LLVM_DYLIB:BOOL=OFF \
        -DLLVM_ENABLE_PROJECTS="bolt" \
        -DLLVM_TARGETS_TO_BUILD="X86" \
build      : |
    %ninja_build bolt
install    : |
    DESTDIR=$installdir %ninja_build install-bolt
