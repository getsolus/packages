# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libthai
version    : 0.1.30
release    : 3
source     :
    - https://github.com/tlwg/libthai/releases/download/v0.1.30/libthai-0.1.30.tar.xz :
        ddba8b53dfe584c3253766030218a88825488a51a7deef041d096e715af64bdd
homepage   : https://linux.thai.net/projects/libthai
license    : LGPL-2.1-only
component  : desktop.library
summary    : Thai language support routines
description: |
    A set of Thai language support routines aimed to ease developers' tasks to incorporate Thai language support in their applications.
emul32     : true
builddeps  :
    - pkgconfig32(datrie-0.2)
setup      : |
    %configure --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
