# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libtorrent-rasterbar
version    : 2.0.15
release    : 50
source     :
    - https://github.com/arvidn/libtorrent/releases/download/v2.0.15/libtorrent-rasterbar-2.0.15.tar.gz : 5e2e79129823b7ea48721164c32b5aaf83d3fd733b5502100f6705b29f27bb02
homepage   : https://libtorrent.org/
license    : BSD-2-Clause
component  : programming
summary    : libtorrent is a C++ implementation of the BitTorrent protocol
description: |
    libtorrent is a C++ implementation of the BitTorrent protocol.
builddeps  :
    - pkgconfig(python3)
    - libboost-devel
    - libiconv-devel
    - python-setuptools
clang      : true
optimize   :
    - thin-lto
setup      : |
    %cmake_ninja \
        -Dpython-bindings=on \
        -Dpython-egg-info=on \
        -Dpython-install-system-dir=on
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING LICENSE
