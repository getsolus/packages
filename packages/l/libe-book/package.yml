# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libe-book
version    : 0.1.4
release    : 21
source     :
    - https://sourceforge.net/projects/libebook/files/libe-book-0.1.4/libe-book-0.1.4.tar.xz : 104b7e791b6632745898e9b6a0037b7540235771a4d8c3bde2c764466ad912f1
homepage   : https://sourceforge.net/projects/libebook/
license    : MPL-2.0
component  : programming.library
summary    : Library and tools for reading and converting e-book formats
description: |
    libe-book is a library and a set of tools for reading and converting various reflowable e-book formats.
builddeps  :
    - pkgconfig(cppunit)
    - pkgconfig(icu-i18n)
    - pkgconfig(liblangtag)
    - pkgconfig(librevenge-0.0)
    - gperf
    - libboost-devel
setup      : |
    %reconfigure --disable-werror
build      : |
    %make
install    : |
    %make_install
check      : |
    %make check
