# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libhunspell
version    : 1.7.6
release    : 14
source     :
    - https://github.com/hunspell/hunspell/releases/download/v1.7.6/hunspell-1.7.6.tar.gz : 9c650ace31d4d8cc1da925a9507c3de1d50f1a54857af2f72429f517d5d53467
homepage   : https://hunspell.github.io/
license    :
    - MPL-1.1
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
component  : office
summary    : Hunspell spelling checker
description: |
    Hunspell is a spell checker and morphological analyzer library and program designed for languages with rich morphology and complex word compounding or character encoding.
setup      : |
    %configure \
        --disable-static \
        --with-ui \
        --with-readline
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING*
    # Fix packages that put `-lhunspell` in their build systems without using the pkgconfig file
    pushd $installdir/%libdir%
    ln -s libhunspell-?.?.so libhunspell.so
    popd
check      : |
    %make check || :
