# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : loupe
version    : '51.0'
release    : 12
source     :
    - https://download.gnome.org/sources/loupe/51/loupe-51.0.tar.xz : 13fa9990565ef917902f777cfce091ab60adb8a114a9f6cca274dfc5c0aae661
homepage   : https://apps.gnome.org/Loupe/
license    : GPL-3.0-or-later
component  : desktop.gnome
summary    : GNOME's default image viewer
description: |
    An image viewer application written with GTK 4, Libadwaita and Rust. Browse through your images and inspect their metadata with:
    - Fast GPU accelerated image rendering
    - Tiled rendering for vector graphics
    - Extendable and sandboxed image decoding
    - Accessible presentation of the most important metadata.
networking : true
builddeps  :
    - pkgconfig(gtk4)
    - pkgconfig(gweather4)
    - pkgconfig(lcms2)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libseccomp)
    - desktop-file-utils
    - itstool
    - rust
rundeps    :
    - glycin
    - webp-pixbuf-loader
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
