# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libudev0-shim
version    : '2'
release    : 2
source     :
    - https://github.com/archlinux/libudev0-shim/archive/refs/tags/v2.tar.gz : c55e5bcb82f02578c059c825946eca634d81e49fb22b2a0c1d791dc57e04b9c7
license    : LGPL-2.1-or-later
component  : binary.compat
homepage   : https://github.com/archlinux/libudev0-shim
summary    : libudev.so.0 compatibility layer
description: |
    libudev.so.0 compatibility layer
emul32     : true
builddeps  :
    - pkgconfig32(libudev)
build      : |
    unset LD_PRELOAD
    %make
install    : |
    %install_license LICENSE
    install -Dm00755 libudev.so.0.13.9999 -t $installdir/%libdir%
    ln -sv libudev.so.0.13.9999 $installdir/%libdir%/libudev.so.0
