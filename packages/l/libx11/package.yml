# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libx11
version    : 1.8.14
release    : 51
source     :
    - https://www.x.org/releases/individual/lib/libX11-1.8.14.tar.gz : ebb8a58549ddde50aa2e742b3b256557f451053d173be8dbfc2e8ac078eee1d6
license    : MIT
component  : xorg.library
homepage   : https://www.x.org/
summary    : Core X11 protocol client library
description: |
    Core X11 protocol client library
emul32     : true
mancompress: true
clang      : true
optimize   :
    - speed
    - lto
builddeps  :
    - pkgconfig32(xau)
    - pkgconfig32(xcb)
    - pkgconfig32(xdmcp)
    - pkgconfig32(xtrans)
    - pkgconfig(xproto)
setup      : |
    %configure \
        --disable-static \
        --disable-xf86bigfont
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
check      : |
    %make check
