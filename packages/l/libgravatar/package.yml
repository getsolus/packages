# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libgravatar
version    : 26.08.1
release    : 99
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/libgravatar-26.08.1.tar.xz : 459e245db0872ee5f780d4cc90808e90d9fcb63f0ee9c22552c15d60754c388f
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - MIT
component  : desktop.library
summary    : KDE PIM library providing Gravatar support
description: |
    KDE PIM library providing Gravatar support.
