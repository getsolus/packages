# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libgravatar
version    : 26.08.2
release    : 100
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/libgravatar-26.08.2.tar.xz : bd71ec6fefd98402683dd00447e0cab8c29f1f690784462dbfaab1ec95234069
homepage   : https://kde.org/
license    :
    - BSD-3-Clause
    - CC0-1.0
    - LGPL-2.0-or-later
    - MIT
component  : desktop.library
summary    : KDE PIM library providing Gravatar support
description: |
    KDE PIM library providing Gravatar support.
builddeps  :
    - kf6-kio-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
