# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libssh
version    : 0.12.2
release    : 22
source     :
    - https://www.libssh.org/files/0.12/libssh-0.12.2.tar.xz : 49560f677d96e3706a904ac2de1116e25f3680937d51e5c92198fcba4a1c1e9f
homepage   : https://www.libssh.org/
license    : LGPL-2.1-or-later
component  : programming.library
summary    : SSH library
description: |
    libssh is a multi-platform C library implementing the SSHv2 and SSHv1 protocol on client and server side. With libssh, you can remotely execute programs, transfer files, use a secure and transparent tunnel, manage public keys and much more.
checkdeps  :
    - pkgconfig(cmocka)
setup      : |
    %cmake_ninja -DUNIT_TESTING=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
check      : |
    unset LD_PRELOAD
    %ninja_check
