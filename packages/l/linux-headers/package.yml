# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : linux-headers
version    : 7.2.5
release    : 118
source     :
    - https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.2.5.tar.xz : 55ddf0df8325d9dad96fcff7bd93977d22e3f50af06527572af59b77c7632b78
license    : GPL-2.0-only
component  : system.devel
homepage   : https://www.kernel.org/
summary    : Kernel's libc headers
description: |
    Headers for the kernel's libc implementation
builddeps  :
    - rsync
setup      : |
    %make allnoconfig
install    : |
    %make headers_install INSTALL_HDR_PATH=$installdir/usr
    find $installdir -name ..install.cmd -or -name .install | xargs rm -vf
patterns   :
    - main : /*
replaces   :
    - kernel-libc-devel
