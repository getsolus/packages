# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : linux-headers
version    : 7.3.3
release    : 119
source     :
    - https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.3.3.tar.xz : 79c66dde66cd96877fcde8f7d36aec946b1f423d2b97b5a7b1751b75c764f3d1
license    : GPL-2.0-only
component  : system.devel
homepage   : https://www.kernel.org/
summary    : Kernel's libc headers
description: |
    Headers for the kernel's libc implementation
builddeps  :
    - rsync
setup      : |
    %make allnoconfig
install    : |
    %make headers_install INSTALL_HDR_PATH=$installdir/usr
    find $installdir -name ..install.cmd -or -name .install | xargs rm -vf
patterns   :
    - main : /*
replaces   :
    - kernel-libc-devel
