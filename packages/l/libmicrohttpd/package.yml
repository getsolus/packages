# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libmicrohttpd
version    : 1.0.11
release    : 14
source     :
    - https://mirrors.ocf.berkeley.edu/gnu//libmicrohttpd/libmicrohttpd-1.0.11.tar.gz : 
        f227a044b75688e449b58ddedf0582255cc562899ff69f173a8ef76439744b4e
homepage   : https://www.gnu.org/software/libmicrohttpd/
license    : LGPL-2.1-or-later
component  : network.web
summary    : GNU libmicrohttpd is a small C library that is supposed to make it easy to run an HTTP server as part of another application
description: |
    GNU libmicrohttpd is a small C library that is supposed to make it easy to run an HTTP server as part of another application.
builddeps  :
    - pkgconfig(gnutls)
clang      : true
setup      : |
    %configure --disable-static
build      : |
    %make
install    : |
    %make_install
    rm -rf $installdir/usr/share/info
    %install_license COPYING
check      : |
    # test_mhd fails in chrooted environements
    %make check XFAIL_TESTS="test_mhd_version"
