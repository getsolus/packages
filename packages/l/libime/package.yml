# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libime
version    : 1.1.17
release    : 1
source     :
    # Git source: the release tarball does not include the kenlm submodule
    - git|https://github.com/fcitx/libime.git : 1.1.17
homepage   : https://github.com/fcitx/libime
license    : LGPL-2.1-or-later
component  : desktop.core
summary    : Input method library for fcitx5 (Pinyin and Table)
description: |
    libime provides the Pinyin and Table input method engines used by
    fcitx5-chinese-addons, including the sentence language model.
networking : true
builddeps  :
    - pkgconfig(Fcitx5Utils)
    - pkgconfig(libzstd)
    - extra-cmake-modules
    - libboost-devel
setup      : |
    %cmake_ninja -DENABLE_TEST=OFF
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
