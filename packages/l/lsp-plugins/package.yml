# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : lsp-plugins
version    : 1.2.37
release    : 24
source     :
    - https://github.com/sadko4u/lsp-plugins/releases/download/1.2.37/lsp-plugins-src-1.2.37.tar.gz : ae7f22b249b41a37db965229ae2ab7237330f83279369f9961277d8bf10d2df4
homepage   : https://lsp-plug.in
license    : LGPL-3.0-only
component  : multimedia.audio
summary    : Linux Studio Plugins Project
description: |
    LSP (Linux Studio Plugins) is a collection of open-source plugins
builddeps  :
    - pkgconfig(cairo)
    - pkgconfig(gl)
    - pkgconfig(jack)
    - pkgconfig(lv2)
    - pkgconfig(sndfile)
    - pkgconfig(xrandr)
    - ladspa-devel
setup      : |
    make config FEATURES='ladspa lv2 vst2 jack' PREFIX=/usr LIBDIR=%libdir%
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING COPYING.LESSER
