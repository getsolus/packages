# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : lsp-plugins
version    : 1.2.35
release    : 23
source     :
    - https://github.com/sadko4u/lsp-plugins/releases/download/1.2.35/lsp-plugins-src-1.2.35.tar.gz : 2c95ec7bb219d561ea3db36051b6c732133bcd76426fb836b1dd850dc4b5bb6c
homepage   : https://lsp-plug.in
license    : LGPL-3.0-only
component  : multimedia.audio
summary    : Linux Studio Plugins Project
description: |
    LSP (Linux Studio Plugins) is a collection of open-source plugins
builddeps  :
    - pkgconfig(cairo)
    - pkgconfig(gl)
    - pkgconfig(jack)
    - pkgconfig(lv2)
    - pkgconfig(sndfile)
    - pkgconfig(xrandr)
    - ladspa-devel
setup      : |
    make config FEATURES='ladspa lv2 vst2 jack' PREFIX=/usr LIBDIR=%libdir%
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING COPYING.LESSER
