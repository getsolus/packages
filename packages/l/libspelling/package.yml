# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libspelling
version    : 0.4.11
release    : 9
source     :
    - https://download.gnome.org/sources/libspelling/0.4/libspelling-0.4.11.tar.xz : 52e53ec3fba0f604cfd0931e26af7f7241a0d4f0208dd5574f43b3589f6d28b2
homepage   : https://gitlab.gnome.org/GNOME/libspelling/
license    : LGPL-2.1-or-later
component  : desktop.gnome.core
summary    : A spellcheck library for GTK 4
description: |
    A spellcheck library for GTK 4
optimize   :
    - lto
builddeps  :
    - pkgconfig(enchant-2)
    - pkgconfig(gio-2.0)
    - pkgconfig(gtk4)
    - pkgconfig(gtksourceview-5)
    # pkgconfig(sysprof-capture-4)
    - vala
setup      : |
    %meson_configure -Dsysprof=false -Ddocs=false
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
