# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libshumate
version    : 1.7.0
release    : 24
source     :
    - https://download.gnome.org/sources/libshumate/1.7/libshumate-1.7.0.tar.xz : 3896cc4b6a7bf83141c27df23ce48cdd68467603bc6b764960307cdcbbef80e5
homepage   : https://gitlab.gnome.org/GNOME/libshumate
license    : LGPL-2.1-or-later
component  : programming.library
summary    : Shumate is a GTK toolkit providing widgets for embedded maps.
description: |
    Shumate is a GTK toolkit providing widgets for embedded maps.
builddeps  :
    - pkgconfig(cairo)
    - pkgconfig(gtk4)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(libprotobuf-c)
    - pkgconfig(libsoup-3.0)
    - pkgconfig(sqlite3)
    - pkgconfig(sysprof-capture-4)
    - gperf
    - vala
setup      : |
    %meson_configure -Dgtk_doc=false
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
