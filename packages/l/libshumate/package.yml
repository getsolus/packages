# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : libshumate
version    : 1.7.1
release    : 25
source     :
    - https://download.gnome.org/sources/libshumate/1.7/libshumate-1.7.1.tar.xz : 5316878f7d6a2124d8d53bdd3a34b3656f1c2337b2082aa59ed667969c0bd8f4
homepage   : https://gitlab.gnome.org/GNOME/libshumate
license    : LGPL-2.1-or-later
component  : programming.library
summary    : Shumate is a GTK toolkit providing widgets for embedded maps.
description: |
    Shumate is a GTK toolkit providing widgets for embedded maps.
builddeps  :
    - pkgconfig(cairo)
    - pkgconfig(gtk4)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(libprotobuf-c)
    - pkgconfig(libsoup-3.0)
    - pkgconfig(sqlite3)
    - pkgconfig(sysprof-capture-4)
    - gperf
    - vala
setup      : |
    %meson_configure -Dgtk_doc=false
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
