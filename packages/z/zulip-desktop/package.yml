# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : zulip-desktop
version    : 5.14.2
release    : 7
source     :
    - https://github.com/zulip/zulip-desktop/archive/refs/tags/v5.14.2.tar.gz : 9be427a5e7e2218c9ebcbefc9decad9c3ed2b3815598ab78db233d3d6ca1dd52
homepage   : https://zulip.com/
license    : Apache-2.0
component  : network.im
summary    : Zulip Desktop Client for Linux
description: |
    Zulip is an organized team chat app designed for live and asynchronous conversations. It combines the immediacy of real-time chat with an email-style threading model.
networking : true
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(gbm)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(xscrnsaver)
    - pnpm
    - python3
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Disable-auto-update.patch
    pnpm install
build      : |
    pnpm run pack
install    : |
    zulip_installdir=${installdir}/usr/share/zulip
    %install_dir ${zulip_installdir}
    cp -a --no-preserve=ownership dist/linux-unpacked/. ${zulip_installdir}/

    %install_exe ${pkgfiles}/zulip.sh ${installdir}/usr/bin/zulip
    %install_file ${pkgfiles}/org.zulip.Zulip.desktop -t ${installdir}/usr/share/applications
    %install_file ${pkgfiles}/org.zulip.Zulip.metainfo.xml -t ${installdir}/usr/share/metainfo
    %install_file build/zulip.png ${installdir}/usr/share/icons/hicolor/512x512/apps/org.zulip.Zulip.png

    %install_license LICENSE
