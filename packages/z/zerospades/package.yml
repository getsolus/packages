# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : zerospades
version    : 0.0.9
release    : 1
source     :
    - git|https://github.com/zerospades/zerospades.git : v0.0.9
    - https://github.com/yvt/openspades-paks/releases/download/r33/OpenSpadesDevPackage-r33.zip#nonfree-paks.zip : 0927dc323a0b3aba0ee8d1d68d6b544b00fe654740fead6d1faad37aac77a2ad
homepage   : https://zerospades.github.io/
license    :
    - GPL-3.0-or-later # Sources
    - GPL-2.0-or-later # font-unifont.pak
    - LicenseRef-OpenSpades-Non-GPL-PAK-License # pak000-Nonfree.pak
component  : games.action
summary    : Fork of OpenSpades, a compatible client of Ace of Spades 0.75
description: |
    ZeroSpades is a fork of OpenSpades with extra features and many improvements/fixes.
builddeps  :
    - pkgconfig(SDL2_image)
    - pkgconfig(freealut)
    - pkgconfig(freetype2)
    - pkgconfig(glew)
    - pkgconfig(libcurl)
    - pkgconfig(opusfile)
    - pkgconfig(xext)
    - pkgconfig(xft)
    - imagemagick
    - unzip
    - xdg-utils
setup      : |
    # Use a local OpenSpadesDevPackage instead of pulling from network
    mkdir devpackage
    unzip -o ${sources}/nonfree-paks.zip -d devpackage/

    %patch -p1 -i ${pkgfiles}/0001-build-Don-t-try-to-download-resources.patch

    %cmake_ninja \
        -DZEROSPADES_INSTALL_RESOURCES=share/zerospades/Resources \
        -DZEROSPADES_INSTALL_BINARY=bin

    # Move the nonfree assets to the build directory
    mv devpackage/Nonfree/* solusBuildDir/Resources/
    mv devpackage/OfficialMods/* solusBuildDir/Resources/
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE
    %install_file solusBuildDir/Resources/LICENSE.md ${installdir}/usr/share/licenses/${package}/Nonfree.LICENSE
    %install_file solusBuildDir/Resources/LICENSE ${installdir}/usr/share/licenses/${package}/OfficialMods.LICENSE

    %install_file -t ${installdir}/usr/share/metainfo flatpak/io.github.zerospades.ZeroSpades.metainfo.xml
replaces   :
    - dbginfo : openspades-dbginfo
    - openspades
