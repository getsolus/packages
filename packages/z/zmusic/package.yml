# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : zmusic
version    : 1.3.0
release    : 13
source     :
    - https://github.com/ZDoom/ZMusic/archive/refs/tags/1.3.0.tar.gz : 2eccd41e1cc9b38b3729ab94d65635719b2adc916de4ca9f8399ebceaee89f7f
homepage   : https://github.com/ZDoom/ZMusic
license    :
    - GPL-3.0-or-later
    - LGPL-2.1-or-later
component  : multimedia.library
summary    : GZDoom's music system as a standalone library
description: |
    GZDoom's music system as a standalone library
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(libmpg123)
    - pkgconfig(sndfile)
setup      : |
    %cmake_ninja \
        -DDYN_MPG123=OFF \
        -DDYN_SNDFILE=OFF
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license licenses/*.txt
