# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : zed
version    : 1.19.2
release    : 156
source     :
    - git|https://github.com/zed-industries/zed.git : v1.19.2
homepage   : https://zed.dev/
license    :
    - AGPL-3.0-or-later
    - Apache-2.0
    - GPL-3.0-or-later
component  : editor
summary    : Code at the speed of thought
description: |
    Zed is a high-performance, multiplayer code editor from the creators of Atom and Tree-sitter. It's also open source.
networking : true
clang      : true
optimize   :
    - thin-lto
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(fontconfig)
    - pkgconfig(libcurl)
    - pkgconfig(libgit2)
    - pkgconfig(libzstd)
    - pkgconfig(protobuf)
    - pkgconfig(sqlite3)
    - pkgconfig(x11)
    - pkgconfig(xkbcommon)
    - envsubst
    - python-requests # convert-release-notes.py
    - rust
environment: |
    # vars for envsubst
    export APP_CLI="zedit"
    export APP_ICON="zed"
    export APP_ID="dev.zed.Zed"
    export APP_NAME="Zed"
    export APP_ARGS="%U"
    export DO_STARTUP_NOTIFY="true"
    # stable branding
    export BRANDING_LIGHT="#99c1f1"
    export BRANDING_DARK="#1a5fb4"
    # disable auto-updates
    export ZED_UPDATE_EXPLANATION="Auto-updates disabled in distribution build. Please update via your package manager"
    # use system libs
    export LIBGIT2_NO_VENDOR=1
    export LIBSQLITE3_SYS_USE_PKG_CONFIG=1
    export ZSTD_SYS_USE_PKG_CONFIG=1
setup      : |
    # Fill out desktop info
    envsubst < crates/zed/resources/zed.desktop.in > zed.desktop
    # Fill out appstream metainfo
    python3 ./script/flatpak/convert-release-notes.py "v${version}" stable
    envsubst < crates/zed/resources/flatpak/zed.metainfo.xml.in > zed.metainfo.xml
    sed -i -e '/@release_info@/{r crates/zed/resources/flatpak/release-info/stable' -e 'd}' zed.metainfo.xml

    # Only needed if following -pre (preview) tags
    # echo stable > crates/zed/RELEASE_CHANNEL

    %cargo_fetch

    # We need aws-lc-rs 1.18.1
    cargo update aws-lc-rs
build      : |
    ./script/generate-licenses

    %cargo_build -p cli -p zed
install    : |
    %install_exe -Dm00755 target/release/cli $installdir/usr/bin/$APP_CLI
    %install_exe -Dm00755 target/release/zed $installdir/%libdir%/zed/zed-editor

    %install_file zed.desktop $installdir/usr/share/applications/$APP_ID.desktop
    %install_file zed.metainfo.xml $installdir/usr/share/metainfo/$APP_ID.metainfo.xml

    %install_file crates/zed/resources/app-icon.png $installdir/usr/share/icons/hicolor/512x512/apps/zed.png
    %install_file crates/zed/resources/app-icon@2x.png $installdir/usr/share/icons/hicolor/512x512@2/apps/zed.png

    # completions
    export ZED_ALLOW_ROOT=true
    $installdir/usr/bin/$APP_CLI --completions bash | %install_file /dev/stdin $installdir/usr/share/bash-completion/completions/$APP_CLI
    $installdir/usr/bin/$APP_CLI --completions fish | %install_file /dev/stdin $installdir/usr/share/fish/vendor_completions.d/$APP_CLI.fish
    $installdir/usr/bin/$APP_CLI --completions zsh | %install_file /dev/stdin $installdir/usr/share/zsh/site-functions/_$APP_CLI

    %install_license LICENSE-GPL LICENSE-APACHE
