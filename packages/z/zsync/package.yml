# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : zsync
version    : 0.8.0
release    : 6
homepage   : https://zsync.moria.org.uk/
source     :
    - https://zsync.moria.org.uk/download/zsync-0.8.0.tar.gz : 58b02f27e14326b62b7fdd6ed431a3e243b1c5a3ea9e3c1678e136dbf00c238d
license    : Artistic-2.0
component  : system.utils
summary    : zsync is a file transfer program.
description: |
    zsync is a file transfer program. It allows you to download a file from a remote server, where you have a copy of an older version of the file on your computer already. zsync downloads only the new parts of the file.
networking : true
builddeps  :
    - golang
build      : |
    go build -o zsync ./cmd/zsync
    go build -o zsyncmake ./cmd/zsyncmake
install    : |
    %install_bin zsync
    %install_bin zsyncmake
    %install_license LICENSE
    %install_file man/zsync.1 -t ${installdir}/usr/share/man/man1/
    %install_file man/zsyncmake.1 -t ${installdir}/usr/share/man/man1/
