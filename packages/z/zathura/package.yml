# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : zathura
version    : 2026.07.18
release    : 32
source     :
    - https://pwmt.org/projects/zathura/download/zathura-2026.07.18.tar.xz : 9efc4a92f8b2d03e5a1b80756d3ae4249d8d6efdb10e311795e8cdd8e35a9f87
    - https://pwmt.org/projects/zathura-pdf-poppler/download/zathura-pdf-poppler-2026.07.18.tar.xz : 605d3f2c2e90efbc0434bb7206f013dc8ff99d8b679c6b519e13543777635bf1
    - https://pwmt.org/projects/zathura-djvu/download/zathura-djvu-2026.07.18.tar.xz : 451ac83ff99bbcf1e8231abbace77b65793f4ff2bb06e70df053410d454d36a5
    - https://pwmt.org/projects/zathura-cb/download/zathura-cb-2026.07.18.tar.xz : 072660fd32ce56ce512655caf8c190ffbf6c3f36ff09b3f740d65150f99ddc13
    - https://pwmt.org/projects/zathura-ps/download/zathura-ps-2026.07.18.tar.xz : 35a3cabc1617fa53b0def887d04ceef3c62a8bd15ddf6f011be0fe0e6fc60587
    - https://pwmt.org/projects/zathura-pdf-mupdf/download/zathura-pdf-mupdf-2026.07.18.tar.xz : 82f302bc786616d2d7dd98c1cb0559f08f7620e4b01044e6ec6aba10e3d5c36a
homepage   : https://pwmt.org/projects/zathura/
license    : Zlib
component  :
    - office.viewers
    - mupdf : office.viewers
    - poppler : office.viewers
summary    : zathura is a highly customizable and functional document viewer
description:
    - zathura is a highly customizable and functional document viewer based on the girara user interface library and several document libraries
    - mupdf : mupdf plugin for zathura
    - poppler : poppler plugin for zathura
builddeps  :
    - pkgconfig(cairo)
    - pkgconfig(ddjvuapi)
    - pkgconfig(gio-unix-2.0)
    - pkgconfig(girara)
    - pkgconfig(glib-2.0)
    - pkgconfig(gmodule-no-export-2.0)
    - pkgconfig(gthread-2.0)
    - pkgconfig(gtk4)
    - pkgconfig(gumbo)
    - pkgconfig(jbig2dec)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(libarchive)
    - pkgconfig(libmagic)
    - pkgconfig(libopenjp2)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libseccomp)
    - pkgconfig(libspectre)
    - pkgconfig(libturbojpeg)
    - pkgconfig(libxxhash)
    - pkgconfig(poppler-glib)
    - pkgconfig(sqlite3)
    - pkgconfig(synctex)
    - desktop-file-utils
    - intltool
    - mupdf-devel
    - python-sphinx
rundeps    :
    - mupdf :
        - zathura
    - poppler :
        - zathura
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE

    export PKG_CONFIG_PATH=${PKG_CONFIG_PATH}:${installdir}/%libdir%/pkgconfig
    # Build the remaining plugins
    mkdir plugin_build
    pushd plugin_build
        for plugin in \
            zathura-cb-2026.07.18 \
            zathura-ps-2026.07.18 \
            zathura-djvu-2026.07.18 \
            zathura-pdf-poppler-2026.07.18 \
            zathura-pdf-mupdf-2026.07.18 ; do
            tar xf "${sources}/${plugin}.tar.xz"
            pushd "${plugin}"
            if [[ "${plugin}" == zathura-pdf-mupdf-* ]]; then
                # Remove mupdfthird references - Solus links mupdf externally
                perl -pi -e 's/^\s*mupdfthird\s*=.*\n//;' -e 's/, mupdfthird\]/]/;' meson.build
            fi
            export CFLAGS="${CFLAGS} -I${installdir}/usr/include"
            %meson_configure
            %ninja_build
            %ninja_install
            popd
        done
    popd

    # due to a limitation in the SC
    rm -v ${installdir}/usr/share/metainfo/org.pwmt.zathura-*.metainfo.xml

    # Keep file associations for plugins shipped in the main package without
    # showing one launcher per plugin in file manager "Open With" menus.
    desktop_file=${installdir}/usr/share/applications/org.pwmt.zathura.desktop
    for mime_type in $(awk -F= '/^MimeType=/ { print $2 }' ${installdir}/usr/share/applications/org.pwmt.zathura-{cb,djvu,ps}.desktop | tr ';' '\n' | sort -u); do
        desktop-file-edit --add-mime-type="$mime_type" "$desktop_file"
    done
    rm -v ${installdir}/usr/share/applications/org.pwmt.zathura-{cb,djvu,ps}.desktop
patterns   :
    - mupdf :
        - /usr/lib64/zathura/libpdf-mupdf.so
        - /usr/share/applications/org.pwmt.zathura-pdf-mupdf.desktop
    - poppler :
        - /usr/lib64/zathura/libpdf-poppler.so
        - /usr/share/applications/org.pwmt.zathura-pdf-poppler.desktop
