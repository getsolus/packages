# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : zellij
version    : 0.46.0
release    : 23
source     :
    - https://github.com/zellij-org/zellij/archive/refs/tags/v0.46.0.tar.gz : 2dfa237fea447f3cc98954e81b0097b9d25841010036720e11f67880fe7861f0
homepage   : https://zellij.dev
license    : MIT
component  : system.utils
summary    : A terminal workspace with batteries included
description: |
    Zellij is a terminal workspace. It has the base functionality of a terminal multiplexer (similar to tmux or screen) but includes many built-in features that would allow users to extend it and create their own personalized environment.
networking : true
builddeps  :
    - mandown
    - rust
setup      : |
    %cargo_fetch --target "x86_64-unknown-linux-gnu"
build      : |
    # Set features manually to avoid some vendored deps
    %cargo_build --no-default-features --features "plugins_from_target web_server_capability terminal"

    # Build completions
    ./target/release/zellij setup --generate-completion bash > target/zellij
    ./target/release/zellij setup --generate-completion fish > target/zellij.fish
    ./target/release/zellij setup --generate-completion zsh > target/_zellij
install    : |
    %cargo_install
    %install_license LICENSE.md

    # Install completions
    %install_file -t ${installdir}/usr/share/bash-completion/completions target/zellij
    %install_file -t ${installdir}/usr/share/fish/vendor_completions.d target/zellij.fish
    %install_file -t ${installdir}/usr/share/zsh/site-functions target/_zellij

    # Install desktop file
    %install_file -t ${installdir}/usr/share/applications assets/dev.zellij.Zellij.desktop

    # Install app icons
    %install_file assets/logo.svg ${installdir}/usr/share/icons/hicolor/scalable/apps/dev.zellij.Zellij.svg

    for size in 128 256 512; do
        %install_file zellij-utils/assets/icons/logo${size}.png ${installdir}/usr/share/icons/hicolor/${size}x${size}/apps/dev.zellij.Zellij.png
    done

    # Install AppStream Metainfo
    %install_file -t ${installdir}/usr/share/metainfo ${pkgfiles}/dev.zellij.Zellij.metainfo.xml
