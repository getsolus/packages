# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : zuluCrypt
version    : 7.1.1
release    : 17
source     :
    - https://github.com/mhogomchungu/zuluCrypt/releases/download/7.1.1/zuluCrypt-7.1.1.tar.xz : 6e7c76f1c954efb2f70f0cc6d13e49380c551f23d606f702060993ab4f39391f
homepage   : https://mhogomchungu.github.io/zuluCrypt/
license    : GPL-2.0-or-later
component  : security.crypto
summary    : zuluCrypt is a front end to cryptsetup and tcplay
description: |
    zuluCrypt is a simple, feature rich and powerful solution for hard drives encryption.
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(devmapper)
    - pkgconfig(libcryptsetup)
    - pkgconfig(libgcrypt)
    - pkgconfig(libsecret-1) # opt
    - pkgconfig(pwquality) # opt
    - kwallet-devel
setup      : |
    %cmake_ninja \
        -DQT6=true \
        -DUDEVSUPPORT=true \
        -DUSE_POLKIT=true
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE GPLv2

    # Install AppStream metainfo
    %install_file -t ${installdir}/usr/share/metainfo ${pkgfiles}/io.github.mhogomchungu.zuluCrypt.metainfo.xml
