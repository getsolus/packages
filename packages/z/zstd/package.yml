# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : zstd
version    : 1.6.0
release    : 34
source     :
    - https://github.com/facebook/zstd/releases/download/v1.6.0/zstd-1.6.0.tar.zst : 2ca30d45c7a61f255e17024373f7fe75b6403b2ade6b21220c1472964d8a466a
homepage   : https://facebook.github.io/zstd/
license    :
    - BSD-3-Clause
    - GPL-2.0-or-later
component  : system.base
summary    : Zstd command line tools
description: |
    Zstd, short for Zstandard, is a fast lossless compression algorithm, targeting real-time compression scenarios at zlib-level and better compression ratios.
emul32     : true
optimize   :
    - speed
builddeps  :
    - pkgconfig(liblz4)
    - pkgconfig(liblzma)
    - pkgconfig(zlib)
environment: |
    export PREFIX=/usr LIBDIR=%libdir%
setup      : |
    if [ -z "${EMUL32BUILD+set}" ]; then
        # Need to build static libs for tests
        %cmake_ninja -S build/cmake -L \
          -DBUILD_SHARED_LIBS=ON \
          -DZSTD_ZLIB_SUPPORT=ON \
          -DZSTD_LZMA_SUPPORT=ON \
          -DZSTD_LZ4_SUPPORT=ON \
          -DZSTD_BUILD_CONTRIB=ON \
          -DZSTD_BUILD_SHARED=ON \
          -DZSTD_BUILD_STATIC=OFF \
          -DZSTD_BUILD_TESTS=OFF \
          -DZSTD_PROGRAMS_LINK_SHARED=ON
    fi
build      : |
    if [ -z "${EMUL32BUILD+set}" ]; then
        %cmake_build
    else
        %make
    fi
install    : |
    if [ -z "${EMUL32BUILD+set}" ]; then
        %cmake_install
        %install_license COPYING LICENSE
    else
        %make_install

        rm -v ${installdir}/%libdir%/*.a

        # Otherwise CMake refuses to install the x86_64 binaries for some
        # reason...
        rm -rv ${installdir}/usr/bin
    fi
check      : |
    # if [ -z "${EMUL32BUILD+set}" ]; then
    #     LD_LIBRARY_PATH=$PWD/solusBuildDir/lib ctest --test-dir solusBuildDir
    # fi
