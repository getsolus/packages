# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : fcitx5-chinese-addons
version    : 5.1.15
release    : 1
source     :
    - https://github.com/fcitx/fcitx5-chinese-addons/archive/refs/tags/5.1.15.tar.gz : 26bb518bc269cc9d661c33bd572924e0f966b5bd8b197c24b14c5038ffea87ef
    # pinyinhelper stroke/table data (the module fetches these at build time over http)
    - https://download.fcitx-im.org/data/py_stroke-20250329.tar.gz : c1a7ca7225d3614ab83353fc827503006a980447762018f53760425d7b5303a6
    - https://download.fcitx-im.org/data/py_table-20121124.tar.gz : 42146ac97de6c13d55f9e99ed873915f4c66739e9c11532a34556badf9792c04
homepage   : https://github.com/fcitx/fcitx5-chinese-addons
license    :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
component  : desktop.core
summary    : Chinese input method addons for fcitx5 (Pinyin, Table)
description: |
    fcitx5-chinese-addons provides Chinese input methods for fcitx5, including
    the Pinyin and Table engines, cloud pinyin, and OpenCC-based conversion.
builddeps  :
    - pkgconfig(Fcitx5Config)
    - pkgconfig(Fcitx5Core)
    - pkgconfig(Fcitx5Module)
    - pkgconfig(libcurl)
    - pkgconfig(nlohmann_json)
    - pkgconfig(opencc)
    - extra-cmake-modules
    - fcitx5-qt-devel
    - libboost-devel
    - libime-devel
    - qt6-base-devel
    - qt6-webengine-devel
setup      : |
    # modules/pinyinhelper normally downloads its py_stroke/py_table data at
    # build time; provide the pre-fetched tarballs where it expects them instead.
    cp ${sources}/py_stroke-20250329.tar.gz ${sources}/py_table-20121124.tar.gz modules/pinyinhelper/
    %cmake_ninja -DENABLE_TEST=OFF
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING LICENSES/*
