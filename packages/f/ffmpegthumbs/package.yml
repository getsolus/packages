# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ffmpegthumbs
version    : 26.08.2
release    : 107
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/ffmpegthumbs-26.08.2.tar.xz : 6b39041282341d583eaa90b1892b46ac70c70b24f2fdd9e782c5093ba9bac03c
homepage   : https://kde.org/applications/multimedia/org.kde.ffmpegthumbs
license    :
    - BSD-3-Clause
    - GPL-2.0-or-later
component  : desktop.kde
summary    : Video thumbnail generator
description: |
    FFMpegThumbs is a video thumbnail generator for KDE file managers.
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(libavcodec)
    - kf6-kio-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
