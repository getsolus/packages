# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ffmpegthumbs
version    : 26.08.3
release    : 108
source     :
    - https://download.kde.org/stable/release-service/26.08.3/src/ffmpegthumbs-26.08.3.tar.xz : e55a6db0c4582648a6912fb2eebbd5a8cc60e6ef50a90dac03c75e7e69eb6347
homepage   : https://kde.org/applications/multimedia/org.kde.ffmpegthumbs
license    :
    - BSD-3-Clause
    - GPL-2.0-or-later
component  : desktop.kde
summary    : Video thumbnail generator
description: |
    FFMpegThumbs is a video thumbnail generator for KDE file managers.
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(libavcodec)
    - kf6-kio-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6 \
        -DBUILD_WITH_QT6=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
