# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : font-intel-one-mono-ttf
version    : 1.5.0
release    : 4
source     :
    - https://github.com/intel/intel-one-mono/archive/refs/tags/V1.5.0.tar.gz : eecfab1296970d16baa21c0c1ac9fb3337caf38e21c78cd49d80d942b4d96619
homepage   : https://www.intel.com/content/www/us/en/company-overview/one-monospace-font.html
license    : OFL-1.1
component  :
    - desktop.font
summary    : Monospaced font with developers in mind
description: |
    Intel-One-Mono is a monospaced font that is built with clarity, legibility, and the needs of developers in mind.
install    : |
    %install_file fonts/intel-one-mono-ttf/*.ttf -t $installdir/usr/share/fonts/truetype/intel-one-mono/

    %install_file $pkgfiles/intel-one-mono.metainfo.xml $installdir/usr/share/metainfo/intel-one-mono.metainfo.xml

    %install_license OFL.txt
