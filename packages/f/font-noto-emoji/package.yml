# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : font-noto-emoji
version    : '2.057'
release    : 4
source     :
    - https://github.com/googlefonts/noto-emoji/archive/refs/tags/v2026-09-24-unicode18_0.tar.gz : eedc2866ea0e681d0ca9e7694eff6b3298bf685d4f981cca0f195a72d57bcdca
homepage   : https://fonts.google.com/noto/specimen/Noto+Emoji
license    : OFL-1.1
component  : desktop.font
summary    : Noto Emoji is an open source font that has you covered for all your emoji needs
description: |
    Noto Emoji is an open source font that has you covered for all your emoji needs, including support for the latest Unicode emoji specification. It has multiple weights and features thousands of emoji.
install    : |
    %install_file $pkgfiles/noto-emoji.metainfo.xml $installdir/usr/share/metainfo/noto-emoji.metainfo.xml
    %install_file 2D/fonts/NotoColorEmoji.ttf $installdir/usr/share/fonts/truetype/noto-emoji/NotoColorEmoji.ttf
    %install_license LICENSE
