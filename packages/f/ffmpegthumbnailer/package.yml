# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ffmpegthumbnailer
version    : 2.4.1
release    : 15
source     :
    - https://github.com/dirkvdb/ffmpegthumbnailer/archive/refs/tags/v2.4.1.tar.gz : 779ff290a2b874fc889b28aa4c89fb5d1dbc9a15ee1d09524ed346bd83a4d920
homepage   : https://github.com/dirkvdb/ffmpegthumbnailer
license    : GPL-2.0-or-later
component  : multimedia.library
summary    : Lightweight video thumbnailer that can be used by file managers
description: |
    FFmpegthumbnailer is a lightweight video thumbnailer that can be used by file managers to create thumbnails for your video files. The thumbnailer uses ffmpeg to decode frames from the video files, so supported videoformats depend on the configuration flags of ffmpeg.
builddeps  :
    - pkgconfig(libavcodec)
    - pkgconfig(libpng)
    - pkgconfig(libturbojpeg)
setup      : |
    %cmake_ninja \
        -DENABLE_GIO=ON \
        -DENABLE_THUMBNAILER=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
