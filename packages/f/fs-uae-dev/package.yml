# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : fs-uae-dev
version    : 3.2.35
release    : 14
source     :
    - https://github.com/FrodeSolheim/fs-uae/releases/download/v3.2.35/fs-uae-3.2.35.tar.xz : f3d3cb8d3df34b0b0125c45a5a3e187ff71050be5dc8455cc4505c0380269117
license    : GPL-2.0-or-later
component  : games.emulator
homepage   : https://fs-uae.net/
summary    : Multi-platform Amiga emulator based on WinUAE (Development Version)
description: |
    FS-UAE integrates the most accurate Amiga emulation code available from WinUAE. FS-UAE emulates A500, A500+, A600, A1200, A1000, A3000 and A4000 models, but you can tweak the hardware configuration and create customized Amigas.
builddeps  :
    - pkgconfig(freetype2)
    - pkgconfig(gl)
    - pkgconfig(glew)
    - pkgconfig(libjpeg)
    - pkgconfig(libmpeg2)
    - pkgconfig(openal)
    - pkgconfig(sdl2)
    - pkgconfig(xtst)
setup      : |
    %configure --with-glew --disable-jit
build      : |
    %make
install    : |
    %install_license COPYING
    %make_install
    rm -rf $installdir/usr/share/doc/
check      : |
    %make check
