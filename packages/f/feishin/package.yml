# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : feishin
version    : 1.17.0
release    : 11
source     :
    - https://github.com/jeffvli/feishin/archive/refs/tags/v1.17.0.tar.gz : fa151c76db4775d6f9df3e8e965049a60141c168a2c6e2a7b69b2a2f675f717d
homepage   : https://github.com/jeffvli/feishin
license    : GPL-3.0-or-later
component  : multimedia.audio
summary    : A modern self-hosted music player.
description: |
    A modern self-hosted music player. Supports Jellyfin and Subsonic-compatible servers, including Navidrome and others.
patterns   :
    - /*
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(atkmm-1.6)
    - pkgconfig(gbm)
    - pkgconfig(gdk-3.0)
    - pkgconfig(x11)
    - pkgconfig(xcomposite)
    - pkgconfig(xdamage)
    - libxcrypt-devel
    - nodejs-20
    - pnpm
networking : true
setup      : |
    pnpm install
build      : |
    pnpm run build:electron
    pnpm exec electron-builder -l dir
install    : |
    # Installdir for Feishin
    %install_dir ${installdir}/usr/share/feishin

    # Install the actual program
    cp -Rv dist/linux-unpacked/* ${installdir}/usr/share/feishin/
    %install_dir ${installdir}/usr/bin
    ln -s /usr/share/feishin/feishin ${installdir}/usr/bin/feishin

    # Generate a .desktop file in exactly the same way that Feishin's official installer does
    export FEISHIN_DESKTOP_EXECUTABLE="feishin"
    export FEISHIN_DESKTOP_ARGS=""
    
    %install_dir ${installdir}/usr/share/applications/
    cat feishin.desktop.tmpl | envsubst > ${installdir}/usr/share/applications/org.jeffvli.feishin.desktop

    # Install appstream metainfo
    %install_file org.jeffvli.feishin.metainfo.xml ${installdir}/usr/share/metainfo/org.jeffvli.feishin.metainfo.xml

    # Install icon
    %install_file resources/icon.png ${installdir}/usr/share/icons/hicolor/512x512/apps/org.jeffvli.feishin.png

    # Install license
    %install_license LICENSE
