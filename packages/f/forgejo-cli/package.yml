# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : forgejo-cli
version    : 0.6.0
release    : 1
source     :
    - https://codeberg.org/forgejo-contrib/forgejo-cli/archive/v0.6.0.tar.gz : 8b91194cb1886f253261a4567ee6f83aa34b05a9637644793f88b40b7110322a
homepage   : https://codeberg.org/forgejo-contrib/forgejo-cli/
license    :
    - Apache-2.0
    - MIT
component  : programming.tools
networking : true
summary    : CLI application for interacting with Forgejo
description: |
    fj is a CLI client for Forgejo, akin to gh, glab, or tea. It handles Forgejo-specific tasks such as issues, pull requests, repositories, organizations, and releases from the command line, working alongside git.
builddeps  :
    - pkgconfig(libgit2)
    - pkgconfig(libssh2)
    - pkgconfig(openssl)
    - rust
environment: |
    # Force use of system libraries instead of building vendored C-libs from source
    export LIBGIT2_NO_VENDOR=1
    export LIBSSH2_SYS_USE_PKG_CONFIG=1
    export OPENSSL_NO_VENDOR=true
setup      : |
    %cargo_fetch
    # Apply upstream PR #630 to fix the unconditional key loading during shell completion
    # This can likely be removed next version after 0.6.0
    %patch -p1 -i $pkgfiles/fix-load-keys.patch
build      : |
    %cargo_build

    # Completions
    mkdir completions
    fj="target/release/fj"

    "${fj}" completion bash > completions/fj
    "${fj}" completion fish > completions/fj.fish
    "${fj}" completion zsh > completions/_fj
    
install    : |
    %cargo_install fj

    %install_license LICENSE*

    # Completions
    %install_file -t ${installdir}/usr/share/bash-completion/completions completions/fj
    %install_file -t ${installdir}/usr/share/fish/vendor_completions.d completions/fj.fish
    %install_file -t ${installdir}/usr/share/zsh/site-functions completions/_fj
