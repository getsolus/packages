# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : fzssh
version    : 1.4.0
release    : 1
# Upstream download link became (purposely) unstable
# See https://trac.filezilla-project.org/ticket/13186
source     :
    - https://sources.getsol.us/fzssh-1.4.0.tar.xz : 0c53178298364404e1fe4ce3d50267cf1238e52b414a6a53356bc43b37811338
homepage   : https://fzssh.filezilla-project.org/
license    : AGPL-3.0-or-later
component  : programming
summary    : fzssh is a SSH/SFTP library based on libfilezilla
description: |
    fzssh is a SSH/SFTP library based on libfilezilla
builddeps  :
    - pkgconfig(libargon2)
    - pkgconfig(libfilezilla)
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license agpl3.txt
