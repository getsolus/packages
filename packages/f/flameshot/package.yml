# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : flameshot
version    : 15.0.0
release    : 21
source     :
    - https://github.com/flameshot-org/flameshot/archive/refs/tags/v15.0.0.tar.gz : 9e38bb699a152873e9ccc4b9a54b06baa16762298444aff8c72f218a7741e146
    - git|https://gitlab.com/mattbas/Qt-Color-Widgets.git : 5d52e907e50dc88cf969b41cea44665ff6c475b1
homepage   : https://flameshot.org/
license    :
    - Apache-2.0
    - GPL-2.0-or-later
    - GPL-3.0-or-later
    - LAL-1.3
    - LGPL-3.0-or-later
component  : multimedia.graphics
summary    : Powerful yet simple to use screenshot software
description: |
    A program to capture screenshots. It includes CLI options as well as a GUI for capturing and annotating screenshots.
builddeps  :
    - pkgconfig(KF6GuiAddons)
    - pkgconfig(Qt6Svg)
    - pkgconfig(Qt6UiTools)
    - kdsingleapplication-devel
rundeps    :
    - qt6-svg
setup      : |
    mkdir ${workdir}/external
    cp -a ${sources}/Qt-Color-Widgets.git ${workdir}/external/Qt-Color-Widgets

    %cmake_ninja \
        -DDISABLE_UPDATE_CHECKER:BOOL=ON \
        -DUSE_WAYLAND_CLIPBOARD:BOOL=ON \
        -DUSE_BUNDLED_KDSINGLEAPPLICATION:BOOL=OFF
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE
