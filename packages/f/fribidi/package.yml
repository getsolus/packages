# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : fribidi
version    : 1.0.17
release    : 11
source     :
    - https://github.com/fribidi/fribidi/releases/download/v1.0.17/fribidi-1.0.17.tar.xz : 6949dcde27d41cebad1fd741fcafc36d55a1020d2d872d4a6eb3914caabbada2
homepage   : https://github.com/fribidi/fribidi
license    : LGPL-2.1-or-later
component  : desktop.library
summary    : Implementation of the Unicode Bidirectional Algorithm
description: |
    GNU FriBidi is an implementation of the Unicode Bidirectional Algorithm, known is "bidi" which specifies the positioning of characters in text.
emul32     : true
clang      : true
setup      : |
    %meson_configure -Ddocs=false
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
check      : |
    %ninja_check
patterns   :
    - devel : /usr/bin/fribidi
