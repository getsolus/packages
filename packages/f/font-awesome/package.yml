# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : font-awesome
version    : 7.3.1
release    : 1
source     :
    - https://github.com/FortAwesome/Font-Awesome/archive/refs/tags/7.3.1.tar.gz : d5a20554faa1ad30148b05f090a556e23495c446435c8dfc1624d3c0e3c2640b
homepage   : https://fontawesome.com
license    : OFL-1.1
component  :
    - otf : desktop.font
    - woff2 : desktop.font
    - desktop.font
summary    :
    - otf : Font Awesome Free OpenType fonts
    - woff2 : Font Awesome Free WOFF2 fonts
    - Font Awesome Free
description: |
    Font Awesome - The iconic font and CSS toolkit
install    : |
    # WOFF2
    %install_file LICENSE.txt -t ${installdir}/usr/share/licenses/${package}-woff2
    %install_file webfonts/*.woff2 -t ${installdir}/usr/share/fonts/WOFF2/fontawesome/
    %install_file ${pkgfiles}/fontawesome-woff2.metainfo.xml -t ${installdir}/usr/share/metainfo

    # otf
    %install_file LICENSE.txt -t ${installdir}/usr/share/licenses/${package}-otf
    %install_file otfs/*.otf -t ${installdir}/usr/share/fonts/opentype/fontawesome/
    %install_file ${pkgfiles}/fontawesome-otf.metainfo.xml ${installdir}/usr/share/metainfo
patterns   :
    - otf :
        - /usr/share/fonts/opentype
        - /usr/share/licenses/font-awesome-otf/LICENSE.txt
        - /usr/share/metainfo/fontawesome-otf.metainfo.xml
    - woff2 :
        - /usr/share/fonts/WOFF2
        - /usr/share/licenses/font-awesome-woff2/LICENSE.txt
        - /usr/share/metainfo/fontawesome-woff2.metainfo.xml
