# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : freeciv
version    : 3.2.7
release    : 54
source     :
    - https://files.freeciv.org/stable/freeciv-3.2.7.tar.xz : 2720076d50f29db42cdc5e510e7c098f7793f7c0ac410fdf390a52bc57507917
homepage   : https://www.freeciv.org/
license    : GPL-2.0-or-later
component  : games.strategy
summary    : Free and Open Source empire-building strategy game inspired by the history of human civilization
description: |
    Free and Open Source empire-building strategy game inspired by the history of human civilization.
libsplit   : false
builddeps  :
    - pkgconfig(ImageMagick)
    - pkgconfig(Qt6Core)
    - pkgconfig(SDL2_mixer)
    - pkgconfig(gtk4)
    - pkgconfig(libcurl)
    - pkgconfig(lua-5.4)
    - pkgconfig(sqlite3)
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING
