# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : freeciv
version    : 3.2.5
release    : 52
source     :
    - https://files.freeciv.org/stable/freeciv-3.2.5.tar.xz : d32808f02a9b9f49ef159bcbf266b16ce2a3ce6ea8f71115d80f952c3cc609e8
homepage   : https://www.freeciv.org/
license    : GPL-2.0-or-later
component  : games.strategy
summary    : Free and Open Source empire-building strategy game inspired by the history of human civilization
description: |
    Free and Open Source empire-building strategy game inspired by the history of human civilization.
libsplit   : false
builddeps  :
    - pkgconfig(ImageMagick)
    - pkgconfig(Qt6Core)
    - pkgconfig(SDL2_mixer)
    - pkgconfig(gtk4)
    - pkgconfig(libcurl)
    - pkgconfig(lua-5.4)
    - pkgconfig(sqlite3)
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING
