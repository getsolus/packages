# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : focus-timer
version    : 1.1.5
release    : 1
source     :
    - https://github.com/focustimerhq/FocusTimer/archive/refs/tags/1.1.5.tar.gz : 5ffc950f0f710a249d5e6659e55c62092568e3688b76c644b0f5afa77e32c4b8
homepage   : https://focustimerhq.github.io/
license    : GPL-3.0-or-later
component  : office
summary    : A time management utility for GNOME based on the pomodoro technique!
description: |
    Focus Timer (formerly gnome-pomodoro) is a time-management app built around the Pomodoro Technique, helping you maintain focus and prevent burnout through structured work and break intervals.
builddeps  :
    - pkgconfig(gnome-desktop-3.0)
    - pkgconfig(gom-1.0)
    - pkgconfig(gsettings-desktop-schemas)
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libcanberra)
    - pkgconfig(libpeas-2)
    - pkgconfig(sqlite3)
    - desktop-file-utils
    - gnome-common
    - vala
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
replaces:
    - gnome-pomodoro
    - devel: gnome-pomodoro-devel
    - dbginfo: gnome-pomodoro-dbginfo
