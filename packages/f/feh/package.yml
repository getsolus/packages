# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : feh
version    : 3.13.1
release    : 56
source     :
    - https://feh.finalrewind.org/feh-3.13.1.tar.bz2 : 785cd3bf51e05f6bb86ab0d649b7ed20e31892eb635bc5a25c963bf934088445
homepage   : https://feh.finalrewind.org/
license    : MIT
component  : multimedia.graphics
summary    : feh is an X11 image viewer aimed mostly at console users
description: |
    feh is an X11 image viewer aimed mostly at console users. Unlike most other viewers, it does not have a fancy GUI, but simply displays images. It is controlled via commandline arguments and configurable key/mouse actions.
builddeps  :
    - pkgconfig(freetype2)
    - pkgconfig(imlib2)
    - pkgconfig(libcurl)
    - pkgconfig(libexif)
    - pkgconfig(xinerama)
    - pkgconfig(xt)
build      : |
    %make PREFIX=/usr exif=1 inotify=1
install    : |
    %make_install PREFIX=/usr
    %install_license COPYING
    %install_file ${pkgfiles}/org.finalrewind.feh.feh.metainfo.xml -t ${installdir}/usr/share/metainfo
