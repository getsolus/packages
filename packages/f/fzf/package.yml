# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : fzf
version    : 0.74.5
release    : 59
source     :
    - https://github.com/junegunn/fzf/archive/refs/tags/v0.74.5.tar.gz : 5529d08897b85ae773695787c811ff9c9eeee32419c8a297fa1dbe586ed0a27e
homepage   : https://github.com/junegunn/fzf
license    : MIT
component  : system.utils
summary    : fzf is a general-purpose command-line fuzzy finder
description: |
    fzf is a general-purpose command-line fuzzy finder
networking : true
builddeps  :
    - golang
build      : |
    FZF_VERSION=${version} FZF_REVISION=tarball %make
install    : |
    %install_exe target/fzf-linux_amd64 ${installdir}/usr/bin/fzf
    %install_bin bin/fzf-tmux

    # Man pages
    %install_file man/man1/fzf.1 ${installdir}/usr/share/man/man1/fzf.1
    %install_file man/man1/fzf-tmux.1 ${installdir}/usr/share/man/man1/fzf-tmux.1

    # Shell completion files
    %install_file shell/completion.bash ${installdir}/usr/share/bash-completion/completions/fzf
    %install_file shell/completion.zsh ${installdir}/usr/share/zsh/site-functions/_fzf
    %install_file shell/completion.fish ${installdir}/usr/share/fish/vendor_completions.d/fzf.fish

    # Vim plugin and Neovim compatibility symlink
    %install_file plugin/fzf.vim ${installdir}/usr/share/vim/vimfiles/plugin/fzf.vim
    %install_dir ${installdir}/usr/share/nvim/plugin
    ln -sf /usr/share/vim/vimfiles/plugin/fzf.vim ${installdir}/usr/share/nvim/plugin/fzf.vim

    # Shared key-bindings consumed by fzf shell integrations
    %install_dir ${installdir}/usr/share/fzf
    %install_file shell/key-bindings.* ${installdir}/usr/share/fzf

    %install_license LICENSE
