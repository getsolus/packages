# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : fresh
version    : 0.5.1
release    : 8
source     :
    - https://github.com/sinelaw/fresh/archive/refs/tags/v0.5.1.tar.gz : 3472273fcf77b019922b32ddffad061cc068bfb260344865c239c8eb056d92bf
homepage   : https://getfresh.dev
license    : GPL-2.0-or-later
component  : editor
summary    : Terminal-based IDE and text editor with familiar UX
description: |
    Fresh is a terminal-based text editor that brings the intuitive, conventional
    UX of editors like VS Code and Sublime Text to the terminal. It features
    native menus, command palette, full mouse support, multi-cursor editing,
    LSP integration, TypeScript plugins in a sandboxed Deno environment, and
    efficient handling of very large files with low memory overhead.
networking : true
builddeps  :
    - rust
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install
    %install_file crates/fresh-editor/flatpak/io.github.sinelaw.fresh.desktop -t ${installdir}/usr/share/applications/
    %install_file crates/fresh-editor/flatpak/io.github.sinelaw.fresh.metainfo.xml -t ${installdir}/usr/share/metainfo/
    %install_file crates/fresh-editor/flatpak/io.github.sinelaw.fresh.svg -t ${installdir}/usr/share/icons/hicolor/scalable/apps/
    %install_license LICENSE
check      : |
    %cargo_test --config profile.release.debug-assertions=true --lib -- --skip test_plugin_command_overrides_builtin --skip test_history_sorting
