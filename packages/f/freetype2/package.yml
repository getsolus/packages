# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : freetype2
version    : 2.15.0
release    : 41
source     :
    - https://download-mirror.savannah.gnu.org/releases/freetype/freetype-2.15.0.tar.xz : 
        93cd47eb719c325107f2d3cf087d06299e944c3b48a40b55537302304dea1dd5
homepage   : https://freetype.org/
license    :
    - FTL
    - GPL-2.0-only
component  : desktop.library
summary    : Font rendering library
description: |
    The FreeType2 package contains a library which allows applications to properly render TrueType fonts.
builddeps  :
    - pkgconfig32(bzip2)
    - pkgconfig32(freetype2)
    - pkgconfig32(libbrotlicommon)
emul32     : true
optimize   :
    - speed
setup      : |
    %patch -p1 -i ${pkgfiles}/long-names.patch
    %patch -p1 -i ${pkgfiles}/0001-modules-Enable-gxvalid-otvalid.patch
    %patch -p1 -i ${pkgfiles}/0002-config-Enable-subpixel-rendering-infinality-engine.patch

    sed 's/%PKG_CONFIG%/pkg-config/g' builds/unix/freetype-config.in > freetype-config
    %meson_configure \
        -D freetype2:harfbuzz="dynamic" \
        -D freetype2:hvf="disabled"

build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSE.TXT

    %install_file builds/unix/freetype2.m4 ${installdir}/usr/share/aclocal/freetype2.m4

    %install_bin freetype-config
    %install_file docs/freetype-config.1 ${installdir}/usr/share/man/man1/freetype-config.1
patterns   :
    - devel :
        - /usr/bin/freetype-config
        - /usr/share/man/man1
        - /usr/share/aclocal
