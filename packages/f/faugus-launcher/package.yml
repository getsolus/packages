# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : faugus-launcher
version    : 2.5.7
release    : 24
source     :
    - https://github.com/Faugus/faugus-launcher/archive/refs/tags/2.5.7.tar.gz : 7fda460d6756102d2ce3fd54ad527174d437464449c30c732e0242120769a569
homepage   : https://github.com/Faugus/faugus-launcher
license    : MIT
component  : games
summary    : A simple and lightweight app for running Windows games using UMU-Launcher
description: |
    A simple and lightweight app for running Windows games using UMU-Launcher
builddeps  :
    - pkgconfig(gtk4)
    - pkgconfig(libadwaita-1)
    - pkgconfig(manette-0.2)
rundeps    :
    - libadwaita
    - libgtk-4
    - libmanette
    - python-gobject
    - python-icoextract
    - python-pillow
    - python-psutil
    - python-requests
    - python-vdf
    - python3-dbus
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
