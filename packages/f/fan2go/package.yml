# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : fan2go
version    : 0.16.0
release    : 5
source     :
    - https://github.com/markusressel/fan2go/archive/refs/tags/0.16.0.tar.gz : e881bb284a5a5a4a55bef631c165a94065daf8782eafd98463d2792abc734f4f
homepage   : https://github.com/markusressel/fan2go
license    : AGPL-3.0-or-later
component  : system.utils
summary    : Simple daemon providing dynamic fan speed control based on temperature sensors
networking : true
description: |
    A simple daemon providing dynamic fan speed control based on temperature sensors. fan2go relies on lm-sensors to get both temperature and RPM sensor readings, as well as PWM controls, so it needs to be set up first.
builddeps  :
    - golang
    - lm_sensors-devel
build      : |
    %make build
install    : |
    %install_bin bin/fan2go
    %install_file fan2go.service ${installdir}/usr/lib/systemd/system/fan2go.service
    %install_file fan2go.yaml ${installdir}/usr/share/fan2go/fan2go.yaml
    %install_license LICENSE
check      : |
    %make test
