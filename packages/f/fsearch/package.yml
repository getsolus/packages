# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : fsearch
version    : 0.3.2
release    : 17
source     :
    - https://github.com/cboxdoerfer/fsearch/archive/refs/tags/0.3.2.tar.gz : 2c9bc7de9ac1ba72232cb4d66a750fe04210fdae96273f04316b6616fc098308
homepage   : https://github.com/cboxdoerfer/fsearch
license    : GPL-2.0-or-later
component  : system.utils
summary    : A fast file search utility for Unix-like systems based on GTK+3
description: |
    FSearch is a fast file search utility, inspired by Everything Search Engine. It's written in C and based on GTK3.
builddeps  :
    - pkgconfig(appstream)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(icu-uc)
    - pkgconfig(libpcre2-8)
    - autoconf-archive
    - desktop-file-utils
    - itstool
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSE
check      : |
    %meson_test
