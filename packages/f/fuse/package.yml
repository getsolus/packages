# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : fuse
version    : 3.18.3
release    : 20
source     :
    - https://github.com/libfuse/libfuse/releases/download/fuse-3.18.3/fuse-3.18.3.tar.gz : bcd19582c5e30f7fe45dd86a5540e998590aa01903afc7ebcbeea6c8ac5421ee
license    :
    - GPL-2.0-only
    - LGPL-2.1-only
component  : system.utils
homepage   : https://github.com/libfuse/libfuse
summary    : File Systems in User Space
description: |
    File Systems in User Space
builddeps  :
    - libiconv-devel
rundeps    :
    - fuse-common
setup      : |
    %patch -p1 -i $pkgfiles/0001-fusermount-Support-a-stateless-configuration.patch
    %meson_configure \
        -Dudevrulesdir=/usr/lib64/udev/rules.d
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license LICENSE GPL2.txt LGPL2.txt

    install -Dm0644 $pkgfiles/fuse.conf $installdir/usr/share/defaults/fuse/fuse.conf

    rm -rfv $installdir/etc
    rm -rfv $installdir/dev
patterns   :
    - common :
        - /usr/share/defaults/fuse
