# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : framework-system
version    : 0.6.6
release    : 5
source     :
    - https://github.com/FrameworkComputer/framework-system/archive/refs/tags/v0.6.6.tar.gz : 5d285d508cc5b2d1df2d9573dda4a4e6118f1b16a5dcc24e50fc078995e3bb29
homepage   : https://github.com/FrameworkComputer/framework-system
license    : BSD-3-Clause
component  : system.utils
summary    : Tools to interact with the Framework Computer systems
description: |
    Tools to interact with the Framework Computer systems 
builddeps  :
    - rust
networking : true
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %install_bin target/release/framework_tool
    %install_license LICENSE.md

    pushd framework_tool
        %install_file completions/bash/framework_tool ${installdir}/usr/share/bash-completion/completions/framework_tool
        %install_file completions/zsh/_framework_tool ${installdir}/usr/share/zsh/site-functions/_framework_tool
        %install_file completions/fish/framework_tool.fish ${installdir}/usr/share/fish/vendor_completions.d/framework_tool.fish
        %install_file framework_tool.1 ${installdir}/usr/share/man/man1/framework_tool.1
    popd
