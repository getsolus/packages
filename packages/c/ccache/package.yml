# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ccache
version    : 4.14.3
release    : 34
source     :
    - https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3.tar.xz : e1999132cf7dbce48de7d946b767f3e26ea09adcb5daa4a7103a8fa09ee0637d
homepage   : https://ccache.dev/
license    : GPL-3.0-or-later
component  : programming.tools
summary    : compiler cache
description: |
    ccache is a compiler cache. It speeds up recompilation by caching previous compilations and detecting when the same compilation is being done again. Supported languages are C, C++, Objective-C and Objective-C++.
optimize   :
    - lto
    - speed
builddeps  :
    - pkgconfig(fmt)
    - pkgconfig(libblake3)
    - pkgconfig(libxxhash)
    - pkgconfig(libzstd)
    - asciidoctor
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-ccache-Add-vendor-dir.patch

    %cmake_ninja \
        -DCMAKE_INSTALL_SYSCONFDIR="/etc/ccache" \
        -DVENDORDIR="/usr/share/defaults/etc/ccache" \
        -DREDIS_STORAGE_BACKEND=OFF \
        -DENABLE_TESTING=OFF \
        -DDEPS=LOCAL
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license GPL-3.0.txt LICENSE.*

    install -d ${installdir}/%libdir%/ccache/bin

    TGT="${installdir}/%libdir%/ccache/bin"
    for compiler in \
        clang \
        clang++ \
        gcc \
        g++ \
        c++ \
        cc \
        x86_64-solus-linux-gcc \
        x86_64-solus-linux-g++ \
        x86_64-solus-linux-c++ \
        x86_64-solus-linux-cc \
        ; do
        ln -sv /usr/bin/ccache "${TGT}/${compiler}"
    done

    %install_file ${pkgfiles}/ccache.conf -t ${installdir}/usr/share/defaults/etc/ccache
# Need to package doctest before we can re-enable the test-suite
# check      : |
#     %ninja_check
