# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cemu
version    : '2.6'
release    : 22
source     :
    - git|https://github.com/cemu-project/Cemu : v2.6
homepage   : https://cemu.info/
license    : MPL-2.0
component  : games.emulator
summary    : An emulator for the Nintendo Wii U
description: |
    Cemu is an emulator for the Nintendo Wii U console. It is capable of running and debugging homebrew applications, as well as many commercial games.
builddeps  :
    - pkgconfig(RapidJSON)
    - pkgconfig(bluez)
    - pkgconfig(fmt)
    - pkgconfig(gamemode)
    - pkgconfig(glm)
    - pkgconfig(glu)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(libcrypto)
    - pkgconfig(libcubeb)
    - pkgconfig(libcurl)
    - pkgconfig(libpng)
    - pkgconfig(libusb-1.0)
    - pkgconfig(libzip)
    - pkgconfig(libzstd)
    - pkgconfig(pugixml)
    - pkgconfig(sdl2)
    - pkgconfig(wayland-protocols)
    - glslang-devel
    - hidapi-devel
    - libboost-devel
    - wxwidgets-devel
setup      : |
    %patch -p1 -i ${pkgfiles}/fix-nonascii-filename.patch

    # glm fix
    sed -i 's/glm::glm/glm/' src/Common/CMakeLists.txt src/input/CMakeLists.txt

    # hidapi include fix
    sed -i 's/hidapi::hidapi/hidapi-libusb/' src/input/CMakeLists.txt
    sed -i 's/hidapi.h/hidapi\/hidapi.h/' src/input/api/Wiimote/hidapi/HidapiWiimote.h

    %cmake_ninja \
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DCMAKE_BUILD_TYPE=Release \
        -DALLOW_PORTABLE=OFF \
        -DENABLE_VCPKG=OFF
build      : |
    %ninja_build
install    : |
    export cemudir=/usr/share/cemu
    %install_dir ${installdir}/${cemudir}
    %install_dir ${installdir}/usr/bin
    %install_license LICENSE.txt

    cp -R bin/gameProfiles ${installdir}/${cemudir}/
    cp -R bin/resources ${installdir}/${cemudir}/
    %install_exe bin/Cemu_release ${installdir}/${cemudir}/cemu
    ln -s ${cemudir}/cemu ${installdir}/usr/bin/cemu

    %install_file dist/linux/info.cemu.Cemu.png ${installdir}/usr/share/icons/hicolor/128x128/apps/info.cemu.Cemu.png
    sed -i -e '/^Exec=/cExec=cemu' dist/linux/info.cemu.Cemu.desktop
    %install_file dist/linux/info.cemu.Cemu.desktop -t ${installdir}/usr/share/applications
    %install_file dist/linux/info.cemu.Cemu.metainfo.xml -t ${installdir}/usr/share/metainfo
