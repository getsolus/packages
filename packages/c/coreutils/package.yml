# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : coreutils
version    : '9.12'
release    : 46
source     :
    - https://ftpmirror.gnu.org/gnu/coreutils/coreutils-9.12.tar.xz : a480198559733e9b3da999e90543ac6f888a2caa544d8d664c5a1f17e528e210
homepage   : https://www.gnu.org/software/coreutils/
license    : GPL-3.0-or-later
component  : system.base
summary    : GNU core utilities
description: |
    This package contains the basic file, shell and text manipulation utilities which are expected to exist on every operating system.
builddeps  :
    - pkgconfig(libacl)
    - pkgconfig(libattr)
    - pkgconfig(libcap)
    - pkgconfig(libcrypto)
    - gettext-devel # For reconfigure
checkdeps  :
    - gdb
    - strace
    - valgrind
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    # https://github.com/getsolus/packages/pull/10773#issuecomment-5786826926
    %patch -p1 -i ${pkgfiles}/env-printenv-only-quote-when-outputting-to-terminals.patch

    # Force autogen to allow newer gettext
    sed -i 's/0.19.2/0.23/' bootstrap.conf configure.ac

    export FORCE_UNSAFE_CONFIGURE=1
    # Reconfigure due to weird automake errors
    %reconfigure \
        --enable-no-install-program=kill,uptime \
        --enable-systemd
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
# 2025-06-11: Seems to freeze on the build server for unknown reasons
# check      : |
#     # Breaks several tests, and the test suite for coreutils is generally well-behaved. Disable fakeroot
#     unset LD_PRELOAD
#     %make check
