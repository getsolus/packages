# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : composer
version    : 2.10.3
release    : 13
source     :
    - git|https://github.com/composer/composer.git : 2.10.3
homepage   : https://getcomposer.org/
license    : MIT
component  : programming.tools
summary    : Composer helps you declare, manage, and install dependencies of PHP projects.
description: |
    Composer helps you declare, manage, and install dependencies of PHP projects.
networking : true
builddeps  :
    - composer
    - php
rundeps    :
    - git
    - php
setup      : |
    composer install --no-scripts
build      : |
    composer run-script compile
install    : |
    %install_exe ${workdir}/composer.phar ${installdir}/usr/bin/composer
    %install_license LICENSE
