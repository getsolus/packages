# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : certbot
version    : 5.10.0
release    : 35
source     :
    - https://pypi.python.org/packages/source/c/certbot/certbot-5.10.0.tar.gz : 522517720f39b5ddb5a2841bda87f27693a1f58e9fa90d6823c288822cc9a204
homepage   : https://github.com/certbot/certbot
license    : Apache-2.0
component  : security.crypto
summary    : A free, automated certificate authority client
description: |
    Certbot, previously the Let's Encrypt Client, is EFF's tool to obtain certs from Let's Encrypt, and (optionally) auto-enable HTTPS on your server. It can also act as a client for any other CA that uses the ACME protocol.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - pyparsing
    - python-acme
    - python-configargparse
    - python-configobj
    - python-distro
    - python-parsedatetime
    - python-pytest
rundeps    :
    - pyparsing
    - python-acme
    - python-configargparse
    - python-configobj
    - python-distro
    - python-parsedatetime
networking : true # check
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
