# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : certbot
version    : 5.7.0
release    : 32
source     :
    - https://pypi.python.org/packages/source/c/certbot/certbot-5.7.0.tar.gz : c896a0aa3fe1fa1e344002d4a24a5934889a88b8759f41a22b4dcfe5a8e27b94
homepage   : https://github.com/certbot/certbot
license    : Apache-2.0
component  : security.crypto
summary    : A free, automated certificate authority client
description: |
    Certbot, previously the Let's Encrypt Client, is EFF's tool to obtain certs from Let's Encrypt, and (optionally) auto-enable HTTPS on your server. It can also act as a client for any other CA that uses the ACME protocol.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - pyparsing
    - python-acme
    - python-configargparse
    - python-configobj
    - python-distro
    - python-parsedatetime
    - python-pytest
rundeps    :
    - pyparsing
    - python-acme
    - python-configargparse
    - python-configobj
    - python-distro
    - python-parsedatetime
networking : true # check
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
