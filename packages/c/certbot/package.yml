# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : certbot
version    : 5.8.0
release    : 33
source     :
    - https://pypi.python.org/packages/source/c/certbot/certbot-5.8.0.tar.gz : a4a2c7b0459bb626b3791ef07b6df26bbb222d2324783ba3e60f76c0933eec87
homepage   : https://github.com/certbot/certbot
license    : Apache-2.0
component  : security.crypto
summary    : A free, automated certificate authority client
description: |
    Certbot, previously the Let's Encrypt Client, is EFF's tool to obtain certs from Let's Encrypt, and (optionally) auto-enable HTTPS on your server. It can also act as a client for any other CA that uses the ACME protocol.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
checkdeps  :
    - pyparsing
    - python-acme
    - python-configargparse
    - python-configobj
    - python-distro
    - python-parsedatetime
    - python-pytest
rundeps    :
    - pyparsing
    - python-acme
    - python-configargparse
    - python-configobj
    - python-distro
    - python-parsedatetime
networking : true # check
build      : |
    %pyproject_build
install    : |
    %pyproject_install
check      : |
    %pytest -v
