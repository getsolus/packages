# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cfitsio
version    : 4.7.0
release    : 8
source     :
    - https://heasarc.gsfc.nasa.gov/FTP/software/fitsio/c/cfitsio-4.7.0.tar.gz : ce573bbea8e75b429f8c3d3e86498741ba3dc9628a1530d2f65268397ad059e8
homepage   : https://heasarc.gsfc.nasa.gov/fitsio/
license    : MIT
component  : programming.library
summary    : CFITSIO is a library of ANSI C routines for reading and writing FITS format data files.
description: |
    CFITSIO is a library of ANSI C routines for reading and writing FITS format data files.
builddeps  :
    - pkgconfig(libcurl)
setup      : |
    %cmake_ninja
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license licenses/License.txt
patterns   :
    - utils :
        - /usr/bin/cookbook
        - /usr/bin/fitscopy
        - /usr/bin/fitsverify
        - /usr/bin/fpack
        - /usr/bin/funpack
        - /usr/bin/imcopy
        - /usr/bin/smem
        - /usr/bin/speed
