# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cppzmq
version    : 4.11.0
release    : 8
source     :
    - https://github.com/zeromq/cppzmq/archive/v4.11.0.tar.gz : 0fff4ff311a7c88fdb76fceefba0e180232d56984f577db371d505e4d4c91afd
homepage   : https://zeromq.org
license    : MIT
component  : programming
summary    : C++ binding for 0MQ/ZMQ/ZeroMQ
description: |
    C++ binding for 0MQ/ZMQ/ZeroMQ
builddeps  :
    - pkgconfig(libzmq)
rundeps    :
    - zeromq-devel
setup      : |
    %cmake_ninja -DCPPZMQ_BUILD_TESTS=OFF
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE
check      : |
    # This will fail if this version of cppzmq is incompatible with the version of zeromq
    gcc -c zmq.hpp -o ./test.o
patterns   :
    - /*
