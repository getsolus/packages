# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cmus
version    : 2.13.0
release    : 27
source     :
    - https://github.com/cmus/cmus/archive/refs/tags/v2.13.0.tar.gz : 7be478c476f0a9915cdefbf6aade825a40cd202a8ca6b5149399025d3c7fc09b
homepage   : https://cmus.github.io/
license    : GPL-2.0-or-later
component  : multimedia.audio
summary    : Small, fast and powerful console music player for Unix-like operating systems
description: |
    Small, fast and powerful console music player for Unix-like operating systems
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(ao)
    - pkgconfig(faad2)
    - pkgconfig(flac)
    - pkgconfig(libavformat)
    - pkgconfig(libcddb)
    - pkgconfig(libcdio)
    - pkgconfig(libcue)
    - pkgconfig(libmodplug)
    - pkgconfig(libpulse)
    - pkgconfig(mad)
    - pkgconfig(opusfile)
    - pkgconfig(samplerate)
    - pkgconfig(systemd)
    - pkgconfig(vorbis)
    - pkgconfig(wavpack)
    - libiconv-devel
setup      : |
    ./configure prefix=/usr libdir=%libdir% CONFIG_JACK=n
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
