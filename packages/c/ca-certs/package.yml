# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ca-certs
version    : 2026.08.17
release    : 49
source     :
    # There's no actual upstream, but we need *something* here
    - https://sources.getsol.us/hotspot.txt : a12b7cb43c9d9134b5bb1b35e9096b66775d9e92e7611d1cc92b02edd6782a87
extract    : false
homepage   : https://fedoraproject.org/wiki/CA-Certificates
license    : GPL-2.0-or-later
component  : system.base
summary    : Certificate Authority Files
description: |
    The Public Key Infrastructure is used for many security issues in a Linux system. In order for a certificate to be trusted, it must be signed by a trusted agent called a Certificate Authority (CA).
builddeps  :
    - pkgconfig(p11-kit-1)
    - asciidoc
    - ca-certificates-mozilla
rundeps    :
    - ca-certificates-mozilla
build      : |
    cp ${pkgfiles}/update-ca-trust.8.txt .
    a2x -v -f manpage update-ca-trust.8.txt

    bash -c "${pkgfiles}/update-ca-trust -o ${workdir}/extracted"
install    : |
    etcdir="/etc/${package}"
    ssldir="/etc/ssl"
    certsdir="${ssldir}/certs"

    for f in extracted/*.pem extracted/*.crt; do
        %install_file -t ${installdir}/${certsdir} ${f}
    done
    for f in extracted/cadir/*.pem; do
        %install_file -t ${installdir}/${certsdir} ${f}
    done
