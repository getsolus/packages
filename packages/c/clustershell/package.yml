# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : clustershell
version    : 1.10.1
release    : 9
source     :
    - https://github.com/cea-hpc/clustershell/archive/refs/tags/v1.10.1.tar.gz : dc56ba1dcee453914b6ee2783dcee6a5b220db64f8cb91fdfd8a73d57875cfb3
homepage   : https://github.com/cea-hpc/clustershell
license    : LGPL-2.1-or-later
component  : programming.python
summary    : Cluster Shell remote administration tool
description: |
    A program for executing commands in parallel on a cluster and for gathering their results. It can execute commands interactively or can be used within shell scripts and other applications.
builddeps  :
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
build      : |
    %pyproject_build
install    : |
    %pyproject_install
