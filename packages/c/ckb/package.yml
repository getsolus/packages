# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ckb
version    : 0.6.2
release    : 18
source     :
    - https://github.com/ckb-next/ckb-next/archive/v0.6.2.tar.gz : 1e4a15c2b3c5119164fe34560d0418e41679c4227d1a804113285e4d9109598b
homepage   : https://github.com/ckb-next/ckb-next/
license    : GPL-2.0-or-later
component  : system.utils
summary    : An open-source driver for Corsair keyboards and mice
description: |
    ckb-next is an open-source driver for Corsair keyboards and mice. It aims to bring the features of Corsair's proprietary iCUE software to Linux operating systems.
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6Core5Compat)
    - pkgconfig(Qt6UiTools)
    - pkgconfig(quazip1-qt6)
    - pkgconfig(x11)
    - pkgconfig(xcb-ewmh)
setup      : |
    %cmake_ninja \
        -DDISABLE_UPDATER=1 \
        -DFORCE_INIT_SYSTEM=systemd \
        -DPREFER_QT6=ON \
        -DUDEV_RULE_DIRECTORY="%libdir%/udev/rules.d/"
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE
    %install_file -t ${installdir}/usr/share/metainfo ${pkgfiles}/io.github.ckb_next.ckb.metainfo.xml
