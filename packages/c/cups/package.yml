# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cups
version    : 2.4.20
release    : 45
source     :
    - https://github.com/OpenPrinting/cups/releases/download/v2.4.20/cups-2.4.20-source.tar.gz : ab4d9cd7f3e58060091d2b24972223d6401675f11c49b65abf4f6ef31dea22ff
homepage   : https://openprinting.github.io/cups/
license    :
    - Apache-2.0 WITH LLVM-exception
    - BSD-2-Clause
    - BSD-3-Clause
    - Zlib
component  : desktop.core
summary    : The Common Unix Printing System
description: |
    The Common Unix Printing System (CUPS) is a print spooler and associated utilities. It is based on the "Internet Printing Protocol" and provides printing services to most PostScript and raster printers.
emul32     : true
builddeps  :
    - pkgconfig32(avahi-glib)
    - pkgconfig32(dbus-1)
    - pkgconfig32(libacl)
    - pkgconfig32(libattr)
    - pkgconfig32(libcrypto)
    - pkgconfig32(liblzma)
    - pkgconfig32(libudev)
    - pkgconfig32(libusb-1.0)
    - pkgconfig32(libzstd)
    - pkgconfig32(pam)
    - libgcrypt-32bit
    - libpaper-32bit-devel
rundeps    :
    - 32bit-devel : openssl-32bit-devel
clang      : true
setup      : |
    %apply_patches
    # Patch to fix build failure introduced in 2.4.20 re-check in next release
    %patch -p1 -i ${pkgfiles}/fix-getdata-cups.2.4.20.patch

    ex_opts=""
    if [[ ! -z "${EMUL32BUILD}" ]]; then
        ex_opts="--with-dnssd=no"
    else
        ex_opts="--with-dnssd=avahi"
    fi

    %configure \
               --prefix=/usr \
               --enable-libpaper \
               --enable-pam=yes \
               --enable-raw-printing=yes \
               --enable-relro \
               --enable-sync-on-close \
               --disable-gssapi \
               --with-cups-user=lp \
               --with-cups-group=lp \
               --with-dbusdir=/usr/share/dbus-1 \
               --with-cupsd-file-perm=0755 \
               --with-exe-file-perm=0755 \
               --with-ondemand=systemd \
               --with-system-groups="lpadmin root wheel" \
               --with-rundir=/run/cups \
               --without-rcdir \
               $ex_opts
build      : |
    %make
install    : |
    %make_install BUILDROOT=${installdir}

    mv ${installdir}/usr/lib/pkgconfig ${installdir}/%libdir%

    if [[ ! -z "${EMUL32BUILD+set}" ]]; then
        # Delete everything except for the libs
        rm -rfv ${installdir}/{etc,run,usr/bin,usr/include,usr/lib,usr/sbin,usr/share,var}
        exit 0
    fi

    %install_file ${pkgfiles}/cups.sysusers ${installdir}/%libdir%/sysusers.d/cups.conf
    %install_file ${pkgfiles}/cups.tmpfiles ${installdir}/%libdir%/tmpfiles.d/cups.conf
    %install_file -t ${installdir}/%libdir%/systemd/system-preset/ ${pkgfiles}/20-cups.preset


    # fix .desktop file
    sed -i 's|^Exec=htmlview http://localhost:631/|Exec=xdg-open http://localhost:631/|g' ${installdir}/usr/share/applications/cups.desktop

    %install_file ${pkgfiles}/cups.pam ${installdir}/usr/share/defaults/etc/pam.d/cups
    ln -srf ${installdir}/usr/share/defaults/etc/pam.d/cups ${installdir}/usr/share/defaults/etc/pam.d/cups.N

    %install_dir ${installdir}/usr/share/defaults/cups/
    mv ${installdir}/etc/cups/{cups-files,cupsd,snmp}.conf ${installdir}/usr/share/defaults/cups/
    chmod a+r ${installdir}/usr/share/defaults/cups/*.conf
    rm -rfv ${installdir}/{etc,run,var}
    find ${installdir} -type d -empty -print -delete

    %install_license LICENSE
patterns   :
    - devel :
        - /usr/bin/cups-config
        - /usr/share/man/man1/cups-config.*
