# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cdrdao
version    : 1.2.6
release    : 9
source     :
    - https://github.com/cdrdao/cdrdao/archive/refs/tags/rel_1_2_6.tar.gz : ba3eadcae7b62a709e9e23988d7fb41f822c408dcec9bd99ff1a343d1bcbc524
homepage   : https://cdrdao.sourceforge.net/
license    : GPL-2.0-or-later
component  : programming
summary    : Records audio or data CD-Rs in disk-at-once (DAO) mode
description: |
    Cdrdao records audio or data CD-Rs in disk-at-once (DAO) mode based on a textual description of the CD contents (toc-file).
builddeps  :
    - pkgconfig(ao)
    - pkgconfig(vorbis)
    - lame-devel
    - libmad-devel
setup      : |
    %reconfigure \
        --with-mp3-support \
        --with-ogg-support
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING
