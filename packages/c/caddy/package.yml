# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : caddy
version    : 2.11.9
release    : 29
source     :
    - https://github.com/caddyserver/caddy/archive/refs/tags/v2.11.9.tar.gz : fefbe1f72b7a7e244f348c20eba377bb1e6964f51594229d2f38c49eaa2aa9a4
    - git|https://github.com/caddyserver/dist.git : f94a1d2626835ff4157e85296fb8e4fa5500e0fb
homepage   : https://caddyserver.com
license    : Apache-2.0
component  : programming
summary    : Fast, multi-platform web server with automatic HTTPS
description: |
    Caddy is a powerful, open source web server with automatic HTTPS written in Go
networking : true
builddeps  :
    - golang
environment: |
    export CGO_LDFLAGS=${LDFLAGS}
    export CGO_CPPFLAGS=${CPPFLAGS}
    export CGO_CFLAGS=${CFLAGS}
    export CGO_CXXFLAGS=${CXXFLAGS}
    export GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw -buildvcs=false"
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Disable-commands-that-can-alter-the-binary.patch

    cp -a ${sources}/dist* dist
    %patch -p1 -i ${pkgfiles}/0001-Tweak-welcome-site-for-Solus.patch

    go mod vendor -v
build      : |
    ld_flags=" \
        -X github.com/caddyserver/caddy/v2.CustomVersion=v${version} \
        -compressdwarf=false \
        -linkmode=external \
    "

    go build \
        -v \
        -ldflags "${ld_flags}" \
        -o bin/caddy \
        ./cmd/caddy

    # Generate completions
    mkdir completions
    for i in bash zsh fish; do
        ./bin/caddy completion ${i} > ${package}.${i}
    done
install    : |
    %install_bin bin/caddy
    %install_license LICENSE

    %install_file ${pkgfiles}/${package}.sysusers ${installdir}/%libdir%/sysusers.d/${package}.conf
    %install_file ${pkgfiles}/${package}.tmpfiles ${installdir}/%libdir%/tmpfiles.d/${package}.conf

    # Install systemd services and default config
    %install_file dist/init/caddy.service dist/init/caddy-api.service -t ${installdir}/%libdir%/systemd/system
    %install_file ${pkgfiles}/${package}.preset ${installdir}/%libdir%/systemd/system-preset/60-${package}.preset
    %install_file dist/config/Caddyfile ${installdir}/usr/share/caddy/Caddyfile

    # Install default welcome page
    %install_file dist/welcome/index.html ${installdir}/usr/share/caddy/index.html

    # Install manpages
    ./bin/caddy manpage --directory ${installdir}/usr/share/man/man8

    # Install completions
    %install_file ${package}.bash "${installdir}/usr/share/bash-completion/completions/${package}"
    %install_file ${package}.zsh "${installdir}/usr/share/zsh/site-functions/_${package}"
    %install_file ${package}.fish "${installdir}/usr/share/fish/vendor_completions.d/${package}.fish"
check      : |
    # ensure that the version was embedded correctly
    [[ "$(./bin/caddy version)" == "v${version}" ]] || exit 1

    go test --short ./...
