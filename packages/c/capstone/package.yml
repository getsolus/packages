# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : capstone
version    : 5.0.9
release    : 5
source     :
    - https://github.com/capstone-engine/capstone/releases/download/5.0.9/capstone-5.0.9.tar.xz : 1b70351879f6998998ebcbe09bd5f3c5e27127e985af14722cbe52c11c35178e
license    : BSD-3-Clause
component  : programming.library
homepage   : https://www.capstone-engine.org/
summary    : Disassembly/disassembler framework
description: |
    Capstone is a disassembly framework with the target of becoming the ultimate disasm engine for binary analysis and reversing in the security community.
setup      : |
    %cmake_ninja -DBUILD_SHARED_LIBS=ON \
                 -DBUILD_STATIC_LIBS=OFF
build      : |
    %ninja_build
install    : |
    %install_license LICENSE.TXT
    %ninja_install
check      : |
    %ninja_check
