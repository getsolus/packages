# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cryptsetup
version    : 2.8.9
release    : 31
source     :
    - https://gitlab.com/cryptsetup/cryptsetup/-/archive/v2.8.9/cryptsetup-v2.8.9.tar.gz : 98fa506dfa8a2ac7434bc6abd5403cc1e2fc29d06307211a57b8cae77ad37889
homepage   : https://gitlab.com/cryptsetup/cryptsetup
license    :
    - GPL-2.0-or-later
    - LGPL-3.0-or-later
component  :
    - libs : system.base
    - ssh-token : security.crypto
    - system.base
summary    :
    - libs : Library files for cryptsetup
    - ssh-token : Cryptsetup LUKS2 SSH token
    - Utility to setup disk encryption using DMCrypt
description:
    - libs : Library files for cryptsetup, typically pulled in as a dependency of another package.
    - ssh-token : This package contains the LUKS2 SSH token.
    - Cryptsetup is utility used to conveniently setup disk encryption based on DMCrypt kernel module. These include plain dm-crypt volumes, LUKS volumes, loop-AES and TrueCrypt (including VeraCrypt extension) format. Project also includes veritysetup utility used to conveniently setup DMVerity block integrity checking kernel module.
builddeps  :
    - pkgconfig(devmapper)
    - pkgconfig(json-c)
    - pkgconfig(libgcrypt)
    - pkgconfig(libssh)
    - pkgconfig(nss)
    - pkgconfig(openssl)
    - pkgconfig(popt)
    - pkgconfig(systemd)
    - asciidoctor
rundeps    :
    - devel :
        - json-c-devel
optimize   :
    - size
    - lto
setup      : |
    %meson_configure \
        -Dargon-implementation=internal \
        -Dinternal-sse-argon2=true \
        -Dssh-token=true
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING
patterns   :
    - libs :
        - /usr/lib64/libcryptsetup.so.*
        - /usr/lib/tmpfiles.d/cryptsetup.conf
        - /usr/share/locale
    - ssh-token :
        - /usr/lib64/cryptsetup/libcryptsetup-token-ssh.so
        - /usr/sbin/cryptsetup-ssh
        - /usr/share/man/man8/cryptsetup-ssh.8*
