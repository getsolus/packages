# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cargo-about
version    : 0.9.3
release    : 1
source     :
    - https://github.com/EmbarkStudios/cargo-about/archive/refs/tags/0.9.3.tar.gz : b0045ab03510136e2c1678576eba56b25e4539f925693fc9443e384cdd654e8e
license    :
    - Apache-2.0
    - MIT
component  : programming.devel
homepage   : https://github.com/EmbarkStudios/cargo-about
summary    : Cargo plugin for generating a license listing for all dependencies of a crate
description: |
    Cargo plugin for generating a license listing for all dependencies of a crate
builddeps  :
    - rust
networking : true
setup      : |
    %cargo_fetch
build      : |
    %cargo_build --bin cargo-about --features cli
install    : |
    ls -l
    %cargo_install
    %install_license LICENSE-*
check      : |
    %cargo_test
