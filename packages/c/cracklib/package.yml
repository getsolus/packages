# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cracklib
version    : 2.10.4
release    : 11
source     :
    - https://github.com/cracklib/cracklib/releases/download/v2.10.4/cracklib-2.10.4.tar.xz : 503573391cfea3e1fca0b7ea0011c887f87f49cf2a97db9a54f92094e604b82b
    - https://github.com/cracklib/cracklib/releases/download/v2.10.4/cracklib-words-2.10.4.xz#cracklib-words.xz : b3d1e0e0ae9bc7ffed65c0042d7c68bdb903368aa6b918f94572453c6ea874dc
homepage   : https://github.com/cracklib/cracklib
license    :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
component  : security.library
summary    : A ProActive Password Sanity Library
description: |
    The CrackLib package contains a library used to enforce strong passwords by comparing user selected passwords to words in chosen word lists.
environment: |
    _dict_dir="/usr/share/${package}"
    _dict_path="${_dict_dir}/pw_dict"
setup      : |
    unxz -d ${sources}/cracklib-words.xz -c > cracklib-words

    %configure \
        --disable-static \
        --with-default-dict="${_dict_path}" \
        --without-python
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING.LIB

    # Generate and pack cracklib dictionaries
    ./util/cracklib-format cracklib-words | \
        ./util/cracklib-packer ${installdir}/${_dict_path}
    ./util/cracklib-format ${installdir}/${_dict_dir}/cracklib-small | \
        ./util/cracklib-packer ${installdir}/${_dict_dir}/cracklib-small

    # Symlink cracklib-small
    %install_dir ${installdir}/usr/share/dict
    ln -sf ${_dict_dir}/cracklib-small ${installdir}/usr/share/dict/cracklib-small
check      : |
    %make check
