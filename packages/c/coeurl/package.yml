# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : coeurl
version    : 0.3.2
release    : 8
source     :
    - https://nheko.im/nheko-reborn/coeurl/-/archive/v0.3.2/coeurl-v0.3.2.tar.gz : 84c1d76116bd118ee2c3a1c7913e2f2f7b20fff34628d09bd86eb349bfdaf1a7
license    : MIT
homepage   : https://nheko-reborn.github.io/
component  : network.im
summary    : A simple async wrapper around CURL for C++
description: |
    A simple async wrapper around CURL for C++
builddeps  :
    - pkgconfig(libcurl)
    - pkgconfig(libevent_core)
    - pkgconfig(spdlog)
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE
