# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cairomm-1.16
version    : 1.18.1
release    : 3
source     :
    - https://www.cairographics.org/releases/cairomm-1.18.1.tar.xz : e0e996a979ee52c840dca3ee74f5d005e3259b94ddce58f255d3b6f47c8cb41d
homepage   : https://cairographics.org/cairomm
license    : LGPL-2.0-or-later
component  : desktop.library
summary    : C++ bindings to cairo.
description: |
    C++ bindings to cairo
builddeps  :
    - pkgconfig(cairo)
    - pkgconfig(sigc++-3.0)
    - doxygen
    - graphviz
patterns   :
    - docs :
        - /usr/share/devhelp
        - /usr/share/doc
    - devel :
        - /usr/lib64/cairomm-1.16
setup      : |
    %meson_configure -Dbuild-documentation=true
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
