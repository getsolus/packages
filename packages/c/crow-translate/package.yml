# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : crow-translate
version    : 4.1.0
release    : 37
source     :
    - https://download.kde.org/stable/crow-translate/4.1.0/crow-translate-4.1.0.tar.gz : 70cab22a089aa976627fb0f04ea2bf2e918a138c36ff0337d4a7709ea5462fa3
homepage   : https://apps.kde.org/crowtranslate
license    :
    - BSD-3-Clause
    - GPL-3.0-or-later
    - MIT
component  : office
summary    : Application that allows you to translate and speak text
description: |
    Application written in C++ / Qt6 that allows you to translate and speak text using Mozhi with multiple TTS providers including high-quality neural text-to-speech.
builddeps  :
    - pkgconfig(KWaylandClient)
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6Linguist)
    - pkgconfig(Qt6Multimedia)
    - pkgconfig(Qt6StateMachine)
    - pkgconfig(Qt6TextToSpeech)
    - pkgconfig(tesseract)
    - pkgconfig(x11)
    - extra-cmake-modules
    - kf6-kiconthemes-devel
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_ninja -DWITH_PIPER_TTS=OFF #Package onnxruntime for enablement
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
