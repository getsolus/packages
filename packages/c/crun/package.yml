# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : crun
version    : 1.30.1
release    : 6
source     :
    - https://github.com/containers/crun/releases/download/1.30.1/crun-1.30.1.tar.zst : d62b89a82520a553edf63fd3ae11275be6f16ec86ed90d8ef7b113d06b239fa2
homepage   : https://github.com/containers/crun
license    :
    - GPL-2.0-only
    - LGPL-2.1-only
component  : virt
summary    : A fast and low-memory footprint OCI Container Runtime fully written in C.
description: |
    - A fast and lightweight fully featured OCI runtime and C library for running containers
builddeps  :
    - pkgconfig(json-c)
    - pkgconfig(libcap-ng)
    - pkgconfig(libseccomp)
    - pkgconfig(libsystemd)
    - go-md2man
    - gperf
setup      : |
    %configure \
        --enable-shared \
        --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING*
