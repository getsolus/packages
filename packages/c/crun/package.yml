# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : crun
version    : 1.29.1
release    : 5
source     :
    - https://github.com/containers/crun/releases/download/1.29.1/crun-1.29.1.tar.zst : 0fc095f629b6bba010b0cfa8b25ca1f769455e8891e06eb62c829ddc92ea2cad
homepage   : https://github.com/containers/crun
license    :
    - GPL-2.0-only
    - LGPL-2.1-only
component  : virt
summary    : A fast and low-memory footprint OCI Container Runtime fully written in C.
description: |
    - A fast and lightweight fully featured OCI runtime and C library for running containers
builddeps  :
    - pkgconfig(json-c)
    - pkgconfig(libcap-ng)
    - pkgconfig(libseccomp)
    - pkgconfig(libsystemd)
    - go-md2man
    - gperf
setup      : |
    %configure \
        --enable-shared \
        --disable-static
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING*
