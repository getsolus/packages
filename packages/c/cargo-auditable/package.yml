# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cargo-auditable
version    : 0.7.6
release    : 4
source     :
    - https://github.com/rust-secure-code/cargo-auditable/archive/refs/tags/v0.7.6.tar.gz : 04cb1c742bdd2ed0ddbb0e05a89dba24a00391c9145ef357c23ff653eba8c166
license    :
    - Apache-2.0
    - MIT
component  : security
homepage   : https://github.com/rust-secure-code/cargo-auditable
summary    : Build dependency information into Rust binaries
description: |
    A cargo-subcommand to make production Rust binaries auditable
builddeps  :
    - rust
networking : true
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install
    %install_file cargo-auditable/cargo-auditable.1 -t $installdir/usr/share/man/man1
    %install_license LICENSE-*
check      : |
    %cargo_test -- --skip "test_wasm"
