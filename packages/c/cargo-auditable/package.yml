# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cargo-auditable
version    : 0.7.7
release    : 5
source     :
    - https://github.com/rust-secure-code/cargo-auditable/archive/refs/tags/v0.7.7.tar.gz : cab2a4b65cfde0734c98416740d24d4e3f03441ea8a0b385f0431e35244a05aa
license    :
    - Apache-2.0
    - MIT
component  : security
homepage   : https://github.com/rust-secure-code/cargo-auditable
summary    : Build dependency information into Rust binaries
description: |
    A cargo-subcommand to make production Rust binaries auditable
builddeps  :
    - rust
networking : true
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install
    %install_file cargo-auditable/cargo-auditable.1 -t $installdir/usr/share/man/man1
    %install_license LICENSE-*
check      : |
    %cargo_test -- --skip "test_wasm"
