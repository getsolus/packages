# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cpu-x
version    : 5.4.1
release    : 24
source     :
    - https://github.com/TheTumultuousUnicornOfDarkness/CPU-X/archive/refs/tags/v5.4.1.tar.gz : 40c34c0ac14eead0f9626518e0783fd9f365af84aa05761e39795c07086f3fef
license    : GPL-3.0-or-later
component  : system.utils
homepage   : https://thetumultuousunicornofdarkness.github.io/CPU-X/
summary    : Gathers information on CPU, motherboard and more
description: |
    CPU-X is a Free software that gathers information on CPU, motherboard and more.
    CPU-X is similar to CPU-Z, but CPU-X is a Free and Open Source software designed for GNU/Linux; also, it works on *BSD.
    It can be used in graphical mode by using GTK or in text-based mode by using NCurses. A dump mode is present from command line.
builddeps  :
    - pkgconfig(OpenCL)
    - pkgconfig(gtkmm-3.0)
    - pkgconfig(libcpuid)
    - pkgconfig(libpci)
    - pkgconfig(libproc2)
    - pkgconfig(vulkan)
    - vulkan-headers
setup      : |
    %cmake_ninja -DGSETTINGS_LOCALINSTALL=OFF
build      : |
    %ninja_build
install    : |
    %ninja_install

