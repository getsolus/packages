# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cloc
version    : '2.10'
release    : 7
source     :
    - https://github.com/AlDanial/cloc/archive/refs/tags/v2.10.tar.gz : a8fac35f4cf42728765580ba11afc2568ad205509a22204663f526169548436d
license    : GPL-2.0-or-later
component  : programming.tools
homepage   : https://github.com/AlDanial/cloc/
summary    : Count lines of code in many programming languages
description: |
    cloc counts blank lines, comment lines, and physical lines of source code in many programming languages.
builddeps  :
    - perl-algorithm-diff
    - perl-digest-md5
    - perl-parallel-forkmanager
    - perl-regexp-common
rundeps    :
    - perl-algorithm-diff
    - perl-digest-md5
    - perl-parallel-forkmanager
    - perl-regexp-common
install    : |
    %make_install -C Unix
    %install_license Unix/COPYING
