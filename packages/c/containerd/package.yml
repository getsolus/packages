# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : containerd
version    : 2.3.5
release    : 77
source     :
    - https://github.com/containerd/containerd/archive/refs/tags/v2.3.5.tar.gz : a99a4dca98061064ff4cb35d27d1ec2345717e9108c822329fcec91dc72bff96
homepage   : https://containerd.io/
license    : Apache-2.0
component  : virt
summary    : A daemon to control OCI container runtimes
description: |
    A daemon to control OCI container runtimes
builddeps  :
    - btrfs-progs-devel
    - git
    - go-md2man
    - golang
rundeps    :
    - runc
networking : true
environment: |
    export GO111MODULE=auto

    export GOFLAGS="-trimpath -mod=readonly -modcacherw"
    export EXTRA_LDFLAGS="-buildid="
    export VERSION=v$version

    unset LDFLAGS
setup      : |
    sed -i 's|/usr/local/bin/containerd|/usr/bin/containerd|' containerd.service

    go mod vendor
build      : |
    set -e
    export GITCOMMIT="$(git ls-remote https://github.com/containerd/containerd.git refs/tags/v$version^{} | awk '{print $1}')"

    mkdir -p src/github.com/containerd
    ln -s `pwd` src/github.com/containerd/containerd
    pushd src/github.com/containerd/containerd

    %make GO_BUILD_FLAGS="$GOFLAGS" REVISION=$GITCOMMIT binaries man
install    : |
    %make_install PREFIX=/usr/
    %install_license LICENSE

    # Install the service file, but disable it by default
    %install_file containerd.service ${installdir}/%libdir%/systemd/system/containerd.service
    %install_file ${pkgfiles}/containerd.preset ${installdir}/%libdir%/systemd/system-preset/containerd.preset

    # Shell Completions
    %install_file contrib/autocomplete/ctr ${installdir}/usr/share/bash-completion/completions/ctr
    %install_file contrib/autocomplete/zsh_autocomplete ${installdir}/usr/share/zsh/site-functions/_ctr

    # Man pages
    %install_file man/*.8 -t ${installdir}/usr/share/man/man8
    %install_file man/*.5 -t ${installdir}/usr/share/man/man5
