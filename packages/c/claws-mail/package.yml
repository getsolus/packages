# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : claws-mail
version    : 4.4.0
release    : 48
source     :
    - https://www.claws-mail.org/releases/claws-mail-4.4.0.tar.xz : 03e0549d5f0fcd7a59804186524105d05ebb5e534d42a4b86a9a90f729ca255b
homepage   : https://claws-mail.org/
license    : GPL-3.0-or-later
component  : network.mail
summary    : A GTK+ based, lightweight, and fast e-mail client
description: |
    A GTK+ based, lightweight, and fast e-mail client
builddeps  :
    - pkgconfig(enchant-2)
    - pkgconfig(gnutls)
    - pkgconfig(gpgme)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(ldap)
    - pkgconfig(libarchive)
    - pkgconfig(libassuan)
    - pkgconfig(libcanberra-gtk)
    - pkgconfig(libcurl)
    - pkgconfig(libetpan)
    - pkgconfig(libical)
    - pkgconfig(libnotify)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(poppler)
    - pkgconfig(pygobject-3.0)
    - pkgconfig(python3)
    - pkgconfig(sm)
    - gnupg
    - perl
rundeps    :
    - perl
setup      : |
    %patch -p1 -i ${pkgfiles}/libical-4.patch

    # I have no idea why this is needed. `configure` should have received this flag from pkg-config.
    export LIBETPAN_LIBS='-letpan'
    %configure \
        --disable-static \
        --enable-libsm \
        --enable-svg \
        --disable-bsfilter-plugin \
        --enable-crash-dialog
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING

    %install_file ${pkgfiles}/org.claws_mail.Claws-Mail.appdata.xml -t ${installdir}/usr/share/metainfo
