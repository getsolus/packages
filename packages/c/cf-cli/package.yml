# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cf-cli
version    : 8.19.1
release    : 10
source     :
    - git|https://github.com/cloudfoundry/cli.git : v8.19.1
homepage   : https://github.com/cloudfoundry/cli
license    : Apache-2.0
component  : network.util
networking : true
summary    : The official command line client for Cloud Foundry
description: |
    The official command line client for Cloud Foundry
builddeps  :
    - git
    - golang
setup      : |
    mkdir -p src/code.cloudfoundry.org/cli
    find ${workdir}/* -maxdepth 0 ! -name "src" -exec mv -v {} src/code.cloudfoundry.org/cli/ \;
build      : |
    export GOPATH=${workdir}
    export PATH=$PATH:$GOPATH/bin
    cd ${workdir}/src/code.cloudfoundry.org/cli/
    %make build
install    : |
    %install_bin src/code.cloudfoundry.org/cli/out/cf
    %install_license src/code.cloudfoundry.org/cli/LICENSE
