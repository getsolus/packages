# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : calamares
version    : 3.4.3
release    : 57
source     :
    - https://codeberg.org/Calamares/calamares/releases/download/v3.4.3/calamares-3.4.3.tar.gz : 144cbbf6bdcebfb21685950db4f0777218519df095f62f4aa392f28348110d18
homepage   : https://calamares.io
license    :
    - BSD-2-Clause
    - CC-BY-4.0
    - CC0-1.0
    - GPL-3.0-or-later
    - LGPL-2.1-only
    - LGPL-3.0-or-later
    - MIT
component  : system
summary    : Distribution-independent installer framework
description: |
    Calamares is a distribution-independent system installer, with an advanced partitioning feature for both manual and automated partitioning operations. Calamares is designed to be customizable by distribution maintainers without the need for cumbersome patching, thanks to third-party branding and external modules support.
builddeps  :
    - pkgconfig(Qt6Core)
    - pkgconfig(Qt6Quick)
    - pkgconfig(Qt6Svg)
    - pkgconfig(Qt6UiTools)
    - pkgconfig(icu-i18n)
    - pkgconfig(libparted)
    - pkgconfig(polkit-qt6-1)
    - pkgconfig(pwquality)
    - pkgconfig(python3)
    - pkgconfig(yaml-cpp)
    - kf6-kconfig-devel
    - kf6-kcoreaddons-devel
    - kf6-kcrash-devel
    - kf6-kdbusaddons-devel
    - kf6-ki18n-devel
    - kf6-kparts-devel
    - kf6-kwidgetsaddons-devel
    - kpmcore-devel
    - libboost-devel
    - python-jsonschema
rundeps    :
    - rsync
setup      : |
    %apply_patches

    %cmake_ninja \
        -DWITH_QT6:BOOL=true
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSES/*

    %install_bin ${pkgfiles}/calamares-gui

    calamares_dir=${installdir}/usr/share/calamares
    find ${pkgfiles}/install -type f | while read fname; do
        %install_file "$fname" "${calamares_dir}${fname##${pkgfiles}/install}"
    done

    %install_file -t ${installdir}/usr/share/polkit-1/rules.d ${pkgfiles}/10-livecd.rules
