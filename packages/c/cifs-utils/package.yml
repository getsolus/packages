# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : cifs-utils
version    : '7.9'
release    : 23
source     :
    - https://www.samba.org/ftp/linux-cifs/cifs-utils/cifs-utils-7.9.tar.bz2 : 9f3750f402520b15c2c8eb52fd485df6ea77e5e66fe5e39ce8ac4386c32c0296
homepage   : https://wiki.samba.org/index.php/LinuxCIFS_utils
license    : GPL-3.0-only
component  : network.utils
summary    : CIFS Filesystem Utilities
description: |
    Utilities for doing and managing mounts of the Linux CIFS filesystem.
builddeps  :
    - pkgconfig(keyutils)
    - pkgconfig(krb5)
    - pkgconfig(libcap-ng)
    - pkgconfig(smbclient)
    - pkgconfig(talloc)
    - python-docutils
setup      : |
    %reconfigure
build      : |
    %make
install    : |
    %make_install ROOTSBINDIR=/usr/sbin
    %install_license COPYING
