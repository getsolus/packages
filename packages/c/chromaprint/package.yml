# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : chromaprint
version    : 1.6.1
release    : 16
source     :
    - https://github.com/acoustid/chromaprint/archive/refs/tags/v1.6.1.tar.gz : 
        7065ec9db48ac1fa929ec6c42afcd966605b1bfe48b6d5e64c25378a05f4fb02
license    : LGPL-2.1-or-later
component  : programming.library
homepage   : https://acoustid.org/chromaprint
summary    : Audio source fingerprint extraction library
description: |
    Library that implements a custom algorithm for extracting fingerprints from any audio source
builddeps  :
    - pkgconfig(libavutil)
    - pkgconfig(taglib)
    - libboost-devel
checkdeps  :
    - pkgconfig(gtest)
setup      : |
    %cmake_ninja -DBUILD_TESTS=ON \
                 -DBUILD_TOOLS=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSE.md
check      : |
    %ninja_check %JOBS% -C solusBuildDir
