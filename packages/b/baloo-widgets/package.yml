# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : baloo-widgets
version    : 26.08.2
release    : 107
source     :
    - https://download.kde.org/stable/release-service/26.08.2/src/baloo-widgets-26.08.2.tar.xz : 445efd6a8e9aafcd2a86dd47ecc5459c39054303ba650c898893cde8db2f5bf6
homepage   : https://community.kde.org/Baloo
license    :
    - GPL-2.0-only
    - GPL-3.0-only
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0-only
component  : desktop.kde
summary    : Widgets for the Baloo search engine
description: |
    Widgets for the Baloo search engine.
builddeps  :
    - kf6-baloo-devel
    - kf6-kio-devel
    - qt6-base-private-devel
clang      : true
optimize   :
    - speed
    - thin-lto
setup      : |
    %cmake_kf6
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license LICENSES/*
