# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : baloo-widgets
version    : 26.08.1
release    : 106
source     :
    - https://download.kde.org/stable/release-service/26.08.1/src/baloo-widgets-26.08.1.tar.xz : b4af5cc65d886ab9d2a807254e11295e585d7cedd993d2b3b78f2f17e3a7f544
homepage   : https://community.kde.org/Baloo
license    :
    - GPL-2.0-only
    - GPL-3.0-only
    - LGPL-2.0-only
    - LGPL-2.0-or-later
    - LGPL-2.1-only
    - LGPL-2.1-or-later
    - LGPL-3.0-only
component  : desktop.kde
summary    : Widgets for the Baloo search engine
description: |
    Widgets for the Baloo search engine.
builddeps  :
    - kf6-baloo-devel
