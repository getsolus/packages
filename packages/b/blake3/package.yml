# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : blake3
version    : 1.8.7
release    : 7
source     :
    - https://github.com/BLAKE3-team/BLAKE3/archive/refs/tags/1.8.7.tar.gz : c6782a28842b1c0478524ac06a4f2ede784038ee298d6e2162c0b089c4306a3c
homepage   : https://github.com/BLAKE3-team/BLAKE3
license    : Apache-2.0
component  :
    - system.devel
    - ^b3sum : system.utils
summary    :
    - A very fast cryptographic hash algorithm
    - ^b3sum : Command line implementation of the BLAKE3 hash function
description:
    - A very fast cryptographic hash algorithm
    - ^b3sum : Command line implementation of the BLAKE3 hash function
networking : true
builddeps  :
    - rust
setup      : |
    pushd c
    %cmake_ninja -DBUILD_SHARED_LIBS=ON
    popd

    cd b3sum
    %cargo_fetch
build      : |
    pushd c
    %ninja_build
    popd

    cd b3sum
    %cargo_build
install    : |
    %install_license LICENSE*
    pushd c
    %ninja_install
    popd

    cd b3sum
    %cargo_install b3sum
patterns   :
    - ^b3sum :
        - /usr/bin/b3sum
