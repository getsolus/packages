# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : bluez
version    : '5.88'
release    : 67
source     :
    - https://www.kernel.org/pub/linux/bluetooth/bluez-5.88.tar.xz : 6952c39eb5f8b0ee712cc50ab3bcff03be17c410dd97ca640f4849d9a1653ba3
homepage   : https://bluez.github.io/
license    :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
component  : system.utils
summary    : Official Linux Bluetooth protocol stack.
description: |
    The Bluetooth wireless technology is a worldwide specification for a small-form factor, low-cost radio solution that provides links between mobile computers, mobile phones, other portable handheld devices, and connectivity to the Internet. The specification is developed, published and promoted by the Bluetooth Special Interest Group (SIG). BlueZ provides support for the core Bluetooth layers and protocols. It is flexible, efficient and uses a modular implementation.
builddeps  :
    - pkgconfig(cups)
    - pkgconfig(libical)
    - pygments
    - python-docutils
setup      : |
    %apply_patches
    %reconfigure \
        --enable-cups \
        --enable-experimental \
        --enable-hid2hci \
        --enable-library \
        --enable-nfc \
        --enable-sixaxis \
        --enable-tools \
        --with-dbusconfdir=/usr/share \
        --with-vendordir=/usr/share/defaults/bluetooth
build      : |
    %make
install    : |
    %make_install
    %install_license COPYING COPYING.LIB

    %install_file ${pkgfiles}/bluez.preset ${installdir}/%libdir%/systemd/system-preset/60-${package}.preset
    ln -sv bluetooth.service ${installdir}/usr/lib/systemd/system/dbus-org.bluez.service

    # stateless
    %install_dir ${installdir}/usr/share/defaults/bluetooth
    mv ${installdir}/etc/bluetooth/{input.conf,main.conf,network.conf} ${installdir}/usr/share/defaults/bluetooth
    rmdir -v ${installdir}/etc/bluetooth \
             ${installdir}/etc/
