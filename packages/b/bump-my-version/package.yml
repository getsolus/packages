# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : bump-my-version
version    : 1.5.1
release    : 1
source     :
    - https://github.com/callowayproject/bump-my-version/releases/download/1.5.1/bump_my_version-1.5.1.tar.gz : 5079e443ab8c9a9903f140b427ff9f6fe8dd54013a55a4cf48b89326f3a71c07
homepage   : https://github.com/callowayproject/bump-my-version
license    : MIT
component  : system.utils
summary    : Version-bump your software with a single command!
description: |
    A small command line tool to simplify releasing software by updating all version strings in your source code by the correct increment and optionally commit and tag the changes.
builddeps  :
    - python-build
    - python-hatchling
    - python-installer
    - python-setuptools
rundeps    :
    - python-httpx2
    - python-pydantic-settings
    # python-questionary
    - python-rich-click
    - python-tomlkit
    # python-wcmatch
build      : |
    %python3_setup
install    : |
    %python3_install
replaces   :
    - bumpversion
