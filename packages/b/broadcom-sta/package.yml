# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : broadcom-sta
version    : 6.30.223.271
release    : 471
source     :
    - https://docs.broadcom.com/docs-and-downloads/docs/linux_sta/hybrid-v35_64-nodebug-pcoem-6_30_223_271.tar.gz#broadcom.tar.gz : 
        5f79774d5beec8f7636b59c0fb07a03108eef1e3fd3245638b20858c714144be
    - https://salsa.debian.org/broadcom-sta-team/broadcom-sta/-/raw/debian/README.txt :
        4d6d63f6eb40f84359be06f1f6f26075827a0d25cdaa364d8ccb6561bf162e34
extract    : false
homepage   : https://www.broadcom.com/support/download-search?pf=Wireless+LAN+Infrastructure
license    : Distributable
component  :
    - kernel.drivers
    - common : kernel.drivers
    - current : kernel.drivers
    - modaliases : kernel.drivers
summary    :
    - Broadcoms IEEE 802.11a/b/g/n hybrid Linux device driver
    - common : Common components for broadcom-sta drivers
    - current : broadcom-sta for linux-current kernel
    - modaliases : These files are used by the Software Center for hardware detection.
description: |
    Broadcoms IEEE 802.11a/b/g/n hybrid Linux device driver
builddeps  :
    - pkgconfig(libelf)
    - linux-current
    - linux-current-headers
    - linux-lts
    - linux-lts-headers
rundeps    :
    - broadcom-sta-common
    - current :
        - broadcom-sta-common
environment: |
    # Create a list of kernels to build for
    kernels=(
        %kernel_version_current%
        %kernel_version_lts%
    )
setup      : |
    for _kernel in "${kernels[@]}"; do
        # Debian patches require the source in a certain structure. We imitate that structure even though we don't build for i386
        mkdir -p "${_kernel}/amd64" "${_kernel}/i386"
        tar -xf "${sources}/broadcom.tar.gz" --strip-components=0 -C "${_kernel}/amd64"
        tar -xf "${sources}/broadcom.tar.gz" --strip-components=0 -C "${_kernel}/i386"

        pushd "${_kernel}"

        # This is basically a hack so that the Debian patches apply cleanly. This file is not installed
        cp ${sources}/README.txt README.txt

        # Also a hack for compat with 01-shipped-module.patch
        mv amd64/lib/wlc_hybrid.o_shipped amd64/lib/wlc_hybrid.o_amd64

        %apply_patches

        # Might as well delete the i386 directory since we don't need it
        rm -rf i386
        popd
    done
build      : |
    for _kernel in "${kernels[@]}"; do
        pushd "${_kernel}/amd64"
        export CCACHE_BASEDIR="${PWD}"
        %make KBASE="%libdir%/modules/${_kernel}" KERNELRELEASE="${_kernel}"
        popd
    done
install    : |
    %install_file $pkgfiles/modprobe $installdir/usr/lib/modprobe.d/broadcom-wl.conf

    for _kernel in "${kernels[@]}"; do
        pushd "${_kernel}/amd64"
        %install_exe wl.ko -t ${installdir}/%libdir%/modules/${_kernel}/extra/drivers/net/wireless
        popd
    done

    # Let LDM know about our aliases
    %install_file $pkgfiles/broadcom-sta.modaliases $installdir/usr/share/linux-driver-management/modaliases/broadcom-sta.modaliases

    # Set required kernel range in appstream metainfo files
    curmajkernelv=$(echo %kernel_version_current% | cut -d '.' -f 1,2)
    curnextkernelv=$(echo ${curmajkernelv} | awk -F. '{print $1"."$2+1}')
    ltsmajkernelv=$(echo %kernel_version_lts% | cut -d '.' -f 1,2)
    ltsnextkernelv=$(echo ${ltsmajkernelv} | awk -F. '{print $1"."$2+1}')
    sed -i -e "s/9.98/${curmajkernelv}/" -e "s/9.99/${curnextkernelv}/" $pkgfiles/broadcom-sta-current.metainfo.xml
    sed -i -e "s/9.98/${ltsmajkernelv}/" -e "s/9.99/${ltsnextkernelv}/" $pkgfiles/broadcom-sta-lts.metainfo.xml

    # Install appstream data
    %install_file $pkgfiles/broadcom-sta-current.metainfo.xml $installdir/usr/share/metainfo/broadcom-sta-current.metainfo.xml
    %install_file $pkgfiles/broadcom-sta-lts.metainfo.xml $installdir/usr/share/metainfo/broadcom-sta-lts.metainfo.xml
    # Provide modaliases in appstream data
    MODALIAS=$(cat $pkgfiles/broadcom-sta.modaliases | cut -d' ' -f 2)
    echo $MODALIAS | $pkgfiles/modalias-util.py $installdir/usr/share/metainfo/broadcom-sta-current.metainfo.xml
    echo $MODALIAS | $pkgfiles/modalias-util.py $installdir/usr/share/metainfo/broadcom-sta-lts.metainfo.xml

    find "$installdir" -name '*.ko' -exec strip --strip-debug {} \; -exec zstd {} \; -exec rm -v {} \;

    # Usr-merge
    %install_dir $installdir/lib64
    pushd $installdir/usr
    file_list=()
    while IFS=  read -r -d $'\0'; do
        file_list+=("$REPLY")
    done < <(find lib64/modules -type f -print0)
    for file in "${file_list[@]}"; do
        parent=$(dirname "$file")
        %install_dir "$installdir/$parent"
        ln -srv "$installdir/usr/$file" "$installdir/$file"
    done
    popd
patterns   :
    - common : /usr/lib/modprobe.d
    - current :
        - /lib64/modules/*.current
        - /usr/lib64/modules/*.current
        - /usr/share/metainfo/broadcom-sta-current.metainfo.xml
    - modaliases : /usr/share/linux-driver-management/modaliases
permanent  :
    - /lib64/modules
    - /usr/lib64/modules
