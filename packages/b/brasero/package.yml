# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : brasero
version    : 3.12.4
release    : 22
source     :
    - https://download.gnome.org/sources/brasero/3.12/brasero-3.12.4.tar.xz : 3226049ac40969093c5756f9892e76dbda1efeb105cda32f39fd52f6547ed5b3
homepage   : https://gitlab.gnome.org/GNOME/brasero
license    : GPL-2.0-or-later
component  :
    - multimedia.audio
    - libs : programming.library
summary    :
    - A disc burning application from GNOME
    - libs : Libraries for brasero
description: |
    A disc burning application from GNOME
builddeps  :
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gstreamer-video-1.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(ice)
    - pkgconfig(libburn-1)
    - pkgconfig(libcanberra)
    - pkgconfig(libisoburn-1)
    - pkgconfig(libisofs-1)
    - pkgconfig(libnotify)
    - pkgconfig(sm)
    - gtk-doc
    - itstool
rundeps    :
    - cdrdao
    - cdrtools
    - dvd_rw-tools
setup      : |
    %patch -p1 -i $pkgfiles/brasero-vcdimager-version.patch
    %meson_configure -Dgtk-doc=true
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING
patterns   :
    - libs :
        - /usr/lib64/lib*.so.*
        - /usr/lib64/girepository-1.0/*.typelib
