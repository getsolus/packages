# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : burp
version    : 3.3.0
release    : 13
source     :
    - https://github.com/grke/burp/archive/refs/tags/3.3.0.tar.gz : 91fb6840dc98e7cb5d9ce98b82c26de9944a6f04458205559b768945cfa5bdfe
homepage   : https://burp.grke.org/
license    : AGPL-3.0-or-later
component  : system.utils
summary    : Burp is a network backup and restore program
description: |
    Burp is a network backup and restore program.
builddeps  :
    - pkgconfig(check)
    - pkgconfig(libacl)
    - pkgconfig(libxcrypt)
    - pkgconfig(uthash)
    - librsync-devel
setup      : |
    %reconfigure
build      : |
    %make
install    : |
    %make_install
    %install_file ${pkgfiles}/burp.tmpfiles ${installdir}/%libdir%/tmpfiles.d/burp.conf

    # Stateless
    rmdir -v ${installdir}/var/spool/burp \
             ${installdir}/var/spool \
             ${installdir}/var \
             ${installdir}/run
    %install_license LICENSE
