# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : bottom
version    : 0.15.0
release    : 42
source     :
    - https://github.com/ClementTsang/bottom/archive/refs/tags/0.15.0.tar.gz : 9b38fd551ef9e67bb8dc09a658e7c9594913fc5c43154f264d5b776416ad1c4d
    - https://github.com/ClementTsang/bottom/releases/download/0.15.0/completion.tar.gz : a257001464e30b51c426b24f371f94fa6dd7f8b35ad66fa04b7203122bf24cdb
    - https://github.com/ClementTsang/bottom/releases/download/0.15.0/manpage.tar.gz : 25b5df33a5c91ef885c8ea4f1e4890d0e6dcb3240cf36e5de3cc77aedc679159
homepage   : https://clementtsang.github.io/bottom
license    : MIT
component  : system.utils
summary    : Yet another cross-platform graphical process/system monitor.
description: |
    A cross-platform graphical process/system monitor with a customizable interface and a multitude of features. Supports Linux, macOS, and Windows. Inspired by both gtop and gotop.
networking : true
builddeps  :
    - rust
setup      : |
    tar -xf ${sources}/completion.tar.gz .
    tar -xf ${sources}/manpage.tar.gz .

    %cargo_fetch
build      : |
    %cargo_build --bin btm
install    : |
    %cargo_install btm
    %install_license LICENSE

    # Completions
    %install_file btm.bash ${installdir}/usr/share/bash-completion/completions/btm
    %install_file _btm ${installdir}/usr/share/zsh/site-functions/_btm
    %install_file btm.fish ${installdir}/usr/share/fish/vendor_completions.d/btm.fish

    # Manpages
    %install_file btm.1.gz -t ${installdir}/usr/share/man/man1

    # Desktop
    %install_file desktop/bottom.desktop -t ${installdir}/usr/share/applications

    # Icon
    %install_file assets/icons/bottom-system-monitor.svg -t ${installdir}/usr/share/icons/hicolor/scalable/apps
check      : |
    %cargo_test
