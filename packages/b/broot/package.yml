# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : broot
version    : 1.62.0
release    : 40
source     :
    - https://github.com/Canop/broot/archive/refs/tags/v1.62.0.tar.gz : 7c3445a6eef45fe67fe2e1f4e0e1f9dca796237d6303615e31b07798cc1716ba
homepage   : https://dystroy.org/broot/
license    : MIT
component  : system.utils
summary    : A new way to see and navigate directory trees
description: |
    A new way to see and navigate directory trees using cd, tree, and fuzzy search.
networking : true
builddeps  :
    - pkgconfig(libgit2)
    - pkgconfig(xcb)
    - rust
setup      : |
    export LIBGIT2_NO_VENDOR=1
    %cargo_fetch
build      : |
    %cargo_build --features clipboard
install    : |
    %cargo_install
    %install_license LICENSE

    # Install manpage
    sed -i "s/#date//" man/page
    sed -i "s/#version/%version%/" man/page
    %install_file man/page ${installdir}/usr/share/man/man1/broot.1

    # Install font
    %install_file resources/icons/vscode/vscode.ttf ${installdir}/usr/share/fonts/truetype/vscode.ttf
check      : |
    %cargo_test
