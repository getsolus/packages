# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : buildkit
version    : 0.33.1
release    : 16
source     :
    - https://github.com/moby/buildkit/archive/refs/tags/v0.33.1.tar.gz : 044ab46b73e8aac007f504cf4e8c3ee3a2eb05c4c2a65018bd8b6f2c56a17f62
homepage   : https://github.com/moby/buildkit
license    : Apache-2.0
component  : virt
summary    : Container builder toolkit
description: |
    Concurrent, cache-efficient, and Dockerfile-agnostic builder toolkit 
builddeps  :
    - git
    - golang
rundeps    :
    - containerd
networking : true
environment: |
    export GO111MODULE=auto

    export CGO_CPPFLAGS="${CPPFLAGS}"
    export CGO_CFLAGS="${CFLAGS}"
    export CGO_CXXFLAGS="${CXXFLAGS}"
    export CGO_LDFLAGS="${LDFLAGS}"
    export GOFLAGS='-buildmode=pie -trimpath -mod=readonly -modcacherw'
setup      : |
    %patch -p1 -i $pkgfiles/0001-Solus-Use-containerd-and-other-defaults.patch

    go mod vendor
build      : |
    GITCOMMIT="$(git ls-remote https://github.com/moby/buildkit.git refs/tags/v$version | awk '{print $1}')"
    if [[ -z "${GITCOMMIT}" ]]; then
        echo "GITCOMMIT is undefined for some reason"
        exit 1
    fi

    mkdir build-output
    go build -o build-output \
             -ldflags "-linkmode=external \
                       -X github.com/moby/buildkit/version.Version=$version \
                       -X github.com/moby/buildkit/version.Revision=$GITCOMMIT" \
             ./cmd/...
install    : |
    %install_bin build-output/*
    %install_license LICENSE

    # Systemd socket activation
    %install_file -t ${installdir}/usr/lib/systemd/system examples/systemd/system/buildkit.*
    %install_file -t ${installdir}/%libdir%/systemd/system-preset/ ${pkgfiles}/60-buildkit.preset

    # buildkit group (allows users to connect without root)
    %install_file ${pkgfiles}/buildkit.sysusers ${installdir}/usr/lib/sysusers.d/buildkit.conf
