# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : bat
version    : 0.27.0
release    : 35
source     :
    - https://github.com/sharkdp/bat/archive/refs/tags/v0.27.0.tar.gz : e7da57c30a7bf3c731bbc95d0be29ef14bab9e26ef8f0871df8ccaee241678dc
license    :
    - Apache-2.0
    - MIT
homepage   : https://github.com/sharkdp/bat
component  : system.utils
summary    : A cat(1) clone with syntax highlighting and Git integration
description: |
    A cat(1) clone which supports syntax highlighting for a large number of programming and markup languages. bat communicates with git to show modifications with respect to the index. By default, bat pipes its own output to a pager (e.g less) if the output is too large for one screen.
networking : true
clang      : true
builddeps  :
    - rust
checkdeps  :
    - git
setup      : |
    %cargo_fetch
build      : |
    %cargo_build
install    : |
    %cargo_install
    %install_license LICENSE*
    %install_file target/release/build/*/out/assets/manual/bat.1 ${installdir}/usr/share/man/man1/bat.1
    %install_file target/release/build/*/out/assets/completions/bat.fish ${installdir}/usr/share/fish/vendor_completions.d/bat.fish
    %install_file target/release/build/*/out/assets/completions/bat.zsh ${installdir}/usr/share/zsh/site-functions/_bat
    %install_file target/release/build/*/out/assets/completions/bat.bash ${installdir}/usr/share/bash-completion/completions/bat
check      : |
    %cargo_test
