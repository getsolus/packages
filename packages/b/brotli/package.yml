# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : brotli
version    : 1.2.1
release    : 16
source     :
    - https://github.com/google/brotli/archive/refs/tags/v1.2.1.tar.gz : 98d35d11a78dc453aebb7d10c3748f3f73ff78c8267c0dc697b8631f67bf7e8f
homepage   : https://www.brotli.org/
license    : MIT
component  :
    - system.base
    - ^python-brotli : programming.python
emul32     : true
summary    : Brotli compression format
description: |
    Brotli is a generic-purpose lossless compression algorithm that compresses data using a combination of a modern variant of the LZ77 algorithm, Huffman coding and 2nd order context modeling, with a compression ratio comparable to the best currently available general-purpose compression methods. It is similar in speed with deflate but offers more dense compression.
builddeps  :
    - pkgconfig(python3)
    - python-build
    - python-installer
    - python-setuptools
    - python-wheel
rundeps    :
    - ^python-brotli :
        - brotli
clang      : true
optimize   :
    - thin-lto
setup      : |
    %cmake_ninja
build      : |
    %cmake_build

    if [ -z "${EMUL32BUILD+set}" ]; then
        %pyproject_build
    fi
install    : |
    %cmake_install

    if [ -z "${EMUL32BUILD+set}" ]; then
        %install_file -t ${installdir}/usr/share/man/man1 docs/brotli.1
        %pyproject_install
    fi
check      : |
    %cmake_test
patterns   :
    - ^python-brotli : /usr/lib/python*
