# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : bpftrace
version    : 0.27.1
release    : 10
source     :
    - git|https://github.com/bpftrace/bpftrace.git : 24e9fe6 # v0.27.1
homepage   : https://github.com/bpftrace/bpftrace
license    : Apache-2.0
component  : system.utils
summary    : High-level tracing language for Linux eBPF
description: |
    High-level tracing language for Linux eBPF
builddeps  :
    - pkgconfig(libbcc)
    - pkgconfig(libbpf)
    - pkgconfig(libedit)
    - pkgconfig(libpcap)
    - asciidoctor
    - binutils-devel
    - cereal
    - clang-devel
    - linux-tools-bpftool
    - pahole
    - vim # Needs xxd which is part of this package
checkdeps  :
    - pkgconfig(gtest)
clang      : true
optimize   : thin-lto
setup      : |
    %cmake_ninja \
        -DENABLE_SYSTEMD=ON
build      : |
    %cmake_build
install    : |
    %cmake_install
