# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : btrbk
version    : 0.32.7
release    : 10
source     :
    - https://github.com/digint/btrbk/archive/refs/tags/v0.32.7.tar.gz : 95841454f843de6a6e3bb7a3253451d974c1352694284e31f76f9a11eb0932a3
homepage   : https://digint.ch/btrbk/
license    : GPL-3.0-or-later
component  : system.utils
summary    : Tool for creating snapshots and remote backups of btrfs subvolumes
description: |
    btrbk is a backup tool for btrfs subvolumes, taking advantage of btrfs specific capabilities to create atomic snapshots and transfer them incrementally to your backup locations.
builddeps  :
    - asciidoctor
rundeps    :
    - perl
build      : |
    %make
install    : |
    %make_install CONFDIR=/usr/share
    rm -rf $installdir/usr/share/doc

    install -Dm0644 -t $installdir/%libdir%/systemd/system-preset $pkgfiles/60-btrbk.preset
    %install_license COPYING
