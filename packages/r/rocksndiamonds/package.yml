# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : rocksndiamonds
version    : 4.4.2.4
release    : 9
source     :
    - https://www.artsoft.org/RELEASES/linux/rocksndiamonds/rocksndiamonds-4.4.2.4-linux.tar.gz : 59ebdc8985923919a3f3cd7ceb2e9a073ca5b4755ffda0f908f4bf498bc61f99
homepage   : https://www.artsoft.org/rocksndiamonds/
license    : GPL-2.0-or-later
component  : games.puzzle
summary    : Underground digging game
description: |
    Rocks 'n' Diamonds is a action puzzle game similiar to Boulderdash with lots of levels where you have to navigate a maze of dirt, rocks, enemies and quicksand, while collecting gems and making it safely to the exit. Be careful not to get crushed by falling rocks or killed by an enemy.
builddeps  :
    - pkgconfig(SDL2_image)
    - pkgconfig(SDL2_mixer)
    - pkgconfig(SDL2_net)
rundeps    :
    - libmodplug
setup      : |
    # Remove unnecessary patch files.
    rm -rf levels/Tutorials/*/*.orig
build      : |
    %make BASE_PATH=/usr/share/rocksndiamonds
install    : |
    %install_bin rocksndiamonds
    %install_dir ${installdir}/usr/share/doc/rocksndiamonds
    %install_dir ${installdir}/usr/share/rocksndiamonds
    cp -R {graphics,levels,sounds,music} ${installdir}/usr/share/rocksndiamonds
    cp -R docs/elements -t ${installdir}/usr/share/doc/rocksndiamonds
    %install_file ${pkgfiles}/rocksndiamonds.desktop -t ${installdir}/usr/share/applications
    %install_file graphics/gfx_classic/icons/icon.png ${installdir}/usr/share/pixmaps/rocksndiamonds.png
    %install_file ${pkgfiles}/rocksndiamonds.metainfo.xml -t ${installdir}/usr/share/metainfo
    %install_license COPYING
