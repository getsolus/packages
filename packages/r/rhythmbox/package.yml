# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : rhythmbox
version    : 3.5.0
release    : 67
source     :
    - https://download.gnome.org/sources/rhythmbox/3.5/rhythmbox-3.5.0.tar.xz : c0d19933b8e05e96996ddefb8233680c68abfcfae51ce0c4c10b3c4c7a46df2f
homepage   : https://gnome.pages.gitlab.gnome.org/rhythmbox/
license    : GPL-2.0-only
component  : multimedia.audio
summary    : Music playing application
description: |
    Music playing application for GNOME
builddeps  :
    - pkgconfig(avahi-client)
    - pkgconfig(clutter-1.0)
    - pkgconfig(grilo-0.3)
    - pkgconfig(gstreamer-audio-1.0)
    - pkgconfig(gtk+-3.0)
    - pkgconfig(ice)
    - pkgconfig(json-glib-1.0)
    - pkgconfig(libmtp)
    - pkgconfig(libnotify)
    - pkgconfig(libpeas-gtk-1.0)
    - pkgconfig(libsecret-1)
    - pkgconfig(libsoup-3.0)
    - pkgconfig(pygobject-3.0)
    - pkgconfig(python3)
    - pkgconfig(sm)
    - pkgconfig(tdb)
    - pkgconfig(totem-plparser)
    - desktop-file-utils
    - gtk-doc
    - itstool
    - vala
    - yelp-tools
rundeps    :
    - python-gobject
setup      : |
    %meson_configure 
build      : |
    %ninja_build
install    : |
    %ninja_install
    %install_license COPYING
