# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : rustup
version    : 1.29.2
release    : 33
source     :
    - https://github.com/rust-lang/rustup/archive/1.29.2.tar.gz : ba43980f0651730631174635a0e7764831e810be08a06ae53f9c0620caef019d
homepage   : https://rust-lang.github.io/rustup/
license    :
    - Apache-2.0
    - MIT
component  : programming.tools
summary    : The Rust toolchain installer.
description: |
    The Rust toolchain installer.
builddeps  :
    - pkgconfig(libcurl)
    - pkgconfig(liblzma)
    - rust
conflicts  :
    - rust
    - rust-devel
networking : true
environment: |
    # Force use of system libs
    export ZSTD_SYS_USE_PKG_CONFIG=1
setup      : |
    %cargo_fetch
build      : |
    %cargo_build --features no-self-update
install    : |
    %install_exe target/release/rustup-init ${installdir}/usr/bin/rustup

    binlinks=('cargo' 'cargo-clippy' 'cargo-fmt' 'cargo-miri' 'clippy-driver' 'rust-analyzer' 'rustc' 'rustfmt' 'rustdoc' 'rust-gdb' 'rust-lldb')

    for link in "${binlinks[@]}"; do
        ln -srv ${installdir}/usr/bin/rustup ${installdir}/usr/bin/$link
    done

    # Generate completion files
    %install_dir ${installdir}/usr/share/bash-completion/completions
    ${installdir}/usr/bin/rustup completions bash > ${installdir}/usr/share/bash-completion/completions/rustup
    ${installdir}/usr/bin/rustup completions bash cargo > ${installdir}/usr/share/bash-completion/completions/cargo
    
    %install_dir ${installdir}/usr/share/fish/vendor_completions.d
    ${installdir}/usr/bin/rustup completions fish > ${installdir}/usr/share/fish/vendor_completions.d/rustup.fish
    
    %install_dir ${installdir}/usr/share/zsh/site-functions
    ${installdir}/usr/bin/rustup completions zsh > ${installdir}/usr/share/zsh/site-functions/_rustup
    ${installdir}/usr/bin/rustup completions zsh cargo > ${installdir}/usr/share/zsh/site-functions/_cargo

    %install_license LICENSE-*
