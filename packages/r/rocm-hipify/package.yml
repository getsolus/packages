# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : rocm-hipify
version    : '7.14'
release    : 8
source     :
    # tag: rocm-7.0.2
    - https://github.com/ROCm/HIPIFY/archive/refs/tags/therock-7.14.tar.gz : 
        3120249147bed499ddb6fbf8322698df574d7523f188fb02a032e2b940492af6
homepage   : https://github.com/ROCm-Developer-Tools/HIPIFY
license    : MIT
component  : programming.tools
summary    : Convert CUDA to Portable C++ Code
description: |
    Tools to translate CUDA source code into portable HIP C++ automatically.
clang      : true
builddeps  :
    - rocm-cmake
    - rocm-llvm
environment: |
    export ROCM_PATH=/usr
    export CMAKE_PREFIX_PATH=/usr/lib64/llvm-rocm
setup      : |
    %cmake_ninja -L
build      : |
    %ninja_build
install    : |
    %ninja_install 
    # For some reason...
    chmod +x $installdir/usr/bin/hipify-perl
patterns   : /*
