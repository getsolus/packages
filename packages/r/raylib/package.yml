# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : raylib
version    : '6.2'
release    : 13
source     :
    - https://github.com/raysan5/raylib/archive/refs/tags/6.2.tar.gz : df7a13129b1bec9e73a6962efff170beba310ee6eab8f94cd000b7316b4db5ee
homepage   : https://www.raylib.com/
license    : zlib-acknowledgement
component  : programming.library
summary    : A simple and easy-to-use library to enjoy videogames programming
description: |
    raylib is highly inspired by Borland BGI graphics lib and by XNA framework and it's specially well suited for prototyping, tooling, graphical applications, embedded systems and education.
builddeps  :
    - pkgconfig(gl)
    - pkgconfig(glfw3)
setup      : |
    %cmake_ninja \
        -DCUSTOMIZE_BUILD=ON \
        -DWITH_PIC=ON \
        -DBUILD_SHARED_LIBS=ON \
        -DUSE_EXTERNAL_GLFW=ON \
        -DINCLUDE_EVERYTHING=ON
build      : |
    %cmake_build
install    : |
    %cmake_install
    %install_license LICENSE
