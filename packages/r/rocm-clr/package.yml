# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : rocm-clr
version    : '7.14'
release    : 12
source     :
    - https://github.com/ROCm/rocm-systems/archive/refs/tags/therock-7.14.tar.gz : 8cadf0d5c0f53f334b7b940a78619d1746c913b26ae719e2a09e20a6f7128330
    - https://github.com/ROCm/llvm-project/archive/refs/tags/therock-7.14.tar.gz#HIPCC-7.14.tar.gz : db365c1f0ab500eeee04a990d29d79a6bb667874f8069f7b69920ca62c352d2f
homepage   : https://github.com/ROCm/clr
license    : MIT
component  : programming.library
summary    : AMD Common Language Runtime for HIP and OpenCL
description: |
    AMD Common Language Runtime contains source code for AMD's HIP and OpenCL compute languages runtimes.
builddeps  :
    - pkgconfig(OpenCL)
    # - pkgconfig(d3d)
    - pkgconfig(gl)
    - pkgconfig(numa)
    - pkgconfig(x11-xcb)
    - python-cppheaderparser
    - rocm-cmake
    - rocm-compilersupport-devel
    - rocm-core-devel
    - rocm-device-libs-devel
    - rocm-llvm
    - rocm-runtime-devel
    - rocprofiler-register-devel
rundeps    :
    - ^rocm-hip:
      - rocm-clr
      - rocm-device-libs-devel
      - rocm-compilersupport-devel
      - rocm-info
      - rocm-runtime-devel
      - rocm-smi-devel
    - ^rocm-opencl:
      - rocm-clr
patterns   :
    - ^rocm-hip:
      - /usr/bin/hip*
      - /usr/bin/roc-*
      - /usr/bin/hrr-*
      - /usr/include/hip*
      - /usr/lib64/cmake/hip*
      - /usr/lib64/libamdhip64.so
      - /usr/lib64/libhiprtc.so
      - /usr/lib64/libhiprtc-builtins.so
    - ^rocm-opencl:
      - /usr/bin/rocm-clinfo
      - /usr/include/rocm-opencl
      - /usr/lib64/libamdocl64.so
      - /usr/lib64/libcltrace.so
      - /usr/share/OpenCL
replaces   :
    - ^rocm-hip:
      - rocm-hip-devel
    - ^rocm-opencl:
      - rocm-opencl-devel
environment: |
    export ROCM_PATH=/usr
    export CMAKE_PREFIX_PATH=/usr/lib64/llvm-rocm
    export HIP_DEVICE_LIB_PATH=/usr/lib64/amdgcn/bitcode
    export HIP_CLANG_PATH=/usr/lib64/llvm-rocm/bin
    export HIP_PLATFORM=amd
    export ROCM_LIBPATCH_VERSION=0

    export HIP_DIR=$workdir/projects/hip
    export ROCTRACER_DIR=$workdir/projects/roctracer
    export HIPCC_DIR=$workdir/HIPCC

    export GCC_IGNORE_WERROR=1
setup      : |
    pushd $sources
        mkdir -p $HIPCC_DIR
        tar --strip-components=3 -C $HIPCC_DIR -xf $sources/HIPCC-%version%.tar.gz llvm-project-therock-%version%/amd/hipcc
    popd

    pushd $HIPCC_DIR
        %cmake_ninja -DHIPCC_BACKWARD_COMPATIBILITY=OFF
        %ninja_build
    popd

    pushd projects/clr/opencl
        # cltrace still needs soname manually (upstream does not set VERSION/SOVERSION)
        echo "set_target_properties(cltrace PROPERTIES VERSION %version% SOVERSION $(v=%version%;echo ${v%%.*}))" \
            >> tools/cltrace/CMakeLists.txt

        # Don't install in /usr/lib64/opencl, just install in /usr/lib64
        sed -i 's|AMDOCL_INSTALL_LIBDIR ${PROJECT_NAME}|AMDOCL_INSTALL_LIBDIR ""|' CMakeLists.txt
    popd

    %apply_patches

    %cmake_ninja -S projects/clr -L \
      -DROCM_PATH=$ROCM_PATH \
      -DHIP_COMMON_DIR=$HIP_DIR \
      -DHIPCC_BIN_DIR=$HIPCC_DIR/solusBuildDir \
      -DCLR_BUILD_HIP=ON \
      -DCLR_BUILD_OCL=ON \
      -DBUILD_ICD=OFF \
      -DPROF_API_HEADER_PATH=$ROCTRACER_DIR/inc/ext \
      -DHIP_ENABLE_ROCPROFILER_REGISTER=ON \
      -DTHEROCK_FLAG_STAMP_LIBRARY_GIT_VERSIONS=OFF \
      -DBUILD_TESTS=OFF
build      : |
    %ninja_build
install    : |
    %ninja_install

    install -Dm00644 $workdir/projects/clr/opencl/packaging/amdocl64.icd \
        $installdir/usr/share/OpenCL/vendors/amdocl64.icd

    # Upstream installs ICD + ld.so.conf to /etc/; not wanted on Solus
    rm -rf $installdir/usr/etc

    # Avoid file conflicts with opencl-headers package:
    install -dm00644 $installdir/usr/include/rocm-opencl
    mv $installdir/usr/include/CL $installdir/usr/include/rocm-opencl/CL

    # Avoid file conflicts with clinfo package:
    mv $installdir/usr/bin/clinfo $installdir/usr/bin/rocm-clinfo

    # Don't install OpenCL docs
    rm -rf $installdir/usr/share/doc/opencl*
