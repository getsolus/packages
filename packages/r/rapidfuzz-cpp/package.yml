# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : rapidfuzz-cpp
version    : 3.3.3
release    : 4
source     :
    - https://github.com/maxbachmann/rapidfuzz-cpp/archive/refs/tags/v3.3.3.tar.gz : fa0fbd40110df8134cf05bddbaa4e237dbc4fd915ab9a3029ff481a8d3e8b757
homepage   : https://github.com/maxbachmann/rapidfuzz-cpp
license    : MIT
component  : programming.devel
