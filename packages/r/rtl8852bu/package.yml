# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : rtl8852bu
version    : 1.19.3
release    : 92
source     :
    - git|https://github.com/morrownr/rtl8852bu-20250826.git : 606ad3ef2d1b6498fb161ad251781e008f7d6a6d
homepage   : https://github.com/morrownr/rtl8852bu-20250826
license    : GPL-2.0-only
component  :
    - kernel.drivers
    - common : kernel.drivers
    - current : kernel.drivers
    - modaliases : kernel.drivers
summary    :
    - Realtek RTL8832BU/RTL8852BU Driver
    - common : Common components for rtl8852bu drivers
    - current : rtl8852bu for linux-current kernel
    - modaliases : These files are used by the Software Center for hardware detection.
description: |
    Linux Driver for USB WiFi Adapters that are based on the RTL8832BU and RTL8852BU Chipsets
builddeps  :
    - linux-current
    - linux-current-headers
    - linux-lts
    - linux-lts-headers
rundeps    :
    - current :
        - rtl8852bu-common
    - rtl8852bu-common
environment: |
    kernels=(
        %kernel_version_current%
        %kernel_version_lts%
    )
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-linux-Fix-compilation-with-Linux-7.2.patch

    pushd ..
    for _kernel in "${kernels[@]}"; do
        cp -a rtl8852bu-20250826.git "${_kernel}"
    done
build      : |
    for _kernel in "${kernels[@]}"; do
        pushd "../${_kernel}"
        %make \
            KVER="${_kernel}" \
            KSRC="/usr/lib64/modules/${_kernel}/build"

        # Build modaliases for LDM
        mkmodaliases "${package}" -o "${package}.modaliases" 8852bu.ko
        popd
    done

install    : |
    %install_license LICENSE
    %install_file 8852bu.conf ${installdir}/usr/lib/modprobe.d/8852bu.conf

    for _kernel in "${kernels[@]}"; do
        pushd "../${_kernel}"
        %install_exe 8852bu.ko -t "${installdir}/%libdir%/modules/${_kernel}/extra/drivers/net/wireless/rtl8852bu"

        # Install modaliases for hardware detection
        %install_file ${package}.modaliases -t ${installdir}/usr/share/linux-driver-management/modaliases
        popd
    done


    find "$installdir" -name '*.ko' -exec strip --strip-debug {} \; -exec zstd {} \; -exec rm -v {} \;

    # Usr-merge
    %install_dir $installdir/lib64
    pushd $installdir/usr
    file_list=()
    while IFS=  read -r -d $'\0'; do
        file_list+=("$REPLY")
    done < <(find lib64/modules -type f -print0)
    for file in "${file_list[@]}"; do
        parent=$(dirname "$file")
        %install_dir "$installdir/$parent"
        ln -srv "$installdir/usr/$file" "$installdir/$file"
    done
    popd
patterns   :
    - common :
        - /usr/lib/modprobe.d
        - /usr/share/licenses/rtl8850bu
    - current :
        - /lib64/modules/*.current
        - /usr/lib64/modules/*.current
    - modaliases : /usr/share/linux-driver-management/modaliases
permanent  :
    - /lib64/modules
    - /usr/lib64/modules
