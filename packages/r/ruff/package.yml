# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : ruff
version    : 0.17.4
release    : 2
source     :
    - https://github.com/astral-sh/ruff/releases/download/0.17.4/source.tar.gz : f8dcb8612f1ce95bc0ce806752c11a675688f299fa940445ba3edbe7cb2fff83
homepage   : https://docs.astral.sh/ruff
license    : MIT
component  :
    - ^python-ruff : programming.python
    - programming.python
summary    :
    - ^python-ruff : Python module for ruff
    - An extremely fast Python linter and code formatter
description: |
    Ruff aims to be orders of magnitude faster than alternative tools while integrating more functionality behind a single, common interface.
networking : true
builddeps  :
    - python-build
    - python-installer
    - python-maturin
    - python-wheel
rundeps    :
    - ^python-ruff :
        - ruff
environment: |
    # Set these manually because we don't have a macro for this.
    # Usually, our Cargo build macro sets these options, but we're
    # not using that in this package.
    CARGO_BUILD_DEP_INFO_BASEDIR="${workdir}"; export CARGO_BUILD_DEP_INFO_BASEDIR;
    CARGO_NET_RETRY=5; export CARGO_NET_RETRY;
    CARGO_PROFILE_RELEASE_DEBUG="full"; export CARGO_PROFILE_RELEASE_DEBUG;
    CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO="off"; export CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO;
    CARGO_PROFILE_RELEASE_LTO="off"; export CARGO_PROFILE_RELEASE_LTO;
    CARGO_PROFILE_RELEASE_STRIP="none"; export CARGO_PROFILE_RELEASE_STRIP;
setup      : |
    %cargo_fetch
build      : |
    %pyproject_build

    for completion in bash fish nushell zsh; do
        target/release/ruff generate-shell-completion "${completion}" > "${package}-${completion}"
    done
install    : |
    %pyproject_install
    %install_license LICENSE

    %install_file ${package}-bash ${installdir}/usr/share/bash/bash-completion/completions/${package}
    %install_file ${package}-fish ${installdir}/usr/share/fish/vendor_completions.d/${package}.fish
    %install_file ${package}-nushell ${installdir}/usr/share/nushell/vendor/autoload/${package}.nu
    %install_file ${package}-zsh ${installdir}/usr/share/zsh/site-functions/_${package}
check      : |
    _skip=(
        # These don't give the expected output, possibly because of solbuild.
        --skip unreadable_dir
        --skip unreadable_files
        --skip unreadable_pyproject_toml
        --skip initialize
    )

    %cargo_test -- "${_skip[@]}"
patterns   :
    - ^python-ruff :
        - /usr/lib/python3.*/site-packages
