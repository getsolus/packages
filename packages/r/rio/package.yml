# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : rio
version    : 0.5.27
release    : 14
source     :
    - https://github.com/raphamorim/rio/archive/refs/tags/v0.5.27.tar.gz : 860cb019a4f6a87bffb786ac2408f51f7c7f09551be234355fb3fd4feeac5331
homepage   : https://rioterm.com
license    : MIT
component  : system.utils
summary    : A hardware-accelerated GPU terminal emulator powered by WebGPU
description: |
    Rio is a hardware-accelerated GPU terminal emulator powered by WebGPU, focusing on running in desktops and browsers. It aims to provide a beautiful and fast terminal experience with features like tabs, split panes, and extensive theming options.
networking : true
builddeps  :
    - pkgconfig(alsa)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(oniguruma)
    - pkgconfig(scdoc)
    - pkgconfig(xcb)
    - pkgconfig(xkbcommon)
    - glslang
    - rust
rundeps    :
    - oniguruma
environment: |
    export RUSTONIG_DYNAMIC_LIBONIG=1
setup      : |
    %patch -p1 -i ${pkgfiles}/0001-Default-config-editor-to-nano.patch

    # Generate man pages
    for fname in rio.1 rio.5 rio-bindings.5; do
        scdoc < extra/man/${fname}.scd > extra/man/${fname}
    done

    %cargo_fetch
build      : |
    %cargo_build --all-features
install    : |
    %cargo_install
    %install_license LICENSE

    # Install man pages
    for fname in rio.1 rio.5 rio-bindings.5; do
        %install_file extra/man/${fname} ${installdir}/usr/share/man/man${fname##*.}/${fname}
    done

    # Install desktop file, icon and metainfo
    %install_file misc/rio.desktop ${installdir}/usr/share/applications/com.rioterm.Rio.desktop
    %install_file misc/logo.svg ${installdir}/usr/share/icons/hicolor/scalable/apps/rio.svg
    %install_file misc/com.rioterm.Rio.metainfo.xml -t ${installdir}/usr/share/metainfo/
check      : |
    %cargo_test
