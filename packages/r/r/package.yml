# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : r
version    : 4.6.1
release    : 60
source     :
    - https://cran.r-project.org/src/base/R-4/R-4.6.1.tar.gz : 4da6e61d2c0aac5f14a2e7e432cb5fcc269efe83da4293050ba7f03dff4e2cf4
homepage   : https://www.r-project.org/
license    : GPL-2.0-or-later
component  : programming
summary    : R is a system for statistical computation and graphics.
description: |
    R is a system for statistical computation and graphics.
optimize   :
    - speed
    - lto
builddeps  :
    - pkgconfig(bzip2)
    - pkgconfig(icu-io)
    - pkgconfig(lapack)
    - pkgconfig(libcurl)
    - pkgconfig(liblzma)
    - pkgconfig(libpcre2-posix)
    - pkgconfig(libpng)
    - pkgconfig(libtiff-4)
    - pkgconfig(libturbojpeg)
    - pkgconfig(mimalloc)
    - pkgconfig(pangocairo)
    - pkgconfig(tk)
    - pkgconfig(xmu)
    - pkgconfig(xscrnsaver)
    - gfortran
    - libiconv-devel
    - llvm-bolt
    - openblas-devel
    - xdg-utils
environment: |
    unset LD_AS_NEEDED
setup      : |
    # Patch just the needed files with flags appropriate for bolt
    # to avoid bloating package size with needless text relocations
    %patch -p0 -i $pkgfiles/bolt.patch

    %patch -p0 -i $pkgfiles/mimalloc.patch
    # Always fails and --keep-going isn't respected
    %patch -p0 -i $pkgfiles/disable-reg-packages-test.patch

    %configure \
        --enable-R-shlib \
        --with-blas="-lopenblas" \
        --with-lapack \
        --with-tcltk \
        rdocdir=/usr/share/doc/R \
        rincludedir=/usr/include/R \
        rsharedir=/usr/share/R
build      : |
    %make
profile    : |
    %make check --keep-going || :
install    : |
    %make_install

    # R records the configure-time CFLAGS/FFLAGS/LDFLAGS verbatim into the
    # installed config, so ypkg's build-only flags (PGO profile dir and
    # incremental-LTO cache, both under /home/build/...) leak into every
    # downstream `R CMD SHLIB` / `R CMD INSTALL` / `R CMD config`.
    # Strip just those from the installed defaults, keeping the rest of the
    # optimization + hardening flags.  They are recorded in three places:
    #   etc/Makeconf      -> defaults for R CMD SHLIB/INSTALL/config
    #   bin/libtool       -> LTCFLAGS used to link package shared objects
    #   pkgconfig/libR.pc -> Libs: for pkg-config consumers
    sed -E -i \
        -e 's@ -flto-incremental=[^ ]+@@g' \
        -e 's@ -flto=[^ ]+@@g' \
        -e 's@ -fprofile-[^ ]+@@g' \
        $installdir/usr/lib64/R/etc/Makeconf \
        $installdir/usr/lib64/R/bin/libtool \
        $installdir/usr/lib64/pkgconfig/libR.pc

    %bolt_instr ./lib/libR.so
    %make check --keep-going || :
    %bolt_merge ./lib/libR.so
    %bolt_opt ./lib/libR.so -merge-text-sections
    install -Dm00644 ./lib/libR.so $installdir/usr/lib64/R/lib/libR.so

    %install_license COPYING
patterns   :
    - /usr/include/R
    - /usr/lib64/pkgconfig
