# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : rocm-compilersupport
version    : '7.14'
release    : 10
source     :
    - https://github.com/ROCm/llvm-project/archive/refs/tags/therock-7.14.tar.gz : db365c1f0ab500eeee04a990d29d79a6bb667874f8069f7b69920ca62c352d2f
homepage   : https://github.com/ROCm/ROCm-CompilerSupport
license    : NCSA
component  : programming.devel
summary    : The AMD Code Object Manager (Comgr)
description: |
    The AMD Code Object Manager (Comgr) is a shared library which provides operations for creating and inspecting code objects.
builddeps  :
    - pkgconfig(gtest)
    - rocm-cmake
    - rocm-device-libs-devel
    - rocm-llvm
environment: |
    export ROCM_PATH=/usr
    export CMAKE_PREFIX_PATH=/usr/lib64/llvm-rocm
    export HIP_DEVICE_LIB_PATH=/usr/lib64/amdgcn/bitcode
setup      : |
    %apply_patches

    %cmake_ninja -S amd/comgr -L \
      -DCOMGR_DISABLE_SPIRV=ON \
      -DBUILD_TESTING=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
# One test fails but ROCm still works...?
check      : |
    ctest --test-dir solusBuildDir --output-on-failure
