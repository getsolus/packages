# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : rocm-core
# Note: upstream publicly advertises 7.14, but many downstream consumers of
# rocm-core assumes a patch version exist, so we add a .0 here.
version    : 7.14.0
release    : 9
source     :
    - https://github.com/ROCm/rocm-systems/archive/refs/tags/therock-7.14.tar.gz : 8cadf0d5c0f53f334b7b940a78619d1746c913b26ae719e2a09e20a6f7128330
homepage   : https://github.com/RadeonOpenCompute/rocm-core
license    : MIT
component  : programming.library
summary    : A utility which can be used to get ROCm release version
description: |
    rocm-core is a utility which can be used to get ROCm release version. It also provides the Lmod modules files for the ROCm release. The getROCmVersion function provides the ROCm version. 
setup      : |
    %cmake_ninja -S projects/rocm-core -DROCM_VERSION=%version% -DDISABLE_CPACK=ON
build      : |
    %ninja_build
install    : |
    %ninja_install
    # For compatibility
    ln -s rocm-core/rocm_version.h $installdir/usr/include/rocm_version.h

    %install_license projects/rocm-core/LICENSE.md
