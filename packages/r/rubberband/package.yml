# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : rubberband
version    : 4.0.0
release    : 8
source     :
    - https://github.com/breakfastquay/rubberband/archive/refs/tags/v4.0.0.tar.gz : 24300f48a8014b7c863b573a9647e61b1b19b37875e2cdd92005e64c6424d266
license    : GPL-2.0-or-later
component  : programming.library
homepage   : https://breakfastquay.com/rubberband/
summary    : A high quality software library for audio time-stretching and pitch-shifting.
description: |
    A high quality software library for audio time-stretching and pitch-shifting.
builddeps  :
    - pkgconfig(fftw3)
    - pkgconfig(samplerate)
    - pkgconfig(sndfile)
    - pkgconfig(vamp)
    - ladspa-devel
setup      : |
    %meson_configure \
        -Dfft=fftw \
        -Dresampler=libsamplerate \
        --buildtype=release
build      : |
    %ninja_build
install    : |
    %ninja_install
    rm $installdir/usr/lib64/librubberband.a
