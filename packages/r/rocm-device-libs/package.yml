# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : rocm-device-libs
version    : '7.14'
release    : 10
source     :
    - https://github.com/ROCm/llvm-project/archive/refs/tags/therock-7.14.tar.gz : db365c1f0ab500eeee04a990d29d79a6bb667874f8069f7b69920ca62c352d2f
homepage   : https://github.com/RadeonOpenCompute/ROCm-Device-Libs
license    : NCSA
component  : xorg.driver
summary    : ROCm Device Libraries
description: |
    This package contains a set of AMD specific device-side language runtime libraries in the form of bit code. Specifically:
builddeps  :
    - rocm-cmake
    - rocm-llvm
environment: |
    export CMAKE_PREFIX_PATH=/usr/lib64/llvm-rocm
setup      : |
    %apply_patches
    %cmake_ninja -S amd/device-libs
build      : |
    %ninja_build
install    : |
    %ninja_install
