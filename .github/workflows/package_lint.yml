---
name: Package Lint
on:
  pull_request:
    paths:
      - packages/**
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  Checks:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - run: |
        sudo apt-get -qqy update
        sudo apt-get -qqy install python3-ruamel.yaml
    - run: |
        common/CI/package_checks.py --base=origin/${{ github.event.pull_request.base.ref }}
    - run: |
        common/Scripts/publish_series.py --dry-run --skip-push --base=origin/${{ github.event.pull_request.base.ref }}
